name: "LG Velvet G900EMW • Android 16 QPR2 • Kernel + Vendor • CIP135 FIX v9"

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Build kernel"
        required: true
        default: true
        type: boolean
      build_vendor:
        description: "Build vendor.img"
        required: true
        default: true
        type: boolean
  push:
    branches: ["sixteen"]
    paths:
      - ".github/workflows/**"
      - "arch/arm64/configs/vendor/caymanlm_defconfig"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "sound/**"
      - "techpack/**"
      - "Makefile"
      - "localversion-*"

permissions:
  contents: read

env:
  DEVICE: G900EMW
  CODENAME: caymanlm
  KERNEL_BRANCH: sixteen
  DEFCONFIG: vendor/caymanlm_defconfig
  KERNEL_EXPECTED: "4.19.325"
  CIP_TAG: "v4.19.325-cip135"
  LINEAGE_BRANCH: lineage-23.2
  DEVICE_REF: lineage-22.2
  VENDOR_REF: lineage-22.2
  COMMON_DEVICE_REF: lineage-23.2
  COMMON_VENDOR_REF: lineage-23.2
  SUKISU_REF: "4.1.3"
  SUSFS_REF: "001e69919c6271f690fd00b17e4c721c9e599152"
  SUSFS_BRANCH: kernel-4.19
  ANYKERNEL3_REF: dca9dc370838d919d56c1f59ec78b27a14a72c68
  ANDROID_MANIFEST: https://github.com/LineageOS/android.git
  DEVICE_REPO: https://github.com/lge-qcom-dev/android_device_lge_caymanlm.git
  COMMON_DEVICE_REPO: https://github.com/Sparxikle/android_device_lge_sm7250-common.git
  VENDOR_REPO: https://github.com/lge-qcom-dev/proprietary_vendor_lge_caymanlm.git
  COMMON_VENDOR_REPO: https://github.com/Sparxikle/proprietary_vendor_lge_sm7250-common.git

jobs:
  kernel:
    if: ${{ github.event_name == 'push' || inputs.build_kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "K01 • Checkout exact kernel source"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 0

      - name: "K02 • Install kernel dependencies"
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential ccache clang lld llvm \
            libssl-dev libelf-dev libdw-dev dwarves \
            python3 python3-pip rsync patch git curl wget unzip zip xz-utils \
            device-tree-compiler cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gawk file

      - name: "K03 • Create numbered diagnostics workspace"
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics/kernel
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "device=${DEVICE}"
            echo "codename=${CODENAME}"
            echo "branch=${KERNEL_BRANCH}"
            echo "commit=$(git rev-parse HEAD)"
            echo "kernel_expected=${KERNEL_EXPECTED}-cip135"
            echo "target=Android 16 QPR2 GSI"
            echo "features=SukiSU-Ultra+KPM+SUSFS+WALT+SchedTune+ZRAM+LTO"
            echo "hardware=Fingerprint+Vibration+DualSIM+Audio+VoWiFi"
          } | tee ci-diagnostics/kernel/00-context.txt
          git status --short | tee ci-diagnostics/kernel/00-git-status-before.txt
          git log -1 --decorate --oneline | tee ci-diagnostics/kernel/00-source.txt

      - name: "K04 • Pin and verify LLVM toolchain"
        shell: bash
        run: |
          set -euxo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang"
          rm -rf "$CLANG_DIR"
          mkdir -p "$CLANG_DIR"
          command -v clang | tee ci-diagnostics/kernel/01-clang-path.txt
          clang --version | tee ci-diagnostics/kernel/01-clang-version.txt
          ld.lld --version | tee ci-diagnostics/kernel/01-lld-version.txt
          aarch64-linux-gnu-as --version | head -n 1 | tee ci-diagnostics/kernel/01-as-version.txt
          test -x "$(command -v clang)"
          test -x "$(command -v ld.lld)"

      - name: "K05 • Baseline defconfig — diagnose before modifications"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p kernel/out
          DEF="arch/arm64/configs/${DEFCONFIG}"
          test -s "$DEF"
          sha256sum "$DEF" | tee ci-diagnostics/kernel/02-defconfig.sha256
          make O=kernel/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG" 2>&1 | tee ci-diagnostics/kernel/03-defconfig.log
          rc=${PIPESTATUS[0]}
          cp kernel/out/.config ci-diagnostics/kernel/working-baseline.config 2>/dev/null || true
          exit "$rc"

      - name: "K06 • Integrate official CIP135 — deterministic 3-way merge, no silent skips"
        shell: bash
        run: |
          set -u
          mkdir -p ci-diagnostics/kernel
          exec > >(tee ci-diagnostics/kernel/04-cip-integration.log) 2>&1
          cd "$GITHUB_WORKSPACE"

          # CIP135 is an upstream Linux 4.19.325-based release. Do not reconstruct
          # it by copying a second source tree file-by-file: that creates false
          # conflicts and can silently omit files. Instead, merge the real tag
          # into the LG git history and resolve overlapping hunks in favor of
          # the LG device tree while taking every non-conflicting CIP change.
          git config user.name "CI CIP integrator"
          git config user.email "ci@example.invalid"
          git remote add cip-upstream https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          git fetch --filter=blob:none --no-tags cip-upstream "refs/tags/${CIP_TAG}"

          CIP_SHA="$(git rev-parse "FETCH_HEAD")"
          echo "cip_tag=${CIP_TAG}" | tee ci-diagnostics/kernel/04-cip-resolved.txt
          echo "cip_commit=${CIP_SHA}" | tee -a ci-diagnostics/kernel/04-cip-resolved.txt

          # A real merge must have a shared Linux history. Refuse an unrelated
          # history rather than inventing a synthetic merge that could replace
          # device code incorrectly.
          if ! BASE_SHA="$(git merge-base HEAD "$CIP_SHA")"; then
            echo "::error::LG source and CIP135 do not share a Git ancestry; refusing an unrelated-history merge."
            echo "No merge-base found." | tee ci-diagnostics/kernel/04-cip-merge-base.txt
            exit 1
          fi
          echo "merge_base=${BASE_SHA}" | tee ci-diagnostics/kernel/04-cip-merge-base.txt

          # Save a pre-merge snapshot for diagnostics.
          git rev-parse HEAD > ci-diagnostics/kernel/04-lg-before-merge.txt
          git diff --binary > ci-diagnostics/kernel/04-local-diff-before-cip.patch || true

          : > ci-diagnostics/kernel/05-cip-conflicts-before-resolution.txt
          : > ci-diagnostics/kernel/05-cip-unmerged-after-resolution.txt

          # Merge CIP. -X ours is intentionally explicit: when an upstream
          # hunk collides with an LG-specific implementation, the LG implementation
          # wins; non-conflicting CIP hunks are still merged normally.
          set +e
          git merge --no-commit --no-ff -X ours "$CIP_SHA" 2>&1 | tee ci-diagnostics/kernel/05-cip-merge.log
          merge_rc=${PIPESTATUS[0]}
          set -e

          git status --short > ci-diagnostics/kernel/05-cip-status-after-merge.txt || true
          git diff --name-only --diff-filter=U > ci-diagnostics/kernel/05-cip-conflicts-before-resolution.txt || true

          # -X ours should leave no unmerged index entries. If Git still has
          # an unresolved conflict, stop and upload the exact files instead
          # of skipping or deleting them.
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U | tee ci-diagnostics/kernel/05-cip-unmerged-after-resolution.txt
            echo "::error::CIP135 merge still has unresolved files. Nothing was skipped."
            git merge --abort || true
            exit 1
          fi

          # Record what actually changed. We do not silently delete CIP files.
          git diff --stat HEAD "$CIP_SHA" > ci-diagnostics/kernel/05-cip-diff-stat.txt || true
          git diff --name-status HEAD > ci-diagnostics/kernel/05-cip-name-status.txt || true

          # If merge produced a commit, keep it. If it fast-forwarded, HEAD is
          # already at CIP. In either case, the worktree is now the merged source.
          if [ "$merge_rc" -ne 0 ]; then
            # A merge can return non-zero for conflicts that -X ours resolves.
            # The index check above is authoritative.
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::CIP integration failed with unresolved state."
              git merge --abort || true
              exit "$merge_rc"
            fi
          fi

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "CI: merge Linux ${CIP_TAG} into LG Velvet kernel" \
              2>&1 | tee ci-diagnostics/kernel/05-cip-merge-commit.log
          fi

          echo "CIP integration completed without unresolved files." | tee ci-diagnostics/kernel/05-cip-merge-status.txt
          git diff --check
          test -f localversion-cip
          grep -q -- '-cip135' localversion-cip
          cat localversion-cip | tee ci-diagnostics/kernel/05-localversion-cip.txt
      - name: "K07 • Integrate pinned SukiSU-Ultra 4.1.3 builtin"
        shell: bash
        run: |
          set -o pipefail
          curl -LSs --fail --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SUKISU_REF}/kernel/setup.sh" \
            -o ci-diagnostics/kernel/06-sukisu-setup.sh
          chmod +x ci-diagnostics/kernel/06-sukisu-setup.sh
          sha256sum ci-diagnostics/kernel/06-sukisu-setup.sh | tee ci-diagnostics/kernel/06-sukisu-setup.sha256
          bash ci-diagnostics/kernel/06-sukisu-setup.sh builtin 2>&1 | tee ci-diagnostics/kernel/06-sukisu.log

      - name: "K08 • Apply SUSFS 1.5.5 kernel-4.19 patch and resolve only real rejects"
        shell: bash
        run: |
          set -u
          work="$RUNNER_TEMP/susfs"
          rm -rf "$work"
          git clone --depth=1 --branch "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git "$work" \
            2>&1 | tee ci-diagnostics/kernel/07-susfs-clone.log
          git -C "$work" fetch --depth=1 origin "$SUSFS_REF"
          git -C "$work" checkout --detach "$SUSFS_REF"
          cp "$work/kernel_patches/50_add_susfs_in_kernel-4.19.patch" ci-diagnostics/kernel/07-susfs.patch
          rsync -a "$work/kernel_patches/fs/" fs/
          rsync -a "$work/kernel_patches/include/linux/" include/linux/
          set +e
          patch -p1 --forward --batch --fuzz=0 < ci-diagnostics/kernel/07-susfs.patch 2>&1 | tee ci-diagnostics/kernel/07-susfs-patch.log
          rc=${PIPESTATUS[0]}
          set -e
          find . -type f -name '*.orig' -delete
          find . -type f -name '*.rej' -print | tee ci-diagnostics/kernel/07-susfs-rejects.txt
          if [ -s ci-diagnostics/kernel/07-susfs-rejects.txt ]; then
            echo "::error::SUSFS produced unresolved rejects; nothing was discarded."
            exit 1
          fi
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --include='*.c' --include='*.h' --include='Kconfig*' . > ci-diagnostics/kernel/07-susfs-conflicts.txt; then
            echo "::error::SUSFS left conflict markers."
            exit 1
          fi
          exit "$rc"

      - name: "K09 • Apply finalized feature set and verify every required symbol"
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$PWD/kernel/out"
          test -f "$OUT/.config"
          scripts/config --file "$OUT/.config" \
            -e CONFIG_KSU \
            -e CONFIG_KPM \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_SCHED_WALT \
            -e CONFIG_SCHED_TUNE \
            -e CONFIG_CPU_FREQ_GOV_SCHEDUTIL \
            -e CONFIG_ZRAM \
            -e CONFIG_ZSMALLOC \
            -e CONFIG_LTO_CLANG \
            -e CONFIG_LTO_CLANG_THIN \
            -e CONFIG_RANDOMIZE_BASE \
            -e CONFIG_STACKPROTECTOR_STRONG \
            -e CONFIG_HARDENED_USERCOPY \
            -e CONFIG_SLAB_FREELIST_RANDOM \
            -e CONFIG_SLAB_FREELIST_HARDENED \
            -e CONFIG_DM_VERITY \
            -e CONFIG_DM_VERITY_FEC \
            -e CONFIG_FS_VERITY \
            -e CONFIG_BPF \
            -e CONFIG_BPF_JIT \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_TMPFS_XATTR \
            -e CONFIG_TMPFS_POSIX_ACL
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tee ci-diagnostics/kernel/08-olddefconfig.log
          cp "$OUT/.config" ci-diagnostics/kernel/final.config
          grep -E '^(CONFIG_(KSU|KPM|KALLSYMS|KALLSYMS_ALL|SCHED_WALT|SCHED_TUNE|CPU_FREQ_GOV_SCHEDUTIL|ZRAM|ZSMALLOC|LTO_CLANG|LTO_CLANG_THIN|DM_VERITY|DM_VERITY_FEC|FS_VERITY|BPF|BPF_JIT|OVERLAY_FS|TMPFS_XATTR|TMPFS_POSIX_ACL))=' "$OUT/.config" | tee ci-diagnostics/kernel/08-final-feature-check.txt
          test "$(grep -c '^CONFIG_KPM=y$' "$OUT/.config")" -eq 1
          test "$(grep -c '^CONFIG_KALLSYMS=y$' "$OUT/.config")" -eq 1
          test "$(grep -c '^CONFIG_KALLSYMS_ALL=y$' "$OUT/.config")" -eq 1
          test "$(grep -c '^CONFIG_KSU=y$' "$OUT/.config")" -eq 1
          test "$(grep -c '^CONFIG_SCHED_WALT=y$' "$OUT/.config")" -eq 1
          test "$(grep -c '^CONFIG_SCHED_TUNE=y$' "$OUT/.config")" -eq 1
          test "$(grep -c '^CONFIG_ZRAM=y$' "$OUT/.config")" -eq 1
          test "$(grep -c '^CONFIG_ZSMALLOC=y$' "$OUT/.config")" -eq 1
          test "$(grep -c '^CONFIG_LTO_CLANG_THIN=y$' "$OUT/.config")" -eq 1

      - name: "K10 • Immutable G900EMW / regional source audit"
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "=== source commit ==="; git rev-parse HEAD
            echo "=== kernel version ==="; make -s O=kernel/out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- kernelversion
            echo "=== regional contamination audit ==="
            grep -RInE 'G900N|VZW|SPRINT|DCM_JP|SB_JP' arch/arm64/configs drivers include 2>/dev/null || true
            echo "=== KPM/SUSFS symbols ==="
            grep -RInE 'CONFIG_KPM|CONFIG_KSU_SUSFS' drivers/kernelsu KernelSU 2>/dev/null | head -100 || true
          } | tee ci-diagnostics/kernel/09-source-audit.txt
          git diff --check

      - name: "K11 • Build ARM64 kernel and modules"
        shell: bash
        run: |
          set -o pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          make O=kernel/out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc --all)" Image.gz-dtb modules 2>&1 | tee ci-diagnostics/kernel/10-build.log

      - name: "K12 • Verify kernel image, modules and release string"
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$PWD/kernel/out"
          test -s "$OUT/arch/arm64/boot/Image.gz-dtb" || test -s "$OUT/arch/arm64/boot/Image"
          make -s O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee ci-diagnostics/kernel/11-kernelrelease.txt
          grep -q '4.19.325-cip135' ci-diagnostics/kernel/11-kernelrelease.txt
          find "$OUT" -type f -name '*.ko' -print0 | sort -z | xargs -0 -r sha256sum | tee ci-diagnostics/kernel/11-modules.sha256

      - name: "K13 • Package OrangeFox/AnyKernel3 flashable ZIP"
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/AnyKernel3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$RUNNER_TEMP/AnyKernel3"
          cd "$RUNNER_TEMP/AnyKernel3"
          git fetch --depth=1 origin "$ANYKERNEL3_REF"
          git checkout --detach "$ANYKERNEL3_REF"
          resolved=$(git rev-parse HEAD)
          echo "$resolved" | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/12-anykernel3-resolved.txt"
          rm -rf .git
          if [ -s "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" .
            image=Image.gz-dtb
          else
            cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" .
            image=Image
          fi
          cat > anykernel.sh <<'AK3'
          properties() {
            kernel.string=LG Velvet G900EMW • Android 16 QPR2 • 4.19.325-cip135 • SukiSU-Ultra 4.1.3 • SUSFS 1.5.5 • KPM
            do.devicecheck=0
            do.modules=0
            do.systemless=0
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=G900EMW
          }
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          AK3
          zip -r9 "$GITHUB_WORKSPACE/LG-Velvet-G900EMW-Android16QPR2-cip135-SukiSU4.1.3-SUSFS1.5.5-KPM-OrangeFox.zip" . -x '.git/*' '*.md' 'README*' > "$GITHUB_WORKSPACE/ci-diagnostics/kernel/12-zip.log"
          sha256sum "$GITHUB_WORKSPACE/LG-Velvet-G900EMW-Android16QPR2-cip135-SukiSU4.1.3-SUSFS1.5.5-KPM-OrangeFox.zip" | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/12-zip.sha256"
          echo "image=$image" | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/12-package.txt"

      - name: "K14 • Upload kernel result + diagnostics ALWAYS"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "G900EMW-KERNEL-${{ github.run_id }}"
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/**/*.ko
            LG-Velvet-G900EMW-Android16QPR2-cip135-SukiSU4.1.3-SUSFS1.5.5-KPM-OrangeFox.zip
            ci-diagnostics/kernel/**
          if-no-files-found: warn
          retention-days: 30

  vendor:
    if: ${{ github.event_name == 'push' || inputs.build_vendor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: "V01 • Checkout workflow source"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: "V02 • Install Android 16 build dependencies"
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 \
            libncurses-dev libx11-dev libreadline-dev libgl1-mesa-dev xsltproc unzip \
            fontconfig python3 python3-pip rsync bc ccache lz4 lzop liblz4-tool \
            libxml2-utils pngcrush schedtool git-lfs gperf imagemagick \
            protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev \
            libgnutls28-dev libsdl1.2-dev squashfs-tools xxd erofs-utils

      - name: "V03 • Initialize official repo correctly — no invalid --repo-rev=stable"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/android/bin" "$RUNNER_TEMP/android"
          mkdir -p ci-diagnostics/vendor
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/android/bin/repo" \
            2>&1 | tee ci-diagnostics/vendor/00-repo-download.log
          chmod 0755 "$RUNNER_TEMP/android/bin/repo"
          export PATH="$RUNNER_TEMP/android/bin:$PATH"
          mkdir -p ci-diagnostics/vendor
          cd "$RUNNER_TEMP/android"
          repo init -u "$ANDROID_MANIFEST" -b "$LINEAGE_BRANCH" --depth=1 --no-repo-verify \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/01-repo-init.log"
          repo version | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/01-repo-version.txt"
          test -f .repo/manifest.xml

      - name: "V04 • Add G900EMW device/common/vendor trees with explicit refs"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$RUNNER_TEMP/android/bin:$PATH"
          cd "$RUNNER_TEMP/android"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/g900emw.xml <<EOF
          <manifest>
            <project name="lge-qcom-dev/android_device_lge_caymanlm" path="device/lge/caymanlm" remote="github-lge" revision="${DEVICE_REF}" />
            <project name="Sparxikle/android_device_lge_sm7250-common" path="device/lge/sm7250-common" remote="github-lge" revision="${COMMON_DEVICE_REF}" />
            <project name="lge-qcom-dev/proprietary_vendor_lge_caymanlm" path="vendor/lge/caymanlm" remote="github-lge" revision="${VENDOR_REF}" />
            <project name="Sparxikle/proprietary_vendor_lge_sm7250-common" path="vendor/lge/sm7250-common" remote="github-lge" revision="${COMMON_VENDOR_REF}" />
          </manifest>
          EOF
          # The local manifest above needs a GitHub remote declaration.
          python3 - <<'PY'
          p='.repo/manifests/default.xml'
          print('manifest branch:', open('.repo/manifest.xml').read().strip())
          PY
          sed -i '/<remote name="github"/d' .repo/local_manifests/g900emw.xml
          sed -i '2i\            <remote name="github-lge" fetch="https://github.com/" />' .repo/local_manifests/g900emw.xml
          cat .repo/local_manifests/g900emw.xml | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/02-local-manifest.xml"
          repo sync -c --force-sync --no-clone-bundle --no-tags -j2 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/03-repo-sync.log"

      - name: "V05 • Verify source refs and Android 16 QPR2 product tree"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$RUNNER_TEMP/android/bin:$PATH"
          cd "$RUNNER_TEMP/android"
          repo manifest -r > "$GITHUB_WORKSPACE/ci-diagnostics/vendor/04-manifest-revisions.xml"
          for p in device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm vendor/lge/sm7250-common; do
            test -d "$p"
            git -C "$p" rev-parse HEAD
          done
          test -f device/lge/caymanlm/AndroidProducts.mk
          test -f device/lge/caymanlm/lineage_caymanlm.mk
          test -f vendor/lge/caymanlm/Android.bp || test -f vendor/lge/caymanlm/Android.mk
          {
            echo "device_ref=${DEVICE_REF}"
            echo "vendor_ref=${VENDOR_REF}"
            echo "common_device_ref=${COMMON_DEVICE_REF}"
            echo "common_vendor_ref=${COMMON_VENDOR_REF}"
            echo "target=lineage_caymanlm-userdebug"
          } | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/05-context.txt"

      - name: "V06 • Prepare Android build environment"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$RUNNER_TEMP/android/bin:$PATH"
          cd "$RUNNER_TEMP/android"
          source build/envsetup.sh 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/06-envsetup.log"
          lunch lineage_caymanlm-userdebug 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/06-lunch.log"

      - name: "V07 • Audit fingerprint / vibration / Dual-SIM / audio / IMS / VoWiFi"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/android"
          {
            echo "=== Fingerprint ==="
            grep -RInE 'fingerprint|goodix|fod|biometric' device/lge vendor/lge hardware 2>/dev/null | head -200 || true
            echo "=== Vibration ==="
            grep -RInE 'vibrator|haptics|vibra' device/lge vendor/lge hardware 2>/dev/null | head -200 || true
            echo "=== Dual SIM / RIL ==="
            grep -RInE 'dsds|dual.?sim|radio|ril|ims' device/lge vendor/lge 2>/dev/null | head -300 || true
            echo "=== Audio ==="
            grep -RInE 'audio|audio.primary|audio_policy|mixer_paths' device/lge vendor/lge 2>/dev/null | head -300 || true
            echo "=== VoWiFi / IWLAN ==="
            grep -RInE 'VoWiFi|VOWIFI|IWLAN|epdg|ims|wfc|wifi.?calling' device/lge vendor/lge 2>/dev/null | head -300 || true
          } | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/07-hardware-audit.txt"

      - name: "V08 • Build vendor.img only — do not rebuild kernel"
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/android"
          source build/envsetup.sh
          lunch lineage_caymanlm-userdebug
          m vendorimage -j"$(nproc --all)" 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/08-vendor-build.log"

      - name: "V09 • Verify vendor.img and VINTF payload"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/android"
          test -s out/target/product/caymanlm/vendor.img
          file out/target/product/caymanlm/vendor.img | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/09-vendor-file.txt"
          sha256sum out/target/product/caymanlm/vendor.img | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/09-vendor.sha256"
          find out/target/product/caymanlm -maxdepth 3 -type f \( -name '*manifest*.xml' -o -name '*matrix*.xml' \) -print | sort | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/09-vintf-files.txt"

      - name: "V10 • Upload vendor result + diagnostics ALWAYS"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "G900EMW-VENDOR-${{ github.run_id }}"
          path: |
            ${{ runner.temp }}/android/out/target/product/caymanlm/vendor.img
            ci-diagnostics/vendor/**
          if-no-files-found: warn
          retention-days: 30

  bundle:
    if: always() && (needs.kernel.result != 'skipped' || needs.vendor.result != 'skipped')
    needs: [kernel, vendor]
    runs-on: ubuntu-24.04
    steps:
      - name: "B01 • Download independent kernel/vendor artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: G900EMW-*
          path: collected
          merge-multiple: false
          if-no-files-found: warn

      - name: "B02 • Build final status report"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p final
          {
            echo "LG Velvet G900EMW — Android 16 QPR2"
            echo "kernel_job=${{ needs.kernel.result }}"
            echo "vendor_job=${{ needs.vendor.result }}"
            echo "Kernel and vendor are independent; a successful artifact is preserved even when the other job fails."
            echo "If a failure occurs, the exact numbered setup is visible in that job's log and diagnostic artifact."
          } | tee final/BUILD-STATUS.txt
          find collected -type f -print | sort > final/ARTIFACT-LIST.txt
          tar -czf "G900EMW-complete-diagnostics-${GITHUB_RUN_ID}.tar.gz" collected final

      - name: "B03 • Upload combined diagnostics ALWAYS"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "G900EMW-COMPLETE-${{ github.run_id }}"
          path: |
            final/**
            G900EMW-complete-diagnostics-${{ github.run_id }}.tar.gz
          if-no-files-found: warn
          retention-days: 30
