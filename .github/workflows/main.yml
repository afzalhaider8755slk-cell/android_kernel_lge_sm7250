name: LM-G900 • Android 16 QPR2 • Kernel + DTBO • CIP135 • v19

on:
  push:
    branches: [sixteen]
  workflow_dispatch:
    inputs:
      run_kernel:
        description: Build kernel
        type: boolean
        default: true
      run_dtbo:
        description: Build DTBO
        type: boolean
        default: true

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_BRANCH: sixteen
  DEVICE: caymanlm
  MODEL: LM-G900
  BASE_TAG: v4.19.325
  CIP_TAG: v4.19.325-cip135
  SUSFS_REF: 50b4d36
  SUKISU_REF: 3f602b5
  ARCH: arm64
  CLANG_BIN: clang
  LLVM_BIN: /usr/lib/llvm-18/bin

jobs:
  kernel:
    name: "KERNEL • LM-G900 • K01-K15"
    if: ${{ github.event_name == 'push' || inputs.run_kernel != false }}
    runs-on: ubuntu-24.04
    steps:
      - name: K01 • Checkout kernel source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics/kernel"
          cd "$GITHUB_WORKSPACE"
          git clone --filter=blob:none --no-tags --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel-src
          cd kernel-src
          git fetch --no-tags origin \
            "+refs/tags/$BASE_TAG:refs/tags/$BASE_TAG" \
            "+refs/tags/$CIP_TAG:refs/tags/$CIP_TAG"
          git config user.name "GitHub Actions Kernel Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/01-source-commit.txt"
          git status --short | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/01-status.txt"

      - name: K02 • Toolchain preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          export PATH="$LLVM_BIN:$PATH"
          clang --version | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/02-clang.txt"
          ld.lld --version | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/02-lld.txt"
          make --version | head -1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/02-make.txt"
          printf 'int x(void){return 0;}\n' | clang --target=aarch64-linux-gnu -c -x c -o /tmp/aarch64-smoke.o -
          clang --target=aarch64-linux-gnu -c -x assembler -o /tmp/aarch64-asm.o - <<< '.text'

      - name: K03 • CIP135 integration (device-preserving merge)
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics/kernel"
          {
            echo "=== CIP refs ==="
            git show-ref --tags "$BASE_TAG" "$CIP_TAG"
            echo "=== base/cip commits ==="
            git rev-parse "$BASE_TAG^{commit}"
            git rev-parse "$CIP_TAG^{commit}"
            echo "=== merge-base ==="
            git merge-base "$BASE_TAG" "$CIP_TAG"
          } | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/03-cip-reference.txt"

          base_commit="$(git rev-parse "$BASE_TAG^{commit}")"
          cip_commit="$(git rev-parse "$CIP_TAG^{commit}")"
          current_commit="$(git rev-parse HEAD)"
          if [[ "$current_commit" == "$base_commit" ]]; then
            echo "Current tree is exactly $BASE_TAG; integrating $CIP_TAG with device-preserving conflict resolution." | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/03-cip-mode.txt"
          else
            echo "Current LG tree is downstream of $BASE_TAG; CIP integration will merge the CIP tag while preserving LG device-side conflict hunks." | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/03-cip-mode.txt"
          fi

          # Never use git am on the entire CIP patch series. Merge the actual tagged
          # tree instead. -X ours resolves only textual merge conflicts in favor of
          # the LG device tree; unmerged paths are still a hard failure below.
          git merge --no-commit --no-ff -X ours "$CIP_TAG" 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/03-cip-merge.log" || true
          if git ls-files -u | grep -q .; then
            git status --short | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/03-cip-conflicts.txt"
            git diff --cc | head -20000 > "$GITHUB_WORKSPACE/ci-diagnostics/kernel/03-cip-conflict.diff" || true
            echo "CIP135 merge has unresolved conflicts; nothing is being skipped." >&2
            exit 1
          fi
          git add -A
          git commit -m "CI: integrate CIP135 while preserving LG device changes" --no-edit 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/03-cip-commit.log"
          git status --short | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/03-cip-status.txt"

      - name: K04 • Restore required kernel feature sources
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          git clone --depth=1 --branch kernel-4.19 https://github.com/shirkNeko/SUSFS.git /tmp/susfs
          if [[ -f /tmp/susfs/kernel_patches/fs/susfs.c ]]; then
            cp /tmp/susfs/kernel_patches/fs/susfs.c fs/susfs.c
          fi
          if [[ -f /tmp/susfs/kernel_patches/fs/susfs.c && ! -f fs/susfs.c ]]; then
            echo 'SUSFS source was not installed' >&2; exit 1
          fi
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/sukisu
          git -C /tmp/sukisu fetch --depth=1 origin "$SUKISU_REF"
          git -C /tmp/sukisu checkout --detach "$SUKISU_REF"
          if [[ -x /tmp/sukisu/kernel/setup.sh ]]; then
            bash /tmp/sukisu/kernel/setup.sh .
          elif [[ -f /tmp/sukisu/kernel/setup.sh ]]; then
            bash /tmp/sukisu/kernel/setup.sh .
          else
            echo 'SukiSU-Ultra setup.sh not found at pinned source' >&2; exit 1
          fi
          git status --short | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/04-feature-source-status.txt"

      - name: K05 • Configure finalized LM-G900 kernel feature set
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          export PATH="$LLVM_BIN:$PATH"
          export ARCH=arm64
          DEFCONFIG=vendor/caymanlm_defconfig
          test -f "arch/arm64/configs/$DEFCONFIG"
          make O=out ARCH=arm64 "$DEFCONFIG" 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/05-defconfig.log"
          ./scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KPM \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_SUSFS \
            --enable CONFIG_SCHED_WALT \
            --enable CONFIG_SCHED_TUNE \
            --enable CONFIG_ZRAM \
            --enable CONFIG_LTO_CLANG \
            --enable CONFIG_LTO_CLANG_THIN \
            --enable CONFIG_BUILD_ARM64_DT_OVERLAY \
            --set-str CONFIG_LOCALVERSION "-LM-G900-cip135"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/05-olddefconfig.log"
          cp out/.config "$GITHUB_WORKSPACE/ci-diagnostics/kernel/final.config"
          for s in CONFIG_KSU CONFIG_KPM CONFIG_KSU_SUSFS CONFIG_SUSFS CONFIG_SCHED_WALT CONFIG_SCHED_TUNE CONFIG_ZRAM CONFIG_LTO_CLANG_THIN CONFIG_BUILD_ARM64_DT_OVERLAY; do
            grep -q "^$s=y$" out/.config || { echo "$s is not enabled after olddefconfig" >&2; exit 1; }
          done
          grep -q '^CONFIG_LOCALVERSION="-LM-G900-cip135"$' out/.config

      - name: K06 • Build kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          export PATH="$LLVM_BIN:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics/kernel"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j2 Image modules 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/06-kernel-build.log"
          test -s out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/LM-G900-Image"

      - name: K07 • Kernel feature + identity audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          {
            echo '=== identity ==='; grep -E '^(CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO)' out/.config || true
            echo '=== finalized features ==='; grep -E '^(CONFIG_KSU|CONFIG_KPM|CONFIG_KSU_SUSFS|CONFIG_SUSFS|CONFIG_SCHED_WALT|CONFIG_SCHED_TUNE|CONFIG_ZRAM|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_THIN|CONFIG_BUILD_ARM64_DT_OVERLAY)=' out/.config || true
            echo '=== hardware capability references ==='; grep -RniE 'fingerprint|vibrator|haptic|dual.?sim|ril|ims|iwlan|wificalling|audio' drivers sound arch/arm64 2>/dev/null | head -1000 || true
          } | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/07-final-audit.txt"

      - name: K08 • AnyKernel3 package
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/AnyKernel3
          cp out/arch/arm64/boot/Image /tmp/AnyKernel3/Image
          sed -i 's/^device\.name=.*/device.name=LM-G900/' /tmp/AnyKernel3/anykernel.sh || true
          cd /tmp/AnyKernel3
          zip -qr "$GITHUB_WORKSPACE/LM-G900-Kernel-Android16QPR2.zip" . -x '.git/*'
          sha256sum "$GITHUB_WORKSPACE/LM-G900-Kernel-Android16QPR2.zip" | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/08-kernel-zip.sha256"

      - name: K09 • Upload kernel artifacts and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-KERNEL-result
          if-no-files-found: warn
          path: |
            LM-G900-Image
            LM-G900-Kernel-Android16QPR2.zip
            ci-diagnostics/kernel/**

  dtbo:
    name: "DTBO • LM-G900 LAO_COM • D01-D14"
    if: ${{ github.event_name == 'push' || inputs.run_dtbo != false }}
    runs-on: ubuntu-24.04
    steps:
      - name: D01 • Checkout exact same kernel source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics/dtbo"
          cd "$GITHUB_WORKSPACE"
          git clone --filter=blob:none --no-tags --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel-src
          cd kernel-src
          git fetch --no-tags origin "+refs/tags/$BASE_TAG:refs/tags/$BASE_TAG" "+refs/tags/$CIP_TAG:refs/tags/$CIP_TAG"
          git config user.name "GitHub Actions Kernel Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff -X ours "$CIP_TAG" 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/01-cip-merge.log" || true
          if git ls-files -u | grep -q .; then
            git status --short | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/01-cip-conflicts.txt"
            git diff --cc | head -20000 > "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/01-cip-conflict.diff" || true
            exit 1
          fi
          git add -A
          git commit -m "CI: integrate CIP135 while preserving LG device changes" --no-edit >/dev/null 2>&1 || true
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/01-source-commit.txt"

      - name: D02 • DTBO toolchain preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          export PATH="$LLVM_BIN:$PATH"
          clang --version | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/02-clang.txt"
          make --version | head -1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/02-make.txt"
          test -x scripts/dtc/dtc || true

      - name: D03 • Apply same finalized kernel feature sources
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          git clone --depth=1 --branch kernel-4.19 https://github.com/shirkNeko/SUSFS.git /tmp/susfs
          if [[ -f /tmp/susfs/kernel_patches/fs/susfs.c ]]; then cp /tmp/susfs/kernel_patches/fs/susfs.c fs/susfs.c; fi
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/sukisu
          git -C /tmp/sukisu fetch --depth=1 origin "$SUKISU_REF"
          git -C /tmp/sukisu checkout --detach "$SUKISU_REF"
          test -f /tmp/sukisu/kernel/setup.sh
          bash /tmp/sukisu/kernel/setup.sh .

      - name: D04 • Generate exact same caymanlm config
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          export PATH="$LLVM_BIN:$PATH"
          make O=dtbo-out ARCH=arm64 vendor/caymanlm_defconfig 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/04-defconfig.log"
          ./scripts/config --file dtbo-out/.config --enable CONFIG_BUILD_ARM64_DT_OVERLAY --enable CONFIG_MACH_LITO_CAYMANLM --enable CONFIG_MACH_LITO_CAYMANLM_LAO_COM --set-str CONFIG_LOCALVERSION "-LM-G900-cip135"
          make O=dtbo-out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/04-olddefconfig.log"
          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y$' dtbo-out/.config
          grep -q '^CONFIG_MACH_LITO_CAYMANLM=y$' dtbo-out/.config
          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' dtbo-out/.config

      - name: D05 • Fix only the known wildcard typo, idempotently
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          f=arch/arm64/boot/dts/vendor/lge/Makefile
          cp "$f" "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/05-Makefile.before"
          sed -i 's/$(wildcard echo $(srctree)/$(wildcard $(srctree)/' "$f"
          cp "$f" "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/05-Makefile.after"
          git diff -- "$f" | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/05-Makefile.diff" || true

      - name: D06 • Discover REAL Kbuild overlay targets
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          srcdir=arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com
          map="$GITHUB_WORKSPACE/ci-diagnostics/dtbo/06-target-map.txt"
          : > "$map"
          test -d "$srcdir"
          mapfile -t dts < <(find "$srcdir" -maxdepth 1 -type f -name '*_overlay.dts' -printf '%f\n' | sort)
          ((${#dts[@]} > 0)) || { echo 'No LAO_COM overlay DTS files found' >&2; exit 1; }
          for f in "${dts[@]}"; do
            stem="${f%.dts}"
            # IMPORTANT: the lge/Makefile rule's $(obj) is arch/.../vendor/lge,
            # so the previous workflow's full nested target was wrong.
            target="arch/arm64/boot/dts/vendor/lge/${stem}.dtbo"
            printf '%s|%s\n' "$f" "$target" | tee -a "$map"
          done
          cat "$map"

      - name: D07 • Verify every target has a Kbuild rule before building
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          export PATH="$LLVM_BIN:$PATH"
          while IFS='|' read -r dts target; do
            echo "=== $target ==="
            make O=dtbo-out ARCH=arm64 LLVM=1 LLVM_IAS=1 -n "$target" 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/07-make-dry-run.log"
          done < "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/06-target-map.txt"

      - name: D08 • Build each DTBO with serial verbose DTC
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"
          export PATH="$LLVM_BIN:$PATH"
          rm -rf dtbo-out/arch/arm64/boot/dts/vendor/lge/*.dtbo
          mkdir -p "$GITHUB_WORKSPACE/dtbo-files" "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/build-logs"
          n=0
          while IFS='|' read -r dts target; do
            n=$((n+1))
            setup=$(printf 'D%02d' "$((n+7))")
            log="$GITHUB_WORKSPACE/ci-diagnostics/dtbo/build-logs/${setup}-${dts%.dts}.log"
            echo "=== $setup • $target ===" | tee "$log"
            make O=dtbo-out ARCH=arm64 LLVM=1 LLVM_IAS=1 V=1 -j1 "$target" 2>&1 | tee -a "$log"
            out="dtbo-out/$target"
            test -s "$out" || { echo "Expected DTBO missing: $out" | tee -a "$log"; exit 1; }
            cp "$out" "$GITHUB_WORKSPACE/dtbo-files/$(basename "$out")"
          done < "$GITHUB_WORKSPACE/ci-diagnostics/dtbo/06-target-map.txt"

      - name: D09 • Package Android 16 QPR2 dtbo.img
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 --branch android16-qpr2-release https://android.googlesource.com/platform/system/libufdt.git /tmp/libufdt
          test -f /tmp/libufdt/utils/src/mkdtboimg.py
          python3 /tmp/libufdt/utils/src/mkdtboimg.py create dtbo.img --page_size=4096 dtbo-files/*.dtbo
          test -s dtbo.img
          stat -c '%n %s bytes' dtbo.img | tee ci-diagnostics/dtbo/09-size.txt
          size=$(stat -c '%s' dtbo.img)
          (( size <= 25165824 )) || { echo "DTBO exceeds 24 MiB partition" >&2; exit 1; }
          python3 /tmp/libufdt/utils/src/mkdtboimg.py dump dtbo.img | tee ci-diagnostics/dtbo/09-header.txt

      - name: D10 • DTBO identity and output audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          {
            echo '=== model ==='; echo 'LM-G900'
            echo '=== hardware ==='; echo 'caymanlm / lito-caymanlm_lao_com'
            echo '=== Android target ==='; echo 'Android 16 QPR2'
            echo '=== outputs ==='; find dtbo-files -maxdepth 1 -type f -printf '%f\n' | sort
          } | tee ci-diagnostics/dtbo/10-final-audit.txt
          sha256sum dtbo.img | tee ci-diagnostics/dtbo/10-dtbo.sha256

      - name: D11 • Package flashable DTBO ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p dtbo-zip
          cp dtbo.img dtbo-zip/dtbo.img
          cp ci-diagnostics/dtbo/10-dtbo.sha256 dtbo-zip/dtbo.img.sha256
          cat > dtbo-zip/README.txt <<'EOF'
          LM-G900 Android 16 QPR2 DTBO
          Target: caymanlm / lito-caymanlm_lao_com
          This image was built from the same kernel source/config family as the paired kernel workflow.
          Do not flash a DTBO from another regional variant.
          EOF
          (cd dtbo-zip && zip -9 -r "$GITHUB_WORKSPACE/LM-G900-Android16QPR2-DTBO.zip" .)

      - name: D12 • Upload DTBO artifacts and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-DTBO-result
          if-no-files-found: warn
          path: |
            dtbo.img
            LM-G900-Android16QPR2-DTBO.zip
            dtbo-files/**
            ci-diagnostics/dtbo/**
