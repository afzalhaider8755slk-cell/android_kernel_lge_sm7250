name: LG Velvet 5G - ORIGINAL FEATURES PRESERVED + SukiSU-Ultra + SUSFS + CIP135

on:
  push:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "LG kernel source branch"
        required: true
        type: choice
        options:
          - sixteen
        default: sixteen
      defconfig:
        description: "LG kernel defconfig"
        required: true
        type: choice
        options:
          - vendor/caymanlm_defconfig
        default: vendor/caymanlm_defconfig

permissions:
  contents: read

concurrency:
  group: lg-velvet-light-4.19-sukisu-susfs-cip135-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LG Velvet LIGHT 4.19 + SukiSU-Ultra + SUSFS + CIP135
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || 'sixteen' }}
      DEFCONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'vendor/caymanlm_defconfig' }}
      ORIGINAL_KERNEL_CONFIG_SHA256: a084fd97f58f6af6974a8f347817b88eb6d08f4ec00726cdd3fbe87e3f1e3cdd

      SUKISU_SETUP_URL: https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh
      SUKISU_REF: main
      SUKISU_EXPECTED_TAG: v4.2.0
      SUKISU_EXPECTED_COMMIT: 85eb4a9

      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: kernel-4.19
      SUSFS_EXPECTED_COMMIT: 001e6991
      SUSFS_EXPECTED_VERSION: 1.5.5

      CIP_REPO: https://gitlab.com/cip-project/cip-kernel/linux-cip.git
      CIP_BASE_TAG: v4.19.325
      CIP_TARGET_TAG: v4.19.325-cip135

      CLANG_REVISION: clang-r563880c
      CLANG_PREBUILT_TAG: ndk-r29
      GCC64_BRANCH: lineage-19.1
      GCC32_BRANCH: lineage-19.1

      ARCH: arm64
      OUT_DIR: ${{ github.workspace }}/out
      DIAG_DIR: ${{ github.workspace }}/ci-diagnostics

    steps:
      - name: 01 - Checkout LG source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          rm -rf "$GITHUB_WORKSPACE/kernel"
          git ls-remote --exit-code --heads "$KERNEL_REPO" "refs/heads/$SOURCE_BRANCH"             | tee "$DIAG_DIR/source-remote.txt"

          git clone --depth=1 --branch "$SOURCE_BRANCH" "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"

          test "$(git rev-parse --abbrev-ref HEAD)" = "$SOURCE_BRANCH"
          test "$(make -s kernelversion)" = "4.19.325"

          git status --short
          git log -1 --format='commit=%H%nsubject=%s' | tee "$DIAG_DIR/source-commit.txt"

          echo "source_branch=$SOURCE_BRANCH" | tee "$DIAG_DIR/source-status.txt"
          echo "source_commit=$(git rev-parse HEAD)" | tee -a "$DIAG_DIR/source-status.txt"
          echo "kernel_version=$(make -s kernelversion)" | tee -a "$DIAG_DIR/source-status.txt"

      - name: 02 - Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex git libelf-dev libssl-dev \
            lld llvm python3 python-is-python3 rsync unzip wget gzip file

          test -x /usr/bin/python
          /usr/bin/python --version
          mkdir -p "$DIAG_DIR"

      - name: 03 - Download Android Clang r563880c + GCC 4.9
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf clang-prebuilt gcc64 gcc32

          git clone --depth=1 --filter=blob:none --sparse \
            --branch "$CLANG_PREBUILT_TAG" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-prebuilt

          cd clang-prebuilt
          git sparse-checkout set "$CLANG_REVISION"
          cd "$GITHUB_WORKSPACE"

          git clone --depth=1 --branch "$GCC64_BRANCH" \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          git clone --depth=1 --branch "$GCC32_BRANCH" \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          export CLANG_DIR="$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION"
          export GCC64_DIR="$GITHUB_WORKSPACE/gcc64"
          export GCC32_DIR="$GITHUB_WORKSPACE/gcc32"

          test -x "$CLANG_DIR/bin/clang"
          test -x "$GCC64_DIR/bin/aarch64-linux-android-gcc"
          test -x "$GCC32_DIR/bin/arm-linux-androideabi-gcc"

          "$CLANG_DIR/bin/clang" --version | tee "$DIAG_DIR/clang-version.txt"
          "$CLANG_DIR/bin/clang" --version | grep -q '21\.0\.0'
          "$GCC64_DIR/bin/aarch64-linux-android-gcc" --version | head -n 1 | tee "$DIAG_DIR/gcc64-version.txt"
          "$GCC32_DIR/bin/arm-linux-androideabi-gcc" --version | head -n 1 | tee "$DIAG_DIR/gcc32-version.txt"

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "GCC64_DIR=$GCC64_DIR" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$GCC32_DIR" >> "$GITHUB_ENV"
          echo "PATH=$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH" >> "$GITHUB_ENV"

      - name: 04 - Restore and freeze exact original LG feature baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/04-baseline-config.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          export CC="$CLANG_DIR/bin/clang"
          export LD="$CLANG_DIR/bin/ld.lld"
          export AS="$CLANG_DIR/bin/llvm-as"
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$CLANG_DIR/lib:${LD_LIBRARY_PATH:-}"

          # The supplied working kernel config is the preservation source of truth.
          # This prevents the LIGHT workflow from silently dropping an original LG feature.
          cat > "$RUNNER_TEMP/working-baseline.b64" <<'BASE64_PAYLOAD'
