          # upstream comments. Linux 4.19 has clone_file_range/dedupe_file_range,
          # while remap_file_range is available from 4.20 onward.
          remap_pattern = re.compile(
              r"static\s+loff_t\s+ksu_wrapper_remap_file_range\s*\(.*?"
              r"^}\s*\n(?=static\s+int\s+ksu_wrapper_fadvise)",
