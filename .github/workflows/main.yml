
name: V109-LM-G900-KARNAL-SukiSU-Builtin-V99-Features-Preserved

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_REF: sixteen
  KERNEL_COMMIT: 720c8d37ab7727af24c275bead988d6345ad174b
  DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_caymanlm.git
  DEVICE_REF: sixteen
  COMMON_DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_sm7250-common.git
  COMMON_DEVICE_REF: sixteen
  VENDOR_REPO: https://github.com/Hirashi-so/proprietary_vendor_lge_caymanlm.git
  VENDOR_REF: sixteen
  BASELINE_KERNEL_SHA256: 85dd6083fd5a34135f301de661cae5f90b1aee82f4f5aa8d6dee30eacd34659d
  BASELINE_KERNEL_VERSION: 4.19.325
  BASELINE_CIP: v4.19.325-cip132
  CIP_TARGET: v4.19.325-cip133
  KSU_REPO: SukiSU-Ultra/SukiSU-Ultra
  KSU_REF: builtin
  KSU_COMMIT: b20dee702035af09cb2ecb5f35443bbc1747f3e6
  KSU_MANAGER_BUILD: 4.2.0
  KSU_MANAGER_PACKAGE: com.sukisu.ultra
  KSU_MANAGER_SIGNATURE_SHA256: 947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef
  # Kernel-side SUSFS 2.3.0 is required by SukiSU builtin on this legacy 4.19 tree.
  # This is the same SUSFS 2.3.0 integration used by the V99 contract; it is not a
  # second root provider and is applied before the SukiSU 4.19 source compatibility audit.
  SUSFS_KERNEL_PATCH_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  SUSFS_KERNEL_PATCH_REF: f15603b246d7ce6008af8bdefa0a34b3df28326a
  SUSFS_KERNEL_PATCH_PATH: Patches/Patch/susfs_patch_to_4.19.patch
  SUSFS_KERNEL_PATCH_URL: https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/f15603b246d7ce6008af8bdefa0a34b3df28326a/Patches/Patch/susfs_patch_to_4.19.patch
  SUSFS_EXPECTED_VERSION: v2.3.0
  CLANG_REV: clang-r563880c
  CLANG_COMMIT: f8439f0628d799092dd07df440a6334cab28939c
  WORKFLOW_VERSION: V109-V99-FEATURES-PRESERVED-SUKISU-SUSFS-CHECKSUM-FIX
  OUTPUT_PREFIX: V109-LM-G900-KARNAL
  KERNEL_BUILD_TARGET: Image

jobs:
  build:
    name: LM-G900N 4.19.325 SukiSU builtin
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "1. Checkout exact kernel baseline"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs diagnostics
          cat > SOURCE-LEVEL-DEBUGGING-CONTRACT.txt <<'EOF_CONTRACT'
          SOURCE-LEVEL DEBUGGING CONTRACT — LG LM-G900N KERNEL PROJECT
          
          Target: LG Velvet 5G LM-G900N / SM7250 / Android 16 API 36 / ARM64
          Kernel: Linux 4.19.325-cip133 / legacy non-GKI / PREEMPT
          Pinned source: 720c8d37ab7727af24c275bead988d6345ad174b
          Defconfig: vendor/lineageos_cayman_defconfig
          Golden baseline: V99
          
          1. Every build/runtime error is treated as a source-level compatibility problem.
          2. Trace the failing symbol/API/config/value through every producer, consumer,
             dependency and downstream/upstream workflow stage before changing anything.
          3. Fix the root cause for this exact 4.19.325 non-GKI kernel, SM7250 platform,
             device tree and Android 16 environment; do not use generic modern-GKI fixes.
          4. After a fix, audit every other stage that consumes or depends on the changed
             source/API/config/value and propagate the necessary compatible fix there too.
          5. Preserve V99 working features and the known-good build order. Do not remove
             features merely to hide a compile or runtime error.
          6. Root provider contract is SukiSU-Ultra v4.2.0 builtin at commit
             b20dee702035af09cb2ecb5f35443bbc1747f3e6, package com.sukisu.ultra.
          7. Kernel-side SUSFS contract is the pinned SUSFS 2.3.0 4.19 patch at commit
             f15603b246d7ce6008af8bdefa0a34b3df28326a, verified by its SHA-256 before use.
          8. Real SukiSU SELinux policy injection must remain active. Never hide the old
             setexeccon(u:r:ksu:s0) failure by weakening/permissive SELinux.
          9. Do not alter IP/network configuration unless explicitly requested.
          10. Do not hide, downgrade, bypass, or silently ignore errors. Preserve detailed
              diagnostics so the next failure can be traced from actual evidence.
          11. If an error is ambiguous, research the exact upstream/source implementation
              and verify it against this pinned tree before selecting a compatibility fix.
          12. The workflow artifact must carry this contract so future debugging retains
              the same project rules even if the conversation context is unavailable.
          EOF_CONTRACT
          cp SOURCE-LEVEL-DEBUGGING-CONTRACT.txt diagnostics/SOURCE-LEVEL-DEBUGGING-CONTRACT.txt
          git clone --branch "${KERNEL_REF}" "${KERNEL_REPO}" kernel
          git -C kernel fetch --tags --force --prune
          git -C kernel checkout --detach "${KERNEL_COMMIT}"
          test "$(git -C kernel rev-parse HEAD)" = "${KERNEL_COMMIT}"
          test "$(make -s -C kernel kernelversion)" = "${BASELINE_KERNEL_VERSION}"
          git -C kernel status --short > baseline-git-status.txt
          printf 'SOURCE_COMMIT=%s\nSOURCE_BRANCH=%s\nKERNEL_VERSION=%s\n' \
            "$(git -C kernel rev-parse HEAD)" "${KERNEL_REF}" "$(make -s -C kernel kernelversion)" > source-info.txt

      - name: "2. Prepare Android Clang"
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache clang flex gcc-aarch64-linux-gnu git lld libssl-dev libelf-dev libncurses-dev python3 rsync unzip zip wget curl device-tree-compiler patch
          curl -fL --retry 5 --retry-delay 2 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/${CLANG_REV}.tar.gz" \
            -o "/tmp/${CLANG_REV}.tar.gz"
          mkdir -p "clang-prebuilt/${CLANG_REV}"
          tar -xzf "/tmp/${CLANG_REV}.tar.gz" -C "clang-prebuilt/${CLANG_REV}"
          test -x "clang-prebuilt/${CLANG_REV}/bin/clang"
          test -x "clang-prebuilt/${CLANG_REV}/bin/ld.lld"
          "clang-prebuilt/${CLANG_REV}/bin/clang" --version | tee toolchain-version.txt
          echo "CLANG_BIN=${GITHUB_WORKSPACE}/clang-prebuilt/${CLANG_REV}/bin" >> "$GITHUB_ENV"

      - name: "3. Verify device tree and defconfig"
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth=1 --branch "${DEVICE_REF}" "${DEVICE_REPO}" device-caymanlm
          git clone --depth=1 --branch "${COMMON_DEVICE_REF}" "${COMMON_DEVICE_REPO}" device-sm7250-common
          git clone --depth=1 --branch "${VENDOR_REF}" "${VENDOR_REPO}" vendor-caymanlm
          mkdir -p diagnostics/device-tree
          cp device-caymanlm/BoardConfig.mk diagnostics/device-tree/BoardConfig.mk
          cp device-sm7250-common/BoardConfigCommon.mk diagnostics/device-tree/BoardConfigCommon.mk
          cp vendor-caymanlm/BoardConfigVendor.mk diagnostics/device-tree/BoardConfigVendor.mk
          TARGET_KERNEL_CONFIG="$({ grep -E '^[[:space:]]*TARGET_KERNEL_CONFIG[[:space:]]*:?=' device-caymanlm/BoardConfig.mk || true; } | tail -n1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//')"
          test "${TARGET_KERNEL_CONFIG}" = "vendor/lineageos_cayman_defconfig"
          echo "TARGET_KERNEL_CONFIG=${TARGET_KERNEL_CONFIG}" >> "$GITHUB_ENV"
          test -f "kernel/arch/arm64/configs/${TARGET_KERNEL_CONFIG}"
          cp "kernel/arch/arm64/configs/${TARGET_KERNEL_CONFIG}" baseline-defconfig.txt
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          make -C kernel O=out "${TARGET_KERNEL_CONFIG}" > logs/defconfig.log 2>&1
          test -f kernel/out/.config
          test -f kernel/out/include/config/auto.conf
          test -f kernel/out/include/generated/autoconf.h
          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' kernel/out/.config | sort > baseline-enabled-config.txt
          sha256sum baseline-enabled-config.txt > logs/baseline-enabled-config.sha256
          sha256sum baseline-defconfig.txt > logs/baseline-defconfig.sha256
          printf 'baseline_kernel_sha256=%s\nbaseline_kernel_version=%s\nbaseline_cip=%s\ndefconfig=%s\n' \
            "${BASELINE_KERNEL_SHA256}" "${BASELINE_KERNEL_VERSION}" "${BASELINE_CIP}" "${TARGET_KERNEL_CONFIG}" > baseline-info.txt
          # V103: V99 device-tree sources are the baseline and are intentionally not modified here.
          # In particular, do not change any IP/network configuration or SELinux cmdline in this step.
          sha256sum diagnostics/device-tree/BoardConfig.mk diagnostics/device-tree/BoardConfigCommon.mk diagnostics/device-tree/BoardConfigVendor.mk > logs/device-tree-source-sha256.txt

      - name: "4. Apply V99-compatible CIP 133 only"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          git fetch --no-tags cip "refs/tags/${BASELINE_CIP}:refs/tags/${BASELINE_CIP}" "refs/tags/${CIP_TARGET}:refs/tags/${CIP_TARGET}"
          ## V107: preserve the V99 working order exactly. Step 3 has already
          # generated kernel/out/.config; never reset/clean the tree here because
          # cleaning the working tree would delete out/ and make this legacy tree fail before any
          # new SukiSU code is reached. V99 passed this stage using the same 3-way
          # fallback without cleaning the configured build output.
          test -f out/.config
          git diff --binary "${BASELINE_CIP}..${CIP_TARGET}" > ../logs/cip-132-to-133.patch
          if git apply --check --whitespace=nowarn ../logs/cip-132-to-133.patch > ../logs/cip-direct-check.log 2>&1; then
            git apply --index --whitespace=nowarn ../logs/cip-132-to-133.patch > ../logs/cip-apply.log 2>&1
            echo direct > ../logs/cip-selected.txt
          else
            if ! git apply --3way --check --whitespace=nowarn ../logs/cip-132-to-133.patch > ../logs/cip-3way-check.log 2>&1; then
              cat ../logs/cip-direct-check.log ../logs/cip-3way-check.log
              exit 1
            fi
            if grep -Eiq 'with conflicts|CONFLICT|error:|does not apply|patch failed' ../logs/cip-3way-check.log; then
              cat ../logs/cip-3way-check.log
              exit 1
            fi
            git apply --3way --index --whitespace=nowarn ../logs/cip-132-to-133.patch > ../logs/cip-apply.log 2>&1
            echo 3way > ../logs/cip-selected.txt
          fi
          git diff --check
          # Source-level contract for this exact Linux 4.19.325 vendor tree:
          # kernelversion is a Makefile-only value (VERSION/PATCHLEVEL/SUBLEVEL),
          # while kernelrelease is configuration-dependent because setlocalversion()
          # consumes the generated config. Do NOT invoke kernelversion through O=out:
          # the out-tree recursive Makefile includes include/config/auto.conf before
          # the target is evaluated. On this 4.19 tree that produces the misleading
          # "Kernel configuration is invalid" error even though CIP applied cleanly.
          # Read VERSION/PATCHLEVEL/SUBLEVEL directly from the source Makefile, then
          # use the already-configured out tree only for kernelrelease.
          test -f out/.config
          test -f out/include/config/auto.conf
          test -f out/include/generated/autoconf.h
          KERNEL_VERSION_FROM_SOURCE="$(awk -F= '
            /^[[:space:]]*VERSION[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); v=$2}
            /^[[:space:]]*PATCHLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); p=$2}
            /^[[:space:]]*SUBLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); s=$2}
            END {print v "." p "." s}
          ' Makefile)"
          test "${KERNEL_VERSION_FROM_SOURCE}" = "${BASELINE_KERNEL_VERSION}"
          printf 'source_kernelversion=%s\n' "${KERNEL_VERSION_FROM_SOURCE}" > ../logs/kernelversion-after-cip.txt
          KERNEL_RELEASE="$(make -s O=out kernelrelease)"
          printf '%s\n' "${KERNEL_RELEASE}" > ../logs/kernelrelease-after-cip.txt
          case "${KERNEL_RELEASE}" in
            4.19.325-cip133-st17-perf*) ;;
            *) echo "[ERROR] CIP result is not the expected 4.19.325-cip133-st17-perf lineage: ${KERNEL_RELEASE}"; exit 1 ;;
          esac

      - name: "5. Integrate exact SukiSU builtin commit"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          rm -rf KernelSU
          git init -q KernelSU
          git -C KernelSU remote add origin "https://github.com/${KSU_REPO}.git"
          git -C KernelSU fetch --depth=1 origin "${KSU_COMMIT}"
          git -C KernelSU fetch --no-tags --depth=64 origin "refs/heads/${KSU_REF}:refs/remotes/origin/${KSU_REF}"
          # The commit is pinned independently; the ancestry check is only a guard
          # that the pinned commit belongs to the requested builtin line. If the
          # remote branch history is shallow, deepen it before checking ancestry.
          if ! git -C KernelSU merge-base --is-ancestor "${KSU_COMMIT}" "refs/remotes/origin/${KSU_REF}"; then
            git -C KernelSU fetch --no-tags --deepen=256 origin "refs/heads/${KSU_REF}:refs/remotes/origin/${KSU_REF}"
            git -C KernelSU merge-base --is-ancestor "${KSU_COMMIT}" "refs/remotes/origin/${KSU_REF}"
          fi
          git -C KernelSU checkout --detach "${KSU_COMMIT}"
          test "$(git -C KernelSU rev-parse HEAD)" = "${KSU_COMMIT}"
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile
          test -f KernelSU/kernel/setup.sh
          test -f KernelSU/kernel/manager/apk_sign.c
          grep -q "${KSU_MANAGER_SIGNATURE_SHA256}" KernelSU/kernel/manager/apk_sign.c
          grep -q '0x35c' KernelSU/kernel/manager/apk_sign.c
          grep -Rqs 'config KSU_SUSFS' KernelSU/kernel
          grep -Rqs 'susfs_ksu_sid' KernelSU/kernel
          grep -Rqs 'susfs_priv_app_sid' KernelSU/kernel
          grep -Rqs 'susfs_is_current_ksu_domain' KernelSU/kernel
          # V100 error: the source has (void), so the old grep for () was a false failure.
          grep -Eq 'void[[:space:]]+apply_kernelsu_rules[[:space:]]*\([[:space:]]*void[[:space:]]*\)' KernelSU/kernel/selinux/rules.c
          grep -Eq 'void[[:space:]]+setup_ksu_cred[[:space:]]*\([[:space:]]*void[[:space:]]*\)' KernelSU/kernel/selinux/selinux.c
          grep -q 'security_secctx_to_secid' KernelSU/kernel/selinux/selinux.c
          grep -q 'KERNEL_SU_CONTEXT' KernelSU/kernel/selinux/selinux.h
          grep -q 'handle_sepolicy' KernelSU/kernel/selinux/rules.c
          ln -sf "$(realpath --relative-to=drivers "$(pwd)/KernelSU/kernel")" drivers/kernelsu
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -L drivers/kernelsu
          {
            echo "requested_manager=${KSU_MANAGER_BUILD}"
            echo "manager_package=${KSU_MANAGER_PACKAGE}"
            echo "builtin_branch=${KSU_REF}"
            echo "resolved_commit=$(git -C KernelSU rev-parse HEAD)"
            echo "manager_signature_sha256=${KSU_MANAGER_SIGNATURE_SHA256}"
            echo "builtin_susfs=yes"
          } | tee ../logs/sukisu-resolved.txt

      - name: "6. Source-aware SUSFS 2.3.0 integration, 4.19 fixes and DT reconciliation"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel

          # SukiSU builtin provides the KernelSU-side SUSFS ABI/features, but its
          # kernel_includes.h deliberately includes <linux/susfs.h>. On this
          # non-GKI 4.19.325 tree the kernel-side SUSFS implementation is therefore
          # a required source dependency; the previous V106 workflow enabled the
          # Kconfig symbols without actually integrating fs/susfs.c and headers.
          # That is exactly why the build reported: "linux/susfs.h: file not found".
          # Apply the same pinned SUSFS v2.3.0 kernel patch contract used by V99,
          # before any SukiSU compatibility bridge can consume those symbols.
          test ! -e fs/susfs.c
          test ! -e include/linux/susfs.h
          test ! -e include/linux/susfs_def.h

          # V107 failure root cause: the Git object fetch/checkout path reached
          # the pinned SUSFS commit, then the strict shell exited before the kernel
          # patch could even be checked. The kernel patch itself was never tested.
          # Do not resolve a fixed source artifact through a shallow repository clone.
          # Fetch the exact immutable raw blob instead, then verify its SHA-256 before
          # touching the kernel tree. This removes the failing Git ref/checkout layer
          # while preserving the exact same kernel-side SUSFS 2.3.0 source.
          rm -f ../logs/susfs-2.3.0.patch
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            "${SUSFS_KERNEL_PATCH_URL}" -o ../logs/susfs-2.3.0.patch
          test -s ../logs/susfs-2.3.0.patch
          # V109 source-level fix for the V108 failure:
          # do not feed a generated line through sha256sum -c. The V108 runner
          # reached the downloaded immutable patch successfully, then coreutils
          # rejected the verification stream with:
          #   sha256sum: standard input: no properly formatted checksum lines found
          # The cryptographic contract is unchanged; compare the digest directly.
          EXPECTED_SUSFS_PATCH_SHA256="f9d8ed735f461ed982d2c49b338e35c17f4378e5"
          ACTUAL_SUSFS_PATCH_SHA256="$(sha256sum ../logs/susfs-2.3.0.patch | awk '{print $1}')"
          printf 'expected_sha256=%s\nactual_sha256=%s\n' \
            "${EXPECTED_SUSFS_PATCH_SHA256}" "${ACTUAL_SUSFS_PATCH_SHA256}" \
            > ../logs/susfs-sha256-verification.txt
          test "${ACTUAL_SUSFS_PATCH_SHA256}" = "${EXPECTED_SUSFS_PATCH_SHA256}"
          printf 'patch_repo=%s\npatch_ref=%s\npatch_path=%s\npatch_url=%s\npatch_sha256=%s\n' \
            "${SUSFS_KERNEL_PATCH_REPO}" "${SUSFS_KERNEL_PATCH_REF}" \
            "${SUSFS_KERNEL_PATCH_PATH}" "${SUSFS_KERNEL_PATCH_URL}" \
            "${ACTUAL_SUSFS_PATCH_SHA256}" > ../logs/susfs-source-resolved.txt

          # Refuse a partial/fuzzy application. Prefer direct application; if the
          # legacy vendor tree needs context relocation, allow only Git's 3-way
          # resolver and fail if it reports any unresolved conflict.
          if git apply --check --whitespace=nowarn ../logs/susfs-2.3.0.patch > ../logs/susfs-direct-check.log 2>&1; then
            git apply --index --whitespace=nowarn ../logs/susfs-2.3.0.patch > ../logs/susfs-apply.log 2>&1
            echo direct > ../logs/susfs-selected.txt
          else
            if ! git apply --3way --check --whitespace=nowarn ../logs/susfs-2.3.0.patch > ../logs/susfs-3way-check.log 2>&1; then
              cat ../logs/susfs-direct-check.log ../logs/susfs-3way-check.log
              exit 1
            fi
            if grep -Eiq 'with conflicts|CONFLICT|error:|does not apply|patch failed|rej' ../logs/susfs-3way-check.log; then
              cat ../logs/susfs-3way-check.log
              exit 1
            fi
            git apply --3way --index --whitespace=nowarn ../logs/susfs-2.3.0.patch > ../logs/susfs-apply.log 2>&1
            echo 3way > ../logs/susfs-selected.txt
          fi

          git diff --check
          git diff --cached --check
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h
          grep -q '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          printf 'susfs_version=%s\npatch_ref=%s\npatch_url=%s\npatch_sha256=%s\n' \
            "${SUSFS_EXPECTED_VERSION}" "${SUSFS_KERNEL_PATCH_REF}" "${SUSFS_KERNEL_PATCH_URL}" \
            "$(sha256sum ../logs/susfs-2.3.0.patch | awk '{print $1}')" > ../logs/susfs-resolved.txt

          test -f drivers/kernelsu/manager/pkg_observer_compat.h
          grep -q 'KSU_DECL_FSNOTIFY_OPS' drivers/kernelsu/manager/pkg_observer_compat.h

          if grep -Rqs '#include <linux/minmax.h>' drivers/kernelsu && [ ! -f include/linux/minmax.h ]; then
            mkdir -p include/linux
            cat > include/linux/minmax.h <<'EOF_MINMAX'
          #ifndef _LINUX_MINMAX_H
          #define _LINUX_MINMAX_H
          #include <linux/kernel.h>
          #ifndef in_range
          #define in_range(val, start, len) ((unsigned long)(val) - (unsigned long)(start) < (unsigned long)(len))
          #endif
          #endif
          EOF_MINMAX
          fi

          if grep -Rqs '#include <uapi/linux/mount.h>' drivers/kernelsu && [ ! -f include/uapi/linux/mount.h ]; then
            mkdir -p include/uapi/linux
            cat > include/uapi/linux/mount.h <<'EOF_MOUNT'
          #ifndef _UAPI_LINUX_MOUNT_H
          #define _UAPI_LINUX_MOUNT_H
          #ifndef MS_REC
          #define MS_REC 16384
          #endif
          #ifndef MS_PRIVATE
          #define MS_PRIVATE (1 << 18)
          #endif
          #endif
          EOF_MOUNT
          fi

          for f in drivers/kernelsu/supercall/supercall.c drivers/kernelsu/policy/allowlist.c; do
            if [ -f "$f" ] && grep -q 'TWA_RESUME' "$f" && ! grep -q 'KSU_TASK_WORK_NOTIFY' "$f"; then
              python3 - "$f" <<'PY_TASKWORK'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          if '#include <linux/version.h>' not in s:
              s = '#include <linux/version.h>\n' + s
          marker = '#include <linux/task_work.h>'
          macro = "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 7, 0)\n#define KSU_TASK_WORK_NOTIFY TWA_RESUME\n#else\n#define KSU_TASK_WORK_NOTIFY true\n#endif"
          if 'KSU_TASK_WORK_NOTIFY' not in s:
              if marker in s:
                  s = s.replace(marker, marker + '\n' + macro, 1)
              else:
                  s = s.replace('#include <linux/version.h>', '#include <linux/version.h>\n#include <linux/task_work.h>\n' + macro, 1)
          s = s.replace('task_work_add(current, &tw->cb, TWA_RESUME)', 'task_work_add(current, &tw->cb, KSU_TASK_WORK_NOTIFY)')
          s = s.replace('task_work_add(tsk, cb, TWA_RESUME)', 'task_work_add(tsk, cb, KSU_TASK_WORK_NOTIFY)')
          p.write_text(s)
          PY_TASKWORK
            fi
          done

          NS=fs/namespace.c
          if grep -Rqs 'extern int path_mount(' drivers/kernelsu && ! grep -qE '^int path_mount\(' "$NS"; then
            cat >> "$NS" <<'EOF_PATHMOUNT'

          /* V103: Linux 4.19 bridge for SukiSU path_mount(). */
          int path_mount(const char *dev_name, struct path *path, const char *type_page, unsigned long flags, void *data_page)
          {
              char *buf, *dir_name;
              mm_segment_t old_fs;
              long ret;
              buf = (char *)__get_free_page(GFP_KERNEL);
              if (!buf) return -ENOMEM;
              dir_name = d_path(path, buf, PAGE_SIZE);
              if (IS_ERR(dir_name)) { free_page((unsigned long)buf); return PTR_ERR(dir_name); }
              old_fs = get_fs();
              set_fs(KERNEL_DS);
              ret = ksys_mount((char __user *)dev_name, (char __user *)dir_name, (char __user *)type_page, flags, (void __user *)data_page);
              set_fs(old_fs);
              free_page((unsigned long)buf);
              return ret;
          }
          EOF_PATHMOUNT
          fi
          if grep -Rqs 'extern int path_umount(' drivers/kernelsu && ! grep -qE '^int path_umount\(' "$NS"; then
            cat >> "$NS" <<'EOF_PATHUMOUNT'

          /* V103: Linux 4.19 bridge for SukiSU path_umount(). */
          int path_umount(struct path *path, int flags)
          {
              char *buf, *name;
              mm_segment_t old_fs;
              long ret;
              buf = (char *)__get_free_page(GFP_KERNEL);
              if (!buf) return -ENOMEM;
              name = d_path(path, buf, PAGE_SIZE);
              if (IS_ERR(name)) { free_page((unsigned long)buf); return PTR_ERR(name); }
              old_fs = get_fs();
              set_fs(KERNEL_DS);
              ret = ksys_umount((char __user *)name, flags);
              set_fs(old_fs);
              free_page((unsigned long)buf);
              return ret;
          }
          EOF_PATHUMOUNT
          fi

          if grep -Rqs 'seccomp_filter_release' drivers/kernelsu && ! grep -q 'void seccomp_filter_release(' kernel/seccomp.c; then
            cat >> kernel/seccomp.c <<'EOF_SECCOMP'

          #ifdef CONFIG_SECCOMP
          /* V103: Linux 4.19 bridge for SukiSU seccomp release API. */
          void seccomp_filter_release(struct task_struct *tsk) { put_seccomp_filter(tsk); }
          #endif
          EOF_SECCOMP
          fi

          DP=drivers/kernelsu/supercall/dispatch.c
          if [ -f "$DP" ] && grep -Eq 'tasklist_lock|task_pgrp\(|task_session\(' "$DP" && ! grep -q 'V103 sched compatibility' "$DP"; then
            sed -i '1i #include <linux/sched/signal.h>' "$DP"
            sed -i '1i #include <linux/sched/task.h>' "$DP"
            sed -i '1i /* V103 sched compatibility */' "$DP"
          fi

          # Linux 4.19 lacks the post-5.7 selinux_state members used by SukiSU's
          # optional selinux_hide implementation. Guard only this optional feature;
          # never weaken SELinux or replace the real KSU policy injector.
          SH=drivers/kernelsu/feature/selinux_hide.c
          if [ -f "$SH" ] && grep -q 'selinux_state.status_lock' "$SH" && ! grep -q 'V103 4.19 selinux_hide guard' "$SH"; then
            cp "$SH" ../logs/selinux_hide.original.c
            {
              echo '#include <linux/version.h>'
              echo '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 7, 0)'
              cat "$SH"
              echo '#else'
              echo '#include <linux/init.h>'
              echo '/* V103 4.19 selinux_hide guard: unsupported post-5.7 SELinux ABI. */'
              echo 'void __init ksu_selinux_hide_init(void) {}'
              echo 'void __exit ksu_selinux_hide_exit(void) {}'
              echo 'void ksu_selinux_hide_drop_backup_if_unused(void) {}'
              echo '#endif /* V103 4.19 selinux_hide guard */'
            } > "$SH.tmp"
            mv "$SH.tmp" "$SH"
          fi

          # The real 4.19 policy injector must remain active. This directly addresses
          # the old setexeccon(u:r:ksu:s0) failure instead of hiding it with permissive SELinux.
          grep -Eq 'void[[:space:]]+apply_kernelsu_rules[[:space:]]*\([[:space:]]*void[[:space:]]*\)' drivers/kernelsu/selinux/rules.c
          grep -q 'ksu_allow(db, KERNEL_SU_DOMAIN, ALL, ALL, ALL)' drivers/kernelsu/selinux/rules.c
          grep -q 'setup_selinux' drivers/kernelsu/selinux/selinux.c

          # DT: remove only duplicate common-touch includes.
          while IFS= read -r -d '' f; do
            sed -i '\|^#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"$|d' "$f"
          done < <(find arch/arm64/boot/dts/vendor/lge/lito-caymanlm -type f -iname '*touch_rev-1.0.dtsi' -print0)

          # DT: rename only board-local PM labels that duplicate the generic qcom labels.
          PM_ROOT=arch/arm64/boot/dts/vendor/lge/lito-caymanlm
          while IFS= read -r -d '' f; do
            tag="$(basename "$f" .dtsi | tr -c 'A-Za-z0-9' '_' | tr '[:upper:]' '[:lower:]' | sed 's/_*$//')"
            for base in camera_therm_default bmr_w_therm_default; do
              if grep -qE "^[[:space:]]*${base}[[:space:]]*:[[:space:]]*${base}[[:space:]]*\{" "$f"; then
                sed -i -E "s/^([[:space:]]*)${base}[[:space:]]*:[[:space:]]*${base}[[:space:]]*\{/\1${base}_${tag}: ${base}_${tag} {/" "$f"
                sed -i "s/&${base}/\&${base}_${tag}/g" "$f"
              fi
            done
          done < <(find "$PM_ROOT" -type f -iname '*pm*.dtsi' -print0)

          if grep -RInE '^[[:space:]]*(camera_therm_default|bmr_w_therm_default)[[:space:]]*:[[:space:]]*\1[[:space:]]*\{' "$PM_ROOT" 2>/dev/null; then
            echo '[ERROR] Duplicate board PM labels remain.'
            exit 1
          fi
          git diff --check
          git diff --cached --check
          if find . -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then exit 1; fi

          # Cross-setup contract: SukiSU's KSU-side SUSFS ABI and the kernel-side
          # SUSFS implementation must be present as one coherent source graph.
          grep -q '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          grep -q 'susfs_is_current_ksu_domain' fs/susfs.c
          grep -q 'setup_selinux' fs/susfs.c
          grep -q 'CONFIG_KSU_SUSFS_SUS_PATH' fs/namei.c
          grep -q 'CONFIG_KSU_SUSFS_SUS_MOUNT' fs/namespace.c
          grep -q 'CONFIG_KSU_SUSFS_SUS_KSTAT' fs/stat.c
          grep -q 'CONFIG_KSU_SUSFS_SUS_MAP' fs/proc/task_mmu.c
          grep -q 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG' fs/proc/cmdline.c
          grep -q 'CONFIG_KSU_SUSFS_OPEN_REDIRECT' fs/namei.c

      - name: "7. Enable all compatible SukiSU/SUSFS features and enforce no-removal"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          make O=out "${TARGET_KERNEL_CONFIG}" > ../logs/pre-sukisu-defconfig.log 2>&1
          ./scripts/config --file out/.config --enable KSU --enable KSU_FEATURE_ADBROOT --enable KSU_DEBUG --enable KPM --enable KSU_SUSFS
          for sym in KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
            grep -Eq "^[[:space:]]*config[[:space:]]+${sym}([[:space:]]|$)" drivers/kernelsu/Kconfig
            ./scripts/config --file out/.config --enable "${sym}"
          done
          make O=out olddefconfig > ../logs/sukisu-olddefconfig.log 2>&1
          for sym in CONFIG_KSU CONFIG_KSU_FEATURE_ADBROOT CONFIG_KSU_DEBUG CONFIG_KPM CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_SUS_MAP CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_THREAD_INFO_IN_TASK; do
            grep -q "^${sym}=y$" out/.config || { echo "[ERROR] ${sym} is not y"; exit 1; }
          done
          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' out/.config | sort > ../post-integration-enabled-config.txt
          while IFS= read -r line; do
            sym="${line%%=*}"
            case "$sym" in CONFIG_KSU*|CONFIG_KPM) continue ;; esac
            grep -Fxq "$line" ../post-integration-enabled-config.txt || { echo "[ERROR] Baseline config changed: $line"; exit 1; }
          done < ../baseline-enabled-config.txt

      - name: "8. Build SukiSU subtree, then Image"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          MAKE_ARGS=(O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCC=clang HOSTCXX=clang++)
          MAKE_ARGS+=(KSU_MANAGER_PACKAGE="${KSU_MANAGER_PACKAGE}")

          # V107 source-level build order fix:
          # SukiSU v4.2.0 kernel_includes.h consumes generated/compile.h.
          # On this Linux 4.19 O=out build, that header is produced by the
          # init/version.o dependency chain. Generate the shared headers before
          # compiling the SukiSU subtree. No SukiSU feature, DT, CIP, SELinux,
          # packaging, artifact, or device setup is removed or reordered.
          make O=out prepare scripts > ../logs/generated-headers-prepare.log 2>&1
          make O=out init/version.o > ../logs/generated-compile-header.log 2>&1
          test -s out/include/generated/compile.h
          test -s out/include/generated/utsrelease.h
          # kernel_includes.h includes <generated/compile.h>; assert the exact
          # include-tree target and the generated file before M=drivers/kernelsu.
          test -r out/include/generated/compile.h
          test -r out/include/generated/utsrelease.h
          test -r out/include/config/auto.conf

          make O=out security/selinux/ > ../logs/selinux-build.log 2>&1
          set +e
          make "${MAKE_ARGS[@]}" -k -j"$(nproc)" M=drivers/kernelsu > ../logs/ksu-prebuild.log 2>&1
          rc=$?
          set -e
          grep -nE '(error:|fatal error:|undefined reference|undefined symbol|Error [0-9]+$)' ../logs/ksu-prebuild.log | head -100 || true
          test "$rc" -eq 0 || exit "$rc"
          make "${MAKE_ARGS[@]}" -j"$(nproc)" "${KERNEL_BUILD_TARGET}" > ../logs/kernel-build.log 2>&1
          test -s out/vmlinux
          test -s out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image > ../logs/Image.sha256

      - name: "9. Final contracts and blocking DTB verification"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          export PATH="${CLANG_BIN}:$PATH"
          test -s out/include/generated/compile.h
          test -s out/include/generated/utsrelease.h
          strings out/vmlinux | grep -Fq "${KSU_MANAGER_SIGNATURE_SHA256}"
          for sym in ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_setresuid ksu_handle_sys_reboot setup_ksu_cred apply_kernelsu_rules susfs_ksu_sid susfs_priv_app_sid; do
            llvm-nm -n out/vmlinux | grep -Eq "[[:space:]]${sym}$" || { echo "[ERROR] Missing ${sym}"; exit 1; }
          done
          grep -A12 -B3 'void apply_kernelsu_rules(void)' drivers/kernelsu/selinux/rules.c | grep -q 'ksu_allow'
          # Do not allow an unpinned/alternate SUSFS source to sneak into the tree.
          test -s fs/susfs.c
          grep -q '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          test -f ../logs/susfs-2.3.0.patch
          test "$(sha256sum ../logs/susfs-2.3.0.patch | awk '{print $1}')" = "f9d8ed735f461ed982d2c49b338e35c17f4378e5"
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          for sym in CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_SUS_MAP; do
            grep -q "^${sym}=y$" out/.config || { echo "[ERROR] Final SUSFS feature ${sym} is not y"; exit 1; }
          done
          test ! -d susfs-backport
          make O=out dtbs > ../logs/dtbs-final.log 2>&1
          test -s out/arch/arm64/boot/Image

      - name: "10. Package and create device runtime validation"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf release work-anykernel
          mkdir -p release/build-info release/logs release/checksums work-anykernel
          cp kernel/out/arch/arm64/boot/Image release/kernel-image
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git work-anykernel
          rm -rf work-anykernel/.git work-anykernel/modules work-anykernel/ramdisk
          cp kernel/out/arch/arm64/boot/Image work-anykernel/Image
          cat > work-anykernel/anykernel.sh <<'AK3'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=V109-LM-G900-KARNAL-SukiSU-builtin
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          '; }
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3
          (cd work-anykernel && zip -qr ../release/AnyKernel3-OrangeFox-Flashable.zip .)
          mkdir -p release/kernel-payload
          cp kernel/out/arch/arm64/boot/Image release/kernel-payload/Image
          cp baseline-info.txt source-info.txt toolchain-version.txt baseline-enabled-config.txt post-integration-enabled-config.txt SOURCE-LEVEL-DEBUGGING-CONTRACT.txt release/build-info/
          cp logs/* release/logs/ 2>/dev/null || true
          (cd release/kernel-payload && zip -qr ../kernel.zip .)
          rm -rf release/kernel-payload
          cat > release/build-info/device-root-module-validation.sh <<'EOF_VALIDATE'
          #!/system/bin/sh
          set -u
          echo '== kernel =='; uname -a
          echo '== root =='; su -c id || exit 10
          echo '== SELinux context =='; su -c 'cat /proc/self/attr/current'
          echo '== KSU paths =='; su -c 'ls -ld /data/adb /data/adb/ksu /data/adb/ksu/bin /data/adb/modules /data/adb/modules_update'
          echo '== KSU processes =='; su -c 'ps -A | grep -E "ksud|ksu" || true'
          echo '== KSU SELinux log =='; su -c 'dmesg | grep -Ei "KernelSU|SukiSU|ksud|setexeccon|security_secctx_to_secid|apply_kernelsu_rules|Cached su SID" | tail -200 || true'
          echo '== module smoke test =='; echo 'Install one known-safe module, reboot once, then run:'
          echo 'su -c "ls -la /data/adb/modules"'
          echo 'su -c "mount | grep /data/adb/modules || true"'
          echo 'The old fatal setexeccon(u:r:ksu:s0) Invalid argument must not appear.'
          EOF_VALIDATE
          chmod +x release/build-info/device-root-module-validation.sh
          sha256sum release/kernel-image release/kernel.zip release/AnyKernel3-OrangeFox-Flashable.zip > release/checksums/SHA256SUMS
          (cd release && zip -qr "../${OUTPUT_PREFIX}-output.zip" .)

      - name: "11. Verify artifacts twice"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "${OUTPUT_PREFIX}-output.zip"
          test -s release/kernel.zip
          test -s release/AnyKernel3-OrangeFox-Flashable.zip
          unzip -t "${OUTPUT_PREFIX}-output.zip"
          unzip -t release/kernel.zip
          unzip -t release/AnyKernel3-OrangeFox-Flashable.zip
          unzip -t "${OUTPUT_PREFIX}-output.zip"
          sha256sum "${OUTPUT_PREFIX}-output.zip" release/kernel.zip release/AnyKernel3-OrangeFox-Flashable.zip

      - name: "12. Collect complete diagnostics"
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          mkdir -p diagnostics/logs
          printf 'job_status=%s\nworkflow=%s\nsource_commit=%s\ncip_target=%s\nsukisu_commit=%s\ndefconfig=%s\n' \
            "${JOB_STATUS}" "${WORKFLOW_VERSION}" "${KERNEL_COMMIT}" "${CIP_TARGET}" "${KSU_COMMIT}" "${TARGET_KERNEL_CONFIG:-UNRESOLVED}" > diagnostics/run-summary.txt
          cp -a logs/. diagnostics/logs/ 2>/dev/null || true
          cp -a baseline-info.txt baseline-defconfig.txt baseline-enabled-config.txt post-integration-enabled-config.txt source-info.txt toolchain-version.txt baseline-git-status.txt SOURCE-LEVEL-DEBUGGING-CONTRACT.txt diagnostics/ 2>/dev/null || true
          if [ -d kernel ]; then
            { git -C kernel status --short; echo; git -C kernel rev-parse HEAD; echo; find kernel -type f \( -name '*.rej' -o -name '*.orig' \) -print; } > diagnostics/kernel-state.txt 2>&1
          fi
          rm -f "${OUTPUT_PREFIX}-complete-logs.zip"
          (cd diagnostics && zip -qr "../${OUTPUT_PREFIX}-complete-logs.zip" .) || true

      - name: "13. Upload successful output"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: V109-LM-G900-KARNAL-output
          path: V109-LM-G900-KARNAL-output.zip
          if-no-files-found: error
          retention-days: 30

      - name: "14. Upload kernel artifacts"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: V109-LM-G900-KARNAL-kernel
          path: |
            release/kernel-image
            release/kernel.zip
            release/AnyKernel3-OrangeFox-Flashable.zip
          if-no-files-found: error
          retention-days: 30

      - name: "15. Upload complete diagnostics"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V109-LM-G900-KARNAL-complete-logs
          path: |
            V109-LM-G900-KARNAL-complete-logs.zip
            diagnostics/
            logs/
            baseline-info.txt
            baseline-defconfig.txt
            baseline-enabled-config.txt
            post-integration-enabled-config.txt
            baseline-git-status.txt
            source-info.txt
            toolchain-version.txt
            SOURCE-LEVEL-DEBUGGING-CONTRACT.txt
          if-no-files-found: warn
          retention-days: 30
