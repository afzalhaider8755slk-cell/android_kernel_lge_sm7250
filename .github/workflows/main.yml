name: V106-LM-G900-KARNAL-SukiSU-Builtin-Fixed

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: 720c8d37ab7727af24c275bead988d6345ad174b
  KERNEL_VERSION: 4.19.325
  CIP_TAG: v4.19.325-cip133
  DEFCONFIG: vendor/lineageos_cayman_defconfig
  ARCH: arm64
  SukiSU_COMMIT: b20dee702035af09cb2ecb5f35443bbc1747f3e6
  SukiSU_VERSION: v4.2.0
  CLANG_VERSION: clang-r563880c

jobs:
  LM-G900N:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 1. Checkout exact kernel baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: 2. Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev lz4 python3 rsync unzip \
            wget xz-utils zip

      - name: 3. Prepare Android Clang r563880c
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/clang-prebuilt"
          cd "$GITHUB_WORKSPACE/clang-prebuilt"
          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2026/${CLANG_VERSION}.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz
          test -x "${CLANG_VERSION}/bin/clang"
          "${CLANG_VERSION}/bin/clang" --version

      - name: 4. Apply CIP 132 -> 133 as a source-level dependency
        shell: bash
        run: |
          set -euo pipefail
          git remote add cip https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git || true
          git fetch --no-tags cip \
            "refs/tags/v4.19.325-cip132:refs/tags/v4.19.325-cip132" \
            "refs/tags/v4.19.325-cip133:refs/tags/v4.19.325-cip133"
          git diff --binary v4.19.325-cip132..v4.19.325-cip133 > /tmp/cip-132-to-133.patch
          git apply --3way --index /tmp/cip-132-to-133.patch
          git diff --check
          grep -qxF '4.19.325-cip133' localversion-cip

      - name: 5. Integrate exact SukiSU v4.2.0 builtin commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf KernelSU
          git clone --filter=blob:none https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          cd KernelSU
          git checkout --detach "$SukiSU_COMMIT"
          cd "$GITHUB_WORKSPACE"

          rm -rf drivers/kernelsu
          ln -s "$GITHUB_WORKSPACE/KernelSU/kernel" drivers/kernelsu

          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: 6. Apply 4.19 generated-header compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < "$GITHUB_WORKSPACE/0001-sukisu-4.2.0-legacy-compile-h.patch"

      - name: 7. Configure kernel and generate shared headers
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/clang-prebuilt/${CLANG_VERSION}/bin:$PATH"
          export LLVM=1
          export LLVM_IAS=1
          export ARCH="${ARCH}"

          mkdir -p out
          make O=out ARCH=arm64 "${DEFCONFIG}"
          make O=out ARCH=arm64 olddefconfig

          # This is the producer side of generated/compile.h.
          make O=out ARCH=arm64 prepare scripts
          make O=out ARCH=arm64 init/version.o

          test -f out/include/generated/autoconf.h || \
            test -f out/include/generated/autoconf.h
          test -f out/include/generated/compile.h
          test -f out/include/generated/utsrelease.h

      - name: 8. Enforce SukiSU/SUSFS feature contract before build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/clang-prebuilt/${CLANG_VERSION}/bin:$PATH"

          test -L drivers/kernelsu
          test -f drivers/kernelsu/kernel_includes.h
          ! grep -q 'generated/compile.h' drivers/kernelsu/kernel_includes.h

          scripts/config --file out/.config --enable KSU
          scripts/config --file out/.config --enable KSU_FEATURE_ADBROOT
          scripts/config --file out/.config --enable KPM
          scripts/config --file out/.config --enable KSU_SUSFS

          # Do not silently disable requested SUSFS functionality.
          # The kernel-side SUSFS implementation must exist before CONFIG_KSU_SUSFS=y.
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          make O=out ARCH=arm64 olddefconfig
          test "$(scripts/config --file out/.config --state KSU)" = "y"
          test "$(scripts/config --file out/.config --state KPM)" = "y"
          test "$(scripts/config --file out/.config --state KSU_SUSFS)" = "y"

      - name: 9. Build SukiSU subtree, then Image
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/clang-prebuilt/${CLANG_VERSION}/bin:$PATH"
          export LLVM=1
          export LLVM_IAS=1
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER=build-user
          export KBUILD_BUILD_HOST=build-host

          make O=out ARCH=arm64 M=drivers/kernelsu modules
          test -f out/drivers/kernelsu/kernelsu.ko

          make -j"$(nproc)" O=out ARCH=arm64 Image

          test -f out/arch/arm64/boot/Image

      - name: 10. Final contracts and blocking verification
        shell: bash
        run: |
          set -euo pipefail

          test -f out/include/generated/compile.h
          test -f out/include/generated/utsrelease.h
          test -f out/arch/arm64/boot/Image
          test -f out/drivers/kernelsu/kernelsu.ko

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KPM=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config

          grep -q '4.19.325-cip133' localversion-cip
          git diff --check

      - name: 11. Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V106-LM-G900N-SukiSU-v4.2.0-fixed
          path: |
            out/arch/arm64/boot/Image
            out/drivers/kernelsu/kernelsu.ko
            out/.config
            out/include/generated/compile.h
            out/include/generated/utsrelease.h
          if-no-files-found: error

      - name: 12. Upload diagnostics on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V106-LM-G900N-SukiSU-diagnostics
          path: |
            out/.config
            /tmp/cip-132-to-133.patch
            KernelSU/kernel/Makefile
            KernelSU/kernel/kernel_includes.h
          if-no-files-found: warn
