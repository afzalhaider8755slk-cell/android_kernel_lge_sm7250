      - name: 05 - Integrate KernelSU-Next & Apply SUSFS Patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"

          # Clone KernelSU-Next dev-susfs tree
          git clone --depth=1 --branch "$KSU_BRANCH" "$KSU_REPO" Drivers/kernelsu
          cd Drivers/kernelsu
          git fetch --depth=1 origin "$KSU_REF"
          git checkout "$KSU_REF"
          cd "$GITHUB_WORKSPACE/kernel"

          # Clone SUSFS patches
          git clone --depth=1 --branch "$SUSFS_BRANCH" "$SUSFS_REPO" "$RUNNER_TEMP/susfs"
          cd "$RUNNER_TEMP/susfs"
          git fetch --depth=1 origin "$SUSFS_REF"
          git checkout "$SUSFS_REF"

          # Apply SUSFS patches to kernel tree
          cd "$GITHUB_WORKSPACE/kernel"
          cp "$RUNNER_TEMP/susfs/kernel_patches/fs/susfs.c" fs/
          cp "$RUNNER_TEMP/susfs/kernel_patches/include/linux/susfs.h" include/linux/

          # Update Kconfig & Makefile configurations
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig

          # Set SUSFS & KSU options in .config
          scripts/config --file .config --enable CONFIG_KSU
          scripts/config --file .config --enable CONFIG_KSU_SUSFS
          scripts/config --file .config --enable CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config --file .config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          scripts/config --file .config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          scripts/config --file .config --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          scripts/config --file .config --disable CONFIG_KPROBES

      - name: 06 - Compile Kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          mkdir -p "$OUT_DIR"

          make O="$OUT_DIR" ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          make -j$(nproc --all) O="$OUT_DIR" ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz-dtb

      - name: 07 - Package and Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KernelSU-Next-SUSFS-Image
          path: |
            ${{ github.workspace }}/out/arch/arm64/boot/Image.gz-dtb
            ${{ github.workspace }}/out/.config
          retention-days: 7
