        \ stock values BEFORE KSU/SUSFS changes.\ngrep -q '^# CONFIG_KPROBES is not\
        \ set$' \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_HAVE_KPROBES=y$' \"$OUT_DIR/.config\"\
        \ngrep -q '^CONFIG_MODULES=y$' \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_OVERLAY_FS=y$'\
        \ \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_MACH_LITO_CAYMANLM=y$' \"$OUT_DIR/.config\"\
        \ngrep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' \"$OUT_DIR/.config\"\ngrep\
        \ -q '^CONFIG_LOCALVERSION=\"-perf\"$' \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_CC_IS_CLANG=y$'\
        \ \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_CLANG_VERSION=210000$' \"$OUT_DIR/.config\"\
        \ngrep -q '^CONFIG_AS_IS_LLVM=y$' \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_AS_VERSION=210000$'\
        \ \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_LLD_VERSION=210000$' \"$OUT_DIR/.config\"\
        \n\nif grep -Eq '^CONFIG_KSU($|_)' \"$OUT_DIR/.config\"; then\n  echo \"::error::Embedded\
        \ working baseline already contains KernelSU symbols.\"\n  exit 1\nfi\n\n\
        echo \"PASS: exact embedded WORKING .config loaded.\"\necho \"PASS: baseline\
        \ SHA256 matches $WORKING_BASELINE_CONFIG_SHA256\"\necho \"PASS: KPROBES remains\
        \ disabled in pristine baseline.\"\n"
    - name: 05 - Integrate KernelSU-Next v3.3.0 SUSFS-compatible tree
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/05-ksu.log\"\
        ) 2>&1\ncd \"$GITHUB_WORKSPACE/kernel\"\n\n# IMPORTANT:\n# The previous workflow\
        \ used the official KernelSU-Next release tree\n# and then tried to apply\
        \ SUSFS's legacy KernelSU patch\n# (10_enable_susfs_for_ksu.patch). That patch\
        \ is for a different\n# KernelSU kernel layout, which is exactly why Step\
        \ 07 produced\n# \"No file to patch\" and large numbers of rejected hunks.\n\
        #\n# For KernelSU-Next + SUSFS, use the SUSFS-compatible KernelSU-Next\n#\
        \ tree directly. The v3.3.0 tag on pershoot/dev-susfs is the\n# stable-compatible\
        \ tree used by current KSU-Next + SUSFS builds.\n# The upstream v3.3.0 release\
        \ tag is NOT the SUSFS/non-KPROBE tree.\n# Use pershoot's dev-susfs branch\
        \ and pin the known v3.3.0-tagged\n# SUSFS-compatible commit instead.\ncurl\
        \ --fail --location --proto '=https' -LSs \\\n  \"https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh\"\
        \ \\\n  | bash -s \"$KSU_BRANCH\"\n\ngit -C KernelSU-Next/kernel fetch --depth=50\
        \ origin \"$KSU_REF\"\ngit -C KernelSU-Next/kernel checkout --detach \"$KSU_REF\"\
        \n\ntest -d KernelSU-Next/kernel\ntest -d KernelSU-Next/.git\ntest -e drivers/kernelsu/Kconfig\n\
        test -e KernelSU-Next/kernel/Kconfig\ntest -e KernelSU-Next/kernel/Kbuild\n\
        grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig\ngrep -q 'obj-$(CONFIG_KSU)'\
        \ drivers/Makefile\n\n# pershoot/dev-susfs Kconfig permits KSU without KPROBES\
        \ when\n# the kernel exposes its SUSFS integration marker. This exact\n# LG\
        \ 4.19 build is the non-KPROBE/manual-hook path.\nif ! grep -q '^config SUSFS$'\
        \ drivers/Kconfig; then\n  python3 - <<'PYK'\nfrom pathlib import Path\n\n\
        p = Path(\"drivers/Kconfig\")\ns = p.read_text()\nanchor = 'source \"drivers/kernelsu/Kconfig\"\
        '\nmarker = 'config SUSFS\\n\\tbool \"SUSFS integration marker\"\\n\\tdefault\
        \ y\\n\\n'\n\nif \"config SUSFS\" not in s:\n    if anchor not in s:\n   \
        \     raise SystemExit(\"KernelSU Kconfig source anchor not found\")\n   \
        \ s = s.replace(anchor, marker + anchor, 1)\n    p.write_text(s)\nPYK\nfi\n\
        grep -q '^config SUSFS$' drivers/Kconfig\n\n# setup.sh clones the pershoot\
        \ repository using a URL without \".git\".\n# Normalize both URLs before comparing;\
        \ a literal string comparison\n# incorrectly rejects a valid clone even though\
        \ the repository is correct.\nACTUAL_KSU_REPO=\"$(git -C KernelSU-Next config\
        \ --get remote.origin.url | sed -E 's#/$##; s#\\\\.git$##')\"\nEXPECTED_KSU_REPO=\"\
        ${KSU_REPO%.git}\"\ntest \"$ACTUAL_KSU_REPO\" = \"$EXPECTED_KSU_REPO\"\n\n\
        KSU_COMMIT=\"$(git -C KernelSU-Next rev-parse HEAD)\"\n\n# The pinned SUSFS-compatible\
        \ commit must still resolve to the\n# v3.3.0 release line. Do not silently\
        \ move to a different release.\nKSU_VERSION_RESOLVED=\"$(git -C KernelSU-Next\
        \ describe --tags --abbrev=0 \"$KSU_COMMIT\" 2>/dev/null || true)\"\ntest\
        \ \"$KSU_VERSION_RESOLVED\" = \"$KSU_VERSION\"\ntest \"$KSU_COMMIT\" = \"\
        $KSU_REF\"\n\n# Critical non-KPROBE compatibility checks from the actual KSU\
        \ source.\ngrep -q '^[[:space:]]*depends on KPROBES || SUSFS$' KernelSU-Next/kernel/Kconfig\n\
        grep -q '^ifneq ($(strip $(CONFIG_KSU_SUSFS)),y)$' KernelSU-Next/kernel/Kbuild\n\
        grep -q '^ifeq ($(strip $(CONFIG_KPROBES)),y)$' KernelSU-Next/kernel/Kbuild\n\
        \necho \"ksu_repo=$KSU_REPO\" | tee \"$DIAG_DIR/ksu-version.txt\"\necho \"\
        ksu_branch=$KSU_BRANCH\" | tee -a \"$DIAG_DIR/ksu-version.txt\"\necho \"ksu_tag=$KSU_VERSION_RESOLVED\"\
        \ | tee -a \"$DIAG_DIR/ksu-version.txt\"\necho \"ksu_ref=$KSU_REF\" | tee\
        \ -a \"$DIAG_DIR/ksu-version.txt\"\necho \"ksu_commit=$KSU_COMMIT\" | tee\
        \ -a \"$DIAG_DIR/ksu-version.txt\"\n\necho \"KSU_VERSION_RESOLVED=$KSU_VERSION_RESOLVED\"\
        \ >> \"$GITHUB_ENV\"\necho \"KSU_COMMIT=$KSU_COMMIT\" >> \"$GITHUB_ENV\"\n\
        \n# Exact LG 4.19 compatibility fix for KernelSU-Next v3.3.0:\n# su_mount_ns.c\
        \ includes <uapi/linux/mount.h>, but this vendor\n# 4.19 tree predates the\
        \ split of the mount UAPI header. The\n# required MS_PRIVATE/MS_REC flags\
        \ are already provided by the\n# existing <linux/fs.h> include in su_mount_ns.c,\
        \ so do not add\n# or modify a vendor UAPI header. Remove only the unavailable\n\
        # include from this KSU translation unit.\nSU_MOUNT_NS_C=\"KernelSU-Next/kernel/infra/su_mount_ns.c\"\
        \ntest -f \"$SU_MOUNT_NS_C\"\npython3 - \"$SU_MOUNT_NS_C\" <<'PY'\nfrom pathlib\
        \ import Path\nimport sys\n\np = Path(sys.argv[1])\ns = p.read_text()\nbad\
        \ = \"#include <uapi/linux/mount.h>\\n\"\nif bad in s:\n    s = s.replace(bad,\
        \ \"\", 1)\n    p.write_text(s)\n\nif \"#include <uapi/linux/mount.h>\" in\
        \ s:\n    raise SystemExit(\"unavailable uapi/linux/mount.h include remains\
        \ in su_mount_ns.c\")\n\nif \"MS_PRIVATE | MS_REC\" not in s:\n    raise SystemExit(\"\
        Expected MS_PRIVATE/MS_REC mount flags were not found in su_mount_ns.c\")\n\
        PY\n\n! grep -q '^#include <uapi/linux/mount.h>$' \"$SU_MOUNT_NS_C\"\ngrep\
        \ -q 'MS_PRIVATE | MS_REC' \"$SU_MOUNT_NS_C\"\ngrep -q '^#include <linux/fs.h>$'\
        \ \"$SU_MOUNT_NS_C\"\necho \"PASS: su_mount_ns.c uses the existing 4.19 linux/fs.h\
        \ mount flags; no unavailable uapi/linux/mount.h dependency.\"\n\necho \"\
        PASS: KernelSU-Next SUSFS-compatible repository detected.\"\n# Compile fix\
        \ for this exact 4.19 + Clang combination:\n# sulog.h declares __init/__exit\
        \ but is included directly by sulog.c,\n# so it must include linux/init.h\
        \ itself. This is the upstream fix for\n# the exact \"variable has incomplete\
        \ type 'void'\" error seen with Clang.\nSULOG_H=\"KernelSU-Next/kernel/feature/sulog.h\"\
        \ntest -f \"$SULOG_H\"\nif ! grep -q '^#include <linux/init.h>$' \"$SULOG_H\"\
        ; then\n  python3 - \"$SULOG_H\" <<'PY'\nfrom pathlib import Path\nimport\
        \ sys\np = Path(sys.argv[1])\ns = p.read_text()\nmarker = \"#include <linux/types.h>\\\
        n\"\nif \"#include <linux/init.h>\" not in s:\n    if marker not in s:\n \
        \       raise SystemExit(\"linux/types.h include anchor not found in sulog.h\"\
        )\n    s = s.replace(marker, marker + \"#include <linux/init.h>\\n\", 1)\n\
        \    p.write_text(s)\nPY\nfi\ngrep -q '^#include <linux/init.h>$' \"$SULOG_H\"\
        \necho \"PASS: sulog.h directly includes linux/init.h for Clang 4.19 build\
        \ compatibility.\"\n\n# Exact 4.19 compatibility fix for KernelSU-Next v3.3.0:\
        \ this source\n# includes linux/minmax.h in sucompat.c, but the LG 4.19 tree\
        \ does not\n# provide that header. The pinned sucompat.c does not use min/max\
        \ APIs,\n# so remove only this invalid include; do not add a new kernel header.\n\
        SUCOMPAT_C=\"KernelSU-Next/kernel/feature/sucompat.c\"\ntest -f \"$SUCOMPAT_C\"\
        \npython3 - \"$SUCOMPAT_C\" <<'PY'\nfrom pathlib import Path\nimport sys\n\
        p = Path(sys.argv[1])\ns = p.read_text()\nbad = \"#include <linux/minmax.h>\\\
        n\"\nif bad in s:\n    s = s.replace(bad, \"\", 1)\n    p.write_text(s)\n\
        PY\n! grep -q '^#include <linux/minmax.h>$' \"$SUCOMPAT_C\"\necho \"PASS:\
        \ removed only unavailable linux/minmax.h from sucompat.c for this 4.19 tree.\"\
        \n\n# Exact LG SM7250 / Android 4.19 compatibility fix:\n# KernelSU-Next v3.3.0's\
        \ seccomp cache uses\n# SECCOMP_ARCH_NATIVE_NR, but this vendor 4.19 arm64\
        \ seccomp\n# header does not export that newer helper macro. The kernel's\n\
        # native syscall count is already provided as NR_syscalls.\n#\n# Keep the\
        \ compatibility alias local to KSU's seccomp-cache\n# translation unit. Do\
        \ NOT modify the vendor seccomp ABI/header.\nSECCOMP_CACHE_C=\"KernelSU-Next/kernel/infra/seccomp_cache.c\"\
        \ntest -f \"$SECCOMP_CACHE_C\"\npython3 - \"$SECCOMP_CACHE_C\" <<'PY'\nfrom\
        \ pathlib import Path\nimport sys\n\np = Path(sys.argv[1])\ns = p.read_text()\n\
        \nmarker = \"LG 4.19: SECCOMP_ARCH_NATIVE_NR compatibility\"\nif marker not\
        \ in s:\n    compat = \"\"\"/*\n * LG 4.19: SECCOMP_ARCH_NATIVE_NR compatibility\n\
        \ *\n * This vendor Android 4.19 arm64 tree exposes the native syscall\n *\
        \ count as NR_syscalls instead of exporting the newer\n * SECCOMP_ARCH_NATIVE_NR\
        \ helper macro. Keep the compatibility\n * shim local to KSU; do not modify\
        \ the vendor seccomp ABI/header.\n */\n#if defined(CONFIG_ARM64) && !defined(SECCOMP_ARCH_NATIVE_NR)\n\
        #include <asm/unistd.h>\n#define SECCOMP_ARCH_NATIVE_NR NR_syscalls\n#endif\n\
        \n\"\"\"\n    s = compat + s\n    p.write_text(s)\n\nif \"#define SECCOMP_ARCH_NATIVE_NR\
        \ NR_syscalls\" not in s:\n    raise SystemExit(\"Expected 4.19 seccomp compatibility\
        \ definition is missing\")\nPY\n\ngrep -q 'LG 4.19: SECCOMP_ARCH_NATIVE_NR\
        \ compatibility' \"$SECCOMP_CACHE_C\"\ngrep -q '#define SECCOMP_ARCH_NATIVE_NR\
        \ NR_syscalls' \"$SECCOMP_CACHE_C\"\necho \"PASS: seccomp_cache.c uses a local\
        \ 4.19 arm64 SECCOMP_ARCH_NATIVE_NR compatibility alias.\"\n\n# Exact compile\
        \ fix for this build's intentional configuration:\n# CONFIG_KSU_SUSFS_SUS_MOUNT\
        \ is disabled. KernelSU-Next v3.3.0\n# references the SUS_MOUNT-only proc-umount\
        \ helpers from sucompat.c\n# under CONFIG_KSU_SUSFS, but those helpers are\
        \ not declared when\n# SUS_MOUNT is disabled. Guard only those calls; do not\
        \ enable\n# SUS_MOUNT and do not alter any other KSU/SUSFS code.\npython3\
        \ - \"$SUCOMPAT_C\" <<'PY'\nfrom pathlib import Path\nimport sys\np = Path(sys.argv[1])\n\
        lines = p.read_text().splitlines(keepends=True)\n\n# Work from the actual\
        \ pinned source layout instead of relying on\n# indentation. The upstream\
        \ 26fded sucompat.c has this exact block\n# inside ksu_handle_execveat_init();\
        \ vendor formatting may vary.\nfunc = next(i for i, line in enumerate(lines)\n\
        \            if line.startswith(\"int ksu_handle_execveat_init(\"))\nstart\
        \ = next(i for i in range(func, len(lines))\n             if lines[i].strip()\
        \ == \"size_t len = strlen(filename->name);\")\n\n# Locate the SUS_MOUNT-only\
        \ condition and its complete inner block.\ncond = next(i for i in range(start,\
        \ min(start + 20, len(lines)))\n            if \"susfs_is_current_proc_umounted()\"\
        \ in lines[i])\nbody_end = next(i for i in range(cond, min(cond + 20, len(lines)))\n\
        \                if lines[i].strip() == \"}\")\n\nif \"/* LG 4.19: SUS_MOUNT-only\
        \ proc-umount optimization */\" not in ''.join(lines[start:body_end + 1]):\n\
        \    indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]\n\
        \    block = lines[start:body_end + 1]\n    guarded = []\n    guarded.append(block[0])\n\
        \    guarded.append(indent + \"/* LG 4.19: SUS_MOUNT-only proc-umount optimization\
        \ */\\n\")\n    guarded.append(indent + \"#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\\\
        n\")\n    guarded.extend(block[1:])\n    guarded.append(indent + \"#endif\\\
        n\")\n    lines[start:body_end + 1] = guarded\n    p.write_text(''.join(lines))\n\
        PY\ngrep -q 'LG 4.19: SUS_MOUNT-only proc-umount optimization' \"$SUCOMPAT_C\"\
        \ngrep -Eq '^[[:space:]]*#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT$' \"$SUCOMPAT_C\"\
        \ngrep -Eq '^[[:space:]]*#endif$' \"$SUCOMPAT_C\"\necho \"PASS: sucompat SUS_MOUNT-only\
        \ proc-umount calls are guarded; SUS_MOUNT remains disabled.\"\n# LG 4.19\
        \ compatibility fix for KernelSU-Next pkg_observer.\n# Idempotent: if the\
        \ 4.19 form is already present, leave it untouched.\nPKG_OBSERVER_C=\"KernelSU-Next/kernel/manager/pkg_observer.c\"\
        \ntest -f \"$PKG_OBSERVER_C\"\npython3 - \"$PKG_OBSERVER_C\" <<'PY'\nfrom\
        \ pathlib import Path\nimport re\nimport sys\n\np = Path(sys.argv[1])\ns =\
        \ p.read_text()\n\nalready_fixed = (\n    re.search(r'\\.handle_event\\s*=\\\
        s*ksu_handle_event\\s*,', s) and\n    re.search(r'static\\s+int\\s+ksu_handle_event\\\
        s*\\(\\s*struct\\s+fsnotify_group\\s*\\*group', s)\n)\n\nif already_fixed:\n\
        \    print(\"PASS: pkg_observer already uses the LG 4.19 handle_event API;\
        \ untouched.\")\nelse:\n    modern = re.search(\n        r'static\\s+int\\\
        s+ksu_handle_inode_event\\s*\\(.*?\\n\\s*\\}\\s*\\n'\n        r'\\s*static\\\
        s+const\\s+struct\\s+fsnotify_ops\\s+ksu_ops\\s*=\\s*\\{'\n        r'.*?\\\
        .handle_inode_event\\s*=\\s*ksu_handle_inode_event\\s*,\\s*\\n\\s*\\};',\n\
        \        s, re.S)\n    if not modern:\n        raise SystemExit(\n       \
        \     \"ERROR: pkg_observer is neither already-fixed 4.19 form nor a recognizable\
        \ \"\n            \"KernelSU-Next handle_inode_event form; refusing blind\
        \ edits.\"\n        )\n\n    legacy = \"\"\"static int ksu_handle_event(struct\
        \ fsnotify_group *group,\n        struct inode *inode, u32 mask,\n       \
        \ const void *data, int data_type,\n        const unsigned char *file_name,\
        \ u32 cookie,\n        struct fsnotify_iter_info *iter_info)\n{\n    if (!file_name)\n\
        \        return 0;\n    if (mask & FS_ISDIR)\n        return 0;\n    if (!memcmp(file_name,\
        \ \"packages.list\", 13) &&\n        file_name[13] == '\\\\0') {\n       \
        \ track_throne(false);\n    }\n    return 0;\n}\nstatic const struct fsnotify_ops\
        \ ksu_ops = {\n    .handle_event = ksu_handle_event,\n};\"\"\"\n    s = s[:modern.start()]\
        \ + legacy + s[modern.end():]\n    p.write_text(s)\n    print(\"PASS: adapted\
        \ pkg_observer to native LG 4.19 handle_event API.\")\n\ns = p.read_text()\n\
        if re.search(r'\\.handle_inode_event\\s*=\\s*ksu_handle_inode_event', s):\n\
        \    raise SystemExit(\"ERROR: incompatible handle_inode_event assignment\
        \ remains.\")\nif not re.search(r'\\.handle_event\\s*=\\s*ksu_handle_event\\\
        s*,', s):\n    raise SystemExit(\"ERROR: LG 4.19 handle_event assignment is\
        \ missing.\")\nif not re.search(r'static\\s+int\\s+ksu_handle_event\\s*\\\
        (\\s*struct\\s+fsnotify_group\\s*\\*group', s):\n    raise SystemExit(\"ERROR:\
        \ LG 4.19 callback function is missing.\")\nif \"packages.list detected:\"\
        \ in s:\n    raise SystemExit(\"ERROR: obsolete/malformed packages.list diagnostic\
        \ string remains.\")\nif \"file_name[13] == '\\\\0'\" not in s:\n    raise\
        \ SystemExit(\"ERROR: packages.list exact-name guard is missing.\")\nprint(\"\
        PASS: pkg_observer 4.19 compatibility + syntax audit completed.\")\nPY\n"
    - name: 05A - Fix KernelSU allowlist for native LG 4.19 task_work API
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/05a-allowlist-4.19.log\"\
        ) 2>&1\ncd \"$GITHUB_WORKSPACE/kernel\"\n\n# LG Android 4.19 compatibility\
        \ for the pinned KernelSU-Next allowlist.c.\n# Linux 4.19 exposes task_work_add(task,\
        \ work, bool) and does NOT define\n# TWA_RESUME. The same 4.19 tree provides\
        \ put_task_struct() from\n# <linux/sched/task.h>, but allowlist.c only included\
        \ task_work.h.\n#\n# Do not modify the vendor task_work/scheduler headers.\
        \ Adapt only this\n# KSU translation unit, preserving the original \"notify\
        \ on resume\" semantics:\n# TWA_RESUME (modern KSU) -> true (native 4.19 API).\n\
        ALLOWLIST_C=\"KernelSU-Next/kernel/policy/allowlist.c\"\ntest -f \"$ALLOWLIST_C\"\
        \npython3 - \"$ALLOWLIST_C\" <<'PY'\nfrom pathlib import Path\nimport sys\n\
        \np = Path(sys.argv[1])\ns = p.read_text()\n\n# 4.19 exports put_task_struct()\
        \ through this header. Add it only if needed.\nif '#include <linux/sched/task.h>'\
        \ not in s:\n    anchor = '#include <linux/task_work.h>\\n'\n    if anchor\
        \ not in s:\n        raise SystemExit('allowlist.c task_work.h include anchor\
        \ not found')\n    s = s.replace(anchor, anchor + '#include <linux/sched/task.h>\\\
        n', 1)\n\n# Native 4.19 task_work_add() takes bool notify. Keep the modern\
        \ source\n# behavior by translating only this call from TWA_RESUME to true.\n\
        if 'task_work_add(tsk, cb, TWA_RESUME)' in s:\n    s = s.replace('task_work_add(tsk,\
        \ cb, TWA_RESUME)',\n                  'task_work_add(tsk, cb, true)', 1)\n\
        elif 'task_work_add(tsk, cb, true)' in s:\n    pass\nelse:\n    raise SystemExit('allowlist\
        \ task_work_add call is neither modern nor already-fixed 4.19 form')\n\np.write_text(s)\n\
        PY\n\ngrep -q '^#include <linux/sched/task.h>$' \"$ALLOWLIST_C\"\n! grep -q\
        \ 'task_work_add(tsk, cb, TWA_RESUME)' \"$ALLOWLIST_C\"\ngrep -q 'task_work_add(tsk,\
        \ cb, true)' \"$ALLOWLIST_C\"\n\necho 'PASS: allowlist.c uses native LG 4.19\
        \ task_work_add(..., true) and includes put_task_struct declaration.'\n"
    - name: 06 - Download and VERIFY SUSFS kernel-4.19 latest branch
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/06-susfs.log\"\
        ) 2>&1\ncd \"$GITHUB_WORKSPACE\"\nrm -rf susfs4ksu\n\n# For Linux 4.19, the\
        \ official SUSFS kernel-4.19 branch is the\n# maintained kernel-specific source.\
        \ It currently contains SUSFS\n# 1.5.5-era kernel-4.19 patches.\ngit clone\
        \ --depth=1 --branch \"$SUSFS_VERSION\" \\\n  https://gitlab.com/simonpunk/susfs4ksu.git\
        \ susfs4ksu\n\ntest -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch\n\
        test -f susfs4ksu/kernel_patches/fs/susfs.c\ntest -f susfs4ksu/kernel_patches/fs/sus_su.c\n\
        test -f susfs4ksu/kernel_patches/include/linux/susfs.h\ntest -f susfs4ksu/kernel_patches/include/linux/sus_su.h\n\
        \n# CRITICAL: the legacy KernelSU patch must NOT be used with\n# KernelSU-Next.\
        \ Fail early if it somehow appears in the workflow.\nif test -e susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch;\
        \ then\n  echo \"INFO: legacy KernelSU SUSFS patch exists upstream, but it\
        \ will NOT be copied/applied.\"\nfi\n\nSUSFS_COMMIT=\"$(git -C susfs4ksu rev-parse\
        \ HEAD)\"\ntest \"$SUSFS_COMMIT\" = \"$SUSFS_REF\"\necho \"susfs_branch=$SUSFS_VERSION\"\
        \ | tee \"$DIAG_DIR/susfs-version.txt\"\necho \"susfs_commit=$SUSFS_COMMIT\"\
        \ | tee -a \"$DIAG_DIR/susfs-version.txt\"\n\necho \"PASS: official SUSFS\
        \ kernel-4.19 source verified.\"\n"
    - name: 07 - Apply SUSFS kernel-4.19 patch with source-specific fixes
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/07-patches.log\"\
        ) 2>&1\ncd \"$GITHUB_WORKSPACE/kernel\"\n\nPATCH_FILE=\"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch\"\
        \n\n# KernelSU-Next SUSFS support is supplied by the SUSFS-compatible\n# KernelSU-Next\
        \ tree from Step 05. Do NOT apply the legacy\n# KernelSU/10_enable_susfs_for_ksu.patch.\n\
        \ncp \"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c\" fs/susfs.c\n\
        cp \"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c\" fs/sus_su.c\n\
        cp \"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h\" include/linux/susfs.h\n\
        cp \"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/sus_su.h\" include/linux/sus_su.h\n\
        cp \"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs_def.h\"\
        \ include/linux/susfs_def.h\n\n# LG Velvet's three vendor-layout files are\
        \ handled below against the\n# actual source. Remove ONLY those three file\
        \ sections from the\n# upstream patch so patch(1) never creates misleading\
        \ .rej files.\n# fs/namespace.c remains excluded exactly as before.\npython3\
        \ - \"$PATCH_FILE\" \"$RUNNER_TEMP/50_susfs-lg-vendor-neutral.patch\" <<'PY'\n\
        import sys\nsrc, dst = sys.argv[1], sys.argv[2]\nexcluded = {\n    \"fs/Makefile\"\
        ,\n    \"fs/namei.c\",\n    \"fs/namespace.c\",\n    \"fs/proc/cmdline.c\"\
        ,\n    \"fs/proc/task_mmu.c\",\n    \"include/linux/mount.h\",\n}\nlines =\
        \ open(src, encoding=\"utf-8\").read().splitlines(True)\nout = []\nblock =\
        \ []\nkeep = True\n\ndef flush():\n    if keep:\n        out.extend(block)\n\
        \nfor line in lines:\n    if line.startswith(\"diff --git \"):\n        flush()\n\
        \        block = [line]\n        parts = line.split()\n        path = parts[2][2:]\
        \ if len(parts) >= 3 and parts[2].startswith(\"a/\") else \"\"\n        keep\
        \ = path not in excluded\n    else:\n        block.append(line)\nflush()\n\
        \nopen(dst, \"w\", encoding=\"utf-8\").writelines(out)\nPY\n\ntest -s \"$RUNNER_TEMP/50_susfs-lg-vendor-neutral.patch\"\
        \nfor excluded in \\\n  fs/Makefile \\\n  fs/namei.c \\\n  fs/namespace.c\
        \ \\\n  fs/proc/cmdline.c \\\n  fs/proc/task_mmu.c \\\n  include/linux/mount.h;\
        \ do\n  if grep -q \"^diff --git a/$excluded b/$excluded\" \\\n    \"$RUNNER_TEMP/50_susfs-lg-vendor-neutral.patch\"\
        ; then\n    echo \"::error::Excluded vendor-layout file leaked into SUSFS\
        \ patch: $excluded\"\n    exit 1\n  fi\ndone\n\n# Apply the generic SUSFS\
        \ hunks with ZERO FUZZ.\n#\n# Two files are intentionally excluded because\
        \ this LG tree is not\n# byte-for-byte identical to the generic 4.19 patch\
        \ base:\n#   - fs/Makefile: vendor object list/context differs.\n#   - fs/namei.c:\
        \ LG uses the 4.19 mnt-aware may_create() API.\n#\n# Those two SUSFS changes\
        \ are applied source-aware immediately after\n# this generic patch. This is\
        \ preferable to allowing patch(1) to\n# guess with fuzz or to silently accept\
        \ a wrong context match.\necho \"Applying SUSFS generic hunks with STRICT\
        \ fuzz limit: 0\"\necho \"LG-specific fs/Makefile and fs/namei.c hunks are\
        \ handled source-aware.\"\n\nrm -f fs/Makefile.rej fs/namei.c.rej fs/Makefile.orig\
        \ fs/namei.c.orig\npatch --forward --batch --fuzz=0 -l --no-backup-if-mismatch\
        \ -p1 \\\n  < \"$RUNNER_TEMP/50_susfs-lg-vendor-neutral.patch\"\n\nif find\
        \ . -type f -name '*.rej' -print -quit | grep -q .; then\n  echo \"::error::SUSFS\
        \ generic patch produced reject files.\"\n  find . -type f -name '*.rej' -print\n\
        \  exit 1\nfi\n\n# ---------------------------------------------------------------\n\
        # LG 4.19 source-aware SUSFS integration: fs/Makefile\n# ---------------------------------------------------------------\n\
        python3 - <<'PY'\nfrom pathlib import Path\np = Path(\"fs/Makefile\")\ns =\
        \ p.read_text()\nline = \"obj-$(CONFIG_KSU_SUSFS) += susfs.o\"\nif line not\
        \ in s:\n    anchor = \"fs_context.o fs_parser.o\\n\"\n    if anchor not in\
        \ s:\n        raise SystemExit(\"ERROR: fs/Makefile SUSFS anchor not found\"\
        )\n    s = s.replace(anchor, anchor + \"\\n\" + line + \"\\n\", 1)\n    p.write_text(s)\n\
        if line not in p.read_text():\n    raise SystemExit(\"ERROR: fs/Makefile SUSFS\
        \ object integration failed\")\nPY\n\n# ---------------------------------------------------------------\n\
        # LG 4.19 source-aware SUSFS integration: fs/namei.c / may_create()\n#\n#\
        \ The upstream 4.19 patch assumes an older may_create() signature.\n# This\
        \ LG tree has:\n#   may_create(struct vfsmount *mnt, struct inode *dir, ...)\n\
        # so preserve the vendor mnt-aware permission path and add only the\n# SUS_PATH\
        \ check from the upstream hunk.\n# ---------------------------------------------------------------\n\
        python3 - <<'PY'\nfrom pathlib import Path\np = Path(\"fs/namei.c\")\ns =\
        \ p.read_text()\n\nif \"LG 4.19: SUSFS_SUS_PATH may_create integration\" not\
        \ in s:\n    needle = \"\"\"static inline int may_create(struct vfsmount *mnt,\
        \ struct inode *dir, struct dentry *child)\n{\n\\tstruct user_namespace *s_user_ns;\n\
        \\taudit_inode_child(dir, child, AUDIT_TYPE_CHILD_CREATE);\n\"\"\"\n    replacement\
        \ = \"\"\"static inline int may_create(struct vfsmount *mnt, struct inode\
        \ *dir, struct dentry *child)\n{\n\\t/* LG 4.19: SUSFS_SUS_PATH may_create\
        \ integration */\n\\tstruct user_namespace *s_user_ns;\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\
        \\tint error;\n#endif\n\\taudit_inode_child(dir, child, AUDIT_TYPE_CHILD_CREATE);\n\
        #ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\\tif (child->d_inode &&\n\\t    unlikely(child->d_inode->i_state\
        \ & INODE_STATE_SUS_PATH) &&\n\\t    likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC))\
        \ {\n\\t\\terror = inode_permission2(mnt, dir, MAY_WRITE | MAY_EXEC);\n\\\
        t\\tif (error)\n\\t\\t\\treturn error;\n\\t\\treturn -ENOENT;\n\\t}\n#endif\n\
        \"\"\"\n    if needle not in s:\n        raise SystemExit(\"ERROR: LG may_create()\
        \ anchor not found\")\n    s = s.replace(needle, replacement, 1)\n    p.write_text(s)\n\
        \nif \"LG 4.19: SUSFS_SUS_PATH may_create integration\" not in p.read_text():\n\
        \    raise SystemExit(\"ERROR: namei.c SUSFS may_create integration failed\"\
        )\nPY\n\ngrep -Fq 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile\ngrep -Fq\
        \ 'LG 4.19: SUSFS_SUS_PATH may_create integration' fs/namei.c\ngrep -Fq 'inode_permission2(mnt,\
        \ dir, MAY_WRITE | MAY_EXEC)' fs/namei.c\n\necho \"PASS: generic SUSFS patch\
        \ applied with fuzz=0 and no rejects.\"\necho \"PASS: LG fs/Makefile SUSFS\
        \ object integration applied source-aware.\"\necho \"PASS: LG fs/namei.c may_create\
        \ SUS_PATH integration applied source-aware.\"\necho \"PASS: no legacy KernelSU\
        \ SUSFS patch applied.\"\necho \"PASS: fs/namespace.c remains excluded as\
        \ requested.\"\n\n# 1) Vendor cmdline.c keeps LGE's updated_command_line logic.\n\
        # Insert the official SUSFS hook at the output point, AFTER the\n# existing\
        \ LGE boot-mode adjustment. Do not replace vendor behavior.\npython3 - <<'PY'\n\
        from pathlib import Path\np = Path(\"fs/proc/cmdline.c\")\ns = p.read_text()\n\
        \ninc = \"\"\"#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\nextern\
        \ int susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n#endif\n\"\"\
        \"\nif \"extern int susfs_spoof_cmdline_or_bootconfig\" not in s:\n    anchor\
        \ = \"#include <linux/seq_file.h>\\n\"\n    if anchor not in s:\n        raise\
        \ SystemExit(\"cmdline.c seq_file include anchor not found\")\n    s = s.replace(anchor,\
        \ anchor + inc, 1)\n\nhook = \"\"\"#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n\
        \    if (!susfs_spoof_cmdline_or_bootconfig(m)) {\n        seq_putc(m, '\\\
        \\n');\n        return 0;\n    }\n#endif\n\"\"\"\nif \"susfs_spoof_cmdline_or_bootconfig(m)\"\
        \ not in s:\n    anchor = \"\\tseq_puts(m, updated_command_line);\\n\"\n \
        \   if anchor not in s:\n        raise SystemExit(\"cmdline.c updated_command_line\
        \ output anchor not found\")\n    s = s.replace(anchor, hook + anchor, 1)\n\
        \np.write_text(s)\nPY\n\n# 2) task_mmu.c: recreate the two upstream SUSFS\
        \ hunks against the\n# actual LG include block and show_map_vma location.\n\
        python3 - <<'PY'\nfrom pathlib import Path\np = Path(\"fs/proc/task_mmu.c\"\
        )\ns = p.read_text()\n\nif \"#include <linux/susfs_def.h>\" not in s:\n  \
        \  anchor = \"#include <linux/mm_inline.h>\\n\"\n    if anchor not in s:\n\
        \        raise SystemExit(\"task_mmu.c mm_inline include anchor not found\"\
        )\n    inc = \"\"\"#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n\
        #endif\n\"\"\"\n    s = s.replace(anchor, anchor + inc, 1)\n\ndecl = \"\"\"\
        #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\nextern void susfs_sus_ino_for_show_map_vma(unsigned\
        \ long ino, dev_t *out_dev, unsigned long *out_ino);\n#endif\n\n\"\"\"\nif\
        \ \"extern void susfs_sus_ino_for_show_map_vma\" not in s:\n    needle = \"\
        static void\\nshow_map_vma(\"\n    pos = s.find(needle)\n    if pos < 0:\n\
        \        raise SystemExit(\"task_mmu.c show_map_vma anchor not found\")\n\
        \    s = s[:pos] + decl + s[pos:]\n\np.write_text(s)\nPY\n\n# 4) CONFIG_KSU_SUSFS_SUS_MOUNT\
        \ is intentionally disabled in this\n# non-GKI build. The pinned KernelSU-Next\
        \ SUSFS branch leaves\n# susfs_set_current_proc_umounted() in setuid_hook.c\
        \ under the broader\n# CONFIG_KSU_SUSFS branch, but that helper is only declared\
        \ when\n# CONFIG_KSU_SUSFS_SUS_MOUNT is enabled. Guard only that unavailable\n\
        # call; do not enable SUS_MOUNT and do not change the surrounding\n# setuid/umount\
        \ logic.\npython3 - <<'PY'\nfrom pathlib import Path\np = Path(\"KernelSU-Next/kernel/hook/setuid_hook.c\"\
        )\ns = p.read_text()\ntarget = \"    susfs_set_current_proc_umounted();\\\
        n\"\nif \"LG 4.19: SUS_MOUNT-only proc-umount marker\" not in s:\n    if target\
        \ not in s:\n        raise SystemExit(\"setuid_hook.c SUS_MOUNT proc-umount\
