name: Build WORKING 4.19 Non-GKI + KernelSU-Next + SUSFS

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  KERNEL_REPO: https://github.com/afzalhaider8755silk-cell/android_kernel_lge_sm7250.git
  KERNEL_BRANCH: sixteen

  DEFCONFIG: vendor/caymanlm_defconfig

  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
  KSU_REF: v3.3.0

  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_REF: 1.4.2-kernel-4.19

  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/ndk-r29/clang-r563880c.tar.gz

jobs:

  build:
    name: Build WORKING 4.19 Non-GKI + KSU-Next + SUSFS
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 00. SETUP
      # ============================================================

      - name: Set up job
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip zip bc bison flex \
            build-essential ccache \
            libssl-dev libelf-dev \
            python3 python3-pip \
            rsync pahole

          mkdir -p "$GITHUB_WORKSPACE/kernel"
          mkdir -p "$GITHUB_WORKSPACE/out"
          mkdir -p "$GITHUB_WORKSPACE/toolchains"

      # ============================================================
      # 01. CHECKOUT EXACT WORKING KERNEL SOURCE
      # ============================================================

      - name: 01 - Checkout EXACT WORKING kernel source
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            .

          echo "SOURCE_BRANCH=$(git branch --show-current)"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"

          git status --short

      # ============================================================
      # 02. INSTALL BUILD DEPENDENCIES + GCC 4.9 WRAPPER
      # ============================================================

      - name: 02 - Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get install -y gcc-11 g++-11

          mkdir -p "$GITHUB_WORKSPACE/toolchains/gcc-wrapper"

          cat > "$GITHUB_WORKSPACE/toolchains/gcc-wrapper/aarch64-linux-android-gcc" <<'EOF'
          #!/bin/bash
          exec gcc-11 "$@"
          EOF

          cat > "$GITHUB_WORKSPACE/toolchains/gcc-wrapper/arm-linux-androideabi-gcc" <<'EOF'
          #!/bin/bash
          exec gcc-11 "$@"
          EOF

          chmod +x "$GITHUB_WORKSPACE/toolchains/gcc-wrapper/"*

      # ============================================================
      # 03. DOWNLOAD EXACT ANDROID CLANG
      # ============================================================

      - name: 03 - Download EXACT Android Clang r563880c
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/toolchains"

          curl -L --fail \
            "${CLANG_URL}" \
            -o clang.tar.gz

          mkdir -p clang-r563880c

          tar -xzf clang.tar.gz \
            -C clang-r563880c

          test -x clang-r563880c/bin/clang

          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang-r563880c" >> "$GITHUB_ENV"

      # ============================================================
      # 04. LOAD + VERIFY EXACT WORKING BASELINE CONFIG
      # ============================================================

      - name: 04 - Load and VERIFY exact WORKING baseline config
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          test -f "arch/arm64/configs/${DEFCONFIG}"

          mkdir -p "$GITHUB_WORKSPACE/diagnostics"

          cp \
            "arch/arm64/configs/${DEFCONFIG}" \
            "$GITHUB_WORKSPACE/diagnostics/working-baseline.config"

          sha256sum \
            "$GITHUB_WORKSPACE/diagnostics/working-baseline.config" \
            | tee "$GITHUB_WORKSPACE/diagnostics/baseline-config.sha256"

          echo "Expected working baseline:"
          echo "8b931841bcfcfad0b8ed596fbc156e67a6da8f32f226753ffabc89c907accffa"

          ACTUAL_SHA256=$(sha256sum \
            "$GITHUB_WORKSPACE/diagnostics/working-baseline.config" \
            | awk '{print $1}')

          if [ "$ACTUAL_SHA256" != \
            "8b931841bcfcfad0b8ed596fbc156e67a6da8f32f226753ffabc89c907accffa" ]; then
            echo "::error::WORKING baseline config SHA256 mismatch"
            exit 1
          fi

          echo "PASS: exact WORKING baseline config verified."

      # ============================================================
      # 05. INTEGRATE KERNELSU-NEXT v3.3.0
      # ============================================================

      - name: 05 - Integrate ONLY KernelSU-Next v3.3.0
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          echo "Installing KernelSU-Next ${KSU_REF}"

          curl --fail --location \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_REF}/kernel/setup.sh" \
            | bash -s "${KSU_REF}"

          test -d KernelSU-Next/kernel
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile

          KSU_COMMIT=$(git -C KernelSU-Next rev-parse HEAD)

          echo "KSU_TAG=${KSU_REF}" >> "$GITHUB_ENV"
          echo "KSU_COMMIT=${KSU_COMMIT}" >> "$GITHUB_ENV"

          echo "KernelSU-Next:"
          echo "  tag    = ${KSU_REF}"
          echo "  commit = ${KSU_COMMIT}"

      # ============================================================
      # 06. DOWNLOAD + VERIFY SUSFS 4.19 COMPATIBLE RELEASE
      # ============================================================

      - name: 06 - Download and VERIFY SUSFS 4.19 compatible release
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          rm -rf susfs4ksu

          git clone \
            --depth=1 \
            --branch "${SUSFS_REF}" \
            "${SUSFS_REPO}" \
            susfs4ksu

          test -f \
            "susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          test -f \
            "susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"

          test -f \
            "susfs4ksu/kernel_patches/fs/susfs.c"

          test -f \
            "susfs4ksu/kernel_patches/include/linux/susfs.h"

          SUSFS_COMMIT=$(git -C susfs4ksu rev-parse HEAD)

          echo "SUSFS_TAG=${SUSFS_REF}" >> "$GITHUB_ENV"
          echo "SUSFS_COMMIT=${SUSFS_COMMIT}" >> "$GITHUB_ENV"

          echo "SUSFS:"
          echo "  tag    = ${SUSFS_REF}"
          echo "  commit = ${SUSFS_COMMIT}"

      # ============================================================
      # 07. APPLY SUSFS — FIXED FOR MODULAR KERNELSU-NEXT
      # ============================================================

      - name: 07 - Apply SUSFS safely for WORKING 4.19 source
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          echo "Applying SUSFS kernel files..."

          # --------------------------------------------------------
          # IMPORTANT:
          # DO NOT copy:
          #   KernelSU/kernel/sucompat.h
          #
          # That was the previous failure:
          #   cp: cannot create regular file
          #   'KernelSU/kernel/sucompat.h':
          #   No such file or directory
          #
          # KernelSU-Next v3.3.0 uses the modular tree.
          # --------------------------------------------------------

          cp \
            susfs4ksu/kernel_patches/fs/* \
            fs/

          cp \
            susfs4ksu/kernel_patches/include/linux/* \
            include/linux/

          # Apply SUSFS changes to KernelSU-Next itself.
          cd KernelSU-Next

          patch \
            --forward \
            --batch \
            -p1 \
            < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          cd ..

          # Apply kernel-side SUSFS patch.
          patch \
            --forward \
            --batch \
            -p1 \
            < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          echo "PASS: SUSFS patches applied."

      # ============================================================
      # 07B. DISABLE SUS-SU / KPROBES PATH
      # ============================================================

      - name: 07B - Disable SUS-SU and KPROBES path
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          # Your known-good build uses manual/non-KPROBE integration.
          # SUS-SU depends on the KPROBE hook path, so explicitly disable it.

          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "CONFIG_KSU_KPROBES_HOOK=n" >> \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "CONFIG_KSU_SUSFS=y" >> \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=n" >> \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "CONFIG_KSU_SUSFS_SUS_PATH=n" >> \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> \
            "arch/arm64/configs/${DEFCONFIG}"

      # ============================================================
      # 08. VERIFY MANUAL KERNELSU HOOKS / NO KPROBES
      # ============================================================

      - name: 08 - Verify KernelSU manual-hook mode WITHOUT KPROBES
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          if grep -q \
            'CONFIG_KSU_KPROBES_HOOK=y' \
            "arch/arm64/configs/${DEFCONFIG}"; then
            echo "::error::KPROBES unexpectedly enabled"
            exit 1
          fi

          grep -q 'CONFIG_KSU=y' \
            "arch/arm64/configs/${DEFCONFIG}" || true

          grep -q 'CONFIG_KSU_SUSFS=y' \
            "arch/arm64/configs/${DEFCONFIG}" || true

          echo "PASS: KPROBES disabled."

      # ============================================================
      # 09. CONFIGURE ONLY KSU / SUSFS
      # ============================================================

      - name: 09 - Configure ONLY KSU/SUSFS
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            "${DEFCONFIG}"

          # KSU must be enabled.
          scripts/config \
            --file "$GITHUB_WORKSPACE/out/.config" \
            -e KSU

          # SUSFS must be enabled.
          scripts/config \
            --file "$GITHUB_WORKSPACE/out/.config" \
            -e KSU_SUSFS

          # KPROBES/SUS-SU stay disabled.
          scripts/config \
            --file "$GITHUB_WORKSPACE/out/.config" \
            -d KSU_KPROBES_HOOK

          scripts/config \
            --file "$GITHUB_WORKSPACE/out/.config" \
            -d KSU_SUSFS_SUS_SU

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          cp \
            "$GITHUB_WORKSPACE/out/.config" \
            "$GITHUB_WORKSPACE/diagnostics/final-or-last.config"

          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_KPROBES_HOOK=|CONFIG_KSU_SUSFS_SUS_' \
            "$GITHUB_WORKSPACE/out/.config" \
            | tee "$GITHUB_WORKSPACE/diagnostics/ksu-susfs-config.log"

      # ============================================================
      # 10. VERIFY SOURCE SCOPE
      # ============================================================

      - name: 10 - Verify source scope
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          git status --short

          git diff --stat \
            | tee "$GITHUB_WORKSPACE/diagnostics/git-diff-stat.txt"

          git diff --name-only \
            | tee "$GITHUB_WORKSPACE/diagnostics/git-diff-files.txt"

          echo "Expected modifications:"
          echo "  KernelSU-Next/"
          echo "  drivers/Kconfig"
          echo "  drivers/Makefile"
          echo "  drivers/kernelsu"
          echo "  fs/susfs.c"
          echo "  include/linux/susfs.h"

      # ============================================================
      # 11. BUILD RAW WORKING KERNEL IMAGE
      # ============================================================

      - name: 11 - Build RAW WORKING kernel image
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail

          export PATH="$CLANG_DIR/bin:$PATH"

          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc-wrapper/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc-wrapper/arm-linux-androideabi-"

          make -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            Image.gz-dtb

          test -f \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb" \
            "$GITHUB_WORKSPACE/LG-Velvet-4.19-KSUN-SUSFS-Image.gz-dtb"

      # ============================================================
      # 12. FINAL SAFETY CHECKS
      # ============================================================

      - name: 12 - Final safety checks
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail

          test -f \
            "$GITHUB_WORKSPACE/LG-Velvet-4.19-KSUN-SUSFS-Image.gz-dtb"

          test -f \
            "$GITHUB_WORKSPACE/out/.config"

          echo "=== KernelSU symbols ==="
          grep -R \
            -m 5 \
            "ksu_" \
            KernelSU-Next/kernel \
            | head -5 || true

          echo "=== SUSFS symbols ==="
          grep -R \
            -m 10 \
            "susfs_" \
            fs/susfs.c \
            include/linux/susfs.h \
            | head -10 || true

          echo "=== Final config ==="
          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_KPROBES_HOOK=|CONFIG_KSU_SUSFS_SUS_SU=' \
            "$GITHUB_WORKSPACE/out/.config"

          echo "FINAL SAFETY CHECKS PASSED."

      # ============================================================
      # 13. PACKAGE DIAGNOSTICS ALWAYS
      # ============================================================

      - name: 13 - Package diagnostics ALWAYS
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$GITHUB_WORKSPACE/diagnostics"

          uname -a \
            > "$GITHUB_WORKSPACE/diagnostics/runner.txt"

          {
            echo "KSU_TAG=${KSU_REF}"
            echo "KSU_COMMIT=${KSU_COMMIT:-unknown}"
            echo "SUSFS_TAG=${SUSFS_REF}"
            echo "SUSFS_COMMIT=${SUSFS_COMMIT:-unknown}"
            echo "SOURCE_BRANCH=${KERNEL_BRANCH}"
          } > "$GITHUB_WORKSPACE/diagnostics/build-metadata.txt"

          git -C "$GITHUB_WORKSPACE/kernel" status --short \
            > "$GITHUB_WORKSPACE/diagnostics/git-status.txt" 2>&1 || true

          git -C "$GITHUB_WORKSPACE/kernel" diff \
            > "$GITHUB_WORKSPACE/diagnostics/kernel-source.patch" 2>&1 || true

          tar -czf \
            "$GITHUB_WORKSPACE/LG-Velvet-KSU-SUSFS-diagnostics.tar.gz" \
            -C "$GITHUB_WORKSPACE" \
            diagnostics \
            2>/dev/null || true

      # ============================================================
      # 14. UPLOAD RAW KERNEL ONLY ON SUCCESS
      # ============================================================

      - name: 14 - Upload RAW kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-4.19-KSUN-SUSFS-RAW
          path: LG-Velvet-4.19-KSUN-SUSFS-Image.gz-dtb
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 15. UPLOAD COMPLETE DIAGNOSTICS ALWAYS
      # ============================================================

      - name: 15 - Upload COMPLETE diagnostics ALWAYS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSU-SUSFS-diagnostics-${{ github.run_id }}
          path: |
            diagnostics/**
            LG-Velvet-KSU-SUSFS-diagnostics.tar.gz
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 16. PRINT ARTIFACT LOCATION
      # ============================================================

      - name: 16 - Print artifact location
        if: always()
        shell: bash
        run: |
          echo "=============================================================="
          echo "WORKFLOW FINISHED"
          echo "=============================================================="
          echo "KSU-Next : ${KSU_REF}"
          echo "SUSFS    : ${SUSFS_REF}"
          echo
          echo "RAW KERNEL:"
          echo "LG-Velvet-4.19-KSUN-SUSFS-RAW"
          echo
          echo "DIAGNOSTICS:"
          echo "LG-Velvet-KSU-SUSFS-diagnostics-${{ github.run_id }}"
          echo "=============================================================="
