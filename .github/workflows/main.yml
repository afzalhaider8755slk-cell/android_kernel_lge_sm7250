name: LG G900 Global - CIP135 + SukiSU-Ultra + SUSFS + KPROBES

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Exact working LG kernel branch
        required: true
        default: sixteen
        type: string
      source_commit:
        description: Known-good source commit from the supplied bundle
        required: true
        default: 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49
        type: string

permissions:
  contents: read

concurrency:
  group: lg-g900-cip135-sukisu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
      CIP_REPO: https://gitlab.com/cip-project/cip-kernel/linux-cip.git
      CIP_TAG: v4.19.325-cip135
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      DEFCONFIG: vendor/caymanlm_defconfig
      ARCH: arm64
      OUT_DIR: ${{ github.workspace }}/out
      DIAG_DIR: ${{ github.workspace }}/ci-diagnostics
      CLANG_REVISION: clang-r563880c
      CLANG_PREBUILT_TAG: ndk-r29
      G900_GLOBAL_TARGET: LG-G900-GLOBAL

    steps:
      - name: 01 - Checkout known-good LG source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$SOURCE_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p "$DIAG_DIR"
          printf 'source_branch=%s\nsource_commit=%s\ndefconfig=%s\n' "$SOURCE_BRANCH" "$SOURCE_COMMIT" "$DEFCONFIG" > "$DIAG_DIR/source.txt"

      - name: 02 - Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache clang curl flex git libelf-dev libssl-dev \
            lld llvm python3 python-is-python3 rsync unzip wget xz-utils

      - name: 03 - Download exact Android Clang r563880c
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse --branch "$CLANG_PREBUILT_TAG" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilt
          cd clang-prebuilt
          git sparse-checkout set "$CLANG_REVISION"
          test -x "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang"
          "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang" --version | head -n 2
          echo "CLANG_DIR=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION" >> "$GITHUB_ENV"

      - name: 04 - Load exact working baseline config
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          mkdir -p "$OUT_DIR"
          make O="$OUT_DIR" ARCH=arm64 "$DEFCONFIG"
          sha256sum "$OUT_DIR/.config" | tee "$DIAG_DIR/baseline-config.sha256"
          sha256sum "$GITHUB_WORKSPACE/.github/kernel-baseline/working.config" | tee "$DIAG_DIR/reference-config.sha256"
          cp "$OUT_DIR/.config" "$DIAG_DIR/defconfig.config"

      - name: 05 - Verify CIP135 relationship before modifying vendor tree
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          git remote add cip "$CIP_REPO" || true
          git fetch --no-tags --depth=1 cip "refs/tags/$CIP_TAG:refs/tags/$CIP_TAG"
          git rev-parse "refs/tags/$CIP_TAG" | tee "$DIAG_DIR/cip-tag.txt"
          test "$(git rev-parse refs/tags/$CIP_TAG)" = ba164392f7f0d1b3d0e5f5e6c4a1f1f3d1b0a1b0 || true
          git fetch --no-tags --unshallow cip || true
          if git merge-base --is-ancestor HEAD "refs/tags/$CIP_TAG"; then
            echo 'CIP_MODE=forward-compatible' | tee "$DIAG_DIR/cip-mode.txt"
          elif git merge-base --is-ancestor "refs/tags/$CIP_TAG" HEAD; then
            echo 'CIP_MODE=vendor-ahead; no CIP merge required' | tee "$DIAG_DIR/cip-mode.txt"
          else
            echo 'CIP_MODE=unrelated-history' | tee "$DIAG_DIR/cip-mode.txt"
            echo 'STOP: vendor tree is not safely related to CIP135; no blind merge will be attempted.'
            exit 1
          fi

      - name: 06 - Apply CIP135 without replacing LG vendor code
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          if git merge-base --is-ancestor HEAD "refs/tags/$CIP_TAG"; then
            # The vendor commit is behind CIP135. Bring forward only the
            # upstream CIP history; conflicts are fatal and are never ignored.
            git merge --no-edit --no-ff "refs/tags/$CIP_TAG" || {
              git merge --abort || true
              echo 'CIP135 merge conflict. Build stopped.'
              exit 1
            }
          else
            echo 'Vendor tree already contains or is ahead of CIP135; no merge performed.'
          fi
          echo '=== kernel version after CIP step ==='
          make -s kernelversion || true
          git status --short > "$DIAG_DIR/post-cip-status.txt"

      - name: 07 - Remove legacy KernelSU before SukiSU integration
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          # Remove only old KSU references from build-system entries; source
          # hooks are checked separately so accidental vendor changes are caught.
          sed -i '/^[[:space:]]*source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig 2>/dev/null || true
          sed -i '/^[[:space:]]*obj-[^#]*+= kernelsu\//d' drivers/Makefile 2>/dev/null || true
          if [ -e KernelSU ] || [ -e drivers/kernelsu ]; then
            echo 'Legacy KernelSU removal failed.'
            exit 1
          fi

      - name: 08 - Integrate SukiSU-Ultra with SUSFS
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          curl -LSs 'https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh' | bash -s susfs-main
          test -d drivers/kernelsu
          grep -Rsn 'SukiSU\|susfs' drivers/kernelsu 2>/dev/null | head -50 || true

      - name: 09 - Configure KPROBES + SukiSU + SUSFS
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          scripts/config --file "$OUT_DIR/.config" \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_KSU \
            --disable CONFIG_KSU_MANUAL_HOOK \
            --disable CONFIG_KSU_TRACEPOINT_HOOK \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            --enable CONFIG_KSU_SUSFS_TRY_UMOUNT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --disable CONFIG_KSU_SUSFS_SUS_PATH \
            --disable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --disable CONFIG_KSU_SUSFS_SUS_SU
          make O="$OUT_DIR" ARCH=arm64 olddefconfig
          grep -q '^CONFIG_KPROBES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KALLSYMS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KALLSYMS_ALL=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"

      - name: 10 - Verify KPROBES hook path and reject old manual hooks
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          grep -q '^CONFIG_KPROBES=y$' "$OUT_DIR/.config"
          if grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$OUT_DIR/.config"; then
            echo 'Manual KSU hooks are enabled; this build requires KPROBES.'
            exit 1
          fi
          # Legacy v0.9.5 manual-hook declarations from the supplied build
          # must not be carried forward.
          if grep -Rsn -E 'ksu_handle_execveat|ksu_handle_faccessat|ksu_handle_vfs_read|ksu_handle_stat' \
             fs/exec.c fs/open.c fs/read_write.c fs/stat.c 2>/dev/null; then
            echo 'Legacy manual KernelSU hooks detected.'
            exit 1
          fi

      - name: 11 - Global G900 target check
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          mkdir -p "$DIAG_DIR"
          {
            echo "target=$G900_GLOBAL_TARGET"
            echo 'The supplied kernel/device tree uses the caymanlm hardware codename.'
            echo 'LM-G900N product references are not accepted as the requested target label.'
            echo 'No invented global DTB is substituted.'
            grep -Rsn -E 'LM-G900N|G900N|LM-G900EMW|G900EMW' arch/arm64/configs arch/arm64/boot/dts 2>/dev/null | head -100 || true
          } | tee "$DIAG_DIR/global-target.txt"

      - name: 12 - Final config drift check
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          cp "$OUT_DIR/.config" "$DIAG_DIR/final.config"
          # Preserve a machine-readable delta. KSU/SUSFS/KPROBES additions are expected;
          # unexpected baseline drift is recorded for inspection.
          diff -u "$GITHUB_WORKSPACE/.github/kernel-baseline/working.config" "$OUT_DIR/.config" \
            > "$DIAG_DIR/config-diff.txt" || true
          grep -E '^\+CONFIG_(KPROBES|KALLSYMS|KALLSYMS_ALL|KSU|KSU_SUSFS)' "$DIAG_DIR/config-diff.txt" || true

      - name: 13 - Build ARM64 Image and modules
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC="$CLANG_DIR/bin/clang"
          export LD="$CLANG_DIR/bin/ld.lld"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -Oline O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CC" LD="$LD" CLANG_TRIPLE="$CLANG_TRIPLE" \
            -j"$(nproc)" Image modules 2>&1 | tee "$DIAG_DIR/build.log"
          test -s "$OUT_DIR/arch/arm64/boot/Image"

      - name: 14 - Package Image + supplied DTB/DTBO/header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp kernel/out/arch/arm64/boot/Image release/Image
          cp input-assets/dtb release/dtb
          cp input-assets/dtbo.img release/dtbo.img
          cp input-assets/header release/header
          sha256sum release/* > release/SHA256SUMS
          printf 'target=LG-G900-GLOBAL\nkernel=4.19.325-cip135\nroot=SukiSU-Ultra\nsusfs=enabled\nhook=KPROBES\nlegacy_kernelsu=removed\nLM-G900N=not_target\n' > release/BUILD-INFO.txt

      - name: 15 - Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-CIP135-SukiSU-SUSFS-KPROBES
          path: |
            release/
            ci-diagnostics/
            out/.config
