      - name: 19 - Build Kernel (Full Log to Artifact)
        shell: bash
        run: |
          set +e
          FULL_LOG="$GITHUB_WORKSPACE/kernel-build-full.log"
          ERROR_LOG="$DIAG_DIR/12-build-errors.log"
          TAIL_LOG="$DIAG_DIR/12-build-tail.log"
          SUMMARY_LOG="$DIAG_DIR/12-build-summary.log"

          : > "$FULL_LOG"
          : > "$ERROR_LOG"
          : > "$TAIL_LOG"
          : > "$SUMMARY_LOG"

          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

          # Build-only compatibility fixes are scoped to the exact stock
          # source directories/files that failed with this Clang 20 build.
          # No global KCFLAGS and no unrelated kernel features are added.
          #
          # Qualcomm clock trace.h uses TRACE_INCLUDE_PATH "."; the include
          # path is scoped to drivers/clk/qcom via Kbuild ccflags-y.
          # Camera cam_trace.h needs the cam_req_mgr local header path.
          # fault-inject.c and lgenfc.c receive source-level compatibility
          # corrections for this kernel/compiler combination.
          # ------------------------------------------------------------
          # 1) Qualcomm clock trace include path
          # ------------------------------------------------------------
          QCOM_MAKE="drivers/clk/qcom/Makefile"
          test -f "$QCOM_MAKE"

          if ! grep -qF 'ccflags-y += -I$(src)' "$QCOM_MAKE"; then
            {
              echo
              echo "# Build compatibility: local TRACE_INCLUDE_PATH for qcom trace.h"
              echo 'ccflags-y += -I$(src)'
            } >> "$QCOM_MAKE"
          fi

          echo "[PASS] Qualcomm trace include path scoped to drivers/clk/qcom."
          grep -nF 'ccflags-y += -I$(src)' "$QCOM_MAKE"

          # ------------------------------------------------------------
          # 2) Camera cam_req_mgr local include path
          #    cam_trace.h includes cam_req_mgr_core.h by name.
          #    The header is part of the stock source tree; only the
          #    local Kbuild include path is missing for this Clang build.
          # ------------------------------------------------------------
          CAM_MAKE="techpack/camera/drivers/cam_req_mgr/Makefile"
          test -f "$CAM_MAKE"

          if ! grep -qF 'ccflags-y += -I$(src)' "$CAM_MAKE"; then
            {
              echo
              echo "# Build compatibility: cam_trace.h local cam_req_mgr headers"
              echo 'ccflags-y += -I$(src)'
            } >> "$CAM_MAKE"
          fi

          echo "[PASS] Camera cam_req_mgr include path scoped to cam_req_mgr."
          grep -nF 'ccflags-y += -I$(src)' "$CAM_MAKE"

          # ------------------------------------------------------------
          # 3) Camera cam_cci local include path
          #    cam_sensor_i2c.h includes cam_cci_dev.h by name.
          #    The header is part of the stock source tree; only the
          #    cam_cci directory needs to be added to its local search
          #    path for this Clang build.
          # ------------------------------------------------------------
          CCI_MAKE="techpack/camera/drivers/cam_sensor_module/cam_cci/Makefile"
          test -f "$CCI_MAKE"

          if ! grep -qF 'ccflags-y += -I$(src)' "$CCI_MAKE"; then
            {
              echo
              echo "# Build compatibility: local cam_cci headers"
              echo 'ccflags-y += -I$(src)'
            } >> "$CCI_MAKE"
          fi

          echo "[PASS] Camera cam_cci include path scoped to cam_cci."
          grep -nF 'ccflags-y += -I$(src)' "$CCI_MAKE"

          # ------------------------------------------------------------
          # 4) Camera cam_actuator local include path
          #    lgit_onsemi_actuator_utils.c includes cam_actuator_core.h
          #    by name. The header is already in the stock tree.
          # ------------------------------------------------------------
          ACT_MAKE="techpack/camera/drivers/cam_sensor_module/cam_actuator/Makefile"
          test -f "$ACT_MAKE"

          if ! grep -qF 'ccflags-y += -I$(src)' "$ACT_MAKE"; then
            {
              echo
              echo "# Build compatibility: local cam_actuator headers"
              echo 'ccflags-y += -I$(src)'
            } >> "$ACT_MAKE"
          fi

          echo "[PASS] Camera cam_actuator include path scoped to cam_actuator."
          grep -nF 'ccflags-y += -I$(src)' "$ACT_MAKE"

          # ------------------------------------------------------------
          # 5) Camera cam_ois nested LGIT/Onsemi include path
          #
          # The current build log reaches:
          #   lgit_s5kgw1_onsemi_ois.c:10:10:
          #   fatal error: 'cam_ois_core.h' file not found
          #
          # The source file is under cam_ois/lgit_onsemi/, while the
          # stock cam_ois_core.h belongs to the parent cam_ois directory.
          # Kbuild does not automatically search that parent directory
          # for a quoted header from the nested subdirectory.
          #
          # Add ONLY the parent cam_ois directory to the nested
          # lgit_onsemi Kbuild include path. No header is downloaded,
          # copied, replaced, or generated.
          # ------------------------------------------------------------
          OIS_DIR="techpack/camera/drivers/cam_sensor_module/cam_ois"
          OIS_SUBDIR="$OIS_DIR/lgit_onsemi"
          OIS_PARENT_MAKE="$OIS_DIR/Makefile"
          OIS_HEADER="$OIS_DIR/cam_ois_core.h"

          test -d "$OIS_DIR"
          test -d "$OIS_SUBDIR"
          test -f "$OIS_PARENT_MAKE"
          test -f "$OIS_HEADER"

          # Kbuild's subdir-ccflags-y is intentionally used in the
          # parent cam_ois Kbuild file. Unlike ccflags-y in lgit_onsemi,
          # this applies to cam_ois itself and every nested OIS directory,
          # including trees that use a Kbuild file instead of Makefile.
          if ! grep -qF 'subdir-ccflags-y += -I$(src)' "$OIS_PARENT_MAKE"; then
            {
              echo
              echo "# Build compatibility: stock cam_ois headers for nested OIS drivers"
              echo 'subdir-ccflags-y += -I$(src)'
            } >> "$OIS_PARENT_MAKE"
          fi

          echo "[PASS] Stock cam_ois_core.h exists:"
          ls -lh "$OIS_HEADER"
          echo "[PASS] cam_ois parent include path propagated to nested OIS:"
          grep -nF 'subdir-ccflags-y += -I$(src)' "$OIS_PARENT_MAKE"

          # ------------------------------------------------------------
          # 6) Stock LG display nested-header include path
          #
          # Current build reaches:
          #   techpack/display/msm/lge/cm/lge_color_manager.c:19:10:
          #   fatal error: 'lge_dsi_panel_def.h' file not found
          #
          # The stock header lives in the parent:
          #   techpack/display/msm/lge/lge_dsi_panel_def.h
          #
          # The stock lge/Makefile supplies several display include paths,
          # but not its own directory. Propagate ONLY the stock lge
          # directory to its nested display objects.
          #
          # No header is downloaded/copied/replaced and no display feature
          # is enabled or disabled.
          # ------------------------------------------------------------
          LGE_DISPLAY_DIR="techpack/display/msm/lge"
          LGE_DISPLAY_MAKE="$LGE_DISPLAY_DIR/Makefile"
          LGE_DISPLAY_HEADER="$LGE_DISPLAY_DIR/lge_dsi_panel_def.h"

          test -d "$LGE_DISPLAY_DIR"
          test -f "$LGE_DISPLAY_MAKE"
          test -f "$LGE_DISPLAY_HEADER"

          if ! grep -qF 'subdir-ccflags-y += -I$(src)' "$LGE_DISPLAY_MAKE"; then
            {
              echo
              echo "# Build compatibility: stock LG display parent headers for nested objects"
              echo 'subdir-ccflags-y += -I$(src)'
            } >> "$LGE_DISPLAY_MAKE"
          fi

          echo "[PASS] Stock LG display header exists:"
          ls -lh "$LGE_DISPLAY_HEADER"
          echo "[PASS] LG display parent include path propagated to nested objects:"
          grep -nF 'subdir-ccflags-y += -I$(src)' "$LGE_DISPLAY_MAKE"

          # ------------------------------------------------------------
          # 6) Stock display PLL trace-header include path
          #
          # Current build log reaches:
          #   techpack/display/pll/dsi_pll_10nm.c
          #   -> techpack/display/pll/pll_trace.h
          #   -> include/trace/define_trace.h
          #   -> fatal error: './pll_trace.h' file not found
          #
          # The trace header is in the same stock directory:
          #   techpack/display/pll/pll_trace.h
          #
          # define_trace.h expands TRACE_INCLUDE_PATH relative to the
          # compiler include search path. Add ONLY the stock PLL directory
          # to its own nested build. Do not copy/download another header.
          # ------------------------------------------------------------
          PLL_DIR="techpack/display/pll"
          PLL_MAKE="$PLL_DIR/Makefile"
          PLL_HEADER="$PLL_DIR/pll_trace.h"

          test -d "$PLL_DIR"
          test -f "$PLL_MAKE"
          test -f "$PLL_HEADER"

          if ! grep -qF 'subdir-ccflags-y += -I$(src)' "$PLL_MAKE"; then
            {
              echo
              echo "# Build compatibility: stock PLL trace header for nested display PLL objects"
              echo 'subdir-ccflags-y += -I$(src)'
            } >> "$PLL_MAKE"
          fi

          echo "[PASS] Stock PLL trace header exists:"
          ls -lh "$PLL_HEADER"
          echo "[PASS] PLL parent include path propagated:"
          grep -nF 'subdir-ccflags-y += -I$(src)' "$PLL_MAKE"

          # ------------------------------------------------------------
          # 6) Stock DTS consistency fix: litomagnus MTP WSA references
          #
          # Current build log reaches the stock DTB compiler and fails only
          # because litomagnus-mtp.dtsi references four labels:
          #   wsa881x_0211 .. wsa881x_0214
          #
          # In this stock tree those WSA node definitions are intentionally
          # commented out in lito-audio-overlay.dtsi (WSA speaker amp
          # disabled), so the labels do not exist. The litomagnus overlay
          # still contains four status="disabled" references to those absent
          # labels. dtc treats an unresolved phandle label as a hard error.
          #
          # Do NOT download or add another WSA node definition: doing so would
          # change the stock audio/device-tree behavior. Instead, remove only
          # the four dead references from this overlay. They already request
          # status="disabled" and therefore cannot represent an enabled stock
          # feature. All other stock DTS content remains untouched.
          # ------------------------------------------------------------
          # The build log from the previous run proves the failing DTB is
          # litomagnus-cdp.dtb, not litomagnus-mtp.dtb:
          #   litomagnus-cdp.dtsi:44  Label or path wsa881x_0211 not found
          #   ... through wsa881x_0214
          #
          # The earlier fix handled only the MTP file. Keep that fix, but
          # apply the same narrowly-scoped cleanup to BOTH stock Magnus
          # variants because this kernel builds both DTBs. No new WSA node,
          # header, driver, or feature is added.
          LITOMAGNUS_MTP_DTSI="arch/arm64/boot/dts/vendor/qcom/litomagnus-mtp.dtsi"
          LITOMAGNUS_CDP_DTSI="arch/arm64/boot/dts/vendor/qcom/litomagnus-cdp.dtsi"
          test -f "$LITOMAGNUS_MTP_DTSI"
          test -f "$LITOMAGNUS_CDP_DTSI"

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("arch/arm64/boot/dts/vendor/qcom/litomagnus-mtp.dtsi"),
              Path("arch/arm64/boot/dts/vendor/qcom/litomagnus-cdp.dtsi"),
          ]

          labels = [
              "wsa881x_0211",
              "wsa881x_0212",
              "wsa881x_0213",
              "wsa881x_0214",
          ]

          for p in files:
              s = p.read_text()
              changed = []

              # Remove the COMPLETE disabled override blocks, not just the
              # unresolved label line. Leaving "status = disabled;" and "};"
              # behind creates invalid DTS syntax.
              for label in labels:
                  pattern = (
                      r'(?m)^&' + re.escape(label) +
                      r'\s*\{\n'
                      r'\s*status\s*=\s*"disabled";\n'
                      r'\s*\};\n?'
                  )
                  s2, count = re.subn(pattern, "", s, count=1)
                  if count:
                      changed.append(label)
                      s = s2

              p.write_text(s)

              if changed:
                  print(f"[FIXED] {p}: removed complete unresolved disabled WSA override blocks:")
                  for label in changed:
                      print("  &" + label)
              else:
                  print(f"[PASS] {p}: no unresolved disabled WSA override blocks needed removal.")
          PY

          echo "[PASS] Verify no dead WSA phandle references remain in either Magnus DTSI:"
          for f in "$LITOMAGNUS_MTP_DTSI" "$LITOMAGNUS_CDP_DTSI"; do
            if grep -nE '^[[:space:]]*&wsa881x_021[1-4][[:space:]]*$' "$f"; then
              echo "[FAIL] Unresolved WSA references still present in $f"
              exit 1
            fi
          done

          echo "[PASS] Both litomagnus MTP/CDP DTSI files are free of the four dead WSA references."

          # ------------------------------------------------------------
          # 7) Stock Lito/Magnus WSA speaker dependency fix
          #
          # Diagnostics (17) shows the previous v5 fix moved too much into
          # common lito-pinctrl.dtsi. That made the unrelated stock
          # lito-rumi.dtb inherit wsa_spkr_en1/en2 and fail because its
          # audio tree does not provide the speaker-enable dependency.
          #
          # Upstream Lito keeps the speaker GPIO states in lito-pinctrl.dtsi,
          # while the wsa_spkr_en1/en2 consumer nodes live in the Lito audio
          # overlay. The Magnus CDP/MTP trees are the targets that reference
          # these existing WSA883x controls.
          #
          # Therefore:
          #   1. Keep ONLY the stock speaker GPIO states in common pinctrl.
          #   2. Restore wsa_spkr_en1/en2 ONLY in the two Magnus target DTSIs.
          #   3. Do not modify lito-rumi, camera, display, or any other DTB.
          #
          # This is a dependency restoration, not a new kernel feature.
          # ------------------------------------------------------------
          LITO_PINCTRL="arch/arm64/boot/dts/vendor/qcom/lito-pinctrl.dtsi"
          LITOMAGNUS_MTP_DTSI="arch/arm64/boot/dts/vendor/qcom/litomagnus-mtp.dtsi"
          LITOMAGNUS_CDP_DTSI="arch/arm64/boot/dts/vendor/qcom/litomagnus-cdp.dtsi"

          test -f "$LITO_PINCTRL"
          test -f "$LITOMAGNUS_MTP_DTSI"
          test -f "$LITOMAGNUS_CDP_DTSI"

          python3 - <<'PY'
          from pathlib import Path

          pinctrl = Path("arch/arm64/boot/dts/vendor/qcom/lito-pinctrl.dtsi")
          mtp = Path("arch/arm64/boot/dts/vendor/qcom/litomagnus-mtp.dtsi")
          cdp = Path("arch/arm64/boot/dts/vendor/qcom/litomagnus-cdp.dtsi")

          # These are the stock Lito WSA speaker reset GPIO states.
          # They belong in the common TLMM pinctrl definition because the
          # speaker-enable nodes consume these labels.
          pinctrl_block = r"""
          &tlmm {
              /* Stock Lito WSA speaker reset pins */
              spkr_1_sd_n {
                  spkr_1_sd_n_sleep: spkr_1_sd_n_sleep {
                      mux {
                          pins = "gpio58";
                          function = "gpio";
                      };

                      config {
                          pins = "gpio58";
                          drive-strength = <2>;
                          bias-pull-down;
                          input-enable;
                      };
                  };

                  spkr_1_sd_n_active: spkr_1_sd_n_active {
                      mux {
                          pins = "gpio58";
                          function = "gpio";
                      };

                      config {
                          pins = "gpio58";
                          drive-strength = <16>;
                          bias-disable;
                          output-high;
                      };
                  };
              };

              spkr_2_sd_n {
                  spkr_2_sd_n_sleep: spkr_2_sd_n_sleep {
                      mux {
                          pins = "gpio65";
                          function = "gpio";
                      };

                      config {
                          pins = "gpio65";
                          drive-strength = <2>;
                          bias-pull-down;
                          input-enable;
                      };
                  };

                  spkr_2_sd_n_active: spkr_2_sd_n_active {
                      mux {
                          pins = "gpio65";
                          function = "gpio";
                      };

                      config {
                          pins = "gpio65";
                          drive-strength = <16>;
                          bias-disable;
                          output-high;
                      };
                  };
              };
          };
          """

          ps = pinctrl.read_text()
          if "spkr_1_sd_n_active:" not in ps:
              ps = ps.rstrip() + "\n\n" + pinctrl_block.strip() + "\n"
              pinctrl.write_text(ps)
              print("[FIXED] Restored stock WSA speaker GPIO states in lito-pinctrl.dtsi")
          else:
              print("[PASS] WSA speaker GPIO states already exist in lito-pinctrl.dtsi")

          # These two nodes are intentionally scoped to the Magnus target
          # DTSIs. Keeping them out of common lito-pinctrl prevents unrelated
          # targets such as lito-rumi.dtb from acquiring a dangling reference.
          wsa_block = r"""
          &soc {
              /* Stock Lito/Magnus WSA speaker controls */
              wsa_spkr_en1: wsa_spkr_en1_pinctrl {
                  compatible = "qcom,msm-cdc-pinctrl";
                  pinctrl-names = "aud_active", "aud_sleep";
                  pinctrl-0 = <&spkr_1_sd_n_active>;
                  pinctrl-1 = <&spkr_1_sd_n_sleep>;
              };

              wsa_spkr_en2: wsa_spkr_en2_pinctrl {
                  compatible = "qcom,msm-cdc-pinctrl";
                  pinctrl-names = "aud_active", "aud_sleep";
                  pinctrl-0 = <&spkr_2_sd_n_active>;
                  pinctrl-1 = <&spkr_2_sd_n_sleep>;
              };
          };
          """

          for p in (mtp, cdp):
              text = p.read_text()
              if "wsa_spkr_en1:" not in text:
                  text = text.rstrip() + "\n\n" + wsa_block.strip() + "\n"
                  p.write_text(text)
                  print(f"[FIXED] Restored wsa_spkr_en1/en2 in {p.name}")
              else:
                  print(f"[PASS] {p.name} already contains wsa_spkr_en1/en2")

          # Hard guard: the common pinctrl must NOT contain the consumer nodes.
          final_pinctrl = pinctrl.read_text()
          if "wsa_spkr_en1:" in final_pinctrl or "wsa_spkr_en2:" in final_pinctrl:
              raise SystemExit("wsa_spkr_en1/en2 must not be placed in common lito-pinctrl.dtsi")

          for p in (mtp, cdp):
              text = p.read_text()
              for label in (
                  "wsa_spkr_en1:",
                  "wsa_spkr_en2:",
                  "spkr_1_sd_n_active",
                  "spkr_1_sd_n_sleep",
                  "spkr_2_sd_n_active",
                  "spkr_2_sd_n_sleep",
              ):
                  if label not in text and label.startswith("wsa_"):
                      raise SystemExit(f"{p}: missing {label}")

          print("[PASS] WSA definitions are now scoped only to Magnus MTP/CDP targets.")
          PY

          echo "[PASS] Verify common pinctrl contains only WSA GPIO states:"
          grep -nE 'spkr_1_sd_n_(active|sleep):|spkr_2_sd_n_(active|sleep):' "$LITO_PINCTRL"
          if grep -qE 'wsa_spkr_en[12]:' "$LITO_PINCTRL"; then
            echo "[FAIL] Common lito-pinctrl still contains Magnus-only WSA consumers"
            exit 1
          fi

          echo "[PASS] Verify Magnus target WSA consumers:"
          grep -nE 'wsa_spkr_en[12]:' "$LITOMAGNUS_MTP_DTSI" "$LITOMAGNUS_CDP_DTSI"

          # Never force dtc output. The following check is deliberately scoped
          # to the targets that actually consume these labels.
          grep -q 'wsa_spkr_en1:' "$LITOMAGNUS_MTP_DTSI"
          grep -q 'wsa_spkr_en2:' "$LITOMAGNUS_MTP_DTSI"
          grep -q 'wsa_spkr_en1:' "$LITOMAGNUS_CDP_DTSI"
          grep -q 'wsa_spkr_en2:' "$LITOMAGNUS_CDP_DTSI"

          echo "[PASS] Existing Magnus WSA883x phandle dependencies now have scoped stock definitions."
          # ------------------------------------------------------------
          # 6) Linux 4.19 fault-inject WRITE_ONCE compatibility
          #    Stock 4.19 compiler headers define WRITE_ONCE() as a
          #    statement-style macro. This source used it as an expression:
          #       if (!WRITE_ONCE(current->fail_nth, fail_nth - 1))
          #    Keep the same behavior with an explicit decrement/store/test.
          # ------------------------------------------------------------
          FAULT_SRC="lib/fault-inject.c"
          test -f "$FAULT_SRC"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/fault-inject.c")
          s = p.read_text()

          old = """\t\tif (fail_nth) {\n\t\t\tif (!WRITE_ONCE(current->fail_nth, fail_nth - 1))\n\t\t\t\tgoto fail;\n\n\t\t\treturn false;\n\t\t}"""

          new = """\t\tif (fail_nth) {\n\t\t\tfail_nth--;\n\t\t\tWRITE_ONCE(current->fail_nth, fail_nth);\n\t\t\tif (!fail_nth)\n\t\t\t\tgoto fail;\n\n\t\t\treturn false;\n\t\t}"""

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print("[FIXED] lib/fault-inject.c WRITE_ONCE expression compatibility")
          elif "fail_nth--;" in s and "WRITE_ONCE(current->fail_nth, fail_nth);" in s:
              print("[PASS] lib/fault-inject.c already uses statement-compatible form")
          else:
              raise SystemExit("Expected fault-inject fail_nth block was not found")
          PY

          # ------------------------------------------------------------
          # 7) LG NFC prototype compatibility
          #    Clang 20 treats -Wstrict-prototypes as an error for this
          #    old-style zero-argument declaration. Make it explicit.
          # ------------------------------------------------------------
          NFC_SRC="drivers/nfc/lge/lgenfc.c"
          test -f "$NFC_SRC"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("drivers/nfc/lge/lgenfc.c")
          s = p.read_text()

          old = "enum NfcChip getChipset() {"
          new = "enum NfcChip getChipset(void) {"

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print("[FIXED] drivers/nfc/lge/lgenfc.c strict-prototype compatibility")
          elif "enum NfcChip getChipset(void)" in s:
              print("[PASS] lgenfc.c prototype already fixed")
          else:
              raise SystemExit("Expected getChipset() declaration was not found")
          PY

          echo
          echo "[PASS] Scoped source compatibility fixes prepared."

          echo "=========================================="
          echo "STARTING STOCK + SUKISU + KPM BUILD"
          echo "Full V=1 stdout/stderr -> kernel-build-full.log"
          echo "=========================================="
          echo "clang=$(command -v clang)"
          echo "ld.lld=$(command -v ld.lld)"
          clang --version | sed -n '1,2p'
          ld.lld --version | sed -n '1,2p'

          START=$(date +%s)

          # Use the stock kernel's default target first. This is safer for
          # vendor 4.19 trees whose image target may be Image, Image.gz, or
          # Image.gz-dtb depending on the board Kbuild.
          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            -j"$(nproc)" \
            V=1 \
            WERROR=0 \
            >"$FULL_LOG" 2>&1

          BUILD_STATUS=$?

          if [ "$BUILD_STATUS" -eq 0 ]; then
            echo "" >> "$FULL_LOG"
            echo "===== EXPLICIT DTBS PASS =====" >> "$FULL_LOG"
            make \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              -j"$(nproc)" \
              V=1 \
              WERROR=0 \
              dtbs >> "$FULL_LOG" 2>&1
            DTB_STATUS=$?
            if [ "$DTB_STATUS" -ne 0 ]; then
              BUILD_STATUS="$DTB_STATUS"
            fi
          fi

          END=$(date +%s)
          ELAPSED=$((END-START))

          {
            echo "BUILD_STATUS=$BUILD_STATUS"
            echo "BUILD_TIME_SECONDS=$ELAPSED"
            echo "BUILD_TIME_HUMAN=$((ELAPSED/60))m $((ELAPSED%60))s"
            echo "BUILD_LOG_BYTES=$(wc -c < "$FULL_LOG")"
            echo "BUILD_LOG_LINES=$(wc -l < "$FULL_LOG")"
          } | tee "$SUMMARY_LOG"

          grep -nEi \
            'fatal error:|error:|undefined reference|undeclared|implicit declaration|invalid|unknown argument|unknown warning|No such file|No rule to make target|recipe for target|Error [0-9]+|make\[[0-9]+\]: \*\*\*' \
            "$FULL_LOG" | tail -250 > "$ERROR_LOG" || true

          tail -300 "$FULL_LOG" > "$TAIL_LOG" || true

          echo
          echo "===== COMPACT BUILD ERROR SUMMARY ====="
          if [ -s "$ERROR_LOG" ]; then
            tail -30 "$ERROR_LOG" || true
          else
            echo "No compiler-error pattern found."
          fi

          echo
          echo "===== LAST 40 BUILD LINES ====="
          tail -40 "$FULL_LOG" || true

          if [ "$BUILD_STATUS" -eq 0 ]; then
            KERNEL_IMAGE=""
            for candidate in               arch/arm64/boot/Image.gz-dtb               arch/arm64/boot/Image.gz               arch/arm64/boot/Image; do
              if [ -s "$candidate" ]; then
                KERNEL_IMAGE="$candidate"
                break
              fi
            done
            test -n "$KERNEL_IMAGE"
            echo "KERNEL_IMAGE=$KERNEL_IMAGE"
            echo "KERNEL BUILD SUCCESSFUL"
            find arch/arm64/boot/dts -type f \( -name '*.dtb' -o -name '*.dtbo' \) -print | sort | head -300 || true
          else
            echo "KERNEL BUILD FAILED - FULL LOG SAVED AS ARTIFACT"
          fi

          exit "$BUILD_STATUS"

      - name: 19A - Package Kernel + DTB/DTBO + AnyKernel3 (OrangeFox Flashable)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/19A-packaging.log"
          : > "$LOG"
          {
            mkdir -p artifacts/kernel artifacts/dtb artifacts/dtbo

            KERNEL_IMAGE=""
            for candidate in \
              arch/arm64/boot/Image.gz-dtb \
              arch/arm64/boot/Image.gz \
              arch/arm64/boot/Image; do
              if [ -s "$candidate" ]; then
                KERNEL_IMAGE="$candidate"
                break
              fi
            done
            test -n "$KERNEL_IMAGE"

            cp -f "$KERNEL_IMAGE" artifacts/kernel/
            sha256sum "$KERNEL_IMAGE" > artifacts/kernel/kernel.sha256

            find arch/arm64/boot/dts -type f -name '*.dtb' -print0 2>/dev/null |
              while IFS= read -r -d '' f; do cp -f "$f" artifacts/dtb/; done
            find arch/arm64/boot/dts -type f -name '*.dtbo' -print0 2>/dev/null |
              while IFS= read -r -d '' f; do cp -f "$f" artifacts/dtbo/; done

            # Build a standard AnyKernel3 package that OrangeFox can flash.
            rm -rf "$RUNNER_TEMP/AnyKernel3"
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$RUNNER_TEMP/AnyKernel3"

            cp -f "$KERNEL_IMAGE" "$RUNNER_TEMP/AnyKernel3/Image.gz-dtb"

            python3 -c '
            from pathlib import Path
            import os
            import re
            p = Path(os.environ["RUNNER_TEMP"]) / "AnyKernel3" / "anykernel.sh"
            s = p.read_text()
            s = re.sub(r"(?m)^kernel\\.string=.*$", "kernel.string=LM-G900 SukiSU-Ultra 4.2.0 V29", s)
            s = re.sub(r"(?m)^do\\.devicecheck=.*$", "do.devicecheck=1", s)
            s = re.sub(r"(?m)^device\\.name1=.*$", "device.name1=caymanlm", s)
            s = re.sub(r"(?m)^device\\.name2=.*$", "device.name2=G900EMW", s)
            s = re.sub(r"(?m)^device\\.name3=.*$", "device.name3=LM-G900", s)
            s = re.sub(r"(?m)^device\\.name4=.*$", "device.name4=", s)
            s = re.sub(r"(?m)^\\s*(?:block|BLOCK)=.*$", "block=boot;", s)
            s = re.sub(r"(?m)^\\s*(?:is_slot_device|IS_SLOT_DEVICE)=.*$", "is_slot_device=auto;", s)
            p.write_text(s)
            '

            test -s "$RUNNER_TEMP/AnyKernel3/Image.gz-dtb"
            grep -q 'kernel.string=LM-G900 SukiSU-Ultra 4.2.0 V29' "$RUNNER_TEMP/AnyKernel3/anykernel.sh"
            grep -q 'block=boot' "$RUNNER_TEMP/AnyKernel3/anykernel.sh"
            grep -q 'is_slot_device=auto' "$RUNNER_TEMP/AnyKernel3/anykernel.sh"

            (
              cd "$RUNNER_TEMP/AnyKernel3"
              rm -rf .git
              zip -r9 "$GITHUB_WORKSPACE/artifacts/LM-G900-SukiSU-4.2.0-V29-OrangeFox-AnyKernel3.zip" . \
                -x 'README.md' >/dev/null
            )

            cp -f "$GITHUB_WORKSPACE/artifacts/LM-G900-SukiSU-4.2.0-V29-OrangeFox-AnyKernel3.zip" artifacts/kernel/

            (
              cd artifacts
              zip -r9 "$GITHUB_WORKSPACE/artifacts/LM-G900-V29-DTB-DTBO-4.19.325-cip135.zip" dtb dtbo >/dev/null
            )

            echo "Kernel image: $KERNEL_IMAGE"
            echo "AnyKernel3/OrangeFox ZIP: artifacts/LM-G900-SukiSU-4.2.0-V29-OrangeFox-AnyKernel3.zip"
            echo "DTB/DTBO ZIP: artifacts/LM-G900-V29-DTB-DTBO-4.19.325-cip135.zip"
            find artifacts -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 19 - Final Configuration and Artifact Check
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/13-final-check.log"
          : > "$LOG"
          {
            echo "========== FINAL CHECK =========="
            date -u
            echo
            echo "Kernel version:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile || true
            echo
            echo "Required config:"
            grep -E '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|KALLSYMS|KALLSYMS_ALL|KPM|SECURITY|SECURITY_SELINUX)=' .config 2>/dev/null || true
            echo
            echo "Kernel image candidates:"
            ls -lh arch/arm64/boot/Image.gz-dtb arch/arm64/boot/Image.gz arch/arm64/boot/Image 2>&1 || true
            echo
            echo "DTB/DTBO outputs:"
            find arch/arm64/boot/dts -type f \( -name '*.dtb' -o -name '*.dtbo' \) -print 2>/dev/null | sort | head -300 || true
            echo
            echo "Build errors (last 40):"
            tail -40 "$DIAG_DIR/12-build-errors.log" 2>/dev/null || true
            echo
            echo "Build tail (last 40):"
            tail -40 "$DIAG_DIR/12-build-tail.log" 2>/dev/null || true
          } > "$LOG" 2>&1
          cat "$LOG"
          exit 0

      - name: 19 - Stage Complete Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic-artifact
          cp -f kernel-build-full.log diagnostic-artifact/12-build-full.log 2>/dev/null || true
          cp -f .config diagnostic-artifact/final.config 2>/dev/null || true
          cp -f sukisu-integration-note.txt diagnostic-artifact/sukisu-integration-note.txt 2>/dev/null || true
          cp -rf "$DIAG_DIR" diagnostic-artifact/ci-logs 2>/dev/null || true
          {
            echo "GitHub Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Date: $(date -u)"
            echo "SukiSU release tag: $SUKISU_REF"
            echo "SukiSU release commit (short): $SUKISU_RELEASE_COMMIT"
            echo "External root-hiding kernel patchset: NOT INTEGRATED"
            echo "External root-hiding userspace package: NOT INTEGRATED"
            echo
            find diagnostic-artifact -type f -printf '%p %s bytes\n' | sort
          } > diagnostic-artifact/MANIFEST.txt
          exit 0

      - name: 19B - Upload Kernel / DTB / DTBO / OrangeFox ZIP
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LG-Velvet-G900-V29-SukiSU-4.2.0-Kernel-DTB-DTBO-OrangeFox
          path: artifacts
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: 19 - Upload Complete Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LG-Velvet-G900-SukiSU-4.2.0-Diagnostics
          path: diagnostic-artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: 19C - Upload Raw Kernel Image
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LG-Velvet-G900-SukiSU-4.2.0-Raw-Kernel
          path: |
            arch/arm64/boot/Image.gz-dtb
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
