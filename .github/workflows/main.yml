name: LG Velvet 5G - WORKING 4.19 Non-GKI + SukiSU-Ultra + SUSFS 2.2.0 + CIP135 (Global LM-G900)

on:
  # Automatic run: any commit/upload to this repository triggers the build.
  # The build itself always checks out the locked WORKING sixteen source commit.
  push:

  workflow_dispatch:
    inputs:
      source_branch:
        description: "EXACT WORKING kernel branch"
        required: true
        type: choice
        options:
          - sixteen
        default: sixteen
      defconfig:
        description: "EXACT WORKING kernel defconfig"
        required: true
        type: choice
        options:
          - vendor/caymanlm_defconfig
        default: vendor/caymanlm_defconfig

permissions:
  contents: read

concurrency:
  group: lg-velvet-working-4.19-sukisu-susfs-cip135-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WORKING 4.19 Non-GKI + SukiSU-Ultra + SUSFS + CIP135
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    env:
      KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || 'sixteen' }}
      SOURCE_COMMIT: 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49
      DEFCONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'vendor/caymanlm_defconfig' }}

      # ONLY the three requested changes are intended.
      SUKISU_BRANCH: susfs-main
      # Resolved at build time and recorded in diagnostics. Do not pin an
      # unrelated KernelSU commit: the official susfs-main branch is the
      # combined SukiSU + SUSFS integration for non-GKI builds.
      SUKISU_VERSION: latest-builtin-6c5603f
      SUSFS_VERSION: v2.2.0
      CIP_BASE_TAG: v4.19.325-cip132
      CIP_TARGET_TAG: v4.19.325-cip135
      TARGET_MODEL: LM-G900
      TARGET_REGION: Global

      # Exact toolchain family used by the current WORKING build.
      CLANG_REVISION: clang-r563880c
      CLANG_PREBUILT_TAG: ndk-r29
      GCC64_BRANCH: lineage-19.1
      GCC32_BRANCH: lineage-19.1

      ARCH: arm64
      OUT_DIR: ${{ github.workspace }}/out
      DIAG_DIR: ${{ github.workspace }}/ci-diagnostics

      # SHA256 of the user's known-good stock WORKING kernel .config.
      # This is the config extracted from the working kernel supplied for this build.
      WORKING_BASELINE_CONFIG_SHA256: 8b931841bcfcfad0b8ed596fbc156e67a6da8f32f226753ffabc89c907accffa

    steps:
      - name: 01 - Checkout EXACT WORKING kernel source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/kernel"

          git clone --depth=1 --branch "$SOURCE_BRANCH" \
            "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"

          cd "$GITHUB_WORKSPACE/kernel"
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"

          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

          echo "=== EXACT WORKING SOURCE ==="
          echo "branch=$SOURCE_BRANCH"
          echo "commit=$(git rev-parse HEAD)"
          echo "kernel=$(make -s kernelversion || true)"

      - name: 02 - Install build dependencies (including GCC 4.9 Python wrapper fix)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex git libelf-dev libssl-dev \
            lld llvm python3 python-is-python3 rsync unzip wget

          # LineageOS GCC 4.9 wrappers use #!/usr/bin/python.
          # Ubuntu 22.04 does not guarantee that /usr/bin/python exists.
          test -x /usr/bin/python
          /usr/bin/python --version

          mkdir -p "$DIAG_DIR"

      - name: 03 - Download EXACT Android Clang r563880c + GCC 4.9
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf clang-prebuilt gcc64 gcc32

          # clang-r563880c is a DIRECTORY inside the NDK r29 snapshot,
          # not a Git branch. NDK r29 contains clang-r563880c. 
          git clone --depth=1 --filter=blob:none --sparse \
            --branch "$CLANG_PREBUILT_TAG" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-prebuilt
          cd clang-prebuilt
          git sparse-checkout set "$CLANG_REVISION"
          cd "$GITHUB_WORKSPACE"

          # Use the LineageOS lineage-19.1 GCC 4.9 prebuilts.
          # They contain wrapper scripts that require /usr/bin/python.
          git clone --depth=1 --branch "$GCC64_BRANCH" \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          git clone --depth=1 --branch "$GCC32_BRANCH" \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          test -x "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang"
          test -x "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc"
          test -x "$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc"

          # This catches the exact failure seen previously:
          # ".../aarch64-linux-android-gcc: No such file or directory"
          # when the wrapper's /usr/bin/python interpreter was missing.
          "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc" --version | head -n 1
          "$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc" --version | head -n 1
          "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang" --version | head -n 2
          "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang" --version | grep -q '21\.0\.0'

          echo "CLANG_DIR=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION" >> "$GITHUB_ENV"
          echo "GCC64_DIR=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"
          echo "PATH=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH" >> "$GITHUB_ENV"

      - name: 04 - Load and VERIFY exact WORKING baseline config (SELF-CONTAINED)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/04-baseline-config.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          # The baseline is embedded in this workflow so this job does NOT depend
          # on a separately committed .github/kernel-baseline/working.config file.
          # It is the exact .config extracted from the user's known-good kernel.
          BASELINE_FILE="$RUNNER_TEMP/working-baseline.config"
          cat > "$RUNNER_TEMP/working-baseline.b64" <<'BASE64_PAYLOAD'
