            echo "--- four audited files ---"
            sha256sum kernel/fs/namespace.c kernel/fs/proc/cmdline.c kernel/fs/proc/task_mmu.c kernel/fs/super.c
          } | tee logs/07-susfs-post-port-state.txt
          # Only treat a REAL merge-conflict triplet as a conflict. A kernel tree
          # legitimately contains many documentation lines made only of '='; the
          # V17 grep treated those as conflict markers and stopped Step 7 falsely.
          python3 - "${GITHUB_WORKSPACE}/kernel" > logs/07-susfs-conflict-markers.log 2>&1 <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          bad = []
          start_re = re.compile(r'^<<<<<<<(?: .*)?$')
          sep_re = re.compile(r'^=======$')
          end_re = re.compile(r'^>>>>>>>(?: .*)?$')
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  lines = p.read_text(errors='replace').splitlines()
              except Exception:
                  continue
              state = 0
              start_line = 0
              for no, line in enumerate(lines, 1):
                  if state == 0 and start_re.match(line):
                      state = 1
                      start_line = no
                  elif state == 1 and sep_re.match(line):
                      state = 2
                  elif state == 2 and end_re.match(line):
                      bad.append(f'{p}:{start_line}-{no}')
                      state = 0
          if bad:
              print('REAL_MERGE_CONFLICT_MARKERS_FOUND')
              print('\n'.join(bad))
              raise SystemExit(1)
          print('[OK] No real merge-conflict triplets found.')
          PY
          if [ "$?" -ne 0 ]; then
            echo "[ERROR] SUSFS application left real merge-conflict markers." | tee logs/07-susfs-failure.log
            exit 1
          fi

          require_file() {
            local f="$1"
            if [ ! -f "$f" ]; then
              echo "[ERROR] Missing required SUSFS file before inline hooks: $f" | tee -a logs/07-susfs-failure.log
              return 1
            fi
            echo "[OK] required file: $f" | tee -a logs/07-susfs-validation.log
          }
          require_grep() {
            local pattern="$1"; shift
            if ! grep -RqsE "$pattern" "$@"; then
              echo "[ERROR] Required SUSFS pattern not found: $pattern" | tee -a logs/07-susfs-failure.log
              printf '[INFO] searched: %s\n' "$*" | tee -a logs/07-susfs-failure.log
              return 1
            fi
            echo "[OK] required pattern: $pattern" | tee -a logs/07-susfs-validation.log
          }
          : > logs/07-susfs-validation.log
          require_file kernel/fs/susfs.c
          require_file kernel/include/linux/susfs.h
          require_file kernel/include/linux/susfs_def.h
          require_grep 'susfs_is_inode_sus_path|susfs_fake_qstr_name' kernel/fs/namei.c
          require_grep 'KSU_SUSFS' kernel/fs/Makefile
          git -C kernel diff --check | tee logs/07-susfs-diff-check.log

          {
            echo "selected_patch=${SELECTED_PATCH}"
            echo "apply_mode=${APPLY_MODE}"
            echo "susfs_backport_commit=${SUSFS_BACKPORT_RESOLVED}"
            echo "requested_susfs_version=${SUSFS_VERSION}"
            echo "kernel_version=$(make -s -C kernel kernelversion)"
            echo "kernel_head=$(git -C kernel rev-parse HEAD)"
            echo "susfs_semantic_port=4-file-v17"
          } | tee logs/07-susfs-selected.txt

          INLINE_SCRIPT="Patches/susfs_inline_hook_patches.sh"
          test -f "susfs-backport/${INLINE_SCRIPT}"
          cp "susfs-backport/${INLINE_SCRIPT}" logs/07-susfs-inline-hook-patches.sh
          chmod +x logs/07-susfs-inline-hook-patches.sh
          (cd kernel && bash ../logs/07-susfs-inline-hook-patches.sh) 2>&1 | tee logs/07-susfs-inline-hooks.log

          if git -C kernel ls-files -u | grep -q .; then
            echo "[ERROR] Inline SUSFS hook stage left unmerged index entries." | tee logs/07-susfs-failure.log
            exit 1
          fi
          if find kernel -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
            echo "[ERROR] Inline SUSFS hook stage produced reject/original files." | tee logs/07-susfs-failure.log
            find kernel -type f \( -name '*.rej' -o -name '*.orig' \) -print | tee -a logs/07-susfs-failure.log
            exit 1
          fi
          python3 - "${GITHUB_WORKSPACE}/kernel" > logs/07-susfs-conflict-markers-post-inline.log 2>&1 <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          bad = []
          start_re = re.compile(r'^<<<<<<<(?: .*)?$')
          sep_re = re.compile(r'^=======$')
          end_re = re.compile(r'^>>>>>>>(?: .*)?$')
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  lines = p.read_text(errors='replace').splitlines()
              except Exception:
                  continue
              state = 0
              start_line = 0
              for no, line in enumerate(lines, 1):
                  if state == 0 and start_re.match(line):
                      state = 1
                      start_line = no
                  elif state == 1 and sep_re.match(line):
                      state = 2
                  elif state == 2 and end_re.match(line):
                      bad.append(f'{p}:{start_line}-{no}')
                      state = 0
          if bad:
              print('REAL_MERGE_CONFLICT_MARKERS_FOUND')
              print('\n'.join(bad))
              raise SystemExit(1)
          print('[OK] No real merge-conflict triplets found after inline hooks.')
          PY
          if [ "$?" -ne 0 ]; then
            echo "[ERROR] Inline SUSFS hook stage left real merge-conflict markers." | tee logs/07-susfs-failure.log
            exit 1
          fi

          # V21: the upstream NonGKI flow explicitly runs susfs_inline_hook_patches.sh
          # only after KernelSU is embedded. Therefore CONFIG_KSU_SUSFS validation is
          # intentionally performed here, after the inline hook layer, not before it.
          require_grep 'KSU_SUSFS' kernel/fs/susfs.c kernel/include/linux/susfs.h kernel/include/linux/susfs_def.h kernel/drivers/kernelsu
          require_grep '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' kernel/drivers/kernelsu kernel/fs kernel/include/linux
          require_grep 'KSU_SUSFS' kernel/fs/Makefile
          {
            echo "=== V26 POST-INLINE SUSFS VALIDATION ==="
            echo "kernel_head=$(git -C kernel rev-parse HEAD)"
            echo "ksu_head=$(git -C kernel/KernelSU-Next rev-parse HEAD)"
            echo "ksu_tag=$(git -C kernel/KernelSU-Next describe --tags --exact-match HEAD 2>/dev/null || true)"
            grep -RInE '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' kernel/drivers/kernelsu kernel/fs kernel/include/linux 2>/dev/null | head -40 || true
          } | tee logs/07-susfs-post-inline-validation.txt
          git -C kernel diff --check | tee logs/07-susfs-diff-check-post-inline.log
          # Do NOT `git add -A` here: KernelSU-Next is intentionally a nested Git
          # checkout created by its official setup script. Staging the entire tree
          # produces the misleading "adding embedded git repository" warning.

          echo "[OK] SUSFS ${SUSFS_VERSION} 4.19 backport integrated using ${APPLY_MODE}."
          echo "::endgroup::"

      - name: "8. Configure features and enforce no-removal policy"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[8/15] Configure features"
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          make O=out "${TARGET_KERNEL_CONFIG}" > ../logs/08-defconfig.log 2>&1
          grep -RqsE "^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)" drivers/kernelsu fs include || { echo "[ERROR] KSU_SUSFS Kconfig symbol is missing after SUSFS + inline-hook integration."; exit 1; }
          ./scripts/config --file out/.config --enable KSU --enable KSU_SUSFS
          mapfile -t SUSFS_SYMBOLS < <(grep -RhoE '^config KSU_SUSFS_[A-Za-z0-9_]+' drivers/kernelsu fs include 2>/dev/null | awk '{print $2}' | sort -u)
          for sym in "${SUSFS_SYMBOLS[@]}"; do ./scripts/config --file out/.config --enable "${sym}" || true; done
          make O=out olddefconfig > ../logs/08-olddefconfig.log 2>&1
          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' out/.config | sort > ../post-integration-enabled-config.txt
          while IFS= read -r line; do
            sym="${line%%=*}"
            grep -q "^${sym}=" ../post-integration-enabled-config.txt || { echo "[ERROR] Baseline feature removed: ${sym}" | tee ../logs/08-no-removal-failure.log; exit 1; }
          done < ../baseline-enabled-config.txt
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          {
            echo "baseline_enabled=$(wc -l < ../baseline-enabled-config.txt)"
            echo "post_integration_enabled=$(wc -l < ../post-integration-enabled-config.txt)"
            echo "baseline_config_sha256=$(sha256sum ../baseline-enabled-config.txt | awk '{print $1}')"
            echo "post_integration_config_sha256=$(sha256sum ../post-integration-enabled-config.txt | awk '{print $1}')"
            grep -E '^CONFIG_(KSU|KPROBE|KPROBES|KSU_SUSFS)' out/.config || true
            echo "kernel_version=$(make -s O=out kernelversion)"
          } | tee ../logs/08-config-summary.log
          echo "[OK] No-removal gate passed"
          echo "::endgroup::"

      - name: "9. Build kernel"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[9/15] Build kernel"
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          # FIX: KernelSU-Next's drivers/kernelsu/feature/sucompat.c does
          # `#include <linux/minmax.h>`, a header that only exists in upstream kernels
          # much newer than this 4.19.325 CIP tree, so the build failed with:
          #   fatal error: 'linux/minmax.h' file not found
          # This adds that header only if it is missing (pure addition, nothing existing
          # is touched or removed). It pulls in the tree's own linux/kernel.h, which on
          # 4.19 already defines min/max/min_t/max_t/clamp/etc., and adds the one helper
          # (in_range) that 4.19's kernel.h does not have, matching upstream's definition.
          if [ ! -f include/linux/minmax.h ]; then
            mkdir -p include/linux
            {
              echo '#ifndef _LINUX_MINMAX_H'
              echo '#define _LINUX_MINMAX_H'
              echo ''
              echo '#include <linux/kernel.h>'
              echo ''
              echo '#ifndef in_range'
              echo '#define in_range(val, start, len) \'
              echo '    ((unsigned long)(val) - (unsigned long)(start) < (unsigned long)(len))'
              echo '#endif'
              echo ''
              echo '#endif /* _LINUX_MINMAX_H */'
            } > include/linux/minmax.h
            echo "[FIX] Added missing include/linux/minmax.h compatibility header for KernelSU-Next"
          fi
          make O=out -j"$(nproc)" CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCC=clang HOSTCXX=clang++ 2>&1 | tee ../logs/09-kernel-build.log
          test -s out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image | tee ../logs/output-image.sha256
          strings out/arch/arm64/boot/Image > ../logs/09-image-strings.txt
          if ! grep -m1 'Linux version ' ../logs/09-image-strings.txt > ../logs/09-image-version.log; then
            echo "[WARN] Linux version string was not found in Image; build artifact exists." | tee -a ../logs/09-image-version.log
          fi
          echo "[OK] Kernel Image built"
          echo "::endgroup::"

      - name: "10. Package AnyKernel3 and kernel.zip"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[10/15] Package AnyKernel3 and kernel.zip"
          rm -rf release work-anykernel
          mkdir -p release/logs release/build-info release/checksums work-anykernel
          cp kernel/out/arch/arm64/boot/Image release/kernel-image
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git work-anykernel 2>&1 | tee logs/10-anykernel-clone.log
          rm -rf work-anykernel/.git work-anykernel/modules work-anykernel/ramdisk
          cp kernel/out/arch/arm64/boot/Image work-anykernel/Image
          cat > work-anykernel/anykernel.sh <<'AK3'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=V26-LM-G900-KARNAL
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          '; }
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3
          (cd work-anykernel && zip -qr ../release/AnyKernel3-OrangeFox-Flashable.zip .)
          mkdir -p release/kernel-payload
          cp kernel/out/arch/arm64/boot/Image release/kernel-payload/Image
          cp source-info.txt baseline-info.txt toolchain-version.txt baseline-enabled-config.txt post-integration-enabled-config.txt release/build-info/ 2>/dev/null || true
          cp logs/*.log release/logs/ 2>/dev/null || true
          cp logs/*.patch release/logs/ 2>/dev/null || true
          (cd release/kernel-payload && zip -qr ../kernel.zip .)
          rm -rf release/kernel-payload
          {
            echo "workflow=${WORKFLOW_VERSION}"
            echo "workflow_name=V26-LM-G900-KARNAL-BUILT"
            echo "kernel_version=${BASELINE_KERNEL_VERSION}"
            echo "source_commit=$(git -C kernel rev-parse HEAD)"
            echo "cip_baseline=${BASELINE_CIP}"
            echo "cip_target=${CIP_TARGET}"
            echo "kernelsu_next=${KSU_VERSION}"
            echo "susfs_version=${SUSFS_VERSION}"
            echo "susfs_backport_repo=${SUSFS_BACKPORT_REPO}"
            echo "susfs_backport_ref=${SUSFS_BACKPORT_REF}"
            echo "clang=${CLANG_REV}"
            echo "clang_commit=${CLANG_COMMIT}"
            echo "defconfig=${TARGET_KERNEL_CONFIG}"
          } > release/build-info/build-manifest.txt
          sha256sum release/kernel-image release/kernel.zip release/AnyKernel3-OrangeFox-Flashable.zip > release/checksums/SHA256SUMS
          rm -f release/kernel-image
          (cd release && zip -qr "../${OUTPUT_PREFIX}-output.zip" .)
          echo "[OK] ${OUTPUT_PREFIX}-output.zip"
          echo "::endgroup::"

      - name: "11. Verify all final artifacts"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[11/15] Verify final artifacts"
          {
            test -s "${OUTPUT_PREFIX}-output.zip"
            test -s release/kernel.zip
            test -s release/AnyKernel3-OrangeFox-Flashable.zip
            unzip -t "${OUTPUT_PREFIX}-output.zip"
            unzip -t release/kernel.zip
            unzip -t release/AnyKernel3-OrangeFox-Flashable.zip
            unzip -l "${OUTPUT_PREFIX}-output.zip" | sed -n '1,220p'
          } 2>&1 | tee logs/11-artifact-verify.log
          echo "[OK] Final artifacts verified"
          echo "::endgroup::"

      - name: "12. Upload V26 final output"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: V26-LM-G900-KARNAL-output
          path: V26-LM-G900-KARNAL-output.zip
          if-no-files-found: error
          retention-days: 30

      - name: "13. Upload V26 flashable ZIPs"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: V26-LM-G900-KARNAL-flashable-zips
          path: |
            release/AnyKernel3-OrangeFox-Flashable.zip
            release/kernel.zip
          if-no-files-found: error
          retention-days: 30

      - name: "14. Collect complete diagnostics (always)"
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # Diagnostics must never fail the job a second time. In earlier versions the diagnostic
          # collector itself failed with "sort: write error: Broken pipe", masking
          # the original CIP failure. V19 writes large inventories to files and only
          # prints bounded summaries to the Actions console.
          set +e
          mkdir -p diagnostics diagnostics/logs diagnostics/cip-checks
          {
            echo "job_status=${JOB_STATUS}"
            echo "workflow=${WORKFLOW_VERSION}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "source_commit=${KERNEL_COMMIT}"
            echo "cip_baseline=${BASELINE_CIP}"
            echo "cip_target=${CIP_TARGET:-UNRESOLVED}"
            echo "kernelsu_next=${KSU_VERSION}"
            echo "susfs=${SUSFS_VERSION}"
            echo "susfs_backport_repo=${SUSFS_BACKPORT_REPO}"
            echo "susfs_backport_ref=${SUSFS_BACKPORT_REF}"
            echo "clang=${CLANG_REV} (${CLANG_COMMIT})"
            echo "baseline_kernel_sha256=${BASELINE_KERNEL_SHA256}"
            echo "defconfig=${TARGET_KERNEL_CONFIG:-UNRESOLVED}"
          } > diagnostics/run-summary.txt

          # Preserve every generated log, including partial logs from failed steps.
          cp -a logs/. diagnostics/logs/ 2>/dev/null || true
          cp -a logs/device-tree/. diagnostics/device-tree/ 2>/dev/null || true
          cp baseline-info.txt baseline-defconfig.txt baseline-enabled-config.txt \
             post-integration-enabled-config.txt source-info.txt toolchain-version.txt \
             baseline-git-status.txt diagnostics/ 2>/dev/null || true

          # Full workspace inventory goes to a file, not the Actions stdout pipe.
          find "$GITHUB_WORKSPACE" -type f \
            -not -path '*/.git/*' \
            -not -path '*/clang-prebuilt/*' \
            -printf '%P\t%s bytes\n' 2>/dev/null | sort > diagnostics/workspace-files.txt 2>/dev/null || true

          {
            echo "=== A-Z BUILD RECORD V26 ==="
            echo "Purpose=Preserve the known-working LM-G900 kernel baseline and add only CIP, KernelSU-Next, and SUSFS."
            echo "Device=LG Velvet LM-G900 family; codename=caymanlm"
            echo "Android/device branch=${DEVICE_REF}"
            echo "Kernel repo=${KERNEL_REPO}"
            echo "Kernel branch=${KERNEL_REF}"
            echo "Kernel commit=${KERNEL_COMMIT}"
            echo "Kernel version=${BASELINE_KERNEL_VERSION}"
            echo "Known-working baseline Image SHA256=${BASELINE_KERNEL_SHA256}"
            echo "Defconfig=${TARGET_KERNEL_CONFIG:-UNRESOLVED}"
            echo "CIP baseline=${BASELINE_CIP}"
            echo "CIP selected=${CIP_TARGET:-UNRESOLVED}"
            echo "KernelSU-Next=${KSU_VERSION}"
            echo "SUSFS=${SUSFS_VERSION}"
            echo "SUSFS backport repo=${SUSFS_BACKPORT_REPO}"
            echo "SUSFS backport ref=${SUSFS_BACKPORT_REF}"
            echo "Clang=${CLANG_REV}"
            echo "Clang commit=${CLANG_COMMIT}"
            echo "Architecture=arm64"
            echo "LLVM=1 LLVM_IAS=1"
            echo "No-removal policy=Every baseline enabled CONFIG_* symbol must remain present after integration."
            echo "Conflict policy=Never force, fuzz, or hide conflicts."
            echo
            echo "=== Repository revisions ==="
            git -C kernel rev-parse HEAD 2>/dev/null || true
            git -C device-caymanlm rev-parse HEAD 2>/dev/null || true
            git -C device-sm7250-common rev-parse HEAD 2>/dev/null || true
            git -C vendor-caymanlm rev-parse HEAD 2>/dev/null || true
            git -C susfs-backport rev-parse HEAD 2>/dev/null || true
            echo
            echo "=== Inventory file ==="
            echo "diagnostics/workspace-files.txt"
            echo
            echo "=== Kernel diff stat (staged + unstaged vs HEAD) ==="
            git -C kernel diff HEAD --stat 2>/dev/null || true
            echo
            echo "=== Kernel diff names (staged + unstaged vs HEAD) ==="
            git -C kernel diff HEAD --name-status 2>/dev/null || true
            echo
            echo "=== Final config ==="
            if [ -f kernel/out/.config ]; then
              sha256sum kernel/out/.config
              grep -E '^CONFIG_(KSU|KSU_SUSFS|KPROBES|KPROBE_EVENTS|MODULES)=' kernel/out/.config || true
            fi
            echo
            echo "=== Release hashes ==="
            find release -maxdepth 3 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum 2>/dev/null || true
          } > diagnostics/A-Z-BUILD-RECORD.txt 2>&1

          if [ -d kernel ]; then
            {
              echo "=== Kernel git status ==="; git -C kernel status --short || true
              echo; echo "=== Kernel HEAD ==="; git -C kernel rev-parse HEAD || true
              echo; echo "=== Kernel version ==="; make -s -C kernel kernelversion 2>/dev/null || true
              echo; echo "=== Reject files ==="; find kernel -type f -name '*.rej' -print 2>/dev/null || true
              echo; echo "=== Merge conflict markers ==="; grep -RInE '^(<<<<<<<|=======|>>>>>>>)' kernel --exclude-dir=.git 2>/dev/null | head -200 || true
            } > diagnostics/kernel-state.txt 2>&1
          fi

          # Copy the diagnostic bundle itself into the output zip only if the build
          # reached packaging; always create the separate complete-logs artifact.
          rm -f "../${OUTPUT_PREFIX}-complete-logs.zip"
          (cd diagnostics && zip -qr "../${OUTPUT_PREFIX}-complete-logs.zip" .) || true

          echo "::notice::V26 diagnostics collected; SUSFS acquisition retries, source-version consistency checks, safe 3-way fallback, exact four-file source reconciliation, the Step-7 ERR-trap/subshell fix, the pershoot/KernelSU-Next dev-susfs fork for CONFIG_KSU_SUSFS, the TARGET_KERNEL_CONFIG cross-step export fix, and artifact naming fixes are enabled."
          echo "::endgroup::"

      - name: "15. Upload V26 complete diagnostics (always)"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V26-LM-G900-KARNAL-complete-logs
          path: |
            V26-LM-G900-KARNAL-complete-logs.zip
            diagnostics/
            logs/
            baseline-info.txt
            baseline-defconfig.txt
            baseline-enabled-config.txt
            post-integration-enabled-config.txt
            baseline-git-status.txt
            source-info.txt
            toolchain-version.txt
          if-no-files-found: warn
          retention-days: 30
