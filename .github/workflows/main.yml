    - name: 05 - Apply official CIP135 delta while preserving LG source
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/05-cip135.log\") 2>&1\ncd \"$GITHUB_WORKSPACE\"\
        \nrm -rf cip132 cip135\ncurl -L --fail --retry 3 -o cip132.tar.xz https://cdn.kernel.org/pub/linux/kernel/projects/cip/4.19/linux-cip-4.19.325-cip132.tar.xz\n\
        curl -L --fail --retry 3 -o cip135.tar.xz https://cdn.kernel.org/pub/linux/kernel/projects/cip/4.19/linux-cip-4.19.325-cip135.tar.xz\n\
        mkdir -p cip132 cip135\ntar -xJf cip132.tar.xz --strip-components=1 -C cip132\ntar -xJf cip135.tar.xz --strip-components=1\
        \ -C cip135\ncd \"$GITHUB_WORKSPACE/kernel\"\npython3 - <<'PY2'\nimport pathlib, subprocess\nA=pathlib.Path('/github/workspace/cip132');\
        \ B=pathlib.Path('/github/workspace/cip135'); O=pathlib.Path('/github/workspace/ci-diagnostics/cip135.patch')\nfiles=set()\n\
        for base in (A,B):\n    for p in base.rglob('*'):\n        if p.is_file(): files.add(p.relative_to(base).as_posix())\n\
        out=[]\nfor f in sorted(files):\n    a=A/f; b=B/f\n    if a.exists() and b.exists():\n        r=subprocess.run(['diff','-u','--label','a/'+f,'--label','b/'+f,str(a),str(b)],text=True,capture_output=True)\n\
        \        if r.returncode==1: out.append(r.stdout)\nO.write_text(''.join(out))\nprint('patch bytes',O.stat().st_size)\n\
        PY2\nif [ -s \"$DIAG_DIR/cip135.patch\" ]; then\n  set +e\ngit apply --3way --whitespace=nowarn \"$DIAG_DIR/cip135.patch\"\
        \ 2>&1 | tee \"$DIAG_DIR/cip135-apply.log\"\n  rc=${PIPESTATUS[0]}\n  set -e\n  if [ \"$rc\" -ne 0 ]; then\n    git\
        \ status --short | tee \"$DIAG_DIR/cip135-status.txt\"\n    echo '::error::CIP135 delta could not be merged cleanly\
        \ into the LG tree.'\n    exit \"$rc\"\n  fi\nfi\nif git status --short -- arch/arm64/boot/dts arch/arm64/configs\
        \ | grep -q .; then\n  echo '::error::CIP135 touched device-specific DT/defconfig files.'\n  git status --short --\
        \ arch/arm64/boot/dts arch/arm64/configs\n  exit 1\nfi\necho 'PASS: CIP135 delta applied without DT/defconfig changes.'\n"
    - name: 06 - Integrate pinned SukiSU-Ultra 4.1.3 builtin
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$DIAG_DIR"

        exec > >(tee "$DIAG_DIR/06-sukisu.log") 2>&1

        rm -rf /tmp/SukiSU-Ultra

        git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/SukiSU-Ultra

        cd /tmp/SukiSU-Ultra

        git fetch --depth=1 origin "$SUKISU_COMMIT"

        git checkout --detach "$SUKISU_COMMIT"

        test "$(git rev-parse HEAD)" = "$SUKISU_COMMIT"

        cd "$GITHUB_WORKSPACE/kernel"

        bash /tmp/SukiSU-Ultra/kernel/setup.sh builtin

        find drivers/kernelsu -maxdepth 2 -type f | sort | tee "$DIAG_DIR/sukisu-files.txt"

        '
    - name: 07 - Integrate SUSFS 1.5.5 kernel-4.19
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/07-susfs.log\") 2>&1\nrm -rf /tmp/susfs4ksu\n\
        git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu\ncd /tmp/susfs4ksu\ngit fetch --depth=1\
        \ origin \"$SUSFS_REF\"\ngit checkout --detach \"$SUSFS_REF\"\ncd \"$GITHUB_WORKSPACE/kernel\"\ncp -f /tmp/susfs4ksu/kernel_patches/fs/susfs.c\
        \ fs/susfs.c\ncp -f /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h\n[ -f /tmp/susfs4ksu/kernel_patches/include/linux/susfs_def.h\
        \ ] && cp -f /tmp/susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h || true\nPATCH=/tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch\n\
        test -f \"$PATCH\"\nset +e\npatch -p1 --forward --batch < \"$PATCH\" 2>&1 | tee \"$DIAG_DIR/susfs-patch-apply.log\"\
        \nrc=${PIPESTATUS[0]}\nset -e\nif find . -name '*.rej' -print -quit | grep -q .; then\n  find . -name '*.rej' -print\
        \ | tee \"$DIAG_DIR/susfs-rejects.txt\"\n  echo '::error::SUSFS patch generated reject files.'\n  exit 1\nfi\nif grep\
        \ -Eq 'FAILED|saving rejects|Hunk #[0-9]+ FAILED' \"$DIAG_DIR/susfs-patch-apply.log\"; then\n  echo '::error::SUSFS\
        \ patch reported failed hunks.'\n  exit 1\nfi\nif [ \"$rc\" -ne 0 ]; then echo '::warning::patch returned nonzero\
        \ but no rejects/failed hunks were reported.'; fi\ntest -f fs/susfs.c\ntest -f include/linux/susfs.h\ngrep -q susfs\
        \ fs/Makefile\necho 'PASS: SUSFS 1.5.5 integrated.'\n"
