name: LG Velvet 5G - WORKING 4.19 Non-GKI + KernelSU-Next + SUSFS v2.2.0

on:
  push:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "EXACT WORKING kernel branch"
        required: true
        type: choice
        options: [sixteen]
        default: sixteen
      defconfig:
        description: "EXACT WORKING kernel defconfig"
        required: true
        type: choice
        options: [vendor/caymanlm_defconfig]
        default: vendor/caymanlm_defconfig

permissions:
  contents: read

concurrency:
  group: lg-velvet-4.19-ksun-susfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build exact LG 4.19 baseline + latest KSU-Next legacy/SUSFS
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || 'sixteen' }}
      SOURCE_COMMIT: 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49
      DEFCONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'vendor/caymanlm_defconfig' }}

      # Latest known 4.19-compatible KSU-Next/SUSFS integration:
      # sidex15 legacy-susfs-v2 carries the legacy/manual-hook KSU-Next path.
      KSUN_REPO: https://github.com/sidex15/KernelSU-Next.git
      KSUN_BRANCH: legacy-susfs-v2

      # JackA1ltman's 4.19 backport explicitly identifies this patch as SUSFS v2.2.00.
      SUSFS_PATCH_URL: https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch
      SUSFS_HOOK_URL: https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh

      CLANG_REVISION: clang-r563880c
      CLANG_PREBUILT_TAG: ndk-r29
      GCC64_BRANCH: lineage-19.1
      GCC32_BRANCH: lineage-19.1

      ARCH: arm64
      OUT_DIR: ${{ github.workspace }}/out
      DIAG_DIR: ${{ github.workspace }}/ci-diagnostics

      # Known-good working .config hash from the previously successful build.
      WORKING_BASELINE_CONFIG_SHA256: 8b931841bcfcfad0b8ed596fbc156e67a6da8f32f226753ffabc89c907accffa

    steps:
      - name: 01 - Checkout EXACT WORKING kernel source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/kernel"
          mkdir -p "$DIAG_DIR"
          git clone --depth=1 --branch "$SOURCE_BRANCH" "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          echo "source_branch=$SOURCE_BRANCH" | tee "$DIAG_DIR/01-source.txt"
          echo "source_commit=$(git rev-parse HEAD)" | tee -a "$DIAG_DIR/01-source.txt"
          make -s kernelversion | tee -a "$DIAG_DIR/01-source.txt"

      - name: 02 - Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex git libelf-dev libssl-dev \
            lld llvm python3 python-is-python3 rsync unzip wget xz-utils
          test -x /usr/bin/python
          python --version | tee "$DIAG_DIR/02-toolchain-host.txt"

      - name: 03 - Download EXACT existing working toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf clang-prebuilt gcc64 gcc32

          git clone --depth=1 --filter=blob:none --sparse \
            --branch "$CLANG_PREBUILT_TAG" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-prebuilt
          cd clang-prebuilt
          git sparse-checkout set "$CLANG_REVISION"
          cd "$GITHUB_WORKSPACE"

          git clone --depth=1 --branch "$GCC64_BRANCH" \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 --branch "$GCC32_BRANCH" \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

          test -x "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang"
          test -x "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc"
          test -x "$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc"

          "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc" --version | head -1 | tee "$DIAG_DIR/03-toolchain.txt"
          "$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc" --version | head -1 | tee -a "$DIAG_DIR/03-toolchain.txt"
          "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang" --version | head -2 | tee -a "$DIAG_DIR/03-toolchain.txt"

          echo "CLANG_DIR=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION" >> "$GITHUB_ENV"
          echo "GCC64_DIR=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"
          echo "PATH=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH" >> "$GITHUB_ENV"

      - name: 04 - Generate and verify EXACT working baseline config
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          make O="$OUT_DIR" ARCH="$ARCH" "$DEFCONFIG" 2>&1 | tee "$DIAG_DIR/04-defconfig.log"
          test -f "$OUT_DIR/.config"
          sha256sum "$OUT_DIR/.config" | tee "$DIAG_DIR/04-config-sha256.txt"
          ACTUAL="$(sha256sum "$OUT_DIR/.config" | awk '{print $1}')"
          test "$ACTUAL" = "$WORKING_BASELINE_CONFIG_SHA256"

          cp "$OUT_DIR/.config" "$RUNNER_TEMP/baseline.config"
          cp "$OUT_DIR/.config" "$DIAG_DIR/baseline.config"

      - name: 05 - Resolve latest legacy KernelSU-Next branch and record commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/KernelSU-Next"
          git clone --depth=1 --branch "$KSUN_BRANCH" "$KSUN_REPO" "$GITHUB_WORKSPACE/KernelSU-Next"
          cd "$GITHUB_WORKSPACE/KernelSU-Next"
          KSUN_COMMIT="$(git rev-parse HEAD)"
          echo "KSUN_REPO=$KSUN_REPO" | tee "$DIAG_DIR/05-ksun-version.txt"
          echo "KSUN_BRANCH=$KSUN_BRANCH" | tee -a "$DIAG_DIR/05-ksun-version.txt"
          echo "KSUN_COMMIT=$KSUN_COMMIT" | tee -a "$DIAG_DIR/05-ksun-version.txt"
          grep -R 'SUSFS_VERSION' kernel include uapi 2>/dev/null | head -20 | tee -a "$DIAG_DIR/05-ksun-version.txt" || true
          test -f kernel/setup.sh

      - name: 06 - Integrate KernelSU-Next using its upstream setup script
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          bash "$GITHUB_WORKSPACE/KernelSU-Next/kernel/setup.sh" "$KSUN_BRANCH"
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          git status --short | tee "$DIAG_DIR/06-ksun-status.txt"

      - name: 07 - Apply SUSFS v2.2.0 4.19 backport
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"

          curl -fL "$SUSFS_PATCH_URL" -o "$RUNNER_TEMP/susfs_patch_to_4.19.patch"
          curl -fL "$SUSFS_HOOK_URL" -o "$RUNNER_TEMP/susfs_inline_hook_patches.sh"
          chmod +x "$RUNNER_TEMP/susfs_inline_hook_patches.sh"

          echo "Patch identity:" | tee "$DIAG_DIR/07-susfs-version.txt"
          grep -n 'SUSFS_VERSION "v2.2.0"' "$RUNNER_TEMP/susfs_patch_to_4.19.patch" | head -1 | tee -a "$DIAG_DIR/07-susfs-version.txt"
          grep -n 'PATCH_LEVEL="2.2.00"' "$RUNNER_TEMP/susfs_inline_hook_patches.sh" | head -1 | tee -a "$DIAG_DIR/07-susfs-version.txt"

          patch --dry-run -p1 < "$RUNNER_TEMP/susfs_patch_to_4.19.patch" 2>&1 | tee "$DIAG_DIR/07-susfs-dryrun.log"
          patch -p1 < "$RUNNER_TEMP/susfs_patch_to_4.19.patch" 2>&1 | tee "$DIAG_DIR/07-susfs-apply.log"

          bash "$RUNNER_TEMP/susfs_inline_hook_patches.sh" 2>&1 | tee "$DIAG_DIR/07-susfs-hooks.log"

          if find . -type f -name '*.rej' -o -name '*.orig' | grep -q .; then
            echo "::error::SUSFS patch left reject/orig files."
            find . -type f \( -name '*.rej' -o -name '*.orig' \) | tee "$DIAG_DIR/07-rejects.txt"
            exit 1
          fi

      - name: 08 - Configure KSU-Next manual hooks + SUSFS v2.2.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"

          # The legacy-susfs-v2 Kconfig supports manual hooks when KPROBES is off.
          # We intentionally preserve KPROBES=n; this is the compatible 4.19 path.
          scripts/config --file "$OUT_DIR/.config" \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_TRY_UMOUNT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --disable KSU_SUSFS_SUS_SU \
            --disable KSU_SUSFS_SUS_MEMFD \
            --disable KPROBES

          make O="$OUT_DIR" ARCH="$ARCH" olddefconfig 2>&1 | tee "$DIAG_DIR/08-olddefconfig.log"

          grep -E '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_SUS_PATH=|CONFIG_KSU_SUSFS_SUS_MOUNT=|CONFIG_KSU_SUSFS_SUS_KSTAT=|CONFIG_KSU_SUSFS_TRY_UMOUNT=|CONFIG_KSU_SUSFS_SPOOF_UNAME=|CONFIG_KSU_SUSFS_ENABLE_LOG=|CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=|CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=|CONFIG_KSU_SUSFS_OPEN_REDIRECT=|CONFIG_KSU_SUSFS_SUS_MAP=|CONFIG_KPROBES=)' "$OUT_DIR/.config" | tee "$DIAG_DIR/08-kconfig.txt"

          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_KPROBES is not set$' "$OUT_DIR/.config"

      - name: 09 - Semantic config drift check
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/baseline.config" "$OUT_DIR/.config" "$DIAG_DIR/09-config-diff.txt" <<'PY'
          import sys, re
          base, final, report = sys.argv[1:]
          def load(p):
              d={}
              for line in open(p, errors="ignore"):
                  line=line.strip()
                  m=re.match(r'(CONFIG_[A-Za-z0-9_]+)=(.*)', line)
                  if m: d[m.group(1)]=m.group(2)
                  elif line.startswith('# CONFIG_') and line.endswith(' is not set'):
                      k=line[2:-len(' is not set')]
                      d[k]='n'
              return d
          b,f=load(base),load(final)
          allowed={
            'CONFIG_KSU','CONFIG_KSU_MANUAL_HOOK','CONFIG_KSU_SUSFS',
            'CONFIG_KSU_SUSFS_SUS_PATH','CONFIG_KSU_SUSFS_SUS_MOUNT',
            'CONFIG_KSU_SUSFS_SUS_KSTAT','CONFIG_KSU_SUSFS_TRY_UMOUNT',
            'CONFIG_KSU_SUSFS_SPOOF_UNAME','CONFIG_KSU_SUSFS_ENABLE_LOG',
            'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS',
            'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG',
            'CONFIG_KSU_SUSFS_OPEN_REDIRECT','CONFIG_KSU_SUSFS_SUS_MAP',
            'CONFIG_KSU_SUSFS_SUS_SU','CONFIG_KSU_SUSFS_SUS_MEMFD',
          }
          drift=[]
          for k in sorted(set(b)|set(f)):
              if k in allowed: continue
              if b.get(k,'n') != f.get(k,'n'):
                  drift.append(f"{k}: baseline={b.get(k,'n')} final={f.get(k,'n')}")
          open(report,'w').write('\n'.join(drift) or 'NO_NON_KSU_DRIFT\n')
          print(open(report).read())
          if drift:
              raise SystemExit("Unexpected non-KSU configuration drift")
          PY

      - name: 10 - Source scope verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          git diff --check | tee "$DIAG_DIR/10-diff-check.log"

          git status --short | tee "$DIAG_DIR/10-source-status.txt"

          # Only KSU/SUSFS integration files may be added/changed.
          # Device/vendor/DT/performance code is never permitted to change.
          bad="$(git status --short | awk '{print $2}' | grep -Ev \
            '^(drivers/Kconfig|drivers/Makefile|drivers/input/input.c|drivers/kernelsu/|fs/Makefile|fs/(dcache|devpts/inode|exec|inode|namei|open|overlayfs/|proc/|read_write|readdir|stat|statfs|namespace|susfs|sus_su)\.c$|fs/overlayfs/|include/linux/(sched|susfs|sus_su|susfs_def|susfs_ksu_compat)\.h$|kernel/(sys|reboot|kallsyms)\.c$|security/(security\.c|selinux/)|include/linux/seccomp\.h$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Unexpected source files changed:"
            echo "$bad"
            exit 1
          fi

      - name: 11 - Build kernel Image
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"
          make -j"$(nproc)" O="$OUT_DIR" ARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ \
            "$DEFCONFIG" 2>&1 | tee "$DIAG_DIR/11-defconfig.log"
          # Restore KSU/SUSFS selections after defconfig if this old kernel
          # regenerates the config from the vendor defconfig.
          scripts/config --file "$OUT_DIR/.config" \
            --enable KSU --enable KSU_MANUAL_HOOK --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT --enable KSU_SUSFS_TRY_UMOUNT \
            --enable KSU_SUSFS_SPOOF_UNAME --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT --enable KSU_SUSFS_SUS_MAP \
            --disable KSU_SUSFS_SUS_SU --disable KSU_SUSFS_SUS_MEMFD \
            --disable KPROBES
          make O="$OUT_DIR" ARCH=arm64 olddefconfig 2>&1 | tee "$DIAG_DIR/11-olddefconfig.log"

          make -j"$(nproc)" O="$OUT_DIR" ARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ \
            Image 2>&1 | tee "$DIAG_DIR/11-build.log"

          test -f "$OUT_DIR/arch/arm64/boot/Image"
          file "$OUT_DIR/arch/arm64/boot/Image" | tee "$DIAG_DIR/11-image-info.txt"
          sha256sum "$OUT_DIR/arch/arm64/boot/Image" | tee "$DIAG_DIR/11-image-sha256.txt"

      - name: 12 - Runtime-independent symbol verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          {
            echo "=== KernelSU-Next source ==="
            grep -RhoE '\bksu_[A-Za-z0-9_]+' drivers/kernelsu 2>/dev/null | sort -u | head -100 || true
            echo "=== SUSFS source ==="
            grep -RhoE '\bsusfs_[A-Za-z0-9_]+' fs/susfs.c include/linux/susfs*.h 2>/dev/null | sort -u | head -100 || true
          } | tee "$DIAG_DIR/12-symbol-source.txt"

      - name: 13 - Collect COMPLETE diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/kernel"
          {
            echo "=== SOURCE ==="
            git rev-parse HEAD
            echo "=== CONFIG ==="
            sha256sum "$OUT_DIR/.config" 2>/dev/null || true
            grep -E '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_EXT4_FS|CONFIG_THREAD_INFO_IN_TASK)' "$OUT_DIR/.config" 2>/dev/null || true
            echo "=== STATUS ==="
            git status --short
            echo "=== DIFF STAT ==="
            git diff --stat
            echo "=== RECENT COMMITS ==="
            git log -5 --oneline
          } > "$DIAG_DIR/13-final-summary.txt"

          tar -czf "$GITHUB_WORKSPACE/final-diagnostics.tar.gz" "$DIAG_DIR" 2>/dev/null || true

      - name: Upload COMPLETE diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSUNext-SUSFS-diagnostics
          path: |
            ci-diagnostics/
            final-diagnostics.tar.gz
            out/.config
          if-no-files-found: warn
          retention-days: 30

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSUNext-SUSFS-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 30
