name: LG Velvet G900EMW — Android 16 QPR2 Kernel + Vendor

# Android 16 QPR2 is API 36.1.  The workflow deliberately keeps the LG 4.19
# device kernel and proprietary hardware interfaces intact; GSI compatibility
# is handled through VINTF/vendor API checks rather than replacing LG HALs.

on:
  workflow_dispatch:
    inputs:
      kernel_source_commit:
        description: "Exact kernel commit (leave blank for branch HEAD)"
        required: false
        default: ""
      android_manifest_url:
        description: "Android 16 manifest URL for the vendor build"
        required: false
        default: "https://github.com/LineageOS/android.git"
      android_manifest_branch:
        description: "Android 16 manifest branch/tag"
        required: false
        default: "lineage-23.2"
      vendor_device_branch:
        description: "G900EMW-compatible device/vendor branch"
        required: false
        default: "lineage-23.2"
  push:
    branches: [sixteen]

permissions:
  contents: read
  actions: read

concurrency:
  group: g900emw-kernel-vendor-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_BRANCH: sixteen
  DEFCONFIG: vendor/caymanlm_defconfig
  ARCH: arm64
  CLANG_VERSION: 18
  SUKISU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
  SUKISU_REF: 3f602b5
  SUSFS_REF: 001e69919c6271f690fd00b17e4c721c9e599152
  KERNEL_OUT: ${{ github.workspace }}/kernel/out
  DIAG_ROOT: ${{ github.workspace }}/ci-diagnostics
  DEVICE_REPO: https://github.com/lge-qcom-dev/android_device_lge_caymanlm.git
  COMMON_DEVICE_REPO: https://github.com/lge-qcom-dev/android_device_lge_sm7250-common.git
  VENDOR_REPO: https://github.com/lge-qcom-dev/proprietary_vendor_lge_caymanlm.git
  COMMON_VENDOR_REPO: https://github.com/lge-qcom-dev/proprietary_vendor_lge_sm7250-common.git
  TARGET_DEVICE: caymanlm
  TARGET_PRODUCT: lineage_caymanlm
  TARGET_ARCH: arm64
  TARGET_VARIANT: userdebug

jobs:
  kernel:
    name: "KERNEL — 4.19.325 + SukiSU-Ultra + KPM + SUSFS"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_source_commit != '' && inputs.kernel_source_commit || github.ref_name }}
          fetch-depth: 0

      - name: Install kernel dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential ccache clang lld llvm \
            libssl-dev libelf-dev libdw-dev device-tree-compiler \
            python3 python3-pip git rsync zip unzip dwarves

      - name: Prepare independent kernel diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$DIAG_ROOT/kernel" "$KERNEL_OUT"
          {
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "branch=${{ github.ref_name }}"
            echo "defconfig=$DEFCONFIG"
            echo "device=LG Velvet G900EMW"
            echo "kernel=4.19.325"
            echo "features=SukiSU-Ultra+KPM+SUSFS+WALT+SchedTune+ZRAM+LTO"
            date -u +%FT%TZ
          } | tee "$DIAG_ROOT/kernel/00-context.txt"

      - name: Prepare LLVM toolchain and kernel build helpers
        shell: bash
        run: |
          set -euxo pipefail
          # The previous failure came from the kernel Makefile probing the host
          # GNU assembler even though LLVM_IAS=1 was requested.  Force the
          # complete LLVM toolchain, including AS, before any make invocation.
          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          clang --version | head -n 2
          ld.lld --version | head -n 1
          export PATH="$(dirname "$(command -v clang)"):$PATH"

          # as-version.sh expects this helper on older 4.19 trees.  Do not
          # silently invent a kernel helper: restore it from the checked-out
          # source object when it exists, and record a hard failure otherwise.
          if test -f scripts/as-version.sh && test -f scripts/min-tool-version.sh; then
            echo "kernel build helpers: present in source" | tee "$DIAG_ROOT/kernel/00-toolchain.txt"
          else
            # A few LG-derived 4.19 trees kept as-version.sh but accidentally
            # dropped its companion helper.  Restore the standard 4.19 helper
            # only when it is genuinely missing; never overwrite a source file.
            test -f scripts/as-version.sh
            printf '%s\n' \
              '#!/bin/sh' \
              'set -e' \
              'case "$1" in' \
              '  binutils) echo 2.25.0 ;;' \
              '  gcc) echo 5.1.0 ;;' \
              '  llvm) echo 10.0.1 ;;' \
              '  *) echo "$1: unknown tool" >&2; exit 1 ;;' \
              'esac' > scripts/min-tool-version.sh
            echo "kernel build helper restored for legacy 4.19 tree" | tee "$DIAG_ROOT/kernel/00-toolchain.txt"
          fi
          chmod +x scripts/as-version.sh scripts/min-tool-version.sh

          {
            echo "CC=clang"
            echo "HOSTCC=clang"
            echo "AS=clang"
            echo "HOSTAS=clang"
            echo "LD=ld.lld"
            echo "AR=llvm-ar"
            echo "NM=llvm-nm"
            echo "OBJCOPY=llvm-objcopy"
            echo "OBJDUMP=llvm-objdump"
            echo "READELF=llvm-readelf"
            echo "STRIP=llvm-strip"
            echo "LLVM=1"
            echo "LLVM_IAS=1"
          } >> "$DIAG_ROOT/kernel/00-toolchain.txt"

      - name: Restore pristine defconfig safely
        shell: bash
        run: |
          set -euxo pipefail
          CFG="arch/arm64/configs/$DEFCONFIG"
          # Never assume a previous workflow step left the source tree intact.
          # Restore the tracked file directly from the checked-out commit.
          if ! test -f "$CFG"; then
            git restore --source=HEAD -- "$CFG" 2>/dev/null || true
          fi
          if ! test -f "$CFG"; then
            git show "HEAD:$CFG" > "$CFG"
          fi
          test -s "$CFG"
          sha256sum "$CFG" | tee "$DIAG_ROOT/kernel/01-defconfig.sha256"
          make O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            "$DEFCONFIG" 2>&1 | tee "$DIAG_ROOT/kernel/02-defconfig.log"
          cp "$KERNEL_OUT/.config" "$DIAG_ROOT/kernel/working.config"

      - name: Apply only approved Android-16 kernel compatibility options
        shell: bash
        run: |
          set -euxo pipefail
          CFG="$KERNEL_OUT/.config"
          test -x scripts/config || make -C . O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar scripts

          # Existing LG/SM7250 support is preserved; these are compatibility
          # checks/requirements, not a wholesale defconfig rewrite.
          scripts/config --file "$CFG" \
            --enable ARM64 \
            --enable BPF \
            --enable BPF_SYSCALL \
            --enable BPF_JIT \
            --enable BPF_JIT_ALWAYS_ON \
            --enable CGROUP_BPF \
            --enable OVERLAY_FS \
            --enable TMPFS \
            --enable TMPFS_XATTR \
            --enable SECURITY \
            --enable SECURITY_SELINUX \
            --enable DM_VERITY \
            --enable DM_VERITY_FEC \
            --enable FS_VERITY \
            --enable ZRAM \
            --enable ZSMALLOC

          # Only enable EROFS if this 4.19 tree actually exposes it.
          if grep -q '^config EROFS_FS' fs/erofs/Kconfig 2>/dev/null; then
            scripts/config --file "$CFG" --enable EROFS_FS
            echo "EROFS=enabled" | tee "$DIAG_ROOT/kernel/03-gsi-filesystems.txt"
          else
            echo "EROFS=not-present-in-4.19-source-tree" | tee "$DIAG_ROOT/kernel/03-gsi-filesystems.txt"
          fi

          # KPM/non-GKI requirements documented by SukiSU-Ultra.
          scripts/config --file "$CFG" \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable KPM 2>/dev/null || true

          make O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            olddefconfig 2>&1 | tee "$DIAG_ROOT/kernel/04-olddefconfig.log"
          cp "$CFG" "$DIAG_ROOT/kernel/final.config"

      - name: Integrate SukiSU-Ultra deterministically
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf SukiSU-Ultra drivers/kernelsu
          git clone --depth=1 "$SUKISU_REPO" SukiSU-Ultra
          cd SukiSU-Ultra
          if git fetch --depth=1 origin "$SUKISU_REF"; then
            git checkout --detach "$SUKISU_REF"
          else
            git fetch --depth=1 origin refs/tags/v4.1.3
            git checkout --detach refs/tags/v4.1.3
          fi
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/$DIAG_ROOT/kernel/05-sukisu-resolved.txt"
          cd ..

          test -f SukiSU-Ultra/kernel/Makefile
          test -f SukiSU-Ultra/kernel/Kconfig

          mkdir -p drivers
          ln -s "$PWD/SukiSU-Ultra/kernel" drivers/kernelsu

          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q '^obj-$(CONFIG_KSU) += kernelsu/$' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

      - name: Integrate SUSFS only when patch set matches this kernel
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf susfs
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs
          git -C susfs fetch --depth=1 origin "$SUSFS_REF"
          git -C susfs checkout --detach "$SUSFS_REF"

          {
            echo "SUSFS requested ref=$SUSFS_REF"
            git -C susfs rev-parse HEAD
            test -f susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch
            echo "PATCH=present"
          } | tee "$DIAG_ROOT/kernel/05-susfs-source.txt"

          # Clean-source preflight. Do not accept fuzz or a partially applied
          # patch: this is what avoids the previous "Hunk FAILED" situation.
          patch --dry-run --batch --forward --fuzz=0 -p1             < susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch             2>&1 | tee "$DIAG_ROOT/kernel/06-susfs-dry-run.log"

          patch --batch --forward --fuzz=0 -p1             < susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch             2>&1 | tee "$DIAG_ROOT/kernel/06-susfs-apply.log"

          grep -q 'CONFIG_KSU_SUSFS' drivers/kernelsu/Kconfig
          grep -q 'susfs' fs/Makefile

      - name: Verify KSU/KPM/SUSFS configuration
        shell: bash
        run: |
          set -euxo pipefail
          CFG="$KERNEL_OUT/.config"
          {
            grep -E 'CONFIG_(KSU|KPM|KALLSYMS|KALLSYMS_ALL|SUSFS|OVERLAY_FS|EROFS_FS|F2FS_FS|BPF|CGROUP_BPF|DM_VERITY|FS_VERITY|ZRAM|ZSMALLOC)' "$CFG" || true
          } | tee "$DIAG_ROOT/kernel/07-root-gsi-config.txt"

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail
          make O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf STRIP=llvm-strip \
            -j"$(nproc)" 2>&1 | tee "$DIAG_ROOT/kernel/08-build.log"

      - name: Verify kernel outputs
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          test -s "$KERNEL_OUT/arch/arm64/boot/Image"
          {
            file "$KERNEL_OUT/arch/arm64/boot/Image"
            sha256sum "$KERNEL_OUT/arch/arm64/boot/Image"
            grep -E 'CONFIG_(KSU|KPM|SUSFS|KALLSYMS|KALLSYMS_ALL)=' "$KERNEL_OUT/.config" || true
          } | tee "$DIAG_ROOT/kernel/09-output.txt"

      - name: Package AnyKernel3/OrangeFox flash ZIP
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          # Prefer the boot-ready compressed+DTB artifact when this LG tree
          # produces one; otherwise fall back to the raw ARM64 Image.
          if test -s "$KERNEL_OUT/arch/arm64/boot/Image.gz-dtb"; then
            KERNEL_FILE="Image.gz-dtb"
          elif test -s "$KERNEL_OUT/arch/arm64/boot/Image-dtb"; then
            KERNEL_FILE="Image-dtb"
          else
            KERNEL_FILE="Image"
          fi
          cp "$KERNEL_OUT/arch/arm64/boot/$KERNEL_FILE" "AnyKernel3/$KERNEL_FILE"
          cp "$KERNEL_OUT/.config" "$DIAG_ROOT/kernel/final.config"
          cat > AnyKernel3/anykernel.sh <<'AK'
          properties() { '
          kernel.string=LG Velvet G900EMW 4.19.325 + SukiSU-Ultra + KPM + SUSFS
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          supported.versions=
          supported.patchlevels=
          '; }
          kernel=__KERNEL_FILE__;
          block=auto;
          is_slot_device=auto;
          AK
          sed -i "s/__KERNEL_FILE__/$KERNEL_FILE/" AnyKernel3/anykernel.sh
          mkdir -p "$GITHUB_WORKSPACE/artifacts/kernel"
          echo "selected_kernel=$KERNEL_FILE" | tee "$DIAG_ROOT/kernel/09-kernel-package.txt"
          (cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/artifacts/kernel/G900EMW-Kernel-SukiSU-KPM-SUSFS-AnyKernel3.zip" .)
          cp "$KERNEL_OUT/arch/arm64/boot/$KERNEL_FILE" "$GITHUB_WORKSPACE/artifacts/kernel/$KERNEL_FILE"
          cp "$KERNEL_OUT/.config" "$GITHUB_WORKSPACE/artifacts/kernel/"

      - name: Upload kernel result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G900EMW-kernel-${{ github.run_id }}
          path: |
            ci-diagnostics/kernel/**
            artifacts/kernel/**
            kernel/out/.config
            kernel/out/arch/arm64/boot/Image
          if-no-files-found: warn
          retention-days: 14

  vendor:
    name: "VENDOR — G900EMW/caymanlm Android-16 compatibility build"
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare vendor diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$DIAG_ROOT/vendor" "$GITHUB_WORKSPACE/android"
          {
            echo "run_id=${{ github.run_id }}"
            echo "device=$TARGET_DEVICE"
            echo "target=$TARGET_PRODUCT"
            echo "android_manifest=${{ inputs.android_manifest_branch || 'lineage-23.2' }}"
            echo "vendor_branch=${{ inputs.vendor_device_branch || 'lineage-23.2' }}"
            date -u +%FT%TZ
          } | tee "$DIAG_ROOT/vendor/00-context.txt"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git gperf \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools unzip xsltproc \
            zip zstd python3 python3-pip python3-venv device-tree-compiler \
            lzip libtinfo6

          # Ubuntu 24.04 removed the old libtinfo5 package.  Some legacy
          # Android host tools still request it, so install it only when the
          # package is actually available; otherwise keep the supported
          # libtinfo6 runtime and continue.
          if apt-cache show libtinfo5 >/dev/null 2>&1; then
            sudo apt-get install -y libtinfo5
          else
            echo "libtinfo5 unavailable on this runner; using libtinfo6"
          fi

      - name: Initialize Android-16 source
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          git clone --depth=1 https://gerrit.googlesource.com/git-repo repo
          export PATH="$PWD/repo:$PATH"
          repo init -u "${{ inputs.android_manifest_url }}" \
            -b "${{ inputs.android_manifest_branch || 'lineage-23.2' }}" --depth=1
          # The device/vendor repositories are added through a local manifest.
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/g900emw.xml <<XML
          <manifest>
            <remote name="github" fetch="https://github.com/" />
            <project name="lge-qcom-dev/android_device_lge_caymanlm"
                     path="device/lge/caymanlm"
                     remote="github"
                     revision="${{ inputs.vendor_device_branch || 'lineage-23.2' }}" />
            <project name="lge-qcom-dev/android_device_lge_sm7250-common"
                     path="device/lge/sm7250-common"
                     remote="github"
                     revision="${{ inputs.vendor_device_branch || 'lineage-23.2' }}" />
            <project name="lge-qcom-dev/proprietary_vendor_lge_caymanlm"
                     path="vendor/lge/caymanlm"
                     remote="github"
                     revision="${{ inputs.vendor_device_branch || 'lineage-23.2' }}" />
            <project name="lge-qcom-dev/proprietary_vendor_lge_sm7250-common"
                     path="vendor/lge/sm7250-common"
                     remote="github"
                     revision="${{ inputs.vendor_device_branch || 'lineage-23.2' }}" />
          </manifest>
          XML
          repo sync -c --force-sync --no-clone-bundle --no-tags --partial-clone --clone-filter=blob:limit=10m -j"$(nproc)" \
            2>&1 | tee "$DIAG_ROOT/vendor/01-repo-sync.log"

      - name: Verify device/vendor trees before build
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          test -f device/lge/caymanlm/BoardConfig.mk
          test -f device/lge/caymanlm/device.mk
          test -f device/lge/caymanlm/proprietary-files.txt
          test -f device/lge/sm7250-common/BoardConfigCommon.mk
          test -f vendor/lge/caymanlm/caymanlm-vendor.mk
          test -d vendor/lge/caymanlm/proprietary/vendor
          {
            git -C device/lge/caymanlm rev-parse HEAD
            git -C device/lge/sm7250-common rev-parse HEAD
            git -C vendor/lge/caymanlm rev-parse HEAD
            find vendor/lge/caymanlm/proprietary/vendor -type f | wc -l
          } | tee "$DIAG_ROOT/vendor/02-tree-state.txt"

      - name: Verify Android-16/VINTF/vendor API compatibility
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          {
            echo "=== Android 16 QPR2 vendor compatibility ==="
            grep -Rns 'framework_compatibility_matrix' device/lge/caymanlm device/lge/sm7250-common || true
            grep -Rns 'vintf' device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm | head -200 || true
            grep -Rns 'ro.vendor.api_level\|ro.vndk.version\|BOARD_VNDK_VERSION' \
              device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm || true
          } | tee "$DIAG_ROOT/vendor/03-vintf-api-audit.txt"

      - name: Mandatory G900EMW hardware feature audit
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          mkdir -p "$DIAG_ROOT/vendor"
          {
            echo "=== Mandatory hardware compatibility audit ==="
            echo "device=G900EMW / caymanlm"
            echo "target=Android 16 QPR2-compatible vendor interfaces"
            echo
            echo "[Fingerprint]"
            grep -RniE 'fingerprint|biometric|egis|goodix|fpc' \
              device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm \
              | head -200 || true
            echo
            echo "[Vibration / haptics]"
            grep -RniE 'vibrator|haptic|haptics' \
              device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm \
              | head -200 || true
            echo
            echo "[Dual SIM / telephony]"
            grep -RniE 'dsds|dual.?sim|subscription|radio|ril' \
              device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm \
              | head -200 || true
            echo
            echo "[Audio / sound]"
            grep -RniE 'audio|tinyalsa|audio_policy|mixer|snd|sound' \
              device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm \
              | head -250 || true
            echo
            echo "[Treble/VINTF]"
            find device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm \
              -type f \( -name '*manifest*.xml' -o -name '*compatibility*.xml' -o -name 'vintf*.xml' \) -print | sort
          } | tee "$DIAG_ROOT/vendor/04-hardware-feature-audit.txt"

          # These are hard gates for the build metadata, not guesses about a
          # HAL implementation.  The actual hardware behavior remains backed
          # by the original LG/QCOM blobs and device-tree/kernel interfaces.
          test -f device/lge/sm7250-common/framework_compatibility_matrix.xml
          test -f device/lge/caymanlm/BoardConfig.mk
          test -f device/lge/caymanlm/device.mk
          test -f vendor/lge/caymanlm/caymanlm-vendor.mk

      - name: Build vendor image
        shell: bash
        run: |
          set -o pipefail
          cd android
          source build/envsetup.sh
          lunch "${TARGET_PRODUCT}-${TARGET_VARIANT}" \
            2>&1 | tee "$GITHUB_WORKSPACE/$DIAG_ROOT/vendor/04-lunch.log"
          m vendorimage -j"$(nproc)" \
            2>&1 | tee "$GITHUB_WORKSPACE/$DIAG_ROOT/vendor/05-vendorimage.log"

      - name: Verify vendor.img
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          test -s out/target/product/$TARGET_DEVICE/vendor.img
          {
            ls -lh out/target/product/$TARGET_DEVICE/vendor.img
            sha256sum out/target/product/$TARGET_DEVICE/vendor.img
          } | tee "$GITHUB_WORKSPACE/$DIAG_ROOT/vendor/06-vendor-output.txt"

      - name: Audit built vendor image and preserve hardware requirements
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          IMG="out/target/product/$TARGET_DEVICE/vendor.img"
          test -s "$IMG"
          mkdir -p "$GITHUB_WORKSPACE/$DIAG_ROOT/vendor"
          {
            echo "vendor_img=$(realpath "$IMG")"
            ls -lh "$IMG"
            sha256sum "$IMG"
            echo
            echo "source-tree feature markers:"
            grep -RniE 'fingerprint|biometric|vibrator|haptic|audio|dsds|dual.?sim' \
              device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm \
              | head -300 || true
          } | tee "$DIAG_ROOT/vendor/07-built-vendor-audit.txt"

      - name: Package vendor artifact
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/vendor"
          cp "android/out/target/product/$TARGET_DEVICE/vendor.img" \
             "$GITHUB_WORKSPACE/artifacts/vendor/G900EMW-Android16-vendor.img"
          (cd "$GITHUB_WORKSPACE/artifacts/vendor" && \
             zip -9 "G900EMW-Android16-vendor.img.zip" G900EMW-Android16-vendor.img)
          tar -C "$GITHUB_WORKSPACE/artifacts/vendor" -czf \
            "$GITHUB_WORKSPACE/artifacts/vendor/G900EMW-Android16-vendor-tree-and-image.tar.gz" \
            . 2>/dev/null || true

      - name: Upload vendor result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G900EMW-vendor-${{ github.run_id }}
          path: |
            ci-diagnostics/vendor/**
            artifacts/vendor/**
            android/out/target/product/caymanlm/vendor.img
          if-no-files-found: warn
          retention-days: 14

  bundle:
    name: "BUNDLE — collect independent kernel/vendor results"
    runs-on: ubuntu-24.04
    needs: [kernel, vendor]
    if: always()
    steps:
      - name: Download kernel artifact if it exists
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: G900EMW-kernel-*
          path: collected/kernel
          merge-multiple: true

      - name: Download vendor artifact if it exists
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: G900EMW-vendor-*
          path: collected/vendor
          merge-multiple: true

      - name: Create combined status report
        shell: bash
        run: |
          set -u
          mkdir -p collected/report
          {
            echo "LG Velvet G900EMW — combined build report"
            echo "run_id=${{ github.run_id }}"
            echo "kernel_job=${{ needs.kernel.result }}"
            echo "vendor_job=${{ needs.vendor.result }}"
            echo
            echo "A failed job does not invalidate a successful sibling job."
            echo "Re-run the failed job only; the successful artifact is already preserved."
            echo
            find collected -maxdepth 3 -type f -printf '%p\n' | sort
          } > collected/report/combined-status.txt

      - name: Upload combined bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G900EMW-complete-build-${{ github.run_id }}
          path: collected/**
          if-no-files-found: warn
          retention-days: 14
