    - name: 09 - Immutable feature/source audit
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/09-audit.log\") 2>&1\ncd \"$GITHUB_WORKSPACE/kernel\"\
        \nif git status --short -- arch/arm64/boot/dts arch/arm64/configs | grep -q .; then\n  echo '::error::DT/defconfig\
        \ source changed.'\n  exit 1\nfi\ntest -d drivers/kernelsu\ntest -f fs/susfs.c\ntest -f include/linux/susfs.h\ngrep\
        \ -E '^(CONFIG_(KSU|KPM|SUSFS|SCHED_WALT|SCHED_TUNE|SCHED_CORE_CTL|ZRAM|ZSMALLOC|LTO|KALLSYMS|KPROBES))' \"$OUT_DIR/.config\"\
        \ | sort | tee \"$DIAG_DIR/final-feature-config.txt\"\n"
    - name: 10 - Build RAW ARM64 kernel Image + modules
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$DIAG_DIR"

        exec > >(tee "$DIAG_DIR/10-build.log") 2>&1

        cd "$GITHUB_WORKSPACE/kernel"

        export PATH="$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

        export CC="$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang"

        export LD="$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/ld.lld"

        export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"

        export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"

        export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-

        make -Oline O="$OUT_DIR" ARCH=arm64 CC="$CC" LD="$LD" LLVM=1 LLVM_IAS=1 CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"
        CLANG_TRIPLE=aarch64-linux-gnu- -j"$(nproc)" Image modules

        test -s "$OUT_DIR/arch/arm64/boot/Image"

        cp "$OUT_DIR/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-Image"

        file "$GITHUB_WORKSPACE/LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-Image" | tee "$DIAG_DIR/image-file.txt"

        sha256sum "$GITHUB_WORKSPACE/LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-Image" | tee "$DIAG_DIR/Image.sha256"

        '
    - name: 11 - Build OrangeFox-flashable AnyKernel3 ZIP
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\" \"$GITHUB_WORKSPACE/flashable\"\nexec > >(tee \"$DIAG_DIR/11-anykernel3.log\"\
        ) 2>&1\ncd \"$GITHUB_WORKSPACE\"\nrm -rf AnyKernel3\ngit clone --depth=1 https://github.com/osm0sis/AnyKernel3.git\
        \ AnyKernel3\ncd AnyKernel3\nrm -f Image Image.gz zImage dtb.img\ncp \"$GITHUB_WORKSPACE/LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-Image\"\
        \ Image\ncat > anykernel.sh <<'AK3'\n## LG Velvet G900EMW / SM7250\n## Kernel-only AnyKernel3 package: preserves the\
        \ boot image's existing ramdisk/DTB.\nproperties() {\n  kernel.string=LG Velvet G900EMW | 4.19.325-cip135 | SukiSU-Ultra\
        \ 4.1.3 builtin | SUSFS 1.5.5 | KPM | LTO\n}\nblock=auto\nis_slot_device=auto\ndo.devicecheck=0\ndo.modules=0\ndo.systemless=0\n\
        do.cleanup=1\ndo.cleanuponabort=0\npatch_vbmeta_flag=auto\nAK3\nzip -r9 \"$GITHUB_WORKSPACE/flashable/LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-OrangeFox.zip\"\
        \ . -x '.git/*' '.github/*' 'README.md' 'LICENSE' > \"$DIAG_DIR/zip.log\"\nunzip -t \"$GITHUB_WORKSPACE/flashable/LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-OrangeFox.zip\"\
        \ | tail -n 2\nsha256sum \"$GITHUB_WORKSPACE/flashable/LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-OrangeFox.zip\" |\
        \ tee \"$DIAG_DIR/OrangeFox-ZIP.sha256\"\n"
    - name: 12 - Final report and diagnostics bundle (ALWAYS)
      shell: bash
      run: "set +e\nmkdir -p \"$DIAG_DIR\"\n{\n echo \"run_id=${{ github.run_id }}\"\n echo \"source_branch=$SOURCE_BRANCH\"\
        \n echo \"source_commit=$(cd \"$GITHUB_WORKSPACE/kernel\" 2>/dev/null && git rev-parse HEAD || true)\"\n echo \"target=$KERNEL_VERSION_TARGET\"\
        \n echo \"sukisu=$SUKISU_VERSION commit=$SUKISU_COMMIT\"\n echo \"susfs=$SUSFS_VERSION ref=$SUSFS_REF\"\n echo \"\
        features=G900EMW+WALT+SchedTune+ZRAM+LTO+SukiSU-builtin+KPM+SUSFS\"\n} | tee \"$DIAG_DIR/final-report.txt\"\ntar -czf\
        \ \"$GITHUB_WORKSPACE/LG-Velvet-G900EMW-CIP135-diagnostics-${{ github.run_id }}.tar.gz\" -C \"$GITHUB_WORKSPACE\"\
        \ ci-diagnostics 2>/dev/null || true\n"
      if: always()
    - name: 13 - Upload COMPLETE diagnostics ALWAYS
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-diagnostics-${{ github.run_id }}
        if-no-files-found: warn
        retention-days: 30
        path: "|\n  ${{ github.workspace }}/ci-diagnostics/**\n  ${{ github.workspace }}/LG-Velvet-G900EMW-CIP135-diagnostics-${{\
          \ github.run_id }}.tar.gz"
    - name: 14 - Upload kernel + OrangeFox ZIP only after success
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-KERNEL-${{ github.run_id }}
        if-no-files-found: error
        retention-days: 30
        path: "|\n  ${{ github.workspace }}/LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-Image\n  ${{ github.workspace }}/flashable/LG-Velvet-G900EMW-CIP135-SukiSU-KPM-SUSFS-OrangeFox.zip\n\
          \  ${{ github.workspace }}/out/.config"
