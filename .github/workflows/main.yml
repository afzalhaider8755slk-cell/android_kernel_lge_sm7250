name: LG Velvet KSU SUSFS NonGKI 4.19 - Safe AutoFix v32

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_COMMIT: 26fded805206ae4542f4745e09cc465412994492
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_COMMIT: 001e69919c6271f690fd00b17e4c721c9e599152
      DEFCONFIG: vendor/caymanlm_defconfig
      OUT: kernel/out

    steps:
      - name: 01 - Checkout sixteen source
        uses: actions/checkout@v4
        with:
          repository: afzalhaider8755slk-cell/android_kernel_lge_sm7250
          ref: sixteen
          fetch-depth: 1

      - name: 02 - Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential clang flex gcc-aarch64-linux-gnu git libssl-dev lld libelf-dev libncurses-dev llvm make patch python3

      - name: 03 - Prepare diagnostics
        run: |
          set -euxo pipefail
          mkdir -p ci-diagnostics "$OUT"
          git rev-parse HEAD | tee ci-diagnostics/source-head.txt
          clang --version | tee ci-diagnostics/clang-version.txt
          ld.lld --version | tee ci-diagnostics/lld-version.txt

      - name: 04 - Restore missing tool-version helper
        run: |
          set -euxo pipefail
          if [ ! -f scripts/min-tool-version.sh ]; then
            printf '%s\n' '#!/bin/sh' 'case "$1" in' 'as) echo 2.23 ;;' 'ld) echo 2.23 ;;' 'gcc) echo 4.9 ;;' '*) echo 0 ;;' 'esac' > scripts/min-tool-version.sh
            chmod +x scripts/min-tool-version.sh
          fi
          test -x scripts/as-version.sh
          test -x scripts/min-tool-version.sh

      - name: 05 - Generate pristine defconfig
        run: |
          set -euxo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"
          make O="$GITHUB_WORKSPACE/$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG" 2>&1 | tee ci-diagnostics/05-pristine-defconfig.log
          test -s "$OUT/.config"
          cp "$OUT/.config" ci-diagnostics/pristine.config

      - name: 06 - Setup pinned KernelSU-Next
        run: |
          set -euxo pipefail
          rm -rf KernelSU-Next drivers/kernelsu
          git clone --no-tags --filter=blob:none "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next fetch --depth 1 origin "$KSU_COMMIT"
          git -C KernelSU-Next checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_COMMIT"
          mkdir -p drivers
          ln -s "$GITHUB_WORKSPACE/KernelSU-Next/kernel" drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

      - name: 07 - Integrate KernelSU
        run: |
          set -euxo pipefail
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

      - name: 08 - Apply SUSFS patch except incompatible namespace.c
        run: |
          set -euxo pipefail
          rm -rf susfs4ksu
          git clone --no-tags --filter=blob:none "$SUSFS_REPO" susfs4ksu
          git -C susfs4ksu fetch --depth 1 origin "$SUSFS_COMMIT"
          git -C susfs4ksu checkout --detach "$SUSFS_COMMIT"
          PATCH=susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          test -s "$PATCH"
          python3 - "$PATCH" ci-diagnostics/susfs-no-namespace.patch <<'PY'
          import sys
          from pathlib import Path
          src=Path(sys.argv[1]).read_text().splitlines(True)
          blocks=[]; cur=[]
          for line in src:
              if line.startswith("diff --git "):
                  if cur: blocks.append(cur)
                  cur=[line]
              else:
                  cur.append(line)
          if cur: blocks.append(cur)
          out=[]
          for b in blocks:
              if b and b[0].startswith("diff --git a/fs/namespace.c b/fs/namespace.c"):
                  continue
              out.extend(b)
          Path(sys.argv[2]).write_text("".join(out))
          PY
          ! grep -q '^diff --git a/fs/namespace.c b/fs/namespace.c' ci-diagnostics/susfs-no-namespace.patch
          patch --dry-run -p1 -F3 --forward < ci-diagnostics/susfs-no-namespace.patch 2>&1 | tee ci-diagnostics/08-susfs-dry-run.log
          patch -p1 -F3 --forward < ci-diagnostics/susfs-no-namespace.patch 2>&1 | tee ci-diagnostics/08-susfs-apply.log
          if find . -type f \( -name '*.rej' -o -name '*.orig' \) | grep -q .; then
            find . -type f \( -name '*.rej' -o -name '*.orig' \) -print
            exit 1
          fi
          test -f fs/susfs.c
          test -f include/linux/susfs_def.h
          grep -F 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile

      - name: 09 - Preserve proven LG compatibility fallbacks
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("drivers/kernelsu/supercall/dispatch.c")
          s=p.read_text()
          marker="/* LG legacy SUSFS 1.5.5 compile fallbacks */"
          if marker not in s:
              anchor='#include "supercall.h"'
              block=(
                marker+"\n"
                "#ifndef susfs_start_sdcard_monitor_fn\n"
                "static inline void susfs_start_sdcard_monitor_fn(void) { }\n"
                "#endif\n"
                "#ifndef susfs_is_current_proc_umounted\n"
                "static inline bool susfs_is_current_proc_umounted(void) { return false; }\n"
                "#endif\n"
              )
              if anchor not in s: raise SystemExit("dispatch anchor missing")
              p.write_text(s.replace(anchor, anchor+"\n"+block, 1))
          PY

      - name: 10 - Replace incompatible SUSFS-v2 reboot dispatcher
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("drivers/kernelsu/supercall/dispatch.c")
          s=p.read_text()
          m=re.search(r'(?m)^int\s+ksu_handle_sys_reboot\s*\([^)]*\)\s*\{',s)
          if not m: raise SystemExit("ksu_handle_sys_reboot() not found")
          b=s.find("{",m.start()); depth=0; end=None
          for i in range(b,len(s)):
              if s[i]=="{": depth+=1
              elif s[i]=="}":
                  depth-=1
                  if depth==0: end=i+1; break
          if end is None: raise SystemExit("reboot function parse failed")
          repl="""int ksu_handle_sys_reboot(int magic1, int magic2,
              unsigned int cmd, void __user **arg)
          {
              if (magic1 != KSU_INSTALL_MAGIC1)
                  return -EINVAL;
              if (magic2 == KSU_INSTALL_MAGIC2)
                  return ksu_supercall_reboot_handler(arg);
              return -EINVAL;
          }"""
          p.write_text(s[:m.start()]+repl+s[end:])
          PY
          ! grep -Eq 'SUSFS_MAGIC|CMD_SUSFS_|susfs_enable_log|susfs_add_sus_map|susfs_set_avc_log_spoofing' drivers/kernelsu/supercall/dispatch.c

      - name: 11 - Configure safe SUSFS feature set
        run: |
          set -euxo pipefail
          scripts/config --file "$OUT/.config" -e KSU -e KSU_SUSFS -d KPROBES -d KSU_SUSFS_SUS_MOUNT -d KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -d KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT -d KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          make O="$GITHUB_WORKSPACE/$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -q '^CONFIG_KSU=y$' "$OUT/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT/.config"
          grep -q '^# CONFIG_KPROBES is not set$' "$OUT/.config"
          ! grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y$' "$OUT/.config"

      - name: 12 - Verify integration before compiler
        run: |
          set -euxo pipefail
          test -f fs/susfs.c
          test -f include/linux/susfs_def.h
          grep -F 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          grep -F 'susfs_start_sdcard_monitor_fn' drivers/kernelsu/supercall/dispatch.c
          grep -F 'susfs_is_current_proc_umounted' drivers/kernelsu/supercall/dispatch.c
          git diff --stat | tee ci-diagnostics/git-diff-stat.txt
          git diff > ci-diagnostics/kernel-source.patch

      - name: 13 - Build kernel Image
        run: |
          set -euxo pipefail
          make -j"$(nproc)" O="$GITHUB_WORKSPACE/$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- Image 2>&1 | tee ci-diagnostics/13-build.log

      - name: 14 - Verify Image
        run: |
          set -euxo pipefail
          test -s "$OUT/arch/arm64/boot/Image"
          file "$OUT/arch/arm64/boot/Image" | tee ci-diagnostics/image-file.txt
          sha256sum "$OUT/arch/arm64/boot/Image" | tee ci-diagnostics/Image.sha256

      - name: 15 - Package diagnostics ALWAYS
        if: always()
        run: |
          set +e
          mkdir -p ci-diagnostics
          printf 'run_id=%s\nsource_head=%s\ncompleted=%s\n' "${{ github.run_id }}" "$(git rev-parse HEAD 2>/dev/null)" "$(date -u +%FT%TZ)" > ci-diagnostics/99-final-status.txt
          tar -czf LG-Velvet-diagnostics.tar.gz ci-diagnostics

      - name: 16 - Upload Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSU-SUSFS-NonGKI-sixteen
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
          if-no-files-found: error

      - name: 17 - Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSU-SUSFS-NonGKI-sixteen-diagnostics-run-${{ github.run_id }}
          path: |
            ci-diagnostics/**
            LG-Velvet-diagnostics.tar.gz
          if-no-files-found: error
