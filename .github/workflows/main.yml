name: "LM-G900 Android 16 QPR2 - Vendor Only Fix"

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST_URL: "https://github.com/LineageOS/android.git"
  MANIFEST_BRANCH: "lineage-23.2"
  DEVICE_CODENAME: "caymanln"
  MODEL: "LM-G900"
  PRODUCT: "lineage_caymanln-userdebug"
  DIAG_DIR: "ci-diagnostics/vendor"

jobs:
  vendor:
    name: "Vendor only - LM-G900"
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: "V00 - Checkout repository"
        id: v00
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: "V00 - Create diagnostics"
        id: v00_diag
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$DIAG_DIR" "$GITHUB_WORKSPACE/vendor_out"
          {
            echo "LG Velvet LM-G900 - VENDOR ONLY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "model=$MODEL"
            echo "codename=$DEVICE_CODENAME"
            echo "product=$PRODUCT"
            echo "started=$(date -u +%FT%TZ)"
          } | tee "$GITHUB_WORKSPACE/$DIAG_DIR/00-run.log"

      - name: "V01 - Install build dependencies"
        id: v01
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$GITHUB_WORKSPACE/$DIAG_DIR/01-dependencies.log"
          exec > >(tee -a "$log") 2>&1

          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zstd \
            unzip rsync bc ccache libssl-dev libelf-dev \
            python3 python3-pip jq lz4 liblz4-tool libxml2-utils \
            xsltproc

          if ! command -v repo >/dev/null 2>&1; then
            curl -fL --retry 3 --retry-delay 2 \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/repo"
            chmod +x "$HOME/repo"
            sudo install -m 0755 "$HOME/repo" /usr/local/bin/repo
          fi

          echo "=== tool versions ==="
          git --version
          repo --version
          python3 --version

      - name: "V02 - Initialize Android source (fixed)"
        id: v02
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$GITHUB_WORKSPACE"
          diag="$base/$DIAG_DIR"
          init_log="$diag/02-repo-init.log"
          manifest_log="$diag/02-manifest.log"
          rm -f "$init_log" "$manifest_log"

          rm -rf "$base/android"
          mkdir -p "$base/android"
          cd "$base/android"

          {
            echo "=== repo init ==="
            date -u +%FT%TZ
            repo init \
              -u "$MANIFEST_URL" \
              -b "$MANIFEST_BRANCH" \
              --depth=1 \
              --no-clone-bundle
            echo "repo init exit=$?"
          } > >(tee -a "$init_log") 2>&1

          # IMPORTANT: do NOT use 'repo manifest -r' before sync.
          # -r resolves revisions and can fail before the project refs exist.
          {
            echo "=== repo version ==="
            repo version
            echo
            echo "=== manifest after init (no -r) ==="
            repo manifest
          } > >(tee -a "$manifest_log") 2>&1

          test -s "$base/android/.repo/manifests/default.xml"
          echo "V02 PASS: Android manifest initialized and default.xml exists." |
            tee -a "$init_log"

      - name: "V03 - Create and validate vendor manifest"
        id: v03
        shell: bash
        if: ${{ success() }}
        run: |
          set -Eeuo pipefail
          base="$GITHUB_WORKSPACE"
          diag="$base/$DIAG_DIR"
          log="$diag/03-vendor-manifest.log"
          exec > >(tee -a "$log") 2>&1

          cd "$base/android"
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/g900emw.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="g900github" fetch="https://github.com/" />

            <project
              name="lge-qcom-dev/android_device_lge_caymanln"
              path="device/lge/caymanln"
              remote="g900github"
              revision="lineage-23.2" />

            <project
              name="lge-qcom-dev/proprietary_vendor_lge_caymanln"
              path="vendor/lge/caymanln"
              remote="g900github"
              revision="lineage-23.2" />

            <project
              name="Sparkle-OS/proprietary_vendor_lge_sm7250-common"
              path="vendor/lge/sm7250-common"
              remote="g900github"
              revision="lineage-23.2" />
          </manifest>
          EOF

          echo "=== local manifest ==="
          cat .repo/local_manifests/g900emw.xml

          echo "=== merged manifest (pre-sync, no -r) ==="
          repo manifest

      - name: "V04 - Verify vendor repositories and refs BEFORE sync"
        id: v04
        shell: bash
        if: ${{ success() }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"

          ref_log="$GITHUB_WORKSPACE/$DIAG_DIR/04-ref-check.log"
          sync_log="$GITHUB_WORKSPACE/$DIAG_DIR/04-repo-sync.log"
          : > "$ref_log"
          : > "$sync_log"

          failures=0

          check_ref() {
            local url="$1"
            local ref="$2"
            echo "CHECK $url @ refs/heads/$ref" | tee -a "$ref_log"

            if git ls-remote --exit-code --heads "$url" "$ref" >> "$ref_log" 2>&1; then
              echo "PASS $url @ $ref" | tee -a "$ref_log"
            else
              echo "FAIL $url @ $ref" | tee -a "$ref_log"
              failures=$((failures + 1))
            fi
          }

          check_ref \
            "https://github.com/lge-qcom-dev/android_device_lge_caymanln.git" \
            "$MANIFEST_BRANCH"

          check_ref \
            "https://github.com/lge-qcom-dev/proprietary_vendor_lge_caymanln.git" \
            "$MANIFEST_BRANCH"

          check_ref \
            "https://github.com/Sparkle-OS/proprietary_vendor_lge_sm7250-common.git" \
            "$MANIFEST_BRANCH"

          echo "ref_check_failures=$failures" | tee -a "$ref_log"

          if [[ "$failures" -ne 0 ]]; then
            echo "V04 STOP: one or more vendor refs are unavailable." | tee -a "$ref_log"
            exit 1
          fi

          set +e
          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --fail-fast \
            -j2 2>&1 | tee "$sync_log"
          rc=${PIPESTATUS[0]}
          set -e

          echo "repo_sync_exit=$rc" | tee -a "$sync_log"
          exit "$rc"

      - name: "V05 - Verify synced vendor source"
        id: v05
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/05-source-verification.log"
          exec > >(tee -a "$log") 2>&1

          echo "=== required projects ==="
          repo list | grep -E \
            'device/lge/caymanln|vendor/lge/caymanln|vendor/lge/sm7250-common'

          echo "=== resolved manifest ==="
          repo manifest -r

      - name: "V06 - Verify LM-G900 identity"
        id: v06
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/06-model-identity.log"
          exec > >(tee -a "$log") 2>&1

          echo "MODEL=$MODEL"
          echo "DEVICE_CODENAME=$DEVICE_CODENAME"
          echo "Expected: LM-G900 / caymanln"

          grep -RniE 'LM-G900|caymanln' \
            device/lge/caymanln \
            vendor/lge/caymanln \
            vendor/lge/sm7250-common 2>/dev/null | head -300 || true

      - name: "V07 - Prepare vendor build environment"
        id: v07
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/07-product-config.log"
          exec > >(tee -a "$log") 2>&1

          source build/envsetup.sh
          lunch "$PRODUCT"

          echo "PRODUCT_DEVICE=$(get_build_var PRODUCT_DEVICE)"
          echo "TARGET_PRODUCT=$(get_build_var TARGET_PRODUCT)"
          echo "TARGET_BUILD_VARIANT=$(get_build_var TARGET_BUILD_VARIANT)"

      - name: "V08 - Mandatory hardware integration audit"
        id: v08
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/08-hardware-audit.log"
          : > "$log"

          audit() {
            local label="$1"
            local pattern="$2"
            shift 2

            echo "=== $label ===" | tee -a "$log"
            if grep -RniE "$pattern" "$@" >> "$log" 2>&1; then
              echo "PASS: $label" | tee -a "$log"
            else
              echo "FAIL: $label" | tee -a "$log"
              return 1
            fi
          }

          audit "Fingerprint" \
            'fingerprint|fpc|goodix|biometric' \
            device/lge/caymanln vendor/lge/caymanln vendor/lge/sm7250-common

          audit "Vibration / haptics" \
            'vibrator|haptics|ff-memless|timed_output' \
            device/lge/caymanln vendor/lge/caymanln vendor/lge/sm7250-common

          audit "Dual-SIM / DSDS" \
            'dual.?sim|dsds|simslot|sim.?slot|multisim' \
            device/lge/caymanln vendor/lge/caymanln vendor/lge/sm7250-common

          audit "Audio" \
            'mixer_paths|audio_policy|audio_hw|primary\.sm|tinyalsa|snd' \
            device/lge/caymanln vendor/lge/caymanln vendor/lge/sm7250-common

          audit "Wi-Fi Calling / VoWiFi / IMS" \
            'ims|iwlan|vowifi|wifi.?calling|volte|carrier.?config' \
            device/lge/caymanln vendor/lge/caymanln vendor/lge/sm7250-common

      - name: "V09 - Build vendor.img ONLY"
        id: v09
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/09-vendorimage-build.log"
          exec > >(tee -a "$log") 2>&1

          source build/envsetup.sh
          lunch "$PRODUCT"

          set +e
          mka vendorimage 2>&1
          rc=${PIPESTATUS[0]}
          set -e

          echo "vendorimage_exit=$rc" | tee -a "$log"
          echo "$rc" > "$GITHUB_WORKSPACE/$DIAG_DIR/09-vendorimage-exit-code.txt"
          exit "$rc"

      - name: "V10 - Verify vendor image and VINTF"
        id: v10
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/10-vendor-verification.log"
          exec > >(tee -a "$log") 2>&1

          out="out/target/product/$DEVICE_CODENAME"

          echo "=== vendor images ==="
          find "$out" -maxdepth 1 -type f \
            -name 'vendor*.img' -printf '%p %s bytes\n' 2>/dev/null || true

          echo "=== VINTF ==="
          find "$out/vendor/etc/vintf" -type f \
            -print 2>/dev/null | sort || true

          echo "=== required feature payload scan ==="
          grep -RniE \
            'fingerprint|vibrator|haptics|dual.?sim|dsds|mixer_paths|audio_policy|ims|iwlan|vowifi|wifi.?calling' \
            "$out/vendor" 2>/dev/null | head -500 || true

      - name: "V11 - ALWAYS collect diagnostics and error log"
        id: v11
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p vendor_out

          {
            echo "LG Velvet LM-G900 - VENDOR ONLY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo
            echo "=== STEP OUTCOMES ==="
            echo "V00 checkout=${{ steps.v00.outcome }}"
            echo "V01 dependencies=${{ steps.v01.outcome }}"
            echo "V02 repo-init=${{ steps.v02.outcome }}"
            echo "V03 vendor-manifest=${{ steps.v03.outcome }}"
            echo "V04 ref-sync=${{ steps.v04.outcome }}"
            echo "V05 source=${{ steps.v05.outcome }}"
            echo "V06 identity=${{ steps.v06.outcome }}"
            echo "V07 build-env=${{ steps.v07.outcome }}"
            echo "V08 hardware-audit=${{ steps.v08.outcome }}"
            echo "V09 vendorimage=${{ steps.v09.outcome }}"
            echo "V10 verification=${{ steps.v10.outcome }}"
            echo
            echo "=== ERROR / FAILURE LINES ==="
            grep -RniE \
              'error|fatal|failed|failure|FAIL|ERROR|invalid|not found|does not exist|permission denied' \
              "$DIAG_DIR" 2>/dev/null | tail -1000 || true
          } > "$DIAG_DIR/99-ERROR-SUMMARY.log"

          out="android/out/target/product/$DEVICE_CODENAME"
          find "$out" -maxdepth 1 -type f \
            -name 'vendor*.img' -exec cp -v {} vendor_out/ \; 2>/dev/null || true

          {
            echo "LM-G900 VENDOR ARTIFACTS"
            echo "MANDATORY ERROR LOG: ci-diagnostics/vendor/99-ERROR-SUMMARY.log"
            echo
            find "$DIAG_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            echo
            find vendor_out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          } > vendor_out/ARTIFACT-LIST.txt

          tar -czf \
            "vendor_out/LM-G900-VENDOR-DIAGNOSTICS-${GITHUB_RUN_ID}.tar.gz" \
            "$DIAG_DIR"

      - name: "Upload vendor diagnostics ALWAYS"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-VENDOR-${{ github.run_id }}"
          path: |
            vendor_out/**
            ci-diagnostics/vendor/**
          if-no-files-found: warn
          retention-days: 14

      - name: "Final - return vendor status"
        id: final
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ steps.v02.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V02 repo initialization failed."
            echo "Check ci-diagnostics/vendor/02-repo-init.log and 02-manifest.log."
            exit 1
          fi

          if [[ "${{ steps.v03.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V03 vendor manifest failed."
            echo "Check ci-diagnostics/vendor/03-vendor-manifest.log."
            exit 1
          fi

          if [[ "${{ steps.v04.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V04 repository/ref sync failed."
            echo "Check 04-ref-check.log and 04-repo-sync.log."
            exit 1
          fi

          if [[ "${{ steps.v08.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: mandatory hardware audit failed."
            exit 1
          fi

          if [[ "${{ steps.v09.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: vendorimage build failed."
            echo "Check 09-vendorimage-build.log."
            exit 1
          fi

          if [[ "${{ steps.v10.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: vendor verification failed."
            exit 1
          fi

          echo "VENDOR SUCCESS: vendor-only workflow completed."
