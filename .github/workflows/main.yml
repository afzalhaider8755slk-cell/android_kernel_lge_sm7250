            # framework intended to be installed from Android recoveries such
            # as OrangeFox. This is NOT an OrangeFox recovery image itself.
            AK3_DIR="$RUNNER_TEMP/AnyKernel3"
            rm -rf "$AK3_DIR"
            git clone --progress --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR"

            # Record the exact AK3 revision used by this run.
            AK3_COMMIT="$(git -C "$AK3_DIR" rev-parse HEAD)"
            echo "AnyKernel3 repository: https://github.com/osm0sis/AnyKernel3"
            echo "AnyKernel3 commit: $AK3_COMMIT"

            # Put the pure kernel in the AK3 root. No Image.gz-dtb is created,
            # because this workflow intentionally does not build a DTB.
            cp -f "$KERNEL_IMAGE" "$AK3_DIR/Image.gz"

            # Replace the sample/template installer with a minimal device
            # configuration for LG Velvet LM-G900/G900EMW. The AK3 core script
            # remains upstream; only the device properties and boot action are
            # defined here. No DTB/DTBO is referenced.
            cat > "$AK3_DIR/anykernel.sh" <<'AK3SCRIPT'
          properties() { '
          kernel.string=LM-G900 SukiSU-Ultra 4.2.0 + KPM + SUSFS 1.5.5-4.19 + CIP135
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          device.name2=G900EMW
          device.name3=LM-G900
          device.name4=G900
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # LG Velvet boot target.
          # AnyKernel3 auto-detects the active slot when applicable.
          BLOCK=boot
          IS_SLOT_DEVICE=auto
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          # Import official AnyKernel3 core.
          . tools/ak3-core.sh

          # Dump/split the existing boot image, replace the kernel with the
          # supplied Image.gz, and write the resulting boot image back.
          dump_boot
          write_boot
          AK3SCRIPT

            chmod 0755 "$AK3_DIR/anykernel.sh"

            # Hard validation: this package must contain the kernel, AK3 core,
            # and device checks, but no DTB/DTBO payloads.
            test -s "$AK3_DIR/Image.gz"
            test -s "$AK3_DIR/tools/ak3-core.sh"
            test -x "$AK3_DIR/anykernel.sh"

            grep -q 'device.name1=caymanlm' "$AK3_DIR/anykernel.sh"
            grep -q 'device.name2=G900EMW' "$AK3_DIR/anykernel.sh"
            grep -q 'device.name3=LM-G900' "$AK3_DIR/anykernel.sh"
            grep -qE '^BLOCK=boot$' "$AK3_DIR/anykernel.sh"
            grep -qE '^IS_SLOT_DEVICE=auto$' "$AK3_DIR/anykernel.sh"
            grep -q 'dump_boot' "$AK3_DIR/anykernel.sh"
            grep -q 'write_boot' "$AK3_DIR/anykernel.sh"

            if find "$AK3_DIR" -type f \( -name '*.dtb' -o -name '*.dtbo' -o -name 'dtb' -o -name 'dtbo' \) -print -quit | grep -q .; then
              echo "[FAIL] AnyKernel3 package unexpectedly contains DTB/DTBO payload."
              exit 1
            fi

            # LICENSE is retained because the upstream AK3 template requires
            # it for binary redistribution.
            test -s "$AK3_DIR/LICENSE"

            (
              cd "$AK3_DIR"
              rm -rf .git
              zip -r9 "$GITHUB_WORKSPACE/artifacts/V6-LM-G900-SukiSU-4.2.0-AnyKernel3-OrangeFox-Flashable.zip" . \
                -x 'README.md' '*placeholder' >/dev/null
            )

            test -s "$GITHUB_WORKSPACE/artifacts/V6-LM-G900-SukiSU-4.2.0-AnyKernel3-OrangeFox-Flashable.zip"

            # Keep a second direct kernel-only ZIP as well.
            (
              cd artifacts/kernel
              zip -9 "$GITHUB_WORKSPACE/artifacts/V6-LM-G900-Kernel-Only-4.19.325-cip135.zip" \
                Image.gz kernel.sha256 >/dev/null
            )

            echo "[PASS] Kernel image packaged."
            echo "[PASS] AnyKernel3 package prepared for flashing from OrangeFox/recovery."
            echo "[PASS] No DTB/DTBO was built or packaged."
            echo "[NOTE] This ZIP is an AnyKernel3 kernel-flash package, not an OrangeFox recovery image."
            find artifacts -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          } 2>&1 | tee -a "$LOG"
          cat "$LOG"

      - name: Setup 30 - Final Configuration Artifact Verification
        if: always()
        shell: bash
        run: |
          SETUP_NO="30"
          SETUP_NAME="Setup 30 - Final Configuration Artifact Verification"
          SETUP_LOG="$DIAG_DIR/30-setup-30-final-configuration-artifact-verification-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set +e
          LOG="$DIAG_DIR/13-final-check.log"
          : > "$LOG"
          {
            echo "========== FINAL CHECK =========="
            date -u
            echo
            echo "Kernel version:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile || true
            echo
            echo "Required config:"
            grep -E '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|KALLSYMS|KALLSYMS_ALL|KPM|SECURITY|SECURITY_SELINUX)=' .config 2>/dev/null || true
            echo
            echo "Kernel image candidates:"
            ls -lh arch/arm64/boot/Image.gz-dtb arch/arm64/boot/Image.gz arch/arm64/boot/Image 2>&1 || true
            echo
            echo "DTB/DTBO build mode: DISABLED (kernel-only run)"
            echo
            echo "Build errors (last 40):"
            tail -40 "$DIAG_DIR/12-build-errors.log" 2>/dev/null || true
            echo
            echo "Build tail (last 40):"
            tail -40 "$DIAG_DIR/12-build-tail.log" 2>/dev/null || true
          } 2>&1 | tee -a "$LOG"
          cat "$LOG"
          exit 0

      - name: Support - Stage Complete Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic-artifact
          # Universal failure capture: collect every log and important runner state
          # even when an earlier step failed. This step is ALWAYS executed.
          mkdir -p diagnostic-artifact/runner-state
          {
            echo "========== UNIVERSAL FAILURE SNAPSHOT =========="
            date -u
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "workspace=$GITHUB_WORKSPACE"
            echo
            echo "===== DISK ====="
            df -h 2>&1 || true
            echo
            echo "===== MEMORY ====="
            free -h 2>&1 || true
            echo
            echo "===== KERNEL BUILD PROCESS/FILES ====="
            find . -maxdepth 4 -type f \(-name '*.log' -o -name 'Image' -o -name 'Image.gz' -o -name 'vmlinux' \) -printf '%p %s bytes\n' 2>/dev/null | sort || true
          } > diagnostic-artifact/runner-state/universal-failure-snapshot.txt 2>&1

          printf '%s\n' "========== DIAGNOSTIC COLLECTION ==========" > diagnostic-artifact/runner-state/diagnostic-collection.log
          date -u >> diagnostic-artifact/runner-state/diagnostic-collection.log
          echo "Shell: ${BASH_VERSION:-unknown}" >> diagnostic-artifact/runner-state/diagnostic-collection.log
          echo "diag_dir=$DIAG_DIR" >> diagnostic-artifact/runner-state/diagnostic-collection.log
          echo "workspace=$GITHUB_WORKSPACE" >> diagnostic-artifact/runner-state/diagnostic-collection.log
          echo "Existing CI logs:" >> diagnostic-artifact/runner-state/diagnostic-collection.log
          find "$DIAG_DIR" -type f -printf '%p %s bytes\n' 2>/dev/null | sort >> diagnostic-artifact/runner-state/diagnostic-collection.log || true
          cp -f kernel-build-full.log diagnostic-artifact/12-build-full.log 2>/dev/null || true
          cp -f .config diagnostic-artifact/final.config 2>/dev/null || true
          cp -f "$GITHUB_STEP_SUMMARY" diagnostic-artifact/runner-state/github-step-summary.md 2>/dev/null || true
          cp -f "$GITHUB_ENV" diagnostic-artifact/runner-state/github-env.snapshot 2>/dev/null || true
          cp -f sukisu-integration-note.txt diagnostic-artifact/sukisu-integration-note.txt 2>/dev/null || true
          mkdir -p diagnostic-artifact/ci-logs
          cp -a "$DIAG_DIR"/. diagnostic-artifact/ci-logs/ 2>/dev/null || true
          git status --short > diagnostic-artifact/git-status.txt 2>&1 || true
          git rev-parse HEAD > diagnostic-artifact/kernel-head.txt 2>&1 || true

          {
            echo "========== V6 ALL SETUP STATUS =========="
            echo "Workflow version: V6"
            echo "Next workflow version after verified V6: V7"
            echo "Version policy: V4 -> V5 -> V6 -> V7 -> ...; setup numbers remain independent."
            date -u
            for f in "$DIAG_DIR"/*LIVE.log; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              last_marker="$(grep -E '\[SETUP-[^]]*\]\[(PASS|FAIL)\]' "$f" | tail -1 || true)"
              if [[ "$last_marker" == *"[FAIL]"* ]]; then
                status="ERROR"
              elif [[ "$last_marker" == *"[PASS]"* ]]; then
                status="PASS"
              else
                status="EXECUTED-NO-STATUS-MARKER"
              fi
              printf '%-75s %s\n' "$base" "$status"
            done
          } | tee diagnostic-artifact/ALL-SETUP-STATUS-V6.log

          # Create one canonical diagnostic ZIP. Do not create a second tar/ZIP
          # copy of the same diagnostic payload; the ZIP below is the single
          # user-facing diagnostic artifact for this run.
          rm -f diagnostic-artifact/V6-LG-Velvet-G900-Diagnostics.zip
          command -v zip >/dev/null 2>&1 || {
            echo "[FAIL] zip utility is required to create V6-LG-Velvet-G900-Diagnostics.zip."
            exit 1
          }
          ( cd diagnostic-artifact && zip -qr "V6-LG-Velvet-G900-Diagnostics.zip" ci-logs ALL-SETUP-STATUS-V6.log runner-state kernel-build-full.log final.config git-status.txt kernel-head.txt sukisu-integration-note.txt )
          test -s diagnostic-artifact/V6-LG-Velvet-G900-Diagnostics.zip
          echo "[PASS] V6 canonical diagnostic ZIP created."
          {
            echo "GitHub Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Date: $(date -u)"
            echo "SukiSU source ref: $SUKISU_REF"
            echo "SukiSU runtime commit: $(git -C KernelSU rev-parse HEAD 2>/dev/null || true)"
            echo "External root-hiding kernel patchset: workflow-defined Maphide/BBG checks"
            echo "External root-hiding userspace package: not part of kernel build"
            echo "Diagnostic artifact policy: one canonical V6-LG-Velvet-G900-Diagnostics.zip; no duplicate tar/all-log artifact."
            echo "Lineage branch: $LINEAGE_BRANCH"
            echo "CIP target: $CIP_REF"
            echo
            find diagnostic-artifact -type f -printf '%p %s bytes\n' | sort
          } > diagnostic-artifact/MANIFEST.txt
          exit 0

      - name: Artifact - V6 Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V6-LG-Velvet-G900-Diagnostics
          path: diagnostic-artifact/V6-LG-Velvet-G900-Diagnostics.zip
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Artifact - V6 AnyKernel3 OrangeFox Flashable
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V6-LG-Velvet-G900-SukiSU-4.2.0-AnyKernel3-OrangeFox-Flashable
          path: artifacts/V6-LM-G900-SukiSU-4.2.0-AnyKernel3-OrangeFox-Flashable.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Artifact - V6 Kernel Only ZIP
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V6-LG-Velvet-G900-Kernel-Only
          path: artifacts/V6-LM-G900-Kernel-Only-4.19.325-cip135.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Artifact - V6 Raw Kernel Image
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V6-LG-Velvet-G900-Raw-Kernel
          path: arch/arm64/boot/Image.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
