name: LM-G900 Android 16 QPR2 Full-Feature Build + Error Logs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  DEVICE: LM-G900
  CODENAME: caymanlm
  KERNEL_BASE: v4.19.325-cip135
  DEFCONFIG_TARGET: vendor/caymanlm_defconfig
  OUT: out
  ANDROID_TARGET: Android 16 QPR2 / API 36

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout sixteen baseline
        uses: actions/checkout@v4
        with:
          ref: sixteen
          fetch-depth: 0

      - name: Prepare logging
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          exec > >(tee -a ci-logs/full-build.log) 2>&1
          echo "=== LM-G900 kernel build ==="
          echo "Device: $DEVICE"
          echo "Codename: $CODENAME"
          echo "Kernel baseline: $KERNEL_BASE"
          echo "Android: $ANDROID_TARGET"
          git rev-parse HEAD
          git status --short

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex \
            libelf-dev libssl-dev lz4 cpio rsync python3 unzip zip

      - name: Verify baseline
        run: |
          set -euxo pipefail
          test -f Makefile
          test -d arch/arm64
          test -f "arch/arm64/configs/$DEFCONFIG_TARGET"
          grep -R -n --exclude-dir=.git --exclude-dir="$OUT" \
            "4\.19\.325" Makefile localversion-cip 2>/dev/null || true

      - name: Preserve existing DTBO fix
        shell: bash
        run: |
          set -euxo pipefail
          F=arch/arm64/boot/dts/vendor/lge/Makefile
          test -f "$F"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace(
            '$(notdir $(wildcard echo $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))',
            '$(notdir $(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))'
          )
          p.write_text(s)
          PY
          grep -Fq '$(notdir $(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))' "$F"
          ! grep -Fq 'wildcard echo' "$F"

      - name: Setup 5 - permanent defconfig path guard
        shell: bash
        run: |
          set -euxo pipefail
          TARGET="${DEFCONFIG_TARGET#arch/arm64/configs/}"
          TARGET="${TARGET#configs/}"
          test "$TARGET" = "vendor/caymanlm_defconfig"
          test -f "arch/arm64/configs/$TARGET"
          ! grep -R -n --exclude-dir=.git --exclude-dir="$OUT" \
            'arch/arm64/configs/arch/arm64/configs' . 2>/dev/null

      - name: Apply only finalized feature configuration
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          make O="$OUT" ARCH="$ARCH" "$DEFCONFIG_TARGET"

          # Preserve the finalized feature set without inventing symbols.
          # Each requested feature is checked by searching the generated
          # config/Kconfig/source. Missing implementation fails the build
          # instead of silently producing a feature-less kernel.
          grep -Eq 'CONFIG_(SCHED_WALT|WALT)=y' "$OUT/.config" || \
            grep -RqsE 'SCHED_WALT|WALT' kernel include drivers
          grep -Eq 'CONFIG_(SCHED_TUNE|SCHEDTUNE)=y' "$OUT/.config" || \
            grep -RqsE 'SCHED_TUNE|SCHEDTUNE' kernel include drivers
          grep -Eq '^CONFIG_ZRAM=y$' "$OUT/.config"
          grep -Eq '^CONFIG_INPUT_FINGERPRINT=y$' "$OUT/.config" || \
            grep -RqsE 'fingerprint|FINGERPRINT' drivers
          grep -RqsE 'SukiSU|Sukisu|KSU|KernelSU' . --exclude-dir=.git
          grep -RqsE 'KPM|Kernel Patch Module' . --exclude-dir=.git
          grep -RqsE 'SUSFS|susfs' . --exclude-dir=.git
          grep -RqsE 'VoWiFi|WIFI_CALLING|CONFIG_WIFI_CALLING' . --exclude-dir=.git
          grep -RqsE 'vibrator|VIBRATOR' drivers
          grep -RqsE 'audio|sound|snd' sound drivers
          grep -RqsE 'dual.?sim|DSDS|DSDA' drivers arch

          # LTO must not be silently disabled when the tree supports it.
          if grep -q '^CONFIG_ARCH_SUPPORTS_LTO_CLANG=y$' "$OUT/.config"; then
            grep -Eq '^CONFIG_LTO_CLANG=y$|^CONFIG_LTO_CLANG_THIN=y$' "$OUT/.config"
          fi

      - name: Kernel build with complete log capture
        shell: bash
        run: |
          set -o pipefail
          set +e
          make O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 -j"$(nproc)" 2>&1 | tee ci-logs/kernel-build.log
          rc=${PIPESTATUS[0]}
          echo "kernel_build_exit_code=$rc" | tee -a ci-logs/build-result.txt
          exit "$rc"

      - name: DTBO build with complete log capture
        if: success()
        shell: bash
        run: |
          set -o pipefail
          set +e
          make O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 dtbs dtbo.img -j"$(nproc)" \
            2>&1 | tee ci-logs/dtbo-build.log
          rc=${PIPESTATUS[0]}
          echo "dtbo_build_exit_code=$rc" | tee -a ci-logs/build-result.txt
          exit "$rc"

      - name: Final feature/config audit
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "=== FINAL AUDIT ==="
            echo "baseline=$KERNEL_BASE"
            echo "device=$DEVICE"
            echo "defconfig=$DEFCONFIG_TARGET"
            echo "--- requested finalized features ---"
            echo "SukiSU-Ultra"
            echo "KPM"
            echo "SUSFS"
            echo "WALT"
            echo "SchedTune"
            echo "ZRAM"
            echo "LTO"
            echo "Fingerprint"
            echo "Vibration"
            echo "Dual-SIM"
            echo "Audio"
            echo "VoWiFi"
            echo "--- config ---"
            test -f "$OUT/.config" && grep -E \
              'CONFIG_(ZRAM|INPUT_FINGERPRINT|SCHED_WALT|SCHED_TUNE|LTO_)' "$OUT/.config" || true
            echo "--- forbidden duplicated defconfig path ---"
            grep -R -n --exclude-dir=.git --exclude-dir="$OUT" \
              'arch/arm64/configs/arch/arm64/configs' . 2>/dev/null || true
          } | tee ci-logs/final-audit.log

      - name: Collect kernel error excerpts
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "=== ERROR/WARNING EXCERPTS ==="
            grep -RniE \
              --include='*.log' --include='build-result.txt' \
              '(^|[^A-Za-z])(error|fatal|failed|failure|warning|No rule to make|not found|undefined reference|implicit declaration)([^A-Za-z]|$)' \
              ci-logs 2>/dev/null | tail -n 500 || true
          } > ci-logs/error-excerpts.log

          tar -czf ci-logs.tar.gz ci-logs 2>/dev/null || true

      - name: Upload ALL error logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-build-logs-and-errors
          if-no-files-found: warn
          path: |
            ci-logs/
            ci-logs.tar.gz
            ${{ env.OUT }}/.config
            ${{ env.OUT }}/include/config/
            ${{ env.OUT }}/System.map
            ${{ env.OUT }}/arch/arm64/boot/Makefile

      - name: Upload successful kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-v4.19.325-cip135-Full-Feature
          if-no-files-found: warn
          path: |
            ${{ env.OUT }}/arch/arm64/boot/Image*
            ${{ env.OUT }}/arch/arm64/boot/dtbo.img
            ${{ env.OUT }}/arch/arm64/boot/dts/**/*.dtb
            ${{ env.OUT }}/arch/arm64/boot/dts/**/*.dtbo
