          # apart from any pre-existing local changes; specifically, it must not contain our broken guard.
          if grep -q '__LG_CAYMANLM_COMMON_TOUCH_DTSI__' "$COMMON_TOUCH"; then
            echo "[ERROR] Broken common-touch guard still present after reconciliation."
            exit 1
          fi
          if grep -qF '#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"' "$TOUCH_REV"; then
            echo "[ERROR] Redundant Rev-1.0 common-touch include still present."
            exit 1
          fi
          echo "[CHECK] V34 touch reconciliation complete: common-touch definitions preserved, redundant include removed."

          echo "[CHECK] KernelSU fsnotify compatibility and DT touch reconciliation are installed."

          # Do not invoke a standalone DT overlay target. The real dtbs phase below is
          # the authoritative verification path and preserves all existing overlays.
          echo "[CHECK] DT and KernelSU compatibility fixes will be verified by the normal kernel build."

