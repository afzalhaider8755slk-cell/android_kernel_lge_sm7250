              and "$(patsubst $(obj)/%,%,$(real-prereqs))" in flat(b)
              and "sed -E 's:([^ ]+):$(obj)/\\1:g'" in flat(b)
              and "xargs $(AR) rcSTP$(KBUILD_ARFLAGS) $@" in flat(b)
          ]
          final_unsafe = [
              b for b in final_blocks
              if "$(AR) rcSTP$(KBUILD_ARFLAGS) $@ $(filter $(real-obj-y), $^)" in flat(b)
              and "$(update_lto_symversions)" in flat(b)
              and "xargs" not in flat(b)
          ]

          if len(final_installed) != 1:
              raise SystemExit(f"[FAIL] V19: installed protected ARG_MAX rule count={len(final_installed)}; expected exactly 1.")
          if len(final_unsafe) != 0:
              raise SystemExit(f"[FAIL] V19: unsafe protected LTO-wrapped built-in.a rule remains count={len(final_unsafe)}.")
          if final.count("$(update_lto_symversions)") < 1:
              raise SystemExit("[FAIL] V19: update_lto_symversions disappeared; LTO protection was not preserved.")
          # Count the protected archive command only inside cmd_ar_builtin blocks.
          # Do NOT use a whole-file token count: an LG 4.19 tree may legitimately
          # contain the same rcSTP$(KBUILD_ARFLAGS) token in another archive/helper
          # command, comments, or an LTO-related command. The contract we need to
          # prove is exactly one *installed built-in.a rule*, not one raw token in
          # the entire Makefile.
          protected_archive_cmds = [
              b for b in final_blocks
              if "xargs $(AR) rcSTP$(KBUILD_ARFLAGS) $@" in flat(b)
          ]
          protected_archive_token_count = sum(
              b.count("xargs $(AR) rcSTP$(KBUILD_ARFLAGS) $@")
              for b in final_blocks
          )
          if len(protected_archive_cmds) != 1 or protected_archive_token_count != 1:
              raise SystemExit(
                  "[FAIL] V19: protected rcSTP archive command inside cmd_ar_builtin "
                  f"is not exactly one (blocks={len(protected_archive_cmds)}, "
                  f"tokens={protected_archive_token_count})."
              )

          print("[PASS] V19: protected LTO wrapper retained.")
          print("[PASS] V19: rcSTP$(KBUILD_ARFLAGS) retained exactly once inside cmd_ar_builtin.")
          print("[PASS] V19: upstream patsubst/sed/xargs ARG_MAX transport installed exactly once.")
          print("[PASS] V19: original unsafe expanded-prerequisite AR invocation is absent.")
          print("[PASS] V19: no Wi-Fi/qcacld feature or compiler flag was removed.")
          PY

          # V26 ROOT-CAUSE FIX: LG 4.19 has separate SELinux table layouts.
          # hashtab->htable is a native pointer array; avtab->htable is a flex_array.
          # Keep both iterators explicit. No feature is removed or disabled.
          SEPOLICY_C="drivers/kernelsu/selinux/sepolicy.c"
          AVTAB_H="security/selinux/ss/avtab.h"
          python3 - "$SEPOLICY_C" "$AVTAB_H" <<'PY'
          from pathlib import Path
          import re, sys
          c = Path(sys.argv[1])
          h = Path(sys.argv[2])
          s = c.read_text()
          hs = h.read_text()
          if "struct flex_array *htable" not in hs:
              raise SystemExit("[FAIL] V26: LG 4.19 avtab flex_array storage not found.")
          native_marker = "#define ksu_hash_for_each(node_ptr, n_slot, cur)"
          native_end = "        for (cur = node_ptr[i]; cur; cur = cur->next)"
          start_pos = s.find(native_marker)
          if start_pos < 0:
              raise SystemExit("[FAIL] V26: native hashtab iterator block not found.")
          end_pos = s.find(native_end, start_pos)
          if end_pos < 0:
              raise SystemExit("[FAIL] V26: native hashtab iterator terminator not found.")
          end_pos += len(native_end)
          if "#define ksu_avtab_for_each(" not in s:
              macro = "\n\n" + "\n".join([
                  "#define ksu_avtab_for_each(node_ptr, n_slot, cur) \\",
                  "    int i; \\",
                  "    for (i = 0; i < n_slot; ++i) \\",
                  "        for (cur = flex_array_get_ptr(node_ptr, i); cur; cur = cur->next)",
              ])
              s = s[:end_pos] + macro + s[end_pos:]
          old = "#define avtab_for_each(avtab, cur) ksu_hash_for_each(avtab.htable, avtab.nslot, cur);"
          new = "#define avtab_for_each(avtab, cur) ksu_avtab_for_each(avtab.htable, avtab.nslot, cur);"
          if old in s:
              s = s.replace(old, new, 1)
          if s.count("#define ksu_avtab_for_each(") != 1:
              raise SystemExit("[FAIL] V26: dedicated AVTAB iterator was not installed exactly once.")
          if "flex_array_get_ptr(node_ptr, i)" not in s:
              raise SystemExit("[FAIL] V26: dedicated AVTAB flex_array traversal missing.")
          if new not in s:
              raise SystemExit("[FAIL] V26: avtab_for_each was not routed to dedicated iterator.")
          c.write_text(s)
          print("[FIXED] V26: separate AVTAB flex_array and hashtab pointer-array iterators.")
          print("[PASS] V26: no SELinux/SukiSU feature was removed or disabled.")
          PY

