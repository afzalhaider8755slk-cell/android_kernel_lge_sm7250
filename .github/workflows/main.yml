          else:
              print("[PASS] V19: upstream real-prereqs helper already exists exactly once.")

          def blocks(text):
              lines = text.splitlines()
              out = []
              i = 0
              while i < len(lines):
                  if lines[i].lstrip().startswith("cmd_ar_builtin") and "=" in lines[i]:
                      b = [lines[i]]
                      while b[-1].rstrip().endswith("\\") and i + 1 < len(lines):
                          i += 1
                          b.append(lines[i])
                      out.append("\n".join(b))
                  i += 1
              return out

