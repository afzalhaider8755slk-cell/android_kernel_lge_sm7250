name: LG G900 Global - Stable Kernel + DTB + DTBO + SukiSU-Ultra + SUSFS + CIP135 v18

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lg-g900-global-v18-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_BRANCH: sixteen
  COMMON_TREE: https://github.com/afzalhaider8755slk-cell/android_device_lge_sm7250-common.git
  DEVICE_TREE: https://github.com/afzalhaider8755slk-cell/android_device_lge_caymanlm.git
  VENDOR_TREE: https://github.com/afzalhaider8755slk-cell/proprietary_vendor_lge_caymanlm.git

  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/lineageos_cayman_defconfig

  SUKISU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
  SUKISU_REF: susfs-main
  SUSFS_MODULE_REPO: https://github.com/sidex15/susfs4ksu-module.git
  SUSFS_MODULE_REF: main
  ANYKERNEL3_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL3_REF: master

  CIP_REPO: https://gitlab.com/cip-project/cip-kernel/linux-cip.git
  CIP_BASE_TAG: v4.19.325-cip132
  CIP_TARGET_TAG: v4.19.325-cip135

  DTB_TARGET: vendor/qcom/lito-mtp.dtb
  DTBO_TARGET: vendor/lge/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo
  DTBO_BUILD_DIR: arch/arm64/boot/dts/vendor/lge
  DTBO_DTS: arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_lao_com-rev-1.0_overlay.dts

jobs:
  kernel:
    name: Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: 00 - Diagnostics trap
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-diagnostics artifacts
          exec > >(tee -a ci-diagnostics/00-runner.log) 2>&1
          trap 'rc=$?; echo "FAILED step=00 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          uname -a
          date -u +%FT%TZ
          echo "workflow=v18"

      - name: 01 - Checkout all LG trees
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p src/device/lge src/vendor/lge
          exec > >(tee -a ci-diagnostics/01-checkout.log) 2>&1
          trap 'rc=$?; echo "FAILED step=01 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" src/kernel
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$COMMON_TREE" src/device/lge/sm7250-common
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$DEVICE_TREE" src/device/lge/caymanlm
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$VENDOR_TREE" src/vendor/lge/caymanlm
          cd src/kernel
          echo "kernel_commit=$(git rev-parse HEAD)"
          echo "kernel_version=$(make -s kernelversion)"

      - name: 02 - Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/02-dependencies.log) 2>&1
          trap 'rc=$?; echo "FAILED step=02 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache clang curl flex git libelf-dev libssl-dev \
            lld llvm make python3 rsync unzip wget xz-utils device-tree-compiler

      - name: 03 - Install exact Android Clang r563880c
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/03-toolchain.log) 2>&1
          trap 'rc=$?; echo "FAILED step=03 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          git clone --depth=1 --filter=blob:none --sparse --branch ndk-r29 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchains/clang
          cd toolchains/clang
          git sparse-checkout set clang-r563880c
          test -x clang-r563880c/bin/clang
          test -x clang-r563880c/bin/ld.lld
          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c" >> "$GITHUB_ENV"
          echo "PATH=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c/bin:$PATH" >> "$GITHUB_ENV"

      - name: 04 - Verify assembler before any Kconfig operation
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/04-toolchain-test.log) 2>&1
          trap 'rc=$?; echo "FAILED step=04 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          export PATH="$CLANG_DIR/bin:$PATH"
          clang --version
          ld.lld --version
          printf 'int main(void){return 0;}\n' | clang --target=aarch64-linux-android21 -x c - -c -o /tmp/a.o
          printf 'nop\n' | clang --target=aarch64-linux-android21 -x assembler - -c -o /tmp/as.o
          echo "LLVM_IAS=PASS"

      - name: 05 - Validate Global Cayman + DSDS source baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/05-target.log) 2>&1
          trap 'rc=$?; echo "FAILED step=05 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          cd src/kernel
          test -f "arch/arm64/configs/$DEFCONFIG"
          test -f "$DTBO_DTS"
          grep -q 'CONFIG_MACH_LITO_CAYMANLM' "arch/arm64/configs/$DEFCONFIG" || true
          grep -q 'BOARD_KERNEL_SEPARATED_DTBO := true' ../device/lge/caymanlm/BoardConfig.mk 2>/dev/null || true
          grep -q 'persist.vendor.radio.multisim.config=dsds' ../device/lge/sm7250-common/vendor.prop
          grep -q 'ro.vendor.lge.sim_num=2' ../device/lge/sm7250-common/vendor.prop
          grep -q 'ro.vendor.lge.dsds=2' ../device/lge/sm7250-common/vendor.prop
          grep -q 'model = "LG Electronics, Caymanlm, HW Rev 1.0"' "$DTBO_DTS"
          grep -q 'qcom,board-id = <0x000C0008 0>;' "$DTBO_DTS"
          ! grep -q '0x010C0008' "$DTBO_DTS"
          echo "Global Cayman HW Rev 1.0 + DSDS baseline: PASS"

      - name: 06 - Integrate CIP135 with LG-first conflict policy
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/ci-diagnostics/06-cip135.log") 2>&1
          trap 'rc=$?; echo "FAILED step=06 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          cd "$GITHUB_WORKSPACE/src/kernel"

          if [ -f .git/shallow ]; then
            git fetch --unshallow
          fi

          cp arch/arm64/kernel/cpu_errata.c "$GITHUB_WORKSPACE/artifacts/cpu_errata.lg-base.c"
          cp sound/core/compress_offload.c "$GITHUB_WORKSPACE/artifacts/compress_offload.lg-base.c"

          git remote add cip "$CIP_REPO"
          git fetch cip \
            "refs/tags/$CIP_BASE_TAG:refs/tags/$CIP_BASE_TAG" \
            "refs/tags/$CIP_TARGET_TAG:refs/tags/$CIP_TARGET_TAG"

          base=$(git rev-parse "refs/tags/$CIP_BASE_TAG^{commit}")
          target=$(git rev-parse "refs/tags/$CIP_TARGET_TAG^{commit}")
          vendor_head=$(git rev-parse HEAD)

          {
            echo "CIP_BASE=$CIP_BASE_TAG $base"
            echo "CIP_TARGET=$CIP_TARGET_TAG $target"
            echo "VENDOR_HEAD=$vendor_head"
          } | tee "$GITHUB_WORKSPACE/artifacts/cip-before.txt"

          git merge-base --is-ancestor "$base" "$vendor_head"

          git config user.name "LG-G900-CI"
          git config user.email "ci@invalid.local"

          if git merge --no-commit --no-ff -X ours "$target"; then
            echo "CIP135 merge completed without conflicts."
            git commit -m "Merge CIP135 into LG G900 kernel"
          else
            echo "CIP135 merge reported conflicts; resolving in favor of the LG tree."

            git diff --name-only --diff-filter=U \
              | tee "$GITHUB_WORKSPACE/artifacts/cip-conflicts.txt"

            conflict_count=$(wc -l < "$GITHUB_WORKSPACE/artifacts/cip-conflicts.txt")
            echo "conflict_count=$conflict_count" \
              | tee "$GITHUB_WORKSPACE/artifacts/cip-merge-summary.txt"

            while IFS= read -r f; do
              [ -n "$f" ] || continue

              if git checkout --ours -- "$f"; then
                git add -- "$f"
              else
                git rm -f -- "$f" || true
              fi
            done < "$GITHUB_WORKSPACE/artifacts/cip-conflicts.txt"

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "ERROR: unresolved Git merge entries remain after LG-first resolution."
              git status --short
              exit 1
            fi

            git commit -m "Merge CIP135 into LG G900 kernel (LG-first conflict resolution)"
          fi

          cp "$GITHUB_WORKSPACE/artifacts/cpu_errata.lg-base.c" \
            arch/arm64/kernel/cpu_errata.c

          cp "$GITHUB_WORKSPACE/artifacts/compress_offload.lg-base.c" \
            sound/core/compress_offload.c

          git add arch/arm64/kernel/cpu_errata.c \
            sound/core/compress_offload.c

          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          grep -q -- '-cip135' localversion-cip

          git status --short \
            > "$GITHUB_WORKSPACE/artifacts/cip-final-status.txt"

          git rev-parse HEAD \
            > "$GITHUB_WORKSPACE/artifacts/cip-final-commit.txt"

          echo "CIP135 integration complete."

      - name: 07 - Remove legacy KernelSU and integrate SukiSU-Ultra with native SUSFS
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/07-sukisu.log) 2>&1
          trap 'rc=$?; echo "FAILED step=07 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel

          rm -rf KernelSU drivers/kernelsu

          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "$SUKISU_REF"

          test -d KernelSU/kernel
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile

          echo "SukiSU ref=$SUKISU_REF" \
            | tee "$GITHUB_WORKSPACE/artifacts/sukisu-selected-ref.txt"

          echo "SukiSU commit=$(git -C KernelSU rev-parse HEAD)" \
            | tee "$GITHUB_WORKSPACE/artifacts/sukisu-commit.txt"

      - name: 07b - Verify native SukiSU SUSFS v2.2.0 integration
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/07b-susfs.log) 2>&1
          trap 'rc=$?; echo "FAILED step=07b rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel

          test -s KernelSU/kernel/Kconfig
          test -s KernelSU/kernel/Makefile
          test -s KernelSU/kernel/susfs.c || test -s fs/susfs.c
          test -s KernelSU/kernel/include/linux/susfs.h || test -s include/linux/susfs.h
          test -s KernelSU/kernel/include/linux/susfs_def.h || test -s include/linux/susfs_def.h
          grep -Rqs 'config KSU_SUSFS' KernelSU/kernel

          susfs_header=''
          for f in KernelSU/kernel/include/linux/susfs.h include/linux/susfs.h; do
            if [ -s "$f" ]; then susfs_header="$f"; break; fi
          done
          test -n "$susfs_header"
          grep -Eiq 'SUSFS[^0-9]*2[.]2[.]0|VERSION.*2[.]2[.]0|v2[.]2[.]0' "$susfs_header" || {
            echo "ERROR: native SukiSU SUSFS is present but v2.2.0 was not detected in $susfs_header"
            head -80 "$susfs_header" || true
            exit 1
          }

          git -C KernelSU rev-parse HEAD > "$GITHUB_WORKSPACE/artifacts/sukisu-susfs-commit.txt"
          echo "Native SukiSU SUSFS v2.2.0 integration: PASS" | tee "$GITHUB_WORKSPACE/artifacts/susfs-kernel-ref.txt"

      - name: 07c - Integrate Baseband Guard (BBG) safely
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/07c-bbg.log) 2>&1
          trap 'rc=$?; echo "FAILED step=07c rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          if [ ! -d Baseband-guard ]; then
            git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard
          fi
          chmod +x Baseband-guard/setup.sh
          ./Baseband-guard/setup.sh

          test -f security/baseband-guard/Kconfig
          test -f security/baseband-guard/Makefile
          test -f security/baseband-guard/baseband_guard.c
          grep -q 'obj-$(CONFIG_BBG) += baseband-guard/' security/Makefile
          grep -q 'security/baseband-guard/Kconfig' security/Kconfig

          # The 4.19 vendor LSM Kconfig may not automatically place BBG in the
          # active LSM list. Add it to existing SELinux defaults without deleting
          # or replacing any existing LSM. This is the documented CI integration.
          if grep -q '^config LSM$' security/Kconfig; then
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          fi

          echo "BBG source integration: PASS" | tee "$GITHUB_WORKSPACE/artifacts/bbg-integration.txt"

      - name: 08 - Generate config with the REAL device defconfig (toolchain already verified)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/08-defconfig.log) 2>&1
          trap 'rc=$?; echo "FAILED step=08 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          rm -rf "$GITHUB_WORKSPACE/out"
          mkdir -p "$GITHUB_WORKSPACE/out"

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$CLANG_DIR/bin/llvm-objcopy" \
            OBJDUMP="$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$CLANG_DIR/bin/llvm-strip" \
            "$DEFCONFIG"

          test -s "$GITHUB_WORKSPACE/out/.config"

          cp "$GITHUB_WORKSPACE/out/.config" \
            "$GITHUB_WORKSPACE/artifacts/config-from-defconfig"

      - name: 09 - Enable requested root, SUSFS, filesystem, security and networking features
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/09-config.log) 2>&1
          trap 'rc=$?; echo "FAILED step=09 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          cfg="$GITHUB_WORKSPACE/out/.config"
          export PATH="$CLANG_DIR/bin:$PATH"

          # Requested core features. KPROBES remains enabled for the kernel,
          # while Manual Hook is the selected SukiSU hook mode for this non-GKI 4.19 tree.
          scripts/config --file "$cfg" \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KSU_MANUAL_HOOK \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_MAP \
            --enable CONFIG_EXT4_FS \
            --enable CONFIG_EXT4_USE_FOR_EXT2 \
            --enable CONFIG_OVERLAY_FS \
            --enable CONFIG_BPF \
            --enable CONFIG_BPF_SYSCALL \
            --enable CONFIG_NETFILTER \
            --enable CONFIG_NETFILTER_XTABLES \
            --enable CONFIG_CFG80211 \
            --enable CONFIG_UID_SYS_STATS \
            --enable CONFIG_RMNET \
            --enable CONFIG_IPA3 \
            --enable CONFIG_RMNET_IPA3 \
            --enable CONFIG_QCOM_QMI_HELPERS \
            --enable CONFIG_QCOM_QMI_RMNET \
            --enable CONFIG_ANDROID_BINDER_IPC \
            --enable CONFIG_ANDROID_BINDERFS \
            --enable CONFIG_DM_VERITY \
            --enable CONFIG_FS_ENCRYPTION \
            --enable CONFIG_TMPFS_XATTR \
            --enable CONFIG_TMPFS_POSIX_ACL \
            --enable CONFIG_NET_SCH_FQ \
            --enable CONFIG_TCP_CONG_BBR \
            --enable CONFIG_TCP_CONG_ADVANCED \
            --enable CONFIG_IP_SET \
            --enable CONFIG_NF_NAT_IPV6 \
            --enable CONFIG_WIREGUARD \
            --enable CONFIG_BBG

          # Optional symbols vary between vendor 4.19 trees. Enable them when
          # their Kconfig symbol exists; never invent a symbol that this tree lacks.
          optional=(
            CONFIG_BBG_ALLOW_IN_RECOVERY
            CONFIG_BBG_DEBUG
            CONFIG_BBG_ANTI_SPOOF_DOMAIN
            CONFIG_IP6_NF_NAT
            CONFIG_NETFILTER_XT_TARGET_TTL
            CONFIG_NF_NAT
            CONFIG_NF_CONNTRACK
            CONFIG_NETFILTER_XT_MATCH_CONNTRACK
            CONFIG_WIREGUARD_DEBUG
            CONFIG_EXT4_FS_POSIX_ACL
            CONFIG_EXT4_FS_SECURITY
            CONFIG_EXT4_FS_ENCRYPTION
            CONFIG_TCP_CONG_CUBIC
            CONFIG_TCP_CONG_BBR
            CONFIG_NET_SCH_FQ
            CONFIG_IP_SET_HASH_IP
            CONFIG_IP_SET_HASH_NET
            CONFIG_IP_SET_HASH_MAC
            CONFIG_IP_SET_LIST_SET
          )
          for c in "${optional[@]}"; do
            if grep -Eq "^[[:space:]]*(config|menuconfig)[[:space:]]+${c#CONFIG_}([[:space:]]|$)" $(find . -path '*/Kconfig*' -type f -print) 2>/dev/null; then
              scripts/config --file "$cfg" --enable "$c" 2>/dev/null || true
            fi
          done

          # v18: user explicitly requested every previously-disabled feature to be enabled.
          # BBG_BLOCK_BOOT is therefore enabled when present in this tree.
          scripts/config --file "$cfg" --enable CONFIG_BBG_BLOCK_BOOT

          # v18: KPM is explicitly enabled. SukiSU documents CONFIG_KPM=y and
          # non-GKI KALLSYMS/KALLSYMS_ALL as the required configuration.
          scripts/config --file "$cfg" --enable CONFIG_KPM

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" NM="$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$CLANG_DIR/bin/llvm-objcopy" OBJDUMP="$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$CLANG_DIR/bin/llvm-strip" olddefconfig

          required=(
            CONFIG_KPROBES CONFIG_KSU_MANUAL_HOOK CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL
            CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_MAP
            CONFIG_EXT4_FS CONFIG_OVERLAY_FS CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BBG CONFIG_BBG_BLOCK_BOOT CONFIG_KPM
            CONFIG_NETFILTER CONFIG_NETFILTER_XTABLES CONFIG_CFG80211 CONFIG_UID_SYS_STATS
            CONFIG_RMNET CONFIG_IPA3 CONFIG_RMNET_IPA3 CONFIG_QCOM_QMI_HELPERS CONFIG_QCOM_QMI_RMNET
            CONFIG_ANDROID_BINDER_IPC CONFIG_ANDROID_BINDERFS CONFIG_DM_VERITY CONFIG_FS_ENCRYPTION
          )
          for c in "${required[@]}"; do
            grep -q "^${c}=y$" "$cfg" || { echo "MISSING required $c"; exit 1; }
          done

          # BBG must be compiled and present in the active LSM ordering.
          if grep -q '^CONFIG_LSM=' "$cfg"; then
            grep '^CONFIG_LSM=' "$cfg" | grep -q 'baseband_guard' || {
              echo "MISSING baseband_guard from CONFIG_LSM";
              grep '^CONFIG_LSM=' "$cfg" || true;
              exit 1;
            }
          fi

          susfs_required=(
            CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_SUS_MAP
          )
          for c in "${susfs_required[@]}"; do
            grep -q "^${c}=y$" "$cfg" || { echo "MISSING SUSFS feature $c"; exit 1; }
          done

          cp "$cfg" "$GITHUB_WORKSPACE/artifacts/final.config"
          grep -E '^(CONFIG_(KPROBES|KSU_MANUAL_HOOK|KALLSYMS|KALLSYMS_ALL|KSU|KSU_SUSFS|EXT4_FS|OVERLAY_FS|BBG|TCP_CONG_BBR|IP_SET|WIREGUARD))=' "$cfg" \
            > "$GITHUB_WORKSPACE/artifacts/requested-feature-config.txt" || true

      - name: 10 - Network / IMS / WLAN / traffic-monitor baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/10-network.log) 2>&1
          trap 'rc=$?; echo "FAILED step=10 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cfg="$GITHUB_WORKSPACE/out/.config"
          report="$GITHUB_WORKSPACE/artifacts/network-connectivity-report.txt"

          : > "$report"

          required=(
            CONFIG_NETFILTER
            CONFIG_NETFILTER_XTABLES
            CONFIG_CFG80211
            CONFIG_UID_SYS_STATS
            CONFIG_RMNET
            CONFIG_IPA3
            CONFIG_RMNET_IPA3
            CONFIG_QCOM_QMI_HELPERS
            CONFIG_QCOM_QMI_RMNET
            CONFIG_BPF
            CONFIG_BPF_SYSCALL
            CONFIG_ANDROID_BINDER_IPC
            CONFIG_ANDROID_BINDERFS
            CONFIG_DM_VERITY
            CONFIG_FS_ENCRYPTION
            CONFIG_OVERLAY_FS
          )

          for c in "${required[@]}"; do
            grep -q "^${c}=y$" "$cfg" || {
              echo "MISSING $c" | tee -a "$report"
              exit 1
            }

            echo "$c=y" >> "$report"
          done

          echo 'Dual-SIM: common vendor DSDS properties verified.' \
            | tee -a "$report"

          echo 'VoLTE/Wi-Fi Calling: kernel transport/IMS prerequisites preserved; carrier/modem/vendor IMS remains external.' \
            | tee -a "$report"

          echo 'Traffic monitor: UID stats + BPF + netfilter baseline verified.' \
            | tee -a "$report"

          echo 'Android 16 QPR2/GSI: kernel compatibility validation only; no experimental QPR2 backports.' \
            | tee -a "$report"

      - name: 10b - Record device-safe feature manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cfg="$GITHUB_WORKSPACE/out/.config"
          {
            echo '=== LG G900 feature manifest ==='
            echo 'SukiSU-Ultra: enabled'
            echo 'SUSFS: native v2.2.0 target'
            echo 'KPROBES: enabled'
            echo 'KSU_MANUAL_HOOK: enabled (selected non-GKI hook)'
            echo 'KALLSYMS/KALLSYMS_ALL: enabled'
            echo 'EXT4_FS/OVERLAY_FS: enabled'
            echo 'BBG: enabled; BBG_BLOCK_BOOT: enabled per requested full-feature profile'
            echo 'KPM: enabled (CONFIG_KPM=y)'
            echo 'Futile Maphide/JIT-Zygote: source-compatible 69_hide_stuff integration; upstream-clean when possible, otherwise exact LG 4.19 semantic port with strict verification'
            echo 'DTB/DTBO: build uses existing LG device-tree source; no invented hardware nodes'
            echo 'DTBO: all existing Global Lao overlay DTS files are compiled'
          } | tee "$GITHUB_WORKSPACE/artifacts/feature-manifest.txt"

      - name: 10c - Integrate Futile Maphide with LG 4.19 source-compatible port
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/10c-maphide.log) 2>&1
          trap 'rc=$?; echo "FAILED step=10c rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/kernel_patches
          patchfile="/tmp/kernel_patches/archived/69_hide_stuff.patch"
          test -s "$patchfile"

          # Prefer the upstream patch when it cleanly matches this exact tree.
          if git apply --check "$patchfile" >/tmp/maphide-upstream-check.log 2>&1; then
            git apply --verbose "$patchfile"
            mode="upstream-clean"
          else
            # The upstream patch targets a different procfs layout. Port its
            # actual Futile Maphide changes to this LG 4.19 source using strict
            # semantic anchors. Never use -F/--reject or silently drop hunks.
          python3 - <<'PYPORT'
          from pathlib import Path
          import re
          
          root = Path('.')
          tmmu = root / 'fs/proc/task_mmu.c'
          base = root / 'fs/proc/base.c'
          if not tmmu.is_file() or not base.is_file():
              raise SystemExit('Maphide port requires fs/proc/task_mmu.c and fs/proc/base.c')
          
          s = tmmu.read_text()
          b = base.read_text()
          
          helper = '''
          /* Futile Maphide: hide jit-zygote-cache VMA metadata. */
          static void show_vma_header_prefix_fake(struct seq_file *m,
                                                  unsigned long start, unsigned long end,
                                                  vm_flags_t flags, unsigned long long pgoff,
                                                  dev_t dev, unsigned long ino)
          {
              seq_setwidth(m, 25 + sizeof(void *) * 6 - 1);
              seq_printf(m, "%08lx-%08lx %c%c%c%c %08llx %02x:%02x %lu ",
                         start, end,
                         flags & VM_READ ? 'r' : '-',
                         flags & VM_WRITE ? 'w' : '-',
                         flags & VM_EXEC ? '-' : '-',
                         flags & VM_MAYSHARE ? 's' : 'p',
                         pgoff, MAJOR(dev), MINOR(dev), ino);
          }
          '''
          
          if 'show_vma_header_prefix_fake' not in s:
              anchor = 'static void\nshow_map_vma(struct seq_file *m, struct vm_area_struct *vma)'
              if anchor not in s:
                  anchor = 'static void show_map_vma(struct seq_file *m, struct vm_area_struct *vma)'
              if anchor not in s:
                  raise SystemExit('Maphide port: show_map_vma anchor not found')
              s = s.replace(anchor, helper + '\n' + anchor, 1)
          
          if 'struct dentry *dentry;' not in s:
              pattern = r'(show_map_vma\(struct seq_file \*m, struct vm_area_struct \*vma\).*?const char \*name = NULL;)(\n)'
              match = re.search(pattern, s, re.S)
              if not match:
                  raise SystemExit('Maphide port: show_map_vma variable anchor not found')
              s = s[:match.end(1)] + '\n\tstruct dentry *dentry;' + s[match.end(1):]
          
          if 'strstr(path, "jit-zygote-cache")' not in s:
              match = re.search(r'(pgoff\s*=\s*\(\(loff_t\)vma->vm_pgoff\)\s*<<\s*PAGE_SHIFT;\s*\n)', s)
              if not match:
                  raise SystemExit('Maphide port: pgoff calculation anchor not found')
              block = '''
          		dentry = file->f_path.dentry;
          		if (dentry) {
          			const char *path = (const char *)dentry->d_name.name;
          			if (strstr(path, "lineage")) {
          				start = vma->vm_start;
          				end = vma->vm_end;
          				show_vma_header_prefix(m, start, end, flags, pgoff, dev, ino);
          				name = "/system/framework/framework-res.apk";
          				goto done;
          			}
          			if (strstr(path, "jit-zygote-cache")) {
          				start = vma->vm_start;
          				end = vma->vm_end;
          				show_vma_header_prefix_fake(m, start, end, flags, pgoff, dev, ino);
          				goto bypass;
          			}
          		}
          '''
              s = s[:match.end()] + block + s[match.end():]
          
          if 'bypass:' not in s:
              pattern = r'(\n\s*if \(show_vma_header_prefix\(m, start, end, flags, pgoff, dev, ino\)\)\s*\n\s*return;)'
              match = re.search(pattern, s)
              if not match:
                  raise SystemExit('Maphide port: normal VMA header return anchor not found')
              s = s[:match.start()] + '\n\tbypass:' + s[match.start():]
          
          tmmu.write_text(s)
          
          if 'kern_path("/system/framework/framework-res.apk", LOOKUP_FOLLOW, path)' not in b:
              old = '''\tif (vma && vma->vm_file) {
          \t\t*path = vma->vm_file->f_path;
          \t\tpath_get(path);
          \t\trc = 0;
          \t}'''
              new = '''\tif (vma) {
          \t\tif (vma->vm_file) {
          \t\t\tif (strstr(vma->vm_file->f_path.dentry->d_name.name, "lineage")) {
          \t\t\t\trc = kern_path("/system/framework/framework-res.apk", LOOKUP_FOLLOW, path);
          \t\t\t} else {
          \t\t\t\t*path = vma->vm_file->f_path;
          \t\t\t\tpath_get(path);
          \t\t\t\trc = 0;
          \t\t\t}
          \t\t}
          \t}'''
              if old in b:
                  b = b.replace(old, new, 1)
              else:
                  pattern = r'\s*if \(vma && vma->vm_file\) \{\s*\*path = vma->vm_file->f_path;\s*path_get\(path\);\s*rc = 0;\s*\}'
                  match = re.search(pattern, b)
                  if not match:
                      raise SystemExit('Maphide port: proc base VMA path anchor not found')
                  b = b[:match.start()] + '\n' + new + b[match.end():]
              base.write_text(b)
          
          s = tmmu.read_text()
          b = base.read_text()
          checks = {
              'helper': 'show_vma_header_prefix_fake' in s,
              'dentry': 'struct dentry *dentry;' in s,
              'jit-zygote': 'strstr(path, "jit-zygote-cache")' in s,
              'lineage-task': 'strstr(path, "lineage")' in s,
              'bypass': 'bypass:' in s,
              'lineage-base': 'strstr(vma->vm_file->f_path.dentry->d_name.name, "lineage")' in b,
              'fake-base-path': 'kern_path("/system/framework/framework-res.apk", LOOKUP_FOLLOW, path)' in b,
          }
          missing = [name for name, ok in checks.items() if not ok]
          if missing:
              raise SystemExit('Maphide source-port verification failed: ' + ', '.join(missing))

          PYPORT
            mode="source-compatible-port"
          fi

          git diff --check
          grep -q 'show_vma_header_prefix_fake' fs/proc/task_mmu.c
          grep -q 'jit-zygote-cache' fs/proc/task_mmu.c
          grep -q 'strstr(path, "lineage")' fs/proc/task_mmu.c
          grep -q 'bypass:' fs/proc/task_mmu.c
          grep -q 'kern_path("/system/framework/framework-res.apk", LOOKUP_FOLLOW, path)' fs/proc/base.c
          grep -q 'strstr(vma->vm_file->f_path.dentry->d_name.name, "lineage")' fs/proc/base.c

          echo "Maphide/Futile source integration: $mode" | tee "$GITHUB_WORKSPACE/artifacts/maphide-integration.txt"
          git diff --check

      - name: 11 - Build kernel Image + modules
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/11-build.log) 2>&1
          trap 'rc=$?; echo "FAILED step=11 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          make -Oline \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$CLANG_DIR/bin/llvm-objcopy" \
            OBJDUMP="$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$CLANG_DIR/bin/llvm-strip" \
            -j"$(nproc)" \
            Image modules

          test -s "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          sha256sum "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            > "$GITHUB_WORKSPACE/artifacts/Image.sha256"

      - name: 12 - Final kernel validation
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/12-final.log) 2>&1
          trap 'rc=$?; echo "FAILED step=12 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cfg="$GITHUB_WORKSPACE/out/.config"
          test -s "$GITHUB_WORKSPACE/artifacts/maphide-integration.txt"

          grep -q '^CONFIG_KPROBES=y$' "$cfg"
          grep -q '^CONFIG_KSU=y$' "$cfg"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$cfg"
          grep -q '^CONFIG_KPM=y$' "$cfg"
          grep -q '^CONFIG_BBG_BLOCK_BOOT=y$' "$cfg"

          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$cfg"
          grep -q '^CONFIG_KALLSYMS=y$' "$cfg"
          grep -q '^CONFIG_KALLSYMS_ALL=y$' "$cfg"
          grep -q '^CONFIG_EXT4_FS=y$' "$cfg"
          grep -q '^CONFIG_OVERLAY_FS=y$' "$cfg"
          grep -q '^CONFIG_BBG=y$' "$cfg"
          if grep -q '^CONFIG_LSM=' "$cfg"; then grep '^CONFIG_LSM=' "$cfg" | grep -q 'baseband_guard'; fi

          for c in \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP; do

            grep -q "^${c}=y$" "$cfg"
          done

          {
            echo 'target=LG-G900-Global'
            echo "kernel_commit=$(git -C src/kernel rev-parse HEAD)"
            echo "defconfig=$DEFCONFIG"
            echo "sukisu_ref=$SUKISU_REF"
            echo "sukisu_commit=$(git -C src/kernel/KernelSU rev-parse HEAD)"
            echo "cip=$CIP_TARGET_TAG applied-only-after-clean-ancestry"
            echo "dtb=$DTB_TARGET"
            echo "dtbo=$DTBO_TARGET"
          } > "$GITHUB_WORKSPACE/artifacts/build-info.txt"

      - name: 13 - Upload kernel artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-Kernel
          path: |
            out/arch/arm64/boot/Image
            artifacts/final.config
            artifacts/build-info.txt
            artifacts/Image.sha256
            artifacts/network-connectivity-report.txt
            artifacts/requested-feature-config.txt
            artifacts/bbg-integration.txt
            artifacts/susfs-kernel-ref.txt
            artifacts/sukisu-susfs-commit.txt
            artifacts/cip*

      - name: 14 - Upload kernel diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-Kernel-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn

  dtb:
    name: DTB
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 00 - Init diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-diagnostics artifacts
          exec > >(tee -a ci-diagnostics/00-runner.log) 2>&1
          trap 'rc=$?; echo "FAILED step=00 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

      - name: 01 - Checkout kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/01-checkout.log) 2>&1
          trap 'rc=$?; echo "FAILED step=01 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" src/kernel

      - name: 02 - Dependencies + Clang
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/02-toolchain.log) 2>&1
          trap 'rc=$?; echo "FAILED step=02 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential clang flex libelf-dev libssl-dev \
            lld llvm make device-tree-compiler

          git clone --depth=1 --filter=blob:none --sparse --branch ndk-r29 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchains/clang

          cd toolchains/clang
          git sparse-checkout set clang-r563880c

          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c" \
            >> "$GITHUB_ENV"

      - name: 03 - Configure exact device defconfig
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/03-config.log) 2>&1
          trap 'rc=$?; echo "FAILED step=03 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          printf 'nop\n' \
            | clang --target=aarch64-linux-android21 \
              -x assembler - -c -o /tmp/as.o

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            "$DEFCONFIG"

          test -s "$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y$' \
            "$GITHUB_WORKSPACE/out/.config"

      - name: 04 - Build ONLY lito-mtp.dtb
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/04-dtb-build.log) 2>&1
          trap 'rc=$?; echo "FAILED step=04 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          make -Oline \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            "$DTB_TARGET"

          produced="$GITHUB_WORKSPACE/out/arch/arm64/boot/dts/$DTB_TARGET"

          test -s "$produced" || {
            echo "ERROR: expected DTB output not found: $produced"
            find "$GITHUB_WORKSPACE/out/arch/arm64/boot/dts" \
              -name 'lito-mtp.dtb' -print || true
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/artifacts/dtb"

          cp "$produced" \
            "$GITHUB_WORKSPACE/artifacts/dtb/lito-mtp.dtb"

          if [ -s "$GITHUB_WORKSPACE/reference/dtb/lito-mtp.dtb" ]; then
            cp "$GITHUB_WORKSPACE/reference/dtb/lito-mtp.dtb" \
              "$GITHUB_WORKSPACE/artifacts/dtb/lito-mtp.dtb.completed-reference"
          fi

          sha256sum "$produced" \
            > "$GITHUB_WORKSPACE/artifacts/dtb/lito-mtp.dtb.sha256"

      - name: 05 - Validate DTB structure
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/05-verify.log) 2>&1
          trap 'rc=$?; echo "FAILED step=05 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          "$GITHUB_WORKSPACE/out/scripts/dtc/dtc" \
            -I dtb \
            -O dts \
            -o artifacts/dtb/lito-mtp.dts \
            artifacts/dtb/lito-mtp.dtb

          grep -q 'qcom,lito-mtp' \
            artifacts/dtb/lito-mtp.dts

          grep -q 'qcom,lito' \
            artifacts/dtb/lito-mtp.dts

      - name: 06 - Upload DTB
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTB
          path: artifacts/dtb/**

      - name: 07 - Upload DTB diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTB-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn

  dtbo:
    name: DTBO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 00 - Init diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-diagnostics artifacts
          exec > >(tee -a ci-diagnostics/00-runner.log) 2>&1
          trap 'rc=$?; echo "FAILED step=00 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

      - name: 01 - Checkout kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/01-checkout.log) 2>&1
          trap 'rc=$?; echo "FAILED step=01 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" src/kernel

      - name: 02 - Dependencies + Clang
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/02-toolchain.log) 2>&1
          trap 'rc=$?; echo "FAILED step=02 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential clang flex libelf-dev libssl-dev \
            lld llvm make device-tree-compiler

          git clone --depth=1 --filter=blob:none --sparse --branch ndk-r29 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchains/clang

          cd toolchains/clang
          git sparse-checkout set clang-r563880c

          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c" \
            >> "$GITHUB_ENV"

      - name: 03 - Configure and validate exact Global overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/03-target.log) 2>&1
          trap 'rc=$?; echo "FAILED step=03 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            "$DEFCONFIG"

          grep -q '^CONFIG_MACH_LITO_CAYMANLM=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          test -f "$DTBO_DTS"

          grep -q \
            'model = "LG Electronics, Caymanlm, HW Rev 1.0"' \
            "$DTBO_DTS"

          grep -q \
            'qcom,board-id = <0x000C0008 0>;' \
            "$DTBO_DTS"

          ! grep -q '0x010C0008' "$DTBO_DTS"

      - name: 04 - Repair only the confirmed LGE Kbuild wildcard typo in a temporary CI copy
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/04-kbuild-fix.log) 2>&1
          trap 'rc=$?; echo "FAILED step=04 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel

          f=arch/arm64/boot/dts/vendor/lge/Makefile

          grep -q \
            '\$(wildcard echo \$(srctree)/\$(src)' \
            "$f"

          cp "$f" \
            "$GITHUB_WORKSPACE/artifacts/lge-Makefile.before"

          sed -i \
            's/\$(wildcard echo \$(srctree)\/\$(src)/\$(wildcard \$(srctree)\/\$(src)/' \
            "$f"

          ! grep -q '\$(wildcard echo' "$f"

          cp "$f" \
            "$GITHUB_WORKSPACE/artifacts/lge-Makefile.after"

          echo 'Applied one CI-local typo fix only: wildcard echo -> wildcard.'

      - name: 05 - Build Global Cayman DTBO set with all source features
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/05-dtbo-build.log) 2>&1
          trap 'rc=$?; echo "FAILED step=05 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          # The previous failure used an absolute arch/... target. Kbuild targets
          # are relative to arch/arm64/boot/dts, so the correct target starts at
          # vendor/lge/. Keep the existing source tree and its features intact.
          test -f "$DTBO_DTS"
          test "${DTBO_TARGET#vendor/lge/}" = "lito-caymanlm_lao_com-rev-1.0_overlay.dtbo"

          # Build every overlay currently present in the selected Global device
          # directory. This does not invent hardware nodes and does not remove
          # other overlays; it compiles the complete DTBO feature set already
          # provided by the source tree.
          src_dir="arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com"
          test -d "$src_dir"

          mapfile -t dts_files < <(find "$src_dir" -maxdepth 1 -type f -name '*.dts' -printf '%f\n' | sort)
          test "${#dts_files[@]}" -gt 0

          mkdir -p "$GITHUB_WORKSPACE/artifacts/dtbo"
          : > "$GITHUB_WORKSPACE/artifacts/dtbo/build-list.txt"

          for dts in "${dts_files[@]}"; do
            base="${dts%.dts}"
            target="vendor/lge/${base}.dtbo"
            echo "$target" | tee -a "$GITHUB_WORKSPACE/artifacts/dtbo/build-list.txt"

            make -Oline \
              O="$GITHUB_WORKSPACE/out" \
              ARCH=arm64 \
              SUBARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CC="$CLANG_DIR/bin/clang" \
              HOSTCC="$CLANG_DIR/bin/clang" \
              LD="$CLANG_DIR/bin/ld.lld" \
              HOSTLD="$CLANG_DIR/bin/ld.lld" \
              AR="$CLANG_DIR/bin/llvm-ar" \
              NM="$CLANG_DIR/bin/llvm-nm" \
              "$target"

            produced="$GITHUB_WORKSPACE/out/arch/arm64/boot/dts/vendor/lge/${base}.dtbo"
            test -s "$produced"
            cp "$produced" "$GITHUB_WORKSPACE/artifacts/dtbo/${base}.dtbo"
            sha256sum "$produced" > "$GITHUB_WORKSPACE/artifacts/dtbo/${base}.dtbo.sha256"
          done

          # The requested Global Rev 1.0 overlay must be one of the built outputs.
          test -s "$GITHUB_WORKSPACE/artifacts/dtbo/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo"

          "$GITHUB_WORKSPACE/out/scripts/dtc/dtc" \
            -I dtb \
            -O dts \
            -o "$GITHUB_WORKSPACE/artifacts/dtbo/overlay.dts" \
            "$GITHUB_WORKSPACE/artifacts/dtbo/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo"

      - name: 06 - Validate DTBO identity
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/06-verify.log) 2>&1
          trap 'rc=$?; echo "FAILED step=06 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          grep -q \
            'LG Electronics, Caymanlm, HW Rev 1.0' \
            artifacts/dtbo/overlay.dts

          grep -q \
            'qcom,board-id' \
            artifacts/dtbo/overlay.dts

          ! grep -q \
            '0x010C0008' \
            artifacts/dtbo/overlay.dts

      - name: 07 - Upload DTBO
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTBO
          path: |
            artifacts/dtbo/**

      - name: 08 - Upload DTBO diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTBO-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn

  package:
    name: AnyKernel3 + SUSFS package
    needs: [kernel, dtb, dtbo]
    if: ${{ always() && needs.kernel.result == 'success' && needs.dtb.result == 'success' && needs.dtbo.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: 00 - Init package diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-diagnostics artifacts
          exec > >(tee -a ci-diagnostics/00-runner.log) 2>&1
          trap 'rc=$?; echo "FAILED step=00 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

      - name: 01 - Download successful build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LG-G900-Global-{Kernel,DTB,DTBO}
          path: downloaded
          merge-multiple: false

      - name: 02 - Install AnyKernel3
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/02-anykernel.log) 2>&1
          trap 'rc=$?; echo "FAILED step=02 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          git clone \
            --depth=1 \
            --branch "$ANYKERNEL3_REF" \
            "$ANYKERNEL3_REPO" \
            AnyKernel3

          cp downloaded/LG-G900-Global-Kernel/Image \
            AnyKernel3/Image

          cp downloaded/LG-G900-Global-DTB/dtb/lito-mtp.dtb \
            AnyKernel3/dtb

          cat > AnyKernel3/anykernel.sh <<'AK3'
          properties() { '
          kernel.string=LG G900 Global - SukiSU-Ultra + SUSFS + CIP135
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AK3

          rm -rf AnyKernel3/.git AnyKernel3/.github

          mkdir -p artifacts

          (
            cd AnyKernel3
            zip -r9 \
              "$GITHUB_WORKSPACE/artifacts/LG-G900-Global-SukiSU-SUSFS-CIP135-AnyKernel3.zip" \
              . \
              -x '*.git*' '*.github*'
          )

          unzip -t artifacts/*.zip

      - name: 03 - Package DTBO separately (no automatic force-flash)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/03-dtbo-package.log) 2>&1
          trap 'rc=$?; echo "FAILED step=03 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          mkdir -p artifacts/dtbo

          cp \
            downloaded/LG-G900-Global-DTBO/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo \
            artifacts/dtbo/

          # Recalculate the checksum locally instead of assuming that
          # a secondary checksum file was downloaded.
          sha256sum \
            artifacts/dtbo/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo \
            > artifacts/dtbo/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo.sha256

          (
            cd artifacts/dtbo
            zip -9 \
              "$GITHUB_WORKSPACE/artifacts/LG-G900-Global-DTBO.zip" \
              ./*
          )

          unzip -t artifacts/LG-G900-Global-DTBO.zip

      - name: 04 - Package SUSFS userspace module source
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/04-susfs-module.log) 2>&1
          trap 'rc=$?; echo "FAILED step=04 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          git clone \
            --depth=1 \
            --branch "$SUSFS_MODULE_REF" \
            "$SUSFS_MODULE_REPO" \
            susfs-module

          (
            cd susfs-module
            zip -r9 \
              "$GITHUB_WORKSPACE/artifacts/SUSFS-v1.5.2-R28-source.zip" \
              . \
              -x '*.git*'
          )

          unzip -t artifacts/SUSFS-v1.5.2-R28-source.zip

      - name: 05 - Upload packages
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-Flashable-Packages
          path: artifacts/**

      - name: 06 - Upload package diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-Package-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn
