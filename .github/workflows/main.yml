          ## V33 — Setup 27/28 contract validator correction

          V32 fixes a CI orchestration bug, not a kernel feature bug. Setup 27 and Setup 28 previously polled a background child with `kill -0` before calling `wait()`. On Linux a terminated child can remain a zombie until it is reaped, and `kill(pid, 0)` may still report the PID as existing. That can leave the polling loop alive after `make` has already completed, preventing the workflow from advancing to the next setup. V32 replaces that pattern with direct background `timeout/make`, explicit PID-state polling, and mandatory `wait()` for authoritative completion. V32 also removes `timeout --foreground`, because coreutils documents that in foreground mode children are not timed out.

          Setup 28 had the same polling defect and is fixed at the same time.

          # V32 Error and Fix History

          ## V15 — qcacld ARG_MAX
          Real qcacld-3.0 built-in.a creation failed with `/bin/sh: Argument list too long`.
          Root cause: too many expanded object paths in one archive command.
          Fix: upstream-style `patsubst`/`sed`/`xargs` transport while preserving the LG LTO wrapper and rcSTP flags.

          ## V18/V19 — LTO-wrapped Kbuild rule
          The LG tree wrapped the archive command with `$(update_lto_symversions)`. The correction preserved that wrapper rather than applying a plain CIP135 rule.

          ## V20–V27 — SELinux/source-contract corrections
          The workflow progressively corrected 4.19 policy-state, sidtab, AVTAB/flex_array, hashtab/native-array, CPU clocksource, and validator contracts from actual source evidence. No feature-removal workaround was used.

          ## V28 — Setup 27 runtime bottleneck
          Setup 27 used `make -j... drivers/kernelsu/`, a directory-level target. Despite parallel jobs, it could rebuild the entire KernelSU subtree. The previous run reached approximately 1h46m and the GitHub job was cancelled before Setup 28.

          ## V30 — exact fix
          Setup 27 is now a targeted hotspot gate over the audited cumulative KernelSU object list. The full `drivers/kernelsu/` build is no longer executed in Setup 27. Setup 28 remains the authoritative full kernel build and archive gate.

          ## V30 safety rules
          - No feature removal.
          - No compiler-error skipping.
          - No speculative source mutation in Setup 27.
          - Timeout is reported as failure, never success.
          - Full compiler logs are preserved in artifacts.
