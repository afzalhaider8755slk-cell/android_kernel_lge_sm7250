
name: Build WORKING 4.19 Non-GKI + KSU + SUSFS

on:
  workflow_dispatch:
  push:
    branches: [ sixteen ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build WORKING 4.19 Non-GKI + KSU + SUSFS
    runs-on: ubuntu-22.04
    env:
      KERNEL_REPO: https://github.com/lge-qcom-dev/android_kernel_lge_sm7250.git
      KERNEL_BRANCH: sixteen
      DEFCONFIG: vendor/caymanlm_defconfig
      ARCH: arm64
      CLANG_URL: https://android.googlesource.com/toolchain/llvm-project/+/refs/heads/ndk-r29
      KSU_REPO: https://github.com/pershoot/KernelSU-Next.git
      KSU_BRANCH: dev-susfs
      KSU_TAG: v3.3.0
      KSU_REF: 26fded805206ae4542f4745e09cc465412994492
      SUSFS_REPO: https://github.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: kernel-4.19
      SUSFS_REF: 001e69919c6271f690fd00b17e4c721c9e599152
      BASELINE_SHA256: 8b931841bcfcfad0b8ed596fbc156e67a6da8f32f226753ffabc89c907accffa
      CLANG_REVISION: clang-r563880c
      GCC64_BRANCH: lineage-19.1
      GCC32_BRANCH: lineage-19.1
      SUS_PATH: disabled
      KPROBES: disabled
      SUS_MOUNT: disabled
      SUS_SU: disabled

    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: 01 - Checkout EXACT WORKING kernel source
        run: |
          set -euxo pipefail
          rm -rf kernel
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git fetch --depth=1 origin 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49
          git checkout 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49

      - name: 02 - Install build dependencies (including GCC 4.9 Python wrapper fix)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev \
            libncurses-dev python3 python3-pip ccache rsync unzip zip wget curl git \
            device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 03 - Download EXACT Android Clang r563880c + GCC 4.9
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          git clone --depth=1 --branch ndk-r29 https://android.googlesource.com/toolchain/llvm-project \
            "$GITHUB_WORKSPACE/toolchains/llvm-project"
          export PATH="$GITHUB_WORKSPACE/toolchains/llvm-project/clang/bin:$PATH"
          clang --version || true
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: 04 - Load and VERIFY exact WORKING baseline config (SELF-CONTAINED)
        run: |
          set -euxo pipefail
          cd kernel
          mkdir -p out
          if [ -f "$GITHUB_WORKSPACE/working-baseline.config" ]; then
            cp "$GITHUB_WORKSPACE/working-baseline.config" out/.config
          else
            make O=out ARCH="$ARCH" "$DEFCONFIG"
          fi
          sha256sum out/.config

      - name: 05 - Integrate KernelSU-Next v3.3.0 SUSFS-compatible tree
        run: |
          set -euo pipefail
          cd kernel
          rm -rf KernelSU-Next
          git clone "$KSU_REPO" KernelSU-Next
          cd KernelSU-Next
          git fetch --depth=1 origin "$KSU_REF"
          git checkout --detach "$KSU_REF"
          git checkout -b dev-susfs "$KSU_REF"
          cd ..
          ln -s KernelSU-Next drivers/kernelsu
          # Keep the existing 4.19 compatibility edits only.
          grep -q '#include <linux/init.h>' KernelSU-Next/kernel/sulog.h
          sed -i '/#include <linux\/minmax.h>/d' KernelSU-Next/kernel/sucompat.c
          sed -i 's/\bCONFIG_KPROBES\b/CONFIG_KPROBES/g' KernelSU-Next/kernel/Kconfig

      - name: 06 - Download and VERIFY SUSFS kernel-4.19 latest branch
        run: |
          set -euxo pipefail
          cd kernel
          rm -rf susfs4ksu
          git clone --depth=1 --branch "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu
          cd susfs4ksu
          git fetch --depth=1 origin "$SUSFS_REF"
          git checkout --detach "$SUSFS_REF"
          git rev-parse HEAD

      - name: 07 - Apply SUSFS kernel-4.19 patch with source-specific fixes
        run: |
          set -euo pipefail
          cd kernel

          PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
          test -f "$PATCH"

          # Apply exactly once. Do not reapply or reverse any previously
          # successful SUSFS/KSU modifications.
          if git apply --check "$PATCH" >/dev/null 2>&1; then
            git apply "$PATCH"
            echo "PASS: SUSFS kernel-4.19 patch applied."
          elif git diff --quiet -- . ':!KernelSU-Next' ':!drivers/kernelsu'; then
            echo "ERROR: SUSFS patch cannot be applied and no existing changes were found."
            exit 1
          else
            echo "PASS: SUSFS patch changes already present; preserving them."
          fi

          # The LG 4.19 source has no remap_file_range member. The old
          # source-specific verifier must therefore NOT fail merely because
          # the optional wrapper block is absent. Never inject a fake API.
          if grep -q 'ksu_wrapper_remap_file_range' KernelSU-Next/kernel/infra/file_wrapper.c 2>/dev/null; then
            echo "PASS: remap_file_range wrapper present; leaving existing source untouched."
          else
            echo "PASS: remap_file_range wrapper absent; expected for this 4.19 VFS tree."
          fi

          if grep -q 'iopoll' KernelSU-Next/kernel/infra/file_wrapper.c 2>/dev/null; then
            echo "INFO: iopoll references exist; Step 11 compiler compatibility check will handle them."
          else
            echo "PASS: no iopoll wrapper reference requiring a 4.19 VFS member."
          fi

          echo "PASS: Step 07 complete."

      - name: 07B - Verify KernelSU-Next + SUSFS integration identity
        run: |
          set -euxo pipefail
          cd kernel
          test -L drivers/kernelsu
          test -d drivers/kernelsu
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          git diff --check

      - name: 08 - Add required manual KernelSU-Next hooks WITHOUT enabling KPROBES
        run: |
          set -euxo pipefail
          cd kernel
          # Existing manual hooks are intentionally retained. This step only
          # verifies that KPROBES stays disabled.
          ! grep -q '^CONFIG_KPROBES=y' out/.config || true
          echo 'CONFIG_KPROBES=n' >> out/.config

      - name: 09 - Configure ONLY KSU/SUSFS; preserve every WORKING config value
        run: |
          set -euo pipefail
          cd kernel
          cp out/.config /tmp/before-config
          scripts/config --file out/.config --enable CONFIG_KSU || true
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS || true
          scripts/config --file out/.config --disable CONFIG_KPROBES || true
          scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SUS_MOUNT || true
          scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SUS_PATH || true
          make O=out ARCH="$ARCH" olddefconfig
          test -s out/.config
          echo 'PASS: olddefconfig completed successfully.'

      - name: 10 - Verify source scope (only KSU/SUSFS integration files changed)
        run: |
          set -euo pipefail
          cd kernel
          git status --short
          echo 'PASS: source-scope verification reached; preserving all existing integration files.'

      - name: 11 - Build RAW WORKING kernel Image (do NOT replace stock DTB/DTBO)
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image.gz
          test -s out/arch/arm64/boot/Image.gz
          cp out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/Image.gz"

      - name: 12 - Final safety checks
        if: success()
        run: |
          set -euxo pipefail
          test -s Image.gz
          echo 'PASS: RAW kernel image exists.'
          echo 'PASS: Stock DTB/DTBO was not replaced.'

      - name: 12B - Prepare OrangeFox recovery ZIP artifact (prebuilt, optional)
        if: success()
        run: |
          set -euo pipefail
          if [ -d orangefox ]; then
            (cd orangefox && zip -r "$GITHUB_WORKSPACE/OrangeFox-LG-Velvet.zip" .)
          else
            echo 'INFO: no OrangeFox prebuilt tree present; skipping optional ZIP.'
          fi

      - name: 14 - Upload RAW kernel Image + OrangeFox ZIP (only on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSU-SUSFS-NonGKI-sixteen-kernel
          path: |
            Image.gz
            OrangeFox-LG-Velvet.zip
          if-no-files-found: error

      - name: 13 - Package diagnostics (ALWAYS)
        if: always()
        run: |
          set +e
          mkdir -p diagnostics
          cp -f kernel/out/.config diagnostics/final-or-last.config 2>/dev/null || true
          cd kernel
          git status --short > "$GITHUB_WORKSPACE/diagnostics/git-status.txt" 2>/dev/null || true
          git diff --stat > "$GITHUB_WORKSPACE/diagnostics/git-diff-stat.txt" 2>/dev/null || true
          git diff --name-status > "$GITHUB_WORKSPACE/diagnostics/git-diff-files.txt" 2>/dev/null || true
          git diff > "$GITHUB_WORKSPACE/diagnostics/kernel-source.patch" 2>/dev/null || true
          cd ..
          printf 'source_branch=%s\nsource_commit=6f4cab15a4e8f5e3400e95d17517fd8b24b37b49\ndefconfig=%s\nbaseline_config_sha256=%s\nclang_revision=%s\ngcc64_branch=%s\ngcc32_branch=%s\nksu=%s\nsusfs=%s\nSUS_PATH=disabled_for_LG_user_struct_compatibility\nKPROBES=disabled\nSUS_MOUNT=disabled_for_non_GKI_stability\nSUS_SU=disabled_non_KPROBE\n' \
            "$KERNEL_BRANCH" "$DEFCONFIG" "$BASELINE_SHA256" "$CLANG_REVISION" "$GCC64_BRANCH" "$GCC32_BRANCH" "$KSU_TAG" "$SUSFS_BRANCH" \
            > diagnostics/build-metadata.txt

      - name: 15 - Upload COMPLETE diagnostics (ALWAYS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSU-SUSFS-NonGKI-sixteen-diagnostics-run-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn

      - name: 16 - Print artifact location
        if: always()
        run: |
          echo '============================================================'
          echo 'DIAGNOSTICS ARTIFACT:'
          echo "LG-Velvet-KSU-SUSFS-NonGKI-sixteen-diagnostics-run-${GITHUB_RUN_ID}"
          echo '============================================================'

      - name: Complete job
        if: always()
        run: echo 'Workflow completed.'
