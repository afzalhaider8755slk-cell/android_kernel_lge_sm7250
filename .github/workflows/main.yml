          new_remap_block = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 20, 0)
          static loff_t ksu_wrapper_remap_file_range(struct file *file_in, loff_t pos_in, struct file *file_out, loff_t pos_out,
