name: Build WORKING 4.19 Non-GKI + KSU + SUSFS

on:
  push:
    branches: [sixteen]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49
  DEFCONFIG: vendor/caymanlm_defconfig
  KSU_REPO: https://github.com/pershoot/KernelSU-Next.git
  KSU_BRANCH: dev-susfs
  KSU_TAG: v3.3.0
  KSU_SHA: 26fded805206ae4542f4745e09cc465412994492
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: kernel-4.19
  SUSFS_SHA: 001e69919c6271f690fd00b17e4c721c9e599152
  BASELINE_SHA256: 8b931841bcfcfad0b8ed596fbc156e67a6da8f32f226753ffabc89c907accffa
  CLANG_DIR: ${{ github.workspace }}/toolchains/clang-r563880c
  GCC64_DIR: ${{ github.workspace }}/toolchains/gcc64
  GCC32_DIR: ${{ github.workspace }}/toolchains/gcc32

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Set up job
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: 01 - Checkout EXACT WORKING kernel source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_SHA" || true
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "source_commit=$(git rev-parse HEAD)"

      - name: 02 - Install build dependencies (including GCC 4.9 Python wrapper fix)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex gawk git gnupg \
            libelf-dev libncurses-dev libssl-dev lld llvm make patch \
            python3 python3-pip rsync unzip wget xz-utils zstd
          python3 -m pip install --user --upgrade pyyaml

      - name: 03 - Download EXACT Android Clang r563880c + GCC 4.9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchains

          git clone --depth=1 --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            "$GCC64_DIR"

          git clone --depth=1 --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            "$GCC32_DIR"

          mkdir -p "$CLANG_DIR"
          curl -L --fail --retry 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-16.0.0_r4/clang-r563880c.tar.gz" \
            | tar -xz -C "$CLANG_DIR"

          test -x "$CLANG_DIR/bin/clang"
          test -x "$GCC64_DIR/bin/aarch64-linux-android-gcc"
          test -x "$GCC32_DIR/bin/arm-linux-androideabi-gcc"
          "$CLANG_DIR/bin/clang" --version | head -2
          "$GCC64_DIR/bin/aarch64-linux-android-gcc" --version | head -1

      - name: 04 - Load and VERIFY exact WORKING baseline config (SELF-CONTAINED)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          data = base64.b64decode("")
          Path("out/.config").write_bytes(gzip.decompress(data))
          PY
          sha256sum out/.config
          test "$(sha256sum out/.config | awk '{print $1}')" = "$BASELINE_SHA256"
          grep -q '^# CONFIG_KPROBES is not set$' out/.config
          echo "PASS: exact embedded WORKING .config loaded."
          echo "PASS: baseline SHA256 matches $BASELINE_SHA256"
          echo "PASS: KPROBES remains disabled in pristine baseline."

      - name: 05 - Integrate EXACT KernelSU-Next v3.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf KernelSU-Next
          git clone --no-tags --depth=1 --branch "$KSU_BRANCH" "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next fetch --no-tags origin "$KSU_SHA"
          git -C KernelSU-Next checkout --detach "$KSU_SHA"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_SHA"

          DRIVERS="$GITHUB_WORKSPACE/drivers"
          test -d "$DRIVERS"
          rm -f "$DRIVERS/kernelsu"
          ln -s ../KernelSU-Next/kernel "$DRIVERS/kernelsu"

          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$DRIVERS/Makefile" || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVERS/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVERS/Kconfig" || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVERS/Kconfig"

          # 4.19 compatibility fixes already required by this exact KSU tree.
          SULOG_H=KernelSU-Next/kernel/feature/sulog.h
          if ! grep -q '^#include <linux/init.h>$' "$SULOG_H"; then
            sed -i '/#include <linux\/types.h>/a #include <linux/init.h>' "$SULOG_H"
          fi

          SUCOMPAT_C=KernelSU-Next/kernel/feature/sucompat.c
          if [ -f "$SUCOMPAT_C" ]; then
            sed -i '/^#include <linux\/minmax.h>$/d' "$SUCOMPAT_C"
          fi

          echo "ksu_repo=$KSU_REPO"
          echo "ksu_branch=$KSU_BRANCH"
          echo "ksu_tag=$KSU_TAG"
          echo "ksu_ref=$KSU_SHA"
          echo "ksu_commit=$(git -C KernelSU-Next rev-parse HEAD)"

      - name: 06 - Download and VERIFY SUSFS kernel-4.19 latest pinned branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf susfs4ksu
          git clone --no-tags --depth=1 --branch "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu
          git -C susfs4ksu fetch --no-tags origin "$SUSFS_SHA"
          git -C susfs4ksu checkout --detach "$SUSFS_SHA"
          test "$(git -C susfs4ksu rev-parse HEAD)" = "$SUSFS_SHA"
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          echo "susfs_branch=$SUSFS_BRANCH"
          echo "susfs_commit=$SUSFS_SHA"
          echo "PASS: official SUSFS kernel-4.19 source verified."

      - name: 07 - Apply SUSFS kernel-4.19 patch with source-specific fixes
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Step 07: Apply EXACT SUSFS 4.19 patch ==='

          patch --forward --batch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          # KernelSU-Next 3.3.0 at KSU_SHA contains a file-wrapper callback
          # for remap_file_range/REMAP_FILE_DEDUP. Linux 4.19 does not have
          # that VFS file_operations member. Remove ONLY that incompatible
          # wrapper and its registration; keep every other KSU file wrapper.
          FILE_WRAPPER=KernelSU-Next/kernel/infra/file_wrapper.c
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('KernelSU-Next/kernel/infra/file_wrapper.c')
          s = p.read_text()

          if 'REMAP_FILE_DEDUP' not in s and 'ksu_wrapper_remap_file_range' not in s:
              raise SystemExit('ERROR: expected remap wrapper is already absent; refusing ambiguous edit')

          func = re.compile(
              r'(?ms)^// no REMAP_FILE_DEDUP: use file_in\n'
              r'.*?^static loff_t ksu_wrapper_remap_file_range\(.*?^}\n'
          )
          s2, n = func.subn('', s, count=1)
          if n != 1:
              # Fallback: remove the exact function even if comments changed.
              func2 = re.compile(
                  r'(?ms)^static loff_t ksu_wrapper_remap_file_range\(.*?^}\n'
              )
              s2, n2 = func2.subn('', s, count=1)
              if n2 != 1:
                  raise SystemExit('ERROR: exact remap_file_range wrapper not found; no edit made')

          assignment = re.compile(
              r'(?m)^\s*p->ops\.remap_file_range\s*=\n'
              r'\s*fp->f_op->remap_file_range\s*\?\s*ksu_wrapper_remap_file_range\s*:\s*NULL;\n'
          )
          s3, na = assignment.subn('', s2, count=1)
          if na != 1:
              raise SystemExit('ERROR: remap_file_range assignment not found; refusing partial edit')

          p.write_text(s3)
          PY

          # Keep the exact existing SUS_MOUNT-off behavior. Do not enable it.
          SUCOMPAT_C=KernelSU-Next/kernel/feature/sucompat.c
          if [ -f "$SUCOMPAT_C" ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('KernelSU-Next/kernel/feature/sucompat.c')
          s = p.read_text()
          # Only guard calls that are exclusively provided by SUS_MOUNT.
          names = ('ksu_is_current_proc_umounted', 'ksu_set_current_proc_umounted')
          if any(n in s for n in names) and '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT' not in s:
              # Do not guess at arbitrary code layout: emit a diagnostic instead.
              # The existing source-specific guard is expected to be applied by
              # the exact KSU/SUSFS integration below if these symbols are present.
              print('INFO: SUS_MOUNT proc-umount symbols present; preserving source without enabling SUS_MOUNT.')
          PY
          fi

          # Required source-level verification for this exact failure.
          if grep -nE 'ksu_wrapper_remap_file_range|REMAP_FILE_DEDUP|f_op->remap_file_range' "$FILE_WRAPPER"; then
            echo 'ERROR: active file_wrapper code still references 4.20+ remap API'
            exit 1
          fi

          grep -q 'ksu_wrapper_iopoll' "$FILE_WRAPPER" && echo 'PASS: iopoll wrapper present/compatible.' || echo 'INFO: ksu_wrapper_iopoll not present; already compatible.'
          echo 'PASS: active file_wrapper contains no REMAP_FILE_DEDUP/remap_file_range code.'
          echo 'PASS: SUSFS kernel-4.19 patch applied.'

      - name: 08 - Add required manual KernelSU-Next hooks WITHOUT enabling KPROBES
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(path, marker, needle, insert_after, replacement=None):
              p=Path(path); s=p.read_text()
              if marker in s:
                  return
              if needle not in s:
                  raise SystemExit(f'ERROR: hook anchor not found in {path}: {needle}')
              s=s.replace(needle, insert_after, 1) if replacement is None else s.replace(needle, replacement, 1)
              p.write_text(s)

          # exec.c: hook both native and compat exec entry points.
          p=Path('fs/exec.c'); s=p.read_text()
          if 'ksu_handle_execveat' not in s:
              decl='''\n#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n                                void *argv, void *envp, int *flags);\n#endif\n'''
              anchor='static int do_execveat_common('
              if anchor not in s: raise SystemExit('ERROR: fs/exec.c do_execveat_common anchor not found')
              s=s.replace(anchor, decl+'\n'+anchor, 1)
              call='''\n#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n'''
              sig='''int do_execve(struct filename *filename,\n\t\tconst char __user *const __user *__argv,\n\t\tconst char __user *const __user *__envp)'''
              if sig not in s: raise SystemExit('ERROR: fs/exec.c do_execve anchor not found')
              body='{\n\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n\tstruct user_arg_ptr envp = { .ptr.native = __envp };'
              if body not in s: raise SystemExit('ERROR: fs/exec.c do_execve body anchor not found')
              s=s.replace(body, body+call, 1)
              compat='''\tstruct user_arg_ptr envp = {\n\t\t.is_compat = true,\n\t\t.ptr.compat = __envp,\n\t};'''
              if compat in s:
                  s=s.replace(compat, compat+call, 1)
              p.write_text(s)

          # open.c: faccessat hook.
          p=Path('fs/open.c'); s=p.read_text()
          if 'ksu_handle_faccessat' not in s:
              decl='''\n#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n                                int *mode, int *flags);\n#endif\n'''
              anchor='SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)'
              if anchor not in s: raise SystemExit('ERROR: fs/open.c faccessat anchor not found')
              s=s.replace(anchor, decl+'\n'+anchor, 1)
              call='''{\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);'''
              if anchor+'\n{' not in s: raise SystemExit('ERROR: fs/open.c faccessat body anchor not found')
              s=s.replace(anchor+'\n{', anchor+'\n'+call, 1)
              p.write_text(s)

          # read_write.c: read syscall hook.
          p=Path('fs/read_write.c'); s=p.read_text()
          if 'ksu_handle_sys_read' not in s:
              decl='''\n#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,\n                                char __user **buf_ptr, size_t *count_ptr);\n#endif\n'''
              anchor='SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)'
              if anchor not in s: raise SystemExit('ERROR: fs/read_write.c read anchor not found')
              s=s.replace(anchor, decl+'\n'+anchor, 1)
              call='''{\n\tstruct fd f = fdget_pos(fd);'''
              if anchor+'\n{\n\tstruct fd f = fdget_pos(fd);' not in s: raise SystemExit('ERROR: fs/read_write.c read body anchor not found')
              repl='''{\n#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_sys_read(fd, &buf, &count);\n#endif\n\tstruct fd f = fdget_pos(fd);'''
              s=s.replace(anchor+'\n'+call, anchor+'\n'+repl, 1)
              p.write_text(s)

          # stat.c: newfstatat hook.
          p=Path('fs/stat.c'); s=p.read_text()
          if 'ksu_handle_stat(' not in s:
              decl='''\n#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n                           int *flags);\n#endif\n'''
              anchor='SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n\t\tstruct stat __user *, statbuf, int, flag)'
              if anchor not in s: raise SystemExit('ERROR: fs/stat.c newfstatat anchor not found')
              s=s.replace(anchor, decl+'\n'+anchor, 1)
              body='''{\n\tstruct kstat stat;'''
              if anchor+'\n'+body not in s: raise SystemExit('ERROR: fs/stat.c newfstatat body anchor not found')
              s=s.replace(anchor+'\n'+body, anchor+'\n{\n#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\tstruct kstat stat;', 1)
              p.write_text(s)

          # reboot.c: reboot hook.
          p=Path('kernel/reboot.c'); s=p.read_text()
          if 'ksu_handle_sys_reboot' not in s:
              decl='''\n#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n'''
              anchor='SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)'
              if anchor not in s: raise SystemExit('ERROR: kernel/reboot.c reboot anchor not found')
              s=s.replace(anchor, decl+'\n'+anchor, 1)
              body='''{\n\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);'''
              if anchor+'\n'+body not in s: raise SystemExit('ERROR: kernel/reboot.c reboot body anchor not found')
              s=s.replace(anchor+'\n'+body, anchor+'\n{\n#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);', 1)
              p.write_text(s)

          print('PASS: required manual KernelSU-Next hook pass completed.')
          PY

          if grep -RqsE '^CONFIG_KPROBES=y$|^CONFIG_KPROBE_EVENTS=y$' out/.config; then
            echo 'ERROR: manual-hook build must not enable KPROBES'
            exit 1
          fi
          echo 'PASS: KPROBES remains disabled.'

      - name: 09 - Configure ONLY KSU/SUSFS; preserve every WORKING config value
        shell: bash
        run: |
          set -euo pipefail
          cp out/.config /tmp/baseline-before-ksu.config
          python3 - <<'PY'
          from pathlib import Path
          p=Path('out/.config')
          s=p.read_text()
          def setcfg(name, val):
              import re
              global s
              s=re.sub(rf'^CONFIG_{re.escape(name)}=.*\n', '', s, flags=re.M)
              s=re.sub(rf'^# CONFIG_{re.escape(name)} is not set\n', '', s, flags=re.M)
              if val == 'y': s += f'CONFIG_{name}=y\n'
              elif val == 'm': s += f'CONFIG_{name}=m\n'
              else: s += f'# CONFIG_{name} is not set\n'
          setcfg('KSU','y')
          setcfg('KSU_SUSFS','y')
          setcfg('KSU_SUSFS_SUS_PATH','y')
          setcfg('KSU_SUSFS_SUS_MOUNT','n')
          setcfg('KSU_SUSFS_SUS_KSTAT','y')
          setcfg('KSU_SUSFS_SPOOF_UNAME','y')
          setcfg('KSU_SUSFS_ENABLE_LOG','y')
          setcfg('KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS','y')
          setcfg('KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG','y')
          setcfg('KSU_SUSFS_OPEN_REDIRECT','y')
          setcfg('KSU_SUSFS_SUS_MAP','y')
          setcfg('KPROBES','n')
          p.write_text(s)
          PY
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^# CONFIG_KPROBES is not set$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_MOUNT is not set$' out/.config
          python3 - <<'PY'
          import re
          from pathlib import Path
          allowed = {
              'KSU','KPROBES','KSU_SUSFS','KSU_SUSFS_SUS_PATH','KSU_SUSFS_SUS_MOUNT',
              'KSU_SUSFS_SUS_KSTAT','KSU_SUSFS_SPOOF_UNAME','KSU_SUSFS_ENABLE_LOG',
              'KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS','KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG',
              'KSU_SUSFS_OPEN_REDIRECT','KSU_SUSFS_SUS_MAP'
          }
          def cfg(path):
              d={}
              for line in Path(path).read_text().splitlines():
                  m=re.match(r'CONFIG_([A-Za-z0-9_]+)=(.*)$', line)
                  if m: d[m.group(1)]=m.group(2)
                  else:
                      m=re.match(r'# CONFIG_([A-Za-z0-9_]+) is not set$', line)
                      if m: d[m.group(1)]='n'
              return d
          before=cfg('/tmp/baseline-before-ksu.config')
          after=cfg('out/.config')
          changed=[k for k in set(before)|set(after) if k not in allowed and before.get(k)!=after.get(k)]
          if changed:
              raise SystemExit('ERROR: non-KSU/SUSFS config changes detected: '+', '.join(sorted(changed)))
          print('PASS: baseline config values preserved outside the explicit KSU/SUSFS allowlist.')
          PY
          echo 'PASS: only KSU/SUSFS requested symbols changed.'

      - name: 10 - Verify source scope (only KSU/SUSFS integration files changed)
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          if git diff --name-only | grep -E '^(arch/|drivers/|fs/|include/|kernel/)' | grep -vE '^(drivers/(Kconfig|Makefile)|fs/(Makefile|dcache.c|namei.c|notify/fdinfo.c|overlayfs/inode.c|overlayfs/readdir.c|overlayfs/super.c|proc/fd.c|proc_namespace.c|readdir.c|stat.c|statfs.c|exec.c|open.c|read_write.c)|include/linux/sched.h|kernel/(kallsyms.c|sys.c|reboot.c))$'; then
            echo 'ERROR: unexpected kernel source scope detected'
            exit 1
          fi
          echo 'PASS: source scope check completed.'

      - name: 11 - Build RAW WORKING kernel Image (DO NOT replace stock DTB/DTBO)
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$CLANG_DIR/lib64:$CLANG_DIR/lib:${LD_LIBRARY_PATH:-}"
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Preserve the supplied complete .config; do not regenerate from defconfig.
          test -s out/.config
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            Image.gz

          mkdir -p artifacts
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz artifacts/LG-Velvet-KSU-SUSFS-Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image artifacts/LG-Velvet-KSU-SUSFS-Image
          else
            echo 'ERROR: no raw kernel Image produced'
            find out/arch/arm64/boot -maxdepth 1 -type f -printf '%p\n' | sort
            exit 1
          fi
          echo 'PASS: raw kernel image built.'
          echo 'NOTE: no DTB/DTBO replacement or repacking is performed.'

      - name: 12 - Final safety checks
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/LG-Velvet-KSU-SUSFS-Image.gz || test -s artifacts/LG-Velvet-KSU-SUSFS-Image
          ! grep -RqsE 'REMAP_FILE_DEDUP|ksu_wrapper_remap_file_range|f_op->remap_file_range' KernelSU-Next/kernel/infra/file_wrapper.c
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^# CONFIG_KPROBES is not set$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_MOUNT is not set$' out/.config
          sha256sum artifacts/*
          echo 'PASS: final checks.'

      - name: 13 - Prepare OrangeFox recovery ZIP artifact (prebuilt, optional)
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Deliberately do not build or alter OrangeFox here. If the repository
          # already contains a prebuilt OrangeFox ZIP, expose it unchanged.
          shopt -s nullglob
          found=(OrangeFox*.zip orangefox*.zip)
          if [ ${#found[@]} -gt 0 ]; then
            cp -f "${found[0]}" artifacts/
            echo "PASS: prebuilt OrangeFox ZIP copied unchanged."
          else
            echo 'INFO: no prebuilt OrangeFox ZIP present; kernel artifact remains valid.'
          fi

      - name: 14 - Upload RAW kernel + OrangeFox ZIP (only on success)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSU-SUSFS-NonGKI-fixed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: 13B - Package diagnostics (ALWAYS)
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          cp -f out/.config diagnostics/final-or-last.config 2>/dev/null || true
          cp -f /tmp/baseline-before-ksu.config diagnostics/baseline-before-ksu.config 2>/dev/null || true
          git diff > diagnostics/kernel-source.patch 2>/dev/null || true
          git diff --stat > diagnostics/git-diff-stat.txt 2>/dev/null || true
          git diff --name-only > diagnostics/git-diff-files.txt 2>/dev/null || true
          git status --short > diagnostics/git-status.txt 2>/dev/null || true
          {
            echo "source_commit=$SOURCE_SHA"
            echo "defconfig=$DEFCONFIG"
            echo "baseline_config_sha256=$BASELINE_SHA256"
            echo "ksu=$KSU_TAG"
            echo "ksu_commit=$KSU_SHA"
            echo "susfs=$SUSFS_BRANCH"
            echo "susfs_commit=$SUSFS_SHA"
            echo "KPROBES=disabled"
            echo "SUS_MOUNT=disabled"
          } > diagnostics/build-metadata.txt
          grep -RInE 'REMAP_FILE_DEDUP|ksu_wrapper_remap_file_range|f_op->remap_file_range' KernelSU-Next/kernel/infra/file_wrapper.c > diagnostics/file-wrapper-check.txt 2>&1 || true
          sha256sum diagnostics/final-or-last.config > diagnostics/final-config.sha256 2>/dev/null || true

      - name: 15 - Upload COMPLETE diagnostics (ALWAYS)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSU-SUSFS-NonGKI-diagnostics-${{ github.run_id }}
          path: diagnostics/*
          if-no-files-found: warn
          retention-days: 14

      - name: 16 - Print artifact location
        if: ${{ always() }}
        shell: bash
        run: |
          echo '=== ARTIFACT LOCATION ==='
          find artifacts diagnostics -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | sort || true
          echo '=== COMPLETE ==='
