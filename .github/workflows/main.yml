          check grep -q 'framework-res.apk' fs/proc/task_mmu.c
          check grep -RqsE 'baseband.?guard|CONFIG_BBG' Baseband-guard security

          echo "--- Linux 4.19 API boundaries ---" | tee -a "$REPORT"
          check grep -qF 'struct selinux_ss *ss;' security/selinux/include/security.h
          check grep -qF 'struct policydb policydb;' security/selinux/ss/services.h
          check grep -qF 'struct selinux_map map;' security/selinux/ss/services.h
          check grep -qF 'struct sidtab *sidtab;' security/selinux/ss/services.h
          check grep -qF 'int sidtab_init(struct sidtab *s);' security/selinux/ss/sidtab.h
          check grep -qE 'sidtab_search|sidtab_context_to_sid' security/selinux/ss/sidtab.h
          check grep -qF 'struct page *status_page;' security/selinux/ss/services.h
          check grep -qF 'struct mutex status_lock;' security/selinux/ss/services.h

          if grep -qF 'TWA_RESUME' drivers/kernelsu/supercall/supercall.c; then
            note "TWA_RESUME remains before Setup 19 mutation; the existing exact bool-API fix must run."
          else
            echo "[PASS] No obsolete TWA_RESUME in dispatcher source." | tee -a "$REPORT"
            pass=$((pass+1))
          fi

          if grep -qF 'flex_array_get_ptr(node_ptr, i)' drivers/kernelsu/selinux/sepolicy.c; then
            note "Legacy flex_array hashtab iteration remains before Setup 19 mutation; the existing exact fix must run."
          else
            echo "[PASS] No obsolete flex_array hashtab iteration." | tee -a "$REPORT"
            pass=$((pass+1))
          fi

          echo "--- SELinux-hide post-port invariant ---" | tee -a "$REPORT"
          check grep -qF 'selinux_state.ss->status_lock' drivers/kernelsu/feature/selinux_hide.c
          check grep -qF 'selinux_state.ss->status_page' drivers/kernelsu/feature/selinux_hide.c
          check grep -qF 'fake_ss.map = selinux_state.ss->map;' drivers/kernelsu/feature/selinux_hide.c
          check grep -qF 'fake_ss.sidtab = selinux_state.ss->sidtab;' drivers/kernelsu/feature/selinux_hide.c
          check grep -qF 'fake_ss.latest_granting = selinux_state.ss->latest_granting;' drivers/kernelsu/feature/selinux_hide.c
          if grep -qE 'selinux_state\.(status_lock|status_page)|fake_state\.policy[[:space:]]*=' drivers/kernelsu/feature/selinux_hide.c; then
            echo "[FAIL] Modern direct SELinux state fields remain after the 4.19 port." | tee -a "$REPORT"
            fail=$((fail+1))
          else
            echo "[PASS] No obsolete direct SELinux state fields remain." | tee -a "$REPORT"
            pass=$((pass+1))
          fi

          echo "--- Hardware source-presence sanity ---" | tee -a "$REPORT"
          for p in drivers/input drivers/vibrator drivers/haptics drivers/soc/qcom sound techpack/audio techpack/voice techpack/data drivers/net/wireless; do
            if [ -d "$p" ]; then
              echo "[PASS] $p" | tee -a "$REPORT"
              pass=$((pass+1))
            else
              echo "[WARN] source directory absent: $p" | tee -a "$REPORT"
              warn=$((warn+1))
            fi
          done

          echo | tee -a "$REPORT"
          echo "SUMMARY: PASS=$pass CHECKS=$warn FAIL=$fail" | tee -a "$REPORT"
          if [ "$fail" -ne 0 ]; then
            echo "[FAIL] Pre-build compatibility matrix found a blocking mismatch." | tee -a "$REPORT"
            exit 1
          fi
          echo "[PASS] Pre-build compatibility matrix completed before kernel compilation." | tee -a "$REPORT"
          echo "[PASS] This step performs no source mutation." | tee -a "$REPORT"
          echo "====================================================" | tee -a "$REPORT"

      - name: Setup 26 - HID QCACLD Compatibility
        shell: bash
        run: |
          SETUP_NO="26"
          SETUP_NAME="Setup 26 - HID QCACLD Compatibility"
          SETUP_LOG="$DIAG_DIR/26-setup-26-hid-qcacld-compatibility-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set -Eeuo pipefail
          LOG="$DIAG_DIR/12A-hid-argmax-compatibility.log"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          echo "========== PRE-BUILD HID + QCACLD ARGUMENT-LENGTH AUDIT =========="
          echo "[RESEARCH] Actual LG lineage-23.2 source has hid_descriptor.rpt_desc and two bind-time descriptor initialization sites: CONFIG_LGE_USB_GADGET charge path plus normal path. Both must use rpt_desc; no third synthetic assignment is allowed."
          echo "[RESEARCH] Upstream HID gadget uses rpt_desc in the HID descriptor and GET_DESCRIPTOR path; this audit will not invent a third assignment site."
          echo "[LOCKED] Setup 10A is not modified by this step."
          echo "[LOCKED] Setup 19 SELinux/SukiSU source boundaries are not modified by this step."

          python3 - <<'PY'
          from pathlib import Path

          # ===============================================================
          # USB HID: source-derived compatibility audit/fix.
          #
          # The previous V82 guard was too strict: it assumed every 4.19
          # f_hid.c tree must contain a hidg_desc.rpt_desc assignment inside
          # hidg_bind().  The actual checked-out LG tree has the report
          # descriptor assignments in hidg_setup() on the GET_DESCRIPTOR
          # path, while hidg_bind() does not perform that mutation.
          #
          # Upstream Linux contains both historical forms: older trees used
          # desc[0], while newer trees expose the named rpt_desc member.
          # Therefore this step validates the actual checked-out function
          # layout instead of imposing a non-existent "bind pair".
          #
          # No regex is used for the HID source transformation.  This
          # prevents another Python regex-parser failure from becoming a
          # build blocker.
          # ===============================================================
          hid_h = Path('include/linux/hid.h')
          f_hid = Path('drivers/usb/gadget/function/f_hid.c')
          if not hid_h.is_file() or not f_hid.is_file():
              raise SystemExit('[FAIL] Required HID source/header is missing.')

          hh = hid_h.read_text(errors='replace')
          fh = f_hid.read_text(errors='replace')

          # Find the actual struct without regex.  The source has a single
          # struct hid_descriptor definition in this kernel tree.
          marker = 'struct hid_descriptor {'
          pos = hh.find(marker)
          if pos < 0:
              raise SystemExit('[FAIL] Could not locate struct hid_descriptor in include/linux/hid.h.')
          close = hh.find('};', pos)
          if close < 0:
              raise SystemExit('[FAIL] Could not determine struct hid_descriptor boundary.')
          body = hh[pos:close + 2]

          has_rpt = 'rpt_desc' in body
          has_legacy_desc = 'desc[1]' in body or 'desc[]' in body
          print(f'[EVIDENCE] hid_descriptor: rpt_desc={has_rpt} legacy_desc_array={has_legacy_desc}')

          if not has_rpt:
              raise SystemExit('[FAIL] Checked-out HID header has no rpt_desc member; refusing speculative HID mutation.')

          old_copy_type = 'hidg_desc_copy.desc[0].bDescriptorType'
          old_copy_len = 'hidg_desc_copy.desc[0].wDescriptorLength'
          old_bind_type = 'hidg_desc.desc[0].bDescriptorType'
          old_bind_len = 'hidg_desc.desc[0].wDescriptorLength'

          new_copy_type = 'hidg_desc_copy.rpt_desc.bDescriptorType'
          new_copy_len = 'hidg_desc_copy.rpt_desc.wDescriptorLength'
          new_bind_type = 'hidg_desc.rpt_desc.bDescriptorType'
          new_bind_len = 'hidg_desc.rpt_desc.wDescriptorLength'

          old_count = sum(fh.count(x) for x in (
              old_copy_type, old_copy_len, old_bind_type, old_bind_len
          ))
          print(f'[AUDIT] f_hid.c obsolete desc[0] accesses={old_count}')

          if old_count:
              fixed = fh.replace(old_copy_type, new_copy_type)
              fixed = fixed.replace(old_copy_len, new_copy_len)
              fixed = fixed.replace(old_bind_type, new_bind_type)
              fixed = fixed.replace(old_bind_len, new_bind_len)
              if fixed == fh:
                  raise SystemExit('[FAIL] Legacy HID accesses were detected but exact source replacement made no change.')
              f_hid.write_text(fixed)
              fh = fixed
              print('[FIXED] Replaced only the known obsolete desc[0] HID descriptor member accesses.')

          if any(x in fh for x in (
              old_copy_type, old_copy_len, old_bind_type, old_bind_len
          )):
              raise SystemExit('[FAIL] Obsolete HID desc[0] accesses remain after exact replacement.')

          # Extract a function body by brace counting, without regex.
          def function_body(text, signature):
              p = text.find(signature)
              if p < 0:
                  return ''
              brace = text.find('{', p)
              if brace < 0:
                  return ''
              depth = 0
              for i in range(brace, len(text)):
                  c = text[i]
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return text[brace:i + 1]
              return ''

          setup = function_body(fh, 'static int hidg_setup(')
          bind = function_body(fh, 'static int hidg_bind(')

          if not setup:
              raise SystemExit('[FAIL] Could not locate hidg_setup(); refusing HID mutation/audit.')
          if not bind:
              print('[INFO] hidg_bind() not present in this source form; bind-time HID pair is not applicable.')

          # The required report descriptor assignments belong to the
          # HID_DT_HID GET_DESCRIPTOR path.  Require exactly one complete
          # pair there.  This is the invariant that is actually needed by
          # the current rpt_desc layout.
          get_case = function_body(setup, 'case HID_DT_HID:')
          if not get_case:
              raise SystemExit('[FAIL] Could not locate HID_DT_HID GET_DESCRIPTOR case in hidg_setup().')

          copy_type_n = get_case.count(new_copy_type)
          copy_len_n = get_case.count(new_copy_len)
          print(f'[AUDIT] hidg_setup HID_DT_HID: type_assignments={copy_type_n} length_assignments={copy_len_n}')
          if copy_type_n != 1 or copy_len_n != 1:
              raise SystemExit('[FAIL] HID GET_DESCRIPTOR path does not contain exactly one rpt_desc assignment pair.')

          # A bind-time pair is optional and source-layout dependent.  If
          # this actual tree has one, it must be complete; if it has none,
          # that is valid and must not be manufactured by the workflow.
          if bind:
              bind_type_n = bind.count(new_bind_type)
              bind_len_n = bind.count(new_bind_len)
              old_bind_n = bind.count(old_bind_type) + bind.count(old_bind_len)
              print(f'[AUDIT] hidg_bind(): rpt_desc type={bind_type_n} length={bind_len_n}; legacy={old_bind_n}')
              # The LG kernel has two legitimate bind-time descriptor
              # initialization sites: one in the CONFIG_LGE_USB_GADGET
              # charge path and one in the normal path.  Therefore the
              # correct invariant is not "0 or 1 pair"; it is that every
              # bind-time type assignment has exactly one matching length
              # assignment.  The V82 check incorrectly rejected the valid
              # 2/2 layout and caused the repeated 12A failure.
              if bind_type_n != bind_len_n:
                  raise SystemExit(
                      '[FAIL] hidg_bind() has mismatched rpt_desc type/length assignment counts.'
                  )
              if old_bind_n:
                  raise SystemExit('[FAIL] Legacy bind-time HID descriptor access remains after exact replacement.')
              # The actual LG 4.19 source has two legitimate bind-time pairs:
              # one in the charge path and one in the normal path.
              if bind_type_n != 2 or bind_len_n != 2:
                  raise SystemExit(
                      f'[FAIL] Expected the actual LG bind layout to contain 2 complete rpt_desc pairs; got {bind_type_n}/{bind_len_n}.'
                  )
              print('[PASS] Actual LG hidg_bind() layout contains exactly 2 complete rpt_desc pairs (charge + normal).')
          print('[PASS] HID source/header compatibility boundary verified against actual source layout.')

          # ===============================================================
          # QCACLD argument-length: source-derived Kbuild fix.
          #
          # The V80/V82 diagnostics identified E2BIG on Qualcomm qcacld-3.0
          # compile commands.  Keep every c_flag and change only the command
          # transport for qcacld-3.0 C objects by using a Clang response file.
          # Non-qcacld compilation remains unchanged.
          # ===============================================================
          mb = Path('scripts/Makefile.build')
          if not mb.is_file():
              raise SystemExit('[FAIL] scripts/Makefile.build is missing.')
          ms = mb.read_text(errors='replace')

          old_nomod = 'cmd_cc_o_c = $(CC) $(c_flags) -c -o $@ $<'
          old_mod = 'cmd_cc_o_c = $(CC) $(c_flags) -c -o $(@D)/.tmp_$(@F) $<'
          count_nomod = ms.count(old_nomod)
          count_mod = ms.count(old_mod)
          print(f'[AUDIT] standard cmd_cc_o_c definitions={count_nomod}, MODVERSIONS definition={count_mod}')

          if count_nomod != 1 or count_mod != 1:
              # It may already have been converted by a previous invocation
              # in the same checkout.  Recognize the exact installed rules
              # rather than applying a second mutation.
              installed_nomod = '$(if $(findstring /qcacld-3.0/,$<),$(file >$@.kbuild.rsp,$(c_flags))$(CC) @$@.kbuild.rsp -c -o $@ $<,$(CC) $(c_flags) -c -o $@ $<)'
              installed_mod = '$(if $(findstring /qcacld-3.0/,$<),$(file >$(@D)/.$(@F).kbuild.rsp,$(c_flags))$(CC) @$(@D)/.$(@F).kbuild.rsp -c -o $(@D)/.tmp_$(@F) $<,$(CC) $(c_flags) -c -o $(@D)/.tmp_$(@F) $<)'
              if installed_nomod in ms and installed_mod in ms:
                  print('[PASS] Exact qcacld-3.0 response-file rules are already installed; no duplicate mutation.')
              else:
                  raise SystemExit('[FAIL] Unexpected 4.19 cmd_cc_o_c layout; refusing speculative Makefile.build rewrite.')
          else:
              new_nomod = 'cmd_cc_o_c = $(if $(findstring /qcacld-3.0/,$<),$(file >$@.kbuild.rsp,$(c_flags))$(CC) @$@.kbuild.rsp -c -o $@ $<,$(CC) $(c_flags) -c -o $@ $<)'
              new_mod = 'cmd_cc_o_c = $(if $(findstring /qcacld-3.0/,$<),$(file >$(@D)/.$(@F).kbuild.rsp,$(c_flags))$(CC) @$(@D)/.$(@F).kbuild.rsp -c -o $(@D)/.tmp_$(@F) $<,$(CC) $(c_flags) -c -o $(@D)/.tmp_$(@F) $<)'
              ms2 = ms.replace(old_nomod, new_nomod, 1).replace(old_mod, new_mod, 1)
              if new_nomod not in ms2 or new_mod not in ms2:
                  raise SystemExit('[FAIL] Response-file kbuild rules were not installed exactly.')
              mb.write_text(ms2)
              print('[FIXED] qcacld-3.0 C compilation now transports complete c_flags through Clang response files.')
              print('[PASS] Non-qcacld compilation path remains byte-for-byte unchanged in cmd_cc_o_c.')

          print('[PASS] All original qcacld compiler flags are preserved; no WLAN feature/config flag was removed.')
          print('===============================================================')
          PY

          echo "[PASS] Setup 12A completed; Setup 10A and Setup 19 remain locked."
          echo "[PASS] HID audit now follows the actual 4.19 source layout; no synthetic bind pair is required."

      - name: Setup 27 - Cumulative 4.19 Hotspot Compile Gate
        shell: bash
        run: |
          SETUP_NO="27"
          SETUP_NAME="Setup 27 - Cumulative 4.19 Hotspot Compile Gate"
          SETUP_LOG="$DIAG_DIR/27-setup-27-cumulative-4-19-hotspot-compile-gate-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set -Eeuo pipefail
          LOG="$DIAG_DIR/12B-targeted-419-compile-smoke.log"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          echo "========== V6 CUMULATIVE 4.19 HOTSPOT COMPILE GATE =========="
          echo "[RULE] No feature removal. No compiler-error skipping."
          echo "[RULE] Setup 27 is verification/compile-only. It performs NO source mutation."
          echo "[RULE] All compatibility fixes must already exist in the cumulative tree."

          SEPOLICY_C="drivers/kernelsu/selinux/sepolicy.c"
          test -s "$SEPOLICY_C"

          echo "----- CURRENT CUMULATIVE sepolicy.c -----"
          sed -n '50,115p' "$SEPOLICY_C"

          echo "----- V6 ITERATOR ARCHITECTURE AUDIT -----"
          python3 - "$SEPOLICY_C" <<'PY'
          from pathlib import Path
          import re, sys

          p = Path(sys.argv[1])
          s = p.read_text()

          # SukiSU's generic iterator remains the flex_array iterator used by
          # Linux 4.19 avtab.
          if "for (cur = flex_array_get_ptr(node_ptr, i); cur; cur = cur->next)" not in s:
              raise SystemExit("[FAIL] V6: required flex_array ksu_hash_for_each() form is missing.")

          # The only 4.19 hashtab correction is the dedicated native-array adapter.
          if "for (cur = (htab)->htable[i]; cur; cur = cur->next)" not in s:
              raise SystemExit("[FAIL] V6: dedicated 4.19 hashtab pointer-array iterator is missing.")
          hashtab_blocks = re.findall(r"(?ms)^#if LINUX_VERSION_CODE >= KERNEL_VERSION\(5, 8, 0\)\n#define ksu_hashtab_for_each\(htab, cur\).*?^#endif", s)
          if len(hashtab_blocks) != 1:
              raise SystemExit(f"[FAIL] V6: expected exactly one conditional ksu_hashtab_for_each block, found {len(hashtab_blocks)}")
          if len(re.findall(r"(?m)^#define ksu_hashtab_for_each\(", s)) != 2:
              raise SystemExit("[FAIL] V6: canonical hashtab iterator must have exactly two version branches.")
          hashtab_match = re.search(
              r"(?ms)^#if LINUX_VERSION_CODE >= KERNEL_VERSION\(5, 8, 0\)\n"
              r"#define ksu_hashtab_for_each\(htab, cur\).*?^#else\n"
              r"(?P<legacy>.*?)^#endif",
              s,
          )
          if not hashtab_match:
              raise SystemExit("[FAIL] V6: canonical hashtab version split is missing.")
          legacy_hashtab = hashtab_match.group("legacy")
          # Inspect preprocessor code, not comments: the researched comment
          # intentionally names ksu_hash_for_each() while documenting why the
          # 4.19 hashtab adapter is separate from the avtab flex_array iterator.
          legacy_code = re.sub(r"/\*.*?\*/|//[^\n]*", "", legacy_hashtab, flags=re.S)
          if re.search(r"\bksu_hash_for_each\s*\(", legacy_code):
              raise SystemExit("[FAIL] V6: Linux 4.19 hashtab branch still invokes the flex_array iterator.")
          if "for (cur = (htab)->htable[i]; cur; cur = cur->next)" not in legacy_code:
              raise SystemExit("[FAIL] V6: Linux 4.19 hashtab branch lacks native pointer-array traversal.")

          # The obsolete duplicate AVTAB injection must be absent.
          if "#define ksu_" + "avtab_for_each(" in s:
              raise SystemExit("[FAIL] V6: obsolete duplicate AVTAB macro injection remains.")

          # Setup 17's researched direct AVTAB traversal must remain intact.
          if "flex_array_get_ptr(db->te_avtab.htable, i)" not in s:
              raise SystemExit("[FAIL] V6: researched AVTAB flex_array traversal is missing.")

          # The exact bad Linux-4.19 hashtab mapping from the failed V4 build must
          # never be regenerated: it routes struct hashtab_node ** into the
          # flex_array iterator and was the direct cause of -Wincompatible-pointer-types.
          bad_hashtab = "#define ksu_hashtab_for_each(htab, cur) ksu_hash_for_each(htab->htable, htab->size, cur)"
          if bad_hashtab in s:
              raise SystemExit("[FAIL] V6: obsolete flex_array hashtab adapter was regenerated.")

          # Linux 4.19 hashtab must have the native pointer-array traversal.
          if "for (cur = (htab)->htable[i]; cur; cur = cur->next)" not in s:
              raise SystemExit("[FAIL] V6: native Linux 4.19 hashtab traversal is missing.")

          names = ["remove_avtab_node", "add_filename_trans", "add_type", "add_typeattribute_raw"]
          counts = {}
          for name in names:
              pat = re.compile(
                  r'(?ms)^static\s+(?:bool|void|struct\s+avtab_node\s*\*)\s+'
                  + re.escape(name) + r'\s*\([^;{}]*\)\s*\{'
              )
              counts[name] = len(pat.findall(s))
          if counts != {n: 1 for n in names}:
              raise SystemExit("[FAIL] V6: duplicate/missing researched function definitions: " + repr(counts))

          print("[PASS] V6: avtab keeps Linux 4.19 flex_array traversal.")
          print("[PASS] V6: hashtab has its separate native pointer-array traversal.")
          print("[PASS] V6: duplicate Setup-27 AVTAB injection is absent.")
          print("[PASS] V6: researched functions occur exactly once.")
          PY

          echo "----- REAL KBUILD GATES (NO AUTOFIX) -----"
          # Research correction: Linux 4.19 Kbuild's supported directory
          # traversal is "make -f scripts/Makefile.build obj=<dir>".  The
          # SukiSU Kbuild declares kernelsu.o as a composite object and
          # sepolicy.o as one of kernelsu-objs.  Calling the top-level Make
          # target "drivers/kernelsu/kernelsu.o" directly bypasses that
          # directory traversal and, in this tree, returns "No rule to make
          # target".  Do not alter the Kbuild/source; invoke the same
          # scripts/Makefile.build path used by normal kernel recursion.
          KSU_BUILD_DIR="drivers/kernelsu"
          SEPOLICY_O="$KSU_BUILD_DIR/selinux/sepolicy.o"
          KSU_COMPOSITE_O="$KSU_BUILD_DIR/kernelsu.o"
          KSU_KBUILD="$KSU_BUILD_DIR/Kbuild"
          test -f "$KSU_KBUILD"
          test -L "$KSU_BUILD_DIR" || test -d "$KSU_BUILD_DIR"
          : > "$RUNNER_TEMP/12B-sepolicy-make-command.log"

          # Linux 4.19's top-level Makefile documents the directory target form
          # '%/: ... $(MAKE) $(build)=$(build-dir)'.  Calling 'make dir/' is
          # therefore the native single-directory Kbuild entry point.  Do not
          # bypass it with a direct scripts/Makefile.build invocation: that
          # invocation produced the '/drivers/kernelsu/Makefile' lookup in V3.
          if ! make -n V=1 "$KSU_BUILD_DIR/" > "$RUNNER_TEMP/12B-sepolicy-make-command.log" 2>&1; then
            echo "[FAIL] V6: Linux 4.19 native directory target $KSU_BUILD_DIR/ failed."
            echo "[FAIL] This is a real Kbuild failure; no compiler error is being skipped."
            cat "$RUNNER_TEMP/12B-sepolicy-make-command.log"
            exit 2
          fi
          test -s "$RUNNER_TEMP/12B-sepolicy-make-command.log"
          grep -F "$SEPOLICY_O" "$RUNNER_TEMP/12B-sepolicy-make-command.log" >/dev/null
          cat "$RUNNER_TEMP/12B-sepolicy-make-command.log"

          make V=1 "$KSU_BUILD_DIR/"
          test -s "$SEPOLICY_O"
          test -s "$KSU_COMPOSITE_O"
          echo "[PASS] V6: Linux 4.19 native directory target compiled kernelsu.o and its sepolicy.o member."

          make -j2 V=1 drivers/usb/gadget/function/f_hid.o
          test -s drivers/kernelsu/feature/selinux_hide.o
          test -s drivers/kernelsu/feature/cpu_spoof.o

          sha256sum "$SEPOLICY_C" | tee "$RUNNER_TEMP/12B-sepolicy.sha256"
          cp -f "$SEPOLICY_C" "$RUNNER_TEMP/12B-sepolicy.c.locked"

          echo "[PASS] V6: targeted cumulative hotspot objects compiled."
          echo "[PASS] V6: Setup 27 applied no fix and performed no source mutation."
          echo "=============================================================="
      - name: Setup 28 - Full Kernel Build HARD GATE
        shell: bash
        run: |
          SETUP_NO="28"
          SETUP_NAME="Setup 28 - Full Kernel Build HARD GATE"
