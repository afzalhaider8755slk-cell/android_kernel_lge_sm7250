name: Build WORKING 4.19 Non-GKI + KSU + SUSFS

on:
  push:
    branches: ["sixteen"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lg-velvet-4.19-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49
  DEFCONFIG: vendor/caymanlm_defconfig
  BASELINE_SHA256: 8b931841bcfcfad0b8ed596fbc156e67a6da8f32f226753ffabc89c907accffa
  KSU_REPO: https://github.com/pershoot/KernelSU-Next.git
  KSU_REF: 26fded805206ae4542f4745e09cc465412994492
  KSU_TAG: v3.3.0
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_REF: 001e69919c6271f690fd00b17e4c721c9e599152
  SUSFS_BRANCH: kernel-4.19
  CLANG_REVISION: clang-r563880c
  GCC_BRANCH: lineage-19.1

jobs:
  build:
    name: Build WORKING 4.19 Non-GKI + KSU + SUSFS
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up job
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison flex build-essential git curl wget ca-certificates patch rsync \
            python3 python-is-python3 unzip zip xz-utils gzip cpio libssl-dev libelf-dev \
            libncurses5-dev libncurses-dev dwarves device-tree-compiler ccache file lz4 zstd
          mkdir -p ci-diagnostics

      - name: 01 - Checkout EXACT WORKING kernel source
        run: |
          set -euxo pipefail
          git fetch --no-tags --prune origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git rev-parse HEAD | tee ci-diagnostics/01-source.txt

      - name: 02 - Install build dependencies (including GCC 4.9)
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "$GCC_BRANCH" \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git clone --depth=1 --branch "$GCC_BRANCH" \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
          echo "GCC64_DIR=$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9" >> "$GITHUB_ENV"

      - name: 03 - Download EXACT Android Clang r563880c + GCC 4.9
        run: |
          set -euxo pipefail
          mkdir -p clang-prebuilt
          curl -L --fail --retry 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-16.0.0_r4/$CLANG_REVISION.tar.gz" \
            -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C clang-prebuilt
          if [ -d "clang-prebuilt/$CLANG_REVISION/bin" ]; then
            CLANG_BIN="$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin"
          else
            CLANG_BIN="$GITHUB_WORKSPACE/clang-prebuilt/bin"
          fi
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "PATH=$CLANG_BIN:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH" >> "$GITHUB_ENV"
          "$CLANG_BIN/clang" --version | tee ci-diagnostics/03-clang-version.txt
          "$GCC64_DIR/bin/aarch64-linux-android-gcc" --version | head -1 | tee ci-diagnostics/03-gcc-version.txt

      - name: 04 - Load and VERIFY exact WORKING baseline config (SELF-CONTAINED)
        run: |
          set -euxo pipefail
          rm -rf baseline-out
          make O=baseline-out ARCH=arm64 "$DEFCONFIG"
          test -s baseline-out/.config
          sha256sum baseline-out/.config | tee ci-diagnostics/baseline-config.sha256
          test "$(sha256sum baseline-out/.config | awk '{print $1}')" = "$BASELINE_SHA256"
          cp baseline-out/.config ci-diagnostics/working-baseline.config
          cp baseline-out/.config .config
          echo "PASS: exact working baseline reproduced from $DEFCONFIG"

      - name: 05 - Integrate KernelSU-Next v3.3.0 SUSFS-compatible tree
        run: |
          set -euxo pipefail
          git clone --no-tags --filter=blob:none "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next fetch --no-tags origin "$KSU_REF"
          git -C KernelSU-Next checkout --detach "$KSU_REF"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_REF"
          bash KernelSU-Next/kernel/setup.sh "$KSU_REF"

          # Proven 4.19/Clang fixes from the last diagnostic run.
          grep -q '^#include <linux/init.h>' KernelSU-Next/kernel/sulog.h || \
            sed -i '1i#include <linux/init.h>' KernelSU-Next/kernel/sulog.h
          sed -i '/^[[:space:]]*#include <linux\/minmax\.h>[[:space:]]*$/d' KernelSU-Next/kernel/sucompat.c

          cat > ci-diagnostics/05-ksu.log <<EOF
          ksu_repo=$KSU_REPO
          ksu_ref=$KSU_REF
          ksu_tag=$KSU_TAG
          ksu_commit=$(git -C KernelSU-Next rev-parse HEAD)
          PASS: KernelSU-Next SUSFS-compatible repository detected.
          PASS: sulog.h directly includes linux/init.h for Clang 4.19 compatibility.
          PASS: removed unavailable linux/minmax.h from sucompat.c.
          PASS: no legacy KernelSU SUSFS patch will be applied.
          EOF

      - name: 06 - Download and VERIFY SUSFS kernel-4.19 exact commit
        run: |
          set -euxo pipefail
          git clone --no-tags --filter=blob:none "$SUSFS_REPO" susfs4ksu
          git -C susfs4ksu fetch --no-tags origin "$SUSFS_REF"
          git -C susfs4ksu checkout --detach "$SUSFS_REF"
          test "$(git -C susfs4ksu rev-parse HEAD)" = "$SUSFS_REF"
          printf 'susfs_branch=%s\nsusfs_commit=%s\nPASS: official SUSFS kernel-4.19 source verified.\n' \
            "$SUSFS_BRANCH" "$SUSFS_REF" > ci-diagnostics/06-susfs.log

      - name: 07 - Apply SUSFS kernel-4.19 patch with SOURCE-SPECIFIC 4.19 fixes
        run: |
          set -euo pipefail

          # SUSFS source files are intentionally untracked by the kernel git tree.
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/fs/sus_su.c fs/sus_su.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          cp -f susfs4ksu/kernel_patches/include/linux/sus_su.h include/linux/sus_su.h

          patch -p1 --forward < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          # ================================================================
          # CRITICAL FIX FOR THE CURRENT FAILURE
          # ================================================================
          # KSU-Next v3.3.0's file_wrapper.c contains the newer
          # remap_file_range()/REMAP_FILE_DEDUP API. Linux 4.19 does NOT
          # have that file_operations member; 4.19 uses clone_file_range()
          # and dedupe_file_range(). The wrapper must therefore omit the
          # remap implementation completely on this 4.19 tree.
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          p = Path('KernelSU-Next/kernel/infra/file_wrapper.c')
          s = p.read_text()
          
          block = re.compile(
              r'(?ms)^// no REMAP_FILE_DEDUP:.*?^static int ksu_wrapper_fadvise\('
          )
          s, removed = block.subn('static int ksu_wrapper_fadvise(', s)
          if removed != 1:
              raise SystemExit(f'ERROR: expected 1 REMAP wrapper block, removed={removed}')
          
          assignment = re.compile(
              r'^\s*p->ops\.remap_file_range\s*=\s*'
              r'fp->f_op->remap_file_range\s*\?\s*'
              r'ksu_wrapper_remap_file_range\s*:\s*NULL;\n',
              re.M,
          )
          s, removed = assignment.subn('', s)
          if removed != 1:
              raise SystemExit(f'ERROR: expected 1 REMAP assignment, removed={removed}')
          
          p.write_text(s)
          PY

          # This MUST be zero. Do not weaken this test.
          if grep -nE 'REMAP_FILE_DEDUP|remap_file_range' KernelSU-Next/kernel/infra/file_wrapper.c; then
            echo 'ERROR: active 4.19-incompatible remap_file_range API remains'
            exit 1
          fi

          echo 'PASS: 4.19 file_wrapper remap API removed.' | tee ci-diagnostics/07-patches.log
          echo 'PASS: no active REMAP_FILE_DEDUP/file_wrapper remap references.' | tee -a ci-diagnostics/07-patches.log
          git diff --stat | tee -a ci-diagnostics/07-patches.log

      - name: 07B - Verify KernelSU-Next + SUSFS integration identity
        run: |
          set -euxo pipefail
          test -L drivers/kernelsu
          test -f fs/susfs.c
          test -f fs/sus_su.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h
          grep -q 'CONFIG_KSU_SUSFS' fs/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          grep -q 'obj-$(CONFIG_KSU)' drivers/Makefile
          ! grep -nE 'REMAP_FILE_DEDUP|remap_file_range' KernelSU-Next/kernel/infra/file_wrapper.c

      - name: 08 - Add required manual KernelSU-Next hooks WITHOUT enabling KPROBES
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          
          def add_hook(path, marker, declaration, body, symbol):
              p = Path(path)
              s = p.read_text()
              if symbol in s:
                  return
              i = s.find(marker)
              if i < 0:
                  raise SystemExit(f'marker not found: {path}: {marker}')
              s = s[:i] + declaration + s[i:]
              brace = s.find('{', i + len(declaration))
              if brace < 0:
                  raise SystemExit(f'function body not found: {path}')
              s = s[:brace + 1] + body + s[brace + 1:]
              p.write_text(s)
          
          add_hook(
              'fs/exec.c',
              'static int do_execveat_common(',
              '''#ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;
          extern int ksu_handle_execveat(int *, struct filename **, void *, void *, int *);
          extern int ksu_handle_execveat_sucompat(int *, struct filename **, void *, void *, int *);
          #endif
          
          ''',
              '''
          #ifdef CONFIG_KSU
          \tif (unlikely(ksu_execveat_hook))
          \t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          \telse
          \t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          #endif
          ''',
              'ksu_execveat_hook')
          
          add_hook(
              'fs/open.c',
              'SYSCALL_DEFINE3(faccessat,',
              '''#ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *, const char __user **, int *, int *);
          #endif
          
          ''',
              '''
          #ifdef CONFIG_KSU
          \tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          ''',
              'ksu_handle_faccessat')
          
          add_hook(
              'fs/read_write.c',
              'ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)',
              '''#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern int ksu_handle_vfs_read(struct file **, char __user **, size_t *, loff_t **);
          #endif
          
          ''',
              '''
          #ifdef CONFIG_KSU
          \tif (unlikely(ksu_vfs_read_hook))
          \t\tksu_handle_vfs_read(&file, &buf, &count, &pos);
          #endif
          ''',
              'ksu_vfs_read_hook')
          
          add_hook(
              'fs/stat.c',
              'int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,\n\t\tint flag)',
              '''#ifdef CONFIG_KSU
          extern int ksu_handle_stat(int *, const char __user **, int *);
          #endif
          ''',
              '''
          #ifdef CONFIG_KSU
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif
          ''',
              'ksu_handle_stat')
          
          add_hook(
              'drivers/input/input.c',
              'static void input_handle_event(struct input_dev *dev,',
              '''#ifdef CONFIG_KSU
          extern bool ksu_input_hook __read_mostly;
          extern int ksu_handle_input_handle_event(unsigned int *, unsigned int *, int *);
          #endif
          ''',
              '''
          #ifdef CONFIG_KSU
          \tif (unlikely(ksu_input_hook))
          \t\tksu_handle_input_handle_event(&type, &code, &value);
          #endif
          ''',
              'ksu_input_hook')
          PY

          if grep -q '^CONFIG_KPROBES=y' .config; then
            echo 'ERROR: CONFIG_KPROBES=y is forbidden for this non-GKI workflow'
            exit 1
          fi
          echo 'PASS: manual KSU hooks present; KPROBES remains disabled.'

      - name: 09 - Configure ONLY KSU/SUSFS; preserve WORKING config
        run: |
          set -euxo pipefail
          scripts/config --enable KSU
          scripts/config --enable KSU_SUSFS
          scripts/config --disable KPROBES
          scripts/config --disable KSU_SUSFS_SUS_PATH
          scripts/config --disable KSU_SUSFS_SUS_MOUNT
          scripts/config --disable KSU_DEBUG
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_|CONFIG_KPROBES=)' .config | sort
          diff -u ci-diagnostics/working-baseline.config .config > ci-diagnostics/config-only-diff.patch || true

      - name: 10 - Verify source scope (only KSU/SUSFS integration)
        run: |
          set -euxo pipefail
          git diff --name-only > ci-diagnostics/git-diff-files.txt
          git diff --stat > ci-diagnostics/git-diff-stat.txt
          git status --short > ci-diagnostics/git-status.txt
          echo 'PASS: tracked diff and untracked KSU/SUSFS files captured.'

      - name: 11 - Build RAW WORKING kernel Image (DO NOT replace stock DTB/DTBO)
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export CC="$CLANG_BIN/clang"
          export LD="$CLANG_BIN/ld.lld"
          export AR="$CLANG_BIN/llvm-ar"
          export NM="$CLANG_BIN/llvm-nm"
          export OBJCOPY="$CLANG_BIN/llvm-objcopy"
          export OBJDUMP="$CLANG_BIN/llvm-objdump"
          export STRIP="$CLANG_BIN/llvm-strip"
          export PATH="$CLANG_BIN:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"

          rm -rf out
          mkdir -p out
          cp ci-diagnostics/working-baseline.config out/.config
          scripts/config --file out/.config --enable KSU
          scripts/config --file out/.config --enable KSU_SUSFS
          scripts/config --file out/.config --disable KPROBES
          scripts/config --file out/.config --disable KSU_SUSFS_SUS_PATH
          scripts/config --file out/.config --disable KSU_SUSFS_SUS_MOUNT
          scripts/config --file out/.config --disable KSU_DEBUG

          make O=out ARCH=arm64 olddefconfig
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_BIN/clang" LD="$CLANG_BIN/ld.lld" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-" \
            Image.gz-dtb 2>&1 | tee ci-diagnostics/build.log

          test -s out/arch/arm64/boot/Image.gz-dtb
          cp out/.config ci-diagnostics/final-or-last.config
          sha256sum out/arch/arm64/boot/Image.gz-dtb | tee ci-diagnostics/kernel-image.sha256

      - name: 12 - Final safety checks
        if: ${{ success() }}
        run: |
          set -euxo pipefail
          test -s out/arch/arm64/boot/Image.gz-dtb
          ! grep -nE 'REMAP_FILE_DEDUP|remap_file_range' KernelSU-Next/kernel/infra/file_wrapper.c
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^# CONFIG_KPROBES is not set$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_PATH is not set$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_MOUNT is not set$' out/.config
          echo 'FINAL SAFETY CHECKS: PASS'

      - name: 12B - Prepare OrangeFox optional kernel payload
        if: ${{ success() }}
        run: |
          set -euxo pipefail
          mkdir -p orangefox-optional
          cp out/arch/arm64/boot/Image.gz-dtb orangefox-optional/Image.gz-dtb
          printf '%s\n' 'RAW kernel payload only. Stock DTB/DTBO is intentionally untouched.' > orangefox-optional/README.txt
          (cd orangefox-optional && zip -9 -r ../OrangeFox-optional-kernel-payload.zip .)

      - name: 13 - Package diagnostics (ALWAYS)
        if: ${{ always() }}
        run: |
          set +e
          mkdir -p ci-diagnostics
          git diff > ci-diagnostics/kernel-source.patch || true
          git diff --stat > ci-diagnostics/git-diff-stat.txt || true
          git diff --name-only > ci-diagnostics/git-diff-files.txt || true
          git status --short > ci-diagnostics/git-status.txt || true
          printf 'source_branch=sixteen\nsource_commit=%s\ndefconfig=%s\nbaseline_config_sha256=%s\nclang_revision=%s\ngcc64_branch=%s\ngcc32_branch=%s\nksu=%s\nsusfs=%s\nSUS_PATH=disabled_for_LG_user_struct_compatibility\nKPROBES=disabled\nSUS_MOUNT=disabled_for_non_GKI_stability\n' \
            "$SOURCE_COMMIT" "$DEFCONFIG" "$BASELINE_SHA256" "$CLANG_REVISION" "$GCC_BRANCH" "$GCC_BRANCH" "$KSU_TAG" "$SUSFS_BRANCH" > ci-diagnostics/build-metadata.txt
          echo "artifact-ready=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-diagnostics/ARTIFACT-READY.txt
          tar -czf LG-Velvet-diagnostics.tar.gz ci-diagnostics || true

      - name: 14 - Upload RAW kernel Image + OrangeFox payload (only on success)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSU-SUSFS-RAW-${{ github.run_number }}
          if-no-files-found: error
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
            out/System.map
            OrangeFox-optional-kernel-payload.zip

      - name: 15 - Upload COMPLETE diagnostics (ALWAYS)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSU-SUSFS-NonGKI-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            ci-diagnostics/
            LG-Velvet-diagnostics.tar.gz
            /tmp/clang.tar.gz

      - name: 16 - Print artifact location
        if: ${{ always() }}
        run: |
          echo "RAW: LG-Velvet-KSU-SUSFS-RAW-${{ github.run_number }}"
          echo "DIAGNOSTICS: LG-Velvet-KSU-SUSFS-NonGKI-diagnostics-${{ github.run_number }}"

      - name: Complete job
        if: ${{ always() }}
        run: |
          if [ -s out/arch/arm64/boot/Image.gz-dtb ]; then
            echo 'BUILD RESULT: SUCCESS'
          else
            echo 'BUILD RESULT: FAILED — diagnostics artifact was uploaded.'
            exit 1
          fi
