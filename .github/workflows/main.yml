      - name: 05 - Integrate KernelSU-Next v3.3.0 (pershoot dev-susfs pinned commit)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/05-ksu.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          echo "=== Fetching KernelSU-Next pershoot dev-susfs pinned commit ==="
          rm -rf KernelSU-Next drivers/kernelsu

          # Clone pershoot/KernelSU-Next branch dev-susfs and detach at the exact commit.
          git clone --no-checkout "$KSU_REPO" KernelSU-Next
          cd KernelSU-Next
          git fetch --depth=1 origin "$KSU_REF"
          git checkout --detach "$KSU_REF"
          test "$(git rev-parse HEAD)" = "$KSU_REF"
          KSU_ACTUAL_VERSION=$(git describe --tags --always || echo "$KSU_VERSION")
          echo "KSU pinned commit: $(git rev-parse HEAD) ($KSU_ACTUAL_VERSION)"
          cd "$GITHUB_WORKSPACE/kernel"

          # Create symlink drivers/kernelsu -> KernelSU-Next/kernel.
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu

          # Wire KSU into drivers/Kconfig and drivers/Makefile if not already present.
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i \
source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          if ! grep -q "CONFIG_KSU" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          # Record KSU version diagnostic.
          echo "$KSU_ACTUAL_VERSION (commit $KSU_REF)" > "$DIAG_DIR/ksu-version.txt"
          echo "KernelSU-Next integrated successfully."

      - name: 06 - Apply SUSFS 4.19 patches + copy kernel-side SUSFS files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/06-susfs.log") 2>&1

          cd "$GITHUB_WORKSPACE"
          rm -rf susfs4ksu
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cd susfs4ksu
          git checkout "$SUSFS_REF"
          echo "SUSFS pinned commit: $(git rev-parse HEAD)"
          echo "$(git rev-parse HEAD)" > "$DIAG_DIR/susfs-version.txt"

          cd "$GITHUB_WORKSPACE/kernel"

          # 1. Copy SUSFS kernel-side C header and source files into place.
          SUSFS_PATCH_DIR="$GITHUB_WORKSPACE/susfs4ksu/$SUSFS_VERSION"
          cp "$SUSFS_PATCH_DIR/include/linux/susfs.h" include/linux/
          cp "$SUSFS_PATCH_DIR/include/linux/susfs_def.h" include/linux/
          cp "$SUSFS_PATCH_DIR/fs/susfs.c" fs/

          # 2. Apply SUSFS kernel patches in strict order.
          patch -p1 < "$SUSFS_PATCH_DIR/50_add_susfs_in_kernel-4.19.patch"

          # Apply fs/file_wrapper.c patch if provided in the SUSFS patch directory.
          if [ -f "$SUSFS_PATCH_DIR/fs_file_wrapper.c.patch" ]; then
            patch -p1 < "$SUSFS_PATCH_DIR/fs_file_wrapper.c.patch"
          elif [ -f "$SUSFS_PATCH_DIR/51_add_file_wrapper_in_kernel-4.19.patch" ]; then
            patch -p1 < "$SUSFS_PATCH_DIR/51_add_file_wrapper_in_kernel-4.19.patch"
          else
            echo "NOTICE: No separate file_wrapper patch found in SUSFS patch directory; 50_add_susfs_in_kernel-4.19.patch is primary."
          fi

          # 3. Apply KernelSU-Next dev-susfs ksu_susfs patch to KernelSU-Next.
          cd "$GITHUB_WORKSPACE/kernel/KernelSU-Next"
          patch -p1 < "$SUSFS_PATCH_DIR/KernelSU/10_enable_susfs_for_ksu.patch" || {
            echo "Standard KSU patch failed, trying alternate or verifying dev-susfs built-in support..."
            # dev-susfs branch has native SUSFS hooks embedded. If patch fails because code is present, verify susfs.h inclusion.
            grep -q "susfs.h" kernel/ksu.c || grep -q "susfs" kernel/Makefile
          }

          cd "$GITHUB_WORKSPACE/kernel"
          echo "=== SUSFS Patches Applied ==="
          git status --short > "$DIAG_DIR/07-patches.log"

      - name: 07 - Strict Diagnostic Audit of KernelSU + SUSFS Hooks
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/08-hooks.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          echo "=== STRICT HOOK AUDIT ==="

          # Check 1: ksu_handle_faccessat in fs/open.c
          grep -n "ksu_handle_faccessat" fs/open.c || { echo "FAIL: ksu_handle_faccessat missing from fs/open.c"; exit 1; }

          # Check 2: ksu_handle_stat in fs/stat.c
          grep -n "ksu_handle_stat" fs/stat.c || { echo "FAIL: ksu_handle_stat missing from fs/stat.c"; exit 1; }

          # Check 3: susfs_sus_mount in fs/namespace.c
          grep -n "susfs" fs/namespace.c || { echo "FAIL: susfs hooks missing from fs/namespace.c"; exit 1; }

          # Check 4: KSU/SUSFS hooks in fs/read_write.c
          grep -n "ksu_handle_vfs_read" fs/read_write.c || { echo "FAIL: ksu_handle_vfs_read missing from fs/read_write.c"; exit 1; }

          # Check 5: KSU/SUSFS hooks in fs/stat.c
          grep -n "susfs" fs/stat.c || { echo "FAIL: susfs hooks missing from fs/stat.c"; exit 1; }

          echo "AUDIT PASSED: All required KernelSU and SUSFS hooks are present."

      - name: 08 - Configure .config for Non-GKI KSU-Next + SUSFS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/09-kconfig.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          # Always start from the exact verified baseline .config.
          cp "$RUNNER_TEMP/working-baseline.config" .config

          # Enable KSU and SUSFS explicitly.
          # We DO NOT enable CONFIG_KPROBES because this non-GKI LG Velvet build
          # relies on manual hooks and dev-susfs's "KPROBES || SUSFS" Kconfig patch.
          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KSU_SUSFS
          scripts/config --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          scripts/config --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          scripts/config --enable CONFIG_KSU_SUSFS_ENABLE_LOG

          # Ensure CONFIG_KPROBES remains DISABLED to match the working baseline.
          scripts/config --disable CONFIG_KPROBES
          scripts/config --disable CONFIG_HAVE_KPROBES

          # Regenerate final .config via olddefconfig.
          make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- REAL_CC=clang olddefconfig

          # Save final config diagnostics.
          cp .config "$DIAG_DIR/final.config"

          echo "=== CONFIG VERIFICATION ==="
          grep "CONFIG_KSU" .config
          grep "CONFIG_KSU_SUSFS" .config
          grep "CONFIG_KPROBES" .config || echo "CONFIG_KPROBES is disabled (EXPECTED)."

      - name: 09 - Build Kernel Image (Image.lz4-dtb)
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/11-build.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"

          # Clean output directory before build.
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          echo "=== STARTING KERNEL BUILD ==="
          make -j$(nproc --all) \
            ARCH=arm64 \
            O="$OUT_DIR" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            REAL_CC=clang \
            Image.lz4-dtb

          # Verify expected output image artifact was built.
          test -f "$OUT_DIR/arch/arm64/boot/Image.lz4-dtb"
          echo "BUILD SUCCESSFUL: Image.lz4-dtb created."

      - name: 10 - Package Artifacts and Diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          mkdir -p release
          cp "$OUT_DIR/arch/arm64/boot/Image.lz4-dtb" release/Image.lz4-dtb

          # Generate SHA256 sum for release build artifact.
          cd release
          sha256sum Image.lz4-dtb > Image.lz4-dtb.sha256
          cd "$GITHUB_WORKSPACE"

          # Package full diagnostic bundle for verification.
          cp -r "$DIAG_DIR" release/ci-diagnostics
          cd release
          tar -czf LG-Velvet-diagnostics.tar.gz ci-diagnostics/

      - name: 11 - Upload Built Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-SM7250-KernelSU-SUSFS-Image
          path: release/Image.lz4-dtb
          if-no-files-found: error

      - name: 12 - Upload Diagnostics Bundle
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-Build-Diagnostics
          path: |
            release/Image.lz4-dtb.sha256
            release/LG-Velvet-diagnostics.tar.gz
          if-no-files-found: error
