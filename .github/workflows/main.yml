          echo "baseline_sha256=$actual_hash"
          echo "adapted_baseline_sha256=$(sha256sum "$OUT_DIR/.config" | awk '{print $1}')"

      - name: 05 - Fetch and apply official CIP135 delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/05-cip.log") 2>&1
          cd "$GITHUB_WORKSPACE"

          rm -rf cip-kernel
          git init cip-kernel
          git -C cip-kernel remote add origin "$CIP_REPO"
          git -C cip-kernel fetch --no-tags --depth=1 origin \
            "refs/tags/$CIP_BASE_TAG:refs/tags/$CIP_BASE_TAG" \
            "refs/tags/$CIP_TARGET_TAG:refs/tags/$CIP_TARGET_TAG"

          git -C cip-kernel cat-file -e "$CIP_BASE_TAG^{commit}"
          git -C cip-kernel cat-file -e "$CIP_TARGET_TAG^{commit}"

          git -C cip-kernel rev-parse "$CIP_BASE_TAG^{commit}" | tee "$DIAG_DIR/cip-base-commit.txt"
          git -C cip-kernel rev-parse "$CIP_TARGET_TAG^{commit}" | tee "$DIAG_DIR/cip-target-commit.txt"

          git -C cip-kernel diff --binary --full-index \
            "$CIP_BASE_TAG" "$CIP_TARGET_TAG" \
            > "$RUNNER_TEMP/cip135.delta.patch"

          test -s "$RUNNER_TEMP/cip135.delta.patch"
          cp "$RUNNER_TEMP/cip135.delta.patch" "$DIAG_DIR/cip135.delta.patch"

          cd "$GITHUB_WORKSPACE/kernel"
          git apply --3way --whitespace=fix "$RUNNER_TEMP/cip135.delta.patch"

          if git ls-files -u | grep -q .; then
            echo "::error::CIP135 produced unresolved merge conflicts."
            git status --short
            git diff --cc
            exit 1
          fi

          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 19$' Makefile
          grep -q '^SUBLEVEL = 325$' Makefile

          CIP_RELEASE="$(make -s O="$OUT_DIR" kernelrelease)"
          echo "kernelrelease=$CIP_RELEASE" | tee "$DIAG_DIR/cip-release.txt"
          echo "$CIP_RELEASE" | grep -q '4\.19\.325-cip135'

          git diff --name-only > "$DIAG_DIR/cip-modified-files.txt"
          git diff --stat > "$DIAG_DIR/cip-diff-stat.txt"

          make O="$OUT_DIR" ARCH="$ARCH" \
            CC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            AS="$CLANG_DIR/bin/llvm-as" \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          cp "$OUT_DIR/.config" "$DIAG_DIR/cip-post-olddefconfig.config"
          sha256sum "$DIAG_DIR/cip-post-olddefconfig.config"             | tee "$DIAG_DIR/cip-post-olddefconfig-config.sha256"

          test -f "$DIAG_DIR/baseline.config"
          test -f "$DIAG_DIR/working-original.config"

      - name: 06 - Integrate SukiSU-Ultra through official setup.sh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/06-sukisu.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          curl --fail --location --silent --show-error \
            "$SUKISU_SETUP_URL" \
            -o "$RUNNER_TEMP/sukisu-setup.sh"

          chmod +x "$RUNNER_TEMP/sukisu-setup.sh"
          "$RUNNER_TEMP/sukisu-setup.sh" "$SUKISU_REF"

          test -d KernelSU/kernel
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile
          test -f KernelSU/kernel/Kbuild
          test -e drivers/kernelsu/Kconfig
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          grep -q 'obj-$(CONFIG_KSU)' drivers/Makefile

          SUKISU_COMMIT="$(git -C KernelSU rev-parse HEAD)"
          SUKISU_TAG="$(git -C KernelSU describe --tags --exact-match 2>/dev/null || true)"

          echo "sukisu_ref=$SUKISU_REF" | tee "$DIAG_DIR/sukisu-version.txt"
          echo "sukisu_commit=$SUKISU_COMMIT" | tee -a "$DIAG_DIR/sukisu-version.txt"
          echo "sukisu_tag=$SUKISU_TAG" | tee -a "$DIAG_DIR/sukisu-version.txt"

          case "$SUKISU_COMMIT" in
            "$SUKISU_EXPECTED_COMMIT"*) ;;
            *) echo "::error::SukiSU commit does not match the verified commit prefix."; exit 1 ;;
          esac
          test "$SUKISU_TAG" = "$SUKISU_EXPECTED_TAG"
          git diff --name-only > "$DIAG_DIR/sukisu-modified-files.txt"

      - name: 07 - Fetch and verify SUSFS kernel-4.19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/07-susfs.log") 2>&1
          cd "$GITHUB_WORKSPACE"

          rm -rf susfs4ksu
          git clone --depth=1 --branch "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu

          SUSFS_COMMIT="$(git -C susfs4ksu rev-parse HEAD)"
          echo "susfs_branch=$SUSFS_BRANCH" | tee "$DIAG_DIR/susfs-version.txt"
          echo "susfs_commit=$SUSFS_COMMIT" | tee -a "$DIAG_DIR/susfs-version.txt"

          case "$SUSFS_COMMIT" in
            "$SUSFS_EXPECTED_COMMIT"*) ;;
            *) echo "::error::SUSFS commit does not match the verified commit prefix."; exit 1 ;;
          esac

          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          test -f susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          test -f susfs4ksu/kernel_patches/KernelSU/kernel/sucompat.h
          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/fs/sus_su.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f susfs4ksu/kernel_patches/include/linux/sus_su.h

          grep -Rqs "$SUSFS_EXPECTED_VERSION" susfs4ksu/kernel_patches \
            || grep -Rqs "1\.5\.5" susfs4ksu/kernel_patches

      - name: 08 - Apply official SUSFS 1.5.5 kernel-4.19 patchset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/08-susfs-patches.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" \
            fs/susfs.c
          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c" \
            fs/sus_su.c
          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h" \
            include/linux/susfs.h
          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/sus_su.h" \
            include/linux/sus_su.h
          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/kernel/sucompat.h" \
            KernelSU/kernel/sucompat.h

          cd KernelSU
          git apply --3way --whitespace=fix \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          cd "$GITHUB_WORKSPACE/kernel"
          git apply --3way --whitespace=fix \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"

          if git ls-files -u | grep -q .; then
            echo "::error::SUSFS produced unresolved merge conflicts."
            git status --short
            git diff --cc
            exit 1
          fi

          if find . -type f -name '*.rej' -print -quit | grep -q .; then
            echo "::error::SUSFS generated patch rejects."
            find . -type f -name '*.rej' -print
            exit 1
          fi

          find . -type f -name '*.orig' -delete
          git diff --check

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU fs include
          grep -Rqs 'SUSFS' fs/susfs.c include/linux/susfs.h KernelSU/kernel
          git diff --name-only > "$DIAG_DIR/susfs-modified-files.txt"

      - name: 09 - Configure exact LIGHT feature scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/09-kconfig.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          test -f scripts/config
          grep -Rqs '^config KSU$' KernelSU/kernel
          grep -Rqs '^config KPM$' KernelSU/kernel
          grep -Rqs '^config KPROBES$' Kconfig arch kernel
          grep -Rqs '^config KPROBE_EVENTS$' Kconfig arch kernel
          grep -Rqs '^config KALLSYMS$' Kconfig kernel
          grep -Rqs '^config KALLSYMS_ALL$' Kconfig kernel
          grep -Rqs '^config EXT4_FS$' fs

          scripts/config --file "$OUT_DIR/.config" \
            --enable CONFIG_KSU \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_KPM \
            --enable CONFIG_EXT4_FS \
            --enable CONFIG_KSU_SUSFS \
            --disable CONFIG_KSU_TRACEPOINT_HOOK

          if grep -Rqs '^config KSU_MANUAL_HOOK$' KernelSU/kernel; then
            scripts/config --file "$OUT_DIR/.config" --disable CONFIG_KSU_MANUAL_HOOK
          fi

          export CC="$CLANG_DIR/bin/clang"
          export LD="$CLANG_DIR/bin/ld.lld"
          export AS="$CLANG_DIR/bin/llvm-as"
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$CLANG_DIR/lib:${LD_LIBRARY_PATH:-}"

          make O="$OUT_DIR" ARCH="$ARCH" \
            CC="$CC" LD="$LD" AS="$AS" LLVM=1 LLVM_IAS=1 \
            olddefconfig

          cp "$OUT_DIR/.config" "$DIAG_DIR/final.config"

          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KPROBES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_HAVE_KPROBES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KPROBE_EVENTS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KALLSYMS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KALLSYMS_ALL=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KPM=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_EXT4_FS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' "$OUT_DIR/.config"; then
            echo "::error::Tracepoint hook is enabled."
            exit 1
          fi

          if grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$OUT_DIR/.config"; then
            echo "::error::Manual hook was enabled unexpectedly."
            exit 1
          fi

          normalize_config() {
            awk '
              /^CONFIG_[A-Za-z0-9_]+=/ { print; next }
              /^# CONFIG_[A-Za-z0-9_]+ is not set$/ { print substr($0, 3); next }
            ' "$1" | sort
          }

          normalize_preserved_config() {
            normalize_config "$1" \
              | grep -Ev \
                '^(CONFIG_KSU(_|=)|CONFIG_KPROBES=|CONFIG_HAVE_KPROBES=|CONFIG_KPROBE_EVENTS=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|CONFIG_KPM=)'
          }

          normalize_preserved_config "$DIAG_DIR/working-original.config" \
            > "$DIAG_DIR/original-feature-baseline.full"
          normalize_preserved_config "$OUT_DIR/.config" \
            > "$DIAG_DIR/original-feature-final.full"

          if ! diff -u "$DIAG_DIR/original-feature-baseline.full" \
              "$DIAG_DIR/original-feature-final.full" \
              > "$DIAG_DIR/original-feature-preservation.diff"; then
            echo "::error::An original LG/Qualcomm CONFIG symbol or value changed."
            cat "$DIAG_DIR/original-feature-preservation.diff"
            exit 1
          fi

          comm -23 \
            "$DIAG_DIR/original-feature-baseline.full" \
            "$DIAG_DIR/original-feature-final.full" \
            > "$DIAG_DIR/original-feature-removed.txt"

          comm -13 \
            "$DIAG_DIR/original-feature-baseline.full" \
            "$DIAG_DIR/original-feature-final.full" \
            > "$DIAG_DIR/original-feature-added.txt"

          echo "Original feature audit: zero unexpected removals and zero unexpected additions."

          {
            echo "=== ORIGINAL FEATURE PRESERVATION AUDIT ==="
            echo "source_branch=$SOURCE_BRANCH"
            echo "working_original_config_sha256=$actual_hash"
            echo "preserved_config_lines=$(wc -l < "$DIAG_DIR/original-feature-baseline.full")"
            echo "unexpected_removed=$(wc -l < "$DIAG_DIR/original-feature-removed.txt")"
            echo "unexpected_added=$(wc -l < "$DIAG_DIR/original-feature-added.txt")"
            echo
            echo "--- Allowed integration configuration families ---"
            echo "CONFIG_KSU*"
            echo "CONFIG_KPROBES"
            echo "CONFIG_HAVE_KPROBES"
            echo "CONFIG_KPROBE_EVENTS"
            echo "CONFIG_KALLSYMS"
            echo "CONFIG_KALLSYMS_ALL"
            echo "CONFIG_KPM"
            echo
            echo "--- Removed original feature config ---"
            cat "$DIAG_DIR/original-feature-removed.txt"
            echo
            echo "--- Added non-integration feature config ---"
            cat "$DIAG_DIR/original-feature-added.txt"
          } | tee "$DIAG_DIR/original-feature-audit.txt"

          echo "PASS: original LG/Qualcomm feature configuration is preserved."
          echo "PASS: only SukiSU/SUSFS/KPM/KPROBE/KALLSYMS integration config is allowed to differ."


      - name: 10 - Verify source scope and feature markers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/10-scope.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          git status --short > "$DIAG_DIR/git-status.txt"
          git diff --stat > "$DIAG_DIR/git-diff-stat.txt"
          git diff --name-only > "$DIAG_DIR/git-diff-files.txt"

          cat \
            "$DIAG_DIR/cip-modified-files.txt" \
            "$DIAG_DIR/sukisu-modified-files.txt" \
            "$DIAG_DIR/susfs-modified-files.txt" \
            | sed '/^$/d' | sort -u > "$DIAG_DIR/allowed-feature-files.txt"

          git diff --name-only | sort -u > "$DIAG_DIR/actual-modified-files.txt"

          git ls-files --others --exclude-standard \
            | sort -u > "$DIAG_DIR/untracked-files.txt"

          cat "$DIAG_DIR/actual-modified-files.txt" \
            "$DIAG_DIR/untracked-files.txt" \
            | sed '/^$/d' | sort -u > "$DIAG_DIR/all-source-changes.txt"

          unexpected_tracked="$(comm -23 \
            "$DIAG_DIR/actual-modified-files.txt" \
            "$DIAG_DIR/allowed-feature-files.txt" || true)"

          unexpected_untracked="$(
            comm -23 \
              "$DIAG_DIR/untracked-files.txt" \
              <(
                {
                  printf '%s\n' \
                    "fs/susfs.c" \
                    "fs/sus_su.c" \
                    "include/linux/susfs.h" \
                    "include/linux/sus_su.h" \
                    "KernelSU/kernel/sucompat.h"
                  find KernelSU -type f -print 2>/dev/null || true
                } | sort -u
              ) || true
          )"

          if [ -n "$unexpected_tracked" ]; then
            echo "::error::Unexpected tracked source files changed outside CIP135/SukiSU/SUSFS."
            printf '%s\n' "$unexpected_tracked"
            exit 1
          fi

          if [ -n "$unexpected_untracked" ]; then
            echo "::error::Unexpected untracked source files were created."
            printf '%s\n' "$unexpected_untracked"
            exit 1
          fi

          {
            echo "=== SOURCE CHANGE AUDIT ==="
            echo "--- tracked changes ---"
            cat "$DIAG_DIR/actual-modified-files.txt"
            echo "--- untracked changes ---"
            cat "$DIAG_DIR/untracked-files.txt"
          } | tee "$DIAG_DIR/source-change-audit.txt"

          test -d KernelSU/kernel
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f KernelSU/kernel/kpm/Kbuild

          grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU/kernel fs include
          grep -Rqs 'KPM' KernelSU/kernel/kpm
          grep -Rqs 'SukiSU\|SukiSU-Ultra' KernelSU README.md KernelSU/kernel || true

          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KPM=y$' "$OUT_DIR/.config"

          test "$(make -s O="$OUT_DIR" kernelversion)" = "4.19.325"
          make -s O="$OUT_DIR" kernelrelease | tee "$DIAG_DIR/kernel-release.txt" \
            | grep -q '4\.19\.325-cip135'

          echo "=== ORIGINAL FEATURE AUDIT ==="
          cat "$DIAG_DIR/original-feature-audit.txt"

          echo "=== MODIFIED FILES ==="
          git status --short

      - name: 11 - Build kernel Image.gz only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/11-build.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export CC="$CLANG_DIR/bin/clang"
          export LD="$CLANG_DIR/bin/ld.lld"
          export AS="$CLANG_DIR/bin/llvm-as"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export LD_LIBRARY_PATH="$CLANG_DIR/lib:${LD_LIBRARY_PATH:-}"

          make O="$OUT_DIR" ARCH=arm64 \
            CC="$CC" LD="$LD" AS="$AS" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            Image modules

          test -s "$OUT_DIR/arch/arm64/boot/Image"
          file "$OUT_DIR/arch/arm64/boot/Image" | tee "$DIAG_DIR/image-file.txt"

          gzip -n -9 -c "$OUT_DIR/arch/arm64/boot/Image" > "$GITHUB_WORKSPACE/Image.gz"
          gzip -t "$GITHUB_WORKSPACE/Image.gz"
          zcat "$GITHUB_WORKSPACE/Image.gz" > "$RUNNER_TEMP/Image.uncompressed"
          test -s "$RUNNER_TEMP/Image.uncompressed"

          sha256sum "$GITHUB_WORKSPACE/Image.gz" | tee "$DIAG_DIR/Image.gz.sha256"
          ls -lh "$GITHUB_WORKSPACE/Image.gz" | tee "$DIAG_DIR/Image.gz.ls.txt"

      - name: 12 - Final safety and identity checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/12-safety.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          test -s "$GITHUB_WORKSPACE/Image.gz"
          test -f "$OUT_DIR/.config"
          test -f "$DIAG_DIR/original-feature-preservation.diff"
          test ! -s "$DIAG_DIR/original-feature-preservation.diff"
          test ! -s "$DIAG_DIR/original-feature-removed.txt"
          test ! -s "$DIAG_DIR/original-feature-added.txt"

          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KPROBES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KPROBE_EVENTS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KALLSYMS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KALLSYMS_ALL=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KPM=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_EXT4_FS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' "$OUT_DIR/.config"; then
            echo "::error::Tracepoint hook is enabled."
            exit 1
          fi

          if grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$OUT_DIR/.config"; then
            echo "::error::Manual hook was enabled unexpectedly."
            exit 1
          fi

          test "$(make -s O="$OUT_DIR" kernelversion)" = "4.19.325"
          make -s O="$OUT_DIR" kernelrelease | tee "$DIAG_DIR/final-kernel-release.txt" \
            | grep -q '4\.19\.325-cip135'

          grep -q '^CONFIG_MACH_LITO_CAYMANLM=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$'

          test ! -e "$GITHUB_WORKSPACE/Image"
          test ! -e "$GITHUB_WORKSPACE/dtb"
          test ! -e "$GITHUB_WORKSPACE/dtbo.img"

          {
            echo "=== FINAL BUILD REPORT ==="
            echo "source_repo=$KERNEL_REPO"
            echo "source_branch=$SOURCE_BRANCH"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "defconfig=$DEFCONFIG"
            echo "original_kernel_config_sha256=$ORIGINAL_KERNEL_CONFIG_SHA256"
            echo "sukisu_ref=$SUKISU_REF"
            echo "sukisu_expected_tag=$SUKISU_EXPECTED_TAG"
            echo "sukisu_expected_commit=$SUKISU_EXPECTED_COMMIT"
            echo "susfs_branch=$SUSFS_BRANCH"
            echo "susfs_expected_commit=$SUSFS_EXPECTED_COMMIT"
            echo "susfs_expected_version=$SUSFS_EXPECTED_VERSION"
            echo "cip_base=$CIP_BASE_TAG"
            echo "cip_target=$CIP_TARGET_TAG"
            echo "artifact=Image.gz"
            echo "original_features=preserved_by_exact_config_audit"
            echo "dtb_dtbo=not packaged"
            echo
            echo "=== REQUIRED CONFIG ==="
            grep -E '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|KALLSYMS|KALLSYMS_ALL|KPM|EXT4_FS)=' \
              "$OUT_DIR/.config" | sort
            echo
            echo "=== SUSFS CONFIG ==="
            grep -E '^CONFIG_KSU_SUSFS' "$OUT_DIR/.config" | sort
            echo
            echo "=== IMAGE ==="
            ls -lh "$GITHUB_WORKSPACE/Image.gz"
            sha256sum "$GITHUB_WORKSPACE/Image.gz"
          } | tee "$DIAG_DIR/final-report.txt"

      - name: 13 - Package diagnostics (ALWAYS)
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$DIAG_DIR"

          {
            echo "=== WORKFLOW DIAGNOSTIC CONTEXT ==="
            date -u +%FT%TZ
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "event=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "source_branch=$SOURCE_BRANCH"
            echo "defconfig=$DEFCONFIG"
            echo "sukisu_ref=$SUKISU_REF"
            echo "sukisu_expected_tag=$SUKISU_EXPECTED_TAG"
            echo "sukisu_expected_commit=$SUKISU_EXPECTED_COMMIT"
            echo "susfs_branch=$SUSFS_BRANCH"
            echo "susfs_expected_commit=$SUSFS_EXPECTED_COMMIT"
            echo "susfs_expected_version=$SUSFS_EXPECTED_VERSION"
            echo "cip_base=$CIP_BASE_TAG"
            echo "cip_target=$CIP_TARGET_TAG"
          } > "$DIAG_DIR/00-workflow-context.txt"

          if [ -d "$GITHUB_WORKSPACE/kernel/.git" ]; then
            cd "$GITHUB_WORKSPACE/kernel"
            git status --short > "$DIAG_DIR/git-status.txt" 2>&1 || true
            git diff --stat > "$DIAG_DIR/git-diff-stat.txt" 2>&1 || true
            git diff --name-only > "$DIAG_DIR/git-diff-files.txt" 2>&1 || true
            git diff --binary > "$DIAG_DIR/kernel-source.patch" 2>&1 || true
          fi

          if [ -f "$OUT_DIR/.config" ]; then
            cp "$OUT_DIR/.config" "$DIAG_DIR/final-or-last.config" || true
          fi

          if [ -f "$GITHUB_WORKSPACE/Image.gz" ]; then
            sha256sum "$GITHUB_WORKSPACE/Image.gz" > "$DIAG_DIR/Image.gz.sha256" || true
            ls -lh "$GITHUB_WORKSPACE/Image.gz" > "$DIAG_DIR/Image.gz.ls.txt" || true
          fi

          echo "Diagnostics generated at $(date -u +%FT%TZ)" > "$DIAG_DIR/ARTIFACT-READY.txt"

          cd "$GITHUB_WORKSPACE"
          rm -f "$GITHUB_WORKSPACE/LG-Velvet-LIGHT-diagnostics.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/LG-Velvet-LIGHT-diagnostics.tar.gz" \
            -C "$DIAG_DIR" .
          test -s "$GITHUB_WORKSPACE/LG-Velvet-LIGHT-diagnostics.tar.gz"

      - name: 14 - Upload Image.gz (only on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-LIGHT-SukiSU-Ultra-SUSFS-CIP135
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ github.workspace }}/Image.gz
            ${{ github.workspace }}/kernel/out/.config

      - name: 15 - Upload diagnostics (ALWAYS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-LIGHT-diagnostics-run-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: |
            ${{ github.workspace }}/ci-diagnostics/**
            ${{ github.workspace }}/LG-Velvet-LIGHT-diagnostics.tar.gz

      - name: 16 - Print artifact location
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "LIGHT KERNEL DIAGNOSTICS ARTIFACT"
          echo "Artifact: LG-Velvet-LIGHT-diagnostics-run-${{ github.run_id }}"
          echo "Kernel artifact: LG-Velvet-LIGHT-SukiSU-Ultra-SUSFS-CIP135"
          echo "Local diagnostics: $GITHUB_WORKSPACE/LG-Velvet-LIGHT-diagnostics.tar.gz"
          echo "============================================================"
