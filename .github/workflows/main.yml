            echo "susfs_backport_commit=${SUSFS_BACKPORT_RESOLVED}"
            echo "requested_susfs_version=${SUSFS_VERSION}"
            echo "kernel_version=$(make -s -C kernel kernelversion)"
            echo "kernel_head=$(git -C kernel rev-parse HEAD)"
            echo "susfs_semantic_port=4-file-v17"
          } | tee logs/07-susfs-selected.txt

          INLINE_SCRIPT="Patches/susfs_inline_hook_patches.sh"
          test -f "susfs-backport/${INLINE_SCRIPT}"
          cp "susfs-backport/${INLINE_SCRIPT}" logs/07-susfs-inline-hook-patches.sh
          chmod +x logs/07-susfs-inline-hook-patches.sh
          (cd kernel && bash ../logs/07-susfs-inline-hook-patches.sh) 2>&1 | tee logs/07-susfs-inline-hooks.log

          # ------------------------------------------------------------------
          
          python3 - <<'PY_SUKISU_SUSFS_RECONCILE' > logs/07-susfs-legacy-abi-reconcile.log 2>&1
          from pathlib import Path
          import re
          import subprocess

          kernel = Path("kernel")
          ksu = kernel / "SukiSU/kernel"
          sucompat_c = ksu / "feature/sucompat.c"
          sucompat_h = ksu / "feature/sucompat.h"

          EXPECTED_SUKISU = "e2912817f4e1b194e582a06e0b5eacf6a3fb7083"
          sukisu_repo = kernel / "SukiSU"
          if not sukisu_repo.is_dir():
              raise SystemExit(
                  f"[ERROR] R13: expected embedded KernelSU repository is missing: {sukisu_repo}"
              )
          resolved = subprocess.check_output(
              ["git", "-C", str(sukisu_repo), "rev-parse", "HEAD"], text=True
          ).strip()
          if resolved != EXPECTED_SUKISU:
              raise SystemExit(
                  f"[ERROR] R12 legacy ABI reconciliation: expected pinned "
                  f"SukiSU commit {EXPECTED_SUKISU}, got {resolved}"
              )

          c = sucompat_c.read_text(errors="replace")
          h = sucompat_h.read_text(errors="replace")

          if not re.search(
              r"(?m)^\s*bool\s+ksu_su_compat_enabled\s+__read_mostly\s*=\s*true\s*;",
              c,
          ):
              raise SystemExit(
                  "[ERROR] R12: pinned legacy sucompat bool definition is not present"
              )
          if not re.search(
              r"(?m)^\s*extern\s+bool\s+ksu_su_compat_enabled\s*;",
              h,
          ):
              raise SystemExit(
                  "[ERROR] R12: pinned legacy sucompat extern bool declaration is not present"
              )
          if re.search(r"DEFINE_STATIC_KEY_TRUE\s*\(\s*ksu_su_compat_enabled\s*\)", c):
              raise SystemExit(
                  "[ERROR] R12: legacy sucompat was already converted to an incompatible static-key definition"
              )

          # The external SUSFS inline script declares this legacy symbol as a
          # static_key_true in the three manual-hook call sites. Restore the exact
          # legacy declaration and condition semantics there.
          hook_files = [
              kernel / "fs/exec.c",
              kernel / "fs/open.c",
              kernel / "fs/stat.c",
          ]

          for p in hook_files:
              if not p.is_file():
                  raise SystemExit(f"[ERROR] R12: expected manual-hook file missing: {p}")
              s = p.read_text(errors="replace")

              s = re.sub(
                  r"extern\s+struct\s+static_key_true\s+ksu_su_compat_enabled\s*;",
                  "extern bool ksu_su_compat_enabled;",
                  s,
              )
              s = re.sub(
                  r"static_branch_likely\s*\(\s*&\s*ksu_su_compat_enabled\s*\)",
                  "ksu_su_compat_enabled",
                  s,
              )
              s = re.sub(
                  r"static_branch_unlikely\s*\(\s*&\s*ksu_su_compat_enabled\s*\)",
                  "ksu_su_compat_enabled",
                  s,
              )

              p.write_text(s)

          # The pinned legacy sucompat.c has no post-exec helper. The inline
          # script's declaration/call is a newer integration contract, not part
          # of SUSFS 2.3.0 itself and not part of the removed legacy KSU implementation.
          exec_c = kernel / "fs/exec.c"
          s = exec_c.read_text(errors="replace")

          s = re.sub(
              r"(?ms)^\s*extern\s+int\s+ksu_handle_post_execveat_sucompat\s*"
              r"\(\s*int\s*\*fd,\s*struct\s+filename\s*\*\*filename_ptr,\s*"
              r"void\s+\*argv,\s*void\s+\*envp,\s*int\s+\*flags,\s*int\s+\*retval\s*\)\s*;\s*",
              "",
              s,
          )

          # Remove the helper's temporary session flag; it only existed to feed
          # the unsupported post-exec function.
          s = re.sub(
              r"(?ms)#ifdef CONFIG_KSU_SUSFS\s+bool\s+is_su_session\s*=\s*false;\s*"
              r"#endif\s*(?=\n)",
              "",
              s,
          )

          # Convert the generated assignments into direct legacy calls. The
          # return value of both legacy hook functions is intentionally ignored
          # by the existing manual-hook ABI.
          s = s.replace(
              "is_su_session = !ksu_handle_execveat(\\&fd, \\&filename, \\&argv, \\&envp, \\&flags);",
              "ksu_handle_execveat(\\&fd, \\&filename, \\&argv, \\&envp, \\&flags);",
          )
          s = s.replace(
              "is_su_session = !ksu_handle_execveat_sucompat(\\&fd, \\&filename, \\&argv, \\&envp, \\&flags);",
              "ksu_handle_execveat_sucompat(\\&fd, \\&filename, \\&argv, \\&envp, \\&flags);",
          )

          # The shell-escaped log copy uses literal backslashes; the real source
          # contains normal '&' characters. Handle both forms defensively.
          s = s.replace(
              "is_su_session = !ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);",
              "ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);",
          )
          s = s.replace(
              "is_su_session = !ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);",
              "ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);",
          )

          # Remove the unsupported post-exec call block, if the external script
          # inserted it.
          s = re.sub(
              r"(?ms)#ifdef CONFIG_KSU_SUSFS\s+if\s*\(\s*unlikely\s*\(\s*is_su_session\s*\)\s*\)\s*"
              r"\(void\)\s*ksu_handle_post_execveat_sucompat\s*\(\s*&fd,\s*&filename,\s*&argv,\s*&envp,\s*&flags,\s*&retval\s*\)\s*;\s*"
              r"#endif\s*(?=//\s*#ifdef CONFIG_KSU_SUSFS|$)",
              "",
              s,
          )

          exec_c.write_text(s)

          # Hard contract checks. These prevent a future workflow edit from
          # silently reintroducing the same ABI mismatch.
          all_c = "\n".join(
              p.read_text(errors="replace")
              for p in kernel.rglob("*")
              if p.is_file() and p.suffix in {".c", ".h"}
          )

          if re.search(
              r"static_branch_(?:likely|unlikely|enable|disable)\s*\(\s*&\s*ksu_su_compat_enabled",
              all_c,
          ):
              raise SystemExit(
                  "[ERROR] R12: static-key operations still target legacy bool ksu_su_compat_enabled"
              )

          if "ksu_handle_post_execveat_sucompat" in all_c:
              raise SystemExit(
                  "[ERROR] R12: unsupported post-exec sucompat symbol remains in the integrated legacy tree"
              )

          if "extern bool ksu_su_compat_enabled;" not in exec_c.read_text():
              raise SystemExit("[ERROR] R12: fs/exec.c lost the legacy bool declaration")
          if "ksu_handle_execveat_sucompat" not in exec_c.read_text():
              raise SystemExit("[ERROR] R12: real legacy execveat sucompat hook was removed")

          print("[OK] R12: pinned legacy KernelSU bool ABI preserved.")
          print("[OK] R12: SUSFS inline call-sites reconciled to legacy 4.19 ABI.")
          print("[OK] R12: unsupported post-exec helper removed rather than fabricated.")
          print("[OK] R12: no static-key operations remain against ksu_su_compat_enabled.")
          print("[OK] R12: legacy ksu_handle_execveat_sucompat path preserved.")
          PY_SUKISU_SUSFS_RECONCILE
          python3 - <<'PY_SUSFS_KSTAT_FIX'
          from pathlib import Path
          import re

          p = Path('kernel/include/linux/susfs.h')
          if not p.is_file():
              raise SystemExit('[ERROR] SUSFS KSTAT definition file is missing: kernel/include/linux/susfs.h')
          # V99-R11: Step 7 executes from the workspace root. Keep the
          # kernel source path explicit so cwd changes cannot produce a false
          # "missing file" error.
          if not Path('kernel/include/linux/susfs.h').is_file():
              raise SystemExit('[ERROR] V99-R11: kernel/include/linux/susfs.h is absent after SUSFS port')
          s = p.read_text()

          expected = {
              'KSTAT_SPOOF_INO': 0,
              'KSTAT_SPOOF_DEV': 1,
              'KSTAT_SPOOF_NLINK': 2,
              'KSTAT_SPOOF_SIZE': 3,
              'KSTAT_SPOOF_ATIME_TV_SEC': 4,
              'KSTAT_SPOOF_ATIME_TV_NSEC': 5,
              'KSTAT_SPOOF_MTIME_TV_SEC': 6,
              'KSTAT_SPOOF_MTIME_TV_NSEC': 7,
              'KSTAT_SPOOF_CTIME_TV_SEC': 8,
              'KSTAT_SPOOF_CTIME_TV_NSEC': 9,
              'KSTAT_SPOOF_BLOCKS': 10,
              'KSTAT_SPOOF_BLKSIZE': 11,
          }

          # Exact macro block from the pinned SUSFS 2.3.0 patch, with only the
          # documented typo corrected: (1 < 8) -> (1 << 8).
          canonical = ''.join(
              f'#define {name} (1 << {bit})\n'
              for name, bit in expected.items()
          )

          # V99-R8: do not assume a particular whitespace/comment layout between
          # the SUS_KSTAT #ifdef and its struct. The pinned 4.19 backport has the
          # documented flag sequence, but a 3-way/semantic port may preserve comments
          # or formatting. Normalize only the KSTAT flag definitions inside that
          # CONFIG_KSU_SUSFS_SUS_KSTAT block, preserving the surrounding source.
          lines = s.splitlines(keepends=True)
          start = None
          end = None
          depth = 0
          for i, line in enumerate(lines):
              if re.match(r'^\s*#ifdef\s+CONFIG_KSU_SUSFS_SUS_KSTAT\s*$', line):
                  start = i
                  break
          if start is None:
              raise SystemExit('[ERROR] CONFIG_KSU_SUSFS_SUS_KSTAT block not found in include/linux/susfs.h')

          for i in range(start + 1, len(lines)):
              if re.match(r'^\s*struct\s+st_susfs_sus_kstat\s*\{', lines[i]):
                  end = i
                  break
              if re.match(r'^\s*#endif\b', lines[i]):
                  break
          if end is None:
              raise SystemExit('[ERROR] SUSFS KSTAT struct boundary not found in include/linux/susfs.h')

          define_re = re.compile(r'^\s*#define\s+(KSTAT_SPOOF_[A-Z0-9_]+)\s+.*?(?:\r?\n|$)')
          kstat_names = set(expected)
          existing = []
          kept = []
          for line in lines[start + 1:end]:
              dm = define_re.match(line)
              if dm and dm.group(1) in kstat_names:
                  existing.append(dm.group(1))
                  continue
              kept.append(line)

          # Insert one canonical definition block immediately after the KSTAT #ifdef.
          # Only the known typo is corrected; all other source-derived bits remain 0..11.
          canonical_lines = [
              f'#define {name} (1 << {bit})\n'
              for name, bit in expected.items()
          ]
          lines2 = lines[:start + 1] + canonical_lines + kept + lines[end:]
          s2 = ''.join(lines2)
          p.write_text(s2)
          print('[FIX] SUSFS 2.3.0 KSTAT definitions normalized in include/linux/susfs.h from pinned source; C-time seconds uses (1 << 8).')

          # Cross-setup invariant: exactly one definition of every KSTAT flag,
          # with source-derived bit values 0..11, and no legacy typo anywhere.
          define_re = re.compile(
              r'^\s*#define\s+(KSTAT_SPOOF_[A-Z0-9_]+)\s+'
              r'\(\s*1\s*<<\s*(\d+)\s*\)\s*(?:/\*.*?\*/|//.*)?\s*$', re.M)
          defs = {}
          for line in s2.splitlines():
              dm = define_re.match(line)
              if dm:
                  defs.setdefault(dm.group(1), []).append(int(dm.group(2)))
          for name, bit in expected.items():
              values = defs.get(name, [])
              if values != [bit]:
                  raise SystemExit(
                      f'[ERROR] SUSFS KSTAT definition mismatch for {name}: '
                      f'found {values!r}, expected exactly [(1 << {bit})]'
                  )
          old = re.findall(
              r'^\s*#define\s+KSTAT_SPOOF_CTIME_TV_SEC\s+\(\s*1\s*<\s*8\s*\)',
              s2, re.M)
          if old:
              raise SystemExit('[ERROR] SUSFS KSTAT old (1 < 8) typo remains after canonical repair')
          # Cross-setup invariant: validate the integrated kernel tree itself,
          # not the downloaded patch or workflow logs.
          bad = []
          for q in Path('kernel').rglob('*'):
              if not q.is_file() or '.git' in q.parts:
                  continue
              try:
                  t = q.read_text(errors='ignore')
              except Exception:
                  continue
              if re.search(r'KSTAT_SPOOF_CTIME_TV_SEC\s*\(\s*1\s*<\s*8\s*\)', t):
                  bad.append(str(q))
          if bad:
              raise SystemExit(
                  '[ERROR] SUSFS KSTAT legacy (1 < 8) remains in integrated kernel source: '
                  + ', '.join(bad[:20])
              )
          print('[OK] SUSFS 2.3.0 KSTAT flags verified as unique bits 0..11.')
          print('[OK] V99-R11 integrated-kernel scan: no (1 < 8) KSTAT typo remains.')
          PY_SUSFS_KSTAT_FIX

          echo "[OK] SUSFS ${SUSFS_VERSION} 4.19 backport integrated using ${APPLY_MODE}."


      - name: "8. Apply only required Linux 4.19 compatibility shims"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[8/13] 4.19 compatibility shims"
          cd kernel

          python3 - <<'PY'
          from pathlib import Path

          p=Path("fs/namespace.c")
          s=p.read_text()
          if "int path_mount(const char *dev_name" not in s:
              anchor="int ksys_mount(const char __user *dev_name,"
              if anchor not in s:
                  raise SystemExit("[ERROR] 4.19 ksys_mount anchor not found")
              i=s.index(anchor)
              wrapper="""/* SukiSU 4.19 compatibility: path_mount/path_umount are newer VFS helpers. */
          int path_mount(const char *dev_name, struct path *path,
                         const char *type_page, unsigned long flags, void *data_page)
          {
              char *buf, *dir_name;
              mm_segment_t old_fs;
              long ret;

              buf = (char *)__get_free_page(GFP_KERNEL);
              if (!buf)
                  return -ENOMEM;
              dir_name = d_path(path, buf, PAGE_SIZE);
              if (IS_ERR(dir_name)) {
                  free_page((unsigned long)buf);
                  return PTR_ERR(dir_name);
              }
              old_fs = get_fs();
              set_fs(KERNEL_DS);
              ret = ksys_mount((char __user *)dev_name, (char __user *)dir_name,
                               (char __user *)type_page, flags, (void __user *)data_page);
              set_fs(old_fs);
              free_page((unsigned long)buf);
              return ret;
          }
          EXPORT_SYMBOL_GPL(path_mount);

          int path_umount(struct path *path, int flags)
          {
              char *buf, *name;
              mm_segment_t old_fs;
              long ret;

              buf = (char *)__get_free_page(GFP_KERNEL);
              if (!buf)
                  return -ENOMEM;
              name = d_path(path, buf, PAGE_SIZE);
              if (IS_ERR(name)) {
                  free_page((unsigned long)buf);
                  return PTR_ERR(name);
              }
              old_fs = get_fs();
              set_fs(KERNEL_DS);
              ret = ksys_umount((char __user *)name, flags);
              set_fs(old_fs);
              free_page((unsigned long)buf);
              return ret;
          }
          EXPORT_SYMBOL_GPL(path_umount);

          """
              s=s[:i]+wrapper+s[i:]
              p.write_text(s)

          p=Path("kernel/seccomp.c")
          s=p.read_text()
          if "void seccomp_filter_release(struct task_struct *tsk)" not in s:
              anchor="void put_seccomp_filter(struct task_struct *tsk)"
              if anchor not in s:
                  raise SystemExit("[ERROR] 4.19 put_seccomp_filter anchor not found")
              i=s.index(anchor)
              wrapper="""/* SukiSU 4.19 compatibility: bridge newer release-helper name. */
          void seccomp_filter_release(struct task_struct *tsk)
          {
              put_seccomp_filter(tsk);
          }
          EXPORT_SYMBOL_GPL(seccomp_filter_release);

          """
              s=s[:i]+wrapper+s[i:]
              p.write_text(s)

          p=Path("drivers/kernelsu/supercall/supercall.c")
          if p.exists():
              s=p.read_text()
              if "KSU_TASK_WORK_RESUME" not in s and "TWA_RESUME" in s:
                  s=s.replace("task_work_add(tsk, cb, TWA_RESUME)",
                              "task_work_add(tsk, cb, KSU_TASK_WORK_RESUME)")
                  i=s.find("#include")
                  if i < 0:
                      raise SystemExit("[ERROR] supercall.c include anchor not found")
                  add="""/* SukiSU 4.19 compatibility: task_work_add() takes bool on this kernel. */
          #ifndef KSU_TASK_WORK_RESUME
          #if defined(TWA_RESUME)
          #define KSU_TASK_WORK_RESUME TWA_RESUME
          #else
          #define KSU_TASK_WORK_RESUME true
          #endif
          #endif

          """
                  s=s[:i]+add+s[i:]
                  p.write_text(s)

          p=Path("drivers/kernelsu/feature/selinux_hide.c")
          if p.exists() and "SUKISU_419_SELINUX_HIDE_STUB" not in p.read_text():
              original=p.read_text()
              wrapped="""/* SukiSU 4.19 compatibility: the SELinux status-page hiding implementation
           * uses members introduced after 4.19. Keep the feature source present but
           * compile explicit no-op entry points on this kernel. */
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 7, 0)
          #define SUKISU_419_SELINUX_HIDE_STUB 1
          int ksu_selinux_hide_handle_second_stage(void) { return 0; }
          int ksu_selinux_hide_handle_post_fs_data(void) { return 0; }
          #else
          """ + original + "\n#endif /* LINUX_VERSION_CODE < 5.7 */\n"
              p.write_text(wrapped)

          print("[OK] Required 4.19 compatibility shims installed.")
          PY

          grep -q 'int path_mount(' fs/namespace.c
          grep -q 'int path_umount(' fs/namespace.c
          grep -q 'seccomp_filter_release' kernel/seccomp.c
          if [ -f drivers/kernelsu/supercall/supercall.c ]; then
            grep -q 'KSU_TASK_WORK_RESUME' drivers/kernelsu/supercall/supercall.c
          fi
          echo "::endgroup::"

      - name: "9. Configure and build only Image"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[9/13] Configure and build Image"
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"

          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable KSU_FEATURE_ADBROOT
          ./scripts/config --file out/.config --enable KSU_SUSFS
          for s in KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
            ./scripts/config --file out/.config --enable "$s"
          done
          make O=out olddefconfig > ../logs/08-olddefconfig.log 2>&1

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          for s in KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
            grep -q "^CONFIG_${s}=y$" out/.config
          done

          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' out/.config | sort > ../post-integration-enabled-config.txt

          # Source/API prebuild: this is intentionally separate from the final Image build.
          make O=out drivers/kernelsu/ -j"$(nproc)" 2>&1 | tee ../logs/09-sukisu-prebuild.log
          make O=out Image -j"$(nproc)" 2>&1 | tee ../logs/09-image-build.log

          test -s out/arch/arm64/boot/Image
          {
            echo "sukisu_commit=$(git -C SukiSU rev-parse HEAD)"
            echo "sukisu_version=${SUKISU_VERSION}"
            echo "manager_build=${SUKISU_MANAGER_BUILD}"
            echo "manager_package=${SUKISU_MANAGER_PACKAGE}"
            echo "susfs_version=${SUSFS_VERSION}"
            echo "kernel_version=$(make -s O=out kernelversion)"
            echo "image_sha256=$(sha256sum out/arch/arm64/boot/Image | awk '{print $1}')"
          } | tee ../logs/09-final-build-contract.txt
          echo "::endgroup::"



      - name: "10. Package flashable outputs"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[10/13] Package outputs"
          rm -rf release work-anykernel
          mkdir -p release/logs release/build-info release/checksums work-anykernel
          cp kernel/out/arch/arm64/boot/Image release/kernel-image
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git work-anykernel > logs/10-anykernel-clone.log 2>&1
          rm -rf work-anykernel/.git work-anykernel/modules work-anykernel/ramdisk
          cp kernel/out/arch/arm64/boot/Image work-anykernel/Image
          cat > work-anykernel/anykernel.sh <<'AK3'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=V101-LM-G900-KARNAL-SukiSU-v4.2.0
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          '; }
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3
          (cd work-anykernel && zip -qr ../release/AnyKernel3-OrangeFox-Flashable.zip .)
          mkdir -p release/kernel-payload
          cp kernel/out/arch/arm64/boot/Image release/kernel-payload/Image
          cp source-info.txt baseline-info.txt toolchain-version.txt baseline-enabled-config.txt post-integration-enabled-config.txt release/build-info/ 2>/dev/null || true
          cp logs/*.log release/logs/ 2>/dev/null || true
          cp logs/*.patch release/logs/ 2>/dev/null || true
          (cd release/kernel-payload && zip -qr ../kernel.zip .)
          rm -rf release/kernel-payload
          {
            echo "workflow=${WORKFLOW_VERSION}"
            echo "workflow_name=V101-LM-G900-KARNAL-SukiSU-v4.2.0-builtSUSFS"
            echo "kernel_version=${BASELINE_KERNEL_VERSION}"
            echo "source_commit=$(git -C kernel rev-parse HEAD)"
            echo "cip_baseline=${BASELINE_CIP}"
            echo "cip_target=${CIP_TARGET}"
            echo "sukisu_version=${SUKISU_VERSION}"
            echo "sukisu_commit=$(git -C kernel/SukiSU rev-parse HEAD)"
            echo "manager_build=${SUKISU_MANAGER_BUILD}"
            echo "manager_package=${SUKISU_MANAGER_PACKAGE}"
            echo "susfs_version=${SUSFS_VERSION}"
            echo "susfs_backport_repo=${SUSFS_BACKPORT_REPO}"
            echo "susfs_backport_commit=${SUSFS_BACKPORT_COMMIT}"
            echo "clang=${CLANG_REV}"
            echo "clang_commit=${CLANG_COMMIT}"
            echo "defconfig=${TARGET_KERNEL_CONFIG}"
          } > release/build-info/build-manifest.txt
          sha256sum release/kernel-image release/kernel.zip release/AnyKernel3-OrangeFox-Flashable.zip > release/checksums/SHA256SUMS
          rm -f release/kernel-image
          (cd release && zip -qr "../${OUTPUT_PREFIX}-output.zip" .)
          echo "::endgroup::"

      - name: "11. Verify final source and artifact contract"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[11/13] Final verification"
          cd kernel

          test "$(git -C SukiSU rev-parse HEAD)" = "${SUKISU_COMMIT}"
          test -s out/arch/arm64/boot/Image
          test -s ../release/kernel.zip
          test -s ../release/AnyKernel3-OrangeFox-Flashable.zip

          # Migration allowlist: SukiSU wiring + SUSFS patch/hook files + only the
          # 4.19 compatibility bridges required by the new SukiSU source.
          cat > ../logs/11-migration-allowlist.txt <<'EOF_ALLOWED'
          drivers/Makefile
          drivers/Kconfig
          fs/Makefile
          fs/namei.c
          fs/namespace.c
          fs/notify/fdinfo.c
          fs/proc/base.c
          fs/proc/cmdline.c
          fs/proc/fd.c
          fs/proc/task_mmu.c
          fs/proc_namespace.c
          fs/readdir.c
          fs/stat.c
          fs/statfs.c
          fs/super.c
          fs/susfs.c
          include/linux/susfs.h
          include/linux/susfs_def.h
          kernel/kallsyms.c
          kernel/seccomp.c
          kernel/sys.c
          kernel/reboot.c
          mm/memory.c
          security/security.c
          security/selinux/avc.c
          security/selinux/hooks.c
          security/selinux/ss/services.c
          EOF_ALLOWED
          sed -i 's/^          //' ../logs/11-migration-allowlist.txt
          git diff --name-only > ../logs/11-post-cip-migration-files.txt
          while IFS= read -r f; do
            test -z "$f" && continue
            if ! grep -Fxq "$f" ../logs/11-migration-allowlist.txt; then
              echo "[ERROR] Unexpected tracked source change outside the two requested integrations: $f"
              exit 1
            fi
          done < ../logs/11-post-cip-migration-files.txt
          echo "[OK] No tracked source file outside the SukiSU/SUSFS migration allowlist changed."

          # Old old KernelSU must be completely absent from the active source.
          if grep -Rqs --exclude-dir=.git --exclude-dir=out --exclude-dir=SukiSU \
              -E 'old KernelSU|com\.rifsxd\.ksunext|OLD_KSU_COMMIT_REMOVED' .; then
            echo "[ERROR] Old old KernelSU implementation identifiers remain."
            exit 1
          fi

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h
          grep -q 'SUSFS_VERSION' include/linux/susfs.h
          grep -Eq 'SUSFS_VERSION[[:space:]]+"?2\.3\.0' include/linux/susfs.h
          grep -q 'susfs_is_current_ksu_domain' fs/susfs.c

          # Ensure no unrelated source areas were touched by the root/SUSFS migration.
          # The exact changed-file list is retained for review; the workflow never edits DT,
          # audio, display, networking, vendor drivers, or unrelated kernel subsystems.
          git status --short > ../logs/11-final-git-status.txt
          git diff --name-only > ../logs/11-final-diff-names.txt

          unzip -t ../release/kernel.zip >/dev/null
          unzip -t ../release/AnyKernel3-OrangeFox-Flashable.zip >/dev/null
          unzip -t ../${OUTPUT_PREFIX}-output.zip >/dev/null
          sha256sum ../release/kernel.zip ../release/AnyKernel3-OrangeFox-Flashable.zip | tee ../logs/11-final-sha256.log
          echo "[OK] Final source/artifact contract passed."
          echo "::endgroup::"

      - name: "12. Preserve complete diagnostics"
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "job_status=${JOB_STATUS}"
            echo "workflow=${WORKFLOW_VERSION}"
            echo "source_commit=${KERNEL_COMMIT}"
            echo "cip_target=${CIP_TARGET:-UNRESOLVED}"
            echo "sukisu_version=${SUKISU_VERSION}"
            echo "sukisu_commit=${SUKISU_COMMIT}"
            echo "manager_build=${SUKISU_MANAGER_BUILD}"
            echo "manager_package=${SUKISU_MANAGER_PACKAGE}"
            echo "susfs=${SUSFS_VERSION}"
          } > diagnostics/run-summary.txt
          cp -a logs/. diagnostics/logs/ 2>/dev/null || true
          cp -a baseline-*.txt post-integration-enabled-config.txt source-info.txt toolchain-version.txt diagnostics/ 2>/dev/null || true
          (cd diagnostics && zip -qr "../${OUTPUT_PREFIX}-diagnostics.zip" .) || true

      - name: "13. Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V101-LM-G900-KARNAL-SukiSU-artifacts
          path: |
            V101-LM-G900-KARNAL-SukiSU-output.zip
            V101-LM-G900-KARNAL-SukiSU-diagnostics.zip
            release/kernel.zip
            release/AnyKernel3-OrangeFox-Flashable.zip
          if-no-files-found: warn
          retention-days: 30

