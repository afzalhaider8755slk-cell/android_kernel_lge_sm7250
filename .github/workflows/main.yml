name: LG G900 Global - CIP135 + SukiSU-Ultra + SUSFS + KPROBES + A16 QPR2

on:
  workflow_dispatch:
    inputs:
      dual_sim:
        description: "Dual-SIM profile: auto uses the supplied vendor tree; dsds only validates existing DSDS properties"
        required: true
        default: "auto"
        type: choice
        options: [auto, dsds]

permissions:
  contents: read

concurrency:
  group: lg-g900-global-v4-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_BRANCH: sixteen
  KERNEL_COMMIT: 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49
  COMMON_REPO: https://github.com/afzalhaider8755slk-cell/android_device_lge_sm7250-common.git
  DEVICE_REPO: https://github.com/afzalhaider8755slk-cell/android_device_lge_caymanlm.git
  VENDOR_REPO: https://github.com/afzalhaider8755slk-cell/proprietary_vendor_lge_caymanlm.git
  TREE_BRANCH: sixteen
  # Device-specific BoardConfig.mk points to this exact defconfig.
  DEFCONFIG: vendor/lineageos_cayman_defconfig
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_REF: clang-r563880c
  CLANG_BRANCH: ndk-r29
  SUSFS_KERNEL_REPO: https://github.com/simonpunk/susfs4ksu.git
  SUSFS_MODULE_REPO: https://github.com/sidex15/susfs4ksu-module.git
  SUKISU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
  A16_API: "36.1"
  OUT: ${{ github.workspace }}/out
  DIAG: ${{ github.workspace }}/ci-diagnostics
  ARTIFACT_ROOT: ${{ github.workspace }}/artifacts

jobs:
  kernel:
    name: Kernel build
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: 00 - Init diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$DIAG" "$ARTIFACT_ROOT/kernel"
          : > "$DIAG/error.log"
          : > "$DIAG/error-summary.log"
          trap 'rc=$?; echo "kernel job rc=$rc" >> "$DIAG/error-summary.final.log"; exit $rc' EXIT

      - name: 01 - Checkout kernel source
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/01-checkout.log"
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git fetch --no-tags --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach "$KERNEL_COMMIT"
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          printf 'repo=%s\nbranch=%s\ncommit=%s\ndefconfig=%s\n' "$KERNEL_REPO" "$KERNEL_BRANCH" "$KERNEL_COMMIT" "$DEFCONFIG" > "$GITHUB_WORKSPACE/source.txt"

      - name: 02 - Install dependencies
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/02-dependencies.log"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache clang curl device-tree-compiler flex \
            libelf-dev libssl-dev lld llvm python3 rsync unzip wget xz-utils

      - name: 03 - Prepare exact Android Clang
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/03-toolchain.log"
          git clone --depth=1 --branch "$CLANG_BRANCH" --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilt
          cd clang-prebuilt
          git sparse-checkout set "$CLANG_REF"
          echo "CLANG_DIR=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REF" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REF/bin/clang" --version

      - name: 04 - Configure from real device defconfig (NO missing baseline file)
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/04-config.log"
          cd kernel
          rm -rf "$OUT"
          mkdir -p "$OUT"
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export CC="$CLANG_DIR/bin/clang"
          export HOSTCC="$CLANG_DIR/bin/clang"
          export HOSTCXX="$CLANG_DIR/bin/clang++"
          export LD="$CLANG_DIR/bin/ld.lld"
          export HOSTLD="$CLANG_DIR/bin/ld.lld"
          export AR="$CLANG_DIR/bin/llvm-ar"
          export NM="$CLANG_DIR/bin/llvm-nm"
          export OBJCOPY="$CLANG_DIR/bin/llvm-objcopy"
          export OBJDUMP="$CLANG_DIR/bin/llvm-objdump"
          export STRIP="$CLANG_DIR/bin/llvm-strip"
          export READELF="$CLANG_DIR/bin/llvm-readelf"
          # Critical fix: LLVM_IAS=1 is present BEFORE any *config target.
          # This prevents scripts/as-version.sh from invoking -Wa,--version
          # against Clang 21 and producing "assembler is not supported".
          "$CC" -fintegrated-as --target=aarch64-linux-gnu -c -x assembler /dev/null -o /tmp/as-test.o
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 "$DEFCONFIG"
          cp "$OUT/.config" "$GITHUB_WORKSPACE/working.config"
          test -s "$GITHUB_WORKSPACE/working.config"

      - name: 05 - Validate baseline before modifications
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/05-baseline-validation.log"
          cd kernel
          cfg="$OUT/.config"
          grep -q '^CONFIG_ARCH_QCOM=y$' "$cfg"
          grep -q '^CONFIG_ARCH_LITO=y$' "$cfg"
          grep -q '^CONFIG_RMNET=y$' "$cfg"
          grep -q '^CONFIG_IPA3=y$' "$cfg"
          grep -q '^CONFIG_RMNET_IPA3=y$' "$cfg"
          grep -q '^CONFIG_QCOM_QMI_HELPERS=y$' "$cfg"
          grep -q '^CONFIG_QCOM_QMI_RMNET=y$' "$cfg"
          grep -q '^CONFIG_CFG80211=y$' "$cfg"
          grep -q '^CONFIG_UID_SYS_STATS=y$' "$cfg"
          grep -q '^CONFIG_DM_VERITY=y$' "$cfg"
          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y$' "$cfg"
          cp "$cfg" "$GITHUB_WORKSPACE/baseline.generated.config"

      - name: 06 - Checkout device/common/vendor trees for validation
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/07-device-trees.log"
          mkdir -p device/lge vendor/lge
          git clone --depth=1 --branch "$TREE_BRANCH" "$COMMON_REPO" device/lge/sm7250-common
          git clone --depth=1 --branch "$TREE_BRANCH" "$DEVICE_REPO" device/lge/caymanlm
          git clone --depth=1 --branch "$TREE_BRANCH" "$VENDOR_REPO" vendor/lge/caymanlm
          grep -Rsn -E 'TARGET_KERNEL_CONFIG|BOARD_KERNEL_SEPARATED_DTBO|BOARD_INCLUDE_DTB_IN_BOOTIMG|BOARD_DTB_OFFSET|persist\.vendor\.radio\.multisim\.config|ro\.vendor\.lge\.sim_num|ro\.vendor\.lge\.dsds' \
            device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm | tee "$ARTIFACT_ROOT/kernel/device-tree-config.txt" || true

      - name: 07 - Verify network/telephony baseline; do not invent radio features
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/07-network-validation.log"
          cd kernel
          cfg="$OUT/.config"
          {
            echo '=== Qualcomm connectivity baseline ==='
            grep -E 'CONFIG_(RMNET|RMNET_IPA3|IPA3|QCOM_QMI|CFG80211|MAC80211|UID_SYS_STATS|BPF|NETFILTER)' "$cfg" || true
            echo '=== Device/vendor DSDS/IMS-related declarations ==='
            grep -Rsn -E 'persist\.vendor\.radio\.multisim\.config|ro\.vendor\.lge\.sim_num|ro\.vendor\.lge\.dsds|iwlan|ims|volte|wfc' \
              "$GITHUB_WORKSPACE/device/lge/sm7250-common" "$GITHUB_WORKSPACE/vendor/lge" 2>/dev/null || true
          } | tee "$ARTIFACT_ROOT/kernel/network-connectivity-report.txt"

      - name: 08 - Integrate SukiSU-Ultra using upstream setup
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/08-sukisu.log"
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 "$SUKISU_REPO" /tmp/SukiSU-Ultra
          test -f /tmp/SukiSU-Ultra/kernel/setup.sh
          bash /tmp/SukiSU-Ultra/kernel/setup.sh
          test -d KernelSU || test -d drivers/kernelsu

      - name: 09 - Integrate SUSFS kernel patch only when compatible
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/09-susfs.log"
          cd kernel
          git clone --depth=1 "$SUSFS_KERNEL_REPO" /tmp/susfs4ksu-kernel
          test -d /tmp/susfs4ksu-kernel
          # Use the SUSFS integration script if supplied by the checked-out tree.
          if [ -f /tmp/susfs4ksu-kernel/kernel/setup.sh ]; then
            bash /tmp/susfs4ksu-kernel/kernel/setup.sh
          elif [ -f /tmp/susfs4ksu-kernel/kernel/setup_susfs.sh ]; then
            bash /tmp/susfs4ksu-kernel/kernel/setup_susfs.sh
          else
            echo 'No kernel setup script in SUSFS repository; do not guess patch paths.'
            exit 1
          fi

      - name: 10 - Configure KPROBES + SukiSU + SUSFS without risky extras
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/10-config-features.log"
          cd kernel
          export PATH="$CLANG_DIR/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1 LLVM_IAS=1
          scripts/config --file "$OUT/.config" --enable CONFIG_KPROBES --enable CONFIG_KALLSYMS --enable CONFIG_KALLSYMS_ALL
          # Preserve connectivity/security baseline; only enable symbols that actually exist.
          for s in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SUS_OVERLAYFS CONFIG_KSU_SUSFS_TRY_UMOUNT CONFIG_KSU_SUSFS_SPOOF_UNAME; do
            if grep -qE "^(config|menuconfig) ${s#CONFIG_}([[:space:]]|$)" Kconfig KernelSU/Kconfig drivers/kernelsu/Kconfig 2>/dev/null; then
              scripts/config --file "$OUT/.config" --enable "$s" || true
            fi
          done
          # SUS_PATH is intentionally not forced on this 4.19 LG tree because the
          # previous source inspection showed a user_struct ABI mismatch there.
          scripts/config --file "$OUT/.config" --disable CONFIG_KSU_MANUAL_HOOK || true
          scripts/config --file "$OUT/.config" --disable CONFIG_KSU_TRACEPOINT_HOOK || true
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig
          grep -q '^CONFIG_KPROBES=y$' "$OUT/.config"
          grep -q '^CONFIG_KALLSYMS=y$' "$OUT/.config"

      - name: 11 - CIP135 compatibility gate (no blind merge)
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/11-cip135.log"
          cd kernel
          test "$(make O="$OUT" ARCH=arm64 kernelversion)" = "4.19.325"
          git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git || true
          git fetch --no-tags --depth=1 cip refs/tags/v4.19.325-cip135
          git show-ref --verify refs/remotes/cip/refs/tags/v4.19.325-cip135 || true
          # Generate a manifest first. Do not merge the entire CIP tree into LG vendor code.
          git log -1 --format='%H %s' HEAD > "$ARTIFACT_ROOT/kernel/vendor-head.txt"
          git show-ref --tags | grep '4.19.325-cip135' > "$ARTIFACT_ROOT/kernel/cip135-ref.txt" || true
          echo 'CIP135 is a compatibility gate here; vendor/LG code is never overwritten by a full CIP merge.'

      - name: 12 - Build kernel only
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/12-kernel-build.log"
          cd kernel
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image modules
          test -s "$OUT/arch/arm64/boot/Image"
          cp "$OUT/arch/arm64/boot/Image" "$ARTIFACT_ROOT/kernel/Image"
          cp "$OUT/.config" "$ARTIFACT_ROOT/kernel/final.config"
          sha256sum "$ARTIFACT_ROOT/kernel/Image" > "$ARTIFACT_ROOT/kernel/Image.sha256"

      - name: 13 - Kernel artifact diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_ROOT/kernel"
          {
            echo "status=${{ job.status }}"
            echo "sha=${{ github.sha }}"
            echo '--- recent diagnostics ---'
            tail -n 200 "$DIAG"/*.log 2>/dev/null || true
          } > "$ARTIFACT_ROOT/kernel/error-summary.log"

      - name: 14 - Upload kernel artifacts and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-v4-kernel-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_ROOT }}/kernel/**
            ${{ env.DIAG }}/**
            ${{ env.DIAG }}/error.log
            ${{ env.DIAG }}/error-summary.log
          if-no-files-found: warn

  dtb:
    name: DTB build (separate)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 00 - Init
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$DIAG" "$ARTIFACT_ROOT/dtb"
          : > "$DIAG/error.log"
          : > "$DIAG/error-summary.log"

      - name: 01 - Checkout kernel
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/01-checkout.log"
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel; git fetch --no-tags --depth=1 origin "$KERNEL_COMMIT"; git checkout --detach "$KERNEL_COMMIT"

      - name: 02 - Toolchain
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/02-toolchain.log"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential device-tree-compiler flex libelf-dev libssl-dev lld llvm python3
          git clone --depth=1 --branch "$CLANG_BRANCH" --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilt
          cd clang-prebuilt; git sparse-checkout set "$CLANG_REF"
          echo "CLANG_DIR=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REF" >> "$GITHUB_ENV"

      - name: 03 - Correct defconfig and DTB-only build
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/03-dtb-build.log"
          cd kernel
          rm -rf "$OUT"; mkdir -p "$OUT"
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
          export CC="$CLANG_DIR/bin/clang" LD="$CLANG_DIR/bin/ld.lld" HOSTCC="$CLANG_DIR/bin/clang" HOSTLD="$CLANG_DIR/bin/ld.lld"
          "$CC" -fintegrated-as --target=aarch64-linux-gnu -c -x assembler /dev/null -o /tmp/as-test.o
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 "$DEFCONFIG"
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j"$(nproc)" dtbs
          find "$OUT/arch/arm64/boot/dts" -type f -name '*.dtb' -print | tee "$ARTIFACT_ROOT/dtb/dtb-list.txt"
          # Target gate: only ship Lito/LGE/cayman-related DTBs. Never bundle unrelated boards.
          mapfile -t target_dtb < <(find "$OUT/arch/arm64/boot/dts" -type f -name '*.dtb' | grep -Ei '/(lito|cayman|lg).*\.dtb$' || true)
          if [ "${#target_dtb[@]}" -eq 0 ]; then
            echo 'No Lito/LG/Cayman DTB was produced; refusing to package an unrelated DTB.' | tee "$DIAG/error.log"
            exit 1
          fi
          mkdir -p "$ARTIFACT_ROOT/dtb/files"
          printf '%s\n' "${target_dtb[@]}" | while read -r f; do cp "$f" "$ARTIFACT_ROOT/dtb/files/"; done
          sha256sum "$ARTIFACT_ROOT/dtb/files"/* > "$ARTIFACT_ROOT/dtb/SHA256SUMS"

      - name: 04 - Upload DTB/errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-v4-DTB-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_ROOT }}/dtb/**
            ${{ env.DIAG }}/**
            ${{ env.DIAG }}/error.log
            ${{ env.DIAG }}/error-summary.log
          if-no-files-found: warn

  dtbo:
    name: DTBO build (separate)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 00 - Init
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$DIAG" "$ARTIFACT_ROOT/dtbo"
          : > "$DIAG/error.log"
          : > "$DIAG/error-summary.log"

      - name: 01 - Checkout kernel
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/01-checkout.log"
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel; git fetch --no-tags --depth=1 origin "$KERNEL_COMMIT"; git checkout --detach "$KERNEL_COMMIT"

      - name: 02 - Toolchain and mkdtimg
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/02-toolchain.log"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential device-tree-compiler flex libelf-dev libssl-dev lld llvm python3
          git clone --depth=1 --branch "$CLANG_BRANCH" --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilt
          cd clang-prebuilt; git sparse-checkout set "$CLANG_REF"
          echo "CLANG_DIR=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REF" >> "$GITHUB_ENV"
          # mkdtimg is supplied by Android's system/libufdt tree; build the
          # host utility instead of assuming it exists on the GitHub runner.
          git clone --depth=1 https://android.googlesource.com/platform/system/libufdt aosp-libufdt
          cd aosp-libufdt
          if [ -f utils/src/mkdtimg.c ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y zlib1g-dev
            make -C utils -j"$(nproc)" || true
          fi
          if [ -x utils/mkdtimg ]; then echo "MKDTIMG=$GITHUB_WORKSPACE/aosp-libufdt/utils/mkdtimg" >> "$GITHUB_ENV"; fi

      - name: 03 - Correct defconfig and build overlay DTBs
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/03-dtbo-build.log"
          cd kernel
          rm -rf "$OUT"; mkdir -p "$OUT"
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
          export CC="$CLANG_DIR/bin/clang" LD="$CLANG_DIR/bin/ld.lld" HOSTCC="$CLANG_DIR/bin/clang" HOSTLD="$CLANG_DIR/bin/ld.lld"
          "$CC" -fintegrated-as --target=aarch64-linux-gnu -c -x assembler /dev/null -o /tmp/as-test.o
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 "$DEFCONFIG"
          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y$' "$OUT/.config"
          # DTBO must come from the kernel native dtbo-* kbuild output.
          # Do not convert arbitrary Lito overlay DTS files into DTBOs: the
          # LGE vendor/qcom Makefile changes DT selection under CONFIG_MACH_LGE.
          qmake="arch/arm64/boot/dts/vendor/qcom/Makefile"
          test -f "$qmake"
          awk '/dtbo-.*CONFIG_ARCH_LITO/,/else|endif/ {print}' "$qmake" > "$ARTIFACT_ROOT/dtbo/lito-dtbo-rules.txt"
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 dtbs 2>&1 | tee "$DIAG/03-dtbs-pass.log"
          mapfile -t native_dtbo < <(find "$OUT/arch/arm64/boot/dts" -type f -name '*.dtbo' | sort)
          printf '%s\n' "${native_dtbo[@]}" | tee "$ARTIFACT_ROOT/dtbo/native-dtbo-list.txt"
          if [ "${#native_dtbo[@]}" -eq 0 ]; then
            echo 'The active LGE kernel configuration produced no native .dtbo target. Refusing to synthesize DTBOs from unrelated Lito overlays.' | tee "$DIAG/error.log"
            echo 'BoardConfig requests separated DTBO, but the current kernel vendor/qcom Makefile does not expose an LGE dtbo target under CONFIG_MACH_LGE.' >> "$DIAG/error.log"
            exit 1
          fi
          mkdir -p "$ARTIFACT_ROOT/dtbo/files"
          for built in "${native_dtbo[@]}"; do
            cp "$built" "$ARTIFACT_ROOT/dtbo/files/$(basename "$built")"
          done
          sha256sum "$ARTIFACT_ROOT/dtbo/files"/* > "$ARTIFACT_ROOT/dtbo/SHA256SUMS"

      - name: 04 - Package DTBO image only when valid overlays exist
        shell: bash
        run: |
          set -euxo pipefail 2>&1 | tee "$DIAG/04-dtbo-package.log"
          mkdir -p "$ARTIFACT_ROOT/dtbo"
          if [ -n "${MKDTIMG:-}" ] && [ -x "$MKDTIMG" ]; then
            "$MKDTIMG" create "$ARTIFACT_ROOT/dtbo/dtbo.img" --page_size=4096 "$ARTIFACT_ROOT/dtbo/files"/*.dtbo
            test -s "$ARTIFACT_ROOT/dtbo/dtbo.img"
            sha256sum "$ARTIFACT_ROOT/dtbo/dtbo.img" >> "$ARTIFACT_ROOT/dtbo/SHA256SUMS"
          else
            echo 'mkdtimg is unavailable in this runner; individual validated .dtbo blobs are still emitted. dtbo.img packaging is intentionally failed rather than fabricated.' | tee "$DIAG/error.log"
            exit 1
          fi

      - name: 05 - Upload DTBO/errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-v4-DTBO-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_ROOT }}/dtbo/**
            ${{ env.DIAG }}/**
            ${{ env.DIAG }}/error.log
            ${{ env.DIAG }}/error-summary.log
          if-no-files-found: warn
