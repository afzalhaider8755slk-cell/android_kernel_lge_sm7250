            # all newer-kernel code unchanged.
            KSU_PKG_OBSERVER_C="drivers/kernelsu/manager/pkg_observer.c"
            test -f "$KSU_PKG_OBSERVER_C"
            if ! grep -q 'LG KSU 4.19 pkg_observer fsnotify compatibility' "$KSU_PKG_OBSERVER_C"; then
              python3 - "$KSU_PKG_OBSERVER_C" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()
          marker = "/* LG KSU 4.19 pkg_observer fsnotify compatibility */"
          if marker in s:
