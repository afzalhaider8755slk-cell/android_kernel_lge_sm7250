name: V1-LM-G900-KARNAL-BUILT

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_REF: sixteen

  CIP_OLD: v4.19.325-cip132
  CIP_TARGET: v4.19.325-cip133

  KSU_VERSION: v3.3.0

  # IMPORTANT:
  # The official SUSFS tree has newer 2.x/2.3.x branches for newer kernels,
  # but the maintained kernel-4.19 branch is the compatible legacy patch line
  # and currently carries SUSFS 1.5.5. Do not substitute a 5.x/6.x SUSFS patch
  # into this 4.19 tree automatically.
  SUSFS_BRANCH: kernel-4.19
  SUSFS_VERSION: 1.5.5

  # Exact SHA256 of the uploaded known-good baseline kernel Image.
  BASELINE_KERNEL_SHA256: 85dd6083fd5a34135f301de661cae5f90b1aee82f4f5aa8d6dee30eacd34659d

  CLANG_REV: clang-r563880c
  WORKFLOW_VERSION: V1

jobs:
  build:
    name: Build V1
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::[1/9] Checkout"
          git clone --depth=1 --branch "${KERNEL_REF}" "${KERNEL_REPO}" kernel
          cd kernel
          git fetch --unshallow >/dev/null 2>&1
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)" > ../source-info.txt
          printf 'SOURCE_BRANCH=%s\n' "${KERNEL_REF}" >> ../source-info.txt
          echo "[OK] Source checked out"
          echo "::endgroup::"

      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::[2/9] Prepare toolchain"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache clang flex \
            gcc-aarch64-linux-gnu git lld libssl-dev \
            libelf-dev libncurses-dev python3 rsync unzip zip \
            wget curl device-tree-compiler >/dev/null

          git clone --depth=1 --branch "${CLANG_REV}" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-prebuilt >/dev/null 2>&1 || {
              echo "[ERROR] Could not fetch ${CLANG_REV}" >&2
              exit 1
            }

          export CLANG_BIN="$GITHUB_WORKSPACE/clang-prebuilt/${CLANG_REV}/bin"
          test -x "${CLANG_BIN}/clang"
          "${CLANG_BIN}/clang" --version | head -n 1 > toolchain-version.txt

          echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"
          echo "[OK] Android Clang ${CLANG_REV}"
          echo "::endgroup::"

      - name: Verify known-good baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::[3/9] Verify baseline"
          cd kernel

          test "$(make -s kernelversion)" = "4.19.325"
          git grep -n "cip132" -- Makefile scripts 2>/dev/null | head -5 > ../baseline-cip.txt || true

          {
            echo "expected_baseline_kernel_sha256=${BASELINE_KERNEL_SHA256}"
            echo "expected_kernel_version=4.19.325"
            echo "expected_cip_suffix=cip132"
            echo "expected_arch=arm64"
          } > ../baseline-info.txt

          git status --short > ../baseline-git-status.txt
          echo "[OK] Kernel source reports Linux 4.19.325"
          echo "::endgroup::"

      - name: Apply CIP 132 -> 133
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::[4/9] Apply CIP ${CIP_OLD} -> ${CIP_TARGET}"
          cd kernel
          mkdir -p ../logs

          git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          git fetch --no-tags cip \
            "refs/tags/${CIP_OLD}:refs/tags/${CIP_OLD}" \
            "refs/tags/${CIP_TARGET}:refs/tags/${CIP_TARGET}" \
            > ../logs/cip-fetch.log 2>&1

          {
            echo "CIP old: ${CIP_OLD}"
            echo "CIP target: ${CIP_TARGET}"
            git show -s --format='%H %s' "${CIP_OLD}"
            git show -s --format='%H %s' "${CIP_TARGET}"
            echo
            echo "CIP delta:"
            git diff --stat "${CIP_OLD}..${CIP_TARGET}"
          } > ../logs/cip-version.log

          # Never replace the whole LG tree with CIP. Apply only the CIP delta.
          git diff --binary "${CIP_OLD}..${CIP_TARGET}" > ../logs/cip-132-to-133.patch

          if ! git apply --check --3way ../logs/cip-132-to-133.patch \
              > ../logs/cip-check.log 2>&1; then
            echo "[ERROR] CIP patch is not cleanly applicable to the LG baseline."
            echo "[ERROR] Build stopped intentionally; no automatic conflict resolution."
            exit 1
          fi

          git apply --3way --index ../logs/cip-132-to-133.patch \
            > ../logs/cip-apply.log 2>&1

          echo "[OK] CIP delta applied"
          echo "::endgroup::"

      - name: Integrate KernelSU-Next v3.3.0
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::[5/9] KernelSU-Next ${KSU_VERSION}"
          cd kernel
          mkdir -p ../logs

          curl -fsSL \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_VERSION}/kernel/setup.sh" \
            -o ../logs/ksu-setup.sh
          chmod +x ../logs/ksu-setup.sh

          bash ../logs/ksu-setup.sh "${KSU_VERSION}" \
            > ../logs/kernelsu.log 2>&1

          test -d KernelSU-Next
          test -L drivers/kernelsu
          grep -q 'CONFIG_KSU' drivers/kernelsu/Kconfig

          echo "[OK] KernelSU-Next ${KSU_VERSION} integrated"
          echo "::endgroup::"

      - name: Integrate SUSFS kernel-4.19 patchset
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::[6/9] SUSFS ${SUSFS_VERSION} (${SUSFS_BRANCH})"
          cd kernel
          mkdir -p ../susfs-src ../logs

          git clone --depth=1 --branch "${SUSFS_BRANCH}" \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs-src \
            > ../logs/susfs-clone.log 2>&1

          {
            echo "SUSFS branch: ${SUSFS_BRANCH}"
            git -C ../susfs-src log -1 --oneline
            echo
            echo "SUSFS module version:"
            sed -n '1,40p' ../susfs-src/ksu_module_susfs/module.prop
          } > ../logs/susfs-version.log

          # The 4.19 branch is the source-specific patch line. Newer 2.x/2.3.x
          # branches target newer kernels and are not substituted automatically.
          test -f ../susfs-src/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          test -f ../susfs-src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          test -f ../susfs-src/kernel_patches/fs/susfs.c
          test -f ../susfs-src/kernel_patches/include/linux/susfs.h

          cp ../susfs-src/kernel_patches/fs/susfs.c fs/susfs.c
          cp ../susfs-src/kernel_patches/include/linux/susfs.h include/linux/susfs.h

          if ! patch --dry-run -p1 \
              < ../susfs-src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
              > ../logs/susfs-ksu-check.log 2>&1; then
            echo "[ERROR] SUSFS 4.19 -> KernelSU-Next compatibility patch did not apply cleanly."
            echo "[ERROR] No forced/manual conflict resolution is performed by V1."
            exit 1
          fi

          patch -p1 \
            < ../susfs-src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            > ../logs/susfs-ksu-apply.log 2>&1

          if ! patch --dry-run -p1 \
              < ../susfs-src/kernel_patches/50_add_susfs_in_kernel-4.19.patch \
              > ../logs/susfs-kernel-check.log 2>&1; then
            echo "[ERROR] SUSFS 4.19 kernel patch did not apply cleanly."
            echo "[ERROR] No forced/manual conflict resolution is performed by V1."
            exit 1
          fi

          patch -p1 \
            < ../susfs-src/kernel_patches/50_add_susfs_in_kernel-4.19.patch \
            > ../logs/susfs-kernel-apply.log 2>&1

          echo "[OK] SUSFS patchset applied cleanly"
          echo "::endgroup::"

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::[7/9] Configure + build"
          cd kernel
          mkdir -p ../logs out

          # Discover a Cayman/SM7250 defconfig instead of guessing a filename.
          mapfile -t DEFS < <(
            find arch/arm64/configs -maxdepth 2 -type f \
              \( -iname '*cayman*defconfig' -o \
                 -iname '*sm7250*defconfig' -o \
                 -iname '*g900*defconfig' \) \
              -print | sort
          )

          if [ "${#DEFS[@]}" -ne 1 ]; then
            echo "[ERROR] Expected exactly one Cayman/SM7250/G900 defconfig; found ${#DEFS[@]}."
            printf '%s\n' "${DEFS[@]}" > ../logs/defconfig-candidates.log
            exit 1
          fi

          DEFCONFIG="${DEFS[0]#arch/arm64/configs/}"
          echo "DEFCONFIG=${DEFCONFIG}" > ../logs/defconfig.log

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"

          make O=out "${DEFCONFIG}" > ../logs/defconfig-build.log 2>&1

          ./scripts/config --file out/.config \
            --enable KSU \
            --enable KSU_SUSFS

          # Keep the SUSFS feature surface conservative for the first build.
          # Only options that actually exist are enabled; unknown symbols fail
          # the verification step rather than being silently invented.
          for sym in \
            KSU_SUSFS_SUS_PATH \
            KSU_SUSFS_SUS_MOUNT \
            KSU_SUSFS_SUS_KSTAT \
            KSU_SUSFS_SUS_MAPS \
            KSU_SUSFS_SUS_MEMFD \
            KSU_SUSFS_TRY_UMOUNT \
            KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          do
            if grep -q "^config ${sym}$" drivers/kernelsu/Kconfig fs/Kconfig* 2>/dev/null; then
              ./scripts/config --file out/.config --enable "${sym}"
            fi
          done

          make O=out olddefconfig > ../logs/olddefconfig.log 2>&1

          {
            grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS)=' out/.config || true
            make -s O=out kernelversion
          } > ../logs/config-summary.txt

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config

          # Build with the same Android Clang generation seen in the uploaded
          # known-good Image (clang 21.0.0 / r563880c).
          make O=out -j"$(nproc)" \
            CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            HOSTCC=clang HOSTCXX=clang++ \
            > ../logs/kernel-build.log 2>&1

          test -s out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image > ../logs/output-image.sha256

          echo "[OK] Kernel build completed"
          echo "::endgroup::"

      - name: Package outputs and logs
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::[8/9] Package"
          cd "$GITHUB_WORKSPACE"

          rm -rf release work-anykernel
          mkdir -p release/logs release/build-info release/checksums work-anykernel

          cp kernel/out/arch/arm64/boot/Image \
            release/kernel-image

          # Minimal AnyKernel3 package. AnyKernel3 itself resolves the boot
          # partition at flash time; no hard-coded block path is inserted.
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git work-anykernel \
            > logs-anykernel-clone.log 2>&1

          rm -rf work-anykernel/.git
          rm -rf work-anykernel/modules work-anykernel/ramdisk

          cp kernel/out/arch/arm64/boot/Image work-anykernel/Image

          cat > work-anykernel/anykernel.sh <<'AK3'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=V1-LM-G900-KARNAL
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          '; }

          block=auto
          is_slot_device=auto
          ramdisk_compression=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          AK3

          (
            cd work-anykernel
            zip -qr ../release/AnyKernel3-OrangeFox-Flashable.zip .
          )

          # kernel.zip is intentionally a simple payload ZIP containing the
          # raw ARM64 Image and build metadata; the AnyKernel3 ZIP is the
          # recovery-flashable package.
          mkdir -p release/kernel-payload
          cp kernel/out/arch/arm64/boot/Image release/kernel-payload/Image
          cp source-info.txt baseline-info.txt toolchain-version.txt \
            release/build-info/
          cp baseline-cip.txt release/build-info/ 2>/dev/null || true
          cp logs-anykernel-clone.log release/logs/

          (
            cd release/kernel-payload
            zip -qr ../kernel.zip .
          )
          rm -rf release/kernel-payload

          cp logs/*.log release/logs/ 2>/dev/null || true
          cp logs/*.patch release/logs/ 2>/dev/null || true

          {
            echo "workflow=${WORKFLOW_VERSION}"
            echo "workflow_name=V1-LM-G900-KARNAL-BUILT"
            echo "kernel_output=4.19.325"
            echo "cip_target=${CIP_TARGET}"
            echo "kernelsu_next=${KSU_VERSION}"
            echo "susfs_branch=${SUSFS_BRANCH}"
            echo "susfs_version=${SUSFS_VERSION}"
            echo "clang=${CLANG_REV}"
            echo "baseline_kernel_sha256=${BASELINE_KERNEL_SHA256}"
            echo "source_commit=$(git -C kernel rev-parse HEAD)"
          } > release/build-info/build-manifest.txt

          sha256sum \
            release/kernel-image \
            release/kernel.zip \
            release/AnyKernel3-OrangeFox-Flashable.zip \
            > release/checksums/SHA256SUMS

          rm -f release/kernel-image

          # Put every log inside the final V1 output artifact.
          (
            cd release
            zip -qr "../V1-LM-G900-KARNAL-output.zip" .
          )

          echo "[OK] Packaging completed"
          echo "::endgroup::"

      - name: Verify final artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::[9/9] Verify"
          unzip -t V1-LM-G900-KARNAL-output.zip >/dev/null
          unzip -l V1-LM-G900-KARNAL-output.zip | sed -n '1,80p'
          echo "[OK] V1-LM-G900-KARNAL-output.zip is a valid ZIP"
          echo "::endgroup::"

      - name: Upload final V1 output
        uses: actions/upload-artifact@v5
        with:
          name: V1-LM-G900-KARNAL-output
          path: V1-LM-G900-KARNAL-output.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete logs
        uses: actions/upload-artifact@v5
        with:
          name: V1-LM-G900-KARNAL-logs
          path: |
            logs/
            baseline-info.txt
            baseline-cip.txt
            source-info.txt
            toolchain-version.txt
          if-no-files-found: warn
          retention-days: 30
