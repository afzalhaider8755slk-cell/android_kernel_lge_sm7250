name: "LG Velvet LM-G900 • Android 16 QPR2 • Kernel + DTBO • Fixed Forward"

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Build kernel"
        required: true
        default: true
        type: boolean
      build_dtbo:
        description: "Build DTBO.img"
        required: true
        default: true
        type: boolean
  push:
    branches: ["sixteen"]
    paths:
      - ".github/workflows/**"
      - "arch/arm64/configs/vendor/caymanlm_defconfig"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "sound/**"
      - "techpack/**"
      - "Makefile"
      - "localversion-*"
      - "arch/arm64/boot/dts/**"

permissions:
  contents: read

env:
  DEVICE: LM-G900
  TARGET_VARIANT: G900EMW
  CODENAME: caymanlm
  KERNEL_BRANCH: sixteen
  DEFCONFIG: vendor/caymanlm_defconfig
  KERNEL_EXPECTED: "4.19.325"
  BASE_KERNEL_TAG: "v4.19.325"
  CIP_TAG: "v4.19.325-cip135"
  LLVM_VERSION: "18"
  SUKISU_REF: "4.1.3"
  SUSFS_REF: "001e69919c6271f690fd00b17e4c721c9e599152"
  SUSFS_BRANCH: kernel-4.19
  ANYKERNEL3_REF: dca9dc370838d919d56c1f59ec78b27a14a72c68

jobs:
  kernel:
    if: ${{ github.event_name == 'push' || inputs.build_kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "K01 • Checkout exact source commit"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: "K02 • Install kernel dependencies"
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential ccache clang-18 lld-18 llvm-18 \
            libssl-dev libelf-dev libdw-dev dwarves python3 rsync patch \
            git curl wget unzip zip xz-utils device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gawk file

      - name: "K03 • Numbered diagnostics + immutable source identity"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci-diagnostics/kernel kernel/out
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current || true)"
            echo "device=${DEVICE}"
            echo "codename=${CODENAME}"
            echo "target=Android 16 QPR2 GSI / API 36"
            echo "kernel_expected=${KERNEL_EXPECTED}-cip135"
            echo "features=SukiSU-Ultra+KPM+SUSFS+WALT+SchedTune+ZRAM+LTO"
            echo "hardware=Fingerprint+Vibration+DualSIM+Audio+VoWiFi"
          } | tee ci-diagnostics/kernel/00-context.txt
          git log -1 --decorate --oneline | tee ci-diagnostics/kernel/00-source.txt
          git status --short | tee ci-diagnostics/kernel/00-git-status.txt

      - name: "K04 • Toolchain preflight"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          clang-${LLVM_VERSION} --version | tee ci-diagnostics/kernel/01-clang-version.txt
          ld.lld-${LLVM_VERSION} --version | tee ci-diagnostics/kernel/01-lld-version.txt
          aarch64-linux-gnu-as --version | head -n 1 | tee ci-diagnostics/kernel/01-as-version.txt
          printf '.text\n.global smoke_symbol\nsmoke_symbol:\n nop\n' > "$RUNNER_TEMP/smoke.S"
          clang-${LLVM_VERSION} --target=aarch64-linux-gnu -c "$RUNNER_TEMP/smoke.S" -o "$RUNNER_TEMP/smoke.o"
          ld.lld-${LLVM_VERSION} -r "$RUNNER_TEMP/smoke.o" -o "$RUNNER_TEMP/smoke-linked.o"
          file "$RUNNER_TEMP/smoke-linked.o" | tee ci-diagnostics/kernel/01-aarch64-smoke.txt

      - name: "K05 • Baseline defconfig"
        shell: bash
        run: |
          set -o pipefail
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          DEF="arch/arm64/configs/${DEFCONFIG}"
          test -s "$DEF"
          sha256sum "$DEF" | tee ci-diagnostics/kernel/02-defconfig.sha256
          make O=kernel/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} \
            HOSTAS=clang-${LLVM_VERSION} LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} \
            NM=llvm-nm-${LLVM_VERSION} OBJCOPY=llvm-objcopy-${LLVM_VERSION} \
            OBJDUMP=llvm-objdump-${LLVM_VERSION} READELF=llvm-readelf-${LLVM_VERSION} \
            STRIP=llvm-strip-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEF" 2>&1 | tee ci-diagnostics/kernel/03-defconfig.log
          rc=${PIPESTATUS[0]}
          cp kernel/out/.config ci-diagnostics/kernel/working-baseline.config || true
          exit "$rc"

      - name: "K06 • FIX CIP135 integration — real merge, deterministic conflict resolution, no silent skip"
        shell: bash
        run: |
          set -u
          mkdir -p ci-diagnostics/kernel
          exec > >(tee ci-diagnostics/kernel/04-cip-integration.log) 2>&1
          git config user.name "CI CIP integrator"
          git config user.email "ci@example.invalid"

          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git remote add cip-upstream https://gitlab.com/cip-project/cip-kernel/linux-cip.git

          git fetch --no-tags linux-stable "refs/tags/${BASE_KERNEL_TAG}"
          git fetch --no-tags cip-upstream "refs/tags/${CIP_TAG}"

          BASE_SHA="$(git rev-parse "refs/tags/${BASE_KERNEL_TAG}")"
          CIP_SHA="$(git rev-parse FETCH_HEAD)"
          LG_SHA="$(git rev-parse HEAD)"

          {
            echo "base_tag=${BASE_KERNEL_TAG}"
            echo "base_commit=${BASE_SHA}"
            echo "cip_tag=${CIP_TAG}"
            echo "cip_commit=${CIP_SHA}"
            echo "lg_commit=${LG_SHA}"
          } | tee ci-diagnostics/kernel/04-cip-resolved.txt

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${CIP_SHA}^{commit}"
          git cat-file -e "${LG_SHA}^{commit}"

          # The previous workflow tried to apply the entire CIP tree as one
          # synthetic patch. That produced dozens of artificial 3-way rejects.
          # Here CIP is merged as the actual descendant of v4.19.325.
          git merge-base "${BASE_SHA}" "${CIP_SHA}" | tee ci-diagnostics/kernel/04-cip-merge-base.txt
          test "$(git merge-base "${BASE_SHA}" "${CIP_SHA}")" = "${BASE_SHA}"

          set +e
          git merge --no-ff --no-edit -X theirs "${CIP_SHA}" \
            2>&1 | tee ci-diagnostics/kernel/05-cip-merge.log
          rc=${PIPESTATUS[0]}
          set -e

          git diff --name-only --diff-filter=U | tee ci-diagnostics/kernel/05-cip-unmerged.txt
          git status --short | tee ci-diagnostics/kernel/05-cip-status.txt

          if [ -s ci-diagnostics/kernel/05-cip-unmerged.txt ]; then
            echo "::error::CIP135 still has unresolved conflicts."
            git diff --cc | tee ci-diagnostics/kernel/05-cip-conflict.diff >/dev/null || true
            git diff --check | tee ci-diagnostics/kernel/05-cip-diff-check.txt || true
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::CIP135 merge failed; refusing a partial kernel."
            exit "$rc"
          fi

          test -f localversion-cip
          grep -q -- '-cip135' localversion-cip
          git diff --check
          git log -1 --oneline | tee ci-diagnostics/kernel/05-cip-result.txt
          git diff --stat "${LG_SHA}" HEAD | tee ci-diagnostics/kernel/05-cip-stat.txt
          echo "CIP135 merged as real history; no unresolved conflict and no file was silently skipped." \
            | tee ci-diagnostics/kernel/05-cip-merge-status.txt

      - name: "K07 • Integrate pinned SukiSU-Ultra 4.1.3 builtin"
        shell: bash
        run: |
          set -o pipefail
          curl -LSs --fail --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SUKISU_REF}/kernel/setup.sh" \
            -o ci-diagnostics/kernel/06-sukisu-setup.sh
          chmod +x ci-diagnostics/kernel/06-sukisu-setup.sh
          sha256sum ci-diagnostics/kernel/06-sukisu-setup.sh | tee ci-diagnostics/kernel/06-sukisu-setup.sha256
          bash ci-diagnostics/kernel/06-sukisu-setup.sh builtin \
            2>&1 | tee ci-diagnostics/kernel/06-sukisu.log

      - name: "K08 • Apply SUSFS 1.5.5 kernel-4.19 patch"
        shell: bash
        run: |
          set -u
          work="$RUNNER_TEMP/susfs"
          rm -rf "$work"
          git clone --depth=1 --branch "$SUSFS_BRANCH" \
            https://gitlab.com/simonpunk/susfs4ksu.git "$work" \
            2>&1 | tee ci-diagnostics/kernel/07-susfs-clone.log
          git -C "$work" fetch --depth=1 origin "$SUSFS_REF"
          git -C "$work" checkout --detach "$SUSFS_REF"
          cp "$work/kernel_patches/50_add_susfs_in_kernel-4.19.patch" ci-diagnostics/kernel/07-susfs.patch
          rsync -a "$work/kernel_patches/fs/" fs/
          rsync -a "$work/kernel_patches/include/linux/" include/linux/
          set +e
          patch -p1 --forward --batch --fuzz=0 < ci-diagnostics/kernel/07-susfs.patch \
            2>&1 | tee ci-diagnostics/kernel/07-susfs-patch.log
          rc=${PIPESTATUS[0]}
          set -e
          find . -type f \( -name '*.orig' -o -name '*.rej' \) -print | tee ci-diagnostics/kernel/07-susfs-rejects.txt
          if [ -s ci-diagnostics/kernel/07-susfs-rejects.txt ]; then
            echo "::error::SUSFS has unresolved rejects; nothing was discarded."
            exit 1
          fi
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --include='*.c' --include='*.h' --include='Kconfig*' . \
             > ci-diagnostics/kernel/07-susfs-conflicts.txt; then
            echo "::error::SUSFS left conflict markers."
            exit 1
          fi
          exit "$rc"

      - name: "K09 • Preserve LM-G900 identity + finalized feature set"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          OUT="$PWD/kernel/out"
          scripts/config --file "$OUT/.config" --set-str CONFIG_LOCALVERSION "-LM-G900"
          required=(
            CONFIG_KSU CONFIG_KPM CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL
            CONFIG_SCHED_WALT CONFIG_SCHED_TUNE CONFIG_CPU_FREQ_GOV_SCHEDUTIL
            CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_LTO_CLANG CONFIG_LTO_CLANG_THIN
            CONFIG_RANDOMIZE_BASE CONFIG_STACKPROTECTOR_STRONG CONFIG_HARDENED_USERCOPY
            CONFIG_SLAB_FREELIST_RANDOM CONFIG_SLAB_FREELIST_HARDENED
            CONFIG_DM_VERITY CONFIG_DM_VERITY_FEC CONFIG_FS_VERITY CONFIG_BPF CONFIG_BPF_JIT
            CONFIG_OVERLAY_FS CONFIG_TMPFS_XATTR CONFIG_TMPFS_POSIX_ACL
          )
          for sym in "${required[@]}"; do
            grep -Rqs --exclude-dir=.git -E "^[[:space:]]*(menuconfig|config)[[:space:]]+${sym#CONFIG_}([[:space:]]|$)" . \
              || { echo "::error::Required symbol $sym is missing from source"; exit 1; }
          done
          scripts/config --file "$OUT/.config" \
            -e CONFIG_KSU -e CONFIG_KPM -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_SCHED_WALT -e CONFIG_SCHED_TUNE -e CONFIG_CPU_FREQ_GOV_SCHEDUTIL \
            -e CONFIG_ZRAM -e CONFIG_ZSMALLOC -e CONFIG_LTO_CLANG -e CONFIG_LTO_CLANG_THIN \
            -e CONFIG_RANDOMIZE_BASE -e CONFIG_STACKPROTECTOR_STRONG -e CONFIG_HARDENED_USERCOPY \
            -e CONFIG_SLAB_FREELIST_RANDOM -e CONFIG_SLAB_FREELIST_HARDENED \
            -e CONFIG_DM_VERITY -e CONFIG_DM_VERITY_FEC -e CONFIG_FS_VERITY \
            -e CONFIG_BPF -e CONFIG_BPF_JIT -e CONFIG_OVERLAY_FS -e CONFIG_TMPFS_XATTR \
            -e CONFIG_TMPFS_POSIX_ACL
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} \
            HOSTAS=clang-${LLVM_VERSION} LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} \
            NM=llvm-nm-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig \
            2>&1 | tee ci-diagnostics/kernel/08-olddefconfig.log
          cp "$OUT/.config" ci-diagnostics/kernel/final.config
          for sym in "${required[@]}"; do
            grep -q "^${sym}=y$" "$OUT/.config" || {
              echo "::error::$sym was not enabled after olddefconfig"; exit 1;
            }
          done
          grep -E '^(CONFIG_(KSU|KPM|KALLSYMS|KALLSYMS_ALL|SCHED_WALT|SCHED_TUNE|CPU_FREQ_GOV_SCHEDUTIL|ZRAM|ZSMALLOC|LTO_CLANG|LTO_CLANG_THIN))=' \
            "$OUT/.config" | tee ci-diagnostics/kernel/08-final-feature-check.txt

      - name: "K10 • Build ARM64 kernel + modules"
        shell: bash
        run: |
          set -o pipefail
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          make O=kernel/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} \
            HOSTAS=clang-${LLVM_VERSION} LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} \
            NM=llvm-nm-${LLVM_VERSION} OBJCOPY=llvm-objcopy-${LLVM_VERSION} \
            OBJDUMP=llvm-objdump-${LLVM_VERSION} READELF=llvm-readelf-${LLVM_VERSION} \
            STRIP=llvm-strip-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc --all)" Image.gz-dtb modules \
            2>&1 | tee ci-diagnostics/kernel/10-build.log

      - name: "K11 • Verify kernel identity and image"
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$PWD/kernel/out"
          test -s "$OUT/arch/arm64/boot/Image.gz-dtb" || test -s "$OUT/arch/arm64/boot/Image"
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          make -s O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} \
            HOSTAS=clang-${LLVM_VERSION} LD=ld.lld-${LLVM_VERSION} \
            CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee ci-diagnostics/kernel/11-kernelrelease.txt
          grep -q '4.19.325-LM-G900-cip135' ci-diagnostics/kernel/11-kernelrelease.txt
          file "$OUT/arch/arm64/boot/"Image* | tee ci-diagnostics/kernel/11-image-file.txt
          find "$OUT" -type f -name '*.ko' -print0 | sort -z | xargs -0 -r sha256sum \
            | tee ci-diagnostics/kernel/11-modules.sha256

      - name: "K12 • Package OrangeFox/AnyKernel3 flash ZIP"
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/AnyKernel3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$RUNNER_TEMP/AnyKernel3"
          cd "$RUNNER_TEMP/AnyKernel3"
          git fetch --depth=1 origin "$ANYKERNEL3_REF"
          git checkout --detach "$ANYKERNEL3_REF"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/12-anykernel3-resolved.txt"
          rm -rf .git
          if [ -s "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" .
          else
            cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" .
          fi
          cat > anykernel.sh <<'AK3'
          properties() {
            kernel.string=LG Velvet LM-G900 • Android 16 QPR2 • 4.19.325-LM-G900-cip135 • SukiSU-Ultra 4.1.3 • SUSFS 1.5.5 • KPM
            do.devicecheck=0
            do.modules=0
            do.systemless=0
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=LM-G900
          }
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          AK3
          zip -r9 "$GITHUB_WORKSPACE/LG-Velvet-LM-G900-Android16QPR2-cip135-SukiSU4.1.3-SUSFS1.5.5-KPM-OrangeFox.zip" . \
            -x '.git/*' '*.md' 'README*' > "$GITHUB_WORKSPACE/ci-diagnostics/kernel/12-zip.log"
          sha256sum "$GITHUB_WORKSPACE/LG-Velvet-LM-G900-Android16QPR2-cip135-SukiSU4.1.3-SUSFS1.5.5-KPM-OrangeFox.zip" \
            | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/12-zip.sha256"

      - name: "K13 • Upload kernel artifact + COMPLETE logs ALWAYS"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-KERNEL-FIXED-${{ github.run_id }}"
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/**/*.ko
            LG-Velvet-LM-G900-Android16QPR2-cip135-SukiSU4.1.3-SUSFS1.5.5-KPM-OrangeFox.zip
            ci-diagnostics/kernel/**
          if-no-files-found: warn
          retention-days: 30

  dtbo:
    if: ${{ github.event_name == 'push' || inputs.build_dtbo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "D01 • Checkout exact source commit"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: "D02 • Install DTBO dependencies"
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential clang-18 lld-18 llvm-18 \
            libssl-dev libelf-dev libdw-dev dwarves python3 rsync patch \
            git curl wget unzip zip xz-utils device-tree-compiler file gawk \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: "D03 • Numbered DTBO diagnostics"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci-diagnostics/dtbo dtbo/out
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=$(git rev-parse HEAD)"
            echo "device=${DEVICE}"
            echo "codename=${CODENAME}"
            echo "target=Android 16 QPR2 GSI / API 36"
            echo "source_dts_root=arch/arm64/boot/dts/vendor/lge/lito-caymanlm"
            echo "matched_kernel_source_sha=$(git rev-parse HEAD)"
          } | tee ci-diagnostics/dtbo/00-context.txt
          git log -1 --decorate --oneline | tee ci-diagnostics/dtbo/00-source.txt

      - name: "D04 • Verify caymanlm DT source + exact selected overlay"
        shell: bash
        run: |
          set -euxo pipefail
          test -s "arch/arm64/configs/${DEFCONFIG}"
          test -d arch/arm64/boot/dts/vendor/lge/lito-caymanlm
          find arch/arm64/boot/dts/vendor/lge/lito-caymanlm -type f -name '*.dts' -print | sort \
            | tee ci-diagnostics/dtbo/01-dts-inventory.txt
          grep -RInE '^CONFIG_(MACH_LITO_CAYMANLM|MACH_LITO_CAYMANLM_LAO_COM|MACH_LITO_CAYMANLM_DCM_JP|MACH_LITO_CAYMANLM_SB_JP)=' \
            "arch/arm64/configs/${DEFCONFIG}" | tee ci-diagnostics/dtbo/02-device-config.txt
          test "$(grep -Ec '^CONFIG_MACH_LITO_CAYMANLM=y$' "arch/arm64/configs/${DEFCONFIG}")" -eq 1
          regions=$(grep -Ec '^CONFIG_MACH_LITO_CAYMANLM_(LAO_COM|DCM_JP|SB_JP)=y$' \
            "arch/arm64/configs/${DEFCONFIG}" || true)
          test "$regions" -eq 1

      - name: "D05 • Generate exact caymanlm DTBO config"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          make O=dtbo/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} \
            HOSTAS=clang-${LLVM_VERSION} LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} \
            NM=llvm-nm-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- \
            "${DEFCONFIG}" 2>&1 | tee ci-diagnostics/dtbo/03-defconfig.log
          scripts/config --file dtbo/out/.config --enable CONFIG_BUILD_ARM64_DT_OVERLAY
          make O=dtbo/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} \
            HOSTAS=clang-${LLVM_VERSION} LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} \
            NM=llvm-nm-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig \
            2>&1 | tee ci-diagnostics/dtbo/04-olddefconfig.log
          cp dtbo/out/.config ci-diagnostics/dtbo/05-final.config
          grep -E '^CONFIG_(MACH_LITO_CAYMANLM|MACH_LITO_CAYMANLM_LAO_COM|MACH_LITO_CAYMANLM_DCM_JP|MACH_LITO_CAYMANLM_SB_JP|BUILD_ARM64_DT_OVERLAY)=' \
            dtbo/out/.config | tee ci-diagnostics/dtbo/05-final-config.txt

      - name: "D06 • Preserve existing CI-only Kbuild typo fix"
        shell: bash
        run: |
          set -euxo pipefail
          f=arch/arm64/boot/dts/vendor/lge/Makefile
          test -s "$f"
          cp "$f" ci-diagnostics/dtbo/06-lge-makefile-before
          grep -qF 'wildcard echo $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts' "$f"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('arch/arm64/boot/dts/vendor/lge/Makefile')
          s=p.read_text()
          old='$(wildcard echo $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts)'
          new='$(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts)'
          if s.count(old) != 1:
              raise SystemExit('Known DTBO wildcard typo changed unexpectedly')
          p.write_text(s.replace(old,new,1))
          PY
          diff -u ci-diagnostics/dtbo/06-lge-makefile-before "$f" \
            | tee ci-diagnostics/dtbo/06-makefile-ci-fix.diff
          sha256sum "$f" | tee ci-diagnostics/dtbo/06-makefile-after.sha256

      - name: "D07 • Build DT overlays"
        shell: bash
        run: |
          set -o pipefail
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          make O=dtbo/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} \
            HOSTAS=clang-${LLVM_VERSION} LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} \
            NM=llvm-nm-${LLVM_VERSION} OBJCOPY=llvm-objcopy-${LLVM_VERSION} \
            OBJDUMP=llvm-objdump-${LLVM_VERSION} READELF=llvm-readelf-${LLVM_VERSION} \
            STRIP=llvm-strip-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc --all)" dtbs 2>&1 | tee ci-diagnostics/dtbo/07-dtbo-build.log
          find dtbo/out/arch/arm64/boot/dts -type f -name '*.dtbo' -print | sort \
            | tee ci-diagnostics/dtbo/08-built-dtbo-list.txt
          test -s ci-diagnostics/dtbo/08-built-dtbo-list.txt

      - name: "D08 • Package Android 16 QPR2 DTBO.img"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/mkdtbo"
          curl -fsSL --retry 5 --retry-all-errors \
            'https://android.googlesource.com/platform/system/libufdt/+/refs/heads/android16-qpr2-release/utils/src/mkdtboimg.py?format=TEXT' \
            -o "$RUNNER_TEMP/mkdtbo/mkdtboimg.b64"
          base64 -d "$RUNNER_TEMP/mkdtbo/mkdtboimg.b64" > "$RUNNER_TEMP/mkdtbo/mkdtboimg.py"
          chmod +x "$RUNNER_TEMP/mkdtbo/mkdtboimg.py"
          mapfile -t overlays < ci-diagnostics/dtbo/08-built-dtbo-list.txt
          test "${#overlays[@]}" -gt 0
          python3 "$RUNNER_TEMP/mkdtbo/mkdtboimg.py" create \
            LG-Velvet-LM-G900-Android16QPR2-dtbo.img --page_size=4096 \
            "${overlays[@]}" 2>&1 | tee ci-diagnostics/dtbo/10-mkdtboimg.log
          test -s LG-Velvet-LM-G900-Android16QPR2-dtbo.img

      - name: "D09 • Verify DTBO image"
        shell: bash
        run: |
          set -euxo pipefail
          test "$(stat -c '%s' LG-Velvet-LM-G900-Android16QPR2-dtbo.img)" -le 25165824
          python3 "$RUNNER_TEMP/mkdtbo/mkdtboimg.py" dump \
            LG-Velvet-LM-G900-Android16QPR2-dtbo.img \
            2>&1 | tee ci-diagnostics/dtbo/11-dtbo-dump.txt
          grep -q 'dt_entry_count' ci-diagnostics/dtbo/11-dtbo-dump.txt
          grep -q 'page_size = 4096' ci-diagnostics/dtbo/11-dtbo-dump.txt
          sha256sum LG-Velvet-LM-G900-Android16QPR2-dtbo.img | tee ci-diagnostics/dtbo/12-dtbo.sha256
          file LG-Velvet-LM-G900-Android16QPR2-dtbo.img | tee ci-diagnostics/dtbo/12-dtbo-file.txt
          printf 'device=LM-G900\ncodename=caymanlm\ntarget=Android 16 QPR2 / API 36\npartition=dtbo\n' > DTBO-BUILD-METADATA.txt
          zip -9 LM-G900-Android16QPR2-dtbo.zip \
            LG-Velvet-LM-G900-Android16QPR2-dtbo.img DTBO-BUILD-METADATA.txt
          sha256sum LM-G900-Android16QPR2-dtbo.zip | tee ci-diagnostics/dtbo/13-dtbo-zip.sha256

      - name: "D10 • Upload DTBO artifact + COMPLETE logs ALWAYS"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-DTBO-FIXED-${{ github.run_id }}"
          path: |
            LG-Velvet-LM-G900-Android16QPR2-dtbo.img
            LM-G900-Android16QPR2-dtbo.zip
            DTBO-BUILD-METADATA.txt
            dtbo/out/arch/arm64/boot/dts/**/*.dtbo
            ci-diagnostics/dtbo/**
          if-no-files-found: warn
          retention-days: 30
