name: LG G900 Global - V21 Complete Feature Build

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'LG SM7250 kernel repository'
        required: true
        default: 'afzalhaider8755slk-cell/android_kernel_lge_sm7250'
      kernel_ref:
        description: 'Kernel branch/ref'
        required: true
        default: 'sixteen'
      defconfig:
        description: 'Kernel defconfig'
        required: true
        default: 'lito-perf_defconfig'
      bbg_ref:
        description: 'Baseband-guard immutable ref'
        required: true
        default: 'd4f7302'
      build_jobs:
        description: 'Parallel jobs'
        required: true
        default: '2'

env:
  ARCH: arm64
  SUBARCH: arm64
  CLANG_VERSION: 17
  SUSFS_VERSION: v2.2.0
  # This is the CI-proven v2.2.0 source pin used by current SUSFS builders.
  # The workflow still performs a compatibility gate before applying anything to 4.19.
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_MODULE_REPO: https://gitlab.com/sidex15/susfs4ksu-module.git
  SUSFS_MODULE_REF: v2.2.0
  SUKISU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
  SUKISU_REF: 8dbc1a9
  MAPHIDE_PATCH_URL: https://raw.githubusercontent.com/WildKernels/kernel_patches/main/archived/69_hide_stuff.patch
  BBG_REPO: https://github.com/vc-teahouse/Baseband-guard.git

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kernel_repo }}
          ref: ${{ inputs.kernel_ref }}
          fetch-depth: 1

      - name: Host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk git libelf-dev libssl-dev python3 python3-pip rsync unzip wget xz-utils device-tree-compiler

      - name: Source integrity snapshot
        run: |
          set -euxo pipefail
          git status --short
          git rev-parse HEAD | tee source-commit.txt
          git ls-files -z > /tmp/tracked-before.zlist
          test -f Makefile
          test -d arch/arm64
          test -d fs/proc
          test -d security

      - name: Toolchain
        run: |
          set -euxo pipefail
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilt
          CLANG_BIN="$(find clang-prebuilt -type d -path '*/bin' | head -1)"
          test -n "$CLANG_BIN"
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          clang --version
          ld.lld --version

      - name: Prepare base config without deleting existing features
        run: |
          set -euxo pipefail
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "${{ inputs.defconfig }}"
          test -f out/.config
          cp out/.config out/.config.before-features

      - name: Integrate SukiSU Ultra without destructive cleanup
        run: |
          set -euxo pipefail
          test ! -e KernelSU || true
          git clone --depth 1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/SukiSU-Ultra
          git -C /tmp/SukiSU-Ultra fetch --depth 1 origin "$SUKISU_REF"
          git -C /tmp/SukiSU-Ultra checkout --detach "$SUKISU_REF"
          test -d /tmp/SukiSU-Ultra/kernel
          # Use the project's official setup path; never rm an existing kernel subtree.
          curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/$SUKISU_REF/kernel/setup.sh" -o /tmp/sukisu-setup.sh
          chmod +x /tmp/sukisu-setup.sh
          # Non-GKI + SUSFS: use the official built-in SUSFS integration path.
          bash /tmp/sukisu-setup.sh susfs-main
          test -d drivers/kernelsu
          grep -Rqs 'CONFIG_KSU' drivers/kernelsu kernel 2>/dev/null || true

      - name: Pin and align SUSFS v2.2.0
        run: |
          set -euxo pipefail
          # Exact kernel integration is pinned by SUKISU_REF; verify its SUSFS implementation is v2.2.0.
          grep -Rqs 'v2\.2\.0\|2\.2\.0' drivers/kernelsu include/linux 2>/dev/null || {
            echo 'Pinned SukiSU snapshot does not contain SUSFS v2.2.0'; exit 1;
          }
          test -d drivers/kernelsu
          # Exact userspace pairing is pinned separately.
          git clone --depth 1 --branch "$SUSFS_MODULE_REF" "$SUSFS_MODULE_REPO" /tmp/susfs-module
          grep -q '^version=v2\.2\.0' /tmp/susfs-module/module.prop
          echo "SUSFS kernel snapshot: $SUKISU_REF"
          echo "SUSFS userspace: $SUSFS_MODULE_REF"

      - name: Integrate BBG immutably
        run: |
          set -euxo pipefail
          rm -rf /tmp/bbg
          git clone --depth 1 "$BBG_REPO" /tmp/bbg
          git -C /tmp/bbg fetch --depth 1 origin "$BBG_REF"
          git -C /tmp/bbg checkout --detach "$BBG_REF"
          test "$(git -C /tmp/bbg rev-parse --short HEAD)" = "$BBG_REF"
          # Use upstream setup; it is specifically documented for pre-5.1/non-GKI kernels.
          bash /tmp/bbg/setup.sh "$BBG_REF"
          test -e security/baseband-guard
          grep -q 'obj-\$(CONFIG_BBG)' security/Makefile
          grep -q 'security/baseband-guard/Kconfig' security/Kconfig

      - name: Configure complete requested feature contract
        run: |
          set -euxo pipefail
          C=out/.config
          scripts/config --file "$C" --enable CONFIG_KSU
          scripts/config --file "$C" --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --file "$C" --disable CONFIG_KSU_TRACEPOINT_HOOK || true
          # KPROBES remains enabled as a kernel capability; Manual Hook is the active KSU hook on non-GKI.
          scripts/config --file "$C" --enable CONFIG_KPROBES
          scripts/config --file "$C" --enable CONFIG_KALLSYMS
          scripts/config --file "$C" --enable CONFIG_KALLSYMS_ALL
          scripts/config --file "$C" --enable CONFIG_KPM

          # SUSFS core + v2.x capabilities.
          for s in \
            CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_SPOOF_AVC; do
            scripts/config --file "$C" --enable "$s"
          done

          # Required filesystem/security stack.
          for s in CONFIG_EXT4_FS CONFIG_OVERLAY_FS CONFIG_TMPFS_XATTR CONFIG_TMPFS_POSIX_ACL \
            CONFIG_DM_VERITY CONFIG_FS_ENCRYPTION CONFIG_FS_ENCRYPTION_INLINE_CRYPT; do
            scripts/config --file "$C" --enable "$s" || true
          done

          # Networking/performance requested in the feature set.
          for s in CONFIG_TCP_CONG_BBR CONFIG_NET_SCH_FQ CONFIG_NET_SCH_CAKE CONFIG_NET_SCH_PIE \
            CONFIG_WIREGUARD CONFIG_IP_SET CONFIG_IP6_NF_NAT CONFIG_NETFILTER_XT_TARGET_TTL \
            CONFIG_BPF_SYSCALL CONFIG_NETFILTER CONFIG_NETFILTER_ADVANCED; do
            scripts/config --file "$C" --enable "$s" || true
          done

          # Android/device plumbing.
          for s in CONFIG_ANDROID_BINDER_IPC CONFIG_ANDROID_BINDERFS CONFIG_CFG80211 \
            CONFIG_RMNET CONFIG_RMNET_IPA3 CONFIG_QMI_ENCDEC CONFIG_QMI_WWAN CONFIG_USB_CONFIGFS; do
            scripts/config --file "$C" --enable "$s" || true
          done

          # BBG is mandatory for this build.
          scripts/config --file "$C" --enable CONFIG_BBG
          scripts/config --file "$C" --enable CONFIG_BBG_BLOCK_BOOT

          # Keep existing features: never mass-disable unrelated symbols.
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Feature contract verification
        run: |
          set -euxo pipefail
          C=out/.config
          required=(
            CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_KPROBES CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_KPM
            CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_AVC CONFIG_BBG CONFIG_BBG_BLOCK_BOOT CONFIG_EXT4_FS CONFIG_OVERLAY_FS
          )
          for s in "${required[@]}"; do grep -q "^${s}=y$" "$C" || { echo "MISSING: $s"; exit 1; }; done
          # Non-GKI hook architecture: Manual Hook must be active; Tracepoint must not be selected.
          ! grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' "$C"
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$C"

      - name: Source-compatible Futile Maphide integration
        run: |
          set -euxo pipefail
          curl -fsSL "$MAPHIDE_PATCH_URL" -o /tmp/69_hide_stuff.patch
          if git apply --check --whitespace=nowarn /tmp/69_hide_stuff.patch; then
            git apply --whitespace=nowarn /tmp/69_hide_stuff.patch
          else
            echo 'Upstream Maphide patch does not apply verbatim; performing strict 4.19 semantic port.'
            python3 - <<'PY'
          from pathlib import Path
          
          mm = Path('fs/proc/task_mmu.c')
          base = Path('fs/proc/base.c')
          for p in (mm, base):
              if not p.exists():
                  raise SystemExit(f'Missing Maphide translation unit: {p}')
          
          s = mm.read_text()
          if 'show_vma_header_prefix_fake' not in s:
              anchor = 'static void\nshow_map_vma(struct seq_file *m, struct vm_area_struct *vma)'
              if anchor not in s:
                  raise SystemExit('Maphide semantic port: show_map_vma anchor not found')
              helper = '''static void show_vma_header_prefix_fake(struct seq_file *m,
          \t\t\t\t\tunsigned long start, unsigned long end,
          \t\t\t\t\tvm_flags_t flags, unsigned long long pgoff,
          \t\t\t\t\tdev_t dev, unsigned long ino)
          {
          \tseq_setwidth(m, 25 + sizeof(void *) * 6 - 1);
          \tseq_printf(m, "%08lx-%08lx %c%c%c%c %08llx %02x:%02x %lu ",
          \t\tstart, end, flags & VM_READ ? 'r' : '-', flags & VM_WRITE ? 'w' : '-',
          \t\tflags & VM_EXEC ? '-' : '-', flags & VM_MAYSHARE ? 's' : 'p',
          \t\tpgoff, MAJOR(dev), MINOR(dev), ino);
          }
          
          '''
              s = s.replace(anchor, helper + anchor, 1)
          
          if 'jit-zygote-cache' not in s or 'framework-res.apk' not in s:
              needle = 'pgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;'
              if needle not in s:
                  raise SystemExit('Maphide semantic port: pgoff anchor not found')
              block = '''pgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;
          \t\tif (file && file->f_path.dentry) {
          \t\t\tconst char *path = file->f_path.dentry->d_name.name;
          \t\t\tif (strstr(path, "lineage")) {
          \t\t\t\tstart = vma->vm_start; end = vma->vm_end;
          \t\t\t\tshow_vma_header_prefix(m, start, end, flags, pgoff, dev, ino);
          \t\t\t\tname = "/system/framework/framework-res.apk";
          \t\t\t\tgoto done;
          \t\t\t}
          \t\t\tif (strstr(path, "jit-zygote-cache")) {
          \t\t\t\tstart = vma->vm_start; end = vma->vm_end;
          \t\t\t\tshow_vma_header_prefix_fake(m, start, end, flags, pgoff, dev, ino);
          \t\t\t\tgoto bypass;
          \t\t\t}
          \t\t}'''
              s = s.replace(needle, block, 1)
              if 'bypass:' not in s:
                  marker = '\t/*\n\t * Print the dentry name for named mappings'
                  if marker not in s:
                      raise SystemExit('Maphide semantic port: bypass insertion anchor not found')
                  s = s.replace(marker, '\tbypass:\n' + marker, 1)
          mm.write_text(s)
          
          b = base.read_text()
          if 'kern_path("/system/framework/framework-res.apk"' not in b:
              needle = '''if (vma && vma->vm_file) {
          \t\t*path = vma->vm_file->f_path;
          \t\tpath_get(path);
          \t\trc = 0;
          \t}'''
              if needle not in b:
                  raise SystemExit('Maphide semantic port: find_exact_vma block anchor not found')
              repl = '''if (vma) {
          \t\tif (vma->vm_file) {
          \t\t\tif (vma->vm_file->f_path.dentry &&
          \t\t\t\tstrstr(vma->vm_file->f_path.dentry->d_name.name, "lineage")) {
          \t\t\t\trc = kern_path("/system/framework/framework-res.apk", LOOKUP_FOLLOW, path);
          \t\t\t} else {
          \t\t\t\t*path = vma->vm_file->f_path;
          \t\t\t\tpath_get(path);
          \t\t\t\trc = 0;
          \t\t\t}
          \t\t}
          \t}'''
              b = b.replace(needle, repl, 1)
          base.write_text(b)
          PY
          fi
          # Never accept partial patch artifacts.
          ! find fs/proc -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .
          grep -q 'show_vma_header_prefix_fake' fs/proc/task_mmu.c
          grep -q 'jit-zygote-cache' fs/proc/task_mmu.c
          grep -q 'framework-res.apk' fs/proc/task_mmu.c
          grep -q 'kern_path("/system/framework/framework-res.apk"' fs/proc/base.c

      - name: DTB and DTBO feature-complete build
        run: |
          set -euxo pipefail
          test -d arch/arm64/boot/dts/vendor/lge
          test -f arch/arm64/boot/dts/vendor/lge/Makefile
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          # Build the normal device DTB and every existing Global Lao overlay source; do not invent hardware nodes.
          make -j"${{ inputs.build_jobs }}" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 dtbs 2>&1 | tee dtb-build.log
          if command -v dtbs_check >/dev/null 2>&1; then
            make -j"${{ inputs.build_jobs }}" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 dtbs_check 2>&1 | tee dtbs-check.log
          else
            echo 'dtbs_check unavailable in this 4.19 tree; DTB compile + overlay decode verification remains mandatory.'
          fi
          mapfile -t overlays < <(find arch/arm64/boot/dts/vendor/lge -path '*lito-caymanlm/lito-caymanlm_lao_com/*.dts' -type f | sort)
          test "${#overlays[@]}" -gt 0
          printf '%s\n' "${overlays[@]}" > dtbo-sources.txt
          # Build through the LGE Kbuild target names rather than an invalid arch/... target.
          while IFS= read -r src; do
            rel="${src#arch/arm64/boot/dts/}"
            base="${rel%.dts}"
            target="${base}.dtbo"
            make -j"${{ inputs.build_jobs }}" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "$target"
            test -f "out/arch/arm64/boot/dts/$target"
          done < dtbo-sources.txt
          # Mandatory Global Rev 1.0 overlay.
          test -f out/arch/arm64/boot/dts/vendor/lge/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo

      - name: Compile semantic preflight for Maphide objects
        run: |
          set -euxo pipefail
          make -j"${{ inputs.build_jobs }}" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 fs/proc/task_mmu.o fs/proc/base.o

      - name: Build SUSFS v2.2.0 userspace module
        run: |
          set -euxo pipefail
          test -f /tmp/susfs-module/build_ksu_module.sh
          chmod +x /tmp/susfs-module/build_ksu_module.sh
          (cd /tmp/susfs-module && ./build_ksu_module.sh)
          find /tmp/susfs-module -maxdepth 3 -type f \
            \( -name '*.zip' -o -name 'module.prop' -o -name 'ksu_susfs' \) -print | tee susfs-userspace-artifacts.txt

      - name: Full kernel build
        run: |
          set -euxo pipefail
          make -j"${{ inputs.build_jobs }}" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j"${{ inputs.build_jobs }}" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image.gz dtbs modules
          test -s out/arch/arm64/boot/Image.gz

      - name: Final config + feature audit
        run: |
          set -euxo pipefail
          C=out/.config
          cp "$C" final.config
          required=(
            CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_KPROBES CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_KPM
            CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_AVC CONFIG_BBG CONFIG_BBG_BLOCK_BOOT CONFIG_EXT4_FS CONFIG_OVERLAY_FS
          )
          for s in "${required[@]}"; do grep -q "^${s}=y$" "$C" || { echo "FINAL MISSING: $s"; exit 1; }; done
          ! grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' "$C"
          ! find . -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .
          # User requirement: no tracked source file may be deleted by the feature integration.
          if git diff --name-status --diff-filter=D | grep -q .; then
            echo 'Tracked source deletion detected; refusing to continue.'; git diff --name-status --diff-filter=D; exit 1
          fi
          grep -q 'show_vma_header_prefix_fake' fs/proc/task_mmu.c
          grep -q 'jit-zygote-cache' fs/proc/task_mmu.c
          grep -q 'framework-res.apk' fs/proc/base.c fs/proc/task_mmu.c
          if git diff --name-status --diff-filter=D | grep -q .; then
            echo 'FINAL: tracked source deletion detected'; git diff --name-status --diff-filter=D; exit 1
          fi
          git diff --check
          git status --short

      - name: Package artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts/dtbo artifacts/metadata
          cp out/arch/arm64/boot/Image.gz artifacts/
          cp out/.config artifacts/metadata/final.config
          cp final.config artifacts/metadata/
          cp source-commit.txt artifacts/metadata/
          cp dtbo-sources.txt artifacts/metadata/
          cp /tmp/susfs-module/module.prop artifacts/metadata/susfs-module.prop
          if find /tmp/susfs-module -maxdepth 3 -type f -name '*.zip' -print -quit | grep -q .; then
            find /tmp/susfs-module -maxdepth 3 -type f -name '*.zip' -exec cp {} artifacts/ \\;
          fi
          find out/arch/arm64/boot/dts/vendor/lge -name '*.dtbo' -type f -exec cp --parents {} artifacts/dtbo/ \;
          sha256sum artifacts/Image.gz > artifacts/SHA256SUMS.txt
          find artifacts/dtbo -type f -name '*.dtbo' -print0 | sort -z | xargs -0 sha256sum >> artifacts/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-V21-complete
          path: artifacts/
