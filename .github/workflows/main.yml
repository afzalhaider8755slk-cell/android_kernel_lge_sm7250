          import sys

          build = Path(sys.argv[1])
          include = Path(sys.argv[2])
          bs = build.read_text()
          ins = include.read_text()

          HELPER = "real-prereqs = $(filter-out $(PHONY), $^)"
          if ins.count(HELPER) > 1:
