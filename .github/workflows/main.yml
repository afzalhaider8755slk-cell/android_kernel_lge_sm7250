      - name: Setup 9 - Integrate SukiSU-Ultra Non-GKI
        shell: bash
        run: |
          SETUP_NO="09"
          SETUP_NAME="Setup 9 - Integrate SukiSU-Ultra Non-GKI"
          SETUP_LOG="$DIAG_DIR/09-setup-09-integrate-sukisu-ultra-non-gki-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set -euo pipefail
          LOG="$DIAG_DIR/08-sukisu-integration.log"
          : > "$LOG"
          {
            echo "========== SUKISU-Ultra 4.2.0 =========="
            git ls-files -z | sort -z > "$RUNNER_TEMP/tracked-before"

            curl -fL --retry 5 --retry-all-errors --progress-bar "https://raw.githubusercontent.com/${SUKISU_REPO}/${SUKISU_REF}/kernel/setup.sh" \
              -o "$RUNNER_TEMP/sukisu-setup.sh"
            chmod +x "$RUNNER_TEMP/sukisu-setup.sh"

            echo "Using official SukiSU release tag: $SUKISU_REF"
            echo "No fixed SukiSU release commit is enforced; runtime commit is recorded after integration."
            echo "Non-GKI integration mode: source-integrated SukiSU + KPROBES"
            # v4.2.0 setup.sh accepts a commit/tag and integrates KernelSU into drivers/.
            bash "$RUNNER_TEMP/sukisu-setup.sh" "$SUKISU_REF"

            test -d KernelSU
            test -f KernelSU/kernel/Kconfig
            test -f KernelSU/kernel/Makefile

            echo
            echo "SukiSU repository state:"
            git -C KernelSU remote -v || true
            KSU_HEAD="$(git -C KernelSU rev-parse HEAD)"
            git -C KernelSU describe --tags --always || true
            test -n "$KSU_HEAD"
            echo "[PASS] SukiSU source resolved at commit $KSU_HEAD; fixed commit pin disabled."

            echo "SukiSU-Ultra 4.2.0 is the root implementation; SUSFS is integrated as a compatible non-GKI 4.19 kernel patchset."
            echo "SUSFS target: $SUSFS_REF (commit resolved at runtime)"

            git ls-files -z | sort -z > "$RUNNER_TEMP/tracked-after"
            if ! cmp -s "$RUNNER_TEMP/tracked-before" "$RUNNER_TEMP/tracked-after"; then
              echo "[FAIL] Existing tracked stock files disappeared during SukiSU integration."
              diff -u <(tr '\0' '\n' < "$RUNNER_TEMP/tracked-before") \
                      <(tr '\0' '\n' < "$RUNNER_TEMP/tracked-after") || true
              exit 1
            fi

            echo "[PASS] SukiSU-Ultra 4.2.0 integrated as source code for the non-GKI kernel."
            echo "[PASS] No external root-hiding kernel integration was applied."
            echo "[PASS] No pre-existing tracked stock files were removed."
          } 2>&1 | tee -a "$LOG"
          cat "$LOG"

      - name: Setup 10 - Verify Root KPM SUSFS
        shell: bash
        run: |
          SETUP_NO="10"
          SETUP_NAME="Setup 10 - Verify Root KPM SUSFS"
          SETUP_LOG="$DIAG_DIR/10-setup-10-verify-root-kpm-susfs-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set -euo pipefail
          LOG="$DIAG_DIR/09-sukisu-verification.log"
          : > "$LOG"
          {
            test -d KernelSU
            test -f KernelSU/kernel/Kconfig
            test -f KernelSU/kernel/Makefile
            echo "SukiSU tag requested: $SUKISU_REF"
            echo "SukiSU HEAD: $(git -C KernelSU rev-parse HEAD)"
            echo "SukiSU describe: $(git -C KernelSU describe --tags --always 2>/dev/null || true)"
            echo
            # IMPORTANT: this step runs before the defconfig/configuration stage.
            # Therefore .config is not expected to exist yet.  Verify the source
            # integration here; CONFIG_* = y is validated only after olddefconfig
            # in the configuration stage below.
            grep -RqsE '^[[:space:]]*(config|menuconfig)[[:space:]]+KPM([[:space:]]|$)' KernelSU/kernel               || { echo "[FAIL] SukiSU v4.2.0 KPM Kconfig symbol is missing from KernelSU/kernel."; exit 1; }
            test -d KernelSU/kernel/kpm || { echo "[FAIL] SukiSU v4.2.0 KPM source directory is missing."; exit 1; }
            test -f KernelSU/kernel/Kbuild || { echo "[FAIL] SukiSU v4.2.0 Kernel/Kbuild is missing."; exit 1; }

            # SUSFS is a source-level non-GKI 4.19 integration at this stage.
            # Its CONFIG_* values are intentionally checked after defconfig.
            grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU fs include 2>/dev/null || {
              echo "[FAIL] SUSFS integration markers are missing from the source tree."
              exit 1
            }
            echo "SUSFS: $SUSFS_VERSION @ $SUSFS_COMMIT"
            echo "[PASS] SukiSU-Ultra 4.2.0 source + KPM source + SUSFS 4.19 integration verified."
            echo "[INFO] CONFIG_KPM=y is deferred to the post-defconfig verification stage."
          } 2>&1 | tee -a "$LOG"
          cat "$LOG"

      - name: Setup 11 - Verify Non-GKI Hook Architecture
        shell: bash
        run: |
          SETUP_NO="11"
