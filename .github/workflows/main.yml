          patterns = [
              (r'static_branch_likely\s*\(\s*(?:\\+)?&\s*ksu_su_compat_enabled\s*\)', 'ksu_su_compat_enabled'),
              (r'static_branch_unlikely\s*\(\s*(?:\\+)?&\s*ksu_is_init_rc_hook_enabled\s*\)', 'ksu_is_init_rc_hook_enabled'),
              (r'static_branch_unlikely\s*\(\s*(?:\\+)?&\s*ksu_is_input_hook_enabled\s*\)', 'ksu_is_input_hook_enabled'),
          ]
          source_files = [
              root / 'fs/exec.c', root / 'fs/open.c', root / 'fs/read_write.c',
              root / 'fs/stat.c', root / 'drivers/input/input.c',
          ]
          bad = []
          for src in source_files:
              text = src.read_text(errors='replace')
              for pat, label in patterns:
                  for m in re.finditer(pat, text):
                      line = text.count('\n', 0, m.start()) + 1
                      bad.append(f'{src}:{line}: {label}')
          if bad:
              raise SystemExit('[ERROR] V67 post-hook legacy API validation failed:\n' + '\n'.join(bad))
          print('[OK] V67 post-hook validation: no legacy KSU static-key references remain in SUSFS-hooked files.')
          PY_V67_POST_HOOK_VALIDATE

          # The inline script does not perform Git conflict resolution. The four
          # audited SUSFS files must therefore be clean in the index before we
          # continue; if Git still carries their pre-port stages, resolve only
          # those known files from the already-verified working-tree contents.
          if git -C kernel ls-files -u | grep -q .; then
            git -C kernel add -- fs/namespace.c fs/proc/cmdline.c fs/proc/task_mmu.c fs/super.c
          fi
          if git -C kernel ls-files -u | grep -q .; then
            echo "[ERROR] V67 inline SUSFS stage left unexpected unmerged index entries." | tee logs/07-susfs-failure.log
            git -C kernel status --short | tee -a logs/07-susfs-failure.log
            git -C kernel ls-files -u | tee -a logs/07-susfs-failure.log
            exit 1
          fi
          echo '[OK] V67 KSU/SUSFS compatibility reconciliation and inline-hook execution passed.'
          if find kernel -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
            echo "[ERROR] Inline SUSFS hook stage produced reject/original files." | tee logs/07-susfs-failure.log
            find kernel -type f \( -name '*.rej' -o -name '*.orig' \) -print | tee -a logs/07-susfs-failure.log
            exit 1
          fi
          python3 - "${GITHUB_WORKSPACE}/kernel" > logs/07-susfs-conflict-markers-post-inline.log 2>&1 <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          bad = []
          start_re = re.compile(r'^<<<<<<<(?: .*)?$')
          sep_re = re.compile(r'^=======$')
          end_re = re.compile(r'^>>>>>>>(?: .*)?$')
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  lines = p.read_text(errors='replace').splitlines()
              except Exception:
                  continue
              state = 0
              start_line = 0
              for no, line in enumerate(lines, 1):
                  if state == 0 and start_re.match(line):
                      state = 1
                      start_line = no
                  elif state == 1 and sep_re.match(line):
                      state = 2
                  elif state == 2 and end_re.match(line):
                      bad.append(f'{p}:{start_line}-{no}')
                      state = 0
          if bad:
              print('REAL_MERGE_CONFLICT_MARKERS_FOUND')
              print('\n'.join(bad))
              raise SystemExit(1)
          print('[OK] No real merge-conflict triplets found after inline hooks.')
          PY
          if [ "$?" -ne 0 ]; then
            echo "[ERROR] Inline SUSFS hook stage left real merge-conflict markers." | tee logs/07-susfs-failure.log
            exit 1
          fi

          # V21: the upstream NonGKI flow explicitly runs susfs_inline_hook_patches.sh
          # only after KernelSU is embedded. Therefore CONFIG_KSU_SUSFS validation is
          # intentionally performed here, after the inline hook layer, not before it.
          require_grep 'KSU_SUSFS' kernel/fs/susfs.c kernel/include/linux/susfs.h kernel/include/linux/susfs_def.h kernel/drivers/kernelsu
          require_grep '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' kernel/drivers/kernelsu kernel/fs kernel/include/linux
          require_grep 'KSU_SUSFS' kernel/fs/Makefile
          {
            echo "=== V32 POST-INLINE SUSFS VALIDATION ==="
            echo "kernel_head=$(git -C kernel rev-parse HEAD)"
            echo "ksu_head=$(git -C kernel/KernelSU-Next rev-parse HEAD)"
            echo "ksu_tag=$(git -C kernel/KernelSU-Next describe --tags --exact-match HEAD 2>/dev/null || true)"
            grep -RInE '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' kernel/drivers/kernelsu kernel/fs kernel/include/linux 2>/dev/null | head -40 || true
          } | tee logs/07-susfs-post-inline-validation.txt
          git -C kernel diff --check | tee logs/07-susfs-diff-check-post-inline.log
          # Do NOT `git add -A` here: KernelSU-Next is intentionally a nested Git
          # checkout created by its official setup script. Staging the entire tree
          # produces the misleading "adding embedded git repository" warning.

          echo "[OK] SUSFS ${SUSFS_VERSION} 4.19 backport integrated using ${APPLY_MODE}."
          echo "::endgroup::"

      - name: "8. Configure features and enforce no-removal policy"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[8/15] Configure features"
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          make O=out "${TARGET_KERNEL_CONFIG}" > ../logs/08-defconfig.log 2>&1
          grep -RqsE "^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)" drivers/kernelsu fs include || { echo "[ERROR] KSU_SUSFS Kconfig symbol is missing after SUSFS + inline-hook integration."; exit 1; }
          ./scripts/config --file out/.config --enable KSU --enable KSU_SUSFS
          mapfile -t SUSFS_SYMBOLS < <(grep -RhoE '^config KSU_SUSFS_[A-Za-z0-9_]+' drivers/kernelsu fs include 2>/dev/null | awk '{print $2}' | sort -u)
          # V37: this loop used to force-enable every KSU_SUSFS_* symbol unconditionally,
          # including KSU_SUSFS_SUS_SU. SUS_SU is the kprobe-based "hide su" mechanism; this
          # kernel uses manual/inline hooks (Step 7), not kprobes, which is exactly the
          # combination the community-documented non-GKI 4.19 KernelSU-Next+SUSFS configuration
          # disables SUS_SU for. With it force-enabled, Kbuild pulls in
          # drivers/kernelsu/selinux/rules.c, which manipulates struct selinux_state fields
          # (.policy, .policy_mutex) and struct selinux_policy that only exist after the
          # upstream SELinux RCU-policy rewrite (Linux 5.7+) -- kernel 4.19's struct
          # selinux_state predates that rewrite entirely, so this is not a version-guard fix
          # like the earlier filter_count one; there is no compatible field to fall back to
          # without hand-patching live SELinux policy-engine internals. Skipping SUS_SU keeps
          # every other SUSFS feature (SUS_PATH, SUS_MOUNT, SUS_KSTAT, TRY_UMOUNT,
          # SPOOF_UNAME, ENABLE_LOG, HIDE_KSU_SUSFS_SYMBOLS, SPOOF_CMDLINE_OR_BOOTCONFIG,
          # OPEN_REDIRECT, SUS_MAP, ...) force-enabled exactly as before.
          for sym in "${SUSFS_SYMBOLS[@]}"; do
            test "${sym}" = "KSU_SUSFS_SUS_SU" && continue
            ./scripts/config --file out/.config --enable "${sym}" || true
          done
          ./scripts/config --file out/.config --disable KSU_SUSFS_SUS_SU || true
          # V48: legacy-susfs-v2 declares the old KSU_SUSFS_TRY_UMOUNT command path,
          # but the separate SUSFS 2.3.0 4.19 backport used in this tree intentionally
          # does not provide susfs_add_try_umount(). Leaving the legacy symbol enabled
          # therefore causes supercall.c to fail with an implicit declaration. V44 did
          # not have this symbol in its enabled feature set, so disable only this stale
          # legacy command and keep all V44 KSU/SUSFS features intact.
          # V48: legacy-susfs-v2 still declares the historical TRY_UMOUNT command,
          # but this kernel tree uses the separate SUSFS 2.3.0 backport, which does not
          # implement susfs_add_try_umount(). Keep the feature set identical to the
          # boot-tested V44 config: TRY_UMOUNT was not enabled there. Disable it before
          # and after olddefconfig, then verify that Kconfig did not silently re-enable it.
          ./scripts/config --file out/.config --disable KSU_SUSFS_TRY_UMOUNT || true
          make O=out olddefconfig > ../logs/08-olddefconfig.log 2>&1
          ./scripts/config --file out/.config --disable KSU_SUSFS_TRY_UMOUNT || true
          make O=out olddefconfig >> ../logs/08-olddefconfig.log 2>&1
          if grep -q '^CONFIG_KSU_SUSFS_TRY_UMOUNT=y$' out/.config; then
            echo '[ERROR] KSU_SUSFS_TRY_UMOUNT was re-enabled after olddefconfig; disabling it would be unsafe without a matching SUSFS implementation.' | tee ../logs/08-no-removal-failure.log
            exit 1
          fi
          grep -q '^# CONFIG_KSU_SUSFS_TRY_UMOUNT is not set$' out/.config || { echo '[ERROR] CONFIG_KSU_SUSFS_TRY_UMOUNT is unexpectedly enabled'; exit 1; }
          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' out/.config | sort > ../post-integration-enabled-config.txt
          while IFS= read -r line; do
            sym="${line%%=*}"
            grep -q "^${sym}=" ../post-integration-enabled-config.txt || { echo "[ERROR] Baseline feature removed: ${sym}" | tee ../logs/08-no-removal-failure.log; exit 1; }
          done < ../baseline-enabled-config.txt
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          {
            echo "baseline_enabled=$(wc -l < ../baseline-enabled-config.txt)"
            echo "post_integration_enabled=$(wc -l < ../post-integration-enabled-config.txt)"
            echo "baseline_config_sha256=$(sha256sum ../baseline-enabled-config.txt | awk '{print $1}')"
            echo "post_integration_config_sha256=$(sha256sum ../post-integration-enabled-config.txt | awk '{print $1}')"
            grep -E '^CONFIG_(KSU|KPROBE|KPROBES|KSU_SUSFS)' out/.config || true
            echo "kernel_version=$(make -s O=out kernelversion)"
          } | tee ../logs/08-config-summary.log
          echo "[OK] No-removal gate passed"
          echo "::endgroup::"

      - name: "9. Build kernel"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[9/15] Build kernel"
          cd kernel
          # V48 source-integrity gate: catch accidental text corruption before clang.
          grep -q '^static int ksu_wrapper_iterate[[:space:]]*(' drivers/kernelsu/infra/file_wrapper.c
          grep -q '^static int ksu_wrapper_release[[:space:]]*(' drivers/kernelsu/infra/file_wrapper.c
          if grep -qE 'C does not support default arguments|^[[:space:]]*while[[:space:]]*\(' drivers/kernelsu/infra/file_wrapper.c; then
            echo "[ERROR] Legacy file_wrapper.c appears structurally corrupted; refusing to build a damaged source tree."
            exit 1
          fi
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          # FIX: KernelSU-Next's drivers/kernelsu/feature/sucompat.c does
          # `#include <linux/minmax.h>`, a header that only exists in upstream kernels
          # much newer than this 4.19.325 CIP tree, so the build failed with:
          #   fatal error: 'linux/minmax.h' file not found
          # This adds that header only if it is missing (pure addition, nothing existing
          # is touched or removed). It pulls in the tree's own linux/kernel.h, which on
          # 4.19 already defines min/max/min_t/max_t/clamp/etc., and adds the one helper
          # (in_range) that 4.19's kernel.h does not have, matching upstream's definition.
          if [ ! -f include/linux/minmax.h ]; then
            mkdir -p include/linux
            {
              echo '#ifndef _LINUX_MINMAX_H'
              echo '#define _LINUX_MINMAX_H'
              echo ''
              echo '#include <linux/kernel.h>'
              echo ''
              echo '#ifndef in_range'
              echo '#define in_range(val, start, len) \'
              echo '    ((unsigned long)(val) - (unsigned long)(start) < (unsigned long)(len))'
              echo '#endif'
              echo ''
              echo '#endif /* _LINUX_MINMAX_H */'
            } > include/linux/minmax.h
            echo "[FIX] Added missing include/linux/minmax.h compatibility header for KernelSU-Next"
          fi
          # V48 FIX: do NOT line-edit KernelSU-Next legacy file_wrapper.c.
          # The legacy-susfs-v2 source already guards iopoll behind >=5.1 and
          # remap_file_range behind >=4.20. The V45 line-number sed patch was written
          # for a different file layout and corrupted the C file, producing cascading
          # syntax errors (missing function scopes, stray braces, and undeclared orig).
          # Leave the audited legacy source intact and only verify those version guards.
          # V48 KSU source integrity: the legacy branch's file_wrapper.c is already
          # 4.19-aware. Never rewrite it by line number. The previous V45 attempt did so
          # against a different source layout and produced cascading C syntax errors.
          if grep -qE '^[[:space:]]*(struct file\* orig =|while \(|#endif without)' drivers/kernelsu/infra/file_wrapper.c; then
            echo '[INFO] Legacy file_wrapper.c contains normal source constructs; no rewrite will be attempted.'
          fi
          FW="drivers/kernelsu/infra/file_wrapper.c"
          if [ -f "$FW" ]; then
            grep -q 'LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)' "$FW" || { echo "[ERROR] legacy file_wrapper.c lost iopoll version guard"; exit 1; }
            grep -q 'LINUX_VERSION_CODE >= KERNEL_VERSION(4, 20, 0)' "$FW" || { echo "[ERROR] legacy file_wrapper.c lost remap_file_range version guard"; exit 1; }
            echo "[OK] Legacy file_wrapper.c left unmodified; 4.19 VFS guards are source-native."
          fi
          # V32 FIX 1 — KernelSU-Next v3.3.0 compatibility with this 4.19.325 arm64 tree.
          # The KSU seccomp cache source references SECCOMP_ARCH_NATIVE_NR (and, with
          # CONFIG_COMPAT, SECCOMP_ARCH_COMPAT_NR), while this older arm64 seccomp header
          # does not provide those architecture definitions. This is a compatibility
          # definition only; it does not disable seccomp, KernelSU, SUSFS, or any feature.
          SECCOMP_HDR="arch/arm64/include/asm/seccomp.h"
          if [ -f "$SECCOMP_HDR" ] && ! grep -q 'SECCOMP_ARCH_NATIVE_NR' "$SECCOMP_HDR"; then
            python3 - "$SECCOMP_HDR" <<'PY'
          from pathlib import Path
          p = Path(__import__("sys").argv[1])
          s = p.read_text()
          marker = "#endif /* _ASM_SECCOMP_H */"
          compat = """#define SECCOMP_ARCH_NATIVE AUDIT_ARCH_AARCH64
          #define SECCOMP_ARCH_NATIVE_NR NR_syscalls
          #define SECCOMP_ARCH_NATIVE_NAME "aarch64"
          #ifdef CONFIG_COMPAT
          # define SECCOMP_ARCH_COMPAT AUDIT_ARCH_ARM
          # define SECCOMP_ARCH_COMPAT_NR __NR_compat_syscalls
          # define SECCOMP_ARCH_COMPAT_NAME "arm"
          #endif

          """
          if marker not in s:
              raise SystemExit(f"expected marker not found in {p}")
          p.write_text(s.replace(marker, compat + marker, 1))
          PY
            echo "[FIX] Added arm64 seccomp architecture/count definitions required by KSU-Next seccomp_cache.c"
          else
            echo "[OK] arm64 seccomp architecture/count definitions already present."
          fi

          # V43 FIX — link-time "undefined symbol" errors (path_mount, path_umount,
          # seccomp_filter_release), verified against real upstream Linux commits rather
          # than guessed:
          #   ld.lld: error: undefined symbol: seccomp_filter_release
          #     >>> referenced by app_profile.c:128 (drivers/kernelsu/policy/app_profile.c)
          #   ld.lld: error: undefined symbol: path_mount
          #     >>> referenced by su_mount_ns.c:154 (drivers/kernelsu/infra/su_mount_ns.c)
          #   ld.lld: error: undefined symbol: path_umount
          #     >>> referenced by kernel_umount.c:48 (drivers/kernelsu/feature/kernel_umount.c)
          #
          # path_mount()/path_umount(): confirmed via the actual upstream commits that
          # introduced them (Christoph Hellwig, merged for Linux 5.9):
          #   a1e6aaa3743a "fs: refactor do_mount"    -> split path_mount(dev_name,
          #     struct path *path, type, flags, data) out of the pre-existing
          #     do_mount(dev_name, const char __user *dir_name, type, flags, data)
          #   41525f56e2564 "fs: refactor ksys_umount" -> split path_umount(struct path
          #     *path, flags) out of the pre-existing ksys_umount(char __user *name, flags)
          # In both cases the split was purely mechanical: the old entry point first
          # resolved a user-space path string to a struct path (user_path_at()), then ran
          # the exact same core logic the new struct-path-taking helper keeps. This
          # 4.19.325 tree predates both commits, but do_mount()/the umount syscall path
          # (the pre-split entry points) are still present and do the same work. Since
          # KernelSU-Next's callers already hold a resolved struct path, the standard,
          # long-established bridge (the same technique init/do_mounts.c itself relies on
          # via its implicit set_fs(KERNEL_DS) during early boot) is to serialize that
          # struct path back to a string with d_path(), temporarily switch to KERNEL_DS so
          # the old syscall-shaped entry points can safely take a kernel buffer where they
          # expect a __user pointer, then call sys_mount()/sys_umount() -- the raw syscall
          # entry points, present on every kernel version including this one, so this does
          # not depend on whether this particular 4.19.325 tree has the later do_mount()/
          # ksys_umount() -> ksys_* naming (a separate, unrelated refactor).
          #
          # seccomp_filter_release(): a genuine upstream kernel/seccomp.c function (added
          # for the copy_process()/release_task() filter-refcount-leak fix -- see the
          # "seccomp: Release filter when copy_process() fails" thread on LKML). This
          # 4.19 tree's kernel/seccomp.c already has the exact same reference-counted
          # filter-chain release logic under its long-standing name,
          # put_seccomp_filter(struct task_struct *tsk) (decrements/frees
          # tsk->seccomp.filter and its ->prev chain) -- confirmed against a matching
          # kernel/seccomp.c snapshot (v5.6, pre-rename). Added as a thin forwarding
          # wrapper under the name KernelSU-Next's app_profile.c (disable_seccomp(),
          # called on `current` while escaping to root) expects.
          # NOTE: unlike path_mount/path_umount above, the exact argument KernelSU-Next
          # passes to seccomp_filter_release() could not be confirmed against the actual
          # source line (only the compiler's file:line reference, not its content, was
          # available) -- the (struct task_struct *) signature matches put_seccomp_filter's
          # own, semantically-identical signature and the only realistic call site
          # (disable_seccomp() operating on `current`), so this is a well-evidenced
          # best fit, not a blind guess, but flagged here in case a future run's
          # disassembly/crash log ever points back to this wrapper.
          NS="fs/namespace.c"
          if [ -f "$NS" ] && ! grep -q '^int path_mount(' "$NS" && ! grep -q '^int path_umount(' "$NS"; then
            cat >> "$NS" <<'NAMESPACE_COMPAT_EOF'

          /* V43 compat: see the comment in the workflow's Step 9 ("V43 FIX") for the full
           * derivation. Bridges KernelSU-Next's calls to the Linux 5.9+ path_mount()/
           * path_umount() struct-path entry points onto this pre-5.9 tree's still-present
           * sys_mount()/sys_umount() syscall entry points, via a temporary KERNEL_DS so a
           * kernel-space path string is accepted where a __user pointer is expected --
           * the same technique this kernel's own init/do_mounts.c already relies on. */
          int path_mount(const char *dev_name, struct path *path,
                          const char *type_page, unsigned long flags, void *data_page)
          {
              char *buf, *dir_name;
              mm_segment_t old_fs;
              long ret;

              buf = (char *)__get_free_page(GFP_KERNEL);
              if (!buf)
                  return -ENOMEM;

              dir_name = d_path(path, buf, PAGE_SIZE);
              if (IS_ERR(dir_name)) {
                  free_page((unsigned long)buf);
                  return PTR_ERR(dir_name);
              }

              old_fs = get_fs();
              set_fs(KERNEL_DS);
              ret = ksys_mount((char __user *)dev_name, (char __user *)dir_name,
                                (char __user *)type_page, flags, (void __user *)data_page);
              set_fs(old_fs);

              free_page((unsigned long)buf);
              return ret;
          }

          int path_umount(struct path *path, int flags)
          {
              char *buf, *name;
              mm_segment_t old_fs;
              long ret;

              buf = (char *)__get_free_page(GFP_KERNEL);
              if (!buf)
                  return -ENOMEM;

              name = d_path(path, buf, PAGE_SIZE);
              if (IS_ERR(name)) {
                  free_page((unsigned long)buf);
                  return PTR_ERR(name);
              }

              old_fs = get_fs();
              set_fs(KERNEL_DS);
              ret = ksys_umount((char __user *)name, flags);
              set_fs(old_fs);

              free_page((unsigned long)buf);
              return ret;
          }

          NAMESPACE_COMPAT_EOF
            echo "[FIX] Added path_mount()/path_umount() compat wrappers to fs/namespace.c (bridged onto existing 4.19 ksys_mount/ksys_umount)"
          else
            echo "[OK] path_mount()/path_umount() already present in fs/namespace.c."
          fi

          # V44 validation: Linux 4.19.325 exposes ksys_mount()/ksys_umount(), not the
          # removed raw sys_mount()/sys_umount() symbols used by the first V43 wrapper.
          # Fail here if the generated bridge still calls the unavailable symbols.
          if grep -qE '^[[:space:]]*ret = sys_(mount|umount)\(' "$NS"; then
            echo "[ERROR] V44: path_mount/path_umount still call unavailable sys_mount/sys_umount"
            exit 1
          fi
          if ! grep -qE '^int ksys_mount\(' "$NS" || ! grep -qE '^int ksys_umount\(' "$NS"; then
            echo "[ERROR] V44: expected Linux 4.19 ksys_mount/ksys_umount entry points are missing"
            exit 1
          fi
          echo "[OK] V44: mount compatibility bridge uses existing 4.19 ksys_mount/ksys_umount."

          SC_C="kernel/seccomp.c"
          if [ -f "$SC_C" ] && ! grep -q 'seccomp_filter_release' "$SC_C"; then
            cat >> "$SC_C" <<'SECCOMP_COMPAT_EOF'

          #ifdef CONFIG_SECCOMP
          /* V43 compat: see the comment in the workflow's Step 9 ("V43 FIX") for the full
           * derivation. Newer kernels expose seccomp_filter_release(); this 4.19 tree has
           * the same reference-counted filter-chain release logic under its long-standing
           * name, put_seccomp_filter(struct task_struct *). Forward to it. */
          void seccomp_filter_release(struct task_struct *tsk)
          {
              put_seccomp_filter(tsk);
          }
          #endif

          SECCOMP_COMPAT_EOF
            echo "[FIX] Added seccomp_filter_release() compat wrapper to kernel/seccomp.c (forwards to put_seccomp_filter)"
          else
            echo "[OK] seccomp_filter_release() already present in kernel/seccomp.c."
          fi

          # V32 FIX 1 — Fix the actual DTC failure without removing any touch revision.
          # The CN Rev-1.0 overlay includes lito-caymanlm_lao_com.dtsi, which already
          # includes lito-caymanlm_lao_com-touch.dtsi. That file includes
          # lito-caymanlm_common-touch.dtsi. The Rev-1.0 touch wrapper then included the
          # same common-touch.dtsi a second time. The common file defines
          # touch_pm8150l_gpio_default, so the overlay remained invalid in V32.
          # V32's guard attempt did not clear the actual DTC failure. V32 therefore
          # removes ONLY the redundant include directive from the Rev-1.0 wrapper.
          # The common touch definitions remain included once through the normal touch
          # file, and every Rev-1.0 node/status change remains untouched.
          #
          # V37: V32 only patched the lao_com region's touch_rev-1.0.dtsi. The DTC failure
          # kept recurring because it is the SAME duplicate-include mistake, present
          # independently in other regional variants -- specifically the one actually
          # compiled and failing in this build, lito-caymanlm_cn-rev-1.0_overlay.dtbo
          # ("ERROR: Input tree has errors, aborting"). V32's fix is generalized here from one
          # hardcoded lao_com path to every *touch_rev-1.0.dtsi wrapper under the lito-caymanlm
          # tree, removing the exact same verified-redundant include line wherever it recurs,
          # rather than hardcoding a second region-specific path.
          while IFS= read -r -d '' TOUCH_REV; do
            if grep -qF '#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"' "$TOUCH_REV"; then
              sed -i '\|^#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"$|d' "$TOUCH_REV"
              echo "[FIX] Removed redundant common-touch include from $TOUCH_REV"
            fi
          done < <(find arch/arm64/boot/dts/vendor/lge/lito-caymanlm -iname '*touch_rev-1.0.dtsi' -print0 2>/dev/null)
          echo "[INFO] Redundant common-touch include check complete across all regional touch_rev-1.0.dtsi wrappers."

          # V44 FIX 1B — CN Rev-1.0 DTC reports two real duplicate labels in the
          # preprocessed overlay: camera_therm_default and bmr_w_therm_default.
          # The duplicates are NOT from common-touch. The V43 09b-dtc-verbose log
          # shows the generic lito-pmic-overlay definitions and the CaymanLM
          # lito_caymanlm_lao_com-pm.dtsi definitions both creating those labels.
          # Keep BOTH pinctrl definitions (they carry different electrical settings);
          # only give the board-specific definitions unique labels and update their
          # local references. No thermal node or feature is removed.
          LAO_PM_DTSI="arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_lao_com-pm.dtsi"
          if [ -f "$LAO_PM_DTSI" ]; then
            python3 - "$LAO_PM_DTSI" <<'PY_V44_DT'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = s
          s = s.replace('camera_therm_default: camera_therm_default {',
                        'camera_therm_default_lao_com: camera_therm_default_lao_com {')
          s = s.replace('bmr_w_therm_default: bmr_w_therm_default {',
                        'bmr_w_therm_default_lao_com: bmr_w_therm_default_lao_com {')
          s = s.replace('&camera_therm_default', '&camera_therm_default_lao_com')
          s = s.replace('&bmr_w_therm_default', '&bmr_w_therm_default_lao_com')
          if s == old:
              raise SystemExit(f'[ERROR] V44: expected duplicate-label definitions were not found in {p}')
          p.write_text(s)
          PY_V44_DT
            echo "[FIX] V44: renamed only the two board-specific duplicate DT labels in ${LAO_PM_DTSI}; both pinctrl definitions remain."
          else
            echo "[ERROR] V44: expected CaymanLM board PM DTSI not found: ${LAO_PM_DTSI}"
            exit 1
          fi

          if grep -qE 'camera_therm_default:|bmr_w_therm_default:' "$LAO_PM_DTSI"; then
            echo "[ERROR] V44: duplicate board DT labels remain in ${LAO_PM_DTSI}"
            exit 1
          fi
          echo "[OK] V44: CN duplicate camera/bmr thermal labels reconciled without removing nodes."
          # V55 FIX — V50 dtbs diagnostics show the CN overlay is no longer the
          # blocker. HDK and VZW regional PM files still define generic thermal labels
          # that collide with the Qualcomm lito-pmic overlay. Keep every node/settings;
          # namespace only the variant-local labels and update their references.
          for VARIANT_PM in \
            arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_lao_com-pm_hdk.dtsi \
            arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_vzw-pm.dtsi; do
            if [ ! -f "$VARIANT_PM" ]; then
              echo "[ERROR] V55: expected variant PM DTSI not found: $VARIANT_PM"
              exit 1
            fi
            python3 - "$VARIANT_PM" <<'PY_V55_VARIANT_DT'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = s
          suffix = "_hdk" if "pm_hdk.dtsi" in p.name else "_vzw"
          s = s.replace('camera_therm_default: camera_therm_default {',
                        f'camera_therm_default{suffix}: camera_therm_default{suffix} {{')
          s = s.replace('bmr_w_therm_default: bmr_w_therm_default {',
                        f'bmr_w_therm_default{suffix}: bmr_w_therm_default{suffix} {{')
          s = s.replace('&camera_therm_default', f'&camera_therm_default{suffix}')
          s = s.replace('&bmr_w_therm_default', f'&bmr_w_therm_default{suffix}')
          if s == old:
              raise SystemExit(f'[ERROR] V55: expected variant thermal labels were not found in {p}')
          p.write_text(s)
          print(f'[FIX] V55: namespaced variant thermal labels in {p}')
          PY_V55_VARIANT_DT
          done

          if grep -RInE '^[[:space:]]*(camera_therm_default|bmr_w_therm_default):' \
              arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com \
              --include='*pm*.dtsi'; then
            echo "[ERROR] V55: unnamespaced CaymanLM variant thermal labels remain."
            exit 1
          fi
          echo "[OK] V55: all CaymanLM variant PM thermal labels are uniquely namespaced; no nodes removed."


          # V32 FIX 2 — KernelSU-Next v3.3.0 expects the newer UAPI mount.h header.
          # This 4.19 tree does not ship include/uapi/linux/mount.h. KernelSU's
          # su_mount_ns.c includes <uapi/linux/mount.h> for MS_PRIVATE and MS_REC.
          # Add only those missing compatibility definitions; no mount namespace code
          # or KernelSU feature is disabled.
          MOUNT_UAPI="include/uapi/linux/mount.h"
          if [ ! -f "$MOUNT_UAPI" ]; then
            mkdir -p include/uapi/linux
            cat > "$MOUNT_UAPI" <<'EOF_MOUNT'
          #ifndef _UAPI_LINUX_MOUNT_H
          #define _UAPI_LINUX_MOUNT_H
          #ifndef MS_REC
          #define MS_REC 16384
          #endif
          #ifndef MS_PRIVATE
          #define MS_PRIVATE (1 << 18)
          #endif
          #endif /* _UAPI_LINUX_MOUNT_H */
          EOF_MOUNT
            echo "[FIX] Added 4.19 UAPI mount.h compatibility definitions for KernelSU su_mount_ns.c"
          else
            echo "[OK] include/uapi/linux/mount.h already exists."
          fi

          # V45: legacy-susfs-v2 already carries its own 4.x fsnotify/task-work compatibility.
          KSU_MANAGER_DIR="drivers/kernelsu/manager"
          KSU_OBS="$KSU_MANAGER_DIR/pkg_observer.c"
          if [ -f "$KSU_OBS" ]; then
            if grep -qE 'file_name->(len|name)' "$KSU_OBS"; then
              echo "[ERROR] legacy pkg_observer still contains qstr-only filename dereferences."
              exit 1
            fi
            echo "[OK] pkg_observer accepted as legacy-compatible."
          else
            echo "[INFO] pkg_observer.c absent; continuing with legacy manager implementation."
          fi
          KSU_ALLOWLIST="drivers/kernelsu/policy/allowlist.c"
          if [ -f "$KSU_ALLOWLIST" ] && grep -q 'TWA_RESUME' "$KSU_ALLOWLIST"; then
            sed -i 's/task_work_add(tsk, cb, TWA_RESUME)/task_work_add(tsk, cb, true)/' "$KSU_ALLOWLIST"
            echo "[FIX] Adapted TWA_RESUME to Linux 4.19 bool notify."
          else
            echo "[OK] Legacy allowlist already uses the 4.x task_work API."
          fi

          # V45: legacy Kbuild backports seccomp.filter_count when needed. If a source file still
          # accesses it directly, guard the newer member for Linux 4.19.
          KSU_APP_PROFILE="drivers/kernelsu/policy/app_profile.c"
          if [ -f "$KSU_APP_PROFILE" ] && grep -q 'current->seccomp.filter_count' "$KSU_APP_PROFILE"; then
            python3 - "$KSU_APP_PROFILE" <<'PY_APP'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='    atomic_set(&current->seccomp.filter_count, 0);'
          if old in s and 'KSU_4_19_FILTER_COUNT_GUARD' not in s:
              s=s.replace(old,'/* KSU_4_19_FILTER_COUNT_GUARD */\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n'+old+'\n#endif',1)
              p.write_text(s)
          PY_APP
            echo "[FIX] Guarded seccomp.filter_count for pre-5.9 kernels."
          else
            echo "[OK] Legacy app_profile has no direct incompatible filter_count access."
          fi

          # V48 DT TOUCH FIX: the CN overlay is a composite. lito-caymanlm_lao_com.dtsi
          # already brings in the normal lao_com touch file, which in turn includes
          # lito-caymanlm_common-touch.dtsi. A touch_rev-1.0 wrapper must therefore contain
          # only its revision-specific status changes; including common-touch again creates
          # the duplicate touch_pm8150l_gpio_default label seen by dtc. Remove only that
          # redundant include from every revision wrapper; do not remove any touch node,
          # firmware entry, GPIO, or status override.
          while IFS= read -r -d '' TOUCH_REV_ALL; do
            if grep -qF '#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"' "$TOUCH_REV_ALL"; then
              sed -i '\|^#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"$|d' "$TOUCH_REV_ALL"
              echo "[FIX] V48: removed redundant common-touch include from $TOUCH_REV_ALL"
            fi
            if grep -qF '#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"' "$TOUCH_REV_ALL"; then
              echo "[ERROR] V48: redundant common-touch include remains in $TOUCH_REV_ALL"
              exit 1
            fi
          done < <(find arch/arm64/boot/dts/vendor/lge/lito-caymanlm -type f -iname '*touch_rev-1.0.dtsi' -print0 2>/dev/null)

          # V36 FIX 2 — Repair the V33 touch include change without altering any touch data.
          # The upstream common-touch.dtsi has no preprocessor guard. V33 injected one but the
          # build log proves it was left unterminated. The actual duplicate-inclusion fix is simply
          # to keep the common file intact and remove only the redundant Rev-1.0 include.
          COMMON_TOUCH="arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"
          TOUCH_REV="arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_lao_com-touch_rev-1.0.dtsi"
          test -f "$COMMON_TOUCH"

          python3 - "$COMMON_TOUCH" <<'PY_TOUCH_REPAIR'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          lines=p.read_text().splitlines()
          guard='__LG_CAYMANLM_COMMON_TOUCH_DTSI__'
          # Remove only the guard that earlier workflow revisions injected. The original
          # upstream file starts with SPDX/comment lines, so match the guard anywhere in the
          # first few lines rather than assuming it is line 1.
          if any(guard in line for line in lines[:8]):
              cleaned=[]
              for line in lines:
                  if guard in line or line.startswith('/* V33: idempotent include guard'):
                      continue
                  cleaned.append(line)
              lines=cleaned
          # If an earlier revision appended our matching final guard, remove that single line.
          while lines and lines[-1].strip() in (f'#endif /* {guard} */', f'#endif // {guard}'):
              lines.pop()
          p.write_text('\n'.join(lines).rstrip()+'\n')
          PY_TOUCH_REPAIR

          if [ -f "$TOUCH_REV" ] && grep -qF '#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"' "$TOUCH_REV"; then
            sed -i '\|^#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"$|d' "$TOUCH_REV"
            echo "[FIX] Removed only the redundant Rev-1.0 common-touch include; all Rev-1.0 nodes remain intact."
          fi

          # The source file itself must remain byte-for-byte equivalent to the upstream structure
          # apart from any pre-existing local changes; specifically, it must not contain our broken guard.
          if grep -q '__LG_CAYMANLM_COMMON_TOUCH_DTSI__' "$COMMON_TOUCH"; then
            echo "[ERROR] Broken common-touch guard still present after reconciliation."
            exit 1
          fi
          if grep -qF '#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"' "$TOUCH_REV"; then
            echo "[ERROR] Redundant Rev-1.0 common-touch include still present."
            exit 1
          fi
          echo "[CHECK] V34 touch reconciliation complete: common-touch definitions preserved, redundant include removed."

          echo "[CHECK] KernelSU fsnotify compatibility and DT touch reconciliation are installed."

          # Do not invoke a standalone DT overlay target. The real dtbs phase below is
          # the authoritative verification path and preserves all existing overlays.
          echo "[CHECK] DT and KernelSU compatibility fixes will be verified by the normal kernel build."

          MAKE_ARGS=(O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCC=clang HOSTCXX=clang++)

          # V40: the real errors are NOT at the bottom of a `make -j` log (make keeps finishing running
          # jobs after the first failure). Print them as the last lines and as annotations.
          summarize_errors() {
            local log="$1"
            echo
            echo "================= V45 ERROR SUMMARY (real errors from ${log##*/}) ================="
            grep -nE "(error:|fatal error:|undefined reference|undefined symbol|ERROR:|Error [0-9]+$)" "$log" | grep -v "Waiting for unfinished" | head -60 || true
            grep -nE "(error:|fatal error:|undefined reference|ERROR:)" "$log" | head -8 | while IFS= read -r l; do echo "::error::${l}"; done || true
            echo "===================================================================================="
          }

          # V40 generator for the two KernelSU files that need Linux 5.x kernel internals.
          cat > ../ksu_compat.py <<'PYGEN'
          import pathlib, re, sys

          mode, path, orig_out, gen_out = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          guard_ver = sys.argv[5] if len(sys.argv) > 5 else "5, 7, 0"
          target = pathlib.Path(path)
          src = target.read_text()
          pathlib.Path(orig_out).write_text(src)
          MARK = "V40 compat"
          if MARK in src:
              print(f"[OK] {path} already carries the V40 compat marker; unchanged")
              raise SystemExit(0)


          def clean(text):
              """Remove comments and preprocessor lines; blank string/char literals."""
              out, i, n = [], 0, len(text)
              line_start = True
              while i < n:
                  c = text[i]
                  if line_start:
                      j = i
                      while j < n and text[j] in " \t":
                          j += 1
                      if j < n and text[j] == "#":
                          while j < n:
                              if text[j] == "\n" and text[j - 1] != "\\":
                                  break
                              j += 1
                          i = j
                          continue
                  if text.startswith("/*", i):
                      j = text.find("*/", i + 2)
                      j = n if j < 0 else j + 2
                      out.append(" ")
                      i = j
                      continue
                  if text.startswith("//", i):
                      j = text.find("\n", i)
                      i = n if j < 0 else j
                      continue
                  if c in "\"'":
                      q, j = c, i + 1
                      while j < n and text[j] != q:
                          j += 2 if text[j] == "\\" else 1
                      out.append(q + "S" + q)
                      i = j + 1
                      line_start = False
                      continue
                  out.append(c)
                  line_start = c == "\n"
                  i += 1
              return "".join(out)


          def find_functions(text):
              funcs, prefix, depth, i, n = [], [], 0, 0, len(text)
              while i < n:
                  c = text[i]
                  if c == "{":
                      if depth == 0:
                          head = "".join(prefix).strip()
                          m = re.match(
                              r"^(?P<ret>[\w\s\*]+?)\b(?P<name>\w+)\s*\((?P<args>.*)\)\s*(?:__\w+\s*(?:\([^)]*\))?\s*)*$",
                              head, re.S)
                          if m and "=" not in head:
                              funcs.append((head, m.group("ret"), m.group("name")))
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          prefix = []
                  elif depth == 0:
                      if c == ";":
                          prefix = []
                      else:
                          prefix.append(c)
                  i += 1
              return funcs


          funcs = find_functions(clean(src))
          stubs, names, seen = [], [], set()
          for head, ret, name in funcs:
              if re.search(r"\bstatic\b", ret) or name in seen:
                  continue  # file-local helpers are only used by the code being replaced; duplicates come from #if/#else pairs
              seen.add(name)
              head_one = " ".join(head.split())
              if "*" in ret:
                  body = "return NULL;"
              elif re.search(r"\bvoid\b", ret):
                  body = ""
              elif re.search(r"\bbool\b", ret):
                  body = "return false;"
              else:
                  body = "return 0;"
              names.append(name)
              stubs.append(f"{head_one}\n{{\n\t/* unsupported on this kernel: safe no-op */\n\t{body}\n}}\n")
          if not stubs:
              raise SystemExit(f"[ERROR] no exported function found in {path}; original saved to {orig_out}")

          lines = src.splitlines()
          includes = [l.rstrip() for l in lines if re.match(r"\s*#\s*include\b", l)]

          if mode == "replace":
              gen = ("/* V40 compat stub generated at build time (see workflow notes). */\n"
                     + "\n".join(includes) + "\n\n" + "\n".join(stubs))
          elif mode == "guard":
              # keep the whole original body for newer kernels, stub it out below guard_ver
              k, in_block = 0, False
              while k < len(lines):
                  t = lines[k].strip()
                  if in_block:
                      if "*/" in t:
                          in_block = False
                      k += 1
                      continue
                  if t.startswith("/*"):
                      in_block = "*/" not in t
                      k += 1
                      continue
                  if t == "" or t.startswith("//") or t.startswith("#"):
                      while t.endswith("\\") and k + 1 < len(lines):  # continuation lines
                          k += 1
                          t = lines[k].strip()
                      k += 1
                      continue
                  break
              head = "\n".join(lines[:k])
              body = "\n".join(lines[k:])
              gen = (head + "\n#include <linux/version.h>\n"
                     f"/* V40 compat: this file edits struct policydb, whose layout changed in Linux 5.7+ (flex_array\n"
                     f" * avtab/type_val_to_struct, filename_trans hashtab). Below {guard_ver} every exported\n"
                     f" * function is a safe no-op. */\n"
                     f"#if LINUX_VERSION_CODE >= KERNEL_VERSION({guard_ver})\n"
                     + body + "\n#else\n" + "\n".join(stubs) + "#endif /* V40 compat */\n")
          else:
              raise SystemExit("unknown mode " + mode)

          target.write_text(gen)
          pathlib.Path(gen_out).write_text(gen)
          print(f"[FIX] {path}: {mode} mode, stubbed: " + ", ".join(names))
          PYGEN

          # V40 FIX 1: seccomp_cache.c mirrors the Linux 5.11+ per-filter seccomp action cache. 4.19 has
          # no cache, so the exported functions become no-ops (V32's header definitions stay in place).
          SC="drivers/kernelsu/infra/seccomp_cache.c"
          if [ -f "$SC" ] && ! grep -q "action_cache" kernel/seccomp.c; then
            python3 ../ksu_compat.py replace "$SC" ../logs/09-seccomp_cache.c.orig ../logs/09-seccomp_cache.c.generated
          else
            echo "[INFO] seccomp_cache.c no-op compat not needed or file not present"
          fi

          # V40 FIX 2: selinux/sepolicy.c edits struct policydb using the Linux 5.7+ layout. Keep the
          # original code for >=5.7 and provide safe no-op stubs below that (rules.c is already stubbed).
          SP="drivers/kernelsu/selinux/sepolicy.c"
          if [ -f "$SP" ] && ! grep -q "struct filename_trans_key" security/selinux/ss/policydb.h; then
            python3 ../ksu_compat.py guard "$SP" ../logs/09-sepolicy.c.orig ../logs/09-sepolicy.c.generated "5, 7, 0"
          else
            echo "[INFO] sepolicy.c pre-5.7 compat not needed or file not present"
          fi

          # V42 FIX: feature/selinux_hide.c reads/writes selinux_state.status_lock/status_page/policy and
          # struct selinux_policy, which exist only since the Linux 5.7 SELinux rewrite. Keep the original
          # code for >=5.7 and provide safe no-op stubs below that (same method as sepolicy.c).
          SH="drivers/kernelsu/feature/selinux_hide.c"
          if [ -f "$SH" ] && ! grep -rqs "struct selinux_policy" security/selinux/include; then
            python3 ../ksu_compat.py guard "$SH" ../logs/09-selinux_hide.c.orig ../logs/09-selinux_hide.c.generated "5, 7, 0"
          else
            echo "[INFO] selinux_hide.c pre-5.7 compat not needed or file not present"
          fi

          # V41 FIX 1: supercall/dispatch.c uses tasklist_lock, init_task, task_pgrp() and task_session().
          # On 4.19 these are declared only in <linux/sched/task.h> / <linux/sched/signal.h>.
          DP="drivers/kernelsu/supercall/dispatch.c"
          if [ -f "$DP" ] && ! grep -q "V41 compat" "$DP"; then
            python3 - "$DP" <<'PY_DISPATCH'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          add = ("/* V41 compat: on 4.19 tasklist_lock/init_task and task_pgrp()/task_session() are only\n"
                 " * visible through the split sched headers (newer kernels pull them in implicitly). */\n"
                 "#include <linux/sched/signal.h>\n"
                 "#include <linux/sched/task.h>\n")
          s2, n = re.subn(r"^(#include\b)", lambda m: add + m.group(1), s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("no #include line found in dispatch.c")
          p.write_text(s2)
          print("[FIX] dispatch.c: added <linux/sched/signal.h> and <linux/sched/task.h>")
          PY_DISPATCH
          fi

          # V41 FIX 2: supercall/supercall.c passes TWA_RESUME to task_work_add(); 4.19 has a bool instead.
          SCP="drivers/kernelsu/supercall/supercall.c"
          if [ -f "$SCP" ] && grep -q "TWA_RESUME" "$SCP" && ! grep -q "V41 compat" "$SCP"; then
            python3 - "$SCP" <<'PY_SUPERCALL'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text().replace("TWA_RESUME", "KSU_TASK_WORK_RESUME")
          add = """/* V41 compat: TWA_RESUME (Linux 5.7+) does not exist on 4.19, where task_work_add() takes a bool. */
          #include <linux/version.h>
          #include <linux/task_work.h>
          #ifndef KSU_TASK_WORK_RESUME
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 7, 0)
          #define KSU_TASK_WORK_RESUME TWA_RESUME
          #else
          #define KSU_TASK_WORK_RESUME true
          #endif
          #endif
          """
          s2, n = re.subn(r"^(#include\b)", lambda m: add + m.group(1), s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("no #include line found in supercall.c")
          p.write_text(s2)
          print("[FIX] supercall.c: TWA_RESUME -> KSU_TASK_WORK_RESUME compat")
          PY_SUPERCALL
          fi

          # V40 FIX 3: compile ALL of drivers/kernelsu with keep-going first so every remaining
          # KernelSU/4.19 incompatibility is listed in one run instead of one per 8-minute build.
          echo "[V44] Pre-compiling drivers/kernelsu with keep-going to list ALL errors at once"
          if ! make "${MAKE_ARGS[@]}" -j"$(nproc)" prepare > ../logs/09a-prepare.log 2>&1; then
            tail -60 ../logs/09a-prepare.log
            echo "[ERROR] make prepare failed (see logs/09a-prepare.log)"
            exit 1
          fi
          # V41: flask.h/av_permissions.h are generated while security/selinux/ is built and drivers/kernelsu
          # includes them. Without this step the pre-compile reported 7 false 'flask.h not found' errors.
          # V59: V51 proved the complete dtbs phase returns dtbs_rc=0, so the prior
          # CN-only preflight is no longer a blocker. It was a redundant second DTC invocation
          # before the real build and V51 stopped before producing its preflight/build logs.
          # Keep the source-integrity checks above, then let the real kernel build proceed.
          # Step 9b runs the authoritative full dtbs diagnostic afterwards.
          echo "[OK] V55 DT source reconciliation passed; deferring DTC verification to the real dtbs phase."

          echo "[V41] Building security/selinux first (generates flask.h and av_permissions.h)"
          set +e
          make "${MAKE_ARGS[@]}" -k -j"$(nproc)" security/selinux/ 2>&1 | tee ../logs/09a-selinux.log
          SEL_RC=${PIPESTATUS[0]}
          set -e
          if [ "$SEL_RC" -ne 0 ]; then
            summarize_errors ../logs/09a-selinux.log
            echo "[ERROR] security/selinux failed to build (see logs/09a-selinux.log)"
            exit 1
          fi
          test -f out/security/selinux/flask.h || echo "[WARN] out/security/selinux/flask.h not found after building security/selinux"
          set +e
          make "${MAKE_ARGS[@]}" -k -j"$(nproc)" drivers/kernelsu/ 2>&1 | tee ../logs/09a-kernelsu-precompile.log
          PRE_RC=${PIPESTATUS[0]}
          set -e
          if [ "$PRE_RC" -ne 0 ]; then
            if grep -qE "error:|fatal error:" ../logs/09a-kernelsu-precompile.log; then
              summarize_errors ../logs/09a-kernelsu-precompile.log
              echo "[ERROR] drivers/kernelsu has compile errors on this 4.19 kernel (all listed above)."
              exit 1
            fi
            echo "[WARN] KernelSU pre-compile returned ${PRE_RC} without a compiler error; continuing to the full build"
          else
            echo "[OK] drivers/kernelsu pre-compiled cleanly"
          fi
          # Informational link check: KernelSU-internal symbols that are used but defined nowhere in KernelSU.
          KSU_OBJS="$(find out/drivers/kernelsu -name '*.o' ! -name 'built-in*' 2>/dev/null || true)"
          if [ -n "$KSU_OBJS" ] && command -v llvm-nm >/dev/null 2>&1; then
            llvm-nm -g --defined-only $KSU_OBJS 2>/dev/null | awk 'NF==3{print $3}' | sort -u > ../logs/09a-ksu-defined.txt || true
            llvm-nm -g -u $KSU_OBJS 2>/dev/null | awk 'NF==2{print $2}' | sort -u > ../logs/09a-ksu-undefined.txt || true
            comm -13 ../logs/09a-ksu-defined.txt ../logs/09a-ksu-undefined.txt | grep -E '^(ksu_|apply_kernelsu|handle_sepolicy)' > ../logs/09a-ksu-unresolved.txt || true
            if [ -s ../logs/09a-ksu-unresolved.txt ]; then
              echo "[WARN] KernelSU symbols referenced but not defined inside KernelSU (may be provided by kernel patches; otherwise the final link fails):"
              cat ../logs/09a-ksu-unresolved.txt
            fi
          fi

          # V40 FIX 4: build only the kernel Image (what is packaged). See KERNEL_BUILD_TARGETS in env.
          set +e
          make "${MAKE_ARGS[@]}" -k -j"$(nproc)" ${KERNEL_BUILD_TARGETS:-Image} 2>&1 | tee ../logs/09-kernel-build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_RC" -ne 0 ]; then
            summarize_errors ../logs/09-kernel-build.log
            echo "[ERROR] Kernel build failed (make exit code ${BUILD_RC})"
            exit "$BUILD_RC"
          fi
          test -s out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image | tee ../logs/output-image.sha256
          strings out/arch/arm64/boot/Image > ../logs/09-image-strings.txt
          if ! grep -m1 'Linux version ' ../logs/09-image-strings.txt > ../logs/09-image-version.log; then
            echo "[WARN] Linux version string was not found in Image; build artifact exists." | tee -a ../logs/09-image-version.log
          fi
          echo "[OK] Kernel Image built"
          echo "::endgroup::"

      - name: "9b. DTB diagnostic (non-blocking; captures the hidden dtc error text)"
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if [ ! -f kernel/out/.config ]; then echo "[SKIP] kernel/out/.config not present"; exit 0; fi
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          MAKE_ARGS=(O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCC=clang HOSTCXX=clang++)
          # Only informational: the Image is built without DTBs, so this never affects the result.
          timeout 900 make "${MAKE_ARGS[@]}" -k -j"$(nproc)" V=1 dtbs > ../logs/09b-dtbs-diagnostic.log 2>&1
          echo "dtbs_rc=$?" | tee ../logs/09b-dtbs-rc.txt
          grep -nE "Input tree has errors|Error [0-9]+$" ../logs/09b-dtbs-diagnostic.log | head -20
          echo "--- V59 post-fix DT source checks ---" | tee ../logs/09b-post-fix-dt-check.log
          grep -RInF '#include "../lito-caymanlm_common/lito-caymanlm_common-touch.dtsi"' \
            arch/arm64/boot/dts/vendor/lge/lito-caymanlm --include='*touch_rev-1.0.dtsi' \
            | tee -a ../logs/09b-post-fix-dt-check.log
          grep -nE 'camera_therm_default:|bmr_w_therm_default:' \
            arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_lao_com-pm.dtsi \
            | tee -a ../logs/09b-post-fix-dt-check.log
          echo "--- dtc quiet flags in the real dtc command line ---"
          grep -m3 -oE -- "-q+ " ../logs/09b-dtbs-diagnostic.log
          TMP="$(find out -name '*caymanlm_cn-rev-1.0_overlay*dts.tmp' 2>/dev/null | head -1)"
          if [ -n "$TMP" ] && [ -x out/scripts/dtc/dtc ]; then
            echo "--- dtc re-run without -qq on $TMP ---"
            out/scripts/dtc/dtc -@ -I dts -O dtb -o /dev/null \
              -i arch/arm64/boot/dts/vendor/lge -i arch/arm64/boot/dts/vendor -i arch/arm64/boot/dts -i include \
              "$TMP" > ../logs/09b-dtc-verbose.txt 2>&1
            head -60 ../logs/09b-dtc-verbose.txt
            echo "--- which files define the duplicated labels (cpp line markers) ---"
            awk '/^# [0-9]+ "/{f=$3} /camera_therm_default:|bmr_w_therm_default:/{print f " : " $0}' "$TMP" | tee ../logs/09b-dup-label-sources.txt
            grep -n '^# 1 ".*therm.*"' "$TMP" | head -40 | tee ../logs/09b-therm-includes.txt
          else
            echo "[INFO] preprocessed overlay .dts.tmp not found; see logs/09b-dtbs-diagnostic.log"
          fi
          exit 0

      - name: "10. Package AnyKernel3 and kernel.zip"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[10/15] Package AnyKernel3 and kernel.zip"
          rm -rf release work-anykernel
          mkdir -p release/logs release/build-info release/checksums work-anykernel
          cp kernel/out/arch/arm64/boot/Image release/kernel-image
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git work-anykernel 2>&1 | tee logs/10-anykernel-clone.log
          rm -rf work-anykernel/.git work-anykernel/modules work-anykernel/ramdisk
          cp kernel/out/arch/arm64/boot/Image work-anykernel/Image
          cat > work-anykernel/anykernel.sh <<'AK3'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=V67-LM-G900-KARNAL
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          '; }
          # OrangeFox is a timelm port, so its recovery-only platform string is not used as the
          # device identity. Require a positive CaymanLM identity before touching boot.
          found_cayman=0
          for p in ro.boot.hardware ro.hardware ro.product.name ro.product.vendor.name ro.build.fingerprint ro.yaap.device; do
            v="$(getprop "$p" 2>/dev/null || true)"
            case "$v" in
              *caymanlm*) found_cayman=1; ui_print "CaymanLM identity: $p=$v";;
            esac
          done
          if [ "$found_cayman" -ne 1 ]; then
            abort "Device verification failed: caymanlm identity not found."
          fi
          ui_print "CaymanLM device identity verified."
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3
          (cd work-anykernel && zip -qr ../release/AnyKernel3-OrangeFox-Flashable.zip .)
          mkdir -p release/kernel-payload
          cp kernel/out/arch/arm64/boot/Image release/kernel-payload/Image
          cp source-info.txt baseline-info.txt toolchain-version.txt baseline-enabled-config.txt post-integration-enabled-config.txt release/build-info/ 2>/dev/null || true
          cp logs/*.log release/logs/ 2>/dev/null || true
          cp logs/*.patch release/logs/ 2>/dev/null || true
          (cd release/kernel-payload && zip -qr ../kernel.zip .)
          rm -rf release/kernel-payload
          {
            echo "workflow=${WORKFLOW_VERSION}"
            echo "workflow_name=V67-LM-G900-KARNAL-BUILT"
            echo "kernel_version=${BASELINE_KERNEL_VERSION}"
            echo "source_commit=$(git -C kernel rev-parse HEAD)"
            echo "cip_baseline=${BASELINE_CIP}"
            echo "cip_target=${CIP_TARGET}"
            echo "kernelsu_next=${KSU_VERSION}"
            echo "susfs_version=${SUSFS_VERSION}"
            echo "susfs_backport_repo=${SUSFS_BACKPORT_REPO}"
            echo "susfs_backport_ref=${SUSFS_BACKPORT_REF}"
            echo "clang=${CLANG_REV}"
            echo "clang_commit=${CLANG_COMMIT}"
            echo "defconfig=${TARGET_KERNEL_CONFIG}"
          } > release/build-info/build-manifest.txt
          sha256sum release/kernel-image release/kernel.zip release/AnyKernel3-OrangeFox-Flashable.zip > release/checksums/SHA256SUMS
          rm -f release/kernel-image
          (cd release && zip -qr "../${OUTPUT_PREFIX}-output.zip" .)
          echo "[OK] ${OUTPUT_PREFIX}-output.zip"
          echo "::endgroup::"

      - name: "11. Verify all final artifacts"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[11/15] Verify final artifacts"
          {
            test -s "${OUTPUT_PREFIX}-output.zip"
            test -s release/kernel.zip
            test -s release/AnyKernel3-OrangeFox-Flashable.zip
            unzip -t "${OUTPUT_PREFIX}-output.zip"
            unzip -t release/kernel.zip
            unzip -t release/AnyKernel3-OrangeFox-Flashable.zip
            unzip -l "${OUTPUT_PREFIX}-output.zip" | sed -n '1,220p'
          } 2>&1 | tee logs/11-artifact-verify.log
          echo "[OK] Final artifacts verified"
          echo "::endgroup::"

      - name: "12. Upload V44 final output"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: V67-LM-G900-KARNAL-output
          path: V67-LM-G900-KARNAL-output.zip
          if-no-files-found: error
          retention-days: 30

      - name: "13. Upload V44 flashable ZIPs"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: V67-LM-G900-KARNAL-flashable-zips
          path: |
            release/AnyKernel3-OrangeFox-Flashable.zip
            release/kernel.zip
          if-no-files-found: error
          retention-days: 30

      - name: "14. Collect complete diagnostics (always)"
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # Diagnostics must never fail the job a second time. In earlier versions the diagnostic
          # collector itself failed with "sort: write error: Broken pipe", masking
          # the original CIP failure. V19 writes large inventories to files and only
          # prints bounded summaries to the Actions console.
          set +e
          mkdir -p diagnostics diagnostics/logs diagnostics/cip-checks
          {
            echo "job_status=${JOB_STATUS}"
            echo "workflow=${WORKFLOW_VERSION}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "source_commit=${KERNEL_COMMIT}"
            echo "cip_baseline=${BASELINE_CIP}"
            echo "cip_target=${CIP_TARGET:-UNRESOLVED}"
            echo "kernelsu_next=${KSU_VERSION}"
            echo "susfs=${SUSFS_VERSION}"
            echo "susfs_backport_repo=${SUSFS_BACKPORT_REPO}"
            echo "susfs_backport_ref=${SUSFS_BACKPORT_REF}"
            echo "clang=${CLANG_REV} (${CLANG_COMMIT})"
            echo "baseline_kernel_sha256=${BASELINE_KERNEL_SHA256}"
            echo "defconfig=${TARGET_KERNEL_CONFIG:-UNRESOLVED}"
          } > diagnostics/run-summary.txt

          # Preserve every generated log, including partial logs from failed steps.
          cp -a logs/. diagnostics/logs/ 2>/dev/null || true
          cp -a logs/device-tree/. diagnostics/device-tree/ 2>/dev/null || true
          cp baseline-info.txt baseline-defconfig.txt baseline-enabled-config.txt \
             post-integration-enabled-config.txt source-info.txt toolchain-version.txt \
             baseline-git-status.txt diagnostics/ 2>/dev/null || true

          # V38: two deep, still-open build blockers need the ACTUAL source to fix safely
          # rather than guessing from truncated compiler output -- capture it here every run,
          # success or failure, so it is always in the uploaded logs bundle:
          #
          # 1) drivers/kernelsu/selinux/rules.c (via the drivers/kernelsu symlink into
          #    KernelSU-Next/kernel/selinux/) fails with ~20 errors before clang's
          #    -ferror-limit cuts it off, so the file's full content past line ~182 has
          #    never actually been seen. It manipulates struct selinux_state/selinux_policy
          #    fields that only exist after Linux 5.7's SELinux RCU-policy rewrite; on this
          #    4.19 tree the equivalent state (sidtab/policydb) isn't even in the same place,
          #    so this is not a simple version-guard fix like the earlier ones and should not
          #    be attempted without seeing the whole file and its Kbuild wiring.
          mkdir -p diagnostics/ksu-selinux-source
          for f in kernel/selinux/rules.c kernel/selinux/rules.h kernel/selinux/sepolicy.c \
                   kernel/selinux/sepolicy.h kernel/selinux/selinux.c kernel/selinux/selinux.h \
                   kernel/selinux/Kbuild kernel/Kbuild kernel/Kconfig; do
            src="kernel/KernelSU-Next/${f}"
            if [ -f "$src" ]; then
              mkdir -p "diagnostics/ksu-selinux-source/$(dirname "$f")"
              cp "$src" "diagnostics/ksu-selinux-source/${f}"
            fi
          done
          grep -RnF 'selinux/rules' kernel/KernelSU-Next/kernel --include=Kbuild --include=Makefile \
            > diagnostics/ksu-selinux-source/kbuild-references.txt 2>/dev/null || true
          #
          # 2) The lito-caymanlm_cn-rev-1.0_overlay.dtbo DTC failure ("ERROR: Input tree has
          #    errors, aborting") has no supporting warning line in Kbuild's own dtc output, so
          #    the actual defect is still unconfirmed -- V32's fix (a verified duplicate
          #    common-touch.dtsi include) targeted the lao_com region and V37 generalized that
          #    same fix to every *touch_rev-1.0.dtsi wrapper, but the CN overlay still fails
          #    identically, so the real defect must be something else in this overlay's own
          #    include chain. Capture the small raw source files directly (cheap; each is under
          #    1 KB) and, if the build got far enough to generate it, the fully preprocessed
          #    dts Kbuild actually fed to dtc -- that preprocessed file is the ground truth.
          mkdir -p diagnostics/cn-overlay-source
          find kernel/arch/arm64/boot/dts/vendor/lge/lito-caymanlm -iname '*cn-rev-1.0*' \
            -o -iname '*cn-nfc*' 2>/dev/null | while read -r f; do
            cp --parents "$f" diagnostics/cn-overlay-source/ 2>/dev/null || true
          done
          find kernel/arch/arm64/boot/dts/vendor/lge/lito-caymanlm -iname '*touch_rev-1.0.dtsi' \
            -o -iname '*common-touch.dtsi' 2>/dev/null | while read -r f; do
            cp --parents "$f" diagnostics/cn-overlay-source/ 2>/dev/null || true
          done
          find kernel/out/arch/arm64/boot/dts/vendor/lge -iname '.lito-caymanlm_cn-rev-1.0_overlay.dtbo.dts.tmp' \
            2>/dev/null | while read -r f; do
            cp "$f" diagnostics/cn-overlay-source/preprocessed-cn-rev-1.0.dts.tmp 2>/dev/null || true
          done

          # Full workspace inventory goes to a file, not the Actions stdout pipe.
          find "$GITHUB_WORKSPACE" -type f \
            -not -path '*/.git/*' \
            -not -path '*/clang-prebuilt/*' \
            -printf '%P\t%s bytes\n' 2>/dev/null | sort > diagnostics/workspace-files.txt 2>/dev/null || true

          {
            echo "=== A-Z BUILD RECORD V48 ==="
            echo "Purpose=Preserve the known-working LM-G900 kernel baseline and add only CIP, KernelSU-Next, and SUSFS."
            echo "Device=LG Velvet LM-G900 family; codename=caymanlm"
            echo "Android/device branch=${DEVICE_REF}"
            echo "Kernel repo=${KERNEL_REPO}"
            echo "Kernel branch=${KERNEL_REF}"
            echo "Kernel commit=${KERNEL_COMMIT}"
            echo "Kernel version=${BASELINE_KERNEL_VERSION}"
            echo "Known-working baseline Image SHA256=${BASELINE_KERNEL_SHA256}"
            echo "Defconfig=${TARGET_KERNEL_CONFIG:-UNRESOLVED}"
            echo "CIP baseline=${BASELINE_CIP}"
            echo "CIP selected=${CIP_TARGET:-UNRESOLVED}"
            echo "KernelSU-Next=${KSU_VERSION}"
            echo "SUSFS=${SUSFS_VERSION}"
            echo "SUSFS backport repo=${SUSFS_BACKPORT_REPO}"
            echo "SUSFS backport ref=${SUSFS_BACKPORT_REF}"
            echo "Clang=${CLANG_REV}"
            echo "Clang commit=${CLANG_COMMIT}"
            echo "Architecture=arm64"
            echo "LLVM=1 LLVM_IAS=1"
            echo "No-removal policy=Every baseline enabled CONFIG_* symbol must remain present after integration."
            echo "Conflict policy=Never force, fuzz, or hide conflicts."
            echo
            echo "=== Repository revisions ==="
            git -C kernel rev-parse HEAD 2>/dev/null || true
            git -C device-caymanlm rev-parse HEAD 2>/dev/null || true
            git -C device-sm7250-common rev-parse HEAD 2>/dev/null || true
            git -C vendor-caymanlm rev-parse HEAD 2>/dev/null || true
            git -C susfs-backport rev-parse HEAD 2>/dev/null || true
            echo
            echo "=== Inventory file ==="
            echo "diagnostics/workspace-files.txt"
            echo
            echo "=== Kernel diff stat (staged + unstaged vs HEAD) ==="
            git -C kernel diff HEAD --stat 2>/dev/null || true
            echo
            echo "=== Kernel diff names (staged + unstaged vs HEAD) ==="
            git -C kernel diff HEAD --name-status 2>/dev/null || true
            echo
            echo "=== Final config ==="
            if [ -f kernel/out/.config ]; then
              sha256sum kernel/out/.config
              grep -E '^CONFIG_(KSU|KSU_SUSFS|KPROBES|KPROBE_EVENTS|MODULES)=' kernel/out/.config || true
            fi
            echo
            echo "=== Release hashes ==="
            find release -maxdepth 3 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum 2>/dev/null || true
          } > diagnostics/A-Z-BUILD-RECORD.txt 2>&1

          if [ -d kernel ]; then
            {
              echo "=== Kernel git status ==="; git -C kernel status --short || true
              echo; echo "=== Kernel HEAD ==="; git -C kernel rev-parse HEAD || true
              echo; echo "=== Kernel version ==="; make -s -C kernel kernelversion 2>/dev/null || true
              echo; echo "=== Reject files ==="; find kernel -type f -name '*.rej' -print 2>/dev/null || true
              echo; echo "=== Merge conflict markers ==="; grep -RInE '^(<<<<<<<|=======|>>>>>>>)' kernel --exclude-dir=.git 2>/dev/null | head -200 || true
            } > diagnostics/kernel-state.txt 2>&1
          fi

          # Copy the diagnostic bundle itself into the output zip only if the build
          # reached packaging; always create the separate complete-logs artifact.
          rm -f "../${OUTPUT_PREFIX}-complete-logs.zip"
          (cd diagnostics && zip -qr "../${OUTPUT_PREFIX}-complete-logs.zip" .) || true

          echo "::notice::V59 diagnostics collected; V44 adds 4.19 ksys mount bridges, DT duplicate-label reconciliation, and the prior seccomp_filter_release() compat (see Step 9); V42 selinux_hide.c pre-5.7 guard and keep-going full build; V41 SELinux-header generation before the KernelSU pre-compile, dispatch.c sched-header includes, supercall.c task_work compat, DTC duplicate-label diagnostics; V40 pinned KernelSU-Next commit, seccomp_cache no-op compat, pre-5.7 SELinux policydb stubs, whole-KernelSU keep-going pre-compile, Image-only build with DTB diagnostic (Step 9b) and error summary are enabled; SUSFS acquisition retries, source-version consistency checks, safe 3-way fallback, exact four-file source reconciliation, the Step-7 ERR-trap/subshell fix, the pershoot/KernelSU-Next dev-susfs fork for CONFIG_KSU_SUSFS, the TARGET_KERNEL_CONFIG cross-step export fix, and artifact naming fixes are enabled."
          echo "::endgroup::"

      - name: "15. Upload V48 complete diagnostics (always)"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V67-LM-G900-KARNAL-complete-logs
          path: |
            V67-LM-G900-KARNAL-complete-logs.zip
            diagnostics/
            logs/
            baseline-info.txt
            baseline-defconfig.txt
            baseline-enabled-config.txt
            post-integration-enabled-config.txt
            baseline-git-status.txt
            source-info.txt
            toolchain-version.txt
          if-no-files-found: warn
          retention-days: 30
