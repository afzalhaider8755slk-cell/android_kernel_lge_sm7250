name: LG Velvet 5G - WORKING 4.19 Non-GKI + KernelSU-Next v3.3.0 + SUSFS 4.19 - V31
  FULL FILE_WRAPPER AUDIT
'on':
  push: {}
  workflow_dispatch:
    inputs:
      source_branch:
        description: EXACT WORKING kernel branch
        required: true
        type: choice
        options:
        - sixteen
        default: sixteen
      defconfig:
        description: EXACT WORKING kernel defconfig
        required: true
        type: choice
        options:
        - vendor/caymanlm_defconfig
        default: vendor/caymanlm_defconfig
permissions:
  contents: read
concurrency:
  group: lg-velvet-working-4.19-ksu-susfs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build WORKING 4.19 Non-GKI + KSU + SUSFS - V31 FILE_WRAPPER AUDIT
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch
        || 'sixteen' }}
      SOURCE_COMMIT: 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49
      DEFCONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.defconfig
        || 'vendor/caymanlm_defconfig' }}
      KSU_VERSION: v3.3.0
      KSU_REPO: https://github.com/pershoot/KernelSU-Next.git
      KSU_BRANCH: dev-susfs
      KSU_REF: 26fded805206ae4542f4745e09cc465412994492
      SUSFS_VERSION: kernel-4.19
      SUSFS_REF: 001e69919c6271f690fd00b17e4c721c9e599152
      CLANG_REVISION: clang-r563880c
      CLANG_PREBUILT_TAG: ndk-r29
      GCC64_BRANCH: lineage-19.1
      GCC32_BRANCH: lineage-19.1
      ARCH: arm64
      OUT_DIR: ${{ github.workspace }}/out
      DIAG_DIR: ${{ github.workspace }}/ci-diagnostics
      WORKING_BASELINE_CONFIG_SHA256: 8b931841bcfcfad0b8ed596fbc156e67a6da8f32f226753ffabc89c907accffa
    steps:
    - name: 01 - Checkout EXACT WORKING kernel source
      shell: bash
      run: "set -euo pipefail\nrm -rf \"$GITHUB_WORKSPACE/kernel\"\n\ngit clone --depth=1\
        \ --branch \"$SOURCE_BRANCH\" \\\n  \"$KERNEL_REPO\" \"$GITHUB_WORKSPACE/kernel\"\
        \n\ncd \"$GITHUB_WORKSPACE/kernel\"\ngit fetch --no-tags --depth=1 origin\
        \ \"$SOURCE_COMMIT\"\ngit checkout --detach \"$SOURCE_COMMIT\"\n\ntest \"\
        $(git rev-parse HEAD)\" = \"$SOURCE_COMMIT\"\n\necho \"=== EXACT WORKING SOURCE\
        \ ===\"\necho \"branch=$SOURCE_BRANCH\"\necho \"commit=$(git rev-parse HEAD)\"\
        \necho \"kernel=$(make -s kernelversion || true)\"\n"
    - name: 02 - Install build dependencies (including GCC 4.9 Python wrapper fix)
      shell: bash
      run: "set -euo pipefail\nsudo apt-get update\nsudo DEBIAN_FRONTEND=noninteractive\
        \ apt-get install -y \\\n  bc bison build-essential ccache curl flex git libelf-dev\
        \ libssl-dev \\\n  lld llvm python3 python-is-python3 rsync unzip wget\n\n\
        # LineageOS GCC 4.9 wrappers use #!/usr/bin/python.\n# Ubuntu 22.04 does not\
        \ guarantee that /usr/bin/python exists.\ntest -x /usr/bin/python\n/usr/bin/python\
        \ --version\n\nmkdir -p \"$DIAG_DIR\"\n"
    - name: 03 - Download EXACT Android Clang r563880c + GCC 4.9
      shell: bash
      run: "set -euo pipefail\ncd \"$GITHUB_WORKSPACE\"\nrm -rf clang-prebuilt gcc64\
        \ gcc32\n\n# clang-r563880c is a DIRECTORY inside the NDK r29 snapshot,\n\
        # not a Git branch. NDK r29 contains clang-r563880c. \ngit clone --depth=1\
        \ --filter=blob:none --sparse \\\n  --branch \"$CLANG_PREBUILT_TAG\" \\\n\
        \  https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86\
        \ \\\n  clang-prebuilt\ncd clang-prebuilt\ngit sparse-checkout set \"$CLANG_REVISION\"\
        \ncd \"$GITHUB_WORKSPACE\"\n\n# Use the LineageOS lineage-19.1 GCC 4.9 prebuilts.\n\
        # They contain wrapper scripts that require /usr/bin/python.\ngit clone --depth=1\
        \ --branch \"$GCC64_BRANCH\" \\\n  https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git\
        \ \\\n  gcc64\n\ngit clone --depth=1 --branch \"$GCC32_BRANCH\" \\\n  https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git\
        \ \\\n  gcc32\n\ntest -x \"$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang\"\
        \ntest -x \"$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc\"\ntest\
        \ -x \"$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc\"\n\n# This catches\
        \ the exact failure seen previously:\n# \".../aarch64-linux-android-gcc: No\
        \ such file or directory\"\n# when the wrapper's /usr/bin/python interpreter\
        \ was missing.\n\"$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc\"\
        \ --version | head -n 1\n\"$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc\"\
        \ --version | head -n 1\n\"$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang\"\
        \ --version | head -n 2\n\"$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang\"\
        \ --version | grep -q '21\\.0\\.0'\n\necho \"CLANG_DIR=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION\"\
        \ >> \"$GITHUB_ENV\"\necho \"GCC64_DIR=$GITHUB_WORKSPACE/gcc64\" >> \"$GITHUB_ENV\"\
        \necho \"GCC32_DIR=$GITHUB_WORKSPACE/gcc32\" >> \"$GITHUB_ENV\"\necho \"PATH=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: 04 - Load and VERIFY exact WORKING baseline config (SELF-CONTAINED)
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/04-baseline-config.log\"\
        ) 2>&1\ncd \"$GITHUB_WORKSPACE/kernel\"\n\n# The baseline is embedded in this\
        \ workflow so this job does NOT depend\n# on a separately committed .github/kernel-baseline/working.config\
        \ file.\n# It is the exact .config extracted from the user's known-good kernel.\n\
