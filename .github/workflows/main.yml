name: LG Velvet LM-G900 — Android 16 QPR2 Kernel + DTBO

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Build kernel"
        required: true
        default: true
        type: boolean
      build_dtbo:
        description: "Build DTBO"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  DEVICE: LM-G900
  CODENAME: caymanlm

  SOURCE_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  SOURCE_REF: sixteeen

  CIP_REPO: https://gitlab.com/cip-project/cip-kernel/linux-cip.git
  CIP_TAG: v4.19.325-cip135

  ARCH: arm64
  LLVM: 1

  OUT: ${{ github.workspace }}/out
  LOGDIR: ${{ github.workspace }}/diagnostics

jobs:

  # ============================================================
  # KERNEL
  # ============================================================

  kernel:
    name: "KERNEL — LM-G900 — K01-K15"
    if: inputs.build_kernel
    runs-on: ubuntu-24.04

    steps:

      - name: K01 — Checkout exact existing kernel source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$LOGDIR"

          echo "=================================================="
          echo "K01 — SOURCE CHECKOUT"
          echo "=================================================="
          echo "Repository : $SOURCE_REPO"
          echo "Branch     : $SOURCE_REF"
          echo "Device     : $DEVICE"
          echo "Codename   : $CODENAME"

          git clone --branch "$SOURCE_REF" --single-branch \
            "$SOURCE_REPO" kernel

          cd kernel

          git rev-parse HEAD | tee "../$LOGDIR/kernel-source-commit.txt"
          git status --short | tee "../$LOGDIR/kernel-source-status.txt"

      - name: K02 — Toolchain preflight
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$LOGDIR"

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            device-tree-compiler \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip

          {
            echo "=== clang ==="
            clang --version

            echo "=== llvm ==="
            llvm-config --version

            echo "=== dtc ==="
            dtc --version

            echo "=== python ==="
            python3 --version
          } | tee "$LOGDIR/toolchain.txt"

      - name: K03 — CIP135 integration — FIXED REF ONLY
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=================================================="
          echo "K03 — CIP135"
          echo "=================================================="

          git remote remove cip 2>/dev/null || true
          git remote add cip "$CIP_REPO"

          # IMPORTANT:
          # The old workflow requested v4.19.325, which DOES NOT exist.
          # The valid release is v4.19.325-cip135.
          git fetch --no-tags cip \
            "refs/tags/${CIP_TAG}:refs/tags/${CIP_TAG}"

          test "$(git rev-parse "refs/tags/${CIP_TAG}")"

          echo "CIP tag:"
          git show -s --format='%H %D %s' \
            "refs/tags/${CIP_TAG}" | tee "../$LOGDIR/cip135.txt"

          # Do NOT re-merge CIP if it is already integrated.
          if git merge-base --is-ancestor \
              "$(git rev-parse "refs/tags/${CIP_TAG}")" HEAD; then

            echo "CIP135 is already contained in current source."
            echo "No previous integration will be modified."

          else

            echo "CIP135 is not yet contained."
            echo "Integrating the exact CIP135 baseline."

            git merge \
              --no-edit \
              "refs/tags/${CIP_TAG}"

          fi

          git rev-parse HEAD | tee "../$LOGDIR/post-cip-commit.txt"

      - name: K04 — Preserve existing finalized feature sources
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=================================================="
          echo "K04 — FEATURE PRESERVATION"
          echo "=================================================="

          {
            echo "SukiSU-Ultra"
            echo "KPM"
            echo "SUSFS"
            echo "WALT"
            echo "SchedTune"
            echo "ZRAM"
            echo "LTO"
            echo "Fingerprint"
            echo "Vibration"
            echo "Dual-SIM"
            echo "Audio"
            echo "IMS"
            echo "VoWiFi / Wi-Fi Calling"
            echo "LM-G900 identity"
          } | tee "../$LOGDIR/finalized-features.txt"

          # Diagnostic only.
          # Do not overwrite existing source fixes.
          git status --short | tee "../$LOGDIR/feature-source-status.txt"

      - name: K05 — Configure finalized LM-G900 kernel feature set
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          mkdir -p "$OUT"

          DEFCONFIG=""

          # Prefer the existing caymanlm/vendor configuration.
          for cfg in \
            "arch/arm64/configs/vendor/caymanlm_defconfig" \
            "arch/arm64/configs/vendor/caymanlm-perf_defconfig" \
            "arch/arm64/configs/caymanlm_defconfig" \
            "arch/arm64/configs/vendor/caymanlm.config"; do

            if [ -f "$cfg" ]; then
              DEFCONFIG="$cfg"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: Existing caymanlm defconfig was not found."
            find arch/arm64/configs -maxdepth 3 \
              -iname '*cayman*' -o -iname '*g900*' \
              | tee "../$LOGDIR/defconfig-search.txt"
            exit 1
          fi

          echo "Using existing configuration:"
          echo "$DEFCONFIG"

          export ARCH=arm64
          export LLVM=1
          export O="$OUT"

          make O="$OUT" \
            "$DEFCONFIG"

          # Preserve existing configuration first.
          # Only enforce the finalized requirements.
          ./scripts/config --enable CONFIG_KPM
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL

          ./scripts/config --enable CONFIG_ZRAM
          ./scripts/config --enable CONFIG_LTO_CLANG

          make O="$OUT" olddefconfig

          {
            echo "=== FINAL KERNEL CONFIG ==="
            grep -E \
              'CONFIG_(KPM|KALLSYMS|KALLSYMS_ALL|ZRAM|LTO_CLANG)=' \
              "$OUT/.config" || true
          } | tee "../$LOGDIR/final-config.txt"

      - name: K06 — Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export LLVM=1
          export O="$OUT"

          mkdir -p "$LOGDIR"

          echo "=================================================="
          echo "K06 — BUILD KERNEL"
          echo "=================================================="

          make -j"$(nproc)" \
            O="$OUT" \
            2>&1 | tee "../$LOGDIR/kernel-build.log"

      - name: K07 — Kernel feature + identity audit
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          {
            echo "=== DEVICE ==="
            echo "$DEVICE"

            echo "=== CODENAME ==="
            echo "$CODENAME"

            echo "=== SOURCE ==="
            git rev-parse HEAD

            echo "=== KERNEL RELEASE ==="
            "$OUT/scripts/config" --file "$OUT/.config" \
              --get-val CONFIG_LOCALVERSION || true

            echo "=== REQUIRED CONFIG ==="
            grep -E \
              'CONFIG_(KPM|KALLSYMS|KALLSYMS_ALL|ZRAM|LTO_CLANG)=' \
              "$OUT/.config" || true

            echo "=== OUTPUTS ==="
            find "$OUT/arch/arm64/boot" \
              -maxdepth 2 -type f \
              -printf '%p %s bytes\n' | sort

          } | tee "../$LOGDIR/kernel-audit.txt"

      - name: K08 — Build AnyKernel3 package
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          mkdir -p "$OUT/anykernel"

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "$OUT/anykernel/AnyKernel3"

          # Locate the generated kernel image.
          IMAGE=""

          for candidate in \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$OUT/arch/arm64/boot/Image.gz-dtb" \
            "$OUT/arch/arm64/boot/Image"; do

            if [ -f "$candidate" ]; then
              IMAGE="$candidate"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Kernel Image was not produced."
            exit 1
          fi

          cp "$IMAGE" \
            "$OUT/anykernel/AnyKernel3/"

          cd "$OUT/anykernel/AnyKernel3"

          cat > anykernel.sh <<'AK'
          properties() { '
          kernel.string=LM-G900 Android 16 QPR2 CIP135 SukiSU-Ultra
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }

          block=/dev/block/bootdevice/by-name/boot
          is_slot_device=0
          slot_select=auto

          . tools/ak3-core.sh
          dump_boot
          flash_boot
          AK

          zip -r9 \
            "$OUT/LM-G900-Android16-QPR2-Kernel.zip" \
            . \
            -x '.git/*'

      - name: K09 — Final kernel verification
        shell: bash
        run: |
          set -euxo pipefail

          test -f "$OUT/LM-G900-Android16-QPR2-Kernel.zip"

          unzip -t \
            "$OUT/LM-G900-Android16-QPR2-Kernel.zip" \
            | tee "$LOGDIR/kernel-zip-test.txt"

          sha256sum \
            "$OUT/LM-G900-Android16-QPR2-Kernel.zip" \
            | tee "$LOGDIR/kernel-sha256.txt"

      - name: K10 — Package complete kernel diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$LOGDIR"

          {
            echo "=================================================="
            echo "KERNEL FAILURE / FINAL DIAGNOSTICS"
            echo "=================================================="

            echo "DEVICE=$DEVICE"
            echo "CODENAME=$CODENAME"
            echo "SOURCE_REF=$SOURCE_REF"
            echo "CIP_TAG=$CIP_TAG"

            if [ -d kernel/.git ]; then
              cd kernel
              git status
              git log -5 --oneline --decorate
              git diff --stat
            fi
          } >> "$LOGDIR/final-diagnostics.txt" 2>&1

      - name: K11 — Upload kernel artifacts + COMPLETE logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-KERNEL-Android16-QPR2-CIP135
          if-no-files-found: warn
          path: |
            out/LM-G900-Android16-QPR2-Kernel.zip
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
            diagnostics/**
            kernel/.config
            kernel/.git/logs/**
            kernel/.git/HEAD


  # ============================================================
  # DTBO
  # ============================================================

  dtbo:
    name: "DTBO — LM-G900 — D01-D14"
    if: inputs.build_dtbo
    runs-on: ubuntu-24.04

    steps:

      - name: D01 — Checkout exact SAME kernel source
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$LOGDIR"

          git clone --branch "$SOURCE_REF" --single-branch \
            "$SOURCE_REPO" kernel

          cd kernel

          git rev-parse HEAD \
            | tee "../$LOGDIR/dtbo-source-commit.txt"

      - name: D02 — DTBO toolchain preflight
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            device-tree-compiler \
            python3 \
            rsync \
            unzip \
            zip

          {
            clang --version
            dtc --version
          } | tee "$LOGDIR/dtbo-toolchain.txt"

      - name: D03 — Apply SAME CIP135 baseline
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          git remote add cip "$CIP_REPO"

          git fetch --no-tags cip \
            "refs/tags/${CIP_TAG}:refs/tags/${CIP_TAG}"

          if git merge-base --is-ancestor \
              "$(git rev-parse "refs/tags/${CIP_TAG}")" HEAD; then

            echo "CIP135 already present."

          else

            git merge \
              --no-edit \
              "refs/tags/${CIP_TAG}"

          fi

          git rev-parse HEAD \
            | tee "../$LOGDIR/dtbo-post-cip-commit.txt"

      - name: D04 — Generate exact LM-G900 DT configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          mkdir -p "$OUT"

          DEFCONFIG=""

          for cfg in \
            "arch/arm64/configs/vendor/caymanlm_defconfig" \
            "arch/arm64/configs/vendor/caymanlm-perf_defconfig" \
            "arch/arm64/configs/caymanlm_defconfig"; do

            if [ -f "$cfg" ]; then
              DEFCONFIG="$cfg"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: caymanlm defconfig not found."
            exit 1
          fi

          export ARCH=arm64
          export LLVM=1
          export O="$OUT"

          make O="$OUT" "$DEFCONFIG"
          make O="$OUT" olddefconfig

          grep -E \
            'CONFIG_(ARCH_QCOM|OF|OF_OVERLAY)=' \
            "$OUT/.config" \
            | tee "../$LOGDIR/dtbo-config.txt" || true

      - name: D05 — Discover REAL Kbuild DTBO targets
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "Searching actual Kbuild DTBO definitions..."

          {
            echo "=== DTBO SOURCE FILES ==="
            find arch/arm64/boot/dts \
              -type f \
              \( -name '*.dtso' -o -name '*.dtbo' \) \
              -print | sort

            echo
            echo "=== KBUILD DTBO REFERENCES ==="
            grep -Rni \
              --include='Makefile' \
              --include='Kbuild' \
              -E 'dtbo|caymanlm|sm7250' \
              arch/arm64/boot/dts \
              || true

          } | tee "../$LOGDIR/dtbo-target-discovery.txt"

      - name: D06 — Verify every selected overlay has a Kbuild rule
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          TARGETS="$(grep -Rho \
            --include='Makefile' \
            --include='Kbuild' \
            -E '[A-Za-z0-9._-]+\.dtbo' \
            arch/arm64/boot/dts \
            | sort -u || true)"

          if [ -z "$TARGETS" ]; then
            echo "ERROR: No real DTBO Kbuild target discovered."
            exit 1
          fi

          printf '%s\n' "$TARGETS" \
            | tee "../$LOGDIR/verified-dtbo-targets.txt"

      - name: D07 — Build DTBs and DTBOs
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export LLVM=1
          export O="$OUT"

          make -j"$(nproc)" \
            O="$OUT" \
            dtbs \
            2>&1 | tee "../$LOGDIR/dtbo-build.log"

      - name: D08 — Build actual dtbo.img
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          DTBO_FILES=()

          while IFS= read -r f; do
            DTBO_FILES+=("$f")
          done < <(
            find "$OUT/arch/arm64/boot/dts" \
              -type f \
              -name '*.dtbo' \
              | sort
          )

          if [ "${#DTBO_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No DTBO binary was produced."
            exit 1
          fi

          mkdir -p "$OUT/dtbo"

          echo "DTBO files:"
          printf '%s\n' "${DTBO_FILES[@]}" \
            | tee "../$LOGDIR/dtbo-output-list.txt"

          # Prefer Android mkdtimg supplied by the source tree/toolchain.
          MKDTIMG="$(find /opt "$HOME" . \
            -type f \
            -name mkdtimg \
            -perm -111 \
            2>/dev/null \
            | head -n1 || true)"

          if [ -z "$MKDTIMG" ]; then
            MKDTIMG="$(command -v mkdtimg || true)"
          fi

          if [ -z "$MKDTIMG" ]; then
            echo "ERROR: mkdtimg is not available."
            echo "DTBO binaries were built, but refusing to invent an image format."
            exit 1
          fi

          "$MKDTIMG" create \
            "$OUT/dtbo/dtbo.img" \
            "${DTBO_FILES[@]}" \
            2>&1 | tee "../$LOGDIR/mkdtimg.log"

          test -s "$OUT/dtbo/dtbo.img"

      - name: D09 — Verify DTBO image
        shell: bash
        run: |
          set -euxo pipefail

          test -s "$OUT/dtbo/dtbo.img"

          {
            echo "=== DTBO IMAGE ==="
            ls -lh "$OUT/dtbo/dtbo.img"

            echo
            echo "=== SHA256 ==="
            sha256sum "$OUT/dtbo/dtbo.img"

            echo
            echo "=== SOURCE COMMIT ==="
            cd kernel
            git rev-parse HEAD

          } | tee "$LOGDIR/dtbo-audit.txt"

      - name: D10 — DTBO identity audit
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "DEVICE=$DEVICE"
            echo "CODENAME=$CODENAME"
            echo "ANDROID_TARGET=Android 16 QPR2 GSI"
            echo "KERNEL_BASELINE=4.19.325-cip135"
            echo "SOURCE_REF=$SOURCE_REF"
            echo
            echo "No device identity replacement is performed here."
            echo "DTBO is generated from the matched caymanlm kernel DTS/Kbuild."
          } | tee "$LOGDIR/dtbo-identity-audit.txt"

      - name: D11 — Package flashable DTBO ZIP
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$OUT/dtbo-zip"

          cp "$OUT/dtbo/dtbo.img" \
            "$OUT/dtbo-zip/dtbo.img"

          cat > "$OUT/dtbo-zip/README.txt" <<'EOF'
          LG Velvet LM-G900
          Android 16 QPR2
          DTBO matched to kernel source
          Kernel baseline: 4.19.325-cip135

          This ZIP contains the raw dtbo.img.
          EOF

          cd "$OUT/dtbo-zip"

          zip -9 \
            "$OUT/LM-G900-Android16-QPR2-DTBO.zip" \
            dtbo.img README.txt

      - name: D12 — Final DTBO verification
        shell: bash
        run: |
          set -euxo pipefail

          unzip -t \
            "$OUT/LM-G900-Android16-QPR2-DTBO.zip" \
            | tee "$LOGDIR/dtbo-zip-test.txt"

          sha256sum \
            "$OUT/LM-G900-Android16-QPR2-DTBO.zip" \
            | tee "$LOGDIR/dtbo-zip-sha256.txt"

      - name: D13 — Complete DTBO diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$LOGDIR"

          {
            echo "=================================================="
            echo "DTBO COMPLETE DIAGNOSTICS"
            echo "=================================================="

            echo "DEVICE=$DEVICE"
            echo "CODENAME=$CODENAME"
            echo "SOURCE_REF=$SOURCE_REF"
            echo "CIP_TAG=$CIP_TAG"

            if [ -d kernel/.git ]; then
              cd kernel
              git status
              git log -5 --oneline --decorate
            fi

          } >> "$LOGDIR/final-dtbo-diagnostics.txt" 2>&1

      - name: D14 — Upload DTBO artifacts + COMPLETE logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-DTBO-Android16-QPR2-CIP135
          if-no-files-found: warn
          path: |
            out/dtbo/dtbo.img
            out/LM-G900-Android16-QPR2-DTBO.zip
            diagnostics/**
            kernel/.config
            kernel/.git/logs/**
            kernel/.git/HEAD
