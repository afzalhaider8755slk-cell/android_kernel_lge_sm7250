          MAKE_ARGS+=(KSU_NEXT_MANAGER_SIZE=0x3e6)
          MAKE_ARGS+=(KSU_NEXT_MANAGER_HASH=79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7)
          MAKE_ARGS+=(KSU_MANAGER_PACKAGE="${KSU_MANAGER_PACKAGE}")

