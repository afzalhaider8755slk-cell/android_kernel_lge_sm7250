          elif 'task_work_add(tsk, cb, KSU_TASK_WORK_RESUME)' not in s:
              raise SystemExit('expected KernelSU allowlist task_work_add(TWA_RESUME) call not found')

          p.write_text(s)
          PY_KSU_ALLOWLIST

            if ! grep -qF '#include <linux/sched/task.h>' "$KSU_ALLOWLIST"; then
              echo "[ERROR] allowlist.c is missing sched/task.h compatibility include."
              exit 1
            fi
            if ! grep -qF 'KSU_TASK_WORK_RESUME' "$KSU_ALLOWLIST"; then
              echo "[ERROR] allowlist.c task_work compatibility macro was not installed."
              exit 1
            fi
            if grep -qF 'task_work_add(tsk, cb, TWA_RESUME)' "$KSU_ALLOWLIST"; then
              echo "[ERROR] allowlist.c still uses the 5.7+ TWA_RESUME call directly."
              exit 1
            fi
            echo "[FIX] Applied Linux 4.19 task_work/put_task_struct compatibility to KernelSU allowlist."
          else
            echo "[ERROR] KernelSU allowlist.c not found; refusing to continue without compatibility fix."
            exit 1
          fi
          ) || echo "[SKIP-V46-UNVERIFIED] V35 allowlist.c task_work compat (KernelSU-Next-specific source): expected KernelSU-Next source pattern not found (or the file/pattern doesn't exist in ReSukiSU's source at this path) -- skipped without failing the build. If the kernel fails to compile or boot, check the real ReSukiSU source at this path and re-derive this specific patch; do not assume this shim applied."

          # V36 FIX 1 — Linux 4.19 KernelSU app_profile seccomp compatibility.
          # KernelSU-Next v3.3.0 resets seccomp.filter_count when escaping to root, but
          # Linux 4.19's struct seccomp has only mode + filter (no filter_count).
          # Keep the seccomp escape path intact and compile only the newer counter reset
          # on kernels that actually provide that member.
          (
          KSU_APP_PROFILE="drivers/kernelsu/policy/app_profile.c"
          if [ -f "$KSU_APP_PROFILE" ]; then
            python3 - "$KSU_APP_PROFILE" <<'PY_KSU_APP_PROFILE'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          old='    atomic_set(&current->seccomp.filter_count, 0);'
          new='#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n              atomic_set(&current->seccomp.filter_count, 0);\n          #endif'
