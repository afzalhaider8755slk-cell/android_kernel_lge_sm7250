name: V9-LM-G900-KARNAL-BUILT

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_REF: sixteen
  KERNEL_COMMIT: 720c8d37ab7727af24c275bead988d6345ad174b

  DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_caymanlm.git
  DEVICE_REF: sixteen
  COMMON_DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_sm7250-common.git
  COMMON_DEVICE_REF: sixteen
  VENDOR_REPO: https://github.com/Hirashi-so/proprietary_vendor_lge_caymanlm.git
  VENDOR_REF: sixteen

  BASELINE_KERNEL_SHA256: 85dd6083fd5a34135f301de661cae5f90b1aee82f4f5aa8d6dee30eacd34659d
  BASELINE_KERNEL_VERSION: 4.19.325
  BASELINE_CIP: v4.19.325-cip132
  CIP_PREFIX: v4.19.325-cip

  KSU_VERSION: v3.3.0
  SUSFS_VERSION: 2.2.0
  SUSFS_BACKPORT_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  SUSFS_BACKPORT_REF: mainline
  SUSFS_BACKPORT_COMMIT: f15603b246d7ce6008af8bdefa0a34b3df28326a
  # This repo documents susfs_patch_to_<kernel>.patch + susfs_inline_hook_patches.sh
  # as the two-layer non-GKI SUSFS integration path.

  CLANG_REV: clang-r563880c
  CLANG_COMMIT: f8439f0628d799092dd07df440a6334cab28939c
  WORKFLOW_VERSION: V9
  OUTPUT_PREFIX: V9-LM-G900-KARNAL
  # V9 fixes the V8 SUSFS compatibility failure and hardens reproducibility:
  # 1) pin the KernelSU-Next setup script itself to v3.3.0
  # 2) pin the SUSFS backport source to the audited commit
  # 3) discover the actual 4.19 backport filename used by that source
  # 4) try a strict direct apply first, then a Git 3-way merge against the staged CIP+KSUN tree
  # 5) reject any unresolved conflicts, .rej/.orig files, or conflict markers
  # 6) verify CONFIG_KSU_SUSFS exists before enabling it


jobs:
  build:
    name: Build V9
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "1. Checkout kernel source"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs diagnostics
          exec > >(tee -a logs/01-checkout.log) 2>&1
          echo "::group::[1/15] Checkout kernel source"
          git clone --branch "${KERNEL_REF}" "${KERNEL_REPO}" kernel
          cd kernel
          git fetch --tags --force --prune
          git checkout --detach "${KERNEL_COMMIT}"
          test "$(git rev-parse HEAD)" = "${KERNEL_COMMIT}"
          test "$(make -s kernelversion)" = "${BASELINE_KERNEL_VERSION}"
          git status --short > ../baseline-git-status.txt
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)" > ../source-info.txt
          printf 'SOURCE_BRANCH=%s\n' "${KERNEL_REF}" >> ../source-info.txt
          printf 'SOURCE_EXPECTED_COMMIT=%s\n' "${KERNEL_COMMIT}" >> ../source-info.txt
          printf 'KERNEL_VERSION=%s\n' "$(make -s kernelversion)" >> ../source-info.txt
          echo "[OK] Source: $(git rev-parse HEAD)"
          echo "[OK] Kernel version: $(make -s kernelversion)"
          echo "::endgroup::"

      - name: "2. Prepare build tools"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[2/15] Prepare build tools"
          {
            sudo apt-get update -qq
            sudo apt-get install -y -qq bc bison build-essential ccache clang flex gcc-aarch64-linux-gnu git lld libssl-dev libelf-dev libncurses-dev python3 rsync unzip zip wget curl device-tree-compiler patch
          } > logs/02-apt.log 2>&1
          curl -fL --retry 5 --retry-delay 2 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/${CLANG_REV}.tar.gz" -o "/tmp/${CLANG_REV}.tar.gz" > logs/02-clang-download.log 2>&1
          mkdir -p "clang-prebuilt/${CLANG_REV}"
          tar -xzf "/tmp/${CLANG_REV}.tar.gz" -C "clang-prebuilt/${CLANG_REV}" > logs/02-clang-extract.log 2>&1
          export CLANG_BIN="$GITHUB_WORKSPACE/clang-prebuilt/${CLANG_REV}/bin"
          test -x "${CLANG_BIN}/clang"
          test -x "${CLANG_BIN}/ld.lld"
          "${CLANG_BIN}/clang" --version | tee logs/02-clang-version.log
          head -n1 logs/02-clang-version.log > toolchain-version.txt
          echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"
          echo "[OK] Android Clang ${CLANG_REV}"
          echo "::endgroup::"

      - name: "3. Select and snapshot device defconfig"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs/device-tree diagnostics/device-tree
          exec > >(tee -a logs/03-defconfig-selection.log) 2>&1
          echo "::group::[3/15] Select and snapshot device defconfig"

          rm -rf device-caymanlm device-sm7250-common vendor-caymanlm
          git clone --depth=1 --branch "${DEVICE_REF}" "${DEVICE_REPO}" device-caymanlm
          git clone --depth=1 --branch "${COMMON_DEVICE_REF}" "${COMMON_DEVICE_REPO}" device-sm7250-common
          git clone --depth=1 --branch "${VENDOR_REF}" "${VENDOR_REPO}" vendor-caymanlm

          cp device-caymanlm/BoardConfig.mk logs/device-tree/BoardConfig.mk
          cp device-sm7250-common/BoardConfigCommon.mk logs/device-tree/BoardConfigCommon.mk
          cp vendor-caymanlm/BoardConfigVendor.mk logs/device-tree/BoardConfigVendor.mk

          TARGET_KERNEL_CONFIG="$({ grep -E '^[[:space:]]*TARGET_KERNEL_CONFIG[[:space:]]*:?=' device-caymanlm/BoardConfig.mk || true; } | tail -n1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//')"
          test -n "${TARGET_KERNEL_CONFIG}"
          test "${TARGET_KERNEL_CONFIG}" = "vendor/lineageos_cayman_defconfig"
          DEFCONFIG="arch/arm64/configs/${TARGET_KERNEL_CONFIG}"

          {
            echo "DEVICE_REPO=${DEVICE_REPO}"
            echo "DEVICE_REF=${DEVICE_REF}"
            echo "COMMON_DEVICE_REPO=${COMMON_DEVICE_REPO}"
            echo "COMMON_DEVICE_REF=${COMMON_DEVICE_REF}"
            echo "VENDOR_REPO=${VENDOR_REPO}"
            echo "VENDOR_REF=${VENDOR_REF}"
            echo "TARGET_KERNEL_CONFIG=${TARGET_KERNEL_CONFIG}"
            echo "DEFCONFIG=${DEFCONFIG}"
          } | tee logs/device-tree/selection.txt

          cd kernel
          test -f "${DEFCONFIG}"
          cp "${DEFCONFIG}" ../baseline-defconfig.txt
          sha256sum "${DEFCONFIG}" | tee ../logs/03-defconfig.sha256

          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          test -x "${CLANG_BIN}/clang"
          test -x "${CLANG_BIN}/ld.lld"
          make O=out "${TARGET_KERNEL_CONFIG}" > ../logs/03-defconfig-make.log 2>&1

          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' out/.config | sort > ../baseline-enabled-config.txt
          sha256sum ../baseline-enabled-config.txt | tee ../logs/03-baseline-enabled-config.sha256
          {
            echo "baseline_kernel_sha256=${BASELINE_KERNEL_SHA256}"
            echo "baseline_kernel_version=${BASELINE_KERNEL_VERSION}"
            echo "baseline_cip=${BASELINE_CIP}"
            echo "defconfig=${TARGET_KERNEL_CONFIG}"
            echo "baseline_enabled_config_count=$(wc -l < ../baseline-enabled-config.txt)"
          } > ../baseline-info.txt

          echo "[FIX] Toolchain prepared before defconfig; clang and ld.lld verified."
          echo "[OK] Device tree explicitly selects ${TARGET_KERNEL_CONFIG}"
          echo "[OK] Kernel defconfig exists: ${DEFCONFIG}"
          echo "::endgroup::"

      - name: "4. Resolve latest official CIP for 4.19.325"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[4/15] Resolve latest official CIP"
          cd kernel
          git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          git fetch --no-tags cip "+refs/tags/${BASELINE_CIP}:refs/tags/${BASELINE_CIP}" > ../logs/04-cip-baseline-fetch.log 2>&1
          git ls-remote --tags --refs cip "refs/tags/${CIP_PREFIX}*" > ../logs/04-cip-tags.txt 2>&1
          LATEST="$(awk -F/ '{print $NF}' ../logs/04-cip-tags.txt | grep -E "^${CIP_PREFIX}[0-9]+$" | sort -V | tail -n1)"
          test -n "${LATEST}"
          OLD_N="${BASELINE_CIP##*-cip}"; NEW_N="${LATEST##*-cip}"
          test "${NEW_N}" -ge "${OLD_N}"
          echo "CIP_TARGET=${LATEST}" >> "$GITHUB_ENV"
          git fetch --no-tags cip "refs/tags/${LATEST}:refs/tags/${LATEST}" > ../logs/04-cip-target-fetch.log 2>&1
          {
            echo "CIP_BASELINE=${BASELINE_CIP}"
            echo "CIP_TARGET=${LATEST}"
            echo "baseline_commit=$(git rev-parse ${BASELINE_CIP})"
            echo "target_commit=$(git rev-parse ${LATEST})"
            echo "target_subject=$(git show -s --format=%s ${LATEST})"
            git diff --stat "${BASELINE_CIP}..${LATEST}"
          } | tee ../logs/04-cip-version.log
          echo "[OK] Baseline: ${BASELINE_CIP}"
          echo "[OK] Latest official 4.19.325 CIP discovered: ${LATEST}"
          echo "::endgroup::"

      - name: "5. Select and apply first clean CIP delta"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[5/15] Select and apply first clean CIP delta"
          cd kernel
          mkdir -p ../logs/cip-checks
          git remote get-url cip >/dev/null 2>&1 || git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          # IMPORTANT: initialize diagnostics before any fetch/apply operation so a CIP
          # failure can never erase the evidence that explains why it failed.
          : > ../logs/05-cip-compatibility.log
          : > ../logs/05-cip-failure.log
          : > ../logs/05-cip-candidates.txt
          {
            echo "CIP compatibility probe"
            echo "Source commit=$(git rev-parse HEAD)"
            echo "Kernel version=$(make -s kernelversion)"
            echo "Baseline tag=${BASELINE_CIP}"
            echo "Remote=https://gitlab.com/cip-project/cip-kernel/linux-cip.git"
            echo
          } | tee -a ../logs/05-cip-compatibility.log

          # The previous V5 failure was not a CIP patch conflict. It was a Git ref
          # collision: step 4 had already created refs/tags/v4.19.325-cip136 and
          # step 5 tried to create the same local ref again without '+'.
          git ls-remote --tags --refs cip "refs/tags/${CIP_PREFIX}*" > ../logs/05-cip-tags.txt 2>&1
          mapfile -t CIP_TAGS < <(
            awk -F/ '{print $NF}' ../logs/05-cip-tags.txt |
              grep -E "^${CIP_PREFIX}[0-9]+$" |
              sort -V -r
          )
          test "${#CIP_TAGS[@]}" -gt 0
          {
            echo "Baseline=${BASELINE_CIP}"
            echo "Candidates=${#CIP_TAGS[@]}"
            printf '%s\n' "${CIP_TAGS[@]}"
          } | tee ../logs/05-cip-candidates.txt

          SELECTED=""
          BASE_N="${BASELINE_CIP##*-cip}"
          for TAG in "${CIP_TAGS[@]}"; do
            N="${TAG##*-cip}"
            if [ "${N}" -lt "${BASE_N}" ]; then
              continue
            fi

            CHECK_LOG="../logs/cip-checks/${TAG}.log"
            PATCH_FILE="../logs/cip-${TAG}.patch"
            {
              echo
              echo "============================================================"
              echo "TEST=${TAG}"
              echo "============================================================"
            } | tee -a ../logs/05-cip-compatibility.log

            # Fetch only when the exact local tag does not already exist.
            # '+' also makes the refspec safe if a stale local tag is present.
            if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
              echo "TAG_SOURCE=local-existing" | tee -a ../logs/05-cip-compatibility.log
            else
              echo "TAG_SOURCE=remote-fetch" | tee -a ../logs/05-cip-compatibility.log
              if ! git fetch --no-tags cip "+refs/tags/${TAG}:refs/tags/${TAG}" >> "$CHECK_LOG" 2>&1; then
                echo "FETCH_FAILED=${TAG}" | tee -a ../logs/05-cip-compatibility.log
                cat "$CHECK_LOG" | tee -a ../logs/05-cip-compatibility.log
                echo "INCOMPATIBLE=${TAG} reason=fetch-failed" | tee -a ../logs/05-cip-compatibility.log
                continue
              fi
            fi

            git diff --binary "${BASELINE_CIP}..${TAG}" > "$PATCH_FILE"
            {
              echo "baseline_commit=$(git rev-parse ${BASELINE_CIP})"
              echo "target_commit=$(git rev-parse ${TAG})"
              echo "patch_sha256=$(sha256sum "$PATCH_FILE" | awk '{print $1}')"
              echo "patch_bytes=$(wc -c < "$PATCH_FILE")"
              echo "patch_files=$(git diff --name-only "${BASELINE_CIP}..${TAG}" | wc -l)"
            } >> "$CHECK_LOG"

            # --check performs a non-mutating compatibility test. --3way allows
            # Git to use blob IDs from the real baseline/target history. We do
            # NOT force, fuzz, or silently drop a conflicting hunk.
            if git apply --check --3way "$PATCH_FILE" > "$CHECK_LOG.apply" 2>&1; then
              cat "$CHECK_LOG.apply" >> "$CHECK_LOG"
              echo "COMPATIBLE=${TAG}" | tee -a ../logs/05-cip-compatibility.log
              SELECTED="${TAG}"
              cp "$CHECK_LOG" "../logs/cip-checks/${TAG}.result.log"
              break
            else
              cat "$CHECK_LOG.apply" >> "$CHECK_LOG"
              {
                echo "INCOMPATIBLE=${TAG}"
                echo "=== conflict/error lines ==="
                grep -nE '(^error:|with conflicts|conflict|does not apply|patch failed|patch does not apply)' "$CHECK_LOG.apply" || true
              } | tee -a ../logs/05-cip-compatibility.log
              cp "$CHECK_LOG" "../logs/cip-checks/${TAG}.result.log"
            fi
          done

          if [ -z "${SELECTED}" ]; then
            {
              echo "[ERROR] No CIP tag from ${CIP_PREFIX}* can be applied cleanly to the exact baseline."
              echo "No conflict was forced, fuzzed, hidden, or removed."
              echo "The candidate logs are in logs/cip-checks/."
              echo "The aggregate result is logs/05-cip-compatibility.log."
            } | tee ../logs/05-cip-failure.log
            exit 1
          fi

          echo "CIP_TARGET=${SELECTED}" >> "$GITHUB_ENV"
          cp "../logs/cip-${SELECTED}.patch" ../logs/cip-selected.patch
          {
            echo "CIP_BASELINE=${BASELINE_CIP}"
            echo "CIP_TARGET=${SELECTED}"
            echo "baseline_commit=$(git rev-parse ${BASELINE_CIP})"
            echo "target_commit=$(git rev-parse ${SELECTED})"
            echo "target_subject=$(git show -s --format=%s ${SELECTED})"
            echo "selected_patch_sha256=$(sha256sum ../logs/cip-selected.patch | awk '{print $1}')"
            git diff --stat "${BASELINE_CIP}..${SELECTED}"
          } | tee ../logs/05-cip-version.log

          if ! git apply --3way --index ../logs/cip-selected.patch > ../logs/05-cip-apply.log 2>&1; then
            {
              echo "[ERROR] Selected CIP application failed after preflight."
              echo "Selected=${SELECTED}"
              echo "=== status ==="; git status --short
              echo "=== rejects ==="; find . -type f -name '*.rej' -print -exec sed -n '1,220p' {} \; || true
              echo "=== apply log ==="; cat ../logs/05-cip-apply.log
            } | tee ../logs/05-cip-failure.log
            exit 1
          fi

          test "$(make -s kernelversion)" = "${BASELINE_KERNEL_VERSION}"
          git diff --check | tee ../logs/05-cip-diff-check.log
          echo "[OK] Selected clean CIP target: ${SELECTED}"
          echo "::endgroup::"

      - name: "6. Integrate KernelSU-Next v3.3.0"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[6/15] KernelSU-Next ${KSU_VERSION}"
          cd kernel
          curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_VERSION}/kernel/setup.sh" -o ../logs/06-ksu-setup.sh
          chmod +x ../logs/06-ksu-setup.sh
          # V9 pins both the setup script and the resulting KernelSU-Next checkout to v3.3.0.
          bash ../logs/06-ksu-setup.sh "${KSU_VERSION}" 2>&1 | tee ../logs/06-kernelsu.log
          test -d KernelSU-Next
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          # Kconfig declares symbols as "config KSU"; it does not need the literal
          # string "CONFIG_KSU" inside the source Kconfig file.
          grep -Eq '^[[:space:]]*config[[:space:]]+KSU([[:space:]]|$)' drivers/kernelsu/Kconfig
          KSU_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          KSU_TAG="$(git -C KernelSU-Next describe --tags --exact-match HEAD 2>/dev/null || true)"
          test "${KSU_TAG}" = "${KSU_VERSION}"
          {
            echo "requested=${KSU_VERSION}"
            echo "resolved_tag=${KSU_TAG}"
            echo "resolved_commit=${KSU_COMMIT}"
            echo "kconfig_symbol=KSU"
            echo "symlink=$(readlink drivers/kernelsu)"
          } | tee ../logs/06-kernelsu-resolved.txt
          echo "[OK] KernelSU-Next ${KSU_VERSION} pinned integration"
          echo "::endgroup::"

      - name: "7. Integrate SUSFS 2.2.0 + 4.19 backport"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[7/15] SUSFS ${SUSFS_VERSION} 4.19 backport"
          rm -rf susfs-backport
          git clone --depth=1 --branch "${SUSFS_BACKPORT_REF}" "${SUSFS_BACKPORT_REPO}" susfs-backport 2>&1 | tee logs/07-susfs-clone.log
          SUSFS_BACKPORT_HEAD="$(git -C susfs-backport rev-parse HEAD)"
          echo "branch_head=${SUSFS_BACKPORT_HEAD}" | tee logs/07-susfs-backport-commit.log
          git -C susfs-backport ls-tree -r --name-only HEAD Patches | tee logs/07-susfs-patches-list.txt

          # V7 searched for "2.2.0" in the filename. The pinned backport repository
          # actually uses the stable filename Patches/Patch/susfs_patch_to_4.19.patch,
          # so V7 found zero candidates and stopped before testing the patch.
          # Pin the audited backport commit so a moving branch cannot silently change
          # the patch set between runs.
          git -C susfs-backport fetch --depth=1 origin "${SUSFS_BACKPORT_COMMIT}" 2>&1 | tee logs/07-susfs-pin-fetch.log || true
          git -C susfs-backport checkout --detach "${SUSFS_BACKPORT_COMMIT}" 2>&1 | tee logs/07-susfs-pin-checkout.log
          SUSFS_BACKPORT_RESOLVED="$(git -C susfs-backport rev-parse HEAD)"
          test "${SUSFS_BACKPORT_RESOLVED}" = "${SUSFS_BACKPORT_COMMIT}"
          echo "pinned_commit=${SUSFS_BACKPORT_RESOLVED}" >> logs/07-susfs-backport-commit.log

          mapfile -t CANDIDATES < <(
            git -C susfs-backport ls-tree -r --name-only HEAD Patches |
              grep -Ei '(^|/)susfs_patch_to_4[._-]?19\.patch$|(^|/)50_add_susfs_in_kernel[-_]?4[._-]?19\.patch$|(^|/)susfs.*4[._-]?19.*\.patch$|(^|/)4[._-]?19.*susfs.*\.patch$' |
              sort -u || true
          )

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "[ERROR] No SUSFS 4.19 backport patch was found in the pinned repository." | tee logs/07-susfs-failure.log
            exit 1
          fi
          printf '%s\n' "${CANDIDATES[@]}" | tee logs/07-susfs-candidates.txt

          # The V8 log proved that the patch is semantically the expected SUSFS patch,
          # but direct patch(1) application fails after CIP because CIP legitimately
          # changed several of the same VFS/proc/mm call sites. V9 therefore performs
          # two safe modes in order:
          #   A) strict direct git apply --check (no fuzz)
          #   B) Git's content-aware 3-way merge using the current staged tree as ours
          # A 3-way merge is NOT the same as --force or --fuzz: unresolved conflicts
          # return failure and are never accepted into the build.
          SELECTED_PATCH=""
          APPLY_MODE=""
          rm -f logs/07-susfs-candidate-*.patch logs/07-susfs-candidate-*.check logs/07-susfs-candidate-*.3way
          : > logs/07-susfs-compatibility.log

          # Stage the already validated CIP + KernelSU-Next source modifications so
          # git apply --3way has a correct 'ours' tree and can use the patch's blob
          # identities for common-base reconstruction.
          git add -A

          for PATCH_PATH in "${CANDIDATES[@]}"; do
            SAFE_NAME="$(printf '%s' "${PATCH_PATH}" | tr '/ ' '__' | tr -cd '[:alnum:]_.-')"
            TEST_PATCH="logs/07-susfs-candidate-${SAFE_NAME}.patch"
            TEST_LOG="logs/07-susfs-candidate-${SAFE_NAME}.check"
            TEST_3WAY="logs/07-susfs-candidate-${SAFE_NAME}.3way"
            git -C susfs-backport show "HEAD:${PATCH_PATH}" > "${TEST_PATCH}"

            # The patch must contain the core SUSFS implementation and public header.
            if ! grep -Eq 'diff --git a/fs/susfs\.c b/fs/susfs\.c' "${TEST_PATCH}" ||
               ! grep -Eq 'diff --git a/include/linux/susfs\.h b/include/linux/susfs\.h' "${TEST_PATCH}" ||
               ! grep -Eq 'CONFIG_KSU_SUSFS|config KSU_SUSFS' "${TEST_PATCH}"; then
              echo "INCOMPATIBLE=${PATCH_PATH} reason=not-a-complete-susfs-patch" | tee -a logs/07-susfs-compatibility.log
              continue
            fi

            # First: strict, zero-fuzz direct check.
            if (cd kernel && git apply --check --whitespace=nowarn "../${TEST_PATCH}") > "${TEST_LOG}" 2>&1; then
              SELECTED_PATCH="${PATCH_PATH}"
              APPLY_MODE="direct"
              cp "${TEST_PATCH}" logs/07-susfs-selected.patch
              cp "${TEST_LOG}" logs/07-susfs-selected-check.log
              echo "COMPATIBLE=${PATCH_PATH} mode=direct" | tee -a logs/07-susfs-compatibility.log
              break
            fi

            echo "DIRECT_INCOMPATIBLE=${PATCH_PATH}" | tee -a logs/07-susfs-compatibility.log
            cat "${TEST_LOG}" >> logs/07-susfs-compatibility.log

            # Second: content-aware 3-way preflight. Git may return 0 from
            # --check even when it reports "Applied patch ... with conflicts", so
            # inspect the preflight log as well as the exit status.
            if (cd kernel && git apply --3way --check --whitespace=nowarn "../${TEST_PATCH}") > "${TEST_3WAY}" 2>&1; then
              if ! grep -Eiq "with conflicts|CONFLICT|error:" "${TEST_3WAY}"; then
                SELECTED_PATCH="${PATCH_PATH}"
                APPLY_MODE="3way"
                cp "${TEST_PATCH}" logs/07-susfs-selected.patch
                cp "${TEST_3WAY}" logs/07-susfs-selected-3way-check.log
                echo "COMPATIBLE=${PATCH_PATH} mode=3way" | tee -a logs/07-susfs-compatibility.log
                break
              fi
            fi

            echo "THREEWAY_INCOMPATIBLE=${PATCH_PATH}" | tee -a logs/07-susfs-compatibility.log
            cat "${TEST_3WAY}" >> logs/07-susfs-compatibility.log
          done

          if [ -z "${SELECTED_PATCH}" ]; then
            {
              echo "[ERROR] No SUSFS 4.19 candidate is compatible with the CIP + KernelSU-Next tree."
              echo "Direct zero-fuzz apply and Git 3-way preflight were both rejected."
              echo "The V8 failure was a genuine source-context mismatch, not a filename-discovery issue."
              echo "See logs/07-susfs-candidate-*.check, logs/07-susfs-candidate-*.3way and logs/07-susfs-compatibility.log."
            } | tee logs/07-susfs-failure.log
            exit 1
          fi

          if [ "${APPLY_MODE}" = "direct" ]; then
            git -C kernel apply --whitespace=nowarn "../logs/07-susfs-selected.patch" 2>&1 | tee logs/07-susfs-apply.log
          else
            git -C kernel apply --3way --whitespace=nowarn "../logs/07-susfs-selected.patch" 2>&1 | tee logs/07-susfs-apply.log
          fi

          # JackA1ltman's audited non-GKI flow requires the SUSFS inline-hook patch
          # script in addition to the filesystem backport. This is the missing layer
          # in V8: the kernel patch alone does not finish the KernelSU/SUSFS hook wiring.
          INLINE_SCRIPT="Patches/susfs_inline_hook_patches.sh"
          test -f "susfs-backport/${INLINE_SCRIPT}"
          cp "susfs-backport/${INLINE_SCRIPT}" logs/07-susfs-inline-hook-patches.sh
          chmod +x logs/07-susfs-inline-hook-patches.sh
          (cd kernel && bash ../logs/07-susfs-inline-hook-patches.sh) 2>&1 | tee logs/07-susfs-inline-hooks.log

          # Never accept an unresolved 3-way merge or patch leftovers.
          if git -C kernel ls-files -u | grep -q .; then
            echo "[ERROR] SUSFS 3-way merge left unmerged index entries." | tee logs/07-susfs-failure.log
            git -C kernel status --short | tee -a logs/07-susfs-failure.log
            exit 1
          fi
          if find kernel -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
            echo "[ERROR] SUSFS application produced reject/original files." | tee logs/07-susfs-failure.log
            find kernel -type f \( -name '*.rej' -o -name '*.orig' \) -print | tee -a logs/07-susfs-failure.log
            exit 1
          fi
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' kernel --exclude-dir=.git > logs/07-susfs-conflict-markers.log 2>&1; then
            echo "[ERROR] SUSFS application left merge conflict markers." | tee logs/07-susfs-failure.log
            cat logs/07-susfs-conflict-markers.log | tee -a logs/07-susfs-failure.log
            exit 1
          fi

          test -f kernel/fs/susfs.c
          test -f kernel/include/linux/susfs.h
          test -f kernel/include/linux/susfs_def.h
          grep -Rqs 'KSU_SUSFS' kernel/fs/susfs.c kernel/include/linux/susfs.h kernel/include/linux/susfs_def.h kernel/drivers/kernelsu
          grep -Rqs 'config KSU_SUSFS' kernel/drivers/kernelsu kernel/fs kernel/include/linux
          git -C kernel diff --check | tee logs/07-susfs-diff-check.log
          git -C kernel add -A
          {
            echo "selected_patch=${SELECTED_PATCH}"
            echo "apply_mode=${APPLY_MODE}"
            echo "susfs_backport_commit=${SUSFS_BACKPORT_RESOLVED}"
            echo "requested_susfs_version=${SUSFS_VERSION}"
            echo "kernel_version=$(make -s -C kernel kernelversion)"
            echo "kernel_head=$(git -C kernel rev-parse HEAD)"
          } | tee logs/07-susfs-selected.txt
          echo "[OK] SUSFS ${SUSFS_VERSION} 4.19 backport integrated using ${APPLY_MODE} mode without fuzz."
          echo "::endgroup::"

      - name: "8. Configure features and enforce no-removal policy"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[8/15] Configure features"
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          make O=out "${TARGET_KERNEL_CONFIG}" > ../logs/08-defconfig.log 2>&1
          grep -RqsE "^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)" drivers/kernelsu fs include || { echo "[ERROR] KSU_SUSFS Kconfig symbol is missing after SUSFS + inline-hook integration."; exit 1; }
          ./scripts/config --file out/.config --enable KSU --enable KSU_SUSFS
          mapfile -t SUSFS_SYMBOLS < <(grep -RhoE '^config KSU_SUSFS_[A-Za-z0-9_]+' drivers/kernelsu fs include 2>/dev/null | awk '{print $2}' | sort -u)
          for sym in "${SUSFS_SYMBOLS[@]}"; do ./scripts/config --file out/.config --enable "${sym}" || true; done
          make O=out olddefconfig > ../logs/08-olddefconfig.log 2>&1
          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' out/.config | sort > ../post-integration-enabled-config.txt
          while IFS= read -r line; do
            sym="${line%%=*}"
            grep -q "^${sym}=" ../post-integration-enabled-config.txt || { echo "[ERROR] Baseline feature removed: ${sym}" | tee ../logs/08-no-removal-failure.log; exit 1; }
          done < ../baseline-enabled-config.txt
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          {
            echo "baseline_enabled=$(wc -l < ../baseline-enabled-config.txt)"
            echo "post_integration_enabled=$(wc -l < ../post-integration-enabled-config.txt)"
            echo "baseline_config_sha256=$(sha256sum ../baseline-enabled-config.txt | awk '{print $1}')"
            echo "post_integration_config_sha256=$(sha256sum ../post-integration-enabled-config.txt | awk '{print $1}')"
            grep -E '^CONFIG_(KSU|KPROBE|KPROBES|KSU_SUSFS)' out/.config || true
            echo "kernel_version=$(make -s O=out kernelversion)"
          } | tee ../logs/08-config-summary.log
          echo "[OK] No-removal gate passed"
          echo "::endgroup::"

      - name: "9. Build kernel"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[9/15] Build kernel"
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          make O=out -j"$(nproc)" CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCC=clang HOSTCXX=clang++ 2>&1 | tee ../logs/09-kernel-build.log
          test -s out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image | tee ../logs/output-image.sha256
          strings out/arch/arm64/boot/Image > ../logs/09-image-strings.txt
          if ! grep -m1 'Linux version ' ../logs/09-image-strings.txt > ../logs/09-image-version.log; then
            echo "[WARN] Linux version string was not found in Image; build artifact exists." | tee -a ../logs/09-image-version.log
          fi
          echo "[OK] Kernel Image built"
          echo "::endgroup::"

      - name: "10. Package AnyKernel3 and kernel.zip"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[10/15] Package AnyKernel3 and kernel.zip"
          rm -rf release work-anykernel
          mkdir -p release/logs release/build-info release/checksums work-anykernel
          cp kernel/out/arch/arm64/boot/Image release/kernel-image
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git work-anykernel 2>&1 | tee logs/10-anykernel-clone.log
          rm -rf work-anykernel/.git work-anykernel/modules work-anykernel/ramdisk
          cp kernel/out/arch/arm64/boot/Image work-anykernel/Image
          cat > work-anykernel/anykernel.sh <<'AK3'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=V9-LM-G900-KARNAL
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          '; }
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3
          (cd work-anykernel && zip -qr ../release/AnyKernel3-OrangeFox-Flashable.zip .)
          mkdir -p release/kernel-payload
          cp kernel/out/arch/arm64/boot/Image release/kernel-payload/Image
          cp source-info.txt baseline-info.txt toolchain-version.txt baseline-enabled-config.txt post-integration-enabled-config.txt release/build-info/ 2>/dev/null || true
          cp logs/*.log release/logs/ 2>/dev/null || true
          cp logs/*.patch release/logs/ 2>/dev/null || true
          (cd release/kernel-payload && zip -qr ../kernel.zip .)
          rm -rf release/kernel-payload
          {
            echo "workflow=${WORKFLOW_VERSION}"
            echo "workflow_name=V9-LM-G900-KARNAL-BUILT"
            echo "kernel_version=${BASELINE_KERNEL_VERSION}"
            echo "source_commit=$(git -C kernel rev-parse HEAD)"
            echo "cip_baseline=${BASELINE_CIP}"
            echo "cip_target=${CIP_TARGET}"
            echo "kernelsu_next=${KSU_VERSION}"
            echo "susfs_version=${SUSFS_VERSION}"
            echo "susfs_backport_repo=${SUSFS_BACKPORT_REPO}"
            echo "susfs_backport_ref=${SUSFS_BACKPORT_REF}"
            echo "clang=${CLANG_REV}"
            echo "clang_commit=${CLANG_COMMIT}"
            echo "defconfig=${TARGET_KERNEL_CONFIG}"
          } > release/build-info/build-manifest.txt
          sha256sum release/kernel-image release/kernel.zip release/AnyKernel3-OrangeFox-Flashable.zip > release/checksums/SHA256SUMS
          rm -f release/kernel-image
          (cd release && zip -qr "../${OUTPUT_PREFIX}-output.zip" .)
          echo "[OK] ${OUTPUT_PREFIX}-output.zip"
          echo "::endgroup::"

      - name: "11. Verify all final artifacts"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[11/15] Verify final artifacts"
          {
            test -s "${OUTPUT_PREFIX}-output.zip"
            test -s release/kernel.zip
            test -s release/AnyKernel3-OrangeFox-Flashable.zip
            unzip -t "${OUTPUT_PREFIX}-output.zip"
            unzip -t release/kernel.zip
            unzip -t release/AnyKernel3-OrangeFox-Flashable.zip
            unzip -l "${OUTPUT_PREFIX}-output.zip" | sed -n '1,220p'
          } 2>&1 | tee logs/11-artifact-verify.log
          echo "[OK] Final artifacts verified"
          echo "::endgroup::"

      - name: "12. Upload V9 final output"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: V9-LM-G900-KARNAL-output
          path: V9-LM-G900-KARNAL-output.zip
          if-no-files-found: error
          retention-days: 30

      - name: "13. Upload V9 flashable ZIPs"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: V9-LM-G900-KARNAL-flashable-zips
          path: |
            release/AnyKernel3-OrangeFox-Flashable.zip
            release/kernel.zip
          if-no-files-found: error
          retention-days: 30

      - name: "14. Collect complete diagnostics (always)"
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # Diagnostics must never fail the job a second time. In earlier versions the diagnostic
          # collector itself failed with "sort: write error: Broken pipe", masking
          # the original CIP failure. V9 writes large inventories to files and only
          # prints bounded summaries to the Actions console.
          set +e
          mkdir -p diagnostics diagnostics/logs diagnostics/cip-checks
          {
            echo "job_status=${JOB_STATUS}"
            echo "workflow=${WORKFLOW_VERSION}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "source_commit=${KERNEL_COMMIT}"
            echo "cip_baseline=${BASELINE_CIP}"
            echo "cip_target=${CIP_TARGET:-UNRESOLVED}"
            echo "kernelsu_next=${KSU_VERSION}"
            echo "susfs=${SUSFS_VERSION}"
            echo "susfs_backport_repo=${SUSFS_BACKPORT_REPO}"
            echo "susfs_backport_ref=${SUSFS_BACKPORT_REF}"
            echo "clang=${CLANG_REV} (${CLANG_COMMIT})"
            echo "baseline_kernel_sha256=${BASELINE_KERNEL_SHA256}"
            echo "defconfig=${TARGET_KERNEL_CONFIG:-UNRESOLVED}"
          } > diagnostics/run-summary.txt

          # Preserve every generated log, including partial logs from failed steps.
          cp -a logs/. diagnostics/logs/ 2>/dev/null || true
          cp -a logs/device-tree/. diagnostics/device-tree/ 2>/dev/null || true
          cp baseline-info.txt baseline-defconfig.txt baseline-enabled-config.txt \
             post-integration-enabled-config.txt source-info.txt toolchain-version.txt \
             baseline-git-status.txt diagnostics/ 2>/dev/null || true

          # Full workspace inventory goes to a file, not the Actions stdout pipe.
          find "$GITHUB_WORKSPACE" -type f \
            -not -path '*/.git/*' \
            -not -path '*/clang-prebuilt/*' \
            -printf '%P\t%s bytes\n' 2>/dev/null | sort > diagnostics/workspace-files.txt 2>/dev/null || true

          {
            echo "=== A-Z BUILD RECORD V9 ==="
            echo "Purpose=Preserve the known-working LM-G900 kernel baseline and add only CIP, KernelSU-Next, and SUSFS."
            echo "Device=LG Velvet LM-G900 family; codename=caymanlm"
            echo "Android/device branch=${DEVICE_REF}"
            echo "Kernel repo=${KERNEL_REPO}"
            echo "Kernel branch=${KERNEL_REF}"
            echo "Kernel commit=${KERNEL_COMMIT}"
            echo "Kernel version=${BASELINE_KERNEL_VERSION}"
            echo "Known-working baseline Image SHA256=${BASELINE_KERNEL_SHA256}"
            echo "Defconfig=${TARGET_KERNEL_CONFIG:-UNRESOLVED}"
            echo "CIP baseline=${BASELINE_CIP}"
            echo "CIP selected=${CIP_TARGET:-UNRESOLVED}"
            echo "KernelSU-Next=${KSU_VERSION}"
            echo "SUSFS=${SUSFS_VERSION}"
            echo "SUSFS backport repo=${SUSFS_BACKPORT_REPO}"
            echo "SUSFS backport ref=${SUSFS_BACKPORT_REF}"
            echo "Clang=${CLANG_REV}"
            echo "Clang commit=${CLANG_COMMIT}"
            echo "Architecture=arm64"
            echo "LLVM=1 LLVM_IAS=1"
            echo "No-removal policy=Every baseline enabled CONFIG_* symbol must remain present after integration."
            echo "Conflict policy=Never force, fuzz, or hide conflicts."
            echo
            echo "=== Repository revisions ==="
            git -C kernel rev-parse HEAD 2>/dev/null || true
            git -C device-caymanlm rev-parse HEAD 2>/dev/null || true
            git -C device-sm7250-common rev-parse HEAD 2>/dev/null || true
            git -C vendor-caymanlm rev-parse HEAD 2>/dev/null || true
            git -C susfs-backport rev-parse HEAD 2>/dev/null || true
            echo
            echo "=== Inventory file ==="
            echo "diagnostics/workspace-files.txt"
            echo
            echo "=== Kernel diff stat (staged + unstaged vs HEAD) ==="
            git -C kernel diff HEAD --stat 2>/dev/null || true
            echo
            echo "=== Kernel diff names (staged + unstaged vs HEAD) ==="
            git -C kernel diff HEAD --name-status 2>/dev/null || true
            echo
            echo "=== Final config ==="
            if [ -f kernel/out/.config ]; then
              sha256sum kernel/out/.config
              grep -E '^CONFIG_(KSU|KSU_SUSFS|KPROBES|KPROBE_EVENTS|MODULES)=' kernel/out/.config || true
            fi
            echo
            echo "=== Release hashes ==="
            find release -maxdepth 3 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum 2>/dev/null || true
          } > diagnostics/A-Z-BUILD-RECORD.txt 2>&1

          if [ -d kernel ]; then
            {
              echo "=== Kernel git status ==="; git -C kernel status --short || true
              echo; echo "=== Kernel HEAD ==="; git -C kernel rev-parse HEAD || true
              echo; echo "=== Kernel version ==="; make -s -C kernel kernelversion 2>/dev/null || true
              echo; echo "=== Reject files ==="; find kernel -type f -name '*.rej' -print 2>/dev/null || true
              echo; echo "=== Merge conflict markers ==="; grep -RInE '^(<<<<<<<|=======|>>>>>>>)' kernel --exclude-dir=.git 2>/dev/null | head -200 || true
            } > diagnostics/kernel-state.txt 2>&1
          fi

          # Copy the diagnostic bundle itself into the output zip only if the build
          # reached packaging; always create the separate complete-logs artifact.
          rm -f "../${OUTPUT_PREFIX}-complete-logs.zip"
          (cd diagnostics && zip -qr "../${OUTPUT_PREFIX}-complete-logs.zip" .) || true

          echo "::notice::V9 diagnostics collected; SUSFS compatibility fallback and artifact naming fixes are enabled."
          echo "::endgroup::"

      - name: "15. Upload V9 complete diagnostics (always)"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V9-LM-G900-KARNAL-complete-logs
          path: |
            V9-LM-G900-KARNAL-complete-logs.zip
            diagnostics/
            logs/
            baseline-info.txt
            baseline-defconfig.txt
            baseline-enabled-config.txt
            post-integration-enabled-config.txt
            baseline-git-status.txt
            source-info.txt
            toolchain-version.txt
          if-no-files-found: warn
          retention-days: 30
