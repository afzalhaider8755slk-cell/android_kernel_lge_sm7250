        echo \"baseline_file=$BASELINE_FILE\" | tee \"$DIAG_DIR/baseline-source.txt\"\
        \necho \"baseline_config_sha256=$BASELINE_SHA256\" | tee \"$DIAG_DIR/baseline-config.sha256\"\
