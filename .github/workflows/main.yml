name: LG Velvet G900EMW — Android 16 QPR2 Kernel + Vendor (independent)

on:
  workflow_dispatch:
    inputs:
      kernel_source_commit:
        description: Exact known-good kernel commit; blank = branch HEAD
        required: false
        default: ''
      android_manifest_url:
        description: Android 16/Lineage manifest URL
        required: true
        default: https://github.com/LineageOS/android.git
      android_manifest_branch:
        description: Android 16 manifest branch
        required: true
        default: lineage-23.2
      device_branch:
        description: Device-tree branch/ref (must actually exist)
        required: true
        default: lineage-23.2
      vendor_branch:
        description: Vendor-tree branch/ref (must actually exist)
        required: true
        default: lineage-23.2
  push:
    branches: [sixteen]

permissions:
  contents: read
  actions: read

concurrency:
  group: g900emw-android16-kernel-vendor-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE: G900EMW
  CODENAME: caymanlm
  KERNEL_BRANCH: sixteen
  DEFCONFIG: vendor/caymanlm_defconfig
  ARCH: arm64
  KERNEL_OUT: ${{ github.workspace }}/kernel/out
  DIAG_ROOT: ${{ github.workspace }}/ci-diagnostics

  # Pinned, reproducible root stack.
  SUKISU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
  SUKISU_REF: 3f602b5
  SUKISU_VERSION: 4.1.3
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_REF: 001e69919c6271f690fd00b17e4c721c9e599152
  SUSFS_VERSION: 1.5.5

  DEVICE_REPO: https://github.com/lge-qcom-dev/android_device_lge_caymanlm.git
  COMMON_DEVICE_REPO: https://github.com/lge-qcom-dev/android_device_lge_sm7250-common.git
  VENDOR_REPO: https://github.com/lge-qcom-dev/proprietary_vendor_lge_caymanlm.git
  COMMON_VENDOR_REPO: https://github.com/lge-qcom-dev/proprietary_vendor_lge_sm7250-common.git
  TARGET_PRODUCT: lineage_caymanlm
  TARGET_VARIANT: userdebug

jobs:
  kernel:
    name: KERNEL — 4.19.325 + SukiSU-Ultra 4.1.3 + SUSFS 1.5.5 + KPM
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_source_commit != '' && inputs.kernel_source_commit || github.ref_name }}
          fetch-depth: 0

      - name: Install kernel dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison flex build-essential ccache clang lld llvm \
            libssl-dev libelf-dev libdw-dev device-tree-compiler \
            python3 python-is-python3 git rsync zip unzip dwarves curl patch
          test -x /usr/bin/python

      - name: Initialize diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$DIAG_ROOT/kernel" "$KERNEL_OUT" "$GITHUB_WORKSPACE/artifacts/kernel"
          {
            echo "device=$DEVICE"
            echo "codename=$CODENAME"
            echo "kernel_branch=$KERNEL_BRANCH"
            echo "kernel_commit=$(git rev-parse HEAD)"
            echo "defconfig=$DEFCONFIG"
            echo "kernel_target=Android 16 QPR2 GSI"
            echo "features=SukiSU-Ultra+KPM+SUSFS+WALT+SchedTune+ZRAM+LTO"
            echo "hardware=Fingerprint+Vibration+DualSIM+Audio+VoWiFi"
            date -u +%FT%TZ
          } | tee "$DIAG_ROOT/kernel/00-context.txt"

      - name: Select deterministic LLVM toolchain
        shell: bash
        run: |
          set -euxo pipefail
          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          clang --version | head -n 2 | tee "$DIAG_ROOT/kernel/01-toolchain.txt"
          ld.lld --version | head -n 1 | tee -a "$DIAG_ROOT/kernel/01-toolchain.txt"
          echo "LLVM=1" >> "$DIAG_ROOT/kernel/01-toolchain.txt"
          echo "LLVM_IAS=1" >> "$DIAG_ROOT/kernel/01-toolchain.txt"

          # Legacy LG 4.19 trees sometimes miss the helper used by as-version.sh.
          # Restore only the missing helper; never overwrite an existing source file.
          if test -f scripts/as-version.sh && ! test -f scripts/min-tool-version.sh; then
            printf '%s\n' \
              '#!/bin/sh' 'set -e' 'case "$1" in' \
              '  binutils) echo 2.25.0 ;;' \
              '  gcc) echo 5.1.0 ;;' \
              '  llvm) echo 10.0.1 ;;' \
              '  *) echo "$1: unknown tool" >&2; exit 1 ;;' \
              'esac' > scripts/min-tool-version.sh
          fi
          test -f scripts/as-version.sh
          test -f scripts/min-tool-version.sh
          chmod +x scripts/as-version.sh scripts/min-tool-version.sh

      - name: Generate pristine baseline config
        shell: bash
        run: |
          set -euxo pipefail
          CFG_SRC="arch/arm64/configs/$DEFCONFIG"
          test -s "$CFG_SRC"
          sha256sum "$CFG_SRC" | tee "$DIAG_ROOT/kernel/02-defconfig.sha256"
          make O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            "$DEFCONFIG" 2>&1 | tee "$DIAG_ROOT/kernel/03-defconfig.log"
          cp "$KERNEL_OUT/.config" "$DIAG_ROOT/kernel/working.config"

      - name: Integrate SukiSU-Ultra 4.1.3 deterministically
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf SukiSU-Ultra drivers/kernelsu
          git clone --filter=blob:none --no-checkout "$SUKISU_REPO" SukiSU-Ultra
          git -C SukiSU-Ultra fetch --depth=1 origin "$SUKISU_REF"
          git -C SukiSU-Ultra checkout --detach "$SUKISU_REF"
          test "$(git -C SukiSU-Ultra rev-parse HEAD)" = "$SUKISU_REF"
          test -f SukiSU-Ultra/kernel/Kconfig
          test -f SukiSU-Ultra/kernel/Makefile
          git -C SukiSU-Ultra rev-parse HEAD | tee "$DIAG_ROOT/kernel/04-sukisu-ref.txt"

          mkdir -p drivers
          ln -s "$PWD/SukiSU-Ultra/kernel" drivers/kernelsu
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q '^obj-$(CONFIG_KSU) += kernelsu/$' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

      - name: Apply SUSFS 1.5.5 only after exact dry-run match
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf susfs
          git clone --filter=blob:none --no-checkout "$SUSFS_REPO" susfs
          git -C susfs fetch --depth=1 origin "$SUSFS_REF"
          git -C susfs checkout --detach "$SUSFS_REF"
          test -f susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          git -C susfs rev-parse HEAD | tee "$DIAG_ROOT/kernel/05-susfs-ref.txt"

          # Never accept fuzz, partial application, or a different 4.19 patch set.
          patch --dry-run --batch --forward --fuzz=0 -p1 \
            < susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch \
            2>&1 | tee "$DIAG_ROOT/kernel/06-susfs-dry-run.log"
          patch --batch --forward --fuzz=0 -p1 \
            < susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch \
            2>&1 | tee "$DIAG_ROOT/kernel/07-susfs-apply.log"

          if find . -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
            echo "::error::Patch reject/orig files remain after SUSFS application"
            find . -type f \( -name '*.rej' -o -name '*.orig' \) -print
            exit 1
          fi

      - name: Configure the finalized feature set
        shell: bash
        run: |
          set -euxo pipefail
          CFG="$KERNEL_OUT/.config"
          test -x scripts/config

          # Android 16/GSI-relevant filesystem/security requirements.
          scripts/config --file "$CFG" \
            --enable BPF --enable BPF_SYSCALL --enable BPF_JIT \
            --enable CGROUP_BPF \
            --enable OVERLAY_FS \
            --enable TMPFS --enable TMPFS_XATTR \
            --enable SECURITY --enable SECURITY_SELINUX \
            --enable DM_VERITY --enable DM_VERITY_FEC --enable FS_VERITY \
            --enable ZRAM --enable ZSMALLOC \
            --enable KALLSYMS --enable KALLSYMS_ALL

          # Performance features explicitly approved for this build.
          test "$(grep -c '^config SCHED_WALT$' kernel/Kconfig 2>/dev/null || true)" -ge 0
          scripts/config --file "$CFG" --enable SCHED_WALT
          scripts/config --file "$CFG" --enable SCHED_TUNE

          # KSU/SUSFS/KPM: require the symbols instead of silently ignoring them.
          scripts/config --file "$CFG" --enable KSU
          scripts/config --file "$CFG" --enable KSU_MANUAL_HOOK
          scripts/config --file "$CFG" --enable KPM
          scripts/config --file "$CFG" --enable KALLSYMS --enable KALLSYMS_ALL

          # LTO: use ThinLTO when this exact 4.19 tree exposes it, otherwise fail
          # instead of silently falling back to LTO_NONE.
          if grep -q '^config LTO_CLANG_THIN' init/Kconfig arch/arm64/Kconfig* 2>/dev/null; then
            scripts/config --file "$CFG" --disable LTO_NONE --enable LTO_CLANG --enable LTO_CLANG_THIN
          elif grep -q '^config LTO_CLANG$' init/Kconfig 2>/dev/null; then
            scripts/config --file "$CFG" --disable LTO_NONE --enable LTO_CLANG
          else
            echo "::error::This kernel source does not expose a usable Clang LTO option"
            exit 1
          fi

          # Preserve stock KPROBES state; non-GKI SukiSU uses manual hooks.
          scripts/config --file "$CFG" --disable KPROBES

          make O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm olddefconfig \
            2>&1 | tee "$DIAG_ROOT/kernel/08-olddefconfig.log"

          cp "$CFG" "$DIAG_ROOT/kernel/final.config"

      - name: Hard-gate every finalized kernel feature
        shell: bash
        run: |
          set -euxo pipefail
          CFG="$KERNEL_OUT/.config"
          req() { grep -q "^$1=y$" "$CFG" || { echo "::error::Missing $1"; exit 1; }; }
          off() { grep -q "^# $1 is not set$" "$CFG" || { echo "::error::$1 must remain disabled"; exit 1; }; }

          req CONFIG_KSU
          req CONFIG_KSU_MANUAL_HOOK
          req CONFIG_KPM
          req CONFIG_KALLSYMS
          req CONFIG_KALLSYMS_ALL
          req CONFIG_SUSFS
          req CONFIG_KSU_SUSFS
          req CONFIG_SCHED_WALT
          req CONFIG_SCHED_TUNE
          req CONFIG_ZRAM
          req CONFIG_ZSMALLOC
          req CONFIG_BPF
          req CONFIG_BPF_SYSCALL
          req CONFIG_OVERLAY_FS
          req CONFIG_TMPFS
          req CONFIG_SECURITY_SELINUX
          req CONFIG_DM_VERITY
          req CONFIG_FS_VERITY
          off CONFIG_KPROBES

          if grep -q '^CONFIG_LTO_CLANG_THIN=y$' "$CFG" || grep -q '^CONFIG_LTO_CLANG=y$' "$CFG"; then
            echo 'LTO=enabled'
          else
            echo '::error::LTO is not enabled'; exit 1
          fi

          grep -E '^(CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_SUSFS|CONFIG_KSU_SUSFS|CONFIG_SCHED_WALT|CONFIG_SCHED_TUNE|CONFIG_ZRAM|CONFIG_ZSMALLOC|CONFIG_LTO_)' "$CFG" \
            | tee "$DIAG_ROOT/kernel/09-final-feature-config.txt"

      - name: Build kernel and modules
        shell: bash
        run: |
          set -o pipefail
          make O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            -j"$(nproc)" Image modules 2>&1 | tee "$DIAG_ROOT/kernel/10-build.log"

      - name: Verify and package kernel
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE="$KERNEL_OUT/arch/arm64/boot/Image"
          test -s "$IMAGE"
          file "$IMAGE" | tee "$DIAG_ROOT/kernel/11-image-file.txt"
          sha256sum "$IMAGE" | tee "$DIAG_ROOT/kernel/11-image.sha256"
          cp "$IMAGE" "$GITHUB_WORKSPACE/artifacts/kernel/Image"
          cp "$KERNEL_OUT/.config" "$GITHUB_WORKSPACE/artifacts/kernel/final.config"

          rm -rf AnyKernel3
          git clone --filter=blob:none --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp "$IMAGE" AnyKernel3/Image
          cat > AnyKernel3/anykernel.sh <<'AK'
          properties() { '
          kernel.string=LG Velvet G900EMW Android 16 QPR2 4.19.325 SukiSU-Ultra 4.1.3 KPM SUSFS 1.5.5
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          device.name2=G900EMW
          '; }
          block=auto;
          is_slot_device=auto;
          AK
          (cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/artifacts/kernel/G900EMW-Android16-QPR2-Kernel-OrangeFox-Flashable.zip" . -x '.git/*' 'README.md' '*placeholder')
          sha256sum "$GITHUB_WORKSPACE/artifacts/kernel/G900EMW-Android16-QPR2-Kernel-OrangeFox-Flashable.zip" | tee "$DIAG_ROOT/kernel/12-anykernel.sha256"

      - name: Upload kernel artifact ALWAYS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G900EMW-kernel-${{ github.run_id }}
          path: |
            ci-diagnostics/kernel/**
            artifacts/kernel/**
            kernel/out/.config
            kernel/out/arch/arm64/boot/Image
          if-no-files-found: warn
          retention-days: 14

  vendor:
    name: VENDOR — Android 16 QPR2 vendor.img (independent)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Prepare vendor diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$DIAG_ROOT/vendor" android
          {
            echo "device=$DEVICE"
            echo "target=$TARGET_PRODUCT-$TARGET_VARIANT"
            echo "manifest=${{ inputs.android_manifest_branch || 'lineage-23.2' }}"
            echo "device_ref=${{ inputs.device_branch || 'lineage-23.2' }}"
            echo "vendor_ref=${{ inputs.vendor_branch || 'lineage-23.2' }}"
            echo "priority=Fingerprint+Vibration+DualSIM+Audio+VoWiFi"
            date -u +%FT%TZ
          } | tee "$DIAG_ROOT/vendor/00-context.txt"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex git gperf \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools unzip xsltproc \
            zip zstd python3 python3-pip python3-venv device-tree-compiler lzip

      - name: Bootstrap repo with stable launcher and verify manifest branch
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          git clone --depth=1 https://gerrit.googlesource.com/git-repo repo
          export PATH="$PWD/repo:$PATH"
          # IMPORTANT: repo launcher branch is stable; manifest branch is separate.
          # This fixes the previous 'unknown branch main' launcher failure.
          python3 repo/repo init --repo-rev=stable \
            -u "${{ inputs.android_manifest_url || 'https://github.com/LineageOS/android.git' }}" \
            -b "${{ inputs.android_manifest_branch || 'lineage-23.2' }}" --depth=1 \
            2>&1 | tee "$DIAG_ROOT/vendor/01-repo-init.log"

      - name: Preflight device/vendor refs before repo sync
        shell: bash
        run: |
          set -euxo pipefail
          DEVICE_REF="${{ inputs.device_branch || 'lineage-23.2' }}"
          VENDOR_REF="${{ inputs.vendor_branch || 'lineage-23.2' }}"
          check_ref() {
            local url="$1" ref="$2" label="$3"
            git ls-remote --exit-code --heads --tags "$url" "$ref" >/dev/null \
              || { echo "::error::$label ref '$ref' does not exist at $url"; exit 1; }
          }
          check_ref "$DEVICE_REPO" "$DEVICE_REF" device-tree
          check_ref "$COMMON_DEVICE_REPO" "$DEVICE_REF" common-device-tree
          check_ref "$VENDOR_REPO" "$VENDOR_REF" vendor-tree
          check_ref "$COMMON_VENDOR_REPO" "$VENDOR_REF" common-vendor-tree
          {
            echo "device_ref=$DEVICE_REF"
            echo "vendor_ref=$VENDOR_REF"
            git ls-remote "$DEVICE_REPO" "$DEVICE_REF" | head -n 1
            git ls-remote "$VENDOR_REPO" "$VENDOR_REF" | head -n 1
          } | tee "$DIAG_ROOT/vendor/02-ref-preflight.txt"

      - name: Add G900EMW device/vendor local manifest
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/g900emw.xml <<XML
          <manifest>
            <remote name="github" fetch="https://github.com/" />
            <project name="lge-qcom-dev/android_device_lge_caymanlm" path="device/lge/caymanlm" remote="github" revision="${{ inputs.device_branch || 'lineage-23.2' }}" />
            <project name="lge-qcom-dev/android_device_lge_sm7250-common" path="device/lge/sm7250-common" remote="github" revision="${{ inputs.device_branch || 'lineage-23.2' }}" />
            <project name="lge-qcom-dev/proprietary_vendor_lge_caymanlm" path="vendor/lge/caymanlm" remote="github" revision="${{ inputs.vendor_branch || 'lineage-23.2' }}" />
            <project name="lge-qcom-dev/proprietary_vendor_lge_sm7250-common" path="vendor/lge/sm7250-common" remote="github" revision="${{ inputs.vendor_branch || 'lineage-23.2' }}" />
          </manifest>
          XML
          export PATH="$PWD/repo:$PATH"
          repo sync -c --force-sync --no-clone-bundle --no-tags \
            --partial-clone --clone-filter=blob:limit=10m -j"$(nproc)" \
            2>&1 | tee "$DIAG_ROOT/vendor/03-repo-sync.log"

      - name: Verify exact device/vendor trees
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          test -f device/lge/caymanlm/BoardConfig.mk
          test -f device/lge/caymanlm/device.mk
          test -f device/lge/sm7250-common/BoardConfigCommon.mk
          test -f vendor/lge/caymanlm/caymanlm-vendor.mk
          test -d vendor/lge/caymanlm/proprietary/vendor
          {
            echo "device=$(git -C device/lge/caymanlm rev-parse HEAD)"
            echo "common_device=$(git -C device/lge/sm7250-common rev-parse HEAD)"
            echo "vendor=$(git -C vendor/lge/caymanlm rev-parse HEAD)"
            echo "common_vendor=$(git -C vendor/lge/sm7250-common rev-parse HEAD)"
            find vendor/lge/caymanlm/proprietary/vendor -type f | wc -l
          } | tee "$DIAG_ROOT/vendor/04-tree-state.txt"

      - name: Mandatory hardware and VoWiFi audit
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          {
            echo '=== Fingerprint ==='
            grep -RniE 'fingerprint|biometric|egis|goodix|fpc' device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm | head -250 || true
            echo '=== Vibration ==='
            grep -RniE 'vibrator|haptic|haptics' device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm | head -250 || true
            echo '=== Dual SIM / Radio ==='
            grep -RniE 'dsds|dual.?sim|subscription|radio|ril|ims' device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm | head -300 || true
            echo '=== Audio ==='
            grep -RniE 'audio|tinyalsa|audio_policy|mixer|snd|sound' device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm | head -300 || true
            echo '=== Wi-Fi Calling / IMS ==='
            grep -RniE 'vowifi|wifi.?calling|ims|volte|iwlan|ePDG|epdg|carrierconfig' device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm | head -400 || true
            echo '=== VINTF ==='
            find device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm -type f \
              \( -name '*manifest*.xml' -o -name '*compatibility*.xml' -o -name 'vintf*.xml' \) -print | sort
          } | tee "$DIAG_ROOT/vendor/05-hardware-vowifi-audit.txt"

          test -f device/lge/sm7250-common/framework_compatibility_matrix.xml
          test -f vendor/lge/caymanlm/caymanlm-vendor.mk

      - name: Android 16 VINTF/API audit
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          {
            grep -RnsE 'ro.vendor.api_level|ro.vndk.version|BOARD_VNDK_VERSION|VNDK' \
              device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm || true
            grep -RnsE 'manifest|compatibility_matrix|vintf' \
              device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm | head -400 || true
          } | tee "$DIAG_ROOT/vendor/06-vintf-api-audit.txt"

      - name: Build vendor.img
        shell: bash
        run: |
          set -o pipefail
          cd android
          source build/envsetup.sh
          lunch "${TARGET_PRODUCT}-${TARGET_VARIANT}" 2>&1 | tee "$GITHUB_WORKSPACE/$DIAG_ROOT/vendor/07-lunch.log"
          m vendorimage -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/$DIAG_ROOT/vendor/08-vendorimage.log"

      - name: Verify vendor.img and package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          IMG="out/target/product/$CODENAME/vendor.img"
          test -s "$IMG"
          file "$IMG" | tee "$GITHUB_WORKSPACE/$DIAG_ROOT/vendor/09-vendor-file.txt"
          sha256sum "$IMG" | tee "$GITHUB_WORKSPACE/$DIAG_ROOT/vendor/09-vendor.sha256"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/vendor"
          cp "$IMG" "$GITHUB_WORKSPACE/artifacts/vendor/G900EMW-Android16-QPR2-vendor.img"
          (cd "$GITHUB_WORKSPACE/artifacts/vendor" && zip -9 G900EMW-Android16-QPR2-vendor.img.zip G900EMW-Android16-QPR2-vendor.img)

      - name: Upload vendor artifact ALWAYS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G900EMW-vendor-${{ github.run_id }}
          path: |
            ci-diagnostics/vendor/**
            artifacts/vendor/**
            android/out/target/product/caymanlm/vendor.img
          if-no-files-found: warn
          retention-days: 14

  bundle:
    name: BUNDLE — independent kernel/vendor collection
    runs-on: ubuntu-24.04
    needs: [kernel, vendor]
    if: always()
    steps:
      - name: Download kernel result if present
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: G900EMW-kernel-*
          path: collected/kernel
          merge-multiple: true
      - name: Download vendor result if present
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: G900EMW-vendor-*
          path: collected/vendor
          merge-multiple: true
      - name: Create status report
        shell: bash
        run: |
          set -u
          mkdir -p collected/report
          {
            echo 'LG Velvet G900EMW — Android 16 QPR2 build'
            echo 'kernel_job=${{ needs.kernel.result }}'
            echo 'vendor_job=${{ needs.vendor.result }}'
            echo
            echo 'Kernel and vendor are independent. Re-running one does not rebuild the other.'
            echo
            find collected -type f -printf '%p\n' | sort
          } | tee collected/report/combined-status.txt
      - name: Upload combined bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G900EMW-complete-build-${{ github.run_id }}
          path: collected/**
          if-no-files-found: warn
          retention-days: 14
