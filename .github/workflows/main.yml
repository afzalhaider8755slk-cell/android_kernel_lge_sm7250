name: V99-LM-G900-KARNAL-BUILT

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_REF: sixteen
  KERNEL_COMMIT: 720c8d37ab7727af24c275bead988d6345ad174b
  DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_caymanlm.git
  DEVICE_REF: sixteen
  COMMON_DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_sm7250-common.git
  COMMON_DEVICE_REF: sixteen
  VENDOR_REPO: https://github.com/Hirashi-so/proprietary_vendor_lge_caymanlm.git
  VENDOR_REF: sixteen
  BASELINE_KERNEL_SHA256: 85dd6083fd5a34135f301de661cae5f90b1aee82f4f5aa8d6dee30eacd34659d
  BASELINE_KERNEL_VERSION: 4.19.325
  BASELINE_CIP: v4.19.325-cip132
  CIP_PREFIX: v4.19.325-cip
  KSU_VERSION: v3.3.0
  SUSFS_VERSION: 2.3.0
  SUSFS_BACKPORT_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  SUSFS_BACKPORT_REF: mainline
  CLANG_REV: clang-r563880c
  CLANG_COMMIT: f8439f0628d799092dd07df440a6334cab28939c
  WORKFLOW_VERSION: V99
  OUTPUT_PREFIX: V99-LM-G900-KARNAL

jobs:
  build:
    name: Build V99
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "1. Checkout exact kernel source"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs diagnostics
          git clone --branch "${KERNEL_REF}" "${KERNEL_REPO}" kernel
          cd kernel
          git fetch --tags --force --prune
          git checkout --detach "${KERNEL_COMMIT}"
          test "$(git rev-parse HEAD)" = "${KERNEL_COMMIT}"
          test "$(make -s kernelversion)" = "${BASELINE_KERNEL_VERSION}"
          git status --short > ../baseline-git-status.txt
          printf 'SOURCE_COMMIT=%s\nSOURCE_BRANCH=%s\nSOURCE_EXPECTED_COMMIT=%s\nKERNEL_VERSION=%s\n' "$(git rev-parse HEAD)" "${KERNEL_REF}" "${KERNEL_COMMIT}" "$(make -s kernelversion)" > ../source-info.txt
          echo "[OK] Exact source ${KERNEL_COMMIT} / ${BASELINE_KERNEL_VERSION}"

      - name: "2. Checkout device and vendor sources; preserve baseline config"
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth=1 --branch "${DEVICE_REF}" "${DEVICE_REPO}" device-caymanlm
          git clone --depth=1 --branch "${COMMON_DEVICE_REF}" "${COMMON_DEVICE_REPO}" device-sm7250-common
          git clone --depth=1 --branch "${VENDOR_REF}" "${VENDOR_REPO}" vendor-caymanlm
          TARGET_KERNEL_CONFIG="$(grep -E '^[[:space:]]*TARGET_KERNEL_CONFIG[[:space:]]*:?=' device-caymanlm/BoardConfig.mk | tail -n1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//')"
          if [ -z "${TARGET_KERNEL_CONFIG}" ]; then
            mapfile -t DEFS < <(find kernel/arch/arm64/configs -maxdepth 2 -type f \( -iname '*cayman*defconfig' -o -iname '*sm7250*defconfig' -o -iname '*g900*defconfig' \) -print | sort)
            test "${#DEFS[@]}" -ge 1
            DEFCONFIG_FILENAME="${DEFS[0]##*/}"
          else
            DEFCONFIG_FILENAME="${TARGET_KERNEL_CONFIG##*/}"
          fi
          echo "DEFCONFIG_FILENAME=${DEFCONFIG_FILENAME}" | tee logs/02-defconfig-selection.log
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          cd kernel
          test -f "arch/arm64/configs/${DEFCONFIG_FILENAME}"
          cp "arch/arm64/configs/${DEFCONFIG_FILENAME}" ../baseline-defconfig.txt
          make O=out "${DEFCONFIG_FILENAME}" > ../logs/02-defconfig-make.log 2>&1
          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' out/.config | sort > ../baseline-enabled-config.txt
          sha256sum ../baseline-enabled-config.txt > ../logs/02-baseline-enabled-config.sha256
          echo "DEFCONFIG_FILENAME=${DEFCONFIG_FILENAME}" >> "$GITHUB_ENV"

      - name: "3. Prepare toolchain"
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache clang flex gcc-aarch64-linux-gnu git lld libssl-dev libelf-dev libncurses-dev python3 rsync unzip zip wget curl device-tree-compiler patch
          curl -fL --retry 5 --retry-delay 2 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/${CLANG_REV}.tar.gz" -o "/tmp/${CLANG_REV}.tar.gz"
          mkdir -p "clang-prebuilt/${CLANG_REV}"
          tar -xzf "/tmp/${CLANG_REV}.tar.gz" -C "clang-prebuilt/${CLANG_REV}"
          export CLANG_BIN="$GITHUB_WORKSPACE/clang-prebuilt/${CLANG_REV}/bin"
          test -x "${CLANG_BIN}/clang"; test -x "${CLANG_BIN}/ld.lld"
          "${CLANG_BIN}/clang" --version | tee logs/03-clang-version.log
          echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"

      - name: "4. Resolve and apply compatible CIP delta"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          git fetch --no-tags cip "+refs/tags/${BASELINE_CIP}:refs/tags/${BASELINE_CIP}"
          git ls-remote --tags --refs cip "refs/tags/${CIP_PREFIX}*" > ../logs/04-cip-tags.txt
          LATEST="$(awk -F/ '{print $NF}' ../logs/04-cip-tags.txt | grep -E "^${CIP_PREFIX}[0-9]+$" | sort -V | tail -n1)"
          test -n "${LATEST}"
          test "${LATEST##*-cip}" -ge "${BASELINE_CIP##*-cip}"
          echo "CIP_TARGET=${LATEST}" >> "$GITHUB_ENV"
          git fetch --no-tags cip "refs/tags/${LATEST}:refs/tags/${LATEST}"
          git diff --binary "${BASELINE_CIP}..${LATEST}" > ../logs/cip-baseline-to-target.patch
          git apply --check --3way ../logs/cip-baseline-to-target.patch
          git apply --3way --index ../logs/cip-baseline-to-target.patch
          test "$(make -s kernelversion)" = "${BASELINE_KERNEL_VERSION}"
          git diff --check

      - name: "5. Integrate KernelSU-Next legacy source"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_VERSION}/kernel/setup.sh" -o ../logs/05-ksu-setup.sh
          chmod +x ../logs/05-ksu-setup.sh
          bash ../logs/05-ksu-setup.sh legacy 2>&1 | tee ../logs/05-kernelsu.log
          test -d KernelSU-Next
          test -L drivers/kernelsu
          grep -q 'CONFIG_KSU' drivers/kernelsu/Kconfig

      - name: "6. Apply SUSFS 2.3.0-compatible 4.19 backport"
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf susfs-backport
          git clone --depth=1 --branch "${SUSFS_BACKPORT_REF}" "${SUSFS_BACKPORT_REPO}" susfs-backport
          mapfile -t CANDIDATES < <(git -C susfs-backport ls-tree -r --name-only HEAD Patches | grep -Ei 'susfs.*(2[._-]?3[._-]?0|230).*4[._-]?19|4[._-]?19.*susfs.*(2[._-]?3[._-]?0|230)' || true)
          test "${#CANDIDATES[@]}" -gt 0
          PATCH_PATH="${CANDIDATES[0]}"
          git -C susfs-backport show "HEAD:${PATCH_PATH}" > logs/06-susfs-2.3.0-4.19.patch
          cd kernel
          patch --dry-run -p1 < ../logs/06-susfs-2.3.0-4.19.patch
          patch -p1 < ../logs/06-susfs-2.3.0-4.19.patch
          test -f fs/susfs.c
          test -f include/linux/susfs.h

      - name: "6a. Source-level fix — KernelSU/SUSFS SELinux SID bridge"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          test -f KernelSU-Next/kernel/selinux/rules.c
          test -f KernelSU-Next/kernel/selinux/selinux.c
          test -f KernelSU-Next/kernel/selinux/selinux.h
          cat > ../logs/V99-ksu-susfs-sid.patch <<'PATCH'
          diff --git a/KernelSU-Next/kernel/selinux/rules.c b/KernelSU-Next/kernel/selinux/rules.c
          --- a/KernelSU-Next/kernel/selinux/rules.c
          +++ b/KernelSU-Next/kernel/selinux/rules.c
          @@ -224,6 +224,9 @@
           	ksu_destroy_sepolicy(old_pol);
           
           	reset_avc_cache();
          +#ifdef CONFIG_KSU_SUSFS
          +	susfs_set_batch_sid();
          +#endif
           out_unlock:
          	mutex_unlock(&selinux_state.policy_mutex);
           #else
          diff --git a/KernelSU-Next/kernel/selinux/selinux.c b/KernelSU-Next/kernel/selinux/selinux.c
          --- a/KernelSU-Next/kernel/selinux/selinux.c
          +++ b/KernelSU-Next/kernel/selinux/selinux.c
          @@ -263,3 +263,111 @@
           }
          +
          +#ifdef CONFIG_KSU_SUSFS
          +#define KERNEL_INIT_DOMAIN "u:r:init:s0"
          +#define KERNEL_ZYGOTE_DOMAIN "u:r:zygote:s0"
          +#define KERNEL_ZYGOTE_NEXT_DOMAIN "u:r:zygote_next:s0"
          +#define KERNEL_PRIV_APP_DOMAIN "u:r:priv_app:s0:c512,c768"
          +u32 susfs_ksu_sid __read_mostly = 0;
          +u32 susfs_init_sid __read_mostly = 0;
          +u32 susfs_zygote_sid __read_mostly = 0;
          +u32 susfs_zygote_next_sid __read_mostly = 0;
          +u32 susfs_priv_app_sid __read_mostly = 0;
          +static inline void susfs_set_sid(const char *secctx_name, u32 *out_sid)
          +{
          + int err;
          + if (!secctx_name || !out_sid) return;
          + err = security_secctx_to_secid(secctx_name, strlen(secctx_name), out_sid);
          + if (err) pr_err("failed setting sid for '%s', err: %d\n", secctx_name, err);
          +}
          +bool susfs_is_sid_equal(const struct cred *cred, u32 sid2)
          +{
          + const struct task_security_struct *tsec;
          + if (!cred) return false;
          + tsec = selinux_cred(cred);
          + if (!tsec) return false;
          + return tsec->sid == sid2;
          +}
          +u32 susfs_get_sid_from_name(const char *secctx_name)
          +{
          + u32 out_sid = 0;
          + if (!secctx_name) return 0;
          + if (security_secctx_to_secid(secctx_name, strlen(secctx_name), &out_sid)) return 0;
          + return out_sid;
          +}
          +u32 susfs_get_current_sid(void) { return current_sid(); }
          +bool susfs_is_current_zygote_domain(void) { return unlikely(current_sid() == susfs_zygote_sid); }
          +bool susfs_is_current_zygote_next_domain(void) { return unlikely(current_sid() == susfs_zygote_next_sid); }
          +bool susfs_is_current_ksu_domain(void) { return unlikely(current_sid() == susfs_ksu_sid); }
          +bool susfs_is_current_init_domain(void) { return unlikely(current_sid() == susfs_init_sid); }
          +void susfs_set_batch_sid(void)
          +{
          + susfs_set_sid(KERNEL_ZYGOTE_DOMAIN, &susfs_zygote_sid);
          + susfs_set_sid(KERNEL_ZYGOTE_NEXT_DOMAIN, &susfs_zygote_next_sid);
          + susfs_set_sid(KERNEL_SU_CONTEXT, &susfs_ksu_sid);
          + susfs_set_sid(KERNEL_INIT_DOMAIN, &susfs_init_sid);
          + susfs_set_sid(KERNEL_PRIV_APP_DOMAIN, &susfs_priv_app_sid);
          +}
          +#endif
          diff --git a/KernelSU-Next/kernel/selinux/selinux.h b/KernelSU-Next/kernel/selinux/selinux.h
          --- a/KernelSU-Next/kernel/selinux/selinux.h
          +++ b/KernelSU-Next/kernel/selinux/selinux.h
          @@ -64,5 +64,15 @@
           void escape_to_root_for_adb_root();
           
           extern u32 ksu_file_sid;
          +#ifdef CONFIG_KSU_SUSFS
          +bool susfs_is_sid_equal(const struct cred *cred, u32 sid2);
          +u32 susfs_get_sid_from_name(const char *secctx_name);
          +u32 susfs_get_current_sid(void);
          +void susfs_set_batch_sid(void);
          +bool susfs_is_current_zygote_domain(void);
          +bool susfs_is_current_zygote_next_domain(void);
          +bool susfs_is_current_ksu_domain(void);
          +bool susfs_is_current_init_domain(void);
          +#endif
          PATCH
          sed -i 's/^          //' ../logs/V99-ksu-susfs-sid.patch
          git apply --check ../logs/V99-ksu-susfs-sid.patch
          git apply ../logs/V99-ksu-susfs-sid.patch
          grep -q 'susfs_set_batch_sid();' KernelSU-Next/kernel/selinux/rules.c
          grep -q 'u32 susfs_ksu_sid' KernelSU-Next/kernel/selinux/selinux.c
          grep -q 'void susfs_set_batch_sid' KernelSU-Next/kernel/selinux/selinux.c
          grep -q 'susfs_set_batch_sid' KernelSU-Next/kernel/selinux/selinux.h

      - name: "6b. Cross-setup contract audit"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          grep -Rqs 'susfs_set_batch_sid' KernelSU-Next/kernel/selinux
          grep -Rqs 'susfs_ksu_sid' KernelSU-Next/kernel/selinux
          grep -Rqs 'KSU_SUSFS' fs include drivers/kernelsu KernelSU-Next
          git diff --check

      - name: "7. Configure features; no-removal gate"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          make O=out "${DEFCONFIG_FILENAME}" > ../logs/07-defconfig.log 2>&1
          ./scripts/config --file out/.config --enable KSU --enable KSU_SUSFS
          make O=out olddefconfig > ../logs/07-olddefconfig.log 2>&1
          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' out/.config | sort > ../post-integration-enabled-config.txt
          while IFS= read -r line; do sym="${line%%=*}"; grep -q "^${sym}=" ../post-integration-enabled-config.txt || { echo "[ERROR] Baseline feature removed: ${sym}"; exit 1; }; done < ../baseline-enabled-config.txt
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config

      - name: "8. Build kernel"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- PATH="${CLANG_BIN}:$PATH"
          make O=out -j"$(nproc)" CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCC=clang HOSTCXX=clang++ 2>&1 | tee ../logs/08-kernel-build.log
          test -s out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image | tee ../logs/output-image.sha256

      - name: "9. Package V99 artifacts"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf release work-anykernel
          mkdir -p release/logs release/build-info release/checksums work-anykernel
          cp kernel/out/arch/arm64/boot/Image release/kernel-image
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git work-anykernel
          rm -rf work-anykernel/.git work-anykernel/modules work-anykernel/ramdisk
          cp kernel/out/arch/arm64/boot/Image work-anykernel/Image
          cat > work-anykernel/anykernel.sh <<'AK3'
          properties() { '
          kernel.string=V99-LM-G900-KARNAL
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          '; }
          BLOCK=auto; IS_SLOT_DEVICE=auto; RAMDISK_COMPRESSION=auto; PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh; dump_boot; write_boot;
          AK3
          (cd work-anykernel && zip -qr ../release/AnyKernel3-OrangeFox-Flashable.zip .)
          cp kernel/out/arch/arm64/boot/Image release/kernel.zip
          cp source-info.txt baseline-info.txt baseline-defconfig.txt baseline-enabled-config.txt post-integration-enabled-config.txt release/build-info/
          cp logs/*.log logs/*.patch release/logs/ 2>/dev/null || true
          {
            echo "workflow=V99"
            echo "workflow_name=V99-LM-G900-KARNAL-BUILT"
            echo "kernel_version=${BASELINE_KERNEL_VERSION}"
            echo "source_commit=${KERNEL_COMMIT}"
            echo "cip_baseline=${BASELINE_CIP}"
            echo "cip_target=${CIP_TARGET}"
            echo "kernelsu_next=${KSU_VERSION}"
            echo "susfs_version=${SUSFS_VERSION}"
            echo "clang=${CLANG_REV}"
          } > release/build-info/build-manifest.txt
          sha256sum release/kernel.zip release/AnyKernel3-OrangeFox-Flashable.zip > release/checksums/SHA256SUMS
          (cd release && zip -qr "../${OUTPUT_PREFIX}-output.zip" .)
          test -s "${OUTPUT_PREFIX}-output.zip"

      - name: "10. Verify V99 artifacts and source scope"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          unzip -t "${OUTPUT_PREFIX}-output.zip"
          unzip -t release/kernel.zip
          unzip -t release/AnyKernel3-OrangeFox-Flashable.zip
          cd kernel
          git diff --check
          git diff --name-only > ../logs/10-source-changes.txt
          ! grep -Ev '^(KernelSU-Next/kernel/selinux/(rules.c|selinux.c|selinux.h)|arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_lao_com-pm.dtsi|drivers/|fs/|include/|scripts/|Makefile|Kconfig)' ../logs/10-source-changes.txt | grep -q .

      - name: "11. Collect diagnostics"
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          cp -a logs/. diagnostics/ 2>/dev/null || true
          cp baseline-info.txt baseline-defconfig.txt baseline-enabled-config.txt post-integration-enabled-config.txt source-info.txt baseline-git-status.txt diagnostics/ 2>/dev/null || true
          if [ -d kernel ]; then
            { git -C kernel status --short || true; echo; git -C kernel diff --check || true; echo; find kernel -type f -name '*.rej' -print || true; } > diagnostics/kernel-state.txt 2>&1
          fi
          rm -f "${OUTPUT_PREFIX}-complete-logs.zip"
          (cd diagnostics && zip -qr "../${OUTPUT_PREFIX}-complete-logs.zip" .)

      - name: "12. Upload V99 final artifact"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: V99-LM-G900-KARNAL-output
          path: V99-LM-G900-KARNAL-output.zip
          if-no-files-found: error
          retention-days: 30

      - name: "13. Upload V99 diagnostics"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V99-LM-G900-KARNAL-complete-logs
          path: |
            V99-LM-G900-KARNAL-complete-logs.zip
            diagnostics/
            logs/
          if-no-files-found: warn
          retention-days: 30
