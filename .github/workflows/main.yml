name: LM-G900 Android 16 QPR2 — Vendor Only Fix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lm-g900-vendor-${{ github.ref }}
  cancel-in-progress: false

env:
  MANIFEST_URL: https://github.com/LineageOS/android.git
  MANIFEST_BRANCH: lineage-23.2
  DEVICE_CODENAME: caymanln
  MODEL: LM-G900
  DIAG_DIR: ci-diagnostics/vendor

jobs:
  vendor:
    name: Vendor — LM-G900 / Android 16 QPR2
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: V00 — Set up numbered runner + diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$DIAG_DIR" vendor_out
          : > "$DIAG_DIR/00-vendor-run.log"
          exec > >(tee -a "$DIAG_DIR/00-vendor-run.log") 2>&1
          echo "=== VENDOR RUN START ==="
          echo "run_id=${GITHUB_RUN_ID}"
          echo "sha=${GITHUB_SHA}"
          echo "model=${MODEL} codename=${DEVICE_CODENAME}"

      - name: V01 — Checkout workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: V02 — Install Android build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zstd \
            unzip rsync bc ccache libssl-dev libelf-dev \
            python3 python3-pip jq lz4 liblz4-tool libxml2-utils \
            xsltproc repo
          git --version
          repo --version
          python3 --version

      - name: V03 — Initialize official Android source correctly
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
          mkdir -p .repo/local_manifests
          git -C .repo/manifests rev-parse HEAD | tee "$GITHUB_WORKSPACE/$DIAG_DIR/03-manifest-head.txt"
          repo manifest -r > "$GITHUB_WORKSPACE/$DIAG_DIR/03-initial-manifest.xml"

      - name: V04 — FIX: verify vendor/device refs before repo sync
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"

          # Never use an invalid remote/revision combination in local_manifests.
          # The refs are checked first; only verified refs are written to the manifest.
          mkdir -p "$GITHUB_WORKSPACE/$DIAG_DIR"
          : > "$GITHUB_WORKSPACE/$DIAG_DIR/04-ref-check.log"

          verify_ref() {
            local repo_url="$1"
            local ref="$2"
            echo "CHECK $repo_url @ $ref" | tee -a "$GITHUB_WORKSPACE/$DIAG_DIR/04-ref-check.log"
            if git ls-remote --exit-code --heads "$repo_url" "$ref" \
              >> "$GITHUB_WORKSPACE/$DIAG_DIR/04-ref-check.log" 2>&1; then
              echo "OK $repo_url @ $ref" | tee -a "$GITHUB_WORKSPACE/$DIAG_DIR/04-ref-check.log"
              return 0
            fi
            echo "FAIL $repo_url @ $ref" | tee -a "$GITHUB_WORKSPACE/$DIAG_DIR/04-ref-check.log"
            return 1
          }

          # These are the three vendor/device projects used by this workflow.
          # Keep the repository names in one place so a failed ref is obvious.
          DEVICE_REPO="https://github.com/lge-qcom-dev/android_device_lge_caymanln.git"
          DEVICE_PATH="device/lge/caymanln"
          DEVICE_REF="$MANIFEST_BRANCH"

          VENDOR_REPO="https://github.com/lge-qcom-dev/proprietary_vendor_lge_caymanln.git"
          VENDOR_PATH="vendor/lge/caymanln"
          VENDOR_REF="$MANIFEST_BRANCH"

          COMMON_REPO="https://github.com/Sparkle-OS/proprietary_vendor_lge_sm7250-common.git"
          COMMON_PATH="vendor/lge/sm7250-common"
          COMMON_REF="$MANIFEST_BRANCH"

          # If a repository/ref is unavailable, stop here with a useful diagnostic.
          verify_ref "$DEVICE_REPO" "$DEVICE_REF"
          verify_ref "$VENDOR_REPO" "$VENDOR_REF"
          verify_ref "$COMMON_REPO" "$COMMON_REF"

          cat > .repo/local_manifests/g900emw.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="lge-qcom-dev/android_device_lge_caymanln" path="device/lge/caymanln" remote="github" revision="lineage-23.2" />
            <project name="lge-qcom-dev/proprietary_vendor_lge_caymanln" path="vendor/lge/caymanln" remote="github" revision="lineage-23.2" />
            <project name="Sparkle-OS/proprietary_vendor_lge_sm7250-common" path="vendor/lge/sm7250-common" remote="github" revision="lineage-23.2" />
          </manifest>
          EOF

          # Validate the manifest before doing the expensive sync.
          repo manifest -r > "$GITHUB_WORKSPACE/$DIAG_DIR/04-manifest-before-sync.xml"
          repo sync --force-sync --no-clone-bundle --no-tags --optimized-fetch \
            --prune --fail-fast -j2 2>&1 | tee "$GITHUB_WORKSPACE/$DIAG_DIR/04-repo-sync.log"

      - name: V05 — Verify source refs + Android 16 QPR2 product tree
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          {
            echo "=== synced projects ==="
            repo list | grep -E 'device/lge/caymanln|vendor/lge/caymanln|vendor/lge/sm7250-common' || true
            echo "=== manifest ==="
            repo manifest -r
            echo "=== Android version markers ==="
            grep -R "PLATFORM_VERSION\|PLATFORM_SDK_VERSION" build/core/version_defaults.mk 2>/dev/null || true
          } | tee "$GITHUB_WORKSPACE/$DIAG_DIR/05-source-verification.log"

      - name: V06 — Normalize global model identity to LM-G900
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          {
            echo "MODEL=$MODEL"
            echo "DEVICE_CODENAME=$DEVICE_CODENAME"
            echo "Expected: LM-G900 / caymanln"
            grep -R "LM-G900\|caymanln" device/lge/caymanln vendor/lge/caymanln 2>/dev/null | head -200 || true
          } | tee "$GITHUB_WORKSPACE/$DIAG_DIR/06-model-identity.log"

      - name: V07 — Prepare Android vendor build environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch lineage_caymanln-userdebug
          get_build_var PRODUCT_DEVICE | tee "$GITHUB_WORKSPACE/$DIAG_DIR/07-product-device.txt"
          get_build_var TARGET_PRODUCT | tee "$GITHUB_WORKSPACE/$DIAG_DIR/07-target-product.txt"

      - name: V08 — Mandatory hardware integration audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          : > "$GITHUB_WORKSPACE/$DIAG_DIR/08-hardware-audit.log"
          audit() {
            local label="$1"; shift
            echo "=== $label ===" | tee -a "$GITHUB_WORKSPACE/$DIAG_DIR/08-hardware-audit.log"
            if "$@" >> "$GITHUB_WORKSPACE/$DIAG_DIR/08-hardware-audit.log" 2>&1; then
              echo "PASS: $label" | tee -a "$GITHUB_WORKSPACE/$DIAG_DIR/08-hardware-audit.log"
            else
              echo "WARN/FAIL: $label" | tee -a "$GITHUB_WORKSPACE/$DIAG_DIR/08-hardware-audit.log"
            fi
          }
          audit fingerprint grep -RniE 'fingerprint|fpc|goodix' device/lge/caymanln vendor/lge/caymanln vendor/lge/sm7250-common
          audit vibration grep -RniE 'vibrator|haptics|ff-memless' device/lge/caymanln vendor/lge/caymanln
          audit dual-sim grep -RniE 'dual.?sim|dsds|simslot' device/lge/caymanln vendor/lge/caymanln
          audit audio grep -RniE 'audio|mixer_paths|audio_policy' vendor/lge/caymanln vendor/lge/sm7250-common
          audit vowifi grep -RniE 'ims|iwlan|vowifi|wifi.?calling' vendor/lge/caymanln vendor/lge/sm7250-common

      - name: V09 — Build vendor image only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch lineage_caymanln-userdebug
          set +e
          mka vendorimage 2>&1 | tee "$GITHUB_WORKSPACE/$DIAG_DIR/09-vendorimage-build.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$GITHUB_WORKSPACE/$DIAG_DIR/09-vendorimage-exit-code.txt"
          exit "$rc"

      - name: V10 — Verify vendor.img + VINTF + LM-G900 identity
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          {
            echo "=== vendor artifacts ==="
            find out/target/product/caymanln -maxdepth 1 -type f \
              \( -name 'vendor.img' -o -name 'vendor-debug.img' \) -printf '%p %s bytes\n' 2>/dev/null || true
            echo "=== VINTF ==="
            find out/target/product/caymanln/vendor/etc/vintf -type f -maxdepth 2 \
              -print 2>/dev/null | sort || true
            echo "=== identity ==="
            grep -RniE 'LM-G900|caymanln' device/lge/caymanln vendor/lge/caymanln 2>/dev/null | head -200 || true
          } | tee "$GITHUB_WORKSPACE/$DIAG_DIR/10-vendor-verification.log"

      - name: V11 — Package vendor result + ALWAYS include exact error log
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p vendor_out

          # Capture the GitHub runner failure context as well as the numbered logs.
          {
            echo "LG Velvet LM-G900 — Android 16 QPR2 — VENDOR ONLY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "job_status=${{ job.status }}"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo
            echo "=== ERROR/FAILURE SUMMARY ==="
            grep -RniE '(^|[^A-Za-z])(error|fatal|failed|failure|FAIL|ERROR)([^A-Za-z]|$)' "$DIAG_DIR" \
              2>/dev/null | tail -300 || true
          } > "$DIAG_DIR/99-ERROR-SUMMARY.log"

          # Copy vendor.img only if it exists; never make artifact upload depend on it.
          find android/out/target/product/caymanln -maxdepth 1 -type f \
            -name 'vendor*.img' -exec cp -v {} vendor_out/ \; 2>/dev/null || true

          # The diagnostics directory is ALWAYS packaged, even when V04/V09 fails.
          tar -czf "vendor_out/LM-G900-VENDOR-DIAGNOSTICS-${GITHUB_RUN_ID}.tar.gz" "$DIAG_DIR"
          {
            echo "vendor.img:"
            find vendor_out -maxdepth 1 -type f -name 'vendor*.img' -printf '%f %s bytes\n' || true
            echo "diagnostics: LM-G900-VENDOR-DIAGNOSTICS-${GITHUB_RUN_ID}.tar.gz"
            echo "ERROR LOG: ci-diagnostics/vendor/99-ERROR-SUMMARY.log"
            echo "V04 LOG: ci-diagnostics/vendor/04-repo-sync.log"
            echo "V09 LOG: ci-diagnostics/vendor/09-vendorimage-build.log"
          } > vendor_out/ARTIFACT-LIST.txt

      - name: Upload vendor artifact + error logs ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-VENDOR-${{ github.run_id }}
          path: |
            vendor_out/**
            ci-diagnostics/vendor/**
          if-no-files-found: error
          retention-days: 14
