        \ int do_execveat_common\\s*\\(', exec_decl, 'fs/exec.c declarations')\nexec_hook\
        \ = '''\n#ifdef CONFIG_KSU\n\\tif (unlikely(ksu_execveat_hook))\n\\t\\tksu_handle_execveat(&fd,\
        \ &filename, &argv, &envp, &flags);\n\\telse\n\\t\\tksu_handle_execveat_sucompat(&fd,\
        \ &filename, &argv, &envp, &flags);\n#endif\n'''.replace('          ','')\n\
        insert_after_regex(root/'fs/exec.c', r'(?m)^static int do_execveat_common\\\
        s*\\([^\\{]+\\)\\s*\\{', exec_hook, 'fs/exec.c hook')\n\nopen_decl = '''#ifdef\
        \ CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user\
        \ **filename_user, int *mode,\n\\t\\t\\t\\t int *flags);\n#endif\n\n'''.replace('\
        \          ','')\ninsert_before_regex(root/'fs/open.c', r'(?m)^long do_faccessat\\\
        s*\\(', open_decl, 'fs/open.c declarations')\nopen_hook = '''\n#ifdef CONFIG_KSU\n\
        \\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n'''.replace('\
        \          ','')\ninsert_after_regex(root/'fs/open.c', r'(?m)^long do_faccessat\\\
        s*\\([^\\{]+\\)\\s*\\{', open_hook, 'fs/open.c hook')\n\nread_decl = '''#ifdef\
        \ CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct\
        \ file **file_ptr, char __user **buf_ptr,\n\\t\\t\\tsize_t *count_ptr, loff_t\
        \ **pos);\n#endif\n\n'''.replace('          ','')\ninsert_before_regex(root/'fs/read_write.c',\
        \ r'(?m)^ssize_t vfs_read\\s*\\(', read_decl, 'fs/read_write.c declarations')\n\
        read_hook = '''\n#ifdef CONFIG_KSU\n\\tif (unlikely(ksu_vfs_read_hook))\n\\\
        t\\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif\n'''.replace('\
        \          ','')\ninsert_after_regex(root/'fs/read_write.c', r'(?m)^ssize_t\
        \ vfs_read\\s*\\([^\\{]+\\)\\s*\\{', read_hook, 'fs/read_write.c hook')\n\n\
        stat_decl = '''#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const\
        \ char __user **filename_user, int *flags);\n#endif\n\n'''.replace('     \
        \     ','')\ninsert_before_regex(root/'fs/stat.c', r'(?m)^int vfs_statx\\\
        s*\\(', stat_decl, 'fs/stat.c declarations')\nstat_hook = '''\n#ifdef CONFIG_KSU\n\
        \\tksu_handle_stat(&dfd, &filename, &flags);\n#endif\n'''.replace('      \
        \    ','')\ninsert_after_regex(root/'fs/stat.c', r'(?m)^int vfs_statx\\s*\\\
        ([^\\{]+\\)\\s*\\{', stat_hook, 'fs/stat.c hook')\n\ninput_decl = '''#ifdef\
        \ CONFIG_KSU\nextern bool ksu_input_hook __read_mostly;\nextern int ksu_handle_input_handle_event(unsigned\
        \ int *type, unsigned int *code, int *value);\n#endif\n\n'''.replace('   \
        \       ','')\ninsert_before_regex(root/'drivers/input/input.c', r'(?m)^static\
        \ void input_handle_event\\s*\\(', input_decl, 'drivers/input/input.c declarations')\n\
        input_hook = '''\n#ifdef CONFIG_KSU\n\\tif (unlikely(ksu_input_hook))\n\\\
        t\\tksu_handle_input_handle_event(&type, &code, &value);\n#endif\n'''.replace('\
        \          ','')\ninsert_after_regex(root/'drivers/input/input.c', r'(?m)^static\
        \ void input_handle_event\\s*\\([^\\{]+\\)\\s*\\{', input_hook, 'drivers/input/input.c\
        \ safe-mode hook')\nPY\n\n# The manual path must remain genuinely non-KPROBE.\n\
        grep -q '^# CONFIG_KPROBES is not set$' \"$OUT_DIR/.config\"\ngrep -Rsn 'ksu_handle_execveat\\\
        |ksu_handle_faccessat\\|ksu_handle_vfs_read\\|ksu_handle_stat' \\\n  fs/exec.c\
        \ fs/open.c fs/read_write.c fs/stat.c\n"
    - name: 09 - Configure ONLY KSU/SUSFS; preserve every WORKING config value
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/09-kconfig.log\"\
        ) 2>&1\ncd \"$GITHUB_WORKSPACE/kernel\"\n\n# These are the intended functional\
        \ configuration additions.\n# KPROBES stays exactly as the supplied WORKING\
        \ kernel: disabled.\nscripts/config --file \"$OUT_DIR/.config\" \\\n  --enable\
        \ CONFIG_KSU \\\n  --enable CONFIG_KSU_SUSFS \\\n  --disable CONFIG_KSU_SUSFS_SUS_PATH\
        \ \\\n  --enable CONFIG_KSU_SUSFS_SUS_KSTAT \\\n  --enable CONFIG_KSU_SUSFS_SPOOF_UNAME\
        \ \\\n  --enable CONFIG_KSU_SUSFS_ENABLE_LOG \\\n  --disable CONFIG_KSU_SUSFS_SUS_MOUNT\
        \ \\\n  --disable CONFIG_KSU_SUSFS_SUS_SU\n\n# Make the pershoot SUSFS dependency\
        \ gate explicit.\nscripts/config --file \"$OUT_DIR/.config\" --enable SUSFS\n\
        \n# SUS_PATH compatibility:\n# SUSFS latest-kernel-4.19 writes new->user->android_kabi_reserved1\n\
        # when CONFIG_KSU_SUSFS_SUS_PATH=y. The exact LG WORKING 4.19 source\n# does\
        \ not have that member in struct user_struct. Adding it would\n# change a\
        \ core kernel struct layout, so only SUS_PATH is disabled.\nif grep -q 'android_kabi_reserved1'\
        \ include/linux/user.h; then\n  echo \"INFO: user_struct has android_kabi_reserved1,\
        \ but SUS_PATH remains disabled for this build.\"\nelse\n  echo \"PASS: LG\
        \ WORKING user_struct has no android_kabi_reserved1; SUS_PATH correctly disabled.\"\
        \nfi\n\n# Run Kconfig with the SAME Android Clang/LLVM family used by the\n\
        # supplied working kernel. Do not regenerate the baseline from the\n# vendor\
        \ defconfig and do not use Ubuntu GCC for Kconfig.\nexport CC=\"$CLANG_DIR/bin/clang\"\
        \nexport HOSTCC=gcc\nexport HOSTCXX=g++\nexport LD=\"$CLANG_DIR/bin/ld.lld\"\
        \nexport AS=\"$CLANG_DIR/bin/llvm-as\"\nexport LLVM=1\nexport LLVM_IAS=1\n\
        export CLANG_TRIPLE=aarch64-linux-gnu-\nexport PATH=\"$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH\"\
        \nexport LD_LIBRARY_PATH=\"$CLANG_DIR/lib:${LD_LIBRARY_PATH:-}\"\n\n\"$CC\"\
        \ --version | head -n 2 | tee \"$DIAG_DIR/kconfig-clang-version.txt\"\n\n\
        # The supplied WORKING 4.19 tree has legacy Kconfig warnings for a few\n#\
        \ vendor symbols. On the previous run, Kconfig wrote the complete .config\n\
        # and auto.conf successfully but returned status 1. Treat that exact case\n\
        # as non-fatal; never ignore a missing generated configuration.\nset +e\n\
        make O=\"$OUT_DIR\" ARCH=\"$ARCH\" \\\n  CC=\"$CC\" HOSTCC=\"$HOSTCC\" HOSTCXX=\"\
        $HOSTCXX\" \\\n  LD=\"$LD\" AS=\"$AS\" LLVM=1 LLVM_IAS=1 \\\n  olddefconfig\n\
        KCONFIG_RC=$?\nset -e\n\ntest -s \"$OUT_DIR/.config\"\ntest -s \"$OUT_DIR/include/config/auto.conf\"\
        \n\nif [ \"$KCONFIG_RC\" -ne 0 ]; then\n  echo \"WARNING: olddefconfig returned\
        \ $KCONFIG_RC after writing a usable auto.conf; continuing with the exact\
        \ checked config.\"\nelse\n  echo \"PASS: olddefconfig completed successfully.\"\
        \nfi\n\ncp \"$OUT_DIR/.config\" \"$DIAG_DIR/final.config\"\n\ngrep -q '^CONFIG_SUSFS=y$'\
        \ \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_KSU=y$' \"$OUT_DIR/.config\"\ngrep\
        \ -q '^CONFIG_KSU_SUSFS=y$' \"$OUT_DIR/.config\"\ngrep -q '^# CONFIG_KSU_SUSFS_SUS_PATH\
        \ is not set$' \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y$'\
        \ \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_KSU_SUSFS_SPOOF_UNAME=y$' \"$OUT_DIR/.config\"\
        \n! grep -q '^CONFIG_KSU_SUSFS_TRY_UMOUNT=y$' \"$OUT_DIR/.config\"\ngrep -q\
        \ '^CONFIG_KSU_SUSFS_ENABLE_LOG=y$' \"$OUT_DIR/.config\"\ngrep -q '^# CONFIG_KSU_SUSFS_SUS_MOUNT\
        \ is not set$' \"$OUT_DIR/.config\"\n! grep -q '^CONFIG_KSU_SUSFS_SUS_SU=y$'\
        \ \"$OUT_DIR/.config\"\n\n# Compare every non-KSU/non-SUSFS config symbol\
        \ against the exact\n# working baseline. CONFIG_SUSFS is our integration marker\
        \ and is\n# intentionally new; any other drift stops the build.\nnormalize_config()\
        \ {\n  sed -E \\\n    -e '/^[[:space:]]*#/d' \\\n    -e '/^[[:space:]]*$/d'\
        \ \\\n    -e '/^CONFIG_KSU([_=]|$)/d' \\\n    -e '/^CONFIG_SUSFS([_=]|$)/d'\
        \ \\\n    -e '/^CONFIG_CC_/d' \\\n    -e '/^CONFIG_CLANG_/d' \\\n    -e '/^CONFIG_GCC_/d'\
        \ \\\n    -e '/^CONFIG_AS_/d' \\\n    -e '/^CONFIG_LD_/d' \\\n    -e '/^CONFIG_LLD_/d'\
        \ \\\n    -e '/^CONFIG_TOOLS_SUPPORT_RELR=/d' \\\n    \"$1\" | sort\n}\n\n\
        normalize_config \"$DIAG_DIR/working-baseline.config\" > \"$DIAG_DIR/baseline.non-ksu\"\
        \nnormalize_config \"$OUT_DIR/.config\" > \"$DIAG_DIR/final.non-ksu\"\n\n\
        # Kconfig may reflow blank lines when writing .config. Blank-line-only\n#\
        \ formatting changes are not configuration drift; actual CONFIG_* value\n\
        # changes are. The normalized comparison above removes blank lines.\nif !\
        \ diff -u \"$DIAG_DIR/baseline.non-ksu\" \"$DIAG_DIR/final.non-ksu\" > \"\
        $DIAG_DIR/config-drift.diff\"; then\n  echo \"::error::NON-KSU configuration\
        \ drift detected. Build stopped for safety.\"\n  cat \"$DIAG_DIR/config-drift.diff\"\
        \n  exit 1\nfi\n\necho \"PASS: semantic non-KSU configuration matches the\
        \ WORKING baseline.\"\n\n# Explicitly verify boot-sensitive values again.\n\
        grep -q '^# CONFIG_KPROBES is not set$' \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_HAVE_KPROBES=y$'\
        \ \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_MODULES=y$' \"$OUT_DIR/.config\"\n\
        grep -q '^CONFIG_OVERLAY_FS=y$' \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_MACH_LITO_CAYMANLM=y$'\
        \ \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' \"\
        $OUT_DIR/.config\"\ngrep -q '^CONFIG_LOCALVERSION=\"-perf\"$' \"$OUT_DIR/.config\"\
        \n\necho \"PASS: no non-KSU/non-SUSFS configuration drift.\"\necho \"PASS:\
        \ KPROBES remains disabled; no KPROBE config was added.\"\n"
    - name: 10 - Verify source scope (only KSU/SUSFS integration files changed)
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/10-scope.log\"\
        ) 2>&1\ncd \"$GITHUB_WORKSPACE/kernel\"\n\ngit status --short > \"$DIAG_DIR/source-status.txt\"\
        \ngit diff --stat > \"$DIAG_DIR/source-diff-stat.txt\"\n\n# These device/boot\
        \ configuration sources are forbidden to change.\nif git status --short --\
        \ \\\n    arch/arm64/boot/dts \\\n    arch/arm64/configs \\\n    drivers/staging\
        \ \\\n    | grep -q .; then\n  echo \"::error::Device DT/DTBO/defconfig sources\
        \ changed.\"\n  git status --short -- arch/arm64/boot/dts arch/arm64/configs\
        \ drivers/staging\n  exit 1\nfi\n\necho \"=== MODIFIED FILES ===\"\ngit status\
        \ --short\n\n# Strict source-scope allowlist. KernelSU-Next is the actual\
        \ directory\n# created by the SUSFS-compatible setup script; do not mistake\
        \ it for\n# the legacy KernelSU/ directory. Only KernelSU-Next/SUSFS integration\n\
        # and the documented non-KPROBE hook sites may differ from the WORKING tree.\n\
        allowed_files='^(KernelSU-Next/|drivers/kernelsu$|drivers/Kconfig$|drivers/Makefile$|drivers/input/input.c$|fs/Makefile$|fs/dcache.c$|fs/devpts/inode.c$|fs/exec.c$|fs/inode.c$|fs/notify/fdinfo.c$|fs/namei.c$|fs/open.c$|fs/overlayfs/inode.c$|fs/overlayfs/readdir.c$|fs/overlayfs/super.c$|fs/proc/cmdline.c$|fs/proc/fd.c$|fs/proc/task_mmu.c$|fs/proc_namespace.c$|fs/read_write.c$|fs/readdir.c$|fs/stat.c$|fs/statfs.c$|include/linux/mount.h$|include/linux/sched.h$|kernel/kallsyms.c$|kernel/sys.c$|fs/susfs.c$|include/linux/susfs.h$|fs/sus_su.c$|include/linux/sus_su.h$|include/linux/susfs_def.h$)$'\n\
        unexpected=\"$(git status --short | sed -E 's/^.. //g' | grep -Ev \"$allowed_files\"\
        \ || true)\"\nif [ -n \"$unexpected\" ]; then\n  echo \"::error::Unexpected\
        \ source files changed (outside KSU/SUSFS integration scope):\"\n  printf\
        \ '%s\\n' \"$unexpected\"\n  exit 1\nfi\n\n# Expected integration files must\
        \ exist.\ntest -f fs/susfs.c\ntest -f include/linux/susfs.h\ntest -d KernelSU-Next/kernel\n"
    - name: 10B - Verify current 4.19 compile fix only
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/kernel"
        SECCOMP_CACHE_C="KernelSU-Next/kernel/infra/seccomp_cache.c"
        test -f "$SECCOMP_CACHE_C"
        grep -q 'LG 4.19: SECCOMP_ARCH_NATIVE_NR compatibility' "$SECCOMP_CACHE_C"
        grep -q '#define SECCOMP_ARCH_NATIVE_NR NR_syscalls' "$SECCOMP_CACHE_C"

        # LG 4.19 lacks seccomp.filter_count. Do not modify the vendor ABI;
        # patch only the KSU-local bookkeeping write.
        KSU_APP="drivers/kernelsu/policy/app_profile.c"
        if [ ! -f "$KSU_APP" ]; then KSU_APP="KernelSU-Next/kernel/policy/app_profile.c"; fi
        test -f "$KSU_APP"
        SEC_HDR="include/linux/seccomp.h"
        test -f "$SEC_HDR"

        if grep -qE '\bfilter_count\b' "$SEC_HDR"; then
          echo "PASS: vendor seccomp struct provides filter_count; no source patch required."
        else
          echo "INFO: vendor 4.19 seccomp struct lacks filter_count; applying narrow KSU-local fix."
          python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); s=p.read_text(); old="atomic_set(&current->seccomp.filter_count, 0);"; new="/* LG 4.19: seccomp.filter_count is unavailable; no-op. */"; (p.write_text(s.replace(old,new,1)) if old in s else None); print("PATCHED:",p) if old in s else print("PASS: no current->seccomp.filter_count reference in",p) if "current->seccomp.filter_count" not in s else (_ for _ in ()).throw(SystemExit("ERROR: unexpected filter_count form; refusing broad patch."))' "$KSU_APP"
        fi

        if ! grep -qE '\bfilter_count\b' "$SEC_HDR"; then
          if grep -RIn --include='*.c' --include='*.h' 'current->seccomp.filter_count' drivers/kernelsu KernelSU-Next/kernel 2>/dev/null; then
            echo "::error::Unfixed KSU seccomp.filter_count reference remains for LG 4.19."
            exit 1
          fi
        fi

        if [ -f "arch/arm64/include/asm/seccomp.h" ] && grep -q 'LG 4.19: SECCOMP_ARCH_NATIVE_NR compatibility' "arch/arm64/include/asm/seccomp.h"; then
          echo "::error::Vendor arm64 seccomp header was modified; refusing to continue."
          exit 1
        fi

        mkdir -p "$DIAG_DIR"
        { echo "LG 4.19 seccomp compatibility audit"; echo "KSU app profile: $KSU_APP"; echo "Vendor header: $SEC_HDR"; if grep -qE '\bfilter_count\b' "$SEC_HDR"; then echo "filter_count: PRESENT"; else echo "filter_count: ABSENT; KSU-local no-op applied"; fi; echo "Vendor seccomp ABI/header modification: NOT USED"; } > "$DIAG_DIR/10B-seccomp-filter-count-audit.txt"
        echo "PASS: 4.19 seccomp filter_count compatibility audit completed."
        echo "PASS: earlier SUSFS/KSU/VFS fixes were not modified by this step."
    - name: 11 - Build RAW WORKING kernel Image (do NOT replace stock DTB/DTBO)
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/11-build.log\"\
        ) 2>&1\ncd \"$GITHUB_WORKSPACE/kernel\"\n\nexport ARCH=arm64\nexport CROSS_COMPILE=\"\
        $GCC64_DIR/bin/aarch64-linux-android-\"\nexport CROSS_COMPILE_ARM32=\"$GCC32_DIR/bin/arm-linux-androideabi-\"\
        \nexport CLANG_TRIPLE=aarch64-linux-gnu-\nexport LLVM=1\nexport LLVM_IAS=1\n\
        export CC=\"$CLANG_DIR/bin/clang\"\nexport HOSTCC=gcc\nexport HOSTCXX=g++\n\
        export LD_LIBRARY_PATH=\"$CLANG_DIR/lib:${LD_LIBRARY_PATH:-}\"\n\necho \"\
        CC=$CC\"\necho \"CROSS_COMPILE=$CROSS_COMPILE\"\necho \"CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32\"\
        \n\"$CC\" --version | head -n 2\n\"$GCC64_DIR/bin/aarch64-linux-android-gcc\"\
        \ --version | head -n 1\n\"$GCC32_DIR/bin/arm-linux-androideabi-gcc\" --version\
        \ | head -n 1\n\n# SUS_PATH must remain disabled on this exact source. Stop\
        \ before\n# compilation if it is ever enabled accidentally.\ngrep -q '^# CONFIG_KSU_SUSFS_SUS_PATH\
        \ is not set$' \"$OUT_DIR/.config\"\n\n# The supplied working kernel is a\
        \ raw ARM64 Image with separate DTB/DTBO.\n# Therefore build Image, not Image.gz,\
        \ and never replace the stock DTB/DTBO.\nmake -Oline \\\n  O=\"$OUT_DIR\"\
        \ \\\n  ARCH=arm64 \\\n  CC=\"$CC\" \\\n  LLVM=1 \\\n  LLVM_IAS=1 \\\n  CROSS_COMPILE=\"\
        $CROSS_COMPILE\" \\\n  CROSS_COMPILE_ARM32=\"$CROSS_COMPILE_ARM32\" \\\n \
        \ CLANG_TRIPLE=aarch64-linux-gnu- \\\n  -j\"$(nproc)\" \\\n  Image \\\n  modules\n\
        \ntest -f \"$OUT_DIR/arch/arm64/boot/Image\"\nfile \"$OUT_DIR/arch/arm64/boot/Image\"\
        \ | tee \"$DIAG_DIR/image-file.txt\"\ngrep -q 'ARM aarch64\\|ARM64\\|Linux\
        \ kernel' \"$DIAG_DIR/image-file.txt\" || true\n\ncp \"$OUT_DIR/arch/arm64/boot/Image\"\
        \ \"$GITHUB_WORKSPACE/Image\"\n\n# DTB/DTBO are intentionally not copied into\
        \ the kernel artifact.\n# The user's known-good stock DTB/DTBO remain the\
        \ device boot assets.\n"
    - name: 11A - Build-error audit (always)
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$DIAG_DIR"
        LOG="$DIAG_DIR/11-build.log"
        AUDIT="$DIAG_DIR/11-build-error-audit.txt"
        {
          echo "LG Velvet kernel build-error audit"
          echo "================================"
          if [ -f "$LOG" ]; then
            echo "Build log: PRESENT"
            echo
            echo "Known seccomp.filter_count failures:"
            grep -n -C 3 'filter_count' "$LOG" || true
            echo
            echo "Terminal build errors:"
            grep -n -E 'make: \\*\\\*\\\*|Error: Process completed|error:' "$LOG" | tail -n 30 || true
            echo
            if grep -q 'no member named.*filter_count' "$LOG"; then
              echo "RESULT: KNOWN FAILURE — KSU app_profile.c still references unavailable 4.19 filter_count."
            elif grep -qE '(^|[^[:alpha:]])error:' "$LOG"; then
              echo "RESULT: DIFFERENT BUILD ERROR — do not mislabel it as filter_count."
            else
              echo "RESULT: no compiler error signature found in the captured build log."
            fi
          else
            echo "Build log: NOT PRESENT."
            echo "RESULT: build did not produce a log; no compiler classification available."
          fi
        } | tee "$AUDIT"

    - name: 12 - Final safety checks
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nexec > >(tee \"$DIAG_DIR/12-safety.log\"\
        ) 2>&1\ncd \"$GITHUB_WORKSPACE/kernel\"\n\ntest -f \"$OUT_DIR/.config\"\n\
        test -f \"$OUT_DIR/arch/arm64/boot/Image\"\n\ngrep -q '^CONFIG_SUSFS=y$' \"\
        $OUT_DIR/.config\"\ngrep -q '^CONFIG_KSU=y$' \"$OUT_DIR/.config\"\ngrep -q\
        \ '^CONFIG_KSU_SUSFS=y$' \"$OUT_DIR/.config\"\n! grep -q '^CONFIG_KSU_SUSFS_SUS_SU=y$'\
        \ \"$OUT_DIR/.config\"\ngrep -q '^# CONFIG_KSU_SUSFS_SUS_MOUNT is not set$'\
        \ \"$OUT_DIR/.config\"\n\n# Absolutely critical: the working kernel's KPROBES\
        \ state is unchanged.\ngrep -q '^# CONFIG_KPROBES is not set$' \"$OUT_DIR/.config\"\
        \ngrep -q '^CONFIG_HAVE_KPROBES=y$' \"$OUT_DIR/.config\"\ngrep -q '^CONFIG_MODULES=y$'\
        \ \"$OUT_DIR/.config\"\n\n# Final compatibility audit: re-check every previously\
        \ fixed KSU\n# 4.19 incompatibility after ALL SUSFS and hook steps have completed.\n\
        SU_MOUNT_NS_C=\"KernelSU-Next/kernel/infra/su_mount_ns.c\"\nSUCOMPAT_C=\"\
        KernelSU-Next/kernel/manager/sucompat.c\"\nSECCOMP_CACHE_C=\"KernelSU-Next/kernel/infra/seccomp_cache.c\"\
        \nPKG_OBSERVER_C=\"KernelSU-Next/kernel/manager/pkg_observer.c\"\n\ntest -f\
        \ \"$SU_MOUNT_NS_C\"\n! grep -q '^#include <uapi/linux/mount.h>$' \"$SU_MOUNT_NS_C\"\
        \ngrep -q '#include <linux/fs.h>' \"$SU_MOUNT_NS_C\"\ngrep -Eq 'MS_PRIVATE|MS_REC'\
        \ \"$SU_MOUNT_NS_C\"\n\ntest -f \"$SUCOMPAT_C\"\n! grep -q '^#include <linux/minmax.h>$'\
        \ \"$SUCOMPAT_C\"\n\ntest -f \"$SECCOMP_CACHE_C\"\ngrep -q 'SECCOMP_ARCH_NATIVE_NR'\
        \ \"$SECCOMP_CACHE_C\"\n\ntest -f \"$PKG_OBSERVER_C\"\n! grep -q 'handle_inode_event\
        \ = ksu_handle_inode_event' \"$PKG_OBSERVER_C\"\ngrep -q 'handle_event = ksu_handle_event'\
        \ \"$PKG_OBSERVER_C\"\ngrep -q 'static int ksu_handle_event(struct fsnotify_group\
        \ *group' \"$PKG_OBSERVER_C\"\npython3 - \"$PKG_OBSERVER_C\" <<'PY'\nfrom\
        \ pathlib import Path\nimport sys\ns = Path(sys.argv[1]).read_text()\nif 'pr_info(\"\
        packages.list detected: %d\\n\", mask);' in s:\n    raise SystemExit(\"ERROR:\
        \ malformed packages.list pr_info string remains\")\nif 'pr_info(\"packages.list\
        \ detected: %d\\n\", mask);' in s:\n    raise SystemExit(\"ERROR: malformed\
        \ packages.list pr_info string remains\")\nprint(\"PASS: no malformed packages.list\
        \ pr_info string remains.\")\nPY\n\nif git diff --name-only -- include/linux/fsnotify_backend.h\
        \ | grep -q .; then\n  echo \"::error::Vendor fsnotify_backend.h was modified.\"\
        \n  exit 1\nfi\n\necho \"PASS: final compatibility audit: mount.h + minmax.h\
        \ + seccomp + pkg_observer all fixed.\"\necho \"PASS: vendor fsnotify ABI/header\
        \ remains untouched.\"\n\n# Device identity remains exactly the working kernel's\
        \ values.\ngrep -q '^CONFIG_MACH_LITO_CAYMANLM=y$' \"$OUT_DIR/.config\"\n\
        grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' \"$OUT_DIR/.config\"\ngrep\
        \ -q '^CONFIG_LOCALVERSION=\"-perf\"$' \"$OUT_DIR/.config\"\n\n# DTB/DTBO/defconfig\
        \ source trees must remain untouched.\ntest -z \"$(git status --short -- arch/arm64/boot/dts\
        \ arch/arm64/configs drivers/staging)\"\n\n{\n  echo \"=== FINAL BUILD REPORT\
        \ ===\"\n  echo \"source_branch=$SOURCE_BRANCH\"\n  echo \"source_commit=$(git\
        \ rev-parse HEAD)\"\n  echo \"defconfig=$DEFCONFIG\"\n  echo \"baseline_config_sha256=$WORKING_BASELINE_CONFIG_SHA256\"\
        \n  echo \"clang=$CLANG_REVISION\"\n  echo \"clang_snapshot=$CLANG_PREBUILT_TAG\"\
        \n  echo \"gcc64_branch=$GCC64_BRANCH\"\n  echo \"gcc32_branch=$GCC32_BRANCH\"\
        \n  echo \"ksu=$KSU_VERSION\"\n  echo \"susfs=$SUSFS_VERSION\"\n  echo \"\
        SUS_PATH=disabled_for_LG_user_struct_compatibility\"\n  echo \"KPROBES=disabled\
        \ (preserved from stock working kernel)\"\n  echo \"artifact=raw ARM64 Image;\
        \ stock DTB/DTBO intentionally preserved\"\n  echo\n  echo \"=== KSU/SUSFS\
        \ CONFIG ===\"\n  grep -E '^CONFIG_KSU($|_)' \"$OUT_DIR/.config\" | sort\n\
        \  echo\n  echo \"=== IMAGE ===\"\n  ls -lh \"$OUT_DIR/arch/arm64/boot/Image\"\
        \n} | tee \"$DIAG_DIR/final-report.txt\"\n"
    - name: 12B - Prepare OrangeFox recovery ZIP artifact (prebuilt, optional)
      if: success()
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$GITHUB_WORKSPACE/orangefox-artifact\"\n\
        # Do not fabricate a recovery image from a kernel-only build.\n# A real OrangeFox\
        \ ZIP must come from a recovery/device tree.\n# Commit the known-good flashable\
        \ package at this path if you want\n# it included automatically in the final\
        \ GitHub artifact.\nFOX_SRC=\"$GITHUB_WORKSPACE/recovery/orangefox/LG-Velvet-OrangeFox-Recovery-FLASHABLE.zip\"\
        \nif [ -f \"$FOX_SRC\" ]; then\n  cp -f \"$FOX_SRC\" \"$GITHUB_WORKSPACE/orangefox-artifact/LG-Velvet-OrangeFox-Recovery-FLASHABLE.zip\"\
        \n  sha256sum \"$GITHUB_WORKSPACE/orangefox-artifact/LG-Velvet-OrangeFox-Recovery-FLASHABLE.zip\"\
        \ | tee \"$GITHUB_WORKSPACE/orangefox-artifact/OrangeFox.sha256\"\n  echo\
        \ \"PASS: OrangeFox flashable ZIP staged for artifact upload.\"\nelse\n  echo\
        \ \"INFO: OrangeFox ZIP not present at recovery/orangefox/LG-Velvet-OrangeFox-Recovery-FLASHABLE.zip;\
        \ kernel build continues.\"\nfi\n"
    - name: 14 - Upload RAW kernel Image + OrangeFox ZIP (only on success)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LG-Velvet-4.19-KSU-Next-SUSFS-Kernel-and-Recovery-${{ github.run_id
          }}
        if-no-files-found: error
        retention-days: 14
        path: '${{ github.workspace }}/Image

          ${{ github.workspace }}/kernel/out/.config

          ${{ github.workspace }}/orangefox-artifact/**

          '
    - name: 13 - Package diagnostics (ALWAYS)
      if: always()
      shell: bash
      run: "set +e\nmkdir -p \"$DIAG_DIR\"\n{\n  echo \"=== WORKFLOW DIAGNOSTIC CONTEXT\
        \ ===\"\n  date -u +%FT%TZ\n  echo \"run_id=${{ github.run_id }}\"\n  echo\
        \ \"run_attempt=${{ github.run_attempt }}\"\n  echo \"event=${{ github.event_name\
        \ }}\"\n  echo \"ref=${{ github.ref }}\"\n  echo \"sha=${{ github.sha }}\"\
        \n  echo \"source_commit=$SOURCE_COMMIT\"\n  echo \"baseline_expected_sha256=$WORKING_BASELINE_CONFIG_SHA256\"\
        \n} > \"$DIAG_DIR/00-workflow-context.txt\"\n\nif [ -d \"$GITHUB_WORKSPACE/kernel/.git\"\
        \ ]; then\n  cd \"$GITHUB_WORKSPACE/kernel\"\n  git status --short > \"$DIAG_DIR/git-status.txt\"\
        \ 2>&1 || true\n  git diff --stat > \"$DIAG_DIR/git-diff-stat.txt\" 2>&1 ||\
        \ true\n  git diff --name-only > \"$DIAG_DIR/git-diff-files.txt\" 2>&1 ||\
        \ true\n  git diff --binary > \"$DIAG_DIR/kernel-source.patch\" 2>&1 || true\n\
        fi\n\nif [ -f \"$OUT_DIR/.config\" ]; then\n  cp \"$OUT_DIR/.config\" \"$DIAG_DIR/final-or-last.config\"\
        \ || true\nfi\nif [ -f \"$OUT_DIR/arch/arm64/boot/Image\" ]; then\n  sha256sum\
        \ \"$OUT_DIR/arch/arm64/boot/Image\" > \"$DIAG_DIR/Image.sha256\" || true\n\
        \  ls -lh \"$OUT_DIR/arch/arm64/boot/Image\" > \"$DIAG_DIR/Image.ls.txt\"\
        \ || true\nfi\n\n{\n  echo \"source_branch=$SOURCE_BRANCH\"\n  echo \"source_commit=$SOURCE_COMMIT\"\
        \n  echo \"defconfig=$DEFCONFIG\"\n  echo \"baseline_config_sha256=$WORKING_BASELINE_CONFIG_SHA256\"\
        \n  echo \"clang_revision=$CLANG_REVISION\"\n  echo \"clang_snapshot=$CLANG_PREBUILT_TAG\"\
        \n  echo \"gcc64_branch=$GCC64_BRANCH\"\n  echo \"gcc32_branch=$GCC32_BRANCH\"\
        \n  echo \"ksu=$KSU_VERSION\"\n  echo \"susfs=$SUSFS_VERSION\"\n  echo \"\
        SUS_PATH=disabled_for_LG_user_struct_compatibility\"\n  echo \"KPROBES=disabled\"\
        \n  echo \"SUS_MOUNT=disabled_for_non_GKI_stability\"\n  echo \"SUS_SU=disabled_non_KPROBE\"\
        \n} > \"$DIAG_DIR/build-metadata.txt\"\n\n# Never leave the artifact empty.\
        \ Even an early failure produces a\n# readable marker and every log collected\
        \ up to the failure.\necho \"Diagnostics generated at $(date -u +%FT%TZ)\"\
        \ > \"$DIAG_DIR/ARTIFACT-READY.txt\"\ncd \"$GITHUB_WORKSPACE\"\nrm -f \"$GITHUB_WORKSPACE/LG-Velvet-diagnostics.tar.gz\"\
        \ntar -czf \"$GITHUB_WORKSPACE/LG-Velvet-diagnostics.tar.gz\" -C \"$DIAG_DIR\"\
        \ .\ntest -s \"$GITHUB_WORKSPACE/LG-Velvet-diagnostics.tar.gz\"\n"
    - name: 15 - Upload COMPLETE diagnostics (ALWAYS)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: LG-Velvet-KSU-SUSFS-NonGKI-sixteen-diagnostics-run-${{ github.run_id
          }}
        if-no-files-found: error
        retention-days: 14
        compression-level: 6
        path: '${{ github.workspace }}/ci-diagnostics/**

          ${{ github.workspace }}/LG-Velvet-diagnostics.tar.gz

          '
    - name: 16 - Print artifact location
      if: always()
      shell: bash
      run: 'echo "============================================================"

        echo "DIAGNOSTICS ARTIFACT WAS CREATED WITH if: always()"

        echo "Artifact name: LG-Velvet-KSU-SUSFS-NonGKI-sixteen-diagnostics-run-${{
        github.run_id }}"

        echo "Local archive: $GITHUB_WORKSPACE/LG-Velvet-diagnostics.tar.gz"

        echo "============================================================"

        '
