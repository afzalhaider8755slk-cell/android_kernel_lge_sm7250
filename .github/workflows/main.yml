          check grep -qF 'fake_ss.map = selinux_state.ss->map;' drivers/kernelsu/feature/selinux_hide.c
          check grep -qF 'fake_ss.sidtab = selinux_state.ss->sidtab;' drivers/kernelsu/feature/selinux_hide.c
