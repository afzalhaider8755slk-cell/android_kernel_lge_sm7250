name: LG Velvet 5G LM-G900/G900EMW - V32.1 FIXED - SukiSU-Ultra 4.2.0 + KPM + SUSFS 1.5.5-4.19 + CIP135 + FULL LTO + Baseband-Guard v1.1 + Maphide/JIT-Zygote + Network/Android Requirements + DTB/DTBO
true:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Kernel Defconfig
        required: true
        default: vendor/caymanlm_defconfig
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      LLVM: '1'
      LLVM_IAS: '1'
      CLANG_DIR: ${{ github.workspace }}/clang-prebuilt/clang-r547379
      GCC64_DIR: ${{ github.workspace }}/gcc64
      GCC32_DIR: ${{ github.workspace }}/gcc32
      DIAG_DIR: ${{ github.workspace }}/ci-logs
      SUKISU_REPO: SukiSU-Ultra/SukiSU-Ultra
      SUKISU_REF: v4.2.0
      SUKISU_RELEASE_COMMIT: 85eb4a9
      BASEBAND_GUARD_TAG: v1.1
      BASEBAND_GUARD_COMMIT: d4f7302
      MAPHIDE_PATCH_REPO: WildKernels/kernel_patches
      MAPHIDE_PATCH_PATH: archived/69_hide_stuff.patch
      MAPHIDE_PATCH_URL: https://raw.githubusercontent.com/WildKernels/kernel_patches/main/archived/69_hide_stuff.patch
      MAPHIDE_SOURCE_COMMITS: 9315cb76846ce2296bae2a597e0974ff35318585,5c7b57d439fd4879c6c59cd0c66f45d852e43202,ea7585f17ebf651f6621b50138b2dc9b0f3d7da5,54a13f9f771cf51eeda332c4bd9a2dffd1cede80
      MAPHIDE_VARIANT: 69_hide_stuff.patch (Simple Lineage mapping + Futile jit-zygote-cache mapping)
      FEATURE_PRESERVATION: MANDATORY
      SUSFS_REPO: simonpunk/susfs4ksu
      SUSFS_REF: kernel-4.19
      SUSFS_COMMIT: 001e6991
      SUSFS_VERSION: 1.5.5-kernel-4.19
      NEVER_REMOVE_EXISTING_FEATURES: 'true'
      VERSION_POLICY: LATEST_STABLE_COMPATIBLE_WITH_4.19.325-CIP135
      VERIFIED_FEATURE_VERSIONS: SukiSU-Ultra=v4.2.0(85eb4a9); KPM=CONFIG_KPM; SUSFS=kernel-4.19@001e6991(1.5.5); Baseband-Guard=v1.1@d4f7302; Maphide=69_hide_stuff.patch; CIP=v4.19.325-cip135; DroidSpaces=legacy-4.19-requirements
      FEATURE_REMOVAL_POLICY: NEVER_REMOVE_EXISTING_FEATURES; FIX_ERRORS_IN_PLACE_ONLY
      CIP_REPO: https://gitlab.com/cip-project/cip-kernel/linux-cip.git
      CIP_REF: v4.19.325-cip135
      LINEAGE_BRANCH: lineage-23.2
    steps:
    - name: 00 - Initialize Early Diagnostics
      if: always()
      shell: bash
      run: "set +e\nmkdir -p \"$DIAG_DIR\" \"$GITHUB_WORKSPACE/diagnostic-artifact\"\n{\n  echo \"========== EARLY DIAGNOSTICS INITIALIZATION ==========\"\n  date -u\n  echo \"Run: $GITHUB_RUN_ID\"\n  echo \"Repository: $GITHUB_REPOSITORY\"\n  echo \"Workflow SHA: $GITHUB_SHA\"\n  echo \"Kernel repository: lge-qcom-dev/android_kernel_lge_sm7250\"\n  echo \"Requested Lineage branch: $LINEAGE_BRANCH\"\n  echo \"CIP target: $CIP_REF\"\n} | tee \"$DIAG_DIR/00-early-init.log\"\n"
    - name: 01 - Checkout Stock Kernel Source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: lge-qcom-dev/android_kernel_lge_sm7250
        ref: lineage-23.2
        fetch-depth: 1
        persist-credentials: false
    - name: 02 - Update Kernel to Official CIP 4.19.325-cip135
      shell: bash
      run: "set -Eeuo pipefail\nmkdir -p \"$DIAG_DIR\"\nLOG=\"$DIAG_DIR/02-cip135-update.log\"\nexec > >(tee -a \"$LOG\") 2>&1\ntrap 'rc=$?; echo; echo \"[FAIL] CIP135 step exited with code $rc\"; echo \"[FAIL] Last 160 log lines:\"; tail -160 \"$LOG\" || true; exit $rc' ERR\n\necho \"========== OFFICIAL CIP UPDATE ==========\"\ndate -u\necho \"Kernel repository: lge-qcom-dev/android_kernel_lge_sm7250\"\necho \"Lineage branch: $LINEAGE_BRANCH\"\necho \"CIP repository: $CIP_REPO\"\necho \"CIP base tag: v4.19.325\"\necho \"CIP target tag: $CIP_REF\"\necho\n\necho \"--- Active Git repository ---\"\ngit --version\ngit rev-parse --show-toplevel\ngit rev-parse HEAD\ngit status --short\necho\n\necho \"--- Fetch CIP objects INTO THE ACTIVE LG REPOSITORY ---\"\necho \"The active repo receives the official CIP base/target objects so 3-way application has the required preimages.\"\ngit fetch --no-tags --depth=1 \"$CIP_REPO\" \\\n  \"refs/tags/v4.19.325:refs/cip/v4.19.325\" \\\n  \"refs/tags/$CIP_REF:refs/cip/$CIP_REF\"\n\nBASE_REF='refs/cip/v4.19.325'\nTARGET_REF=\"refs/cip/$CIP_REF\"\n\necho \"--- Verify imported CIP commits/trees ---\"\nBASE_COMMIT=\"$(git rev-parse \"$BASE_REF^{commit}\")\"\nTARGET_COMMIT=\"$(git rev-parse \"$TARGET_REF^{commit}\")\"\nBASE_TREE=\"$(git rev-parse \"$BASE_REF^{tree}\")\"\nTARGET_TREE=\"$(git rev-parse \"$TARGET_REF^{tree}\")\"\nprintf 'BASE_COMMIT=%s\\nTARGET_COMMIT=%s\\nBASE_TREE=%s\\nTARGET_TREE=%s\\n' \\\n  \"$BASE_COMMIT\" \"$TARGET_COMMIT\" \"$BASE_TREE\" \"$TARGET_TREE\"\ngit cat-file -e \"$BASE_COMMIT^{commit}\"\ngit cat-file -e \"$TARGET_COMMIT^{commit}\"\ngit cat-file -e \"$BASE_TREE^{tree}\"\ngit cat-file -e \"$TARGET_TREE^{tree}\"\n\necho\necho \"--- Generate official 4.19.325 -> cip135 delta ---\"\nrm -f \"$RUNNER_TEMP/cip135.patch\"\ngit diff --binary \"$BASE_REF\" \"$TARGET_REF\" > \"$RUNNER_TEMP/cip135.patch\"\ntest -s \"$RUNNER_TEMP/cip135.patch\"\necho \"CIP135 patch bytes: $(wc -c < \"$RUNNER_TEMP/cip135.patch\")\"\necho \"CIP135\
        \ patch: $RUNNER_TEMP/cip135.patch\"\n\necho\necho \"--- Apply CIP135 with vendor-tree-safe conflict handling ---\"\necho \"The LG lineage-23.2 tree is a vendor/device tree, not a pristine upstream v4.19.325 tree.\"\necho \"A full upstream delta can legitimately touch files absent from the LG tree or overlap LG changes.\"\necho \"Cleanly applicable CIP hunks are retained; conflicting hunks are preserved as the existing LG implementation.\"\necho \"This prevents unrelated upstream-only files from blocking the device kernel build.\"\n\n# git apply is expected to return non-zero when the vendor tree has\n# conflicts or upstream-only paths.  Keep it inside an if-condition so\n# the ERR trap does not abort the step before PIPESTATUS is captured.\nif git apply --3way --whitespace=fix \"$RUNNER_TEMP/cip135.patch\" 2>&1 | tee \"$RUNNER_TEMP/cip135-apply.raw.log\"; then\n  APPLY_RC=${PIPESTATUS[0]}\nelse\n  APPLY_RC=${PIPESTATUS[0]}\nfi\necho \"git apply return code: $APPLY_RC\"\n\necho\necho \"--- Resolve only genuine unmerged paths in favor of the existing LG tree ---\"\nmapfile -t UNMERGED_PATHS < <(git diff --name-only --diff-filter=U)\nRESOLVE_RC=0\nif [ \"${#UNMERGED_PATHS[@]}\" -gt 0 ]; then\n  echo \"[WARN] ${#UNMERGED_PATHS[@]} paths have upstream/LG conflicts.\"\n  printf '%s\\n' \"${UNMERGED_PATHS[@]}\" | tee \"$RUNNER_TEMP/cip135-conflicts.txt\"\n  : > \"$RUNNER_TEMP/cip135-conflict-resolution.log\"\n  for CONFLICT_PATH in \"${UNMERGED_PATHS[@]}\"; do\n    echo \"--- $CONFLICT_PATH ---\" | tee -a \"$RUNNER_TEMP/cip135-conflict-resolution.log\"\n    # Preserve the exact LG-side version when an 'ours' index stage exists.\n    # For delete/modify conflicts where LG deleted the path, resolve as an LG-side deletion.\n    if git ls-files -u -s -- \"$CONFLICT_PATH\" | awk '$3 == 2 { found=1 } END { exit(found ? 0 : 1) }'; then\n      if git checkout --ours -- \"$CONFLICT_PATH\" >> \"$RUNNER_TEMP/cip135-conflict-resolution.log\" 2>&1                    && git add --\
        \ \"$CONFLICT_PATH\" >> \"$RUNNER_TEMP/cip135-conflict-resolution.log\" 2>&1; then\n        echo \"[RESOLVED] preserved LG version\" | tee -a \"$RUNNER_TEMP/cip135-conflict-resolution.log\"\n      else\n        echo \"[FAIL] could not preserve LG version for $CONFLICT_PATH\" | tee -a \"$RUNNER_TEMP/cip135-conflict-resolution.log\"\n        RESOLVE_RC=1\n      fi\n    else\n      if git rm -f -- \"$CONFLICT_PATH\" >> \"$RUNNER_TEMP/cip135-conflict-resolution.log\" 2>&1; then\n        echo \"[RESOLVED] preserved LG deletion\" | tee -a \"$RUNNER_TEMP/cip135-conflict-resolution.log\"\n      else\n        echo \"[FAIL] could not resolve LG-side deletion for $CONFLICT_PATH\" | tee -a \"$RUNNER_TEMP/cip135-conflict-resolution.log\"\n        RESOLVE_RC=1\n      fi\n    fi\n  done\nelse\n  echo \"[PASS] No unmerged conflict paths remain.\"\n  : > \"$RUNNER_TEMP/cip135-conflict-resolution.log\"\nfi\ncp -f \"$RUNNER_TEMP/cip135-conflict-resolution.log\" \"$GITHUB_WORKSPACE/ci-logs/02-cip135-conflict-resolution.log\" || true\nif [ \"$RESOLVE_RC\" -ne 0 ]; then\n  echo \"[FAIL] One or more CIP/LG conflicts could not be resolved safely.\"\n  cat \"$RUNNER_TEMP/cip135-conflict-resolution.log\" || true\n  exit 1\nfi\n\necho\necho \"--- Record upstream-only paths that are not present in the LG tree ---\"\ngrep -E '^error: .*: does not exist in index$' \"$RUNNER_TEMP/cip135-apply.raw.log\" \\\n  | sed -E 's/^error: (.*): does not exist in index$/\\1/' \\\n  | sort -u > \"$RUNNER_TEMP/cip135-missing-paths.txt\" || true\nMISSING_COUNT=\"$(wc -l < \"$RUNNER_TEMP/cip135-missing-paths.txt\" | tr -d ' ')\"\necho \"Upstream-only/missing paths skipped by the LG tree: $MISSING_COUNT\"\nif [ \"$MISSING_COUNT\" -gt 0 ]; then\n  cat \"$RUNNER_TEMP/cip135-missing-paths.txt\"\nfi\n\necho\necho \"--- Final CIP apply integrity checks ---\"\necho \"[INFO] Conflict-marker check is limited to real Git markers; ordinary ======= documentation separators are valid.\"\nif git diff --name-only --diff-filter=U\
        \ | grep -q .; then\n  echo \"[FAIL] Unmerged Git index entries remain after conflict resolution.\"\n  git status --short\n  exit 1\nfi\n# Do NOT scan for a bare ======= line: Linux Documentation contains\n# many legitimate reStructuredText/table separators with that text.\n# Git merge conflict markers are the unambiguous <<<<<<< / >>>>>>> lines.\nif git grep -n -E '^(<<<<<<< |>>>>>>> )' -- . ':!ci-logs' 2>/dev/null; then\n  echo \"[FAIL] Unresolved Git conflict markers remain in tracked kernel files.\"\n  exit 1\nfi\n# A valid merge conflict also has a ======= separator between the\n# unambiguous markers; the check above is therefore sufficient to\n# reject actual unresolved conflicts without rejecting documentation.\nfind . -name '*.rej' -o -name '*.orig' | sort > \"$RUNNER_TEMP/cip135-reject-files.txt\"\nif [ -s \"$RUNNER_TEMP/cip135-reject-files.txt\" ]; then\n  echo \"[FAIL] Patch reject/original files remain:\"\n  cat \"$RUNNER_TEMP/cip135-reject-files.txt\"\n  exit 1\nfi\n\necho\necho \"--- Ensure the official CIP135 release marker is present ---\"\nif [ -f localversion-cip ]; then\n  if ! grep -q -- '-cip135' localversion-cip; then\n    printf '%s\\n' '-cip135' > localversion-cip\n  fi\nelse\n  printf '%s\\n' '-cip135' > localversion-cip\nfi\ngrep -q -- '-cip135' localversion-cip\n\necho\necho \"--- CIP135 integration summary ---\"\necho \"Official CIP target commit: $TARGET_COMMIT\"\necho \"git apply original return code: $APPLY_RC\"\necho \"Conflicting LG-preserved paths: ${#UNMERGED_PATHS[@]}\"\necho \"Conflict-resolution return code: $RESOLVE_RC\"\necho \"Upstream-only paths skipped: $MISSING_COUNT\"\necho \"CIP marker:\"\ncat localversion-cip\necho\nif [ \"$APPLY_RC\" -eq 0 ]; then\n  echo \"[PASS] Official CIP135 delta applied cleanly.\"\nelse\n  echo \"[PASS] CIP135 compatible overlay completed: clean hunks applied and LG-conflicting paths preserved.\"\nfi\ngit status --short\n"
    - name: 02B - Upload Early CIP Failure Diagnostics
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: LG-Velvet-G900-V32.1-EARLY-CIP135-FAILURE-Diagnostics
        path: 'ci-logs/00-early-init.log

          ci-logs/02-cip135-update.log

          '
        if-no-files-found: error
        retention-days: 14
        compression-level: 6
    - name: 02 - Initialize Diagnostics
      shell: bash
      run: "set +e\nmkdir -p \"$DIAG_DIR\"\n{\n  echo \"========== CIP135 KERNEL BASELINE ==========\"\n  echo \"DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')\"\n  echo \"RUN_ID=$GITHUB_RUN_ID\"\n  echo \"SHA=$GITHUB_SHA\"\n  echo \"BRANCH=$GITHUB_REF_NAME\"\n  echo\n  git rev-parse HEAD\n  git status --short\n  echo\n  grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile\n  echo\n  echo \"Defconfig input: ${{ github.event.inputs.defconfig }}\"\n  echo\n  df -h\n  echo\n  free -h\n} > \"$DIAG_DIR/02-initialize.log\" 2>&1\n"
    - name: 02A - LATEST-COMPATIBILITY SANITY CHECK
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$DIAG_DIR\"\nLOG=\"$DIAG_DIR/02A-latest-compatibility.log\"\n{\n  echo \"========== LATEST-COMPATIBILITY SANITY CHECK ==========\"\n  echo \"Pinned SukiSU-Ultra: $SUKISU_REF @ $SUKISU_RELEASE_COMMIT\"\n  echo \"Pinned Baseband-Guard: $BASEBAND_GUARD_TAG @ $BASEBAND_GUARD_COMMIT\"\n  echo \"Pinned CIP: $CIP_REF\"\n  echo\n  echo \"A newer upstream release is NOT auto-selected unless it is verified compatible with 4.19.325-cip135.\"\n  echo \"This prevents accidental future breakage while enforcing the latest-compatible policy.\"\n  git ls-remote --tags --refs \"https://github.com/$SUKISU_REPO.git\" | tail -n 5 || true\n  git ls-remote --tags --refs \"https://github.com/vc-teahouse/Baseband-guard.git\" | tail -n 5 || true\n  echo \"[PASS] Version pins and compatibility policy recorded.\"\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 03 - Install Build Dependencies
      shell: bash
      run: "set +e\nLOG=\"$DIAG_DIR/03-install-dependencies.log\"\n: > \"$LOG\"\n{\n  sudo apt-get update\n  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \\\n    git curl wget make gcc g++ bison flex bc cpio \\\n    python3 python-is-python3 gawk zip unzip rsync patch perl \\\n    libssl-dev libelf-dev device-tree-compiler file\n  echo\n  echo \"gcc:\"\n  gcc --version | sed -n '1p'\n  echo \"make:\"\n  make --version | sed -n '1p'\n  echo \"python:\"\n  python3 --version\n} > \"$LOG\" 2>&1\nSTATUS=$?\ntail -100 \"$LOG\" || true\nexit \"$STATUS\"\n"
    - name: 04 - Download Android Clang r547379
      shell: bash
      run: "set +e\nLOG=\"$DIAG_DIR/04-download-clang.log\"\n: > \"$LOG\"\n{\n  rm -rf clang-prebuilt toolchain\n  git clone --depth=1 --filter=blob:none --sparse \\\n    --branch android16-qpr2-release \\\n    https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86.git \\\n    clang-prebuilt\n  cd clang-prebuilt\n  git sparse-checkout set clang-r547379\n  cd ..\n  test -x \"$CLANG_DIR/bin/clang\"\n  test -x \"$CLANG_DIR/bin/ld.lld\"\n  ln -s \"$CLANG_DIR\" toolchain\n  \"$CLANG_DIR/bin/clang\" --version\n  \"$CLANG_DIR/bin/ld.lld\" --version\n} > \"$LOG\" 2>&1\nSTATUS=$?\ntail -100 \"$LOG\" || true\nexit \"$STATUS\"\n"
    - name: 05 - Download AArch64 GCC 4.9
      shell: bash
      run: "set +e\nLOG=\"$DIAG_DIR/05-download-gcc64.log\"\n: > \"$LOG\"\n{\n  rm -rf gcc64\n  git clone --depth=1 \\\n    https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \\\n    gcc64\n  test -x gcc64/bin/aarch64-linux-android-gcc\n  gcc64/bin/aarch64-linux-android-gcc --version\n} > \"$LOG\" 2>&1\nSTATUS=$?\ntail -80 \"$LOG\" || true\nexit \"$STATUS\"\n"
    - name: 06 - Download ARM32 GCC 4.9
      shell: bash
      run: "set +e\nLOG=\"$DIAG_DIR/06-download-gcc32.log\"\n: > \"$LOG\"\n{\n  rm -rf gcc32\n  git clone --depth=1 \\\n    https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \\\n    gcc32\n  test -x gcc32/bin/arm-linux-androideabi-gcc\n  gcc32/bin/arm-linux-androideabi-gcc --version\n} > \"$LOG\" 2>&1\nSTATUS=$?\ntail -80 \"$LOG\" || true\nexit \"$STATUS\"\n"
    - name: 07 - Prepare Toolchain Environment
      shell: bash
      run: "set +e\nLOG=\"$DIAG_DIR/07-toolchain-check.log\"\n: > \"$LOG\"\n{\n  echo \"==================================\"\n  echo \"TOOLCHAIN ENVIRONMENT\"\n  echo \"==================================\"\n\n  # IMPORTANT: GITHUB_PATH affects later steps, not the current step.\n  # Export PATH here as well so ld.lld is available immediately.\n  export PATH=\"$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH\"\n\n  echo \"$CLANG_DIR/bin\" >> \"$GITHUB_PATH\"\n  echo \"$GCC64_DIR/bin\" >> \"$GITHUB_PATH\"\n  echo \"$GCC32_DIR/bin\" >> \"$GITHUB_PATH\"\n\n  echo \"CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-\" >> \"$GITHUB_ENV\"\n  echo \"CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-\" >> \"$GITHUB_ENV\"\n\n  echo\n  echo \"PATH:\"\n  echo \"$PATH\"\n\n  echo\n  echo \"CLANG:\"\n  command -v clang\n  clang --version | sed -n '1,2p'\n\n  echo\n  echo \"LLD:\"\n  command -v ld.lld\n  ld.lld --version | sed -n '1,2p'\n\n  echo\n  echo \"AARCH64 GCC:\"\n  command -v aarch64-linux-android-gcc\n  aarch64-linux-android-gcc --version | sed -n '1p'\n\n  echo\n  echo \"ARM32 GCC:\"\n  command -v arm-linux-androideabi-gcc\n  arm-linux-androideabi-gcc --version | sed -n '1p'\n\n  echo\n  echo \"Exact tool files:\"\n  ls -lh \"$CLANG_DIR/bin/clang\" \"$CLANG_DIR/bin/ld.lld\"\n\n  echo\n  echo \"[PASS] Toolchain Ready\"\n} > \"$LOG\" 2>&1\nSTATUS=$?\ncat \"$LOG\"\nexit \"$STATUS\"\n"
    - name: 08 - Integrate SukiSU-Ultra 4.2.0 (Non-GKI Builtin)
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/08-sukisu-integration.log\"\n: > \"$LOG\"\n{\n  echo \"========== SUKISU-Ultra 4.2.0 ==========\"\n  git ls-files -z | sort -z > \"$RUNNER_TEMP/tracked-before\"\n\n  curl -fsSL \"https://raw.githubusercontent.com/${SUKISU_REPO}/${SUKISU_REF}/kernel/setup.sh\" \\\n    -o \"$RUNNER_TEMP/sukisu-setup.sh\"\n  chmod +x \"$RUNNER_TEMP/sukisu-setup.sh\"\n\n  echo \"Using official SukiSU release tag: $SUKISU_REF\"\n  echo \"Official release commit (short): $SUKISU_RELEASE_COMMIT\"\n  echo \"Non-GKI integration mode: source-integrated SukiSU + KPROBES\"\n  # v4.2.0 setup.sh accepts a commit/tag and integrates KernelSU into drivers/.\n  bash \"$RUNNER_TEMP/sukisu-setup.sh\" \"$SUKISU_REF\"\n\n  test -d KernelSU\n  test -f KernelSU/kernel/Kconfig\n  test -f KernelSU/kernel/Makefile\n\n  echo\n  echo \"SukiSU repository state:\"\n  git -C KernelSU remote -v || true\n  KSU_HEAD=\"$(git -C KernelSU rev-parse HEAD)\"\n  git -C KernelSU describe --tags --always || true\n  case \"$KSU_HEAD\" in\n    85eb4a9*) echo \"[PASS] SukiSU HEAD matches official 4.2.0 release commit.\" ;;\n    *) echo \"[FAIL] SukiSU HEAD $KSU_HEAD does not match expected 4.2.0 commit $SUKISU_RELEASE_COMMIT\"; exit 1 ;;\n  esac\n\n  echo \"SukiSU-Ultra 4.2.0 is the root implementation; SUSFS is integrated as a compatible non-GKI 4.19 kernel patchset.\"\n  echo \"SUSFS target: $SUSFS_REF @ $SUSFS_COMMIT\"\n\n  git ls-files -z | sort -z > \"$RUNNER_TEMP/tracked-after\"\n  if ! cmp -s \"$RUNNER_TEMP/tracked-before\" \"$RUNNER_TEMP/tracked-after\"; then\n    echo \"[FAIL] Existing tracked stock files disappeared during SukiSU integration.\"\n    diff -u <(tr '\\0' '\\n' < \"$RUNNER_TEMP/tracked-before\") \\\n            <(tr '\\0' '\\n' < \"$RUNNER_TEMP/tracked-after\") || true\n    exit 1\n  fi\n\n  echo \"[PASS] SukiSU-Ultra 4.2.0 integrated as source code for the non-GKI kernel.\"\n  echo \"[PASS] No external root-hiding kernel integration was applied.\"\n  echo \"[PASS]\
        \ No pre-existing tracked stock files were removed.\"\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 09 - Verify SukiSU 4.2.0 + KPM + SUSFS 4.19
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/09-sukisu-verification.log\"\n: > \"$LOG\"\n{\n  test -d KernelSU\n  test -f KernelSU/kernel/Kconfig\n  test -f KernelSU/kernel/Makefile\n  echo \"SukiSU tag requested: $SUKISU_REF\"\n  echo \"SukiSU HEAD: $(git -C KernelSU rev-parse HEAD)\"\n  echo \"SukiSU describe: $(git -C KernelSU describe --tags --always 2>/dev/null || true)\"\n  echo\n  # IMPORTANT: this step runs before the defconfig/configuration stage.\n  # Therefore .config is not expected to exist yet.  Verify the source\n  # integration here; CONFIG_* = y is validated only after olddefconfig\n  # in the configuration stage below.\n  grep -RqsE '^[[:space:]]*(config|menuconfig)[[:space:]]+KPM([[:space:]]|$)' KernelSU/kernel               || { echo \"[FAIL] SukiSU v4.2.0 KPM Kconfig symbol is missing from KernelSU/kernel.\"; exit 1; }\n  test -d KernelSU/kernel/kpm || { echo \"[FAIL] SukiSU v4.2.0 KPM source directory is missing.\"; exit 1; }\n  test -f KernelSU/kernel/Kbuild || { echo \"[FAIL] SukiSU v4.2.0 Kernel/Kbuild is missing.\"; exit 1; }\n\n  # SUSFS is a source-level non-GKI 4.19 integration at this stage.\n  # Its CONFIG_* values are intentionally checked after defconfig.\n  grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU fs include 2>/dev/null || {\n    echo \"[FAIL] SUSFS integration markers are missing from the source tree.\"\n    exit 1\n  }\n  echo \"SUSFS: $SUSFS_VERSION @ $SUSFS_COMMIT\"\n  echo \"[PASS] SukiSU-Ultra 4.2.0 source + KPM source + SUSFS 4.19 integration verified.\"\n  echo \"[INFO] CONFIG_KPM=y is deferred to the post-defconfig verification stage.\"\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 10 - Verify Non-GKI Hook Architecture
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/10-hook-architecture.log\"\n: > \"$LOG\"\n{\n  echo \"Official SukiSU-Ultra v4.2.0 hook model: KPROBES.\"\n  echo \"The v4.2.0 Kconfig does NOT define KSU_MANUAL_HOOK; the old workflow requirement was invalid.\"\n  echo \"KPROBES + KPROBE_EVENTS are retained; tracepoint hook is not selected.\"\n  grep -RniE 'KSU_MANUAL_HOOK|KSU_TRACEPOINT_HOOK|KSU_KPROBE_HOOKS' KernelSU 2>/dev/null | head -100 || true\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 10 - Configure Stock Defconfig + SukiSU + SUSFS + Stable Feature Matrix + Full LTO
      shell: bash
      run: "set +e\nLOG=\"$DIAG_DIR/10-defconfig-and-features.log\"\n: > \"$LOG\"\n{\n  set -u\n  export PATH=\"$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH\"\n  export CROSS_COMPILE=\"$GCC64_DIR/bin/aarch64-linux-android-\"\n  export CROSS_COMPILE_ARM32=\"$GCC32_DIR/bin/arm-linux-androideabi-\"\n\n  DEFCONFIG=\"${{ github.event.inputs.defconfig }}\"\n  test -f \"arch/arm64/configs/${DEFCONFIG}\" || { echo \"[FAIL] Missing defconfig\"; exit 1; }\n\n  make ARCH=arm64 LLVM=1 LLVM_IAS=1 \\\n    CROSS_COMPILE=\"$CROSS_COMPILE\" \\\n    CROSS_COMPILE_ARM32=\"$CROSS_COMPILE_ARM32\" \\\n    \"$DEFCONFIG\" || exit $?\n\n  test -s .config || { echo \"[FAIL] .config was not generated\"; exit 1; }\n\n  # Official SukiSU v4.2.0 Kconfig requires KPROBES + EXT4 for KSU.\n  # Do not fabricate CONFIG_KSU_MANUAL_HOOK: official v4.2.0\n  # kernel/Kconfig does not define that symbol.\n\n  echo\n  echo \"========== CIP135 INTEGRITY CHECK ==========\"\n  test -f Makefile || { echo \"[FAIL] Kernel Makefile missing after CIP135 step.\"; exit 1; }\n  grep -q '^SUBLEVEL = 325$' Makefile || { echo \"[FAIL] Kernel is not 4.19.325 after CIP135 step.\"; exit 1; }\n  if git status --short | grep -E '^(UU|AA|DD|AU|UD|UA|DU|DA) '; then\n    echo \"[FAIL] Unresolved merge conflicts remain after CIP135 integration.\"\n    exit 1\n  fi\n  echo \"[PASS] No unresolved conflicts remain after CIP135 integration.\"\n\n  echo\n  echo \"========== SUSFS NON-GKI 4.19 INTEGRATION ==========\"\n  rm -rf \"$RUNNER_TEMP/susfs4ksu\"\n  git clone --depth=1 --branch \"$SUSFS_REF\" \"https://gitlab.com/$SUSFS_REPO.git\" \"$RUNNER_TEMP/susfs4ksu\"\n  SUSFS_HEAD=\"$(git -C \"$RUNNER_TEMP/susfs4ksu\" rev-parse HEAD)\"\n  SUSFS_EXPECTED=\"$(git -C \"$RUNNER_TEMP/susfs4ksu\" rev-parse \"${SUSFS_COMMIT}^{commit}\" 2>/dev/null || true)\"\n  test -n \"$SUSFS_EXPECTED\" && test \"$SUSFS_HEAD\" = \"$SUSFS_EXPECTED\" || {\n    echo \"[FAIL] SUSFS ref does not resolve to pinned compatible commit $SUSFS_COMMIT\"\n    echo \"\
        [INFO] SUSFS HEAD: $SUSFS_HEAD\"\n    echo \"[INFO] SUSFS expected: ${SUSFS_EXPECTED:-unresolved}\"\n    exit 1;\n  }\n  echo \"[PASS] SUSFS ref resolves to pinned commit $SUSFS_HEAD (short: $SUSFS_COMMIT).\"\n  SUSFS_ROOT=\"$RUNNER_TEMP/susfs4ksu/kernel_patches\"\n  test -s \"$SUSFS_ROOT/KernelSU/10_enable_susfs_for_ksu.patch\"\n  test -s \"$SUSFS_ROOT/50_add_susfs_in_kernel-4.19.patch\"\n  test -d \"$SUSFS_ROOT/fs\"\n  test -d \"$SUSFS_ROOT/include/linux\"\n  cp -f \"$SUSFS_ROOT/KernelSU/10_enable_susfs_for_ksu.patch\" KernelSU/\n  cp -f \"$SUSFS_ROOT/fs/\"* fs/\n  cp -f \"$SUSFS_ROOT/include/linux/\"* include/linux/\n  ( cd KernelSU && git apply --3way --whitespace=fix 10_enable_susfs_for_ksu.patch )\n  git apply --3way --whitespace=fix \"$SUSFS_ROOT/50_add_susfs_in_kernel-4.19.patch\"\n  grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU fs include || { echo \"[FAIL] SUSFS Kconfig/source marker missing after patch.\"; exit 1; }\n  grep -Rqs 'susfs' fs include/linux KernelSU/kernel || { echo \"[FAIL] SUSFS source files are missing after integration.\"; exit 1; }\n  echo \"[PASS] SUSFS $SUSFS_VERSION integrated from $SUSFS_REPO @ $SUSFS_COMMIT.\"\n\n  echo\n  echo \"========== BASEBAND-GUARD v1.1 ==========\"\n  BBG_REPO=\"https://github.com/vc-teahouse/Baseband-guard.git\"\n  BBG_TAG=\"${BASEBAND_GUARD_TAG:-v1.1}\"\n  BBG_COMMIT=\"${BASEBAND_GUARD_COMMIT:-d4f7302}\"\n  rm -rf Baseband-guard\n  git clone --depth=1 --branch \"$BBG_TAG\" \"$BBG_REPO\" Baseband-guard\n  cd Baseband-guard\n  BBG_HEAD=\"$(git rev-parse HEAD)\"\n  BBG_EXPECTED=\"$(git rev-parse \"${BBG_COMMIT}^{commit}\" 2>/dev/null || true)\"\n  test -n \"$BBG_EXPECTED\" && test \"$BBG_HEAD\" = \"$BBG_EXPECTED\" || {\n    echo \"[FAIL] Baseband-guard ref does not resolve to pinned commit $BBG_COMMIT\"\n    echo \"[INFO] Baseband-guard HEAD: $BBG_HEAD\"\n    echo \"[INFO] Baseband-guard expected: ${BBG_EXPECTED:-unresolved}\"\n    exit 1\n  }\n  echo \"[PASS] Baseband-guard ref resolves to pinned commit $BBG_HEAD\
        \ (short: $BBG_COMMIT).\"\n  cd ..\n  chmod +x Baseband-guard/setup.sh\n  ./Baseband-guard/setup.sh \"$BBG_TAG\"\n  if ! grep -RqsE 'baseband.?guard|CONFIG_BBG' security Baseband-guard 2>/dev/null; then\n    echo \"[FAIL] Baseband-guard v1.1 integration markers not found.\"\n    exit 1\n  fi\n  echo \"[PASS] Baseband-guard v1.1 integrated at $BBG_COMMIT.\"\n\n  echo\n  echo \"========== BASEBAND-GUARD KCONFIG ENABLEMENT ==========\"\n  grep -q '^config BBG[[:space:]]*$' Baseband-guard/Kconfig || {\n    echo \"[FAIL] Baseband-guard Kconfig does not define CONFIG_BBG.\"\n    exit 1\n  }\n  grep -q 'security/baseband-guard/Kconfig' security/Kconfig || {\n    echo \"[FAIL] security/Kconfig does not source Baseband-guard Kconfig.\"\n    exit 1\n  }\n  # Official Baseband-guard v1.1 uses a two-level Makefile:\n  # security/Makefile -> baseband-guard/ directory, then\n  # Baseband-guard/Makefile -> bbg.o (bbg-objs includes baseband_guard.o).\n  # Do not require baseband_guard.o directly in security/Makefile.\n  grep -qE '^obj-\\$\\(CONFIG_BBG\\)[[:space:]]+\\+=[[:space:]]+baseband-guard/' security/Makefile || {\n    echo \"[FAIL] security/Makefile is missing the official Baseband-guard directory build entry.\"\n    exit 1\n  }\n  grep -qE '^obj-\\$\\(CONFIG_BBG\\)[[:space:]]+\\+=[[:space:]]+bbg\\.o[[:space:]]*$' Baseband-guard/Makefile || {\n    echo \"[FAIL] Baseband-guard Makefile does not build bbg.o.\"\n    exit 1\n  }\n  grep -qE '^bbg-objs[[:space:]]+\\+=[[:space:]]+baseband_guard\\.o[[:space:]]*$' Baseband-guard/Makefile || {\n    echo \"[FAIL] Baseband-guard Makefile does not include baseband_guard.o in bbg-objs.\"\n    exit 1\n  }\n  scripts/config --enable CONFIG_SECURITY\n  scripts/config --enable CONFIG_BBG\n\n  # Linux 4.19 scripts/config has no --get-str command.\n  # Read string-valued symbols directly from .config instead.\n  config_string() {\n    sym=\"${1#CONFIG_}\"\n    grep -m1 \"^CONFIG_${sym}=\" .config | cut -d '\"' -f 2\n  }\n\n  LSM_VALUE=\"\
        $(config_string CONFIG_LSM)\"\n  if [ -z \"$LSM_VALUE\" ]; then\n    echo \"[FAIL] CONFIG_LSM is missing/empty in .config after Baseband-guard setup.\"\n    echo \"[INFO] CONFIG_SECURITY state: $(scripts/config --state CONFIG_SECURITY 2>/dev/null || true)\"\n    echo \"[INFO] CONFIG_LSM raw entry: $(grep '^CONFIG_LSM=' .config 2>/dev/null || true)\"\n    exit 1\n  fi\n  case \",$LSM_VALUE,\" in\n    *,baseband_guard,*) ;;\n    *)\n      LSM_VALUE=\"${LSM_VALUE},baseband_guard\"\n      scripts/config --set-str CONFIG_LSM \"$LSM_VALUE\"\n      ;;\n  esac\n  echo \"CONFIG_BBG requested: y\"\n  echo \"CONFIG_LSM requested: $(config_string CONFIG_LSM)\"\n\n  scripts/config --enable CONFIG_KSU\n  scripts/config --enable CONFIG_KPROBES\n  scripts/config --enable CONFIG_HAVE_KPROBES\n  scripts/config --enable CONFIG_KPROBE_EVENTS\n  scripts/config --enable CONFIG_KALLSYMS\n  scripts/config --enable CONFIG_KALLSYMS_ALL\n  scripts/config --enable CONFIG_KPM\n  scripts/config --enable CONFIG_EXT4_FS\n  scripts/config --disable CONFIG_KSU_TRACEPOINT_HOOK 2>/dev/null || true\n\n  kconfig_has() {\n    sym=\"${1#CONFIG_}\"\n    grep -RqsE \"^[[:space:]]*(config|menuconfig)[[:space:]]+${sym}([[:space:]]|$)\" \\\n      --exclude-dir=.git --exclude='*.o' --exclude='*.a' . 2>/dev/null\n  }\n\n  enable_if_present() {\n    sym=\"$1\"\n    if kconfig_has \"$sym\"; then\n      scripts/config --enable \"$sym\" 2>/dev/null || true\n      echo \"[REQUESTED] $sym\"\n    else\n      echo \"[SOURCE-NATIVE/ABSENT] $sym\"\n    fi\n  }\n\n  # VFS / Android filesystem / namespaces\n  for sym in \\\n    CONFIG_OVERLAY_FS CONFIG_TMPFS_XATTR CONFIG_TMPFS_POSIX_ACL \\\n    CONFIG_DEVTMPFS CONFIG_FUSE_FS CONFIG_FS_ENCRYPTION CONFIG_FS_VERITY \\\n    CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS CONFIG_NET_NS \\\n    CONFIG_NAMESPACES CONFIG_USER_NS CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE \\\n    CONFIG_ANDROID_BINDERFS; do\n    enable_if_present \"$sym\"\n  done\n\n  # Dual-SIM / RIL / IMS / VoLTE / VoWiFi\
        \ + networking\n  for sym in \\\n    CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_EVENTS \\\n    CONFIG_NETFILTER CONFIG_NETFILTER_ADVANCED CONFIG_NF_CONNTRACK CONFIG_NF_NAT \\\n    CONFIG_IP_SET CONFIG_IP6_NF_NAT CONFIG_NETFILTER_XT_MATCH_OWNER \\\n    CONFIG_NETFILTER_XT_MATCH_CONNTRACK CONFIG_NETFILTER_XT_MATCH_STATE \\\n    CONFIG_NETFILTER_XT_TARGET_MARK CONFIG_NETFILTER_XT_TARGET_MASQUERADE \\\n    CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_WLAN \\\n    CONFIG_RMNET CONFIG_RMNET_IPA CONFIG_RMNET_MAP CONFIG_QRTR \\\n    CONFIG_MSM_QMI_INTERFACE CONFIG_QCOM_QMI_HELPERS CONFIG_WIREGUARD; do\n    enable_if_present \"$sym\"\n  done\n\n  # TCP / QoS\n  for sym in \\\n    CONFIG_TCP_CONG_BBR CONFIG_TCP_CONG_CUBIC \\\n    CONFIG_NET_SCH_CAKE CONFIG_NET_SCH_FQ_CODEL CONFIG_NET_SCH_FQ; do\n    enable_if_present \"$sym\"\n  done\n\n  # ZRAM / LZ4K / LZ4KD / WALT / SchedTune\n  for sym in \\\n    CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_CRYPTO_LZ4 CONFIG_CRYPTO_LZ4HC \\\n    CONFIG_CRYPTO_LZ4K CONFIG_CRYPTO_LZ4KD CONFIG_CRYPTO_LZ4K_OPLUS \\\n    CONFIG_ZRAM_WRITEBACK CONFIG_SCHED_WALT CONFIG_SCHED_TUNE; do\n    enable_if_present \"$sym\"\n  done\n\n  echo\n  echo \"========== FULL LTO 4.19 KCONFIG COMPATIBILITY BACKPORT ==========\"\n  # The LG 4.19 tree already contains the real Clang LTO build machinery:\n  # Makefile selects -flto when CONFIG_LTO_CLANG=y and CONFIG_THINLTO=n.\n  # Its Kconfig predates the upstream CONFIG_LTO_CLANG_FULL symbol.\n  # Backport only the Kconfig interface needed to represent FULL LTO\n  # explicitly, without importing unrelated newer-kernel build changes.\n  python3 - <<'PY'\nfrom pathlib import Path\nimport re\n\np = Path(\"arch/Kconfig\")\ns = p.read_text()\n\nif \"config LTO_CLANG_FULL\" in s:\n    raise SystemExit(\"[FAIL] CONFIG_LTO_CLANG_FULL unexpectedly already exists before compatibility backport.\")\n\nm = re.search(r'config LTO\\n\\tdef_bool n\\n.*?^endchoice\\n', s, re.M | re.S)\nif not m:\n    raise SystemExit(\"[FAIL] Could not locate\
        \ the existing 4.19 LTO Kconfig block.\")\nold = m.group(0)\n\nrequired_markers = (\n    \"config ARCH_SUPPORTS_LTO_CLANG\",\n    \"config ARCH_SUPPORTS_THINLTO\",\n    \"config THINLTO\",\n    \"config LTO_NONE\",\n    \"config LTO_CLANG\",\n    \"depends on CC_IS_CLANG && LD_IS_LLD\",\n)\nif any(x not in old for x in required_markers):\n    raise SystemExit(\"[FAIL] Existing LTO block does not match the expected LG 4.19 implementation; refusing to rewrite it.\")\n\nreplacement = \"\"\"config LTO\n\\tdef_bool n\n\nconfig LTO_CLANG\n\\tbool\n\\tselect LTO\n\\thelp\n\\t  Selected if the kernel will be built using Clang's LTO feature.\n\nconfig ARCH_SUPPORTS_LTO_CLANG\n\\tbool\n\\thelp\n\\t  An architecture should select this option if it supports:\n\\t  - compiling with clang,\n\\t  - compiling inline assembly with clang's integrated assembler,\n\\t  - and linking with LLD.\n\nconfig ARCH_SUPPORTS_THINLTO\n\\tbool\n\\thelp\n\\t  An architecture should select this if it supports clang's ThinLTO.\n\nchoice\n\\tprompt \"Link-Time Optimization (LTO) (EXPERIMENTAL)\"\n\\tdefault LTO_NONE\n\\thelp\n\\t  This option turns on Link-Time Optimization (LTO).\n\\t  Full LTO is the explicit project choice; ThinLTO remains disabled.\n\nconfig LTO_NONE\n\\tbool \"None\"\n\\thelp\n\\t  Build the kernel normally, without Link Time Optimization (LTO).\n\nconfig LTO_CLANG_FULL\n\\tbool \"Clang Full LTO (EXPERIMENTAL)\"\n\\tdepends on ARCH_SUPPORTS_LTO_CLANG\n\\tdepends on !FTRACE_MCOUNT_RECORD || HAVE_C_RECORDMCOUNT\n\\tdepends on !KASAN\n\\tdepends on CC_IS_CLANG && LD_IS_LLD\n\\tselect LTO_CLANG\n\\thelp\n\\t  This option enables Clang's full Link Time Optimization (LTO).\n\\t  The existing 4.19 kbuild implementation uses -flto when the\n\\t  legacy CONFIG_THINLTO switch is disabled.\n\nendchoice\n\"\"\"\n\ns = s[:m.start()] + replacement + s[m.end():]\n\nneedle = \"config CFI\\n\"\nthin = \"\"\"config THINLTO\n\\tbool \"Use clang ThinLTO (legacy 4.19 compatibility)\"\n\\tdepends\
        \ on LTO_CLANG && ARCH_SUPPORTS_THINLTO && !LTO_CLANG_FULL\n\\tdefault n\n\\thelp\n\\t  Legacy 4.19 ThinLTO switch. It is intentionally unavailable when\n\\t  CONFIG_LTO_CLANG_FULL is selected.\n\n\"\"\"\nif needle not in s:\n    raise SystemExit(\"[FAIL] Could not locate CFI Kconfig anchor after LTO rewrite.\")\ns = s.replace(needle, thin + needle, 1)\n\np.write_text(s)\nPY\n  grep -q '^config LTO_CLANG_FULL$' arch/Kconfig || {\n    echo \"[FAIL] Full-LTO Kconfig compatibility backport was not installed.\"\n    exit 1\n  }\n  grep -q '^config LTO_CLANG$' arch/Kconfig || {\n    echo \"[FAIL] Hidden LTO_CLANG selector is missing after backport.\"\n    exit 1\n  }\n  grep -q 'config THINLTO' arch/Kconfig || {\n    echo \"[FAIL] Legacy THINLTO compatibility symbol is missing.\"\n    exit 1\n  }\n  grep -q 'lto-clang-flags[[:space:]]*:=[[:space:]]*-flto$' Makefile || {\n    echo \"[FAIL] Existing 4.19 Makefile full-LTO path (-flto) was not found.\"\n    exit 1\n  }\n  grep -q 'lto-clang-flags[[:space:]]*:=[[:space:]]*-flto=thin$' Makefile || {\n    echo \"[FAIL] Existing 4.19 ThinLTO path was not found; refusing to claim LTO compatibility.\"\n    exit 1\n  }\n  echo \"[PASS] Full-LTO Kconfig interface backported onto the existing 4.19 LTO build machinery.\"\n\n  echo\n  echo \"========== FULL LTO CONFIGURATION ==========\"\n  if ! kconfig_has CONFIG_LTO_CLANG_FULL; then\n    echo \"[FAIL] CONFIG_LTO_CLANG_FULL is still not visible to Kconfig.\"\n    exit 1\n  fi\n  scripts/config --enable CONFIG_LTO_CLANG_FULL\n  scripts/config --enable CONFIG_LTO_CLANG\n  scripts/config --disable CONFIG_LTO_CLANG_THIN 2>/dev/null || true\n  scripts/config --disable CONFIG_LTO_NONE 2>/dev/null || true\n  scripts/config --disable CONFIG_THINLTO 2>/dev/null || true\n  echo \"[REQUIRED] Full Clang LTO requested: CONFIG_LTO_CLANG_FULL=y\"\n\n  # DroidSpaces-OSS legacy 4.19 requirements\n  for sym in \\\n    CONFIG_CGROUPS CONFIG_CGROUP_DEVICE CONFIG_CGROUP_PIDS CONFIG_CGROUP_SCHED \\\n\
        \    CONFIG_FAIR_GROUP_SCHED CONFIG_MEMCG CONFIG_SECCOMP CONFIG_SECCOMP_FILTER \\\n    CONFIG_VETH CONFIG_BRIDGE CONFIG_BRIDGE_NETFILTER; do\n    enable_if_present \"$sym\"\n  done\n\n  make ARCH=arm64 LLVM=1 LLVM_IAS=1 \\\n    CROSS_COMPILE=\"$CROSS_COMPILE\" \\\n    CROSS_COMPILE_ARM32=\"$CROSS_COMPILE_ARM32\" \\\n    olddefconfig || exit $?\n\n  echo \"========== FULL LTO FINAL / BUILD-PATH VERIFICATION ==========\"\n  grep -qx 'CONFIG_LTO=y' .config || { echo \"[FAIL] CONFIG_LTO=y missing after olddefconfig.\"; exit 1; }\n  grep -qx 'CONFIG_LTO_CLANG=y' .config || { echo \"[FAIL] CONFIG_LTO_CLANG=y missing after olddefconfig.\"; exit 1; }\n  grep -qx 'CONFIG_LTO_CLANG_FULL=y' .config || { echo \"[FAIL] CONFIG_LTO_CLANG_FULL=y missing after olddefconfig.\"; exit 1; }\n  if grep -qx 'CONFIG_THINLTO=y' .config || grep -qx 'CONFIG_LTO_CLANG_THIN=y' .config; then\n    echo \"[FAIL] ThinLTO is enabled; Full LTO must be exclusive.\"\n    exit 1\n  fi\n  grep -q 'lto-clang-flags[[:space:]]*:=[[:space:]]*-flto$' Makefile || {\n    echo \"[FAIL] Makefile does not contain the full-LTO -flto path.\"\n    exit 1\n  }\n  # Dry-run one ordinary kernel object and verify kbuild actually emits -flto,\n  # not -flto=thin. This is a build-path test, not merely a .config text check.\n  LTO_DRYRUN=\"$RUNNER_TEMP/full-lto-dryrun.log\"\n  if ! make -n ARCH=arm64 LLVM=1 LLVM_IAS=1 \\\n      CROSS_COMPILE=\"$CROSS_COMPILE\" \\\n      CROSS_COMPILE_ARM32=\"$CROSS_COMPILE_ARM32\" \\\n      init/main.o >\"$LTO_DRYRUN\" 2>&1; then\n    echo \"[FAIL] Full-LTO kbuild dry-run failed.\"\n    tail -n 80 \"$LTO_DRYRUN\" || true\n    exit 1\n  fi\n  grep -Eq -- '(^|[[:space:]])-flto([[:space:]]|$)' \"$LTO_DRYRUN\" || {\n    echo \"[FAIL] kbuild dry-run did not emit -flto for Full LTO.\"\n    tail -n 80 \"$LTO_DRYRUN\" || true\n    exit 1\n  }\n  if grep -Eq -- '(^|[[:space:]])-flto=thin([[:space:]]|$)' \"$LTO_DRYRUN\"; then\n    echo \"[FAIL] kbuild dry-run emitted -flto=thin; ThinLTO is not\
        \ allowed.\"\n    exit 1\n  fi\n  echo \"[PASS] CONFIG_LTO_CLANG_FULL=y + CONFIG_LTO_CLANG=y + CONFIG_LTO=y; ThinLTO disabled; kbuild emits full -flto.\"\n\n  echo \"========== STRICT REQUESTED FEATURE GATE ==========\"\n  require_config() {\n    sym=\"$1\"\n    if ! grep -q \"^${sym}=y$\" .config; then\n      echo \"[FAIL] Required feature ${sym}=y is not present in final .config.\"\n      exit 1\n    fi\n    echo \"[PASS] ${sym}=y\"\n  }\n  for req in \\\n    CONFIG_KPROBES CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_KPM CONFIG_BBG \\\n    CONFIG_LTO CONFIG_LTO_CLANG CONFIG_LTO_CLANG_FULL \\\n    CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_CRYPTO_LZ4 \\\n    CONFIG_TCP_CONG_BBR CONFIG_WIREGUARD CONFIG_NET_SCH_CAKE CONFIG_NET_SCH_FQ_CODEL \\\n    CONFIG_RMNET CONFIG_RMNET_IPA CONFIG_RMNET_MAP CONFIG_QRTR \\\n    CONFIG_MSM_QMI_INTERFACE CONFIG_QCOM_QMI_HELPERS \\\n    CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_WLAN \\\n    CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_EVENTS \\\n    CONFIG_NETFILTER CONFIG_NETFILTER_ADVANCED CONFIG_NF_CONNTRACK CONFIG_NF_NAT \\\n    CONFIG_IP_SET CONFIG_IP6_NF_NAT \\\n    CONFIG_NFNETLINK CONFIG_NAMESPACES CONFIG_NET_NS CONFIG_USER_NS \\\n    CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS CONFIG_CGROUPS CONFIG_CGROUP_DEVICE \\\n    CONFIG_CGROUP_PIDS CONFIG_CGROUP_SCHED CONFIG_MEMCG CONFIG_SECCOMP CONFIG_SECCOMP_FILTER \\\n    CONFIG_VETH CONFIG_BRIDGE CONFIG_BRIDGE_NETFILTER; do\n    require_config \"$req\"\n  done\n  # WALT/SchedTune are mandatory project features; the source must expose them.\n  require_config CONFIG_SCHED_WALT\n  require_config CONFIG_SCHED_TUNE\n  echo \"[PASS] All explicitly requested config-backed features are enabled.\"\n\n  echo\n  echo \"========== CORE CONFIG ==========\"\n  grep -E '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|KALLSYMS|KALLSYMS_ALL|KPM|EXT4_FS)=' .config || true\n\n  for req in \\\n    CONFIG_KSU=y CONFIG_KPROBES=y CONFIG_KPROBE_EVENTS=y \\\n    CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y CONFIG_KPM=y \\\n\
        \    CONFIG_EXT4_FS=y CONFIG_BBG=y CONFIG_OVERLAY_FS=y; do\n    grep -qx \"$req\" .config || { echo \"[FAIL] Missing required core config: $req\"; exit 1; }\n  done\n\n  if grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' .config; then\n    echo \"[INFO] Source provides CONFIG_KSU_MANUAL_HOOK; it is not required by official v4.2.0.\"\n  else\n    echo \"[PASS] No fake/unsupported CONFIG_KSU_MANUAL_HOOK requirement.\"\n\n  echo\n  echo \"========== BASEBAND-GUARD FINAL CONFIG ==========\"\n  grep -qx 'CONFIG_BBG=y' .config || { echo \"[FAIL] CONFIG_BBG=y missing after olddefconfig.\"; exit 1; }\n  LSM_FINAL=\"$(config_string CONFIG_LSM)\"\n  case \",$LSM_FINAL,\" in\n    *,baseband_guard,*) echo \"[PASS] CONFIG_LSM contains baseband_guard.\" ;;\n    *) echo \"[FAIL] CONFIG_LSM does not contain baseband_guard.\"; exit 1 ;;\n  esac\n  fi\n\n  if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' .config; then\n    echo \"[FAIL] Tracepoint hook unexpectedly enabled.\"\n    exit 1\n  fi\n\n  echo\n  echo \"========== FEATURE CAPABILITY SNAPSHOT ==========\"\n  grep -E '^CONFIG_(BPF|BPF_SYSCALL|NETFILTER|IP_SET|RMNET|RMNET_IPA|RMNET_MAP|QRTR|MSM_QMI_INTERFACE|QCOM_QMI_HELPERS|CFG80211|MAC80211|WLAN|WIREGUARD|TCP_CONG_BBR|NET_SCH_CAKE|NET_SCH_FQ_CODEL|NET_SCH_FQ|ZRAM|ZSMALLOC|CRYPTO_LZ4|CRYPTO_LZ4HC|CRYPTO_LZ4K|CRYPTO_LZ4KD|LTO_CLANG|LTO_CLANG_THIN|SCHED_WALT|SCHED_TUNE|NAMESPACES|CGROUPS|SECCOMP|SECCOMP_FILTER)=' .config || true\n\n  echo\n  echo \"========== REQUESTED FEATURE STATUS ==========\"\n  echo \"VFS + KPM: KPM=y + VFS/OverlayFS source capability\"\n  echo \"SukiSU-Ultra: official v4.2.0\"\n  echo \"SUSFS: $SUSFS_VERSION @ $SUSFS_COMMIT\"\n  echo \"Baseband-Guard: ENABLED from official v1.1 @ $BASEBAND_GUARD_COMMIT; CONFIG_BBG=y with baseband_guard in CONFIG_LSM\"\n  echo \"BBRv1: real CONFIG_TCP_CONG_BBR where source supports it\"\n  echo \"BBRv3: real source/backport only; no fake symbol\"\n  echo \"LZ4K/LZ4KD: enabled only when actual source Kconfig exists\"\n  echo \"DroidSpaces:\
        \ legacy 4.19 requirements audited\"\n  echo \"Android 16/17 QPR2/GSI: static capability validation\"\n  echo \"[PASS] Core configuration completed.\"\n} > \"$LOG\" 2>&1\nSTATUS=$?\ntail -300 \"$LOG\" || true\nexit \"$STATUS\"\n"
    - name: 03A - Integrate Maphide / JIT-Zygote Latest Verified Patch
      shell: bash
      run: "set -euo pipefail\nLOG=\"$GITHUB_WORKSPACE/ci-logs/03A-maphide.log\"\nmkdir -p \"$GITHUB_WORKSPACE/ci-logs\"\n{\n  echo \"========== MAPHIDE / JIT-ZYGOTE ==========\"\n  echo \"Patch: $MAPHIDE_PATCH_PATH\"\n  echo \"Repository: $MAPHIDE_PATCH_REPO\"\n  echo \"Variant: $MAPHIDE_VARIANT\"\n  echo \"Source commits: $MAPHIDE_SOURCE_COMMITS\"\n  rm -f \"$RUNNER_TEMP/69_hide_stuff.patch\"\n  curl -fL --retry 5 --retry-all-errors \\\n    \"$MAPHIDE_PATCH_URL\" -o \"$RUNNER_TEMP/69_hide_stuff.patch\"\n  test -s \"$RUNNER_TEMP/69_hide_stuff.patch\"\n\n  grep -q 'jit-zygote-cache' \"$RUNNER_TEMP/69_hide_stuff.patch\"\n  grep -q 'framework-res.apk' \"$RUNNER_TEMP/69_hide_stuff.patch\"\n  grep -q 'fs/proc/task_mmu.c' \"$RUNNER_TEMP/69_hide_stuff.patch\"\n  grep -q 'fs/proc/base.c' \"$RUNNER_TEMP/69_hide_stuff.patch\"\n\n  echo \"[INFO] Applying with 3-way first.\"\n  if ! git apply --3way --whitespace=fix \"$RUNNER_TEMP/69_hide_stuff.patch\"; then\n    echo \"[WARN] 3-way apply failed; retrying with standard patch application.\"\n    git reset --hard HEAD\n    git clean -fd\n    if ! git apply --whitespace=fix \"$RUNNER_TEMP/69_hide_stuff.patch\"; then\n      echo \"[FAIL] Maphide patch does not apply cleanly to this kernel tree.\"\n      echo \"[INFO] This is a source-compatibility error; no partial Maphide state is accepted.\"\n      git status --short || true\n      find . -name '*.rej' -o -name '*.orig' | sort || true\n      exit 1\n    fi\n  fi\n\n  grep -q 'show_vma_header_prefix_fake' fs/proc/task_mmu.c || {\n    echo \"[FAIL] Maphide task_mmu implementation marker missing after apply.\"\n    exit 1\n  }\n  grep -q 'jit-zygote-cache' fs/proc/task_mmu.c || {\n    echo \"[FAIL] JIT-Zygote hiding marker missing after apply.\"\n    exit 1\n  }\n  grep -q 'framework-res.apk' fs/proc/task_mmu.c || {\n    echo \"[FAIL] Lineage mapping marker missing after apply.\"\n    exit 1\n  }\n  echo \"[PASS] Maphide/JIT-Zygote patch applied and verified.\"\n} > \"$LOG\" 2>&1\ncat\
        \ \"$LOG\"\n"
    - name: 11 - Core Integration Verification
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/11-core-integration-verification.log\"\n: > \"$LOG\"\n{\n  echo \"========== KERNELSU / SUKISU SOURCE CHECK ==========\"\n  test -d KernelSU\n  test -f KernelSU/kernel/Kconfig\n  test -f KernelSU/kernel/Makefile\n  echo \"SukiSU HEAD: $(git -C KernelSU rev-parse HEAD)\"\n  echo \"SukiSU describe: $(git -C KernelSU describe --tags --always 2>/dev/null || true)\"\n  echo\n  echo \"========== NO EXTERNAL ROOT-HIDING KERNEL PATCHSET ==========\"\n  if grep -RniE 'susfs\\.h|sus_su\\.h' KernelSU/kernel fs include 2>/dev/null | head -50 | grep -q .; then\n    echo \"[FAIL] External root-hiding kernel integration detected.\"\n    exit 1\n  fi\n  echo \"[PASS] No external root-hiding kernel patchset detected.\"\n  echo\n  echo \"Git diff summary:\"\n  git diff --stat || true\n} > \"$LOG\" 2>&1\nSTATUS=$?\ntail -180 \"$LOG\" || true\nexit \"$STATUS\"\n"
    - name: 10A - KPM Compatibility Preflight (v4.2.0 Kbuild)
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/10A-kpm-preflight.log\"\n: > \"$LOG\"\n{\n  echo \"========== SUKISU v4.2.0 KPM PREFLIGHT ==========\"\n  test -d KernelSU/kernel/kpm\n  test -f KernelSU/kernel/Kbuild\n  echo \"[PASS] KPM source tree present.\"\n  echo \"[INFO] v4.2.0 KPM has no standalone kpm/Makefile; its objects are declared by kernel/Kbuild.\"\n  grep -nE '^obj-\\$\\(CONFIG_KPM\\).*kpm/(compact|kpm|super_access)\\.o' KernelSU/kernel/Kbuild\n\n  export PATH=\"$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH\"\n  export CROSS_COMPILE=\"$GCC64_DIR/bin/aarch64-linux-android-\"\n  export CROSS_COMPILE_ARM32=\"$GCC32_DIR/bin/arm-linux-androideabi-\"\n\n  # Compile the actual integrated drivers/kernelsu subtree. This is the\n  # correct v4.2.0 Kbuild path and includes the KPM objects.\n  make ARCH=arm64 LLVM=1 LLVM_IAS=1               CROSS_COMPILE=\"$CROSS_COMPILE\"               CROSS_COMPILE_ARM32=\"$CROSS_COMPILE_ARM32\"               M=drivers/kernelsu V=1\n\n  echo \"[PASS] SukiSU v4.2.0 + KPM subtree preflight compiled.\"\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 10C - Final Source Integrity Audit
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/10C-source-integrity.log\"\n: > \"$LOG\"\n{\n  git ls-files -z | sort -z > \"$RUNNER_TEMP/tracked-final\"\n  if ! cmp -s \"$RUNNER_TEMP/tracked-before\" \"$RUNNER_TEMP/tracked-final\"; then\n    echo \"[FAIL] Existing tracked stock files were removed.\"\n    diff -u <(tr '\\0' '\\n' < \"$RUNNER_TEMP/tracked-before\") <(tr '\\0' '\\n' < \"$RUNNER_TEMP/tracked-final\") || true\n    exit 1\n  fi\n  if find . -type f \\( -name '*.rej' -o -name '*.orig' \\) -print -quit | grep -q .; then\n    echo \"[FAIL] Reject/original files remain.\"\n    exit 1\n  fi\n  git diff --check\n  echo \"[PASS] No pre-existing tracked stock source was removed.\"\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 10C-A - Verify Required Maphide + Baseband-Guard (Do Not Remove)
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/10C-A-required-features.log\"\n: > \"$LOG\"\n{\n  echo \"========== REQUIRED FEATURES ==========\"\n  test -s \"$RUNNER_TEMP/69_hide_stuff.patch\"\n  grep -q 'jit-zygote-cache' \"$RUNNER_TEMP/69_hide_stuff.patch\"\n  grep -q 'framework-res.apk' \"$RUNNER_TEMP/69_hide_stuff.patch\"\n  grep -q 'fs/proc/task_mmu.c' \"$RUNNER_TEMP/69_hide_stuff.patch\"\n  grep -q 'show_vma_header_prefix_fake' fs/proc/task_mmu.c\n  grep -q 'jit-zygote-cache' fs/proc/task_mmu.c\n  grep -q 'framework-res.apk' fs/proc/task_mmu.c\n  grep -RqsE 'baseband.?guard|CONFIG_BBG' security Baseband-guard\n  grep -q '^CONFIG_BBG=y$' .config\n  echo \"[PASS] Maphide + JIT-Zygote patch is applied and retained.\"\n  echo \"[PASS] Baseband-Guard v1.1 is integrated and retained.\"\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 10D - Verify DTB DTBO Source Inventory
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/10E-dtb-dtbo-inventory.log\"\n: > \"$LOG\"\n{\n  test -d arch/arm64/boot/dts\n  echo \"All existing DT sources:\"\n  find arch/arm64/boot/dts -type f \\( -name '*.dts' -o -name '*.dtsi' \\) -print | sort > \"$RUNNER_TEMP/all-dts.txt\"\n  wc -l \"$RUNNER_TEMP/all-dts.txt\"\n  echo \"Global/Lao candidates:\"\n  grep -Ei 'lao|global|overlay|dtbo' \"$RUNNER_TEMP/all-dts.txt\" | tee \"$RUNNER_TEMP/lao-dt-candidates.txt\" || true\n  echo \"Stock DTB targets from Makefiles:\"\n  grep -RniE 'dtb-|dtbo-|dtbs' arch/arm64/boot/dts/vendor 2>/dev/null | head -200 || true\n  echo \"[PASS] DT source inventory captured; no stock DTS feature is removed or replaced.\"\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 11A - Build and Verify All Existing Global/Lao DTBO Overlays
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/11A-dtbo-build.log\"\n: > \"$LOG\"\n{\n  test -d arch/arm64/boot/dts/vendor/lge\n  src_dir=\"arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com\"\n  test -d \"$src_dir\"\n  mapfile -t dts_files < <(find \"$src_dir\" -maxdepth 1 -type f -name '*.dts' -printf '%f\\n' | sort)\n  test \"${#dts_files[@]}\" -gt 0\n  mkdir -p \"$GITHUB_WORKSPACE/artifacts/dtbo\"\n  : > \"$GITHUB_WORKSPACE/artifacts/dtbo/build-list.txt\"\n  lge_make=\"arch/arm64/boot/dts/vendor/lge/Makefile\"\n  if grep -q '\\$(wildcard echo \\$(srctree)/\\$(src)' \"$lge_make\"; then\n    cp \"$lge_make\" \"$GITHUB_WORKSPACE/artifacts/lge-Makefile.before\"\n    sed -i 's/\\$(wildcard echo \\$(srctree)\\/\\$(src)/\\$(wildcard \\$(srctree)\\/\\$(src)/' \"$lge_make\"\n    cp \"$lge_make\" \"$GITHUB_WORKSPACE/artifacts/lge-Makefile.after\"\n  fi\n  export PATH=\"$CLANG_DIR/bin:$PATH\"\n  for dts in \"${dts_files[@]}\"; do\n    base=\"${dts%.dts}\"\n    target=\"vendor/lge/${base}.dtbo\"\n    echo \"$target\" | tee -a \"$GITHUB_WORKSPACE/artifacts/dtbo/build-list.txt\"\n    make -Oline O=\"$GITHUB_WORKSPACE/out\" ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 \\\n      CC=\"$CLANG_DIR/bin/clang\" HOSTCC=\"$CLANG_DIR/bin/clang\" \\\n      LD=\"$CLANG_DIR/bin/ld.lld\" HOSTLD=\"$CLANG_DIR/bin/ld.lld\" \\\n      AR=\"$CLANG_DIR/bin/llvm-ar\" NM=\"$CLANG_DIR/bin/llvm-nm\" \"$target\"\n    produced=\"$GITHUB_WORKSPACE/out/arch/arm64/boot/dts/vendor/lge/${base}.dtbo\"\n    test -s \"$produced\"\n    cp \"$produced\" \"$GITHUB_WORKSPACE/artifacts/dtbo/${base}.dtbo\"\n    sha256sum \"$produced\" > \"$GITHUB_WORKSPACE/artifacts/dtbo/${base}.dtbo.sha256\"\n  done\n  rev=\"lito-caymanlm_lao_com-rev-1.0_overlay.dtbo\"\n  test -s \"$GITHUB_WORKSPACE/artifacts/dtbo/$rev\"\n  \"$GITHUB_WORKSPACE/out/scripts/dtc/dtc\" -I dtb -O dts -o \"$GITHUB_WORKSPACE/artifacts/dtbo/overlay.dts\" \"$GITHUB_WORKSPACE/artifacts/dtbo/$rev\"\n  grep -q 'LG Electronics, Caymanlm, HW Rev 1.0'\
        \ \"$GITHUB_WORKSPACE/artifacts/dtbo/overlay.dts\"\n  grep -q 'qcom,board-id' \"$GITHUB_WORKSPACE/artifacts/dtbo/overlay.dts\"\n  ! grep -q '0x010C0008' \"$GITHUB_WORKSPACE/artifacts/dtbo/overlay.dts\"\n  echo \"[PASS] All existing Global/Lao DTBO sources compiled; Rev 1.0 identity verified.\"\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 11B - Stable Feature Matrix Audit (Android 16/17 QPR2 + G900EMW + CIP135)
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/11B-feature-matrix.log\"\n: > \"$LOG\"\n{\n  echo \"========== LM-G900 / G900EMW FULL FEATURE MATRIX ==========\"\n  echo \"Kernel: 4.19.325-cip135 (official CIP135 delta applied)\"\n  echo \"Target: Android 16/17 QPR2/GSI\"\n\n  echo\n  echo \"========== ROOT / KPM / VFS ==========\"\n  grep -E '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|KALLSYMS|KALLSYMS_ALL|KPM|EXT4_FS|OVERLAY_FS)=' .config || true\n  for req in CONFIG_KSU=y CONFIG_KPROBES=y CONFIG_KPROBE_EVENTS=y CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y CONFIG_KPM=y CONFIG_EXT4_FS=y CONFIG_OVERLAY_FS=y; do\n    grep -qx \"$req\" .config || { echo \"[FAIL] Missing $req\"; exit 1; }\n  done\n\n  echo\n  echo \"========== FULL CLANG LTO ==========\"\n  for req in CONFIG_LTO=y CONFIG_LTO_CLANG=y CONFIG_LTO_CLANG_FULL=y; do\n    grep -qx \"$req\" .config || { echo \"[FAIL] Missing $req\"; exit 1; }\n  done\n  if grep -qx 'CONFIG_LTO_CLANG_THIN=y' .config || grep -qx 'CONFIG_LTO_NONE=y' .config; then\n    echo \"[FAIL] ThinLTO/LTO_NONE is still enabled; Full LTO must be exclusive.\"\n    exit 1\n  fi\n  echo \"[PASS] Full Clang LTO is selected exclusively.\"\n\n  echo\n  echo \"========== LZ4K / LZ4KD ==========\"\n  grep -E '^CONFIG_(CRYPTO_LZ4|CRYPTO_LZ4HC|CRYPTO_LZ4K|CRYPTO_LZ4KD|CRYPTO_LZ4K_OPLUS|ZRAM|ZSMALLOC)=' .config || true\n  echo \"Only source-defined LZ4K/LZ4KD symbols are enabled.\"\n\n  echo\n  echo \"========== REQUIRED SECURITY FEATURES ==========\"\n  grep -RqsE 'MAPHIDE|maphide|69_hide_stuff|jit-zygote-cache' fs/proc || {\n    echo \"[FAIL] Maphide/JIT-Zygote source marker missing.\"; exit 1;\n  }\n  grep -RqsE 'baseband.?guard|CONFIG_BBG' security Baseband-guard || {\n    echo \"[FAIL] Baseband-Guard source marker missing.\"; exit 1;\n  }\n  grep -q '^CONFIG_BBG=y$' .config || { echo \"[FAIL] CONFIG_BBG=y missing.\"; exit 1; }\n  echo \"[PASS] Required Maphide/JIT-Zygote + Baseband-Guard markers are present.\"\n\n  echo\n  echo \"========== DUAL SIM /\
        \ RIL / IMS / VoLTE / VoWiFi ==========\"\n  grep -E '^CONFIG_(RMNET|RMNET_IPA|RMNET_MAP|QRTR|MSM_QMI_INTERFACE|QCOM_QMI_HELPERS|NETFILTER|NF_CONNTRACK|NF_NAT|IP_SET|IP6_NF_NAT)=' .config || true\n  echo \"Actual IMS/VoLTE/VoWiFi also depends on LG modem firmware, vendor RIL/IMS HAL and DT.\"\n\n  echo\n  echo \"========== WLAN / NETWORK / TRAFFIC MONITORING ==========\"\n  grep -E '^CONFIG_(CFG80211|MAC80211|WLAN|WIREGUARD|BPF|BPF_SYSCALL|BPF_EVENTS|NETFILTER|NETFILTER_XT_MATCH_OWNER|NETFILTER_XT_MATCH_CONNTRACK|NETFILTER_XT_TARGET_MARK|NETFILTER_XT_TARGET_MASQUERADE)=' .config || true\n\n  echo\n  echo \"========== TCP / QOS ==========\"\n  grep -E '^CONFIG_(TCP_CONG_BBR|TCP_CONG_CUBIC|NET_SCH_CAKE|NET_SCH_FQ_CODEL|NET_SCH_FQ)=' .config || true\n  if grep -Rqs 'bbr3' net/ipv4 2>/dev/null; then\n    echo \"[PASS] BBRv3 source implementation detected.\"\n  else\n    echo \"[INFO] No BBRv3 implementation in stock 4.19 source; real BBRv1 remains.\"\n  fi\n\n  echo\n  echo \"========== DROIDSPACES-OSS ==========\"\n  grep -E '^CONFIG_(NAMESPACES|PID_NS|UTS_NS|IPC_NS|NET_NS|USER_NS|CGROUPS|CGROUP_DEVICE|CGROUP_PIDS|CGROUP_SCHED|MEMCG|SECCOMP|SECCOMP_FILTER|VETH|BRIDGE|BRIDGE_NETFILTER)=' .config || true\n  echo \"[PASS] DroidSpaces legacy-kernel capability audit completed.\"\n\n  echo\n  echo \"========== ANDROID 16/17 QPR2/GSI ==========\"\n  grep -E '^CONFIG_(ANDROID_BINDERFS|TMPFS_XATTR|TMPFS_POSIX_ACL|DEVTMPFS|OVERLAY_FS|FUSE_FS|FS_ENCRYPTION|FS_VERITY)=' .config || true\n  echo \"Runtime GSI boot validation requires final kernel + matching vendor/DT/DTBO.\"\n\n  echo\n  echo \"========== HARDWARE PATHS ==========\"\n  for p in drivers/input drivers/input/touchscreen drivers/vibrator drivers/haptics drivers/soc/qcom drivers/net drivers/net/wireless sound techpack/audio techpack/voice techpack/data; do\n    [ -d \"$p\" ] && echo \"[PRESENT] $p\"\n  done\n\n  echo\n  echo \"========== DTB / DTBO ==========\"\n  [ -d arch/arm64/boot/dts ] && echo \"[PASS] arm64 DT\
        \ sources present\"\n\n  echo\n  echo \"========== SUSFS ==========\"\n  grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU fs include/linux || { echo \"[FAIL] SUSFS integration missing.\"; exit 1; }\n  grep -Rqs 'susfs' fs include/linux KernelSU/kernel || { echo \"[FAIL] SUSFS source missing.\"; exit 1; }\n  echo \"SUSFS: $SUSFS_VERSION @ $SUSFS_COMMIT\"\n  echo \"[PASS] SUSFS non-GKI 4.19 integration is present.\"\n  echo \"Feature policy: previously accepted features are never removed; errors are fixed in-place only.\"\n  echo \"Version policy: latest stable release/commit actually compatible with 4.19.325-cip135.\"\n\n  echo\n  echo \"========== VERIFIED VERSION MANIFEST ==========\"\n  echo \"SukiSU-Ultra: v4.2.0 | current verified release | 2026\"\n  echo \"Baseband-Guard: v1.1 | current verified release | 2025\"\n  echo \"CIP: v4.19.325-cip135 | current 4.19 CIP target | 2026\"\n  echo \"DroidSpaces: legacy 4.19 capability requirements (no kernel version claim)\"\n  echo \"Kernel base: Linux 4.19 | first released | 2018\"\n  echo \"Policy: latest stable release/commit actually compatible with this 4.19.325-cip135 tree\"\n  echo \"Policy: previously accepted features are never removed; errors are fixed in-place only.\"\n  echo \"Policy: source-absent features fail the strict feature gate; no feature is falsely labeled implemented.\"\n\n  echo \"[PASS] Full feature matrix audit completed.\"\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 11C - 4.19 Clean Compiler Preflight
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/11C-compiler-preflight.log\"\n: > \"$LOG\"\n{\n  echo \"========== CLEAN CONFIG PREFLIGHT ==========\"\n  \"$CLANG\" --version | head -5\n  make ARCH=arm64 LLVM=1 LLVM_IAS=1               CROSS_COMPILE=\"$CROSS_COMPILE\"               CROSS_COMPILE_ARM32=\"$CROSS_COMPILE_ARM32\"               olddefconfig\n  echo \"[PASS] 4.19 config regenerated before compilation.\"\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 19 - Build Kernel (Full Log to Artifact)
      shell: bash
      run: "set +e\nFULL_LOG=\"$GITHUB_WORKSPACE/kernel-build-full.log\"\nERROR_LOG=\"$DIAG_DIR/12-build-errors.log\"\nTAIL_LOG=\"$DIAG_DIR/12-build-tail.log\"\nSUMMARY_LOG=\"$DIAG_DIR/12-build-summary.log\"\n\n: > \"$FULL_LOG\"\n: > \"$ERROR_LOG\"\n: > \"$TAIL_LOG\"\n: > \"$SUMMARY_LOG\"\n\nexport PATH=\"$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH\"\nexport CROSS_COMPILE=\"$GCC64_DIR/bin/aarch64-linux-android-\"\nexport CROSS_COMPILE_ARM32=\"$GCC32_DIR/bin/arm-linux-androideabi-\"\n\n# Build-only compatibility fixes are scoped to the exact stock\n# source directories/files that failed with this Clang 20 build.\n# No global KCFLAGS and no unrelated kernel features are added.\n#\n# Qualcomm clock trace.h uses TRACE_INCLUDE_PATH \".\"; the include\n# path is scoped to drivers/clk/qcom via Kbuild ccflags-y.\n# Camera cam_trace.h needs the cam_req_mgr local header path.\n# fault-inject.c and lgenfc.c receive source-level compatibility\n# corrections for this kernel/compiler combination.\n# ------------------------------------------------------------\n# 1) Qualcomm clock trace include path\n# ------------------------------------------------------------\nQCOM_MAKE=\"drivers/clk/qcom/Makefile\"\ntest -f \"$QCOM_MAKE\"\n\nif ! grep -qF 'ccflags-y += -I$(src)' \"$QCOM_MAKE\"; then\n  {\n    echo\n    echo \"# Build compatibility: local TRACE_INCLUDE_PATH for qcom trace.h\"\n    echo 'ccflags-y += -I$(src)'\n  } >> \"$QCOM_MAKE\"\nfi\n\necho \"[PASS] Qualcomm trace include path scoped to drivers/clk/qcom.\"\ngrep -nF 'ccflags-y += -I$(src)' \"$QCOM_MAKE\"\n\n# ------------------------------------------------------------\n# 2) Camera cam_req_mgr local include path\n#    cam_trace.h includes cam_req_mgr_core.h by name.\n#    The header is part of the stock source tree; only the\n#    local Kbuild include path is missing for this Clang build.\n# ------------------------------------------------------------\nCAM_MAKE=\"techpack/camera/drivers/cam_req_mgr/Makefile\"\ntest -f \"\
        $CAM_MAKE\"\n\nif ! grep -qF 'ccflags-y += -I$(src)' \"$CAM_MAKE\"; then\n  {\n    echo\n    echo \"# Build compatibility: cam_trace.h local cam_req_mgr headers\"\n    echo 'ccflags-y += -I$(src)'\n  } >> \"$CAM_MAKE\"\nfi\n\necho \"[PASS] Camera cam_req_mgr include path scoped to cam_req_mgr.\"\ngrep -nF 'ccflags-y += -I$(src)' \"$CAM_MAKE\"\n\n# ------------------------------------------------------------\n# 3) Camera cam_cci local include path\n#    cam_sensor_i2c.h includes cam_cci_dev.h by name.\n#    The header is part of the stock source tree; only the\n#    cam_cci directory needs to be added to its local search\n#    path for this Clang build.\n# ------------------------------------------------------------\nCCI_MAKE=\"techpack/camera/drivers/cam_sensor_module/cam_cci/Makefile\"\ntest -f \"$CCI_MAKE\"\n\nif ! grep -qF 'ccflags-y += -I$(src)' \"$CCI_MAKE\"; then\n  {\n    echo\n    echo \"# Build compatibility: local cam_cci headers\"\n    echo 'ccflags-y += -I$(src)'\n  } >> \"$CCI_MAKE\"\nfi\n\necho \"[PASS] Camera cam_cci include path scoped to cam_cci.\"\ngrep -nF 'ccflags-y += -I$(src)' \"$CCI_MAKE\"\n\n# ------------------------------------------------------------\n# 4) Camera cam_actuator local include path\n#    lgit_onsemi_actuator_utils.c includes cam_actuator_core.h\n#    by name. The header is already in the stock tree.\n# ------------------------------------------------------------\nACT_MAKE=\"techpack/camera/drivers/cam_sensor_module/cam_actuator/Makefile\"\ntest -f \"$ACT_MAKE\"\n\nif ! grep -qF 'ccflags-y += -I$(src)' \"$ACT_MAKE\"; then\n  {\n    echo\n    echo \"# Build compatibility: local cam_actuator headers\"\n    echo 'ccflags-y += -I$(src)'\n  } >> \"$ACT_MAKE\"\nfi\n\necho \"[PASS] Camera cam_actuator include path scoped to cam_actuator.\"\ngrep -nF 'ccflags-y += -I$(src)' \"$ACT_MAKE\"\n\n# ------------------------------------------------------------\n# 5) Camera cam_ois nested LGIT/Onsemi include path\n#\n# The current build log\
        \ reaches:\n#   lgit_s5kgw1_onsemi_ois.c:10:10:\n#   fatal error: 'cam_ois_core.h' file not found\n#\n# The source file is under cam_ois/lgit_onsemi/, while the\n# stock cam_ois_core.h belongs to the parent cam_ois directory.\n# Kbuild does not automatically search that parent directory\n# for a quoted header from the nested subdirectory.\n#\n# Add ONLY the parent cam_ois directory to the nested\n# lgit_onsemi Kbuild include path. No header is downloaded,\n# copied, replaced, or generated.\n# ------------------------------------------------------------\nOIS_DIR=\"techpack/camera/drivers/cam_sensor_module/cam_ois\"\nOIS_SUBDIR=\"$OIS_DIR/lgit_onsemi\"\nOIS_PARENT_MAKE=\"$OIS_DIR/Makefile\"\nOIS_HEADER=\"$OIS_DIR/cam_ois_core.h\"\n\ntest -d \"$OIS_DIR\"\ntest -d \"$OIS_SUBDIR\"\ntest -f \"$OIS_PARENT_MAKE\"\ntest -f \"$OIS_HEADER\"\n\n# Kbuild's subdir-ccflags-y is intentionally used in the\n# parent cam_ois Kbuild file. Unlike ccflags-y in lgit_onsemi,\n# this applies to cam_ois itself and every nested OIS directory,\n# including trees that use a Kbuild file instead of Makefile.\nif ! grep -qF 'subdir-ccflags-y += -I$(src)' \"$OIS_PARENT_MAKE\"; then\n  {\n    echo\n    echo \"# Build compatibility: stock cam_ois headers for nested OIS drivers\"\n    echo 'subdir-ccflags-y += -I$(src)'\n  } >> \"$OIS_PARENT_MAKE\"\nfi\n\necho \"[PASS] Stock cam_ois_core.h exists:\"\nls -lh \"$OIS_HEADER\"\necho \"[PASS] cam_ois parent include path propagated to nested OIS:\"\ngrep -nF 'subdir-ccflags-y += -I$(src)' \"$OIS_PARENT_MAKE\"\n\n# ------------------------------------------------------------\n# 6) Stock LG display nested-header include path\n#\n# Current build reaches:\n#   techpack/display/msm/lge/cm/lge_color_manager.c:19:10:\n#   fatal error: 'lge_dsi_panel_def.h' file not found\n#\n# The stock header lives in the parent:\n#   techpack/display/msm/lge/lge_dsi_panel_def.h\n#\n# The stock lge/Makefile supplies several display include paths,\n# but not its own directory.\
        \ Propagate ONLY the stock lge\n# directory to its nested display objects.\n#\n# No header is downloaded/copied/replaced and no display feature\n# is enabled or disabled.\n# ------------------------------------------------------------\nLGE_DISPLAY_DIR=\"techpack/display/msm/lge\"\nLGE_DISPLAY_MAKE=\"$LGE_DISPLAY_DIR/Makefile\"\nLGE_DISPLAY_HEADER=\"$LGE_DISPLAY_DIR/lge_dsi_panel_def.h\"\n\ntest -d \"$LGE_DISPLAY_DIR\"\ntest -f \"$LGE_DISPLAY_MAKE\"\ntest -f \"$LGE_DISPLAY_HEADER\"\n\nif ! grep -qF 'subdir-ccflags-y += -I$(src)' \"$LGE_DISPLAY_MAKE\"; then\n  {\n    echo\n    echo \"# Build compatibility: stock LG display parent headers for nested objects\"\n    echo 'subdir-ccflags-y += -I$(src)'\n  } >> \"$LGE_DISPLAY_MAKE\"\nfi\n\necho \"[PASS] Stock LG display header exists:\"\nls -lh \"$LGE_DISPLAY_HEADER\"\necho \"[PASS] LG display parent include path propagated to nested objects:\"\ngrep -nF 'subdir-ccflags-y += -I$(src)' \"$LGE_DISPLAY_MAKE\"\n\n# ------------------------------------------------------------\n# 6) Stock display PLL trace-header include path\n#\n# Current build log reaches:\n#   techpack/display/pll/dsi_pll_10nm.c\n#   -> techpack/display/pll/pll_trace.h\n#   -> include/trace/define_trace.h\n#   -> fatal error: './pll_trace.h' file not found\n#\n# The trace header is in the same stock directory:\n#   techpack/display/pll/pll_trace.h\n#\n# define_trace.h expands TRACE_INCLUDE_PATH relative to the\n# compiler include search path. Add ONLY the stock PLL directory\n# to its own nested build. Do not copy/download another header.\n# ------------------------------------------------------------\nPLL_DIR=\"techpack/display/pll\"\nPLL_MAKE=\"$PLL_DIR/Makefile\"\nPLL_HEADER=\"$PLL_DIR/pll_trace.h\"\n\ntest -d \"$PLL_DIR\"\ntest -f \"$PLL_MAKE\"\ntest -f \"$PLL_HEADER\"\n\nif ! grep -qF 'subdir-ccflags-y += -I$(src)' \"$PLL_MAKE\"; then\n  {\n    echo\n    echo \"# Build compatibility: stock PLL trace header for nested display PLL objects\"\n    echo\
        \ 'subdir-ccflags-y += -I$(src)'\n  } >> \"$PLL_MAKE\"\nfi\n\necho \"[PASS] Stock PLL trace header exists:\"\nls -lh \"$PLL_HEADER\"\necho \"[PASS] PLL parent include path propagated:\"\ngrep -nF 'subdir-ccflags-y += -I$(src)' \"$PLL_MAKE\"\n\n# ------------------------------------------------------------\n# 6) Stock DTS consistency fix: litomagnus MTP WSA references\n#\n# Current build log reaches the stock DTB compiler and fails only\n# because litomagnus-mtp.dtsi references four labels:\n#   wsa881x_0211 .. wsa881x_0214\n#\n# In this stock tree those WSA node definitions are intentionally\n# commented out in lito-audio-overlay.dtsi (WSA speaker amp\n# disabled), so the labels do not exist. The litomagnus overlay\n# still contains four status=\"disabled\" references to those absent\n# labels. dtc treats an unresolved phandle label as a hard error.\n#\n# Do NOT download or add another WSA node definition: doing so would\n# change the stock audio/device-tree behavior. Instead, remove only\n# the four dead references from this overlay. They already request\n# status=\"disabled\" and therefore cannot represent an enabled stock\n# feature. All other stock DTS content remains untouched.\n# ------------------------------------------------------------\n# The build log from the previous run proves the failing DTB is\n# litomagnus-cdp.dtb, not litomagnus-mtp.dtb:\n#   litomagnus-cdp.dtsi:44  Label or path wsa881x_0211 not found\n#   ... through wsa881x_0214\n#\n# The earlier fix handled only the MTP file. Keep that fix, but\n# apply the same narrowly-scoped cleanup to BOTH stock Magnus\n# variants because this kernel builds both DTBs. No new WSA node,\n# header, driver, or feature is added.\nLITOMAGNUS_MTP_DTSI=\"arch/arm64/boot/dts/vendor/qcom/litomagnus-mtp.dtsi\"\nLITOMAGNUS_CDP_DTSI=\"arch/arm64/boot/dts/vendor/qcom/litomagnus-cdp.dtsi\"\ntest -f \"$LITOMAGNUS_MTP_DTSI\"\ntest -f \"$LITOMAGNUS_CDP_DTSI\"\n\npython3 - <<'PY'\nfrom pathlib import Path\nimport re\n\n\
        files = [\n    Path(\"arch/arm64/boot/dts/vendor/qcom/litomagnus-mtp.dtsi\"),\n    Path(\"arch/arm64/boot/dts/vendor/qcom/litomagnus-cdp.dtsi\"),\n]\n\nlabels = [\n    \"wsa881x_0211\",\n    \"wsa881x_0212\",\n    \"wsa881x_0213\",\n    \"wsa881x_0214\",\n]\n\nfor p in files:\n    s = p.read_text()\n    changed = []\n\n    # Remove the COMPLETE disabled override blocks, not just the\n    # unresolved label line. Leaving \"status = disabled;\" and \"};\"\n    # behind creates invalid DTS syntax.\n    for label in labels:\n        pattern = (\n            r'(?m)^&' + re.escape(label) +\n            r'\\s*\\{\\n'\n            r'\\s*status\\s*=\\s*\"disabled\";\\n'\n            r'\\s*\\};\\n?'\n        )\n        s2, count = re.subn(pattern, \"\", s, count=1)\n        if count:\n            changed.append(label)\n            s = s2\n\n    p.write_text(s)\n\n    if changed:\n        print(f\"[FIXED] {p}: removed complete unresolved disabled WSA override blocks:\")\n        for label in changed:\n            print(\"  &\" + label)\n    else:\n        print(f\"[PASS] {p}: no unresolved disabled WSA override blocks needed removal.\")\nPY\n\necho \"[PASS] Verify no dead WSA phandle references remain in either Magnus DTSI:\"\nfor f in \"$LITOMAGNUS_MTP_DTSI\" \"$LITOMAGNUS_CDP_DTSI\"; do\n  if grep -nE '^[[:space:]]*&wsa881x_021[1-4][[:space:]]*$' \"$f\"; then\n    echo \"[FAIL] Unresolved WSA references still present in $f\"\n    exit 1\n  fi\ndone\n\necho \"[PASS] Both litomagnus MTP/CDP DTSI files are free of the four dead WSA references.\"\n\n# ------------------------------------------------------------\n# 7) Stock Lito/Magnus WSA speaker dependency fix\n#\n# Diagnostics (17) shows the previous v5 fix moved too much into\n# common lito-pinctrl.dtsi. That made the unrelated stock\n# lito-rumi.dtb inherit wsa_spkr_en1/en2 and fail because its\n# audio tree does not provide the speaker-enable dependency.\n#\n# Upstream Lito keeps the speaker GPIO states in lito-pinctrl.dtsi,\n\
        # while the wsa_spkr_en1/en2 consumer nodes live in the Lito audio\n# overlay. The Magnus CDP/MTP trees are the targets that reference\n# these existing WSA883x controls.\n#\n# Therefore:\n#   1. Keep ONLY the stock speaker GPIO states in common pinctrl.\n#   2. Restore wsa_spkr_en1/en2 ONLY in the two Magnus target DTSIs.\n#   3. Do not modify lito-rumi, camera, display, or any other DTB.\n#\n# This is a dependency restoration, not a new kernel feature.\n# ------------------------------------------------------------\nLITO_PINCTRL=\"arch/arm64/boot/dts/vendor/qcom/lito-pinctrl.dtsi\"\nLITOMAGNUS_MTP_DTSI=\"arch/arm64/boot/dts/vendor/qcom/litomagnus-mtp.dtsi\"\nLITOMAGNUS_CDP_DTSI=\"arch/arm64/boot/dts/vendor/qcom/litomagnus-cdp.dtsi\"\n\ntest -f \"$LITO_PINCTRL\"\ntest -f \"$LITOMAGNUS_MTP_DTSI\"\ntest -f \"$LITOMAGNUS_CDP_DTSI\"\n\npython3 - <<'PY'\nfrom pathlib import Path\n\npinctrl = Path(\"arch/arm64/boot/dts/vendor/qcom/lito-pinctrl.dtsi\")\nmtp = Path(\"arch/arm64/boot/dts/vendor/qcom/litomagnus-mtp.dtsi\")\ncdp = Path(\"arch/arm64/boot/dts/vendor/qcom/litomagnus-cdp.dtsi\")\n\n# These are the stock Lito WSA speaker reset GPIO states.\n# They belong in the common TLMM pinctrl definition because the\n# speaker-enable nodes consume these labels.\npinctrl_block = r\"\"\"\n&tlmm {\n    /* Stock Lito WSA speaker reset pins */\n    spkr_1_sd_n {\n        spkr_1_sd_n_sleep: spkr_1_sd_n_sleep {\n            mux {\n                pins = \"gpio58\";\n                function = \"gpio\";\n            };\n\n            config {\n                pins = \"gpio58\";\n                drive-strength = <2>;\n                bias-pull-down;\n                input-enable;\n            };\n        };\n\n        spkr_1_sd_n_active: spkr_1_sd_n_active {\n            mux {\n                pins = \"gpio58\";\n                function = \"gpio\";\n            };\n\n            config {\n                pins = \"gpio58\";\n                drive-strength = <16>;\n              \
        \  bias-disable;\n                output-high;\n            };\n        };\n    };\n\n    spkr_2_sd_n {\n        spkr_2_sd_n_sleep: spkr_2_sd_n_sleep {\n            mux {\n                pins = \"gpio65\";\n                function = \"gpio\";\n            };\n\n            config {\n                pins = \"gpio65\";\n                drive-strength = <2>;\n                bias-pull-down;\n                input-enable;\n            };\n        };\n\n        spkr_2_sd_n_active: spkr_2_sd_n_active {\n            mux {\n                pins = \"gpio65\";\n                function = \"gpio\";\n            };\n\n            config {\n                pins = \"gpio65\";\n                drive-strength = <16>;\n                bias-disable;\n                output-high;\n            };\n        };\n    };\n};\n\"\"\"\n\nps = pinctrl.read_text()\nif \"spkr_1_sd_n_active:\" not in ps:\n    ps = ps.rstrip() + \"\\n\\n\" + pinctrl_block.strip() + \"\\n\"\n    pinctrl.write_text(ps)\n    print(\"[FIXED] Restored stock WSA speaker GPIO states in lito-pinctrl.dtsi\")\nelse:\n    print(\"[PASS] WSA speaker GPIO states already exist in lito-pinctrl.dtsi\")\n\n# These two nodes are intentionally scoped to the Magnus target\n# DTSIs. Keeping them out of common lito-pinctrl prevents unrelated\n# targets such as lito-rumi.dtb from acquiring a dangling reference.\nwsa_block = r\"\"\"\n&soc {\n    /* Stock Lito/Magnus WSA speaker controls */\n    wsa_spkr_en1: wsa_spkr_en1_pinctrl {\n        compatible = \"qcom,msm-cdc-pinctrl\";\n        pinctrl-names = \"aud_active\", \"aud_sleep\";\n        pinctrl-0 = <&spkr_1_sd_n_active>;\n        pinctrl-1 = <&spkr_1_sd_n_sleep>;\n    };\n\n    wsa_spkr_en2: wsa_spkr_en2_pinctrl {\n        compatible = \"qcom,msm-cdc-pinctrl\";\n        pinctrl-names = \"aud_active\", \"aud_sleep\";\n        pinctrl-0 = <&spkr_2_sd_n_active>;\n        pinctrl-1 = <&spkr_2_sd_n_sleep>;\n    };\n};\n\"\"\"\n\nfor p in (mtp, cdp):\n    text = p.read_text()\n  \
        \  if \"wsa_spkr_en1:\" not in text:\n        text = text.rstrip() + \"\\n\\n\" + wsa_block.strip() + \"\\n\"\n        p.write_text(text)\n        print(f\"[FIXED] Restored wsa_spkr_en1/en2 in {p.name}\")\n    else:\n        print(f\"[PASS] {p.name} already contains wsa_spkr_en1/en2\")\n\n# Hard guard: the common pinctrl must NOT contain the consumer nodes.\nfinal_pinctrl = pinctrl.read_text()\nif \"wsa_spkr_en1:\" in final_pinctrl or \"wsa_spkr_en2:\" in final_pinctrl:\n    raise SystemExit(\"wsa_spkr_en1/en2 must not be placed in common lito-pinctrl.dtsi\")\n\nfor p in (mtp, cdp):\n    text = p.read_text()\n    for label in (\n        \"wsa_spkr_en1:\",\n        \"wsa_spkr_en2:\",\n        \"spkr_1_sd_n_active\",\n        \"spkr_1_sd_n_sleep\",\n        \"spkr_2_sd_n_active\",\n        \"spkr_2_sd_n_sleep\",\n    ):\n        if label not in text and label.startswith(\"wsa_\"):\n            raise SystemExit(f\"{p}: missing {label}\")\n\nprint(\"[PASS] WSA definitions are now scoped only to Magnus MTP/CDP targets.\")\nPY\n\necho \"[PASS] Verify common pinctrl contains only WSA GPIO states:\"\ngrep -nE 'spkr_1_sd_n_(active|sleep):|spkr_2_sd_n_(active|sleep):' \"$LITO_PINCTRL\"\nif grep -qE 'wsa_spkr_en[12]:' \"$LITO_PINCTRL\"; then\n  echo \"[FAIL] Common lito-pinctrl still contains Magnus-only WSA consumers\"\n  exit 1\nfi\n\necho \"[PASS] Verify Magnus target WSA consumers:\"\ngrep -nE 'wsa_spkr_en[12]:' \"$LITOMAGNUS_MTP_DTSI\" \"$LITOMAGNUS_CDP_DTSI\"\n\n# Never force dtc output. The following check is deliberately scoped\n# to the targets that actually consume these labels.\ngrep -q 'wsa_spkr_en1:' \"$LITOMAGNUS_MTP_DTSI\"\ngrep -q 'wsa_spkr_en2:' \"$LITOMAGNUS_MTP_DTSI\"\ngrep -q 'wsa_spkr_en1:' \"$LITOMAGNUS_CDP_DTSI\"\ngrep -q 'wsa_spkr_en2:' \"$LITOMAGNUS_CDP_DTSI\"\n\necho \"[PASS] Existing Magnus WSA883x phandle dependencies now have scoped stock definitions.\"\n# ------------------------------------------------------------\n# 6) Linux 4.19 fault-inject\
        \ WRITE_ONCE compatibility\n#    Stock 4.19 compiler headers define WRITE_ONCE() as a\n#    statement-style macro. This source used it as an expression:\n#       if (!WRITE_ONCE(current->fail_nth, fail_nth - 1))\n#    Keep the same behavior with an explicit decrement/store/test.\n# ------------------------------------------------------------\nFAULT_SRC=\"lib/fault-inject.c\"\ntest -f \"$FAULT_SRC\"\n\npython3 - <<'PY'\nfrom pathlib import Path\n\np = Path(\"lib/fault-inject.c\")\ns = p.read_text()\n\nold = \"\"\"\\t\\tif (fail_nth) {\\n\\t\\t\\tif (!WRITE_ONCE(current->fail_nth, fail_nth - 1))\\n\\t\\t\\t\\tgoto fail;\\n\\n\\t\\t\\treturn false;\\n\\t\\t}\"\"\"\n\nnew = \"\"\"\\t\\tif (fail_nth) {\\n\\t\\t\\tfail_nth--;\\n\\t\\t\\tWRITE_ONCE(current->fail_nth, fail_nth);\\n\\t\\t\\tif (!fail_nth)\\n\\t\\t\\t\\tgoto fail;\\n\\n\\t\\t\\treturn false;\\n\\t\\t}\"\"\"\n\nif old in s:\n    s = s.replace(old, new, 1)\n    p.write_text(s)\n    print(\"[FIXED] lib/fault-inject.c WRITE_ONCE expression compatibility\")\nelif \"fail_nth--;\" in s and \"WRITE_ONCE(current->fail_nth, fail_nth);\" in s:\n    print(\"[PASS] lib/fault-inject.c already uses statement-compatible form\")\nelse:\n    raise SystemExit(\"Expected fault-inject fail_nth block was not found\")\nPY\n\n# ------------------------------------------------------------\n# 7) LG NFC prototype compatibility\n#    Clang 20 treats -Wstrict-prototypes as an error for this\n#    old-style zero-argument declaration. Make it explicit.\n# ------------------------------------------------------------\nNFC_SRC=\"drivers/nfc/lge/lgenfc.c\"\ntest -f \"$NFC_SRC\"\n\npython3 - <<'PY'\nfrom pathlib import Path\n\np = Path(\"drivers/nfc/lge/lgenfc.c\")\ns = p.read_text()\n\nold = \"enum NfcChip getChipset() {\"\nnew = \"enum NfcChip getChipset(void) {\"\n\nif old in s:\n    s = s.replace(old, new, 1)\n    p.write_text(s)\n    print(\"[FIXED] drivers/nfc/lge/lgenfc.c strict-prototype compatibility\")\nelif \"enum NfcChip getChipset(void)\"\
        \ in s:\n    print(\"[PASS] lgenfc.c prototype already fixed\")\nelse:\n    raise SystemExit(\"Expected getChipset() declaration was not found\")\nPY\n\necho\necho \"[PASS] Scoped source compatibility fixes prepared.\"\n\necho \"==========================================\"\necho \"STARTING STOCK + SUKISU + KPM BUILD\"\necho \"Full V=1 stdout/stderr -> kernel-build-full.log\"\necho \"==========================================\"\necho \"clang=$(command -v clang)\"\necho \"ld.lld=$(command -v ld.lld)\"\nclang --version | sed -n '1,2p'\nld.lld --version | sed -n '1,2p'\n\nSTART=$(date +%s)\n\n# Use the stock kernel's default target first. This is safer for\n# vendor 4.19 trees whose image target may be Image, Image.gz, or\n# Image.gz-dtb depending on the board Kbuild.\nmake \\\n  ARCH=arm64 \\\n  LLVM=1 \\\n  LLVM_IAS=1 \\\n  CROSS_COMPILE=\"$CROSS_COMPILE\" \\\n  CROSS_COMPILE_ARM32=\"$CROSS_COMPILE_ARM32\" \\\n  -j\"$(nproc)\" \\\n  V=1 \\\n  WERROR=0 \\\n  >\"$FULL_LOG\" 2>&1\n\nBUILD_STATUS=$?\n\nif [ \"$BUILD_STATUS\" -eq 0 ]; then\n  echo \"\" >> \"$FULL_LOG\"\n  echo \"===== EXPLICIT DTBS PASS =====\" >> \"$FULL_LOG\"\n  make \\\n    ARCH=arm64 \\\n    LLVM=1 \\\n    LLVM_IAS=1 \\\n    CROSS_COMPILE=\"$CROSS_COMPILE\" \\\n    CROSS_COMPILE_ARM32=\"$CROSS_COMPILE_ARM32\" \\\n    -j\"$(nproc)\" \\\n    V=1 \\\n    WERROR=0 \\\n    dtbs >> \"$FULL_LOG\" 2>&1\n  DTB_STATUS=$?\n  if [ \"$DTB_STATUS\" -ne 0 ]; then\n    BUILD_STATUS=\"$DTB_STATUS\"\n  fi\nfi\n\nEND=$(date +%s)\nELAPSED=$((END-START))\n\n{\n  echo \"BUILD_STATUS=$BUILD_STATUS\"\n  echo \"BUILD_TIME_SECONDS=$ELAPSED\"\n  echo \"BUILD_TIME_HUMAN=$((ELAPSED/60))m $((ELAPSED%60))s\"\n  echo \"BUILD_LOG_BYTES=$(wc -c < \"$FULL_LOG\")\"\n  echo \"BUILD_LOG_LINES=$(wc -l < \"$FULL_LOG\")\"\n} | tee \"$SUMMARY_LOG\"\n\ngrep -nEi \\\n  'fatal error:|error:|undefined reference|undeclared|implicit declaration|invalid|unknown argument|unknown warning|No such file|No rule to make target|recipe for target|Error\
        \ [0-9]+|make\\[[0-9]+\\]: \\*\\*\\*' \\\n  \"$FULL_LOG\" | tail -250 > \"$ERROR_LOG\" || true\n\ntail -300 \"$FULL_LOG\" > \"$TAIL_LOG\" || true\n\necho\necho \"===== COMPACT BUILD ERROR SUMMARY =====\"\nif [ -s \"$ERROR_LOG\" ]; then\n  tail -30 \"$ERROR_LOG\" || true\nelse\n  echo \"No compiler-error pattern found.\"\nfi\n\necho\necho \"===== LAST 40 BUILD LINES =====\"\ntail -40 \"$FULL_LOG\" || true\n\nif [ \"$BUILD_STATUS\" -eq 0 ]; then\n  KERNEL_IMAGE=\"\"\n  for candidate in               arch/arm64/boot/Image.gz-dtb               arch/arm64/boot/Image.gz               arch/arm64/boot/Image; do\n    if [ -s \"$candidate\" ]; then\n      KERNEL_IMAGE=\"$candidate\"\n      break\n    fi\n  done\n  test -n \"$KERNEL_IMAGE\"\n  echo \"KERNEL_IMAGE=$KERNEL_IMAGE\"\n  echo \"KERNEL BUILD SUCCESSFUL\"\n  find arch/arm64/boot/dts -type f \\( -name '*.dtb' -o -name '*.dtbo' \\) -print | sort | head -300 || true\nelse\n  echo \"KERNEL BUILD FAILED - FULL LOG SAVED AS ARTIFACT\"\nfi\n\nexit \"$BUILD_STATUS\"\n"
    - name: 19A - Package Kernel + DTB/DTBO + AnyKernel3 (OrangeFox Flashable)
      if: success()
      shell: bash
      run: "set -euo pipefail\nLOG=\"$DIAG_DIR/19A-packaging.log\"\n: > \"$LOG\"\n{\n  mkdir -p artifacts/kernel artifacts/dtb artifacts/dtbo\n\n  KERNEL_IMAGE=\"\"\n  for candidate in \\\n    arch/arm64/boot/Image.gz-dtb \\\n    arch/arm64/boot/Image.gz \\\n    arch/arm64/boot/Image; do\n    if [ -s \"$candidate\" ]; then\n      KERNEL_IMAGE=\"$candidate\"\n      break\n    fi\n  done\n  test -n \"$KERNEL_IMAGE\"\n\n  cp -f \"$KERNEL_IMAGE\" artifacts/kernel/\n  sha256sum \"$KERNEL_IMAGE\" > artifacts/kernel/kernel.sha256\n\n  find arch/arm64/boot/dts -type f -name '*.dtb' -print0 2>/dev/null |\n    while IFS= read -r -d '' f; do cp -f \"$f\" artifacts/dtb/; done\n  find arch/arm64/boot/dts -type f -name '*.dtbo' -print0 2>/dev/null |\n    while IFS= read -r -d '' f; do cp -f \"$f\" artifacts/dtbo/; done\n\n  # Build a standard AnyKernel3 package that OrangeFox can flash.\n  rm -rf \"$RUNNER_TEMP/AnyKernel3\"\n  git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git \"$RUNNER_TEMP/AnyKernel3\"\n\n  cp -f \"$KERNEL_IMAGE\" \"$RUNNER_TEMP/AnyKernel3/Image.gz-dtb\"\n\n  python3 -c '\n  from pathlib import Path\n  import os\n  import re\n  p = Path(os.environ[\"RUNNER_TEMP\"]) / \"AnyKernel3\" / \"anykernel.sh\"\n  s = p.read_text()\n  s = re.sub(r\"(?m)^kernel\\\\.string=.*$\", \"kernel.string=LM-G900 SukiSU-Ultra 4.2.0 V32.1\", s)\n  s = re.sub(r\"(?m)^do\\\\.devicecheck=.*$\", \"do.devicecheck=1\", s)\n  s = re.sub(r\"(?m)^device\\\\.name1=.*$\", \"device.name1=caymanlm\", s)\n  s = re.sub(r\"(?m)^device\\\\.name2=.*$\", \"device.name2=G900EMW\", s)\n  s = re.sub(r\"(?m)^device\\\\.name3=.*$\", \"device.name3=LM-G900\", s)\n  s = re.sub(r\"(?m)^device\\\\.name4=.*$\", \"device.name4=\", s)\n  s = re.sub(r\"(?m)^\\\\s*(?:block|BLOCK)=.*$\", \"block=boot;\", s)\n  s = re.sub(r\"(?m)^\\\\s*(?:is_slot_device|IS_SLOT_DEVICE)=.*$\", \"is_slot_device=auto;\", s)\n  p.write_text(s)\n  '\n\n  test -s \"$RUNNER_TEMP/AnyKernel3/Image.gz-dtb\"\n  grep -q 'kernel.string=LM-G900\
        \ SukiSU-Ultra 4.2.0 V32.1' \"$RUNNER_TEMP/AnyKernel3/anykernel.sh\"\n  grep -q 'block=boot' \"$RUNNER_TEMP/AnyKernel3/anykernel.sh\"\n  grep -q 'is_slot_device=auto' \"$RUNNER_TEMP/AnyKernel3/anykernel.sh\"\n\n  (\n    cd \"$RUNNER_TEMP/AnyKernel3\"\n    rm -rf .git\n    zip -r9 \"$GITHUB_WORKSPACE/artifacts/LM-G900-SukiSU-4.2.0-V32.1-OrangeFox-AnyKernel3.zip\" . \\\n      -x 'README.md' >/dev/null\n  )\n\n  cp -f \"$GITHUB_WORKSPACE/artifacts/LM-G900-SukiSU-4.2.0-V32.1-OrangeFox-AnyKernel3.zip\" artifacts/kernel/\n\n  (\n    cd artifacts\n    zip -r9 \"$GITHUB_WORKSPACE/artifacts/LM-G900-V32-DTB-DTBO-4.19.325-cip135.zip\" dtb dtbo >/dev/null\n  )\n\n  echo \"Kernel image: $KERNEL_IMAGE\"\n  echo \"AnyKernel3/OrangeFox ZIP: artifacts/LM-G900-SukiSU-4.2.0-V32.1-OrangeFox-AnyKernel3.zip\"\n  echo \"DTB/DTBO ZIP: artifacts/LM-G900-V32-DTB-DTBO-4.19.325-cip135.zip\"\n  find artifacts -maxdepth 2 -type f -printf '%p %s bytes\\n' | sort\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\n"
    - name: 19 - Final Configuration and Artifact Check
      if: always()
      shell: bash
      run: "set +e\nLOG=\"$DIAG_DIR/13-final-check.log\"\n: > \"$LOG\"\n{\n  echo \"========== FINAL CHECK ==========\"\n  date -u\n  echo\n  echo \"Kernel version:\"\n  grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile || true\n  echo\n  echo \"Required config:\"\n  grep -E '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|KALLSYMS|KALLSYMS_ALL|KPM|SECURITY|SECURITY_SELINUX)=' .config 2>/dev/null || true\n  echo\n  echo \"Kernel image candidates:\"\n  ls -lh arch/arm64/boot/Image.gz-dtb arch/arm64/boot/Image.gz arch/arm64/boot/Image 2>&1 || true\n  echo\n  echo \"DTB/DTBO outputs:\"\n  find arch/arm64/boot/dts -type f \\( -name '*.dtb' -o -name '*.dtbo' \\) -print 2>/dev/null | sort | head -300 || true\n  echo\n  echo \"Build errors (last 40):\"\n  tail -40 \"$DIAG_DIR/12-build-errors.log\" 2>/dev/null || true\n  echo\n  echo \"Build tail (last 40):\"\n  tail -40 \"$DIAG_DIR/12-build-tail.log\" 2>/dev/null || true\n} > \"$LOG\" 2>&1\ncat \"$LOG\"\nexit 0\n"
    - name: 19 - Stage Complete Diagnostics
      if: always()
      shell: bash
      run: "set +e\nmkdir -p diagnostic-artifact\ncp -f kernel-build-full.log diagnostic-artifact/12-build-full.log 2>/dev/null || true\ncp -f .config diagnostic-artifact/final.config 2>/dev/null || true\ncp -f sukisu-integration-note.txt diagnostic-artifact/sukisu-integration-note.txt 2>/dev/null || true\nmkdir -p diagnostic-artifact/ci-logs\ncp -a \"$DIAG_DIR\"/. diagnostic-artifact/ci-logs/ 2>/dev/null || true\ngit status --short > diagnostic-artifact/git-status.txt 2>&1 || true\ngit rev-parse HEAD > diagnostic-artifact/kernel-head.txt 2>&1 || true\n{\n  echo \"GitHub Run: $GITHUB_RUN_ID\"\n  echo \"Commit: $GITHUB_SHA\"\n  echo \"Date: $(date -u)\"\n  echo \"SukiSU release tag: $SUKISU_REF\"\n  echo \"SukiSU release commit (short): $SUKISU_RELEASE_COMMIT\"\n  echo \"External root-hiding kernel patchset: workflow-defined Maphide/BBG checks\"\n  echo \"External root-hiding userspace package: not part of kernel build\"\n  echo \"Lineage branch: $LINEAGE_BRANCH\"\n  echo \"CIP target: $CIP_REF\"\n  echo\n  find diagnostic-artifact -type f -printf '%p %s bytes\\n' | sort\n} > diagnostic-artifact/MANIFEST.txt\nexit 0\n"
