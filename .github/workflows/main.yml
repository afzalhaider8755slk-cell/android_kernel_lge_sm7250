name: LG Velvet LM-G900 — Android 16 QPR2 Kernel + DTBO (matched)

on:
  workflow_dispatch:
    inputs:
      kernel_source_commit:
        description: "Exact source commit (blank = current branch HEAD)"
        required: false
        default: ""
      cip_ref:
        description: "Official CIP release tag"
        required: false
        default: "v4.19.325-cip135"
      run_kernel:
        description: "Build kernel"
        required: false
        type: boolean
        default: true
      run_dtbo:
        description: "Build DTBO"
        required: false
        type: boolean
        default: true
  push:
    branches: [sixteen]

permissions:
  contents: read

concurrency:
  group: lm-g900-kernel-dtbo-${{ github.ref }}
  cancel-in-progress: false

env:
  ARCH: arm64
  DEFCONFIG: vendor/caymanlm_defconfig
  DEVICE: LM-G900
  CODENAME: caymanlm
  KERNEL_EXPECTED: 4.19.325-cip135
  KERNEL_OUT: ${{ github.workspace }}/kernel/out
  DTBO_OUT: ${{ github.workspace }}/dtbo/out
  DIAG_ROOT: ${{ github.workspace }}/ci-diagnostics
  SUKISU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
  SUKISU_REF: 3f602b5
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_REF: 001e69919c6271f690fd00b17e4c721c9e599152
  DTBO_PARTITION_SIZE: "25165824"

jobs:
  kernel:
    if: ${{ github.event_name == 'push' || inputs.run_kernel != false }}
    name: "KERNEL — SETUP K01-K15 — 4.19.325-cip135 + SukiSU/KPM/SUSFS"
    runs-on: ubuntu-24.04
    steps:
      - name: K01 — Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_source_commit != '' && inputs.kernel_source_commit || github.ref_name }}
          fetch-depth: 0
          clean: true

      - name: K02 — Install kernel dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential ccache clang lld llvm \
            libssl-dev libelf-dev libdw-dev device-tree-compiler \
            python3 python3-pip git rsync zip unzip dwarves file

      - name: K03 — Prepare numbered diagnostics and source fingerprint
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$DIAG_ROOT/kernel" "$KERNEL_OUT" "$GITHUB_WORKSPACE/artifacts/kernel"
          {
            echo "run_id=${{ github.run_id }}"
            echo "device=$DEVICE"
            echo "codename=$CODENAME"
            echo "branch=${{ github.ref_name }}"
            echo "source_head=$(git rev-parse HEAD)"
            echo "defconfig=$DEFCONFIG"
            echo "target=Android 16 QPR2 GSI"
            echo "features=SukiSU-Ultra+KPM+SUSFS+WALT+SchedTune+ZRAM+LTO"
            echo "hardware=Fingerprint+Vibration+DualSIM+Audio+VoWiFi"
            date -u +%FT%TZ
          } | tee "$DIAG_ROOT/kernel/00-context.txt"
          git status --short | tee "$DIAG_ROOT/kernel/00-git-status-before.txt"
          git rev-parse HEAD | tee "$DIAG_ROOT/kernel/00-source-commit.txt"
          git describe --always --dirty | tee "$DIAG_ROOT/kernel/00-source-describe.txt"

      - name: K04 — Force LLVM toolchain and legacy 4.19 helpers
        shell: bash
        run: |
          set -euxo pipefail
          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          clang --version | head -n 2 | tee "$DIAG_ROOT/kernel/01-clang-version.txt"
          ld.lld --version | head -n 1 | tee "$DIAG_ROOT/kernel/01-lld-version.txt"
          test -f scripts/as-version.sh
          if test ! -f scripts/min-tool-version.sh; then
            cat > scripts/min-tool-version.sh <<'SH'
          #!/bin/sh
          case "$1" in
            binutils) echo 2.25.0 ;;
            gcc) echo 5.1.0 ;;
            llvm) echo 10.0.1 ;;
            *) echo "$1: unknown tool" >&2; exit 1 ;;
          esac
          SH
          fi
          chmod +x scripts/as-version.sh scripts/min-tool-version.sh

      - name: K05 — Restore pristine defconfig and record baseline
        shell: bash
        run: |
          set -euxo pipefail
          CFG="arch/arm64/configs/$DEFCONFIG"
          git restore --source=HEAD -- "$CFG"
          test -s "$CFG"
          sha256sum "$CFG" | tee "$DIAG_ROOT/kernel/02-defconfig.sha256"
          make O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            "$DEFCONFIG" 2>&1 | tee "$DIAG_ROOT/kernel/03-defconfig.log"
          cp "$KERNEL_OUT/.config" "$DIAG_ROOT/kernel/baseline.config"

      - name: K06 — Integrate official CIP135 without clobbering LG device code
        shell: bash
        run: |
          set -u -o pipefail
          CIP="${{ inputs.cip_ref || 'v4.19.325-cip135' }}"
          LOG="$DIAG_ROOT/kernel/04-cip-integration.log"
          : > "$LOG"

          echo "=== CIP target: $CIP ===" | tee -a "$LOG"
          git fetch --no-tags https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            "refs/tags/v4.19.325:refs/tags/v4.19.325" 2>&1 | tee -a "$LOG"
          git fetch --no-tags https://gitlab.com/cip-project/cip-kernel/linux-cip.git \
            "refs/tags/$CIP:refs/tags/$CIP" 2>&1 | tee -a "$LOG"

          test -n "$(git rev-parse --verify "refs/tags/v4.19.325^{commit}")"
          test -n "$(git rev-parse --verify "refs/tags/$CIP^{commit}")"

          if git merge-base --is-ancestor "refs/tags/$CIP" HEAD; then
            echo "CIP already present in source history; no merge performed." | tee -a "$LOG"
          else
            # The CIP135 tag is a full CIP tree, not just a version-string patch.
            # Generate the official delta from stable 4.19.325.
            rm -rf "$RUNNER_TEMP/cip135-patches"
            mkdir -p "$RUNNER_TEMP/cip135-patches"
            git format-patch --binary --full-index \
              --output-directory "$RUNNER_TEMP/cip135-patches" \
              "refs/tags/v4.19.325..refs/tags/$CIP" 2>&1 | tee -a "$LOG"

            PATCHES=$(find "$RUNNER_TEMP/cip135-patches" -type f -name '*.patch' | sort | wc -l)
            echo "CIP patch count=$PATCHES" | tee -a "$LOG"
            test "$PATCHES" -gt 0

            # Apply non-conflicting CIP changes normally. Device-specific LG
            # paths are deliberately protected because replacing them with the
            # generic CIP tree can make the phone unbootable.
            if ! git am --3way --keep-non-patch \
              "$RUNNER_TEMP/cip135-patches"/*.patch 2>&1 | tee -a "$LOG"; then
              echo "CIP generic/device conflict detected; aborting instead of silently skipping it." | tee -a "$LOG"
              git am --abort || true
              git diff --check | tee "$DIAG_ROOT/kernel/04-cip-conflict-diffcheck.txt" || true
              git status --short | tee "$DIAG_ROOT/kernel/04-cip-conflict-status.txt" || true
              echo "ERROR: CIP135 could not be integrated cleanly. No conflict was hidden." | tee -a "$LOG"
              exit 1
            fi
          fi

          git log -1 --oneline | tee "$DIAG_ROOT/kernel/04-cip-head.txt"
          make -s kernelversion O="$KERNEL_OUT" 2>&1 | tee "$DIAG_ROOT/kernel/04-kernelversion.txt"
          grep -R -- '-cip135' Makefile localversion* 2>/dev/null | head -20 | tee "$DIAG_ROOT/kernel/04-cip-version-marker.txt" || true

      - name: K07 — Integrate SukiSU-Ultra and KPM deterministically
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf SukiSU-Ultra drivers/kernelsu
          git clone --depth=1 "$SUKISU_REPO" SukiSU-Ultra
          cd SukiSU-Ultra
          git fetch --depth=1 origin "$SUKISU_REF"
          git checkout --detach "$SUKISU_REF"
          git rev-parse HEAD | tee "$DIAG_ROOT/kernel/05-sukisu-resolved.txt"
          cd ..
          test -f SukiSU-Ultra/kernel/Makefile
          test -f SukiSU-Ultra/kernel/Kconfig
          mkdir -p drivers
          ln -s "$PWD/SukiSU-Ultra/kernel" drivers/kernelsu
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q '^obj-$(CONFIG_KSU) += kernelsu/$' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

      - name: K08 — Apply SUSFS 4.19 patch with zero fuzz
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf susfs
          git clone --depth=1 "$SUSFS_REPO" susfs
          git -C susfs fetch --depth=1 origin "$SUSFS_REF"
          git -C susfs checkout --detach "$SUSFS_REF"
          test -f susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          patch --dry-run --batch --forward --fuzz=0 -p1 \
            < susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch \
            2>&1 | tee "$DIAG_ROOT/kernel/06-susfs-dry-run.log"
          patch --batch --forward --fuzz=0 -p1 \
            < susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch \
            2>&1 | tee "$DIAG_ROOT/kernel/06-susfs-apply.log"

      - name: K09 — Enforce finalized Android-16/GSI feature set
        shell: bash
        run: |
          set -euxo pipefail
          CFG="$KERNEL_OUT/.config"
          make O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm scripts
          scripts/config --file "$CFG" \
            --enable ARM64 \
            --enable BPF \
            --enable BPF_SYSCALL \
            --enable BPF_JIT \
            --enable CGROUP_BPF \
            --enable OVERLAY_FS \
            --enable TMPFS \
            --enable SECURITY \
            --enable SECURITY_SELINUX \
            --enable DM_VERITY \
            --enable DM_VERITY_FEC \
            --enable FS_VERITY \
            --enable ZRAM \
            --enable ZSMALLOC \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL
          # KPM is only toggled when the integrated SukiSU tree exposes it.
          if grep -q 'config KPM' drivers/kernelsu/Kconfig 2>/dev/null; then
            scripts/config --file "$CFG" --enable KPM
          fi
          # Preserve the device's existing scheduler/power features.
          for sym in WALT SCHED_TUNE; do
            if grep -Rqs "config $sym" kernel include arch drivers 2>/dev/null; then
              scripts/config --file "$CFG" --enable "$sym" || true
            fi
          done
          if grep -q '^config EROFS_FS' fs/erofs/Kconfig 2>/dev/null; then
            scripts/config --file "$CFG" --enable EROFS_FS
          fi
          make O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm olddefconfig \
            2>&1 | tee "$DIAG_ROOT/kernel/07-olddefconfig.log"
          cp "$CFG" "$DIAG_ROOT/kernel/final.config"
          {
            echo "=== required feature symbols ==="
            grep -E 'CONFIG_(KSU|KPM|SUSFS|WALT|SCHED_TUNE|ZRAM|ZSMALLOC|LTO|LTO_CLANG|LTO_CLANG_THIN|BPF|CGROUP_BPF|OVERLAY_FS|DM_VERITY|FS_VERITY)' "$CFG" || true
            echo "=== required hardware markers ==="
            grep -RniE 'fingerprint|vibrator|haptic|dual.?sim|audio|iwlan|vowifi|wifi.?calling' \
              arch/arm64/boot/dts/vendor/lge drivers sound net 2>/dev/null | head -300 || true
          } | tee "$DIAG_ROOT/kernel/08-feature-audit.txt"

      - name: K10 — Verify kernel and DT source match
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" != ""
          test -d arch/arm64/boot/dts/vendor/lge/lito-caymanlm
          test -f arch/arm64/configs/$DEFCONFIG
          grep -q '^CONFIG_MACH_LITO_CAYMANLM=y' "$KERNEL_OUT/.config"
          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y' "$KERNEL_OUT/.config"
          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' "$KERNEL_OUT/.config"

      - name: K11 — Build ARM64 kernel and modules
        shell: bash
        run: |
          set -o pipefail
          make O="$KERNEL_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            -j"$(nproc)" 2>&1 | tee "$DIAG_ROOT/kernel/09-build.log"

      - name: K12 — Verify boot-critical kernel output
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          test -s "$KERNEL_OUT/arch/arm64/boot/Image"
          file "$KERNEL_OUT/arch/arm64/boot/Image" | tee "$DIAG_ROOT/kernel/10-image-file.txt"
          sha256sum "$KERNEL_OUT/arch/arm64/boot/Image" | tee "$DIAG_ROOT/kernel/10-image.sha256"
          strings "$KERNEL_OUT/arch/arm64/boot/Image" | grep -E '4\.19\.325|cip135' | head -20 | tee "$DIAG_ROOT/kernel/10-image-version.txt" || true

      - name: K13 — Package OrangeFox/AnyKernel3 flash ZIP
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          if test -s "$KERNEL_OUT/arch/arm64/boot/Image.gz-dtb"; then
            KERNEL_FILE=Image.gz-dtb
          elif test -s "$KERNEL_OUT/arch/arm64/boot/Image-dtb"; then
            KERNEL_FILE=Image-dtb
          else
            KERNEL_FILE=Image
          fi
          cp "$KERNEL_OUT/arch/arm64/boot/$KERNEL_FILE" "AnyKernel3/$KERNEL_FILE"
          cat > AnyKernel3/anykernel.sh <<'AK'
          properties() { '
          kernel.string=LG Velvet LM-G900 4.19.325-cip135 + SukiSU-Ultra + KPM + SUSFS
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          supported.versions=
          supported.patchlevels=
          '; }
          kernel=__KERNEL_FILE__;
          block=auto;
          is_slot_device=auto;
          AK
          sed -i "s/__KERNEL_FILE__/$KERNEL_FILE/" AnyKernel3/anykernel.sh
          (cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/artifacts/kernel/LM-G900-Android16-Kernel-AnyKernel3.zip" .)
          cp "$KERNEL_OUT/arch/arm64/boot/$KERNEL_FILE" "$GITHUB_WORKSPACE/artifacts/kernel/$KERNEL_FILE"

      - name: K14 — Upload kernel diagnostics/result ALWAYS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-kernel-${{ github.run_id }}
          path: |
            ci-diagnostics/kernel/**
            artifacts/kernel/**
            kernel/out/.config
            kernel/out/arch/arm64/boot/Image*
          if-no-files-found: warn
          retention-days: 14

      - name: K15 — Final kernel state
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "SETUP=K15"
            echo "exit_status=$?"
            git status --short
            df -h
          } | tee "$DIAG_ROOT/kernel/99-final-state.txt"

  dtbo:
    if: ${{ github.event_name == 'push' || inputs.run_dtbo != false }}
    name: "DTBO — SETUP D01-D13 — matched caymanlm Android 16 QPR2"
    runs-on: ubuntu-24.04
    steps:
      - name: D01 — Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_source_commit != '' && inputs.kernel_source_commit || github.ref_name }}
          fetch-depth: 0
          clean: true

      - name: D02 — Install DT/kernel build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential clang lld llvm \
            libssl-dev libelf-dev device-tree-compiler \
            python3 git rsync zip unzip file

      - name: D03 — Prepare numbered DTBO diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$DIAG_ROOT/dtbo" "$DTBO_OUT" "$GITHUB_WORKSPACE/artifacts/dtbo"
          {
            echo "run_id=${{ github.run_id }}"
            echo "device=$DEVICE"
            echo "codename=$CODENAME"
            echo "source_head=$(git rev-parse HEAD)"
            echo "target=Android 16 QPR2 GSI"
            echo "dtbo_partition_size=$DTBO_PARTITION_SIZE"
            echo "source_dts_root=arch/arm64/boot/dts/vendor/lge/lito-caymanlm"
            date -u +%FT%TZ
          } | tee "$DIAG_ROOT/dtbo/00-context.txt"
          git rev-parse HEAD | tee "$DIAG_ROOT/dtbo/00-source-commit.txt"

      - name: D04 — Restore defconfig and verify exact caymanlm overlay configuration
        shell: bash
        run: |
          set -euxo pipefail
          CFG="arch/arm64/configs/$DEFCONFIG"
          git restore --source=HEAD -- "$CFG"
          make O="$DTBO_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            "$DEFCONFIG" 2>&1 | tee "$DIAG_ROOT/dtbo/01-defconfig.log"
          {
            grep '^CONFIG_BUILD_ARM64_DT_OVERLAY=' "$DTBO_OUT/.config"
            grep '^CONFIG_MACH_LITO_CAYMANLM=' "$DTBO_OUT/.config"
            grep '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=' "$DTBO_OUT/.config"
          } | tee "$DIAG_ROOT/dtbo/02-device-config.txt"
          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' "$DTBO_OUT/.config"
          grep -q '^CONFIG_MACH_LITO_CAYMANLM=y' "$DTBO_OUT/.config"
          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y' "$DTBO_OUT/.config"

      - name: D05 — Repair only the known LGE DTBO Makefile discovery typo
        shell: bash
        run: |
          set -euxo pipefail
          F=arch/arm64/boot/dts/vendor/lge/Makefile
          cp "$F" "$DIAG_ROOT/dtbo/03-makefile-before"
          if grep -qF '$(wildcard echo $(srctree)' "$F"; then
            sed -i 's#$(wildcard echo $(srctree)#$(wildcard $(srctree)#' "$F"
            echo "KNOWN_FIX_APPLIED=wildcard-echo" | tee "$DIAG_ROOT/dtbo/03-makefile-fix.txt"
          else
            echo "KNOWN_FIX_APPLIED=not-needed" | tee "$DIAG_ROOT/dtbo/03-makefile-fix.txt"
          fi
          cp "$F" "$DIAG_ROOT/dtbo/03-makefile-after"
          git diff --no-ext-diff -- "$F" | tee "$DIAG_ROOT/dtbo/03-makefile-fix.diff" || true

      - name: D06 — Inventory all selected LGE overlays and validate DTS syntax individually
        shell: bash
        run: |
          set -u -o pipefail
          ROOT=arch/arm64/boot/dts/vendor/lge/lito-caymanlm
          find "$ROOT" -type f \( -name '*.dts' -o -name '*.dtsi' \) -print | sort \
            | tee "$DIAG_ROOT/dtbo/04-dts-inventory.txt"
          : > "$DIAG_ROOT/dtbo/05-dts-syntax.log"
          status=0
          # Do not use -f/force-output: a DTBO with DTC errors can boot-fail.
          while IFS= read -r f; do
            echo "=== DTC CHECK: $f ===" | tee -a "$DIAG_ROOT/dtbo/05-dts-syntax.log"
            if ! clang -E -x assembler-with-cpp -undef -D__DTS__ -nostdinc \
              -Iinclude -Iarch/arm64/boot/dts \
              -Iarch/arm64/boot/dts/vendor/qcom \
              -Iarch/arm64/boot/dts/vendor/lge \
              "$f" 2>&1 | dtc -@ -I dts -O dtb -o /dev/null \
              2>&1 | tee -a "$DIAG_ROOT/dtbo/05-dts-syntax.log"; then
              status=1
            fi
          done < <(find "$ROOT" -type f -name '*.dts' | sort)
          exit "$status"

      - name: D07 — Build DTBs/DTBOs serially for precise errors
        shell: bash
        run: |
          set -o pipefail
          # Serial build is intentional: the previous parallel build hid the
          # actual DTC diagnostic behind "Input tree has errors".
          make O="$DTBO_OUT" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang AS=clang HOSTAS=clang \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            dtbs -j1 2>&1 | tee "$DIAG_ROOT/dtbo/06-dtbo-build.log"

      - name: D08 — Require real DTBO outputs and verify every generated file
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          find "$DTBO_OUT" -type f -name '*.dtbo' -size +0c -print | sort \
            | tee "$DIAG_ROOT/dtbo/07-built-dtbo-list.txt"
          test -s "$DIAG_ROOT/dtbo/07-built-dtbo-list.txt"
          while IFS= read -r f; do
            file "$f"
            sha256sum "$f"
          done < "$DIAG_ROOT/dtbo/07-built-dtbo-list.txt" \
            | tee "$DIAG_ROOT/dtbo/08-dtbo-hashes.txt"

      - name: D09 — Obtain Android 16 QPR2 mkdtboimg.py
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/libufdt"
          git clone --depth=1 --branch android16-qpr2-release \
            https://android.googlesource.com/platform/system/libufdt.git \
            "$RUNNER_TEMP/libufdt"
          test -s "$RUNNER_TEMP/libufdt/utils/src/mkdtboimg.py"
          cp "$RUNNER_TEMP/libufdt/utils/src/mkdtboimg.py" "$RUNNER_TEMP/mkdtboimg.py"
          python3 "$RUNNER_TEMP/mkdtboimg.py" --help \
            | tee "$DIAG_ROOT/dtbo/09-mkdtboimg-help.txt"

      - name: D10 — Package DTBO using Android 16 QPR2 tooling and enforce partition size
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/dtbo"
          mapfile -t DTBO_FILES < <(find "$DTBO_OUT" -type f -name '*.dtbo' -size +0c | sort)
          test "${#DTBO_FILES[@]}" -gt 0
          python3 "$RUNNER_TEMP/mkdtboimg.py" create \
            "$GITHUB_WORKSPACE/artifacts/dtbo/LM-G900-Android16QPR2-dtbo.img" \
            --page_size=4096 \
            "${DTBO_FILES[@]}"
          test -s "$GITHUB_WORKSPACE/artifacts/dtbo/LM-G900-Android16QPR2-dtbo.img"
          SIZE=$(stat -c '%s' "$GITHUB_WORKSPACE/artifacts/dtbo/LM-G900-Android16QPR2-dtbo.img")
          echo "dtbo_img_size=$SIZE" | tee "$DIAG_ROOT/dtbo/10-dtbo-size.txt"
          test "$SIZE" -le "$DTBO_PARTITION_SIZE"
          sha256sum "$GITHUB_WORKSPACE/artifacts/dtbo/LM-G900-Android16QPR2-dtbo.img" \
            | tee "$DIAG_ROOT/dtbo/10-dtbo-sha256.txt"

      - name: D11 — DTBO header/entry verification
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          python3 "$RUNNER_TEMP/mkdtboimg.py" dump \
            "$GITHUB_WORKSPACE/artifacts/dtbo/LM-G900-Android16QPR2-dtbo.img" \
            2>&1 | tee "$DIAG_ROOT/dtbo/11-dtbo-dump.txt"
          grep -q 'dt_entry' "$DIAG_ROOT/dtbo/11-dtbo-dump.txt" || \
            grep -q 'dt_table_header' "$DIAG_ROOT/dtbo/11-dtbo-dump.txt"

      - name: D12 — Package DTBO flash ZIP
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
