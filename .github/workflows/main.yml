name: V26-LM-G900-KARNAL-BUILT

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_REF: sixteen
  KERNEL_COMMIT: 720c8d37ab7727af24c275bead988d6345ad174b

  DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_caymanlm.git
  DEVICE_REF: sixteen
  COMMON_DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_sm7250-common.git
  COMMON_DEVICE_REF: sixteen
  VENDOR_REPO: https://github.com/Hirashi-so/proprietary_vendor_lge_caymanlm.git
  VENDOR_REF: sixteen

  BASELINE_KERNEL_SHA256: 85dd6083fd5a34135f301de661cae5f90b1aee82f4f5aa8d6dee30eacd34659d
  BASELINE_KERNEL_VERSION: 4.19.325
  BASELINE_CIP: v4.19.325-cip132
  CIP_PREFIX: v4.19.325-cip

  KSU_VERSION: v3.3.0
  # V24: vanilla/official KernelSU-Next (KernelSU-Next/KernelSU-Next) does not carry
  # the "config KSU_SUSFS" Kconfig entry or the su-compat hook symbols
  # (ksu_su_compat_enabled, ksu_handle_execveat, ksu_handle_faccessat, ksu_handle_stat,
  # ksu_handle_setresuid, ...) that SUSFS 2.x's inline-hook layer expects to already
  # exist inside KernelSU's own source -- confirmed by Step 7 always failing its
  # "config KSU_SUSFS" Kconfig check once it got far enough to reach it. KernelSU-Next's
  # own maintainer (@pershoot) publishes a "dev-susfs" branch on the same v3.3.0 base
  # specifically to add this; it is the same branch/commit multiple independent, current
  # SUSFS+KernelSU-Next kernel-build projects (WildKernels/GKI_KernelSU_SUSFS,
  # JeelsBoobz/android-kernel-builder) pin for exactly this reason. Pinned to an exact
  # commit for reproducibility, matching this workflow's existing pinning style.
  # NOTE: pershoot has stated this branch is not guaranteed production-stable.
  KSU_SUSFS_FORK_OWNER: pershoot
  KSU_SUSFS_FORK_REPO: KernelSU-Next
  KSU_SUSFS_FORK_BRANCH: dev-susfs
  # V25: dev-susfs is an actively-moving/rebasing experimental branch -- the commit V24
  # pinned ("fatal: unable to read tree") had already been rewritten off the branch by
  # the time the workflow ran. Pinning an exact commit on a branch like this trades
  # working builds for reproducibility that the fork itself does not honor. V25 tracks
  # the branch's current tip instead; logs/06-kernelsu-resolved.txt records exactly which
  # commit was actually used on each run, and Step 6's own "config KSU_SUSFS" Kconfig
  # check (below) still fails loudly and immediately if that guarantee is ever lost.
  SUSFS_VERSION: 2.3.0
  SUSFS_BACKPORT_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  SUSFS_BACKPORT_REF: mainline
  SUSFS_BACKPORT_COMMIT: f15603b246d7ce6008af8bdefa0a34b3df28326a
  SUSFS_PATCH_PATH: Patches/Patch/susfs_patch_to_4.19.patch
  SUSFS_PATCH_BLOB_SHA256: f9d8ed735f461ed982d2c49b338e35c17f4378e5
  # This repo documents susfs_patch_to_<kernel>.patch + susfs_inline_hook_patches.sh
  # as the two-layer non-GKI SUSFS integration path.

  CLANG_REV: clang-r563880c
  CLANG_COMMIT: f8439f0628d799092dd07df440a6334cab28939c
  WORKFLOW_VERSION: V26
  OUTPUT_PREFIX: V26-LM-G900-KARNAL
  # V19 retains the proven source pins and fixes the SUSFS source-port failure and corrects the SUSFS version/source mismatch:
  # 1) pin the KernelSU-Next setup script itself to v3.3.0
  # 2) pin the SUSFS backport source to the audited commit
  # 3) discover the actual 4.19 backport filename used by that source
  # 4) try a strict direct apply first, then a Git 3-way merge against the staged CIP+KSUN tree
  # 5) reject any unresolved conflicts, .rej/.orig files, or conflict markers
  # 6) verify CONFIG_KSU_SUSFS exists before enabling it
  # 7) fetch the SUSFS backport with retryable Git transport instead of one fragile clone
  # 8) enforce that the pinned 4.19 patch and inline-hook script both declare SUSFS 2.3.x
  #
  # V23 fixes the actual, reproducible Step-7 abort seen on every V22 run:
  # 9) the per-file `patch -p1` call for the four audited conflict files (fs/namespace.c,
  #    fs/proc/cmdline.c, fs/proc/task_mmu.c, fs/super.c) was wrapped in `set +e ... set -e`,
  #    which does NOT stop bash's ERR trap from firing on the expected/audited hunk failure.
  #    Because `set -E` is also active, the trap fired a second time inside the `(cd kernel && ...)`
  #    subshell too (wrong cwd -> "tee: ... No such file or directory" noise), then again in the
  #    outer shell, aborting Step 7 on the very first expected failure (fs/namespace.c) every time,
  #    before the semantic source port, the other 3 files, or the inline-hook stage ever ran.
  #    Fixed with the same `if <cmd>; then rc=0; else rc=$?; fi` guard already used correctly for
  #    the 3-way `git apply`, and `patch -d kernel` instead of a `(cd kernel && ...)` subshell so
  #    there is no subshell for the inherited ERR trap to misfire inside.
  #
  # V24 fixes what Step 7 hits once V23's fix lets it run to completion: the patch apply,
  # semantic four-file port, and inline-hook layer (fs/exec.c, fs/open.c, etc.) all succeed,
  # but the final "config KSU_SUSFS" Kconfig check always fails. Researched and confirmed this
  # is a genuine source-compatibility gap, not a script bug: SUSFS 2.x's inline hooks expect
  # ksu_su_compat_enabled, ksu_handle_execveat, ksu_handle_faccessat, ksu_handle_stat,
  # ksu_handle_setresuid, and a "config KSU_SUSFS" Kconfig entry to already exist inside
  # KernelSU's own source -- vanilla/official KernelSU-Next (KernelSU-Next/KernelSU-Next) does
  # not carry them. Step 6 now clones KernelSU-Next's own SUSFS fork (pershoot/KernelSU-Next,
  # branch dev-susfs) instead, which several current, independent SUSFS+KernelSU-Next projects
  # use for this exact reason. Everything else about Step 6 (driver symlink, Makefile/Kconfig
  # wiring, KSU_VERSION=v3.3.0 baseline) is unchanged.
  #
  # V25: dev-susfs is an actively-moving experimental branch, so V24's exact-commit pin broke
  # ("fatal: unable to read tree") the moment that commit was rewritten off the branch. V25
  # tracks the branch's current tip instead of a fixed commit -- Step 6 records exactly which
  # commit was used in logs/06-kernelsu-resolved.txt every run, and still fails immediately,
  # inside Step 6 itself, if that commit ever stops declaring "config KSU_SUSFS".


jobs:
  build:
    name: Build V26
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "1. Checkout kernel source"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs diagnostics
          exec > >(tee -a logs/01-checkout.log) 2>&1
          echo "::group::[1/15] Checkout kernel source"
          git clone --branch "${KERNEL_REF}" "${KERNEL_REPO}" kernel
          cd kernel
          git fetch --tags --force --prune
          git checkout --detach "${KERNEL_COMMIT}"
          test "$(git rev-parse HEAD)" = "${KERNEL_COMMIT}"
          test "$(make -s kernelversion)" = "${BASELINE_KERNEL_VERSION}"
          git status --short > ../baseline-git-status.txt
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)" > ../source-info.txt
          printf 'SOURCE_BRANCH=%s\n' "${KERNEL_REF}" >> ../source-info.txt
          printf 'SOURCE_EXPECTED_COMMIT=%s\n' "${KERNEL_COMMIT}" >> ../source-info.txt
          printf 'KERNEL_VERSION=%s\n' "$(make -s kernelversion)" >> ../source-info.txt
          echo "[OK] Source: $(git rev-parse HEAD)"
          echo "[OK] Kernel version: $(make -s kernelversion)"
          echo "::endgroup::"

      - name: "2. Prepare build tools"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[2/15] Prepare build tools"
          {
            sudo apt-get update -qq
            sudo apt-get install -y -qq bc bison build-essential ccache clang flex gcc-aarch64-linux-gnu git lld libssl-dev libelf-dev libncurses-dev python3 rsync unzip zip wget curl device-tree-compiler patch
          } > logs/02-apt.log 2>&1
          curl -fL --retry 5 --retry-delay 2 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/${CLANG_REV}.tar.gz" -o "/tmp/${CLANG_REV}.tar.gz" > logs/02-clang-download.log 2>&1
          mkdir -p "clang-prebuilt/${CLANG_REV}"
          tar -xzf "/tmp/${CLANG_REV}.tar.gz" -C "clang-prebuilt/${CLANG_REV}" > logs/02-clang-extract.log 2>&1
          export CLANG_BIN="$GITHUB_WORKSPACE/clang-prebuilt/${CLANG_REV}/bin"
          test -x "${CLANG_BIN}/clang"
          test -x "${CLANG_BIN}/ld.lld"
          "${CLANG_BIN}/clang" --version | tee logs/02-clang-version.log
          head -n1 logs/02-clang-version.log > toolchain-version.txt
          echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"
          echo "[OK] Android Clang ${CLANG_REV}"
          echo "::endgroup::"

      - name: "3. Select and snapshot device defconfig"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs/device-tree diagnostics/device-tree
          exec > >(tee -a logs/03-defconfig-selection.log) 2>&1
          echo "::group::[3/15] Select and snapshot device defconfig"

          rm -rf device-caymanlm device-sm7250-common vendor-caymanlm
          git clone --depth=1 --branch "${DEVICE_REF}" "${DEVICE_REPO}" device-caymanlm
          git clone --depth=1 --branch "${COMMON_DEVICE_REF}" "${COMMON_DEVICE_REPO}" device-sm7250-common
          git clone --depth=1 --branch "${VENDOR_REF}" "${VENDOR_REPO}" vendor-caymanlm

          cp device-caymanlm/BoardConfig.mk logs/device-tree/BoardConfig.mk
          cp device-sm7250-common/BoardConfigCommon.mk logs/device-tree/BoardConfigCommon.mk
          cp vendor-caymanlm/BoardConfigVendor.mk logs/device-tree/BoardConfigVendor.mk

          TARGET_KERNEL_CONFIG="$({ grep -E '^[[:space:]]*TARGET_KERNEL_CONFIG[[:space:]]*:?=' device-caymanlm/BoardConfig.mk || true; } | tail -n1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//')"
          test -n "${TARGET_KERNEL_CONFIG}"
          test "${TARGET_KERNEL_CONFIG}" = "vendor/lineageos_cayman_defconfig"
          DEFCONFIG="arch/arm64/configs/${TARGET_KERNEL_CONFIG}"
          # V26: TARGET_KERNEL_CONFIG was only ever a local variable inside this step's own
          # shell process. Every GitHub Actions "run:" step is a fresh shell, so Step 8 (and
          # the defconfig= lines in Steps 12/15) reading "${TARGET_KERNEL_CONFIG}" always saw
          # an unset variable -- Step 8's `set -u` then aborted immediately with "unbound
          # variable" the moment execution finally reached it (previously Step 7 always failed
          # first, so this was never exercised). Export it through $GITHUB_ENV, the same way
          # CIP_TARGET already is elsewhere in this workflow, so it persists to every later step.
          echo "TARGET_KERNEL_CONFIG=${TARGET_KERNEL_CONFIG}" >> "$GITHUB_ENV"

          {
            echo "DEVICE_REPO=${DEVICE_REPO}"
            echo "DEVICE_REF=${DEVICE_REF}"
            echo "COMMON_DEVICE_REPO=${COMMON_DEVICE_REPO}"
            echo "COMMON_DEVICE_REF=${COMMON_DEVICE_REF}"
            echo "VENDOR_REPO=${VENDOR_REPO}"
            echo "VENDOR_REF=${VENDOR_REF}"
            echo "TARGET_KERNEL_CONFIG=${TARGET_KERNEL_CONFIG}"
            echo "DEFCONFIG=${DEFCONFIG}"
          } | tee logs/device-tree/selection.txt

          cd kernel
          test -f "${DEFCONFIG}"
          cp "${DEFCONFIG}" ../baseline-defconfig.txt
          sha256sum "${DEFCONFIG}" | tee ../logs/03-defconfig.sha256

          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          test -x "${CLANG_BIN}/clang"
          test -x "${CLANG_BIN}/ld.lld"
          make O=out "${TARGET_KERNEL_CONFIG}" > ../logs/03-defconfig-make.log 2>&1

          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' out/.config | sort > ../baseline-enabled-config.txt
          sha256sum ../baseline-enabled-config.txt | tee ../logs/03-baseline-enabled-config.sha256
          {
            echo "baseline_kernel_sha256=${BASELINE_KERNEL_SHA256}"
            echo "baseline_kernel_version=${BASELINE_KERNEL_VERSION}"
            echo "baseline_cip=${BASELINE_CIP}"
            echo "defconfig=${TARGET_KERNEL_CONFIG}"
            echo "baseline_enabled_config_count=$(wc -l < ../baseline-enabled-config.txt)"
          } > ../baseline-info.txt

          echo "[FIX] Toolchain prepared before defconfig; clang and ld.lld verified."
          echo "[OK] Device tree explicitly selects ${TARGET_KERNEL_CONFIG}"
          echo "[OK] Kernel defconfig exists: ${DEFCONFIG}"
          echo "::endgroup::"

      - name: "4. Resolve latest official CIP for 4.19.325"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[4/15] Resolve latest official CIP"
          cd kernel
          git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          git fetch --no-tags cip "+refs/tags/${BASELINE_CIP}:refs/tags/${BASELINE_CIP}" > ../logs/04-cip-baseline-fetch.log 2>&1
          git ls-remote --tags --refs cip "refs/tags/${CIP_PREFIX}*" > ../logs/04-cip-tags.txt 2>&1
          LATEST="$(awk -F/ '{print $NF}' ../logs/04-cip-tags.txt | grep -E "^${CIP_PREFIX}[0-9]+$" | sort -V | tail -n1)"
          test -n "${LATEST}"
          OLD_N="${BASELINE_CIP##*-cip}"; NEW_N="${LATEST##*-cip}"
          test "${NEW_N}" -ge "${OLD_N}"
          echo "CIP_TARGET=${LATEST}" >> "$GITHUB_ENV"
          git fetch --no-tags cip "refs/tags/${LATEST}:refs/tags/${LATEST}" > ../logs/04-cip-target-fetch.log 2>&1
          {
            echo "CIP_BASELINE=${BASELINE_CIP}"
            echo "CIP_TARGET=${LATEST}"
            echo "baseline_commit=$(git rev-parse ${BASELINE_CIP})"
            echo "target_commit=$(git rev-parse ${LATEST})"
            echo "target_subject=$(git show -s --format=%s ${LATEST})"
            git diff --stat "${BASELINE_CIP}..${LATEST}"
          } | tee ../logs/04-cip-version.log
          echo "[OK] Baseline: ${BASELINE_CIP}"
          echo "[OK] Latest official 4.19.325 CIP discovered: ${LATEST}"
          echo "::endgroup::"

      - name: "5. Integrate maximum clean CIP level (incremental chain)"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[5/15] Integrate maximum clean CIP level"
          cd kernel
          mkdir -p ../logs/cip-checks
          git remote get-url cip >/dev/null 2>&1 || git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          : > ../logs/05-cip-compatibility.log
          : > ../logs/05-cip-failure.log
          : > ../logs/05-cip-candidates.txt
          {
            echo "CIP compatibility probe"
            echo "Source commit=$(git rev-parse HEAD)"
            echo "Kernel version=$(make -s kernelversion)"
            echo "Baseline tag=${BASELINE_CIP}"
            echo "Remote=https://gitlab.com/cip-project/cip-kernel/linux-cip.git"
            echo "Method=incremental tag-to-tag deltas, strict apply first, clean 3-way second"
            echo
          } | tee -a ../logs/05-cip-compatibility.log

          git ls-remote --tags --refs cip "refs/tags/${CIP_PREFIX}*" > ../logs/05-cip-tags.txt 2>&1
          mapfile -t ALL_CIP_TAGS < <(
            awk -F/ '{print $NF}' ../logs/05-cip-tags.txt |
              grep -E "^${CIP_PREFIX}[0-9]+$" |
              sort -V
          )
          test "${#ALL_CIP_TAGS[@]}" -gt 0
          {
            echo "Baseline=${BASELINE_CIP}"
            echo "All_candidates=${#ALL_CIP_TAGS[@]}"
            printf '%s\n' "${ALL_CIP_TAGS[@]}"
          } | tee ../logs/05-cip-candidates.txt

          BASE_N="${BASELINE_CIP##*-cip}"
          mapfile -t CIP_TAGS < <(
            printf '%s\n' "${ALL_CIP_TAGS[@]}" |
              awk -v base="${BASE_N}" -F-cip '$2 >= base'
          )
          test "${#CIP_TAGS[@]}" -gt 0

          PREV_TAG="${BASELINE_CIP}"
          SELECTED="${BASELINE_CIP}"
          LAST_APPLY_MODE="baseline"
          : > ../logs/05-cip-chain.log

          # The V10 probe compared the entire 132->136 range directly against the
          # LG tree. That is overly strict for a cumulative stable/CIP series:
          # a file added by an intermediate tag (for example mm/kasan content)
          # cannot be represented correctly when the whole range is treated as
          # one patch against the old LG context. V11 walks 132->133->134->135->136
          # and tests each real tag-to-tag delta on the already-integrated tree.
          for TAG in "${CIP_TAGS[@]}"; do
            [ "${TAG}" = "${BASELINE_CIP}" ] && continue
            CHECK_LOG="../logs/cip-checks/${TAG}.log"
            PATCH_FILE="../logs/cip-${PREV_TAG}-to-${TAG}.patch"
            THREEWAY_LOG="../logs/cip-checks/${TAG}.3way"
            : > "${CHECK_LOG}"
            : > "${THREEWAY_LOG}"
            echo "============================================================" | tee -a ../logs/05-cip-chain.log
            echo "TEST=${PREV_TAG}..${TAG}" | tee -a ../logs/05-cip-chain.log

            if ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
              git fetch --no-tags cip "+refs/tags/${TAG}:refs/tags/${TAG}" >> "${CHECK_LOG}" 2>&1
            fi
            git diff --binary "${PREV_TAG}..${TAG}" > "${PATCH_FILE}"
            {
              echo "from=${PREV_TAG}"
              echo "to=${TAG}"
              echo "from_commit=$(git rev-parse ${PREV_TAG})"
              echo "to_commit=$(git rev-parse ${TAG})"
              echo "patch_sha256=$(sha256sum "${PATCH_FILE}" | awk '{print $1}')"
              echo "patch_bytes=$(wc -c < "${PATCH_FILE}")"
              echo "patch_files=$(git diff --name-only "${PREV_TAG}..${TAG}" | wc -l)"
            } >> "${CHECK_LOG}"

            if git apply --check --whitespace=nowarn "${PATCH_FILE}" > "${CHECK_LOG}.direct" 2>&1; then
              echo "COMPATIBLE=${TAG} mode=direct" | tee -a ../logs/05-cip-compatibility.log
              cat "${CHECK_LOG}.direct" >> "${CHECK_LOG}"
              git apply --index --whitespace=nowarn "${PATCH_FILE}" > ../logs/05-cip-apply.log 2>&1
              LAST_APPLY_MODE="direct"
              SELECTED="${TAG}"
              PREV_TAG="${TAG}"
              echo "APPLIED=${TAG} mode=direct" | tee -a ../logs/05-cip-chain.log
              git diff --check | tee ../logs/05-cip-diff-check.log
              continue
            fi

            echo "DIRECT_INCOMPATIBLE=${TAG}" | tee -a ../logs/05-cip-compatibility.log
            cat "${CHECK_LOG}.direct" >> "${CHECK_LOG}"

            # Git --3way --check can exit 0 while reporting a textual conflict;
            # V11 therefore rejects any conflict/error marker in the preflight log.
            if git apply --3way --check --whitespace=nowarn "${PATCH_FILE}" > "${THREEWAY_LOG}" 2>&1; then
              if ! grep -Eiq 'with conflicts|CONFLICT|error:|does not apply|patch failed' "${THREEWAY_LOG}"; then
                echo "COMPATIBLE=${TAG} mode=3way" | tee -a ../logs/05-cip-compatibility.log
                cat "${THREEWAY_LOG}" >> "${CHECK_LOG}"
                git apply --3way --index --whitespace=nowarn "${PATCH_FILE}" > ../logs/05-cip-apply.log 2>&1
                LAST_APPLY_MODE="3way"
                SELECTED="${TAG}"
                PREV_TAG="${TAG}"
                echo "APPLIED=${TAG} mode=3way" | tee -a ../logs/05-cip-chain.log
                git diff --check | tee ../logs/05-cip-diff-check.log
                continue
              fi
            fi

            {
              echo "INCOMPATIBLE=${TAG}"
              echo "=== direct ==="
              cat "${CHECK_LOG}.direct"
              echo "=== 3way ==="
              cat "${THREEWAY_LOG}"
            } | tee -a ../logs/05-cip-compatibility.log
            cp "${THREEWAY_LOG}" "../logs/cip-checks/${TAG}.result.log"
            echo "STOPPED_AT=${SELECTED} failed_candidate=${TAG}" | tee -a ../logs/05-cip-chain.log
            break
          done

          # A clean baseline is always required; failure before 133 is fatal.
          test "${SELECTED}" != "${BASELINE_CIP}" || {
            echo "[ERROR] No CIP delta could be applied to the LG baseline." | tee ../logs/05-cip-failure.log
            exit 1
          }

          CIP_TARGET="${SELECTED}"
          echo "CIP_TARGET=${CIP_TARGET}" >> "$GITHUB_ENV"
          git diff --binary "${BASELINE_CIP}..${CIP_TARGET}" > ../logs/cip-selected.patch
          sha256sum ../logs/cip-selected.patch | tee ../logs/cip-selected.sha256
          {
            echo "CIP_BASELINE=${BASELINE_CIP}"
            echo "CIP_TARGET=${CIP_TARGET}"
            echo "final_apply_mode=${LAST_APPLY_MODE}"
            echo "baseline_commit=$(git rev-parse ${BASELINE_CIP})"
            echo "target_commit=$(git rev-parse ${CIP_TARGET})"
            echo "target_subject=$(git show -s --format=%s ${CIP_TARGET})"
            echo "target_tree=$(git rev-parse ${CIP_TARGET}^{tree})"
            echo "kernel_version=$(make -s kernelversion)"
            git diff --stat "${BASELINE_CIP}..${CIP_TARGET}" || true
          } | tee ../logs/05-cip-version.log

          echo "[OK] Maximum clean incremental CIP level reached: ${CIP_TARGET}"
          echo "[INFO] If 136 stopped at an earlier tag, its exact conflict is preserved in logs/cip-checks/."
          echo "::endgroup::"

      - name: "6. Integrate KernelSU-Next v3.3.0 (SUSFS-enabled fork)"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[6/15] KernelSU-Next ${KSU_VERSION} (${KSU_SUSFS_FORK_OWNER}/${KSU_SUSFS_FORK_REPO}@${KSU_SUSFS_FORK_BRANCH})"
          cd kernel

          # V24: replicate the official setup.sh's driver-dir detection, symlink, and
          # Makefile/Kconfig wiring by hand, because the official setup.sh hardcodes
          # OWNER=REPO="KernelSU-Next" internally -- downloading that script from any
          # fork does NOT change which repo it clones. We clone the fork ourselves instead.
          if test -d common/drivers; then DRIVER_DIR=common/drivers
          elif test -d drivers; then DRIVER_DIR=drivers
          else echo '[ERROR] "drivers/" directory not found.'; exit 127
          fi
          DRIVER_MAKEFILE="${DRIVER_DIR}/Makefile"
          DRIVER_KCONFIG="${DRIVER_DIR}/Kconfig"

          git clone --branch "${KSU_SUSFS_FORK_BRANCH}" --single-branch \
            "https://github.com/${KSU_SUSFS_FORK_OWNER}/${KSU_SUSFS_FORK_REPO}" KernelSU-Next

          ln -sf "$(realpath --relative-to="${DRIVER_DIR}" "$(pwd)/KernelSU-Next/kernel")" "${DRIVER_DIR}/kernelsu"
          grep -q "kernelsu" "${DRIVER_MAKEFILE}" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "${DRIVER_MAKEFILE}"
          grep -q 'source "drivers/kernelsu/Kconfig"' "${DRIVER_KCONFIG}" || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" "${DRIVER_KCONFIG}"

          test -d KernelSU-Next
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          # Kconfig declares symbols as "config KSU"; it does not need the literal
          # string "CONFIG_KSU" inside the source Kconfig file.
          grep -Eq '^[[:space:]]*config[[:space:]]+KSU([[:space:]]|$)' drivers/kernelsu/Kconfig
          # V24/V25: this fork's dev-susfs branch must additionally declare config KSU_SUSFS
          # in the same Kconfig -- this is the whole reason for switching forks. Fail loudly
          # here rather than hundreds of lines later in Step 7 if that ever stops being true.
          grep -Eq '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' drivers/kernelsu/Kconfig

          KSU_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          KSU_TAG="$(git -C KernelSU-Next describe --tags 2>/dev/null || true)"
          {
            echo "requested=${KSU_VERSION}"
            echo "fork=${KSU_SUSFS_FORK_OWNER}/${KSU_SUSFS_FORK_REPO}@${KSU_SUSFS_FORK_BRANCH}"
            echo "resolved_describe=${KSU_TAG}"
            echo "resolved_commit=${KSU_COMMIT}"
            echo "kconfig_symbol=KSU"
            echo "kconfig_symbol=KSU_SUSFS"
            echo "symlink=$(readlink drivers/kernelsu)"
          } | tee ../logs/06-kernelsu-resolved.txt
          echo "[OK] KernelSU-Next ${KSU_VERSION} (SUSFS fork, ${KSU_SUSFS_FORK_BRANCH}@${KSU_COMMIT}) pinned integration"
