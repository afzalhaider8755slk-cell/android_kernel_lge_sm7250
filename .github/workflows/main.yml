# Drop-in VENDOR job replacement for main.yml
# Purpose: prevent the exact failure seen in run 33280669252:
# GitHub runner died with "No space left on device" before V11 artifact upload.
# Keep the existing KERNEL and DTBO jobs unchanged.

  vendor:
    name: "VENDOR — LM-G900/caymanlm Android-16 QPR2 compatibility build"
    # IMPORTANT: a standard ubuntu-24.04 GitHub-hosted runner has only 14 GB SSD.
    # For a real Android 16 vendor build use a self-hosted/larger runner label here.
    # Example: runs-on: [self-hosted, linux, x64, android16-150gb]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VENDOR_ROOT: ${{ github.workspace }}/ci-diagnostics/vendor
      ANDROID_ROOT: ${{ runner.temp }}/android
    steps:
      - name: "V00 • Create diagnostics BEFORE any risky operation"
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$VENDOR_ROOT" "$ANDROID_ROOT"
          : > "$VENDOR_ROOT/00-vendor-full.log"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "runner=${RUNNER_NAME}"
            echo "os=${RUNNER_OS}"
            echo "device=LM-G900"
            echo "codename=caymanlm"
            echo "target=Android 16 QPR2 / API 36"
            date -u +%FT%TZ
            echo
            df -hT
            echo
            df -ih
          } | tee -a "$VENDOR_ROOT/00-vendor-full.log" "$VENDOR_ROOT/00-context.txt"

      - name: "V01 • Aggressive runner cleanup + disk budget gate"
        shell: bash
        run: |
          set -u -o pipefail
          log="$VENDOR_ROOT/01-disk-preflight.log"
          {
            echo "=== BEFORE CLEANUP ==="
            df -hT
            echo "=== TOP LEVEL USAGE ==="
            sudo du -xhd1 / 2>/dev/null | sort -h | tail -30 || true
            echo "=== APT CLEANUP ==="
          } | tee -a "$log" "$VENDOR_ROOT/00-vendor-full.log"

          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* || true
          rm -rf "$RUNNER_TEMP"/* || true
          rm -rf ~/.cache/* || true
          rm -rf ~/.npm ~/.cargo/registry ~/.cache/pip || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images/* || true
          sudo rm -rf /usr/local/share/powershell /usr/local/lib/node_modules || true

          sudo apt-get clean || true
          sync

          {
            echo "=== AFTER CLEANUP ==="
            df -hT
            avail_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
            echo "available_kb=$avail_kb"
            # Android 16 source + vendor build needs substantially more than the
            # standard runner can safely provide. Refuse early instead of letting
            # the GitHub runner itself die and lose the final diagnostics artifact.
            if [ "$avail_kb" -lt 18000000 ]; then
              echo "::error::Insufficient disk headroom: ${avail_kb} KB free; need >=18 GB before repo sync."
              echo "::error::Standard GitHub-hosted ubuntu runners expose only 14 GB SSD."
              echo "::error::Use a self-hosted/larger runner with >=75 GB SSD for this Android 16 vendor job."
              exit 1
            fi
          } | tee -a "$log" "$VENDOR_ROOT/00-vendor-full.log"

      - name: "V02 • Checkpoint diagnostics before source checkout"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-VENDOR-PREFLIGHT-${{ github.run_id }}"
          path: ci-diagnostics/vendor/**
          if-no-files-found: warn
          retention-days: 7

      - name: "V03 • Checkout workflow source"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: "V04 • Install Android 16 build dependencies without wasting disk"
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gperf \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools unzip xsltproc \
            zip zstd python3 python3-pip python3-venv device-tree-compiler \
            lzip libtinfo6
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          df -hT | tee "$VENDOR_ROOT/03-disk-after-deps.txt"

      - name: "V05 • Initialize repo with partial clone and immutable local manifest"
        shell: bash
        run: |
          set -u -o pipefail
          log="$VENDOR_ROOT/04-repo-init-sync.log"
          exec > >(tee -a "$log" "$VENDOR_ROOT/00-vendor-full.log") 2>&1

          mkdir -p "$ANDROID_ROOT"
          cd "$ANDROID_ROOT"
          git clone --depth=1 https://gerrit.googlesource.com/git-repo repo
          export PATH="$PWD/repo:$PATH"

          repo init -u "${{ inputs.android_manifest_url || 'https://github.com/LineageOS/android.git' }}" \
            -b "${{ inputs.android_manifest_branch || 'lineage-23.2' }}" \
            --depth=1 --partial-clone --clone-filter=blob:none

          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/g900emw.xml <<'XML'
          <manifest>
            <remote name="github" fetch="https://github.com/" />
            <project name="lge-qcom-dev/android_device_lge_caymanlm"
                     path="device/lge/caymanlm" remote="github" revision="lineage-23.2" />
            <project name="lge-qcom-dev/android_device_lge_sm7250-common"
                     path="device/lge/sm7250-common" remote="github" revision="lineage-23.2" />
            <project name="lge-qcom-dev/proprietary_vendor_lge_caymanlm"
                     path="vendor/lge/caymanlm" remote="github" revision="lineage-23.2" />
            <project name="lge-qcom-dev/proprietary_vendor_lge_sm7250-common"
                     path="vendor/lge/sm7250-common" remote="github" revision="lineage-23.2" />
          </manifest>
          XML
          cp .repo/local_manifests/g900emw.xml "$VENDOR_ROOT/04-local-manifest.xml"

          # Low parallelism keeps peak temporary storage lower and avoids the
          # runner filling multiple packfiles simultaneously.
          repo sync -c --current-branch --force-sync --no-clone-bundle --no-tags \
            --partial-clone --clone-filter=blob:none --prune -j2 2>&1

          repo manifest -r > "$VENDOR_ROOT/05-manifest-revisions.xml"
          df -hT
          du -sh .repo device vendor 2>/dev/null || true

      - name: "V06 • Verify trees and capture source state"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ANDROID_ROOT"
          {
            for p in device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm vendor/lge/sm7250-common; do
              test -d "$p"
              echo "[$p]"
              git -C "$p" rev-parse HEAD || true
            done
            test -f device/lge/caymanlm/BoardConfig.mk
            test -f device/lge/caymanlm/device.mk
            test -f vendor/lge/caymanlm/caymanlm-vendor.mk
            test -d vendor/lge/caymanlm/proprietary/vendor
          } 2>&1 | tee "$VENDOR_ROOT/06-tree-state.log" -a "$VENDOR_ROOT/00-vendor-full.log"

      - name: "V07 • Free .repo storage only after manifest is frozen"
        shell: bash
        run: |
          set -u -o pipefail
          cd "$ANDROID_ROOT"
          # The build consumes the checked-out source tree, not repo metadata.
          # Removing .repo after manifest capture is the key disk-saving measure.
          du -sh .repo 2>/dev/null | tee "$VENDOR_ROOT/07-repo-size-before.txt" || true
          rm -rf .repo
          sync
          {
            echo "repo metadata removed after manifest freeze"
            df -hT
          } | tee "$VENDOR_ROOT/07-repo-prune.log" -a "$VENDOR_ROOT/00-vendor-full.log"

      - name: "V08 • Normalize LM-G900 identity and audit required hardware"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ANDROID_ROOT"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('device/lge/caymanlm/lineage_caymanlm.mk')
          s = p.read_text()
          s, n = re.subn(r'(?m)^PRODUCT_MODEL := .*$', 'PRODUCT_MODEL := LM-G900', s, count=1)
          if n != 1:
              raise SystemExit('PRODUCT_MODEL line not found exactly once')
          if 'ro.product.vendor.model=LM-G900' not in s:
              s = s.replace('PRODUCT_MODEL := LM-G900',
                            'PRODUCT_MODEL := LM-G900\nPRODUCT_VENDOR_PROPERTIES += \\\n ro.product.vendor.model=LM-G900 \\\n ro.vendor.product.model=LM-G900', 1)
          p.write_text(s)
          PY
          {
            echo '=== mandatory hardware markers ==='
            grep -RniE 'fingerprint|biometric|egis|goodix|fpc|vibrator|haptic|dsds|dual.?sim|radio|ril|audio|tinyalsa|mixer|ims|epdg|wfc|wifi.?calling|iwlan' \
              device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm vendor/lge/sm7250-common \
              | head -500 || true
          } | tee "$VENDOR_ROOT/08-hardware-audit.log" -a "$VENDOR_ROOT/00-vendor-full.log"

      - name: "V09 • Prepare Android build environment"
        shell: bash
        run: |
          set -u -o pipefail
          cd "$ANDROID_ROOT"
          {
            source build/envsetup.sh
            lunch lineage_caymanlm-userdebug
            env | grep -E '^(TARGET_|OUT_DIR|ANDROID_BUILD_TOP|SOONG_|PRODUCT_)' | sort || true
          } 2>&1 | tee "$VENDOR_ROOT/09-envsetup-lunch.log" -a "$VENDOR_ROOT/00-vendor-full.log"

      - name: "V10 • Build vendor.img"
        shell: bash
        run: |
          set -o pipefail
          cd "$ANDROID_ROOT"
          source build/envsetup.sh
          lunch lineage_caymanlm-userdebug
          # Keep the complete build transcript. PIPESTATUS preserves the real
          # m/vendorimage exit status instead of tee's status.
          m vendorimage -j2 2>&1 | tee "$VENDOR_ROOT/10-vendor-build.log" -a "$VENDOR_ROOT/00-vendor-full.log"
          rc=${PIPESTATUS[0]}
          echo "vendorimage_exit=$rc" | tee "$VENDOR_ROOT/10-vendor-build-exit.txt" -a "$VENDOR_ROOT/00-vendor-full.log"
          exit "$rc"

      - name: "V11 • Verify vendor.img + VINTF + LM-G900 properties"
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ANDROID_ROOT"
          OUT="out/target/product/caymanlm"
          test -s "$OUT/vendor.img"
          sha256sum "$OUT/vendor.img" | tee "$VENDOR_ROOT/11-vendor.sha256"
          file "$OUT/vendor.img" | tee "$VENDOR_ROOT/11-vendor-file.txt"
          test -s "$OUT/vendor/build.prop"
          grep -q '^ro.product.vendor.model=LM-G900$' "$OUT/vendor/build.prop"
          grep -q '^ro.vendor.product.model=LM-G900$' "$OUT/vendor/build.prop"
          find "$OUT" -type f \( -name '*manifest*.xml' -o -name '*compatibility*.xml' -o -name 'vintf*.xml' \) -print | sort | tee "$VENDOR_ROOT/12-vintf-files.txt"

      - name: "V12 • Package vendor.img"
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/vendor"
          cp "$ANDROID_ROOT/out/target/product/caymanlm/vendor.img" "$GITHUB_WORKSPACE/artifacts/vendor/LM-G900-Android16QPR2-vendor.img"
          sha256sum "$GITHUB_WORKSPACE/artifacts/vendor/LM-G900-Android16QPR2-vendor.img" > "$GITHUB_WORKSPACE/artifacts/vendor/vendor.img.sha256"
          (cd "$GITHUB_WORKSPACE/artifacts/vendor" && zip -9 "$GITHUB_WORKSPACE/LM-G900-Android16QPR2-vendor.zip" LM-G900-Android16QPR2-vendor.img vendor.img.sha256)

      - name: "V13 • FINALIZE complete vendor diagnostics"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          {
            echo "=== FINAL VENDOR STATUS ==="
            date -u +%FT%TZ
            echo "job_status=${{ job.status }}"
            df -hT
            echo "--- files ---"
            find "$VENDOR_ROOT" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          } | tee -a "$VENDOR_ROOT/00-vendor-full.log" "$VENDOR_ROOT/99-final-status.txt"
          # Never delete diagnostics here.
          sync

      - name: "V14 • Upload COMPLETE vendor log + diagnostics even on failure"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-VENDOR-${{ github.run_id }}"
          path: |
            ci-diagnostics/vendor/**
            ${{ runner.temp }}/android/out/target/product/caymanlm/vendor.img
            artifacts/vendor/**
            LM-G900-Android16QPR2-vendor.zip
          if-no-files-found: warn
          retention-days: 30
