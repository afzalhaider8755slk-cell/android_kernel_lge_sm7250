name: LM-G900 Kernel + DTBO Fixed

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVICE: LM-G900
  CODENAME: caymanlm
  DEFCONFIG: vendor/caymanlm_defconfig
  KERNEL_OUT: kernel/out
  DTBO_OUT: dtbo/out
  CLANG_VERSION: r510928
  FEATURES: SukiSU-Ultra+KPM+SUSFS+WALT+SchedTune+ZRAM+LTO
  HARDWARE: Fingerprint+Vibration+DualSIM+Audio+VoWiFi
  ANDROID_TARGET: Android 16 QPR2 GSI / API 36

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex git libssl-dev \
            libelf-dev lz4 cpio rsync unzip zip python3

      - name: Setup clang
        run: |
          set -e
          mkdir -p "$HOME/clang"
          curl -L --fail --retry 3 \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-Linux-X86_64.tar.xz" \
            -o "$HOME/clang/llvm.tar.xz"
          tar -xf "$HOME/clang/llvm.tar.xz" -C "$HOME/clang"
          echo "CLANG_BIN=$HOME/clang/LLVM-20.1.8-Linux-X86_64/bin" >> "$GITHUB_ENV"
          echo "$HOME/clang/LLVM-20.1.8-Linux-X86_64/bin" >> "$GITHUB_PATH"

      - name: Preserve DTBO fix only
        run: |
          set -e
          FILE="arch/arm64/boot/dts/vendor/lge/Makefile"
          test -f "$FILE"
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = '$(notdir $(wildcard echo $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))'
          new = '$(notdir $(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Setup 5 - normalize defconfig target
        shell: bash
        run: |
          set -euo pipefail

          # IMPORTANT:
          # make's defconfig target is relative to arch/arm64/configs.
          # Never pass arch/arm64/configs/... as the target.
          DEFCONFIG_TARGET="${DEFCONFIG#arch/arm64/configs/}"
          DEFCONFIG_TARGET="${DEFCONFIG_TARGET#configs/}"
          DEFCONFIG_TARGET="${DEFCONFIG_TARGET#/}"

          case "$DEFCONFIG_TARGET" in
            arch/arm64/configs/*|/../*|../*)
              echo "Invalid defconfig target: $DEFCONFIG_TARGET"
              exit 1
              ;;
          esac

          test -f "arch/arm64/configs/$DEFCONFIG_TARGET"
          echo "DEFCONFIG_TARGET=$DEFCONFIG_TARGET" >> "$GITHUB_ENV"
          echo "Using defconfig target: $DEFCONFIG_TARGET"

      - name: Kernel defconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$KERNEL_OUT"

          make -C . O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG_TARGET"

          test -f "$KERNEL_OUT/.config"

      - name: Kernel build
        shell: bash
        run: |
          set -euo pipefail

          make -C . O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)"

      - name: DTBO build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DTBO_OUT"

          make -C . O="$DTBO_OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG_TARGET"

          make -C . O="$DTBO_OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbo.img -j"$(nproc)"

      - name: Verify no duplicated defconfig path
        run: |
          set -e
          ! grep -R \
            --exclude-dir=.git \
            --exclude-dir=out \
            -n \
            'arch/arm64/configs/arch/arm64/configs' \
            .github scripts Makefile arch 2>/dev/null

      - name: Verify required target and DTBO fix
        run: |
          set -e
          grep -Fq '$(notdir $(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))' \
            arch/arm64/boot/dts/vendor/lge/Makefile
          test -f "arch/arm64/configs/$DEFCONFIG_TARGET"

      - name: Package diagnostics
        run: |
          set -e
          mkdir -p ci-diagnostics/final
          {
            echo "device=$DEVICE"
            echo "codename=$CODENAME"
            echo "android_target=$ANDROID_TARGET"
            echo "defconfig_target=$DEFCONFIG_TARGET"
            echo "features=$FEATURES"
            echo "hardware=$HARDWARE"
            echo "dtbo_fix=preserved"
            echo "defconfig_path_duplication_fix=enabled"
          } > ci-diagnostics/final/build-summary.txt

      - name: Upload kernel and DTBO
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-Kernel-DTBO-Fixed
          path: |
            arch/arm64/boot/Image*
            arch/arm64/boot/dtbo.img
            dtbo.img
            ci-diagnostics/
          if-no-files-found: warn
