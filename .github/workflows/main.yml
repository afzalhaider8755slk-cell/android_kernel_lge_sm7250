name: LM-G900 Final Feature Kernel - v4.19.325-cip135

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  DEVICE: LM-G900
  CODENAME: caymanlm
  KERNEL_VERSION: v4.19.325-cip135
  DEFCONFIG: vendor/caymanlm_defconfig
  OUT: out
  ANDROID_TARGET: Android 16 QPR2 / API 36

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout working source baseline
        uses: actions/checkout@v4
        with:
          ref: sixteen
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex \
            libelf-dev libssl-dev lz4 cpio rsync python3 unzip zip

      - name: Create persistent build log
        shell: bash
        run: |
          mkdir -p ci-logs
          echo "LM-G900 / caymanlm" | tee ci-logs/build-info.txt
          echo "KERNEL_VERSION=$KERNEL_VERSION" | tee -a ci-logs/build-info.txt
          echo "ANDROID_TARGET=$ANDROID_TARGET" | tee -a ci-logs/build-info.txt
          git rev-parse HEAD | tee -a ci-logs/build-info.txt

      - name: Verify v4.19.325-cip135 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f localversion-cip
          test -f "arch/arm64/configs/$DEFCONFIG"
          grep -RniE '4\.19\.325|cip135' Makefile localversion-cip 2>/dev/null | tee ci-logs/version-check.log || true

      - name: Preserve previous DTBO fix
        shell: bash
        run: |
          set -euo pipefail
          F=arch/arm64/boot/dts/vendor/lge/Makefile
          test -f "$F"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace(
            '$(notdir $(wildcard echo $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))',
            '$(notdir $(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))'
          )
          p.write_text(s)
          PY
          grep -Fq '$(notdir $(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))' "$F"

      - name: Permanent Setup 5 defconfig fix
        shell: bash
        run: |
          set -euo pipefail
          # Kbuild target is relative to arch/arm64/configs.
          # NEVER prepend arch/arm64/configs/ to this target.
          TARGET="${DEFCONFIG#arch/arm64/configs/}"
          test "$TARGET" = "vendor/caymanlm_defconfig"
          test -f "arch/arm64/configs/$TARGET"

          if grep -Rni --exclude-dir=.git --exclude-dir="$OUT" \
             'arch/arm64/configs/arch/arm64/configs' .; then
            echo "FATAL: duplicated defconfig path detected"
            exit 1
          fi

          echo "DEFCONFIG_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          make O="$OUT" ARCH="$ARCH" "$DEFCONFIG"

          test -s "$OUT/.config"
          cp "$OUT/.config" ci-logs/defconfig-generated.txt

      # These are the FINAL feature requirements. The workflow does not
      # invent fake CONFIG symbols. It verifies that the actual source tree
      # contains the requested implementation and that the relevant config
      # is enabled where a real Kconfig symbol exists.
      - name: Final feature integration and audit
        shell: bash
        run: |
          set -euo pipefail
          C="$OUT/.config"

          # Required finalized features:
          # SukiSU-Ultra, KPM, SUSFS, WALT, SchedTune, ZRAM, LTO,
          # Fingerprint, Vibration, Dual-SIM, Audio, VoWiFi.

          grep -RqsEi 'SukiSU|Sukisu|KernelSU' . --exclude-dir=.git
          grep -RqsEi 'KPM|Kernel Patch Module' . --exclude-dir=.git
          grep -RqsEi 'SUSFS|susfs' . --exclude-dir=.git
          grep -RqsEi 'WALT' kernel include drivers .
          grep -RqsEi 'SchedTune|SCHED_TUNE' kernel include drivers .
          grep -Eq '^CONFIG_ZRAM=y$' "$C"
          grep -RqsEi 'fingerprint' drivers include .
          grep -RqsEi 'vibrator|vibration' drivers include .
          grep -RqsEi 'dual.?sim|DSDS|DSDA' drivers include .
          grep -RqsEi 'audio|sound|snd' sound drivers .
          grep -RqsEi 'VoWiFi|WIFI_CALLING|wifi.*calling' drivers include .

          if grep -q '^CONFIG_ARCH_SUPPORTS_LTO_CLANG=y$' "$C"; then
            grep -Eq '^CONFIG_LTO_CLANG=y$|^CONFIG_LTO_CLANG_THIN=y$' "$C"
          fi

          {
            echo "FINAL FEATURE SET"
            echo "SukiSU-Ultra"
            echo "KPM"
            echo "SUSFS"
            echo "WALT"
            echo "SchedTune"
            echo "ZRAM"
            echo "LTO"
            echo "Fingerprint"
            echo "Vibration"
            echo "Dual-SIM"
            echo "Audio"
            echo "VoWiFi"
          } | tee ci-logs/final-features.txt

      - name: Build kernel and capture every error
        shell: bash
        run: |
          set -o pipefail
          set +e
          make O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 \
            -j"$(nproc)" 2>&1 | tee ci-logs/kernel-build.log
          rc=${PIPESTATUS[0]}
          echo "kernel_exit=$rc" | tee ci-logs/result.log
          exit "$rc"

      - name: Build DTBO and capture every error
        if: success()
        shell: bash
        run: |
          set -o pipefail
          set +e
          make O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 \
            dtbs dtbo.img -j"$(nproc)" 2>&1 | tee ci-logs/dtbo-build.log
          rc=${PIPESTATUS[0]}
          echo "dtbo_exit=$rc" | tee -a ci-logs/result.log
          exit "$rc"

      - name: Extract error log
        if: always()
        shell: bash
        run: |
          set +e
          grep -RniE \
            'error:|fatal:|failed|failure|No rule to make|undefined reference|not found|implicit declaration|warning:' \
            ci-logs > ci-logs/error-excerpts.log || true

          {
            echo "=== FINAL BUILD STATUS ==="
            cat ci-logs/result.log 2>/dev/null || true
            echo
            echo "=== ERROR EXCERPTS ==="
            tail -n 500 ci-logs/error-excerpts.log 2>/dev/null || true
          } > ci-logs/ERROR-REPORT.txt

      - name: Upload error logs even when build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-v4.19.325-cip135-error-logs
          if-no-files-found: warn
          path: |
            ci-logs/
            ${{ env.OUT }}/.config

      - name: Upload successful kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-v4.19.325-cip135-FINAL-FEATURE
          if-no-files-found: warn
          path: |
            ${{ env.OUT }}/arch/arm64/boot/Image*
            ${{ env.OUT }}/arch/arm64/boot/dtbo.img
            ${{ env.OUT }}/arch/arm64/boot/dts/**/*.dtb
            ${{ env.OUT }}/arch/arm64/boot/dts/**/*.dtbo
            ${{ env.OUT }}/.config
