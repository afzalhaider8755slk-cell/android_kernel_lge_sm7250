      - name: 12A - Pre-Build HID + QCACLD Argument-Length Compatibility Audit
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$DIAG_DIR/12A-hid-argmax-compatibility.log"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          echo "========== PRE-BUILD HID + QCACLD ARGUMENT-LENGTH AUDIT =========="
          echo "[LOCKED] Setup 10A is not modified by this step."
          echo "[LOCKED] Setup 19 SELinux/SukiSU source boundaries are not modified by this step."

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------------------------------------------------------------
          # USB HID: source-derived compatibility fix only.
          # V80 diagnostics proved f_hid.c accesses hid_descriptor.desc[0],
          # while this checked-out tree's struct hid_descriptor provides the
          # named rpt_desc member instead.  Upstream stable changed these
          # accesses from desc[0] to rpt_desc; do not alter include/linux/hid.h.
          # ---------------------------------------------------------------
          hid_h = Path('include/linux/hid.h')
          f_hid = Path('drivers/usb/gadget/function/f_hid.c')
          if not hid_h.is_file() or not f_hid.is_file():
              raise SystemExit('[FAIL] Required HID source/header is missing.')
          hh = hid_h.read_text(errors='replace')
          fh = f_hid.read_text(errors='replace')
          m = re.search(r'struct\s+hid_descriptor\s*\{(?P<body>.*?)\}\s*__attribute__', hh, re.S)
          if not m:
              m = re.search(r'struct\s+hid_descriptor\s*\{(?P<body>.*?)\}', hh, re.S)
          if not m:
              raise SystemExit('[FAIL] Could not locate actual struct hid_descriptor in checked-out include/linux/hid.h.')
          body = m.group('body')
          has_rpt = bool(re.search(r'\\brpt_desc\\b', body))
          has_desc = bool(re.search(r'\\bdesc\\s*\\[', body))
          print(f'[EVIDENCE] hid_descriptor: rpt_desc={has_rpt} desc_array={has_desc}')
          if not has_rpt:
              raise SystemExit('[FAIL] Tree does not expose hid_descriptor.rpt_desc; refusing speculative HID mutation.')
          old1 = 'hidg_desc_copy.desc[0].bDescriptorType'
          old2 = 'hidg_desc_copy.desc[0].wDescriptorLength'
          old3 = 'hidg_desc.desc[0].bDescriptorType'
          old4 = 'hidg_desc.desc[0].wDescriptorLength'
          active_old = sum(fh.count(x) for x in (old1,old2,old3,old4))
          print(f'[AUDIT] f_hid.c active old desc accesses={active_old}')
          if active_old:
              fh2 = fh.replace(old1, 'hidg_desc_copy.rpt_desc.bDescriptorType')
              fh2 = fh2.replace(old2, 'hidg_desc_copy.rpt_desc.wDescriptorLength')
              fh2 = fh2.replace(old3, 'hidg_desc.rpt_desc.bDescriptorType')
              fh2 = fh2.replace(old4, 'hidg_desc.rpt_desc.wDescriptorLength')
              f_hid.write_text(fh2)
              fh = fh2
              print('[FIXED] Updated only the four obsolete f_hid.c desc[0] accesses to rpt_desc.')
          if any(x in fh for x in (old1,old2,old3,old4)):
              raise SystemExit('[FAIL] Obsolete HID descriptor accesses remain after exact fix.')
          if fh.count('hidg_desc_copy.rpt_desc.bDescriptorType') != 1 or fh.count('hidg_desc_copy.rpt_desc.wDescriptorLength') != 1:
              raise SystemExit('[FAIL] HID GET_DESCRIPTOR fix did not produce exactly one expected assignment pair.')
          if fh.count('hidg_desc.rpt_desc.bDescriptorType') != 1 or fh.count('hidg_desc.rpt_desc.wDescriptorLength') != 1:
              raise SystemExit('[FAIL] HID bind fix did not produce exactly one expected assignment pair.')
          print('[PASS] HID source/header compatibility boundary verified.')

          # ---------------------------------------------------------------
          # QCACLD argument-length: source-derived Kbuild fix.
          # V80 reached a Qualcomm qcacld-3.0 compilation command and failed
          # in /bin/sh with E2BIG. The 4.19 kbuild cc recipe expands c_flags
          # directly into the shell command. Qualcomm's driver contributes
          # a very large include/define set. Use GNU make's file function to
          # write c_flags into a per-object response file, then invoke clang
          # with @response-file ONLY for qcacld-3.0 sources. This preserves
          # every compiler flag; it changes transport, not feature selection.
          # ---------------------------------------------------------------
          mb = Path('scripts/Makefile.build')
          if not mb.is_file():
              raise SystemExit('[FAIL] scripts/Makefile.build is missing.')
          ms = mb.read_text(errors='replace')
          old_nomod = 'cmd_cc_o_c = $(CC) $(c_flags) -c -o $@ $<'
          old_mod = 'cmd_cc_o_c = $(CC) $(c_flags) -c -o $(@D)/.tmp_$(@F) $<'
          count_nomod = ms.count(old_nomod)
          count_mod = ms.count(old_mod)
          print(f'[AUDIT] standard cmd_cc_o_c definitions={count_nomod}, MODVERSIONS definition={count_mod}')
          if count_nomod != 1 or count_mod != 1:
              raise SystemExit('[FAIL] Unexpected 4.19 cmd_cc_o_c layout; refusing speculative Makefile.build rewrite.')
          new_nomod = 'cmd_cc_o_c = $(if $(findstring /qcacld-3.0/,$<),$(file >$@.kbuild.rsp,$(c_flags))$(CC) @$@.kbuild.rsp -c -o $@ $<,$(CC) $(c_flags) -c -o $@ $<)'
          new_mod = 'cmd_cc_o_c = $(if $(findstring /qcacld-3.0/,$<),$(file >$(@D)/.$(@F).kbuild.rsp,$(c_flags))$(CC) @$(@D)/.$(@F).kbuild.rsp -c -o $(@D)/.tmp_$(@F) $<,$(CC) $(c_flags) -c -o $(@D)/.tmp_$(@F) $<)'
          ms2 = ms.replace(old_nomod, new_nomod, 1).replace(old_mod, new_mod, 1)
          mb.write_text(ms2)
          if new_nomod not in ms2 or new_mod not in ms2:
              raise SystemExit('[FAIL] Response-file kbuild rules were not installed exactly.')
          print('[FIXED] qcacld-3.0 C compilation now transports complete c_flags through Clang response files.')
          print('[PASS] Non-qcacld compilation path remains byte-for-byte unchanged in cmd_cc_o_c.')
          print('[PASS] All original c_flags are preserved; no WLAN feature/config flag was removed.')
          print('===============================================================')
          PY

          echo "[PASS] Setup 12A completed; 10A/Setup-19 feature configuration was not reopened."

      - name: 19 - Build Kernel (Full Log to Artifact)
        shell: bash
        run: |
          set +e
          FULL_LOG="$GITHUB_WORKSPACE/kernel-build-full.log"
          ERROR_LOG="$DIAG_DIR/12-build-errors.log"
          TAIL_LOG="$DIAG_DIR/12-build-tail.log"
          SUMMARY_LOG="$DIAG_DIR/12-build-summary.log"

          : > "$FULL_LOG"
          : > "$ERROR_LOG"
          : > "$TAIL_LOG"
          : > "$SUMMARY_LOG"

          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          # ------------------------------------------------------------
          # SETUP 19 — EXACT CURRENT COMPATIBILITY BOUNDARIES AFTER PRE-BUILD MATRIX
          # The full build reached drivers/kernelsu/selinux/sepolicy.c and
          # failed because ksu_hash_for_each() was using flex_array_get_ptr()
          # against Linux 4.19 SELinux hashtab->htable (struct hashtab_node **).
          # 10A is NOT changed/reopened here. Only this exact Setup 19
          # compatibility boundary is corrected before compilation.
          # ------------------------------------------------------------
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/setup19_sepolicy_hashtab_fix.py"
          chmod 700 "$RUNNER_TEMP/setup19_sepolicy_hashtab_fix.py"
          python3 -m py_compile "$RUNNER_TEMP/setup19_sepolicy_hashtab_fix.py"
          python3 "$RUNNER_TEMP/setup19_sepolicy_hashtab_fix.py" drivers/kernelsu/selinux/sepolicy.c
          # Hard verification for Setup 19: fail here if the exact compiler
          # boundary was not corrected. This does not reopen or modify 10A.
          grep -qF 'for (cur = node_ptr[i]; cur; cur = cur->next)' drivers/kernelsu/selinux/sepolicy.c
          if grep -qF 'for (cur = flex_array_get_ptr(node_ptr, i); cur; cur = cur->next)' drivers/kernelsu/selinux/sepolicy.c; then
            echo '[FAIL] Setup 19: obsolete flex_array hashtab iteration remains'
            exit 1
          fi
          echo '[PASS] Setup 19 exact hashtab compiler boundary verified before kernel build.'
          # ------------------------------------------------------------
          # SETUP 19 — Linux 4.19 dispatcher scheduler-header dependency
          # The current build reached drivers/kernelsu/supercall/dispatch.c.
          # Linux 4.19 keeps tasklist_lock/init_task in sched/task.h and
          # task_pgrp()/task_session() in sched/signal.h; sched/signal.h includes
          # sched/task.h. Add only this explicit header dependency to the actual
          # dispatcher compiled by Kbuild. Setup 10A is not reopened or modified.
          # ------------------------------------------------------------
          DISPATCH_C="drivers/kernelsu/supercall/dispatch.c"
          test -f "$DISPATCH_C"
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/setup19_dispatch_sched_header.py"
          chmod 700 "$RUNNER_TEMP/setup19_dispatch_sched_header.py"
          python3 -m py_compile "$RUNNER_TEMP/setup19_dispatch_sched_header.py"
          python3 "$RUNNER_TEMP/setup19_dispatch_sched_header.py" "$DISPATCH_C"
          # Hard verification: exactly one scheduler signal header must be in
          # the actual dispatcher compiled by Kbuild. No scheduler API/source
          # modification is performed.
          test "$(grep -cF '#include <linux/sched/signal.h>' "$DISPATCH_C")" -eq 1
          grep -qF '#include <linux/sched/signal.h>' "$DISPATCH_C"
          # ------------------------------------------------------------
          # SETUP 19 — Linux 4.19 task_work API boundary
          # The actual Kbuild source is drivers/kernelsu/supercall/supercall.c.
          # Linux 4.19 declares task_work_add(..., bool), not the newer
          # enum task_work_notify_mode/TWA_RESUME API. The current compiler
          # failure is exactly supercall.c:98: undeclared TWA_RESUME.
          # This change is limited to the actual compiled file. Setup 10A
          # is not reopened, rewritten, or otherwise modified.
          # ------------------------------------------------------------
          SUPERCALL_C="drivers/kernelsu/supercall/supercall.c"
          test -f "$SUPERCALL_C"
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/setup19_taskwork_419_fix.py"
          chmod 700 "$RUNNER_TEMP/setup19_taskwork_419_fix.py"
          python3 -m py_compile "$RUNNER_TEMP/setup19_taskwork_419_fix.py"
          python3 "$RUNNER_TEMP/setup19_taskwork_419_fix.py" "$SUPERCALL_C"
          test "$(grep -cF 'task_work_add(current, &tw->cb, true)' "$SUPERCALL_C")" -eq 1
          if grep -qF 'task_work_add(current, &tw->cb, TWA_RESUME)' "$SUPERCALL_C"; then
            echo '[FAIL] Setup 19: obsolete TWA_RESUME task_work API remains'
            exit 1
          fi
          echo '[PASS] Setup 19 Linux 4.19 task_work bool API verified in actual Kbuild supercall.c.'

          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

          # Build-only compatibility fixes are scoped to the exact stock
          # source directories/files that failed with this Clang 20 build.
          # No global KCFLAGS and no unrelated kernel features are added.
          #
          # Qualcomm clock trace.h uses TRACE_INCLUDE_PATH "."; the include
          # path is scoped to drivers/clk/qcom via Kbuild ccflags-y.
          # Camera cam_trace.h needs the cam_req_mgr local header path.
          # fault-inject.c and lgenfc.c receive source-level compatibility
          # corrections for this kernel/compiler combination.
          # ------------------------------------------------------------
          # 1) Qualcomm clock trace include path
          # ------------------------------------------------------------
          QCOM_MAKE="drivers/clk/qcom/Makefile"
          test -f "$QCOM_MAKE"

          if ! grep -qF 'ccflags-y += -I$(src)' "$QCOM_MAKE"; then
            {
              echo
              echo "# Build compatibility: local TRACE_INCLUDE_PATH for qcom trace.h"
              echo 'ccflags-y += -I$(src)'
            } >> "$QCOM_MAKE"
          fi

          echo "[PASS] Qualcomm trace include path scoped to drivers/clk/qcom."
          grep -nF 'ccflags-y += -I$(src)' "$QCOM_MAKE"

          # ------------------------------------------------------------
          # 2) Camera cam_req_mgr local include path
          #    cam_trace.h includes cam_req_mgr_core.h by name.
          #    The header is part of the stock source tree; only the
          #    local Kbuild include path is missing for this Clang build.
          # ------------------------------------------------------------
          CAM_MAKE="techpack/camera/drivers/cam_req_mgr/Makefile"
          test -f "$CAM_MAKE"

          if ! grep -qF 'ccflags-y += -I$(src)' "$CAM_MAKE"; then
            {
              echo
              echo "# Build compatibility: cam_trace.h local cam_req_mgr headers"
              echo 'ccflags-y += -I$(src)'
            } >> "$CAM_MAKE"
          fi

          echo "[PASS] Camera cam_req_mgr include path scoped to cam_req_mgr."
          grep -nF 'ccflags-y += -I$(src)' "$CAM_MAKE"

          # ------------------------------------------------------------
          # 3) Camera cam_cci local include path
          #    cam_sensor_i2c.h includes cam_cci_dev.h by name.
          #    The header is part of the stock source tree; only the
          #    cam_cci directory needs to be added to its local search
          #    path for this Clang build.
          # ------------------------------------------------------------
          CCI_MAKE="techpack/camera/drivers/cam_sensor_module/cam_cci/Makefile"
          test -f "$CCI_MAKE"

          if ! grep -qF 'ccflags-y += -I$(src)' "$CCI_MAKE"; then
            {
              echo
              echo "# Build compatibility: local cam_cci headers"
              echo 'ccflags-y += -I$(src)'
            } >> "$CCI_MAKE"
          fi

          echo "[PASS] Camera cam_cci include path scoped to cam_cci."
          grep -nF 'ccflags-y += -I$(src)' "$CCI_MAKE"

          # ------------------------------------------------------------
          # 4) Camera cam_actuator local include path
          #    lgit_onsemi_actuator_utils.c includes cam_actuator_core.h
          #    by name. The header is already in the stock tree.
          # ------------------------------------------------------------
          ACT_MAKE="techpack/camera/drivers/cam_sensor_module/cam_actuator/Makefile"
          test -f "$ACT_MAKE"

          if ! grep -qF 'ccflags-y += -I$(src)' "$ACT_MAKE"; then
            {
              echo
              echo "# Build compatibility: local cam_actuator headers"
              echo 'ccflags-y += -I$(src)'
            } >> "$ACT_MAKE"
          fi

          echo "[PASS] Camera cam_actuator include path scoped to cam_actuator."
          grep -nF 'ccflags-y += -I$(src)' "$ACT_MAKE"

          # ------------------------------------------------------------
          # 5) Camera cam_ois nested LGIT/Onsemi include path
          #
          # The current build log reaches:
          #   lgit_s5kgw1_onsemi_ois.c:10:10:
          #   fatal error: 'cam_ois_core.h' file not found
          #
          # The source file is under cam_ois/lgit_onsemi/, while the
          # stock cam_ois_core.h belongs to the parent cam_ois directory.
          # Kbuild does not automatically search that parent directory
          # for a quoted header from the nested subdirectory.
          #
          # Add ONLY the parent cam_ois directory to the nested
          # lgit_onsemi Kbuild include path. No header is downloaded,
          # copied, replaced, or generated.
          # ------------------------------------------------------------
          OIS_DIR="techpack/camera/drivers/cam_sensor_module/cam_ois"
          OIS_SUBDIR="$OIS_DIR/lgit_onsemi"
          OIS_PARENT_MAKE="$OIS_DIR/Makefile"
          OIS_HEADER="$OIS_DIR/cam_ois_core.h"

          test -d "$OIS_DIR"
          test -d "$OIS_SUBDIR"
          test -f "$OIS_PARENT_MAKE"
          test -f "$OIS_HEADER"

          # Kbuild's subdir-ccflags-y is intentionally used in the
          # parent cam_ois Kbuild file. Unlike ccflags-y in lgit_onsemi,
          # this applies to cam_ois itself and every nested OIS directory,
          # including trees that use a Kbuild file instead of Makefile.
          if ! grep -qF 'subdir-ccflags-y += -I$(src)' "$OIS_PARENT_MAKE"; then
            {
              echo
              echo "# Build compatibility: stock cam_ois headers for nested OIS drivers"
              echo 'subdir-ccflags-y += -I$(src)'
            } >> "$OIS_PARENT_MAKE"
          fi

          echo "[PASS] Stock cam_ois_core.h exists:"
          ls -lh "$OIS_HEADER"
          echo "[PASS] cam_ois parent include path propagated to nested OIS:"
          grep -nF 'subdir-ccflags-y += -I$(src)' "$OIS_PARENT_MAKE"

          # ------------------------------------------------------------
          # 6) Stock LG display nested-header include path
          #
          # Current build reaches:
          #   techpack/display/msm/lge/cm/lge_color_manager.c:19:10:
          #   fatal error: 'lge_dsi_panel_def.h' file not found
          #
          # The stock header lives in the parent:
          #   techpack/display/msm/lge/lge_dsi_panel_def.h
          #
          # The stock lge/Makefile supplies several display include paths,
          # but not its own directory. Propagate ONLY the stock lge
          # directory to its nested display objects.
          #
          # No header is downloaded/copied/replaced and no display feature
          # is enabled or disabled.
          # ------------------------------------------------------------
          LGE_DISPLAY_DIR="techpack/display/msm/lge"
          LGE_DISPLAY_MAKE="$LGE_DISPLAY_DIR/Makefile"
          LGE_DISPLAY_HEADER="$LGE_DISPLAY_DIR/lge_dsi_panel_def.h"

          test -d "$LGE_DISPLAY_DIR"
          test -f "$LGE_DISPLAY_MAKE"
          test -f "$LGE_DISPLAY_HEADER"

          if ! grep -qF 'subdir-ccflags-y += -I$(src)' "$LGE_DISPLAY_MAKE"; then
            {
              echo
              echo "# Build compatibility: stock LG display parent headers for nested objects"
              echo 'subdir-ccflags-y += -I$(src)'
            } >> "$LGE_DISPLAY_MAKE"
          fi

          echo "[PASS] Stock LG display header exists:"
          ls -lh "$LGE_DISPLAY_HEADER"
          echo "[PASS] LG display parent include path propagated to nested objects:"
          grep -nF 'subdir-ccflags-y += -I$(src)' "$LGE_DISPLAY_MAKE"

          # ------------------------------------------------------------
          # 6) Stock display PLL trace-header include path
          #
          # Current build log reaches:
          #   techpack/display/pll/dsi_pll_10nm.c
          #   -> techpack/display/pll/pll_trace.h
          #   -> include/trace/define_trace.h
          #   -> fatal error: './pll_trace.h' file not found
          #
          # The trace header is in the same stock directory:
          #   techpack/display/pll/pll_trace.h
          #
          # define_trace.h expands TRACE_INCLUDE_PATH relative to the
          # compiler include search path. Add ONLY the stock PLL directory
          # to its own nested build. Do not copy/download another header.
          # ------------------------------------------------------------
          PLL_DIR="techpack/display/pll"
          PLL_MAKE="$PLL_DIR/Makefile"
          PLL_HEADER="$PLL_DIR/pll_trace.h"

          test -d "$PLL_DIR"
          test -f "$PLL_MAKE"
          test -f "$PLL_HEADER"

          if ! grep -qF 'subdir-ccflags-y += -I$(src)' "$PLL_MAKE"; then
            {
              echo
              echo "# Build compatibility: stock PLL trace header for nested display PLL objects"
              echo 'subdir-ccflags-y += -I$(src)'
            } >> "$PLL_MAKE"
          fi

          echo "[PASS] Stock PLL trace header exists:"
          ls -lh "$PLL_HEADER"
          echo "[PASS] PLL parent include path propagated:"
          grep -nF 'subdir-ccflags-y += -I$(src)' "$PLL_MAKE"

          # ------------------------------------------------------------
          # 6) Linux 4.19 fault-inject WRITE_ONCE compatibility
          #    Stock 4.19 compiler headers define WRITE_ONCE() as a
          #    statement-style macro. This source used it as an expression:
          #       if (!WRITE_ONCE(current->fail_nth, fail_nth - 1))
          #    Keep the same behavior with an explicit decrement/store/test.
          # ------------------------------------------------------------
          FAULT_SRC="lib/fault-inject.c"
          test -f "$FAULT_SRC"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/fault-inject.c")
          s = p.read_text()

          old = """\t\tif (fail_nth) {\n\t\t\tif (!WRITE_ONCE(current->fail_nth, fail_nth - 1))\n\t\t\t\tgoto fail;\n\n\t\t\treturn false;\n\t\t}"""

          new = """\t\tif (fail_nth) {\n\t\t\tfail_nth--;\n\t\t\tWRITE_ONCE(current->fail_nth, fail_nth);\n\t\t\tif (!fail_nth)\n\t\t\t\tgoto fail;\n\n\t\t\treturn false;\n\t\t}"""

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print("[FIXED] lib/fault-inject.c WRITE_ONCE expression compatibility")
          elif "fail_nth--;" in s and "WRITE_ONCE(current->fail_nth, fail_nth);" in s:
              print("[PASS] lib/fault-inject.c already uses statement-compatible form")
          else:
              raise SystemExit("Expected fault-inject fail_nth block was not found")
          PY

          # ------------------------------------------------------------
          # 8) Linux 4.19/modern-maccess compatibility for kernel/power/qos.c
          #
          # DIAGNOSTIC (Diagnostics 33):
          #   kernel/power/qos.c:191:3: error:
          #   implicit declaration of function 'probe_kernel_read'
          #
          # IMPORTANT: this is NOT fixed by adding <linux/uaccess.h>.
          # The actual checked LG source header at HEAD 90f583e83d4b...
          # declares copy_from_kernel_nofault(), not probe_kernel_read().
          # The matching mm/maccess.c implementation exports
          # copy_from_kernel_nofault() and mm/maccess.o is built-in.
          # Therefore use the API that actually exists in THIS tree.
          #
          # Evidence checked before this workflow change:
          #   include/linux/uaccess.h -> copy_from_kernel_nofault() declaration
          #   mm/maccess.c             -> implementation + EXPORT_SYMBOL_GPL
          #   build log                -> mm/maccess.o is compiled and archived
          #   qos.c                    -> the call is only in CONFIG_LGE_PM_DEBUG
          #
          # Scope: replace ONLY probe_kernel_read() calls in kernel/power/qos.c.
          # No global API rename, no behavior/config change, no DTB/DTBO.
          # ------------------------------------------------------------
          QOS_SRC="kernel/power/qos.c"
          QOS_UACCESS="include/linux/uaccess.h"
          QOS_MACCESS="mm/maccess.c"
          test -f "$QOS_SRC"
          test -f "$QOS_UACCESS"
          test -f "$QOS_MACCESS"

          python3 - <<'PY'
          from pathlib import Path
          import re

          qos = Path("kernel/power/qos.c")
          uaccess = Path("include/linux/uaccess.h")
          maccess = Path("mm/maccess.c")

          s = qos.read_text()
          uh = uaccess.read_text()
          mh = maccess.read_text()

          if "long copy_from_kernel_nofault(void *dst, const void *src, size_t size);" not in uh:
              raise SystemExit("AUTHORITATIVE CHECK FAILED: copy_from_kernel_nofault declaration is missing from include/linux/uaccess.h")
          if "long copy_from_kernel_nofault(void *dst, const void *src, size_t size)" not in mh:
              raise SystemExit("AUTHORITATIVE CHECK FAILED: copy_from_kernel_nofault implementation is missing from mm/maccess.c")
          if "EXPORT_SYMBOL_GPL(copy_from_kernel_nofault);" not in mh:
              raise SystemExit("AUTHORITATIVE CHECK FAILED: copy_from_kernel_nofault is not exported by mm/maccess.c")

          # Only operate on actual function calls, not comments or unrelated text.
          calls = len(re.findall(r"\bprobe_kernel_read\s*\(", s))
          if calls:
              s2 = re.sub(r"\bprobe_kernel_read(?=\s*\()", "copy_from_kernel_nofault", s)
              qos.write_text(s2)
              print(f"[FIXED] kernel/power/qos.c: replaced {calls} probe_kernel_read() call(s) with copy_from_kernel_nofault()")
          else:
              if "copy_from_kernel_nofault(" in s:
                  print("[PASS] kernel/power/qos.c already uses copy_from_kernel_nofault()")
              else:
                  raise SystemExit("EXPECTED QOS CALL NOT FOUND: neither probe_kernel_read() nor copy_from_kernel_nofault() exists")

          # Verify no executable call to the obsolete API remains.
          remaining = len(re.findall(r"\bprobe_kernel_read\s*\(", qos.read_text()))
          if remaining:
              raise SystemExit(f"VERIFY FAILED: {remaining} probe_kernel_read() call(s) remain in kernel/power/qos.c")
          print("[PASS] qos.c uses the API actually provided by this kernel tree.")
          print("[PASS] copy_from_kernel_nofault() declaration + implementation + export verified.")
          PY

          echo "[PASS] QOS maccess compatibility fix is source-evidence-backed; no DTB/DTBO touched."

          # ------------------------------------------------------------
          # 7) LG NFC prototype compatibility
          #    Clang 20 treats -Wstrict-prototypes as an error for this
          #    old-style zero-argument declaration. Make it explicit.
          # ------------------------------------------------------------
          NFC_SRC="drivers/nfc/lge/lgenfc.c"
          test -f "$NFC_SRC"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("drivers/nfc/lge/lgenfc.c")
          s = p.read_text()

          old = "enum NfcChip getChipset() {"
          new = "enum NfcChip getChipset(void) {"

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print("[FIXED] drivers/nfc/lge/lgenfc.c strict-prototype compatibility")
          elif "enum NfcChip getChipset(void)" in s:
              print("[PASS] lgenfc.c prototype already fixed")
          else:
              raise SystemExit("Expected getChipset() declaration was not found")
          PY

          echo
          echo "[PASS] Scoped source compatibility fixes prepared."

          echo "=========================================="
          echo "CURRENT ERROR POLICY: NO SPECULATIVE XFRM FIX"
          echo "The latest reported failure is in net/xfrm, but no exact compiler diagnostic is embedded here."
          echo "Therefore this workflow does NOT modify net/xfrm. The next failure must be diagnosed from the full build log."
          echo "=========================================="
          echo "STARTING STOCK + SUKISU + KPM BUILD"
          echo "Full V=1 stdout/stderr -> kernel-build-full.log"
          echo "=========================================="
          echo "clang=$(command -v clang)"
          echo "ld.lld=$(command -v ld.lld)"
          clang --version | sed -n '1,2p'
          ld.lld --version | sed -n '1,2p'

          START=$(date +%s)

          # KERNEL-ONLY MODE (V47): build the pure compressed arm64 kernel.
          # Do NOT invoke the top-level default target and do NOT invoke dtbs.
          # This deliberately avoids DTB/DTBO compilation for this run.
          # All previously fixed kernel/SukiSU/SUSFS/BBG/Maphide compatibility
          # work remains untouched; only the build target is narrowed to Image.gz.
          test -f arch/arm64/boot/Makefile
          if ! grep -qE '(^|[[:space:]])Image\.gz([[:space:]$:])' arch/arm64/boot/Makefile; then
            echo "[FAIL] arch/arm64/boot/Makefile does not expose the pure Image.gz target."
            exit 2
          fi
          echo "[INFO] DTB/DTBO build disabled for V47 kernel-only run."
          echo "[INFO] Building target: Image.gz"

          # Full V=1 compiler stdout/stderr is ARTIFACT-ONLY. Live Activity receives only concise source-file progress plus a heartbeat.
          : > "$FULL_LOG"
          stdbuf -oL -eL make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            -j"$(nproc)" \
            V=1 \
            WERROR=0 \
            Image.gz \
            > "$FULL_LOG" 2>&1 &
          BUILD_PID=$!

          ( tail -n 0 -F "$FULL_LOG" 2>/dev/null | while IFS= read -r line; do
              if [[ "$line" =~ -c[[:space:]]+-o[[:space:]]+[^[:space:]]+[[:space:]]+([^[:space:]]+\.(c|S|s))$ ]]; then
                printf '[BUILD] compiling %s\n' "${BASH_REMATCH[1]}"
              elif [[ "$line" =~ (^|[[:space:]])(LD|AR|OBJCOPY|OBJDUMP|LZ4|GZIP|BZIP2)[[:space:]]+([^[:space:]]+) ]]; then
                printf '[BUILD] %s %s\n' "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"
              fi
            done ) &
          MONITOR_PID=$!

          while kill -0 "$BUILD_PID" 2>/dev/null; do
            sleep 30
            if kill -0 "$BUILD_PID" 2>/dev/null; then
              echo "[BUILD-HEARTBEAT] $(date -u '+%Y-%m-%dT%H:%M:%SZ') elapsed=$(( $(date +%s) - START ))s"
              echo "[BUILD-HEARTBEAT] full V=1 output is artifact-only: $(wc -c < "$FULL_LOG") bytes / $(wc -l < "$FULL_LOG") lines"
            fi
          done

          set +e
          wait "$BUILD_PID"
          BUILD_STATUS=$?
          set -e
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true

          END=$(date +%s)
          ELAPSED=$((END-START))

          {
            echo "BUILD_STATUS=$BUILD_STATUS"
            echo "BUILD_TIME_SECONDS=$ELAPSED"
            echo "BUILD_TIME_HUMAN=$((ELAPSED/60))m $((ELAPSED%60))s"
            echo "BUILD_LOG_BYTES=$(wc -c < "$FULL_LOG")"
            echo "BUILD_LOG_LINES=$(wc -l < "$FULL_LOG")"
          } | tee "$SUMMARY_LOG"

          if [ "$BUILD_STATUS" -eq 137 ] || [ "$BUILD_STATUS" -eq 143 ]; then
            echo "[DIAG] Build process was terminated by signal (status=$BUILD_STATUS); no compiler diagnostic was emitted in the captured log."
            echo "[DIAG] This is not being converted into a speculative source fix. Runner/resource termination must be distinguished from a compiler error."
          elif [ "$BUILD_STATUS" -ne 0 ]; then
            echo "[DIAG] Non-zero make exit status=$BUILD_STATUS; compiler diagnostics below are authoritative."
          fi

          grep -nEi \
            'fatal error:|error:|undefined reference|undeclared|implicit declaration|invalid|unknown argument|unknown warning|No such file|No rule to make target|recipe for target|Error [0-9]+|make\[[0-9]+\]: \*\*\*' \
            "$FULL_LOG" | tail -250 > "$ERROR_LOG" || true

          tail -300 "$FULL_LOG" > "$TAIL_LOG" || true

          echo
          echo "===== COMPACT BUILD ERROR SUMMARY ====="
          if [ -s "$ERROR_LOG" ]; then
            tail -30 "$ERROR_LOG" || true
          else
            echo "No compiler-error pattern found."
          fi

          echo
          echo "===== LAST 40 BUILD LINES ====="
          tail -40 "$FULL_LOG" || true

          if [ "$BUILD_STATUS" -eq 0 ]; then
            KERNEL_IMAGE=""
            for candidate in               arch/arm64/boot/Image.gz; do
              if [ -s "$candidate" ]; then
                KERNEL_IMAGE="$candidate"
                break
              fi
            done
            test -n "$KERNEL_IMAGE"
            echo "KERNEL_IMAGE=$KERNEL_IMAGE"
            echo "KERNEL BUILD SUCCESSFUL"
          else
            echo "KERNEL BUILD FAILED - FULL LOG SAVED AS ARTIFACT"
          fi

          exit "$BUILD_STATUS"

      - name: 19A - Package Kernel + AnyKernel3 (OrangeFox Flashable, No DTB/DTBO)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/19A-packaging.log"
          : > "$LOG"
          {
            mkdir -p artifacts/kernel

            KERNEL_IMAGE="arch/arm64/boot/Image.gz"
            test -s "$KERNEL_IMAGE"

            cp -f "$KERNEL_IMAGE" artifacts/kernel/Image.gz
            sha256sum "$KERNEL_IMAGE" > artifacts/kernel/kernel.sha256

            echo "========== AnyKernel3 / OrangeFox-FLASHABLE PACKAGE =========="
            echo "[INFO] Kernel-only mode: Image.gz only."
            echo "[INFO] DTB/DTBO are intentionally NOT built, copied, embedded, or packaged."

            # Use the official AnyKernel3 template. It is a flashable ZIP
            # framework intended to be installed from Android recoveries such
            # as OrangeFox. This is NOT an OrangeFox recovery image itself.
            AK3_DIR="$RUNNER_TEMP/AnyKernel3"
            rm -rf "$AK3_DIR"
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR"

            # Record the exact AK3 revision used by this run.
            AK3_COMMIT="$(git -C "$AK3_DIR" rev-parse HEAD)"
            echo "AnyKernel3 repository: https://github.com/osm0sis/AnyKernel3"
            echo "AnyKernel3 commit: $AK3_COMMIT"

            # Put the pure kernel in the AK3 root. No Image.gz-dtb is created,
            # because this workflow intentionally does not build a DTB.
            cp -f "$KERNEL_IMAGE" "$AK3_DIR/Image.gz"

            # Replace the sample/template installer with a minimal device
            # configuration for LG Velvet LM-G900/G900EMW. The AK3 core script
            # remains upstream; only the device properties and boot action are
            # defined here. No DTB/DTBO is referenced.
            cat > "$AK3_DIR/anykernel.sh" <<'AK3SCRIPT'
          properties() { '
          kernel.string=LM-G900 SukiSU-Ultra 4.2.0 + KPM + SUSFS 1.5.5-4.19 + CIP135
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          device.name2=G900EMW
          device.name3=LM-G900
          device.name4=G900
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # LG Velvet boot target.
          # AnyKernel3 auto-detects the active slot when applicable.
          BLOCK=boot
          IS_SLOT_DEVICE=auto
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          # Import official AnyKernel3 core.
          . tools/ak3-core.sh

          # Dump/split the existing boot image, replace the kernel with the
          # supplied Image.gz, and write the resulting boot image back.
          dump_boot
          write_boot
          AK3SCRIPT

            chmod 0755 "$AK3_DIR/anykernel.sh"

            # Hard validation: this package must contain the kernel, AK3 core,
            # and device checks, but no DTB/DTBO payloads.
            test -s "$AK3_DIR/Image.gz"
            test -s "$AK3_DIR/tools/ak3-core.sh"
            test -x "$AK3_DIR/anykernel.sh"

            grep -q 'device.name1=caymanlm' "$AK3_DIR/anykernel.sh"
            grep -q 'device.name2=G900EMW' "$AK3_DIR/anykernel.sh"
            grep -q 'device.name3=LM-G900' "$AK3_DIR/anykernel.sh"
            grep -qE '^BLOCK=boot$' "$AK3_DIR/anykernel.sh"
            grep -qE '^IS_SLOT_DEVICE=auto$' "$AK3_DIR/anykernel.sh"
            grep -q 'dump_boot' "$AK3_DIR/anykernel.sh"
            grep -q 'write_boot' "$AK3_DIR/anykernel.sh"

            if find "$AK3_DIR" -type f \( -name '*.dtb' -o -name '*.dtbo' -o -name 'dtb' -o -name 'dtbo' \) -print -quit | grep -q .; then
              echo "[FAIL] AnyKernel3 package unexpectedly contains DTB/DTBO payload."
              exit 1
            fi

            # LICENSE is retained because the upstream AK3 template requires
            # it for binary redistribution.
            test -s "$AK3_DIR/LICENSE"

            (
              cd "$AK3_DIR"
              rm -rf .git
              zip -r9 "$GITHUB_WORKSPACE/artifacts/LM-G900-SukiSU-4.2.0-V32.1-AnyKernel3-OrangeFox-Flashable.zip" . \
                -x 'README.md' '*placeholder' >/dev/null
            )

            test -s "$GITHUB_WORKSPACE/artifacts/LM-G900-SukiSU-4.2.0-V32.1-AnyKernel3-OrangeFox-Flashable.zip"

            # Keep a second direct kernel-only ZIP as well.
            (
              cd artifacts/kernel
              zip -9 "$GITHUB_WORKSPACE/artifacts/LM-G900-V32.1-Kernel-Only-4.19.325-cip135.zip" \
                Image.gz kernel.sha256 >/dev/null
            )

            cp -f "$GITHUB_WORKSPACE/artifacts/LM-G900-SukiSU-4.2.0-V32.1-AnyKernel3-OrangeFox-Flashable.zip" artifacts/kernel/

            echo "[PASS] Kernel image packaged."
            echo "[PASS] AnyKernel3 package prepared for flashing from OrangeFox/recovery."
            echo "[PASS] No DTB/DTBO was built or packaged."
            echo "[NOTE] This ZIP is an AnyKernel3 kernel-flash package, not an OrangeFox recovery image."
            find artifacts -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 19 - Final Configuration and Artifact Check
        if: always()
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/13-final-check.log"
          : > "$LOG"
          {
            echo "========== FINAL CHECK =========="
            date -u
            echo
            echo "Kernel version:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile || true
            echo
            echo "Required config:"
            grep -E '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|KALLSYMS|KALLSYMS_ALL|KPM|SECURITY|SECURITY_SELINUX)=' .config 2>/dev/null || true
            echo
            echo "Kernel image candidates:"
            ls -lh arch/arm64/boot/Image.gz-dtb arch/arm64/boot/Image.gz arch/arm64/boot/Image 2>&1 || true
            echo
            echo "DTB/DTBO build mode: DISABLED (kernel-only run)"
            echo
            echo "Build errors (last 40):"
            tail -40 "$DIAG_DIR/12-build-errors.log" 2>/dev/null || true
            echo
            echo "Build tail (last 40):"
            tail -40 "$DIAG_DIR/12-build-tail.log" 2>/dev/null || true
          } > "$LOG" 2>&1
          cat "$LOG"
          exit 0

      - name: 19 - Stage Complete Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic-artifact
          # Universal failure capture: collect every log and important runner state
          # even when an earlier step failed. This step is ALWAYS executed.
          mkdir -p diagnostic-artifact/runner-state
          {
            echo "========== UNIVERSAL FAILURE SNAPSHOT =========="
            date -u
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "workspace=$GITHUB_WORKSPACE"
            echo
            echo "===== DISK ====="
            df -h 2>&1 || true
            echo
            echo "===== MEMORY ====="
            free -h 2>&1 || true
            echo
            echo "===== KERNEL BUILD PROCESS/FILES ====="
            find . -maxdepth 4 -type f \(-name '*.log' -o -name 'Image' -o -name 'Image.gz' -o -name 'vmlinux' \) -printf '%p %s bytes\n' 2>/dev/null | sort || true
          } > diagnostic-artifact/runner-state/universal-failure-snapshot.txt 2>&1

          printf '%s\n' "========== DIAGNOSTIC COLLECTION ==========" > diagnostic-artifact/runner-state/diagnostic-collection.log
          date -u >> diagnostic-artifact/runner-state/diagnostic-collection.log
          echo "Shell: ${BASH_VERSION:-unknown}" >> diagnostic-artifact/runner-state/diagnostic-collection.log
          echo "diag_dir=$DIAG_DIR" >> diagnostic-artifact/runner-state/diagnostic-collection.log
          echo "workspace=$GITHUB_WORKSPACE" >> diagnostic-artifact/runner-state/diagnostic-collection.log
          echo "Existing CI logs:" >> diagnostic-artifact/runner-state/diagnostic-collection.log
          find "$DIAG_DIR" -type f -printf '%p %s bytes\n' 2>/dev/null | sort >> diagnostic-artifact/runner-state/diagnostic-collection.log || true
          cp -f kernel-build-full.log diagnostic-artifact/12-build-full.log 2>/dev/null || true
          cp -f .config diagnostic-artifact/final.config 2>/dev/null || true
          cp -f "$GITHUB_STEP_SUMMARY" diagnostic-artifact/runner-state/github-step-summary.md 2>/dev/null || true
          cp -f "$GITHUB_ENV" diagnostic-artifact/runner-state/github-env.snapshot 2>/dev/null || true
          cp -f sukisu-integration-note.txt diagnostic-artifact/sukisu-integration-note.txt 2>/dev/null || true
          mkdir -p diagnostic-artifact/ci-logs
          cp -a "$DIAG_DIR"/. diagnostic-artifact/ci-logs/ 2>/dev/null || true
          git status --short > diagnostic-artifact/git-status.txt 2>&1 || true
          git rev-parse HEAD > diagnostic-artifact/kernel-head.txt 2>&1 || true

          # Preserve the exact complete diagnostic directory as an additional archive.
          # This is not a substitute for individual logs; it is a second recovery path.
          if command -v tar >/dev/null 2>&1; then
            tar -czf diagnostic-artifact/all-ci-logs.tar.gz \
              "$DIAG_DIR" diagnostic-artifact/runner-state kernel-build-full.log 2>/dev/null || true
          fi
          {
            echo "GitHub Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Date: $(date -u)"
            echo "SukiSU release tag: $SUKISU_REF"
            echo "SukiSU release commit (short): $SUKISU_RELEASE_COMMIT"
            echo "External root-hiding kernel patchset: workflow-defined Maphide/BBG checks"
            echo "External root-hiding userspace package: not part of kernel build"
            echo "Lineage branch: $LINEAGE_BRANCH"
            echo "CIP target: $CIP_REF"
            echo
            find diagnostic-artifact -type f -printf '%p %s bytes\n' | sort
          } > diagnostic-artifact/MANIFEST.txt
          exit 0

      - name: 19A-DIAG - Upload Emergency Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LG-Velvet-G900-V32.1-EMERGENCY-Diagnostics
          path: diagnostic-artifact
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: 19B - Upload Kernel-Only Artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LG-Velvet-G900-V32.1-SukiSU-4.2.0-Kernel-Only
          path: artifacts
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: 19 - Upload Complete Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LG-Velvet-G900-SukiSU-4.2.0-Diagnostics
          path: diagnostic-artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: 19C - Upload Raw Kernel Image
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LG-Velvet-G900-SukiSU-4.2.0-Raw-Kernel
          path: arch/arm64/boot/Image.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
