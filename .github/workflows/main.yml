name: LM-G900 FINAL - Manual SukiSU Ultra + KPM + SUSFS + LTO

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  DEVICE: LM-G900
  CODENAME: caymanlm
  BRANCH: sixteen
  KERNEL_VERSION: v4.19.325-cip135
  DEFCONFIG: vendor/caymanlm_defconfig
  ANDROID_TARGET: Android 16 QPR2 / API 36
  SUSFS_BRANCH: susfs-main

jobs:
  kernel:
    name: Kernel - manual source integration
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout working LM-G900 source
        uses: actions/checkout@v4
        with:
          ref: sixteen
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex \
            libelf-dev libssl-dev lz4 cpio rsync python3 git curl \
            clang lld llvm

      - name: Logging
        shell: bash
        run: |
          mkdir -p ci-logs
          exec > >(tee -a ci-logs/full.log) 2>&1
          echo "DEVICE=$DEVICE"
          echo "CODENAME=$CODENAME"
          echo "KERNEL_VERSION=$KERNEL_VERSION"
          echo "BRANCH=$BRANCH"
          echo "ANDROID_TARGET=$ANDROID_TARGET"
          git rev-parse HEAD

      - name: Verify exact working baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 19$' Makefile
          grep -q '^SUBLEVEL = 325$' Makefile
          test -f "arch/arm64/configs/$DEFCONFIG"
          test -d drivers
          echo "-cip135" > localversion-cip
          grep -q -- '-cip135' localversion-cip

      - name: Preserve previous Setup 5 fix
        shell: bash
        run: |
          set -euo pipefail
          test "$DEFCONFIG" = "vendor/caymanlm_defconfig"
          test -f "arch/arm64/configs/$DEFCONFIG"
          if grep -Rni --exclude-dir=.git \
             'arch/arm64/configs/arch/arm64/configs' .; then
            echo "ERROR: duplicated defconfig path"
            exit 1
          fi

      - name: Preserve previous DTBO fix in source
        shell: bash
        run: |
          set -euo pipefail
          F=arch/arm64/boot/dts/vendor/lge/Makefile
          test -f "$F"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace(
            '$(notdir $(wildcard echo $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))',
            '$(notdir $(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))'
          )
          p.write_text(s)
          PY
          grep -Fq '$(notdir $(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))' "$F"
          ! grep -Fq 'wildcard echo' "$F"

      # ============================================================
      # MANUAL SukiSU-Ultra source integration
      # We clone the actual kernel source and wire drivers/Kernelsu
      # ourselves instead of executing setup.sh.
      # susfs-main is the integrated SUSFS branch documented by SukiSU.
      # ============================================================
      - name: Manually add SukiSU-Ultra + integrated SUSFS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf KernelSU
          git clone --depth=1 --branch "$SUSFS_BRANCH" \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU

          test -d KernelSU/kernel
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile

          rm -f drivers/kernelsu
          ln -s ../KernelSU/kernel drivers/kernelsu

          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          grep -q 'kernelsu' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          test -L drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

          {
            echo "SukiSU repository:"
            git -C KernelSU rev-parse HEAD
            echo "SukiSU branch:"
            git -C KernelSU branch --show-current || true
            echo "SUSFS source:"
            grep -RniE 'SUSFS|susfs' KernelSU/kernel | head -100 || true
          } | tee ci-logs/sukisu-source.log

      # ============================================================
      # KPM is part of SukiSU-Ultra. The official project documents:
      # CONFIG_KPM=y, plus KALLSYMS/KALLSYMS_ALL for non-GKI.
      # ============================================================
      - name: Enable real SukiSU KPM configuration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out

          make O=out ARCH=arm64 "$DEFCONFIG"
          make O=out ARCH=arm64 scripts

          CFG=out/.config
          SC=out/scripts/config

          "$SC" --enable CONFIG_KSU
          "$SC" --enable CONFIG_KPM
          "$SC" --enable CONFIG_KALLSYMS
          "$SC" --enable CONFIG_KALLSYMS_ALL

          # Non-GKI/manual hook mode.
          if grep -Rqs 'config KSU_MANUAL_HOOK' KernelSU/kernel; then
            "$SC" --enable CONFIG_KSU_MANUAL_HOOK
          fi

          # Enable every real SUSFS symbol exposed by the integrated source.
          SUSFS_KEYS="$(
            grep -RhoE 'config KSU_SUSFS_[A-Z0-9_]+' KernelSU/kernel \
              | sed 's/^config //' | sort -u
          )"
          for k in $SUSFS_KEYS; do
            "$SC" --enable "$k" 2>/dev/null || true
          done
          "$SC" --enable CONFIG_KSU_SUSFS 2>/dev/null || true

          make O=out ARCH=arm64 olddefconfig

          grep -q '^CONFIG_KSU=y$' "$CFG"
          grep -q '^CONFIG_KPM=y$' "$CFG"
          grep -q '^CONFIG_KALLSYMS=y$' "$CFG"
          grep -q '^CONFIG_KALLSYMS_ALL=y$' "$CFG"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$CFG"

      # ============================================================
      # MANUAL LTO SOURCE BACKPORT
      #
      # The LM-G900 tree is 4.19.325 but its defconfig does not expose
      # the required Clang-LTO Kconfig. We do not fake-enable CONFIG_LTO.
      #
      # Instead, obtain the documented Android common 4.19 LTO source
      # change, apply it to this source tree, then require the real
      # Kconfig/build machinery to accept LTO.
      #
      # If the patch does not apply cleanly, STOP. Never silently fall
      # back to LTO_NONE.
      # ============================================================
      - name: Manually backport Android 4.19 Clang LTO source
        shell: bash
        run: |
          set -euo pipefail

          if grep -Rqs '^config LTO_CLANG' arch Kconfig lib 2>/dev/null && \
             grep -Rqs '^config LTO_NONE' arch Kconfig lib 2>/dev/null; then
            echo "LTO Kconfig infrastructure already exists; no backport needed."
          else
            rm -rf /tmp/android-common
            git clone --filter=blob:none --no-checkout \
              https://android.googlesource.com/kernel/common /tmp/android-common

            cd /tmp/android-common
            git fetch --no-tags origin \
              6b1f307bd09fa1e91520e1362e95a640809d7b26 \
              40321f254df9b7229e98e33c501e346a372e4856

            # The commits are from Android's 4.19 kernel line and contain
            # the Clang-LTO build machinery. Generate only the LTO-related
            # Makefile/Kbuild hunks instead of replacing the OEM tree.
            git show --format= --no-ext-diff \
              6b1f307bd09fa1e91520e1362e95a640809d7b26 \
              -- Makefile scripts/Makefile.build scripts/Makefile.modpost \
                 scripts/link-vmlinux.sh scripts/mod/modpost.c \
              > /tmp/lto-4.19-a.patch || true

            git show --format= --no-ext-diff \
              40321f254df9b7229e98e33c501e346a372e4856 \
              -- Makefile scripts/Makefile.build scripts/Makefile.modpost \
                 scripts/link-vmlinux.sh scripts/mod/modpost.c \
              > /tmp/lto-4.19-b.patch || true

            cd "$GITHUB_WORKSPACE"

            # Apply only if the patch is relevant and cleanly applies.
            # A failed source backport is a hard error.
            if test -s /tmp/lto-4.19-a.patch; then
              git apply --3way /tmp/lto-4.19-a.patch
            fi
            if test -s /tmp/lto-4.19-b.patch; then
              git apply --3way /tmp/lto-4.19-b.patch
            fi
          fi

          # Require real LTO Kconfig/source, never a fake config line.
          grep -Rqs '^config LTO_CLANG' arch Kconfig .config 2>/dev/null || \
            grep -Rqs '^config LTO_CLANG' arch Kconfig .
          grep -Rqs 'lto-clang-flags' Makefile
          grep -Rqs 'CONFIG_LTO_CLANG' Makefile scripts arch

      - name: Enable real Clang LTO and re-resolve config
        shell: bash
        run: |
          set -euo pipefail
          SC=out/scripts/config

          "$SC" --enable CONFIG_LTO
          "$SC" --enable CONFIG_LTO_CLANG

          if grep -Rqs 'config THINLTO' arch Kconfig; then
            "$SC" --enable CONFIG_THINLTO 2>/dev/null || true
          fi

          "$SC" --disable CONFIG_LTO_NONE 2>/dev/null || true

          make O=out ARCH=arm64 olddefconfig

          grep -q '^CONFIG_LTO=y$' out/.config
          grep -q '^CONFIG_LTO_CLANG=y$' out/.config
          ! grep -q '^CONFIG_LTO_NONE=y$' out/.config

      - name: Preserve all finalized existing device features
        shell: bash
        run: |
          set -euo pipefail
          C=out/.config

          # Existing finalized device/kernel features must remain enabled.
          grep -q '^CONFIG_SCHED_WALT=y$' "$C"
          grep -q '^CONFIG_SCHED_TUNE=y$' "$C"
          grep -q '^CONFIG_ZRAM=y$' "$C"
          grep -q '^CONFIG_INPUT_FINGERPRINT=y$' "$C"
          grep -q '^CONFIG_FPR_FPC=y$' "$C"
          grep -q '^CONFIG_VIB_DW7800=y$' "$C"
          grep -q '^CONFIG_MACH_LITO_CAYMANLM=y$'

          cp "$C" ci-logs/final.config
          grep -E '^CONFIG_(KSU|KPM|KALLSYMS|KSU_SUSFS|LTO|SCHED_WALT|SCHED_TUNE|ZRAM|INPUT_FINGERPRINT|FPR_FPC|VIB_DW7800|MACH_LITO_CAYMANLM)' \
            "$C" | tee ci-logs/final-feature-config.log

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail
          set +e
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            V=1 -j"$(nproc)" 2>&1 | tee ci-logs/kernel-build.log
          rc=${PIPESTATUS[0]}
          echo "kernel_exit=$rc" | tee ci-logs/result.log
          exit "$rc"

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-v4.19.325-cip135-SukiSU-KPM-SUSFS-LTO
          path: |
            out/arch/arm64/boot/Image*
            out/.config
            localversion-cip

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-v4.19.325-cip135-SukiSU-KPM-SUSFS-LTO-LOGS
          if-no-files-found: warn
          path: |
            ci-logs/
            out/.config

  dtbo:
    name: DTBO - Separate, unchanged feature baseline
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: sixteen
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex \
            libelf-dev libssl-dev lz4 cpio rsync python3

      - name: Verify 4.19.325 and preserve DTBO fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 19$' Makefile
          grep -q '^SUBLEVEL = 325$' Makefile
          test -f "arch/arm64/configs/$DEFCONFIG"

          F=arch/arm64/boot/dts/vendor/lge/Makefile
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace(
            '$(notdir $(wildcard echo $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))',
            '$(notdir $(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))'
          )
          p.write_text(s)
          PY
          grep -Fq '$(notdir $(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts))' "$F"
          ! grep -Fq 'wildcard echo' "$F"

          ! grep -Rni --exclude-dir=.git \
            'arch/arm64/configs/arch/arm64/configs' .

      - name: Build DTBO separately
        shell: bash
        run: |
          set -o pipefail
          set +e
          rm -rf dtbo-out
          make O=dtbo-out ARCH=arm64 "$DEFCONFIG" 2>&1 | tee dtbo-config.log
          rc=${PIPESTATUS[0]}
          test "$rc" -eq 0 || exit "$rc"

          make O=dtbo-out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            V=1 dtbs dtbo.img -j"$(nproc)" 2>&1 | tee dtbo-build.log
          rc=${PIPESTATUS[0]}
          echo "dtbo_exit=$rc" | tee dtbo-result.log
          exit "$rc"

      - name: Upload DTBO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-v4.19.325-cip135-DTBO
          path: |
            dtbo-out/arch/arm64/boot/dtbo.img
            dtbo-out/arch/arm64/boot/dts/**/*.dtb
            dtbo-out/arch/arm64/boot/dts/**/*.dtbo

      - name: Upload DTBO diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-v4.19.325-cip135-DTBO-LOGS
          if-no-files-found: warn
          path: |
            dtbo-config.log
            dtbo-build.log
            dtbo-result.log
            dtbo-out/.config
