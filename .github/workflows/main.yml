name: "LG Velvet LM-G900 • Android 16 QPR2 • Hardened Kernel + Vendor + DTBO • CIP135 FIX v12"

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Build kernel"
        required: true
        default: true
        type: boolean
      build_vendor:
        description: "Build vendor.img"
        required: true
        default: true
        type: boolean
      build_dtbo:
        description: "Build DTBO.img"
        required: true
        default: true
        type: boolean
  push:
    branches: ["sixteen"]
    paths:
      - ".github/workflows/**"
      - "arch/arm64/configs/vendor/caymanlm_defconfig"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "sound/**"
      - "techpack/**"
      - "Makefile"
      - "localversion-*"
      - "arch/arm64/boot/dts/**"

permissions:
  contents: read

env:
  DEVICE: LM-G900
  TARGET_VARIANT: G900EMW
  CODENAME: caymanlm
  KERNEL_BRANCH: sixteen
  DEFCONFIG: vendor/caymanlm_defconfig
  KERNEL_EXPECTED: "4.19.325"
  BASE_KERNEL_TAG: "v4.19.325"
  CIP_TAG: "v4.19.325-cip135"
  LLVM_VERSION: "18"
  LINEAGE_BRANCH: lineage-23.2
  DEVICE_REF: lineage-23.2
  VENDOR_REF: lineage-23.2
  COMMON_DEVICE_REF: lineage-23.2
  COMMON_VENDOR_REF: lineage-23.2
  SUKISU_REF: "4.1.3"
  SUSFS_REF: "001e69919c6271f690fd00b17e4c721c9e599152"
  SUSFS_BRANCH: kernel-4.19
  ANYKERNEL3_REF: dca9dc370838d919d56c1f59ec78b27a14a72c68
  ANDROID_MANIFEST: https://github.com/LineageOS/android.git
  DEVICE_REPO: https://github.com/lge-qcom-dev/android_device_lge_caymanlm.git
  COMMON_DEVICE_REPO: https://github.com/Sparxikle/android_device_lge_sm7250-common.git
  VENDOR_REPO: https://github.com/lge-qcom-dev/proprietary_vendor_lge_caymanlm.git
  COMMON_VENDOR_REPO: https://github.com/Sparxikle/proprietary_vendor_lge_sm7250-common.git

jobs:
  kernel:
    if: ${{ github.event_name == 'push' || inputs.build_kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "K01 • Checkout exact kernel source"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 0

      - name: "K02 • Install kernel dependencies"
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential ccache clang-18 lld-18 llvm-18 \
            libssl-dev libelf-dev libdw-dev dwarves \
            python3 python3-pip rsync patch git curl wget unzip zip xz-utils \
            device-tree-compiler cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gawk file

      - name: "K03 • Create numbered diagnostics workspace"
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics/kernel
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "device=${DEVICE}"
            echo "codename=${CODENAME}"
            echo "branch=${KERNEL_BRANCH}"
            echo "commit=$(git rev-parse HEAD)"
            echo "kernel_expected=${KERNEL_EXPECTED}-cip135"
            echo "target=Android 16 QPR2 GSI (android-16.0.0_r4)"
            echo "features=SukiSU-Ultra+KPM+SUSFS+WALT+SchedTune+ZRAM+LTO"
            echo "hardware=Fingerprint+Vibration+DualSIM+Audio+VoWiFi"
          } | tee ci-diagnostics/kernel/00-context.txt
          git status --short | tee ci-diagnostics/kernel/00-git-status-before.txt
          git log -1 --decorate --oneline | tee ci-diagnostics/kernel/00-source.txt

      - name: "K04 • Pin and verify LLVM 18 + AArch64 assembler/linker smoke test"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci-diagnostics/kernel
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          command -v clang-${LLVM_VERSION} | tee ci-diagnostics/kernel/01-clang-path.txt
          clang-${LLVM_VERSION} --version | tee ci-diagnostics/kernel/01-clang-version.txt
          ld.lld-${LLVM_VERSION} --version | tee ci-diagnostics/kernel/01-lld-version.txt
          llvm-ar-${LLVM_VERSION} --version | head -n 1 | tee ci-diagnostics/kernel/01-ar-version.txt
          llvm-nm-${LLVM_VERSION} --version | head -n 1 | tee ci-diagnostics/kernel/01-nm-version.txt
          aarch64-linux-gnu-as --version | head -n 1 | tee ci-diagnostics/kernel/01-as-version.txt
          test -x "$(command -v clang-${LLVM_VERSION})"
          test -x "$(command -v ld.lld-${LLVM_VERSION})"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/clang-smoke.c"
          clang-${LLVM_VERSION} --target=aarch64-linux-gnu -c "$RUNNER_TEMP/clang-smoke.c" -o "$RUNNER_TEMP/clang-smoke.o"
          printf '.text\n.global smoke_symbol\nsmoke_symbol:\n  nop\n' > "$RUNNER_TEMP/aarch64-smoke.S"
          clang-${LLVM_VERSION} --target=aarch64-linux-gnu -c "$RUNNER_TEMP/aarch64-smoke.S" -o "$RUNNER_TEMP/aarch64-smoke.o"
          ld.lld-${LLVM_VERSION} -r "$RUNNER_TEMP/aarch64-smoke.o" -o "$RUNNER_TEMP/aarch64-smoke-linked.o"
          file "$RUNNER_TEMP/aarch64-smoke-linked.o" | tee ci-diagnostics/kernel/01-aarch64-smoke.txt
      - name: "K05 • Baseline defconfig — diagnose before modifications"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p kernel/out
          DEF="arch/arm64/configs/${DEFCONFIG}"
          test -s "$DEF"
          sha256sum "$DEF" | tee ci-diagnostics/kernel/02-defconfig.sha256
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          make O=kernel/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} HOSTAS=clang-${LLVM_VERSION} \
            LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} NM=llvm-nm-${LLVM_VERSION} \
            OBJCOPY=llvm-objcopy-${LLVM_VERSION} OBJDUMP=llvm-objdump-${LLVM_VERSION} \
            READELF=llvm-readelf-${LLVM_VERSION} STRIP=llvm-strip-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG" 2>&1 | tee ci-diagnostics/kernel/03-defconfig.log
          rc=${PIPESTATUS[0]}
          cp kernel/out/.config ci-diagnostics/kernel/working-baseline.config 2>/dev/null || true
          exit "$rc"

      - name: "K06 • Integrate official CIP135 delta from Linux 4.19.325 — no unrelated-history merge"
        shell: bash
        run: |
          set -u
          mkdir -p ci-diagnostics/kernel
          exec > >(tee ci-diagnostics/kernel/04-cip-integration.log) 2>&1
          cd "$GITHUB_WORKSPACE"
          git config user.name "CI CIP integrator"
          git config user.email "ci@example.invalid"

          # CIP135 is explicitly released from Linux 4.19.325. We therefore apply
          # the exact upstream delta v4.19.325 -> v4.19.325-cip135 to the LG tree.
          # This avoids the previous unrelated-history/3-way-merge failure while
          # still requiring every real conflict to be resolved rather than skipped.
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git remote add cip-upstream https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          git fetch --no-tags linux-stable "refs/tags/${BASE_KERNEL_TAG}"
          git fetch --no-tags cip-upstream "refs/tags/${CIP_TAG}"
          BASE_SHA="$(git rev-parse "refs/tags/${BASE_KERNEL_TAG}")"
          CIP_SHA="$(git rev-parse "FETCH_HEAD")"
          echo "base_tag=${BASE_KERNEL_TAG}" | tee ci-diagnostics/kernel/04-cip-resolved.txt
          echo "base_commit=${BASE_SHA}" | tee -a ci-diagnostics/kernel/04-cip-resolved.txt
          echo "cip_tag=${CIP_TAG}" | tee -a ci-diagnostics/kernel/04-cip-resolved.txt
          echo "cip_commit=${CIP_SHA}" | tee -a ci-diagnostics/kernel/04-cip-resolved.txt
          git fsck --full --no-dangling 2>&1 | tee ci-diagnostics/kernel/04-cip-fsck.txt

          git rev-parse HEAD > ci-diagnostics/kernel/04-lg-before-cip.txt
          git diff --binary "${BASE_SHA}" "${CIP_SHA}" > ci-diagnostics/kernel/04-cip135.delta.patch
          test -s ci-diagnostics/kernel/04-cip135.delta.patch
          sha256sum ci-diagnostics/kernel/04-cip135.delta.patch | tee ci-diagnostics/kernel/04-cip135.delta.sha256
          git diff --stat "${BASE_SHA}" "${CIP_SHA}" | tee ci-diagnostics/kernel/04-cip135.delta-stat.txt

          set +e
          git apply --3way --index ci-diagnostics/kernel/04-cip135.delta.patch 2>&1 | tee ci-diagnostics/kernel/05-cip-apply.log
          rc=${PIPESTATUS[0]}
          set -e

          git diff --name-only --diff-filter=U > ci-diagnostics/kernel/05-cip-unmerged.txt || true
          if [ -s ci-diagnostics/kernel/05-cip-unmerged.txt ]; then
            echo "::error::CIP135 delta has real conflicts. Nothing was skipped; exact conflicted paths are in the diagnostic artifact."
            git status --short | tee ci-diagnostics/kernel/05-cip-status.txt
            git diff --cc | tee ci-diagnostics/kernel/05-cip-conflict.diff >/dev/null || true
            git diff --check | tee ci-diagnostics/kernel/05-cip-diff-check.txt || true
            git checkout --conflict=merge -- . >/dev/null 2>&1 || true
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::CIP135 delta application failed without an index conflict; refusing a partial build."
            exit "$rc"
          fi

          git diff --check
          git diff --cached --stat | tee ci-diagnostics/kernel/05-cip-applied-stat.txt
          git status --short | tee ci-diagnostics/kernel/05-cip-status.txt
          test -f localversion-cip
          grep -q -- '-cip135' localversion-cip
          cat localversion-cip | tee ci-diagnostics/kernel/05-localversion-cip.txt
          # Keep CI diagnostics out of the kernel source commit. Only the actual
          # CIP-applied source changes are committed for later build steps.
          git reset >/dev/null
          git add -A -- . ':(exclude)ci-diagnostics'
          git commit -m "CI: apply Linux ${CIP_TAG} delta to LG Velvet kernel" 2>&1 | tee ci-diagnostics/kernel/05-cip-commit.log
          echo "CIP135 integration completed with zero unresolved conflicts and no skipped files." | tee ci-diagnostics/kernel/05-cip-merge-status.txt
      - name: "K07 • Integrate pinned SukiSU-Ultra 4.1.3 builtin"
        shell: bash
        run: |
          set -o pipefail
          curl -LSs --fail --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SUKISU_REF}/kernel/setup.sh" \
            -o ci-diagnostics/kernel/06-sukisu-setup.sh
          chmod +x ci-diagnostics/kernel/06-sukisu-setup.sh
          sha256sum ci-diagnostics/kernel/06-sukisu-setup.sh | tee ci-diagnostics/kernel/06-sukisu-setup.sha256
          bash ci-diagnostics/kernel/06-sukisu-setup.sh builtin 2>&1 | tee ci-diagnostics/kernel/06-sukisu.log

      - name: "K08 • Apply SUSFS 1.5.5 kernel-4.19 patch and resolve only real rejects"
        shell: bash
        run: |
          set -u
          work="$RUNNER_TEMP/susfs"
          rm -rf "$work"
          git clone --depth=1 --branch "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git "$work" \
            2>&1 | tee ci-diagnostics/kernel/07-susfs-clone.log
          git -C "$work" fetch --depth=1 origin "$SUSFS_REF"
          git -C "$work" checkout --detach "$SUSFS_REF"
          cp "$work/kernel_patches/50_add_susfs_in_kernel-4.19.patch" ci-diagnostics/kernel/07-susfs.patch
          rsync -a "$work/kernel_patches/fs/" fs/
          rsync -a "$work/kernel_patches/include/linux/" include/linux/
          set +e
          patch -p1 --forward --batch --fuzz=0 < ci-diagnostics/kernel/07-susfs.patch 2>&1 | tee ci-diagnostics/kernel/07-susfs-patch.log
          rc=${PIPESTATUS[0]}
          set -e
          find . -type f -name '*.orig' -delete
          find . -type f -name '*.rej' -print | tee ci-diagnostics/kernel/07-susfs-rejects.txt
          if [ -s ci-diagnostics/kernel/07-susfs-rejects.txt ]; then
            echo "::error::SUSFS produced unresolved rejects; nothing was discarded."
            exit 1
          fi
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --include='*.c' --include='*.h' --include='Kconfig*' . > ci-diagnostics/kernel/07-susfs-conflicts.txt; then
            echo "::error::SUSFS left conflict markers."
            exit 1
          fi
          exit "$rc"

      - name: "K09 • Set human-facing kernel identity to LM-G900 (keep caymanlm hardware identity)"
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$PWD/kernel/out"
          test -s "$OUT/.config"
          # Keep the hardware/product codename caymanlm; only the human-facing
          # kernel release identity is normalized to the user's global LM-G900.
          scripts/config --file "$OUT/.config" --set-str CONFIG_LOCALVERSION "-LM-G900"
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} HOSTAS=clang-${LLVM_VERSION} \
            LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} NM=llvm-nm-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tee ci-diagnostics/kernel/08-model-olddefconfig.log
          grep -q '^CONFIG_LOCALVERSION="-LM-G900"$' "$OUT/.config"
          grep '^CONFIG_LOCALVERSION=' "$OUT/.config" | tee ci-diagnostics/kernel/08-kernel-model.txt

      - name: "K10 • Apply finalized feature set + dependency-aware verification"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          OUT="$PWD/kernel/out"
          test -f "$OUT/.config"
          required=(
            CONFIG_KSU CONFIG_KPM CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL
            CONFIG_SCHED_WALT CONFIG_SCHED_TUNE CONFIG_CPU_FREQ_GOV_SCHEDUTIL
            CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_LTO_CLANG CONFIG_LTO_CLANG_THIN
            CONFIG_RANDOMIZE_BASE CONFIG_STACKPROTECTOR_STRONG CONFIG_HARDENED_USERCOPY
            CONFIG_SLAB_FREELIST_RANDOM CONFIG_SLAB_FREELIST_HARDENED
            CONFIG_DM_VERITY CONFIG_DM_VERITY_FEC CONFIG_FS_VERITY CONFIG_BPF CONFIG_BPF_JIT
            CONFIG_OVERLAY_FS CONFIG_TMPFS_XATTR CONFIG_TMPFS_POSIX_ACL
          )
          : > ci-diagnostics/kernel/08-symbol-presence.txt
          for sym in "${required[@]}"; do
            if grep -Rqs --exclude-dir=.git -E "^[[:space:]]*(menuconfig|config)[[:space:]]+${sym#CONFIG_}([[:space:]]|$)" .; then
              echo "$sym present" | tee -a ci-diagnostics/kernel/08-symbol-presence.txt
            else
              echo "::error::Required kernel symbol $sym does not exist in this source tree."
              exit 1
            fi
          done

          scripts/config --file "$OUT/.config" \
            -e CONFIG_KSU -e CONFIG_KPM -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_SCHED_WALT -e CONFIG_SCHED_TUNE -e CONFIG_CPU_FREQ_GOV_SCHEDUTIL \
            -e CONFIG_ZRAM -e CONFIG_ZSMALLOC -e CONFIG_LTO_CLANG -e CONFIG_LTO_CLANG_THIN \
            -e CONFIG_RANDOMIZE_BASE -e CONFIG_STACKPROTECTOR_STRONG -e CONFIG_HARDENED_USERCOPY \
            -e CONFIG_SLAB_FREELIST_RANDOM -e CONFIG_SLAB_FREELIST_HARDENED \
            -e CONFIG_DM_VERITY -e CONFIG_DM_VERITY_FEC -e CONFIG_FS_VERITY \
            -e CONFIG_BPF -e CONFIG_BPF_JIT -e CONFIG_OVERLAY_FS -e CONFIG_TMPFS_XATTR -e CONFIG_TMPFS_POSIX_ACL

          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} HOSTAS=clang-${LLVM_VERSION} \
            LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} NM=llvm-nm-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig \
            2>&1 | tee ci-diagnostics/kernel/08-olddefconfig.log
          cp "$OUT/.config" ci-diagnostics/kernel/final.config
          grep -E '^(CONFIG_(KSU|KPM|KALLSYMS|KALLSYMS_ALL|SCHED_WALT|SCHED_TUNE|CPU_FREQ_GOV_SCHEDUTIL|ZRAM|ZSMALLOC|LTO_CLANG|LTO_CLANG_THIN|RANDOMIZE_BASE|STACKPROTECTOR_STRONG|HARDENED_USERCOPY|SLAB_FREELIST_RANDOM|SLAB_FREELIST_HARDENED|DM_VERITY|DM_VERITY_FEC|FS_VERITY|BPF|BPF_JIT|OVERLAY_FS|TMPFS_XATTR|TMPFS_POSIX_ACL))=' "$OUT/.config" | tee ci-diagnostics/kernel/08-final-feature-check.txt
          for sym in "${required[@]}"; do
            grep -q "^${sym}=y$" "$OUT/.config" || { echo "::error::$sym was not enabled after olddefconfig"; exit 1; }
          done
      - name: "K11 • Immutable LM-G900 identity + regional source audit"
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "=== source commit ==="; git rev-parse HEAD
            echo "=== kernel version ==="; make -s O=kernel/out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} HOSTAS=clang-${LLVM_VERSION} LD=ld.lld-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- kernelversion
            echo "=== regional contamination audit ==="
            grep -RInE 'G900N|VZW|SPRINT|DCM_JP|SB_JP' arch/arm64/configs drivers include 2>/dev/null || true
            echo "=== KPM/SUSFS symbols ==="
            grep -RInE 'CONFIG_KPM|CONFIG_KSU_SUSFS' drivers/kernelsu KernelSU 2>/dev/null | head -100 || true
          } | tee ci-diagnostics/kernel/09-source-audit.txt
          git diff --check

      - name: "K12 • Build ARM64 kernel and modules"
        shell: bash
        run: |
          set -o pipefail
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          make O=kernel/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} HOSTAS=clang-${LLVM_VERSION} \
            LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} NM=llvm-nm-${LLVM_VERSION} \
            OBJCOPY=llvm-objcopy-${LLVM_VERSION} OBJDUMP=llvm-objdump-${LLVM_VERSION} \
            READELF=llvm-readelf-${LLVM_VERSION} STRIP=llvm-strip-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc --all)" Image.gz-dtb modules 2>&1 | tee ci-diagnostics/kernel/10-build.log

      - name: "K13 • Verify kernel image, modules and release string"
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$PWD/kernel/out"
          test -s "$OUT/arch/arm64/boot/Image.gz-dtb" || test -s "$OUT/arch/arm64/boot/Image"
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          make -s O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} HOSTAS=clang-${LLVM_VERSION} LD=ld.lld-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee ci-diagnostics/kernel/13-kernelrelease.txt
          grep -q '4.19.325-LM-G900-cip135' ci-diagnostics/kernel/13-kernelrelease.txt
          file "$OUT/arch/arm64/boot/"Image* | tee ci-diagnostics/kernel/13-image-file.txt
          find "$OUT" -type f -name '*.ko' -print0 | sort -z | xargs -0 -r sha256sum | tee ci-diagnostics/kernel/13-modules.sha256

      - name: "K14 • Package OrangeFox/AnyKernel3 flashable ZIP"
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/AnyKernel3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$RUNNER_TEMP/AnyKernel3"
          cd "$RUNNER_TEMP/AnyKernel3"
          git fetch --depth=1 origin "$ANYKERNEL3_REF"
          git checkout --detach "$ANYKERNEL3_REF"
          resolved=$(git rev-parse HEAD)
          echo "$resolved" | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/14-anykernel3-resolved.txt"
          rm -rf .git
          if [ -s "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" .
            image=Image.gz-dtb
          else
            cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" .
            image=Image
          fi
          cat > anykernel.sh <<'AK3'
          properties() {
            kernel.string=LG Velvet LM-G900 • Android 16 QPR2 • 4.19.325-LM-G900-cip135 • SukiSU-Ultra 4.1.3 • SUSFS 1.5.5 • KPM
            do.devicecheck=0
            do.modules=0
            do.systemless=0
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=LM-G900
          }
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          AK3
          zip -r9 "$GITHUB_WORKSPACE/LG-Velvet-LM-G900-Android16QPR2-cip135-SukiSU4.1.3-SUSFS1.5.5-KPM-OrangeFox.zip" . -x '.git/*' '*.md' 'README*' > "$GITHUB_WORKSPACE/ci-diagnostics/kernel/14-zip.log"
          sha256sum "$GITHUB_WORKSPACE/LG-Velvet-LM-G900-Android16QPR2-cip135-SukiSU4.1.3-SUSFS1.5.5-KPM-OrangeFox.zip" | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/14-zip.sha256"
          echo "image=$image" | tee "$GITHUB_WORKSPACE/ci-diagnostics/kernel/14-package.txt"

      - name: "K15 • Upload kernel result + diagnostics ALWAYS"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-KERNEL-${{ github.run_id }}"
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/**/*.ko
            LG-Velvet-LM-G900-Android16QPR2-cip135-SukiSU4.1.3-SUSFS1.5.5-KPM-OrangeFox.zip
            ci-diagnostics/kernel/**
          if-no-files-found: warn
          retention-days: 30

  vendor:
    if: ${{ github.event_name == 'push' || inputs.build_vendor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: "V01 • Checkout workflow source"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: "V02 • Install Android 16 build dependencies"
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 \
            libncurses-dev libx11-dev libreadline-dev libgl1-mesa-dev xsltproc unzip \
            fontconfig python3 python3-pip rsync bc ccache lz4 lzop liblz4-tool \
            libxml2-utils pngcrush schedtool git-lfs gperf imagemagick \
            protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev \
            libgnutls28-dev libsdl1.2-dev squashfs-tools xxd erofs-utils

      - name: "V03 • Initialize official repo correctly — no invalid --repo-rev=stable"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/android/bin" "$RUNNER_TEMP/android"
          mkdir -p ci-diagnostics/vendor
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/android/bin/repo" \
            2>&1 | tee ci-diagnostics/vendor/00-repo-download.log
          chmod 0755 "$RUNNER_TEMP/android/bin/repo"
          export PATH="$RUNNER_TEMP/android/bin:$PATH"
          mkdir -p ci-diagnostics/vendor
          cd "$RUNNER_TEMP/android"
          repo init -u "$ANDROID_MANIFEST" -b "$LINEAGE_BRANCH" --depth=1 \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/01-repo-init.log"
          repo version | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/01-repo-version.txt"
          test -f .repo/manifest.xml

      - name: "V04 • Add G900EMW device/common/vendor trees with verified Android 16 refs"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$RUNNER_TEMP/android/bin:$PATH"
          cd "$RUNNER_TEMP/android"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/g900emw.xml <<EOF
          <manifest>
            <!-- Lineage 23.2 already defines the github remote in default.xml. -->
            <project name="lge-qcom-dev/android_device_lge_caymanlm" path="device/lge/caymanlm" remote="github" revision="${DEVICE_REF}" />
            <project name="Sparxikle/android_device_lge_sm7250-common" path="device/lge/sm7250-common" remote="github" revision="${COMMON_DEVICE_REF}" />
            <project name="lge-qcom-dev/proprietary_vendor_lge_caymanlm" path="vendor/lge/caymanlm" remote="github" revision="${VENDOR_REF}" />
            <project name="Sparxikle/proprietary_vendor_lge_sm7250-common" path="vendor/lge/sm7250-common" remote="github" revision="${COMMON_VENDOR_REF}" />
          </manifest>
          EOF
          cat .repo/local_manifests/g900emw.xml | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/02-local-manifest.xml"
          repo forall -c 'git config remote.origin.promisor false || true; git config remote.origin.partialclonefilter "" || true'
          repo sync -c --force-sync --no-clone-bundle --no-tags -j2 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/03-repo-sync.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: "V05 • Verify source refs and Android 16 QPR2 product tree"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$RUNNER_TEMP/android/bin:$PATH"
          cd "$RUNNER_TEMP/android"
          repo manifest -r > "$GITHUB_WORKSPACE/ci-diagnostics/vendor/04-manifest-revisions.xml"
          for p in device/lge/caymanlm device/lge/sm7250-common vendor/lge/caymanlm vendor/lge/sm7250-common; do
            test -d "$p"
            git -C "$p" rev-parse HEAD
          done
          test -f device/lge/caymanlm/AndroidProducts.mk
          test -f device/lge/caymanlm/lineage_caymanlm.mk
          test -f vendor/lge/caymanlm/Android.bp || test -f vendor/lge/caymanlm/Android.mk
          grep -q 'android-16.0.0_r4' .repo/manifest.xml || grep -q 'android16-qpr2' .repo/manifest.xml || true
          {
            echo "device_ref=${DEVICE_REF}"
            echo "vendor_ref=${VENDOR_REF}"
            echo "common_device_ref=${COMMON_DEVICE_REF}"
            echo "common_vendor_ref=${COMMON_VENDOR_REF}"
            echo "target=lineage_caymanlm-userdebug"
          } | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/05-context.txt"

      - name: "V06 • Normalize global model identity to LM-G900 (preserve caymanlm codename)"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/android"
          test -f device/lge/caymanlm/lineage_caymanlm.mk
          cp device/lge/caymanlm/lineage_caymanlm.mk "$GITHUB_WORKSPACE/ci-diagnostics/vendor/06-lineage_caymanlm.mk.before"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("device/lge/caymanlm/lineage_caymanlm.mk")
          s = p.read_text()
          import re
          s2, n = re.subn(r'(?m)^PRODUCT_MODEL := .*$', 'PRODUCT_MODEL := LM-G900', s, count=1)
          if n != 1:
              raise SystemExit("PRODUCT_MODEL line not found exactly once")
          p.write_text(s2)
          PY

          # Use the Android build system's vendor-property mechanism instead of
          # editing generated build.prop files. This keeps the source auditable
          # and produces the property in vendor/build.prop.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("device/lge/caymanlm/lineage_caymanlm.mk")
          s = p.read_text()
          anchor = "PRODUCT_MODEL := LM-G900"
          addition = (
              anchor + "\n"
              "PRODUCT_VENDOR_PROPERTIES += \\\n"
              "    ro.product.vendor.model=LM-G900 \\\n"
              "    ro.vendor.product.model=LM-G900"
          )
          if "ro.product.vendor.model=LM-G900" not in s:
              s = s.replace(anchor, addition, 1)
          p.write_text(s)
          PY

          grep -nE '^PRODUCT_MODEL := LM-G900$|^PRODUCT_VENDOR_PROPERTIES|ro\.product\.vendor\.model=LM-G900|ro\.vendor\.product\.model=LM-G900'             device/lge/caymanlm/lineage_caymanlm.mk | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/06-model-source.txt"

      - name: "V07 • Prepare Android build environment"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$RUNNER_TEMP/android/bin:$PATH"
          cd "$RUNNER_TEMP/android"
          source build/envsetup.sh 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/06-envsetup.log"
          lunch lineage_caymanlm-userdebug 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/06-lunch.log"

      - name: "V08 • Mandatory hardware integration audit — fingerprint / vibration / Dual-SIM / audio / VoWiFi"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/android"
          diag="$GITHUB_WORKSPACE/ci-diagnostics/vendor/07-hardware-audit.txt"
          : > "$diag"
          require_match() {
            local label="$1"; local pattern="$2"; shift 2
            echo "=== $label ===" | tee -a "$diag"
            local matches
            matches="$(grep -RInE "$pattern" "$@" 2>/dev/null || true)"
            if [ -z "$matches" ]; then
              echo "::error::$label integration evidence not found in device/vendor/common trees"
              return 1
            fi
            printf '%s\n' "$matches" | head -200 | tee -a "$diag"
          }
          require_match "Fingerprint" 'fingerprint|biometric|fod' device/lge vendor/lge hardware
          require_match "Vibration" 'vibrator|haptics|vibra' device/lge vendor/lge hardware
          require_match "Dual-SIM / RIL" 'dsds|dual.?sim|radio|ril|ims' device/lge vendor/lge
          require_match "Audio" 'audio.primary|audio_policy|mixer_paths|tinyalsa|audio' device/lge vendor/lge
          require_match "VoWiFi / IWLAN" 'VoWiFi|VOWIFI|IWLAN|epdg|wfc|wifi.?calling|ims' device/lge vendor/lge
          echo "Mandatory structural hardware evidence passed; runtime functionality still requires on-device testing." | tee -a "$diag"
      - name: "V09 • Build vendor.img only — do not rebuild kernel"
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/android"
          source build/envsetup.sh
          lunch lineage_caymanlm-userdebug
          m vendorimage -j"$(nproc --all)" 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/08-vendor-build.log"

      - name: "V10 • Verify vendor.img, VINTF, LM-G900 identity + package vendor ZIP"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/android"
          OUT="out/target/product/caymanlm"
          test -s "$OUT/vendor.img"
          file "$OUT/vendor.img" | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/09-vendor-file.txt"
          sha256sum "$OUT/vendor.img" | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/09-vendor.sha256"
          find "$OUT" -maxdepth 5 -type f \( -name '*manifest*.xml' -o -name '*matrix*.xml' \) -print | sort | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/10-vintf-files.txt"
          find "$OUT" -type f -name 'build.prop' -print | sort | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/10-build-prop-files.txt"
          grep -RInE '^(ro\.product\.model|ro\.product\.vendor\.model|ro\.vendor\.product\.model)=' "$OUT" --include='build.prop' 2>/dev/null | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/10-model-properties.txt"
          test -s "$OUT/vendor/build.prop"
          grep -q '^ro.product.vendor.model=LM-G900$' "$OUT/vendor/build.prop"
          grep -q '^ro.vendor.product.model=LM-G900$' "$OUT/vendor/build.prop"
          if grep -RInE '^(ro\.product\.(vendor\.)?model|ro\.vendor\.product\.model)=(LM-G900N|G900N|G900EMW|VZW|SPRINT|DCM_JP|SB_JP)$' "$OUT" --include='build.prop' 2>/dev/null; then
            echo "::error::Forbidden regional model identity leaked into generated build.prop"
            exit 1
          fi
          if command -v checkvintf >/dev/null 2>&1; then
            checkvintf --check-compat --dirmap /vendor:"$PWD/$OUT/vendor" 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/11-checkvintf.log"
          else
            echo "checkvintf not available on runner; VINTF XML presence was verified." | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/11-checkvintf.log"
          fi
          mkdir -p "$GITHUB_WORKSPACE/vendor-package"
          cp "$OUT/vendor.img" "$GITHUB_WORKSPACE/vendor-package/vendor.img"
          cp "$GITHUB_WORKSPACE/ci-diagnostics/vendor/09-vendor.sha256" "$GITHUB_WORKSPACE/vendor-package/vendor.img.sha256"
          printf 'device=LM-G900\ncodename=caymanlm\ntarget=Android 16 QPR2 / API 36\n' > "$GITHUB_WORKSPACE/vendor-package/BUILD-METADATA.txt"
          (cd "$GITHUB_WORKSPACE/vendor-package" && zip -9 "$GITHUB_WORKSPACE/LM-G900-Android16QPR2-vendor.zip" vendor.img vendor.img.sha256 BUILD-METADATA.txt)
          sha256sum "$GITHUB_WORKSPACE/LM-G900-Android16QPR2-vendor.zip" | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/12-vendor-zip.sha256"
      - name: "V11 • Upload vendor result + diagnostics ALWAYS"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-VENDOR-${{ github.run_id }}"
          path: |
            ${{ runner.temp }}/android/out/target/product/caymanlm/vendor.img
            LM-G900-Android16QPR2-vendor.zip
            ci-diagnostics/vendor/**
          if-no-files-found: warn
          retention-days: 30

  dtbo:
    if: ${{ github.event_name == 'push' || inputs.build_dtbo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "D01 • Checkout exact kernel source"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 0

      - name: "D02 • Install DTBO build dependencies"
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential ccache clang-18 lld-18 llvm-18 \
            libssl-dev libelf-dev libdw-dev dwarves \
            python3 python3-pip rsync patch git curl wget unzip zip xz-utils \
            device-tree-compiler file gawk

      - name: "D03 • Create numbered DTBO diagnostics workspace"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci-diagnostics/dtbo dtbo/out
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "device=${DEVICE}"
            echo "codename=${CODENAME}"
            echo "branch=${KERNEL_BRANCH}"
            echo "commit=$(git rev-parse HEAD)"
            echo "target=Android 16 QPR2 GSI / LM-G900"
            echo "dtbo_partition_size=25165824"
            echo "source_dts_root=arch/arm64/boot/dts/vendor/lge/lito-caymanlm"
          } | tee ci-diagnostics/dtbo/00-context.txt
          git status --short | tee ci-diagnostics/dtbo/00-git-status-before.txt

      - name: "D04 • Verify caymanlm DT overlay source and selected region"
        shell: bash
        run: |
          set -euxo pipefail
          test -s "arch/arm64/configs/${DEFCONFIG}"
          test -d arch/arm64/boot/dts/vendor/lge/lito-caymanlm
          find arch/arm64/boot/dts/vendor/lge/lito-caymanlm -type f -name '*.dts' -print | sort | tee ci-diagnostics/dtbo/01-dts-inventory.txt
          grep -RInE '^CONFIG_(MACH_LITO_CAYMANLM|MACH_LITO_CAYMANLM_LAO_COM|MACH_LITO_CAYMANLM_DCM_JP|MACH_LITO_CAYMANLM_SB_JP)=' \
            "arch/arm64/configs/${DEFCONFIG}" | tee ci-diagnostics/dtbo/02-device-config.txt
          test "$(grep -Ec '^CONFIG_MACH_LITO_CAYMANLM=y$' "arch/arm64/configs/${DEFCONFIG}")" -eq 1
          regions=$(grep -Ec '^CONFIG_MACH_LITO_CAYMANLM_(LAO_COM|DCM_JP|SB_JP)=y$' "arch/arm64/configs/${DEFCONFIG}" || true)
          test "$regions" -eq 1 || { echo "::error::Expected exactly one caymanlm regional DT overlay target in defconfig; refusing to guess."; exit 1; }

      - name: "D05 • Baseline defconfig and enable only the DT overlay build gate"
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          make O=dtbo/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} HOSTAS=clang-${LLVM_VERSION} \
            LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} NM=llvm-nm-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- \
            "${DEFCONFIG}" 2>&1 | tee ci-diagnostics/dtbo/03-defconfig.log
          scripts/config --file dtbo/out/.config --enable CONFIG_BUILD_ARM64_DT_OVERLAY
          make O=dtbo/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} HOSTAS=clang-${LLVM_VERSION} \
            LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} NM=llvm-nm-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig \
            2>&1 | tee ci-diagnostics/dtbo/04-olddefconfig.log
          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y$' dtbo/out/.config
          grep -E '^CONFIG_(MACH_LITO_CAYMANLM|MACH_LITO_CAYMANLM_LAO_COM|MACH_LITO_CAYMANLM_DCM_JP|MACH_LITO_CAYMANLM_SB_JP|BUILD_ARM64_DT_OVERLAY)=' dtbo/out/.config | tee ci-diagnostics/dtbo/05-final-config.txt

      - name: "D06 • Harden the known DTBO Kbuild discovery typo in CI only"
        shell: bash
        run: |
          set -euxo pipefail
          f=arch/arm64/boot/dts/vendor/lge/Makefile
          test -s "$f"
          sha256sum "$f" | tee ci-diagnostics/dtbo/06-makefile-before.sha256
          grep -qF 'wildcard echo $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts' "$f"
          cp "$f" ci-diagnostics/dtbo/06-lge-makefile-before
          python3 - <<'PY'
          from pathlib import Path
          p=Path('arch/arm64/boot/dts/vendor/lge/Makefile')
          s=p.read_text()
          old='$(wildcard echo $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts)'
          new='$(wildcard $(srctree)/$(src)/$(DTS_PROJECT)/$(DTS_TARGET)/*.dts)'
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one known DTBO wildcard typo')
          p.write_text(s.replace(old,new,1))
          PY
          diff -u ci-diagnostics/dtbo/06-lge-makefile-before "$f" | tee ci-diagnostics/dtbo/06-lge-makefile-ci-fix.diff
          sha256sum "$f" | tee ci-diagnostics/dtbo/06-makefile-after.sha256

      - name: "D07 • Build ARM64 DT overlays with the same caymanlm defconfig"
        shell: bash
        run: |
          set -o pipefail
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          make O=dtbo/out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${LLVM_VERSION} HOSTCC=clang-${LLVM_VERSION} AS=clang-${LLVM_VERSION} HOSTAS=clang-${LLVM_VERSION} \
            LD=ld.lld-${LLVM_VERSION} AR=llvm-ar-${LLVM_VERSION} NM=llvm-nm-${LLVM_VERSION} \
            OBJCOPY=llvm-objcopy-${LLVM_VERSION} OBJDUMP=llvm-objdump-${LLVM_VERSION} \
            READELF=llvm-readelf-${LLVM_VERSION} STRIP=llvm-strip-${LLVM_VERSION} CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc --all)" dtbs 2>&1 | tee ci-diagnostics/dtbo/07-dtbo-build.log
          find dtbo/out/arch/arm64/boot/dts -type f -name '*.dtbo' -print | sort | tee ci-diagnostics/dtbo/08-built-dtbo-list.txt
          test -s ci-diagnostics/dtbo/08-built-dtbo-list.txt

      - name: "D08 • Package DTBO.img with AOSP mkdtboimg.py — no guessed entries"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/mkdtbo"
          curl -fsSL --retry 5 --retry-all-errors \
            https://android.googlesource.com/platform/system/libufdt/+/refs/heads/android16-qpr2-release/utils/src/mkdtboimg.py?format=TEXT \
            -o "$RUNNER_TEMP/mkdtbo/mkdtboimg.b64"
          base64 -d "$RUNNER_TEMP/mkdtbo/mkdtboimg.b64" > "$RUNNER_TEMP/mkdtbo/mkdtboimg.py"
          chmod +x "$RUNNER_TEMP/mkdtbo/mkdtboimg.py"
          python3 "$RUNNER_TEMP/mkdtbo/mkdtboimg.py" --help | tee ci-diagnostics/dtbo/09-mkdtboimg-help.txt
          mapfile -t overlays < ci-diagnostics/dtbo/08-built-dtbo-list.txt
          test "${#overlays[@]}" -gt 0
          : > ci-diagnostics/dtbo/10-mkdtbo-command.txt
          printf '%q ' python3 "$RUNNER_TEMP/mkdtbo/mkdtboimg.py" create LG-Velvet-LM-G900-Android16QPR2-dtbo.img --page_size=4096 >> ci-diagnostics/dtbo/10-mkdtbo-command.txt
          for f in "${overlays[@]}"; do printf '%q ' "$f" >> ci-diagnostics/dtbo/10-mkdtbo-command.txt; done
          echo >> ci-diagnostics/dtbo/10-mkdtbo-command.txt
          python3 "$RUNNER_TEMP/mkdtbo/mkdtboimg.py" create \
            LG-Velvet-LM-G900-Android16QPR2-dtbo.img --page_size=4096 \
            "${overlays[@]}" 2>&1 | tee ci-diagnostics/dtbo/10-mkdtboimg.log
          test -s LG-Velvet-LM-G900-Android16QPR2-dtbo.img

      - name: "D09 • Verify DTBO image header, entries, size and SHA256"
        shell: bash
        run: |
          set -euxo pipefail
          test "$(stat -c '%s' LG-Velvet-LM-G900-Android16QPR2-dtbo.img)" -le 25165824
          python3 "$RUNNER_TEMP/mkdtbo/mkdtboimg.py" dump LG-Velvet-LM-G900-Android16QPR2-dtbo.img \
            2>&1 | tee ci-diagnostics/dtbo/11-dtbo-dump.txt
          grep -q 'dt_entry_count' ci-diagnostics/dtbo/11-dtbo-dump.txt
          grep -q 'page_size = 4096' ci-diagnostics/dtbo/11-dtbo-dump.txt
          sha256sum LG-Velvet-LM-G900-Android16QPR2-dtbo.img | tee ci-diagnostics/dtbo/12-dtbo.sha256
          file LG-Velvet-LM-G900-Android16QPR2-dtbo.img | tee ci-diagnostics/dtbo/12-dtbo-file.txt
          printf 'device=LM-G900\ncodename=caymanlm\ntarget=Android 16 QPR2 / API 36\npartition=dtbo\n' > DTBO-BUILD-METADATA.txt
          zip -9 LM-G900-Android16QPR2-dtbo.zip LG-Velvet-LM-G900-Android16QPR2-dtbo.img DTBO-BUILD-METADATA.txt
          sha256sum LM-G900-Android16QPR2-dtbo.zip | tee ci-diagnostics/dtbo/13-dtbo-zip.sha256

      - name: "D10 • Upload DTBO result + diagnostics ALWAYS"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-DTBO-${{ github.run_id }}"
          path: |
            LG-Velvet-LM-G900-Android16QPR2-dtbo.img
            LM-G900-Android16QPR2-dtbo.zip
            DTBO-BUILD-METADATA.txt
            dtbo/out/arch/arm64/boot/dts/**/*.dtbo
            ci-diagnostics/dtbo/**
          if-no-files-found: warn
          retention-days: 30

  bundle:
    if: always() && (needs.kernel.result != 'skipped' || needs.vendor.result != 'skipped' || needs.dtbo.result != 'skipped')
    needs: [kernel, vendor, dtbo]
    runs-on: ubuntu-24.04
    steps:
      - name: "B01 • Download independent kernel/vendor artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: LM-G900-*
          path: collected
          merge-multiple: false
          if-no-files-found: warn

      - name: "B02 • Build final status report"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p final
          {
            echo "LG Velvet LM-G900 — Android 16 QPR2"
            echo "kernel_job=${{ needs.kernel.result }}"
            echo "vendor_job=${{ needs.vendor.result }}"
            echo "dtbo_job=${{ needs.dtbo.result }}"
            echo "Kernel, vendor and DTBO are independent; a successful artifact is preserved even when another job fails."
            echo "If a failure occurs, the exact numbered setup is visible in that job's log and diagnostic artifact."
          } | tee final/BUILD-STATUS.txt
          find collected -type f -print | sort > final/ARTIFACT-LIST.txt
          tar -czf "LM-G900-complete-diagnostics-${GITHUB_RUN_ID}.tar.gz" collected final

      - name: "B03 • Upload combined diagnostics ALWAYS"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-COMPLETE-${{ github.run_id }}"
          path: |
            final/**
            LM-G900-complete-diagnostics-${{ github.run_id }}.tar.gz
          if-no-files-found: warn
          retention-days: 30
