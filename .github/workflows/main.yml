name: LG Velvet 5G LM-G900/G900EMW - SukiSU-Ultra 4.2.0 + Full Feature Matrix + DTB/DTBO

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel Defconfig"
        required: true
        default: "vendor/caymanlm_defconfig"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      CLANG_DIR: ${{ github.workspace }}/clang-prebuilt/clang-r547379
      GCC64_DIR: ${{ github.workspace }}/gcc64
      GCC32_DIR: ${{ github.workspace }}/gcc32
      DIAG_DIR: ${{ github.workspace }}/ci-logs
      # Reproducibility / integration pins
      SUKISU_REPO: "SukiSU-Ultra/SukiSU-Ultra"
      SUKISU_REF: "v4.2.0"
      SUKISU_RELEASE_COMMIT: "85eb4a9"
      MAPHIDE_PATCH_URL: "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/archived/69_hide_stuff.patch"

    steps:

      - name: 01 - Checkout Stock Kernel Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: lge-qcom-dev/android_kernel_lge_sm7250
          ref: lineage-22.2
          fetch-depth: 1
          persist-credentials: false

      - name: 02 - Initialize Diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p "$DIAG_DIR"
          {
            echo "========== STOCK KERNEL BASELINE =========="
            echo "DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SHA=$GITHUB_SHA"
            echo "BRANCH=$GITHUB_REF_NAME"
            echo
            git rev-parse HEAD
            git status --short
            echo
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile
            echo
            echo "Defconfig input: ${{ github.event.inputs.defconfig }}"
            echo
            df -h
            echo
            free -h
          } > "$DIAG_DIR/02-initialize.log" 2>&1

      - name: 03 - Install Build Dependencies
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/03-install-dependencies.log"
          : > "$LOG"
          {
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git curl wget make gcc g++ bison flex bc cpio \
              python3 python-is-python3 gawk zip unzip rsync patch perl \
              libssl-dev libelf-dev device-tree-compiler file
            echo
            echo "gcc:"
            gcc --version | sed -n '1p'
            echo "make:"
            make --version | sed -n '1p'
            echo "python:"
            python3 --version
          } > "$LOG" 2>&1
          STATUS=$?
          tail -100 "$LOG" || true
          exit "$STATUS"

      - name: 04 - Download Android Clang r547379
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/04-download-clang.log"
          : > "$LOG"
          {
            rm -rf clang-prebuilt toolchain
            git clone --depth=1 --filter=blob:none --sparse \
              --branch android16-qpr2-release \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86.git \
              clang-prebuilt
            cd clang-prebuilt
            git sparse-checkout set clang-r547379
            cd ..
            test -x "$CLANG_DIR/bin/clang"
            test -x "$CLANG_DIR/bin/ld.lld"
            ln -s "$CLANG_DIR" toolchain
            "$CLANG_DIR/bin/clang" --version
            "$CLANG_DIR/bin/ld.lld" --version
          } > "$LOG" 2>&1
          STATUS=$?
          tail -100 "$LOG" || true
          exit "$STATUS"

      - name: 05 - Download AArch64 GCC 4.9
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/05-download-gcc64.log"
          : > "$LOG"
          {
            rm -rf gcc64
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
              gcc64
            test -x gcc64/bin/aarch64-linux-android-gcc
            gcc64/bin/aarch64-linux-android-gcc --version
          } > "$LOG" 2>&1
          STATUS=$?
          tail -80 "$LOG" || true
          exit "$STATUS"

      - name: 06 - Download ARM32 GCC 4.9
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/06-download-gcc32.log"
          : > "$LOG"
          {
            rm -rf gcc32
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
              gcc32
            test -x gcc32/bin/arm-linux-androideabi-gcc
            gcc32/bin/arm-linux-androideabi-gcc --version
          } > "$LOG" 2>&1
          STATUS=$?
          tail -80 "$LOG" || true
          exit "$STATUS"

      - name: 07 - Prepare Toolchain Environment
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/07-toolchain-check.log"
          : > "$LOG"
          {
            echo "=================================="
            echo "TOOLCHAIN ENVIRONMENT"
            echo "=================================="

            # IMPORTANT: GITHUB_PATH affects later steps, not the current step.
            # Export PATH here as well so ld.lld is available immediately.
            export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"

            echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
            echo "$GCC64_DIR/bin" >> "$GITHUB_PATH"
            echo "$GCC32_DIR/bin" >> "$GITHUB_PATH"

            echo "CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-" >> "$GITHUB_ENV"
            echo "CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"

            echo
            echo "PATH:"
            echo "$PATH"

            echo
            echo "CLANG:"
            command -v clang
            clang --version | sed -n '1,2p'

            echo
            echo "LLD:"
            command -v ld.lld
            ld.lld --version | sed -n '1,2p'

            echo
            echo "AARCH64 GCC:"
            command -v aarch64-linux-android-gcc
            aarch64-linux-android-gcc --version | sed -n '1p'

            echo
            echo "ARM32 GCC:"
            command -v arm-linux-androideabi-gcc
            arm-linux-androideabi-gcc --version | sed -n '1p'

            echo
            echo "Exact tool files:"
            ls -lh "$CLANG_DIR/bin/clang" "$CLANG_DIR/bin/ld.lld"

            echo
            echo "[PASS] Toolchain Ready"
          } > "$LOG" 2>&1
          STATUS=$?
          cat "$LOG"
          exit "$STATUS"

      - name: 08 - Integrate SukiSU-Ultra 4.2.0 (Non-GKI Builtin)
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/08-sukisu-integration.log"
          : > "$LOG"
          {
            echo "========== SUKISU-Ultra 4.2.0 =========="
            git ls-files -z | sort -z > "$RUNNER_TEMP/tracked-before"

            curl -fsSL "https://raw.githubusercontent.com/${SUKISU_REPO}/${SUKISU_REF}/kernel/setup.sh" \
              -o "$RUNNER_TEMP/sukisu-setup.sh"
            chmod +x "$RUNNER_TEMP/sukisu-setup.sh"

            echo "Using official SukiSU release tag: $SUKISU_REF"
            echo "Official release commit (short): $SUKISU_RELEASE_COMMIT"
            echo "Non-GKI integration mode: Manual Hook + built-in driver"
            # v4.2.0 setup.sh accepts a commit/tag, not the old builtin/nongki selector.
            bash "$RUNNER_TEMP/sukisu-setup.sh" "$SUKISU_REF"

            test -d KernelSU
            test -f KernelSU/kernel/Kconfig
            test -f KernelSU/kernel/Makefile

            echo
            echo "SukiSU repository state:"
            git -C KernelSU remote -v || true
            KSU_HEAD="$(git -C KernelSU rev-parse HEAD)"
            git -C KernelSU describe --tags --always || true
            case "$KSU_HEAD" in
              85eb4a9*) echo "[PASS] SukiSU HEAD matches official 4.2.0 release commit." ;;
              *) echo "[FAIL] SukiSU HEAD $KSU_HEAD does not match expected 4.2.0 commit $SUKISU_RELEASE_COMMIT"; exit 1 ;;
            esac

            # The requested build is SukiSU + KPM only. Do not apply any
            # external kernel root-hiding patchset or userspace package.
            echo
            echo "Checking that no SUSFS kernel tree was introduced:"
            if find KernelSU/kernel -type f -print0 2>/dev/null | xargs -0 grep -IlE '(^|/)(susfs|sus_su)(\.c|\.h)?$|CONFIG_KSU_SUSFS' 2>/dev/null | head -20 | grep -q .; then
              echo "[FAIL] SUSFS kernel integration detected."
              exit 1
            fi
            if find fs include -type f -print0 2>/dev/null | xargs -0 grep -IlE 'susfs\.h|sus_su\.h' 2>/dev/null | head -20 | grep -q .; then
              echo "[FAIL] SUSFS kernel integration detected in stock tree."
              exit 1
            fi

            git ls-files -z | sort -z > "$RUNNER_TEMP/tracked-after"
            if ! cmp -s "$RUNNER_TEMP/tracked-before" "$RUNNER_TEMP/tracked-after"; then
              echo "[FAIL] Existing tracked stock files disappeared during SukiSU integration."
              diff -u <(tr '\0' '\n' < "$RUNNER_TEMP/tracked-before") \
                      <(tr '\0' '\n' < "$RUNNER_TEMP/tracked-after") || true
              exit 1
            fi

            echo "[PASS] SukiSU-Ultra 4.2.0 integrated in non-GKI builtin mode."
            echo "[PASS] No external root-hiding kernel integration was applied."
            echo "[PASS] No pre-existing tracked stock files were removed."
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 09 - Verify SukiSU 4.2.0 / No External Root-Hiding Patchset
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/09-sukisu-verification.log"
          : > "$LOG"
          {
            test -d KernelSU
            test -f KernelSU/kernel/Kconfig
            test -f KernelSU/kernel/Makefile
            echo "SukiSU tag requested: $SUKISU_REF"
            echo "SukiSU HEAD: $(git -C KernelSU rev-parse HEAD)"
            echo "SukiSU describe: $(git -C KernelSU describe --tags --always 2>/dev/null || true)"
            echo
            echo "Kernel root-hiding patchset: NOT INTEGRATED"
            echo "Userspace root-hiding package: NOT INTEGRATED"
            echo "Requested SUSFS v2.2.0: NOT INTEGRATED"
            echo
            echo "[PASS] Only SukiSU-Ultra + KPM integration is requested."
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 10 - Verify Non-GKI Hook Architecture
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/10-hook-architecture.log"
          : > "$LOG"
          {
            echo "Manual Hook is the active SukiSU hook for this non-GKI kernel."
            echo "KPROBES is retained as a kernel capability."
            echo "Tracepoint Hook is explicitly disabled."
            grep -RniE 'KSU_MANUAL_HOOK|KSU_TRACEPOINT_HOOK' KernelSU 2>/dev/null | head -80 || true
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 10 - Configure Stock Defconfig + SukiSU + Full Features
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/10-defconfig-and-features.log"
          : > "$LOG"
          {
            export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
            export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

            DEFCONFIG="${{ github.event.inputs.defconfig }}"
            test -f "arch/arm64/configs/${DEFCONFIG}"

            make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              "$DEFCONFIG"

            test -s .config

            if [ -x scripts/config ]; then
              scripts/config --enable CONFIG_KSU
              scripts/config --enable CONFIG_KSU_MANUAL_HOOK
              scripts/config --enable CONFIG_KPROBES
              scripts/config --enable CONFIG_KALLSYMS
              scripts/config --enable CONFIG_KALLSYMS_ALL
              scripts/config --enable CONFIG_KPM
              scripts/config --disable CONFIG_KSU_TRACEPOINT_HOOK 2>/dev/null || true

              enable_if_present() {
                sym="$1"
                if grep -Rqs "^config ${sym#CONFIG_}\b" KernelSU fs include drivers net mm security 2>/dev/null; then
                  scripts/config --enable "$sym" 2>/dev/null || true
                elif grep -Rqs "^config ${sym#CONFIG_}\b" . 2>/dev/null; then
                  scripts/config --enable "$sym" 2>/dev/null || true
                else
                  echo "[INFO] Kconfig symbol not present: $sym"
                fi
              }

              for sym in \
                CONFIG_EXT4_FS \
                CONFIG_OVERLAY_FS \
                CONFIG_BPF \
                CONFIG_BPF_SYSCALL \
                CONFIG_NETFILTER \
                CONFIG_NETFILTER_ADVANCED \
                CONFIG_IP_SET \
                CONFIG_IP6_NF_NAT \
                CONFIG_TCP_CONG_BBR \
                CONFIG_TCP_CONG_CUBIC \
                CONFIG_TMPFS_XATTR \
                CONFIG_TMPFS_POSIX_ACL \
                CONFIG_WIREGUARD \
                CONFIG_CFG80211 \
                CONFIG_RMNET \
                CONFIG_RMNET_IPA \
                CONFIG_RMNET_MAP \
                CONFIG_QRTR \
                CONFIG_MSM_QMI_INTERFACE \
                CONFIG_QCOM_QMI_HELPERS \
                CONFIG_NETFILTER_XT_MATCH_OWNER \
                CONFIG_NETFILTER_XT_MATCH_CONNTRACK \
                CONFIG_NETFILTER_XT_MATCH_STATE \
                CONFIG_NETFILTER_XT_TARGET_MARK \
                CONFIG_NETFILTER_XT_TARGET_MASQUERADE \
                CONFIG_NF_CONNTRACK \
                CONFIG_NF_NAT \
                CONFIG_VETH \
                CONFIG_BRIDGE \
                CONFIG_BRIDGE_NETFILTER \
                CONFIG_NET_NS \
                CONFIG_NAMESPACES \
                CONFIG_PID_NS \
                CONFIG_UTS_NS \
                CONFIG_IPC_NS \
                CONFIG_SECCOMP \
                CONFIG_SECCOMP_FILTER \
                CONFIG_CGROUPS \
                CONFIG_CGROUP_DEVICE \
                CONFIG_CGROUP_PIDS \
                CONFIG_CGROUP_SCHED \
                CONFIG_FAIR_GROUP_SCHED \
                CONFIG_MEMCG \
                CONFIG_USER_NS \
                CONFIG_DEVTMPFS \
                CONFIG_SYSVIPC \
                CONFIG_POSIX_MQUEUE \
                CONFIG_ANDROID_BINDERFS \
                CONFIG_ZRAM \
                CONFIG_ZSMALLOC \
                CONFIG_LTO_CLANG \
                CONFIG_LTO_CLANG_THIN \
                CONFIG_SCHED_WALT \
                CONFIG_SCHED_TUNE \
                CONFIG_NET_SCH_CAKE \
                CONFIG_NET_SCH_FQ_CODEL \
                CONFIG_NET_SCH_FQ \
                CONFIG_BBG \
                CONFIG_BBG_BLOCK_BOOT \
                CONFIG_BBG_BLOCK_RECOVERY; do
                enable_if_present "$sym"
              done
            fi

            make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              olddefconfig

            echo
            echo "========== CORE CONFIG =========="
            grep -E '^CONFIG_(KSU|KSU_MANUAL_HOOK|KPROBES|KALLSYMS|KALLSYMS_ALL|KPM)=' .config || true

            for req in \
              CONFIG_KSU=y \
              CONFIG_KSU_MANUAL_HOOK=y \
              CONFIG_KPROBES=y \
              CONFIG_KALLSYMS=y \
              CONFIG_KALLSYMS_ALL=y \
              CONFIG_KPM=y \
              CONFIG_EXT4_FS=y \
              CONFIG_OVERLAY_FS=y \
              CONFIG_BPF=y \
              CONFIG_BPF_SYSCALL=y \
              CONFIG_NETFILTER=y \
              CONFIG_IP_SET=y \
              CONFIG_TCP_CONG_BBR=y; do
              grep -qx "$req" .config || { echo "[FAIL] Missing core requirement: $req"; exit 1; }
            done

            if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' .config; then
              echo "[FAIL] Tracepoint Hook must not be active for this non-GKI Manual Hook build."
              exit 1
            fi

            echo
            echo "========== REQUESTED FEATURE CONFIG =========="
            grep -E '^CONFIG_(EXT4_FS|OVERLAY_FS|BPF|BPF_SYSCALL|NETFILTER|IP_SET|TCP_CONG_BBR|WIREGUARD|CFG80211|RMNET|RMNET_IPA|RMNET_MAP|QRTR|MSM_QMI_INTERFACE|QCOM_QMI_HELPERS|ZRAM|ZSMALLOC|LTO_CLANG|LTO_CLANG_THIN|SCHED_WALT|SCHED_TUNE|NET_SCH_CAKE|NET_SCH_FQ_CODEL|BBG)=' .config || true

            echo "[PASS] SukiSU + KPM + core Android/network feature configuration verified."
          } > "$LOG" 2>&1
          STATUS=$?
          tail -220 "$LOG" || true
          exit "$STATUS"

      - name: 11 - Core Integration Verification
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/11-core-integration-verification.log"
          : > "$LOG"
          {
            echo "========== KERNELSU / SUKISU SOURCE CHECK =========="
            test -d KernelSU
            test -f KernelSU/kernel/Kconfig
            test -f KernelSU/kernel/Makefile
            echo "SukiSU HEAD: $(git -C KernelSU rev-parse HEAD)"
            echo "SukiSU describe: $(git -C KernelSU describe --tags --always 2>/dev/null || true)"
            echo
            echo "========== NO EXTERNAL ROOT-HIDING KERNEL PATCHSET =========="
            if grep -RniE 'susfs\.h|sus_su\.h' KernelSU/kernel fs include 2>/dev/null | head -50 | grep -q .; then
              echo "[FAIL] External root-hiding kernel integration detected."
              exit 1
            fi
            echo "[PASS] No external root-hiding kernel patchset detected."
            echo
            echo "Git diff summary:"
            git diff --stat || true
          } > "$LOG" 2>&1
          STATUS=$?
          tail -180 "$LOG" || true
          exit "$STATUS"

      - name: 10A - KPM Compatibility Preflight
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/10A-kpm-preflight.log"
          : > "$LOG"
          {
            test -d KernelSU/kernel/kpm || test -d drivers/kernelsu/kpm
            export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
            export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"
            if [ -d drivers/kernelsu/kpm ]; then
              make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" M=drivers/kernelsu/kpm V=1
            else
              make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" M=KernelSU/kernel/kpm V=1
            fi
            echo "[PASS] KPM subtree preflight compiled."
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 10B - Maphide Upstream Apply or Strict LG 4.19 Semantic Port
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/10B-maphide.log"
          : > "$LOG"
          {
            curl -fsSL "$MAPHIDE_PATCH_URL" -o "$RUNNER_TEMP/69_hide_stuff.patch"
            test -s "$RUNNER_TEMP/69_hide_stuff.patch"
            mode=""
            if git apply --check --whitespace=nowarn "$RUNNER_TEMP/69_hide_stuff.patch"; then
              git apply --whitespace=nowarn "$RUNNER_TEMP/69_hide_stuff.patch"
              mode="upstream-clean"
            elif git apply --check --3way "$RUNNER_TEMP/69_hide_stuff.patch"; then
              git apply --3way "$RUNNER_TEMP/69_hide_stuff.patch"
              mode="upstream-3way"
            else
              echo "[INFO] Upstream Maphide does not apply directly; using strict source-aware LG 4.19 semantic port."
              cat > "$RUNNER_TEMP/maphide_port.py" <<'PYMAP'
          from pathlib import Path
          
          tmmu = Path("fs/proc/task_mmu.c")
          base = Path("fs/proc/base.c")
          for p in (tmmu, base):
              if not p.is_file():
                  raise SystemExit(f"Missing required Maphide source: {p}")
          
          a = tmmu.read_text()
          b = base.read_text()
          
          helper = r"""
          static void show_vma_header_prefix_fake(struct seq_file *m,
          					unsigned long start, unsigned long end,
          					vm_flags_t flags, unsigned long long pgoff,
          					dev_t dev, unsigned long ino)
          {
          	seq_setwidth(m, 25 + sizeof(void *) * 6 - 1);
          	seq_printf(m, "%08lx-%08lx %c%c%c%c %08llx %02x:%02x %lu ",
          		start, end,
          		flags & VM_READ ? 'r' : '-',
          		flags & VM_WRITE ? 'w' : '-',
          		flags & VM_EXEC ? '-' : '-',
          		flags & VM_MAYSHARE ? 's' : 'p',
          		pgoff, MAJOR(dev), MINOR(dev), ino);
          }
          """
          
          if "show_vma_header_prefix_fake" not in a:
              anchor = "static void\nshow_map_vma(struct seq_file *m, struct vm_area_struct *vma)"
              if anchor not in a:
                  raise SystemExit("Maphide: show_map_vma anchor not found")
              a = a.replace(anchor, helper + "\n" + anchor, 1)
          
          if "struct dentry *dentry;" not in a:
              anchor = "\tconst char *name = NULL;\n"
              if anchor not in a:
                  raise SystemExit("Maphide: declaration anchor not found")
              a = a.replace(anchor, anchor + "\tstruct dentry *dentry;\n", 1)
          
          block = r"""
          		dentry = file->f_path.dentry;
          		if (dentry) {
          			const char *path = (const char *)dentry->d_name.name;
          			if (strstr(path, "lineage")) {
          				start = vma->vm_start;
          				end = vma->vm_end;
          				show_vma_header_prefix(m, start, end, flags, pgoff, dev, ino);
          				name = "/system/framework/framework-res.apk";
          				goto done;
          			}
          			if (strstr(path, "jit-zygote-cache")) {
          				start = vma->vm_start;
          				end = vma->vm_end;
          				show_vma_header_prefix_fake(m, start, end, flags, pgoff, dev, ino);
          				goto bypass;
          			}
          		}
          """
          if "dentry = file->f_path.dentry;" not in a:
              anchor = "\t\tpgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;"
              if anchor not in a:
                  raise SystemExit("Maphide: pgoff anchor not found")
              a = a.replace(anchor, anchor + block, 1)
          
          if "\tbypass:\n" not in a:
              anchor = "\t/*\n\t * Print the dentry name for named mappings, and a"
              if anchor not in a:
                  raise SystemExit("Maphide: bypass anchor not found")
              a = a.replace(anchor, "\tbypass:\n" + anchor, 1)
          
          base_old = r"""	if (vma && vma->vm_file) {
          		*path = vma->vm_file->f_path;
          		path_get(path);
          		rc = 0;
          	}"""
          base_new = r"""	if (vma) {
          		if (vma->vm_file) {
          			if (strstr(vma->vm_file->f_path.dentry->d_name.name, "lineage")) {
          				rc = kern_path("/system/framework/framework-res.apk", LOOKUP_FOLLOW, path);
          			} else {
          				*path = vma->vm_file->f_path;
          				path_get(path);
          				rc = 0;
          			}
          		}
          	}"""
          if base_old not in b:
              raise SystemExit("Maphide: base.c semantic block not found")
          b = b.replace(base_old, base_new, 1)
          
          tmmu.write_text(a)
          base.write_text(b)
          print("[PASS] LG 4.19 semantic Maphide port generated from source anchors")
          PYMAP
              python3 "$RUNNER_TEMP/maphide_port.py"
              mode="lg-4.19-semantic-port"
            fi
            test -n "$mode"
            if find . -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
              echo "[FAIL] Maphide generated reject/original files."
              exit 1
            fi
            for marker in show_vma_header_prefix_fake lineage jit-zygote-cache framework-res.apk bypass; do
              grep -Rqs "$marker" fs/proc/task_mmu.c fs/proc/base.c || { echo "[FAIL] Missing Maphide marker: $marker"; exit 1; }
            done
