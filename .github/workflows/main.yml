# V10 VERIFIED ERROR-FIX BASELINE (derived from V4, feature-preserving):
# V26 ROOT-CAUSE NOTE: LG 4.19 AVTAB uses flex_array while hashtab uses a native pointer array. V26 separates the iterators without removing features.
# The observed V4 failure was caused by changing the shared ksu_hash_for_each()
# iterator and then injecting a second AVTAB macro in Setup 27. Linux 4.19 hashtab
# uses struct hashtab_node **. The avtab representation is verified from the
# actual checked-out 4.19 headers, and Setup 17 keeps the matching iterator while
# adding exactly one native-array adapter for hashtab. Setup 27 is now verification/compile-only.
# V10: Derived directly from the verified V4 baseline. Only the proven Linux 4.19 SELinux iterator boundary and CI diagnostics/version labels are corrected here. Existing verified features/settings remain preserved.
# Setup 10A is intentionally preserved as the locked baseline.
# V10: live step output is mirrored to per-setup logs; verbose compiler output remains enabled.
# A source-derived compatibility preflight runs before compilation; Setup 10A remains immutable.
name: KERNEL-BUILD-Velvet-5G-LM-G900-V35

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel Defconfig"
        required: true
        default: "vendor/caymanlm_defconfig"

permissions:
  contents: read

# V11 ordering correction
# Setup 17 passed in V10. Setup 27 then reached a real compiler failure in
# drivers/kernelsu/supercall/dispatch.c because the Linux 4.19 scheduler-header
# fix and task_work API fix were incorrectly placed inside Setup 28, which runs
# after Setup 27. V11 moves those exact source-derived mutations into Setup 19,
# before Setup 27, and removes the late duplicate from Setup 28.
#
# This is an ordering/ownership correction, not a new API guess.
# V12 ROOT-CAUSE / SOURCE-CONTRACT NOTE
# V11 reached Setup 27 with successful KernelSU compilation. The failure was
# the validator requiring drivers/kernelsu/kernelsu.o even though the actual
# Kbuild output was drivers/kernelsu/built-in.a. V12 verifies the artifact
# actually produced by Kbuild and inspects required members with llvm-ar.
# No guessed output filename and no feature removal.
# V13 ROOT-CAUSE NOTE
# V14 ROOT-CAUSE NOTE
# V13 Setup 27 passed and compiled the cumulative SELinux/KernelSU hotspot objects.
# V13 Setup 28 then failed before the full kernel build because its validator
# incorrectly rejected the legitimate avtab flex_array iterator. That was a
# verifier error, not a compiler error and not a source incompatibility.
# V14 keeps the compiler-tested source unchanged and makes Setup 28 verify the
# two distinct iterator contracts instead of rejecting the valid avtab form.
#
# V12 runner evidence showed Kbuild produced drivers/kernelsu/built-in.a and
# llvm-ar listed complete relative member paths beginning with drivers/kernelsu/.
# V12's verifier searched for path-stripped names and falsely reported a
# missing member. V13 matches the exact emitted paths. Verification only.
# V16 ROOT-CAUSE / RESEARCH NOTE
# V15 reached the real full-kernel build and failed in Kbuild while creating
# drivers/staging/qcacld-3.0/built-in.a with: /bin/sh: Argument list too long.
# Upstream Kbuild fixed this exact scalability defect by shortening the $(obj)/
# prefix before feeding prerequisites through sed/xargs. V16 backports only that
# researched scripts/Makefile.build rule to the CIP 4.19 form actually present.
# V16 also changes Setup 28 presentation only: full compiler output remains
# captured in the artifact log, but the GitHub console shows only concise build
# activity/heartbeat lines. No kernel feature is disabled or removed.
# The V15 MONITOR_PID cleanup bug is also removed; build status remains authoritative.
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      CLANG_DIR: ${{ github.workspace }}/clang-prebuilt/clang-r547379
      GCC64_DIR: ${{ github.workspace }}/gcc64
      GCC32_DIR: ${{ github.workspace }}/gcc32
      DIAG_DIR: ${{ github.workspace }}/ci-logs
      # Reproducibility / integration pins
      SUKISU_REPO: "SukiSU-Ultra/SukiSU-Ultra"
      SUKISU_REF: "main"
      SUKISU_RELEASE_COMMIT: ""
      BASEBAND_GUARD_TAG: "main"
      BASEBAND_GUARD_COMMIT: ""
      MAPHIDE_PATCH_REPO: "WildKernels/kernel_patches"
      MAPHIDE_PATCH_PATH: "archived/69_hide_stuff.patch"
      MAPHIDE_PATCH_URL: "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/archived/69_hide_stuff.patch"
      MAPHIDE_SOURCE_COMMITS: ""
      MAPHIDE_VARIANT: "69_hide_stuff.patch (Simple Lineage mapping + Futile jit-zygote-cache mapping)"
      FEATURE_PRESERVATION: "MANDATORY"
      SUSFS_REPO: "simonpunk/susfs4ksu"
      SUSFS_REF: "kernel-4.19"
      SUSFS_COMMIT: ""
      SUSFS_VERSION: "kernel-4.19-latest"
      NEVER_REMOVE_EXISTING_FEATURES: "true"
      VERSION_POLICY: "LATEST_STABLE_COMPATIBLE_WITH_4.19.325-CIP135"
      VERIFIED_FEATURE_VERSIONS: "SukiSU-Ultra=v4.2.0(85eb4a9); KPM=CONFIG_KPM; SUSFS=kernel-4.19@001e6991(1.5.5); Baseband-Guard=v1.1@d4f7302; Maphide=69_hide_stuff.patch; CIP=v4.19.325-cip135; DroidSpaces=legacy-4.19-requirements"
      FEATURE_REMOVAL_POLICY: "NEVER_REMOVE_EXISTING_FEATURES; FIX_ERRORS_IN_PLACE_ONLY"
      # Version policy: use the latest stable upstream release/commit that is actually compatible with this 4.19.325-cip135 tree; never silently downgrade or fake a feature when the source does not support it.
      CIP_REPO: "https://gitlab.com/cip-project/cip-kernel/linux-cip.git"
      CIP_REF: "v4.19.325-cip135"
      LINEAGE_BRANCH: "lineage-23.2"

    steps:

      - name: Setup 1 - Initialize Diagnostics
        if: always()
        shell: bash
        run: |
          SETUP_NO="01"
          SETUP_NAME="Setup 1 - Initialize Diagnostics"
          SETUP_LOG="$DIAG_DIR/01-setup-01-initialize-diagnostics-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec 3>&1
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set +e
          mkdir -p "$DIAG_DIR" "$GITHUB_WORKSPACE/diagnostic-artifact"
          {
            echo "========== EARLY DIAGNOSTICS INITIALIZATION =========="
            date -u
            echo "Run: $GITHUB_RUN_ID"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow SHA: $GITHUB_SHA"
            echo "Kernel repository: lge-qcom-dev/android_kernel_lge_sm7250"
            echo "Requested Lineage branch: $LINEAGE_BRANCH"
            echo "CIP target: $CIP_REF"
          } | tee "$DIAG_DIR/00-early-init.log"

      - name: Support - Capture Running Workflow Source
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/v10-workflow-source"
          echo "========== CAPTURE RUNNING WORKFLOW SOURCE =========="
          echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          WORKFLOW_REF_PART="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          WORKFLOW_PATH="${WORKFLOW_REF_PART%@*}"
          WORKFLOW_REFNAME="${WORKFLOW_REF_PART#*@}"
          echo "Workflow path: $WORKFLOW_PATH"
          echo "Workflow ref: $WORKFLOW_REFNAME"
          RAW_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}?ref=${GITHUB_SHA}"
          if curl -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github.raw+json"               "$RAW_URL" > "$RUNNER_TEMP/v10-workflow-source/V10-CURRENT-WORKFLOW.yml"; then
            test -s "$RUNNER_TEMP/v10-workflow-source/V10-CURRENT-WORKFLOW.yml" &&
              echo "[PASS] Running workflow source captured before kernel checkout."
          else
            rm -f "$RUNNER_TEMP/v10-workflow-source/V10-CURRENT-WORKFLOW.yml"
            echo "[WARN] Workflow source API capture failed; final diagnostics will retry."
          fi

      - name: Setup 2 - Checkout Stock Kernel Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: lge-qcom-dev/android_kernel_lge_sm7250
          ref: lineage-23.2
          fetch-depth: 1
          show-progress: true
          persist-credentials: false

      - name: Setup 2A - Capture Checkout State
        if: always()
        shell: bash
        run: |
          SETUP_NO="02A"
          SETUP_NAME="Setup 2A - Capture Checkout State"
          SETUP_LOG="$DIAG_DIR/02A-setup-02A-checkout-state-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          export PS4='+ [SETUP-02A] '
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-02A][PASS] Checkout state captured."; else echo "[SETUP-02A][FAIL] Checkout state capture exited with code $rc."; fi' EXIT
          echo "========== SETUP 2 CHECKOUT STATE =========="
          git rev-parse --show-toplevel
          git rev-parse HEAD
          git status --short
          git remote -v
          echo "[PASS] Setup 2 checkout completed and its state is recorded."

      - name: Setup 3 - Integrate CIP135
        shell: bash
        run: |
          SETUP_NO="03"
          SETUP_NAME="Setup 3 - Integrate CIP135"
          SETUP_LOG="$DIAG_DIR/03-setup-03-integrate-cip135-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set -Eeuo pipefail
          mkdir -p "$DIAG_DIR"
          LOG="$DIAG_DIR/02-cip135-update.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo; echo "[FAIL] CIP135 step exited with code $rc"; echo "[FAIL] Last 160 log lines:"; tail -160 "$LOG" || true; exit $rc' ERR

          echo "========== OFFICIAL CIP UPDATE =========="
          date -u
          echo "Kernel repository: lge-qcom-dev/android_kernel_lge_sm7250"
          echo "Lineage branch: $LINEAGE_BRANCH"
          echo "CIP repository: $CIP_REPO"
          echo "CIP base tag: v4.19.325"
          echo "CIP target tag: $CIP_REF"
          echo

          echo "--- Active Git repository ---"
          git --version
          git rev-parse --show-toplevel
          git rev-parse HEAD
          git status --short
          echo

          echo "--- Fetch CIP objects INTO THE ACTIVE LG REPOSITORY ---"
          echo "The active repo receives the official CIP base/target objects so 3-way application has the required preimages."
          git fetch --progress --no-tags --depth=1 "$CIP_REPO" \
            "refs/tags/v4.19.325:refs/cip/v4.19.325" \
            "refs/tags/$CIP_REF:refs/cip/$CIP_REF"

          BASE_REF='refs/cip/v4.19.325'
          TARGET_REF="refs/cip/$CIP_REF"

          echo "--- Verify imported CIP commits/trees ---"
          BASE_COMMIT="$(git rev-parse "$BASE_REF^{commit}")"
          TARGET_COMMIT="$(git rev-parse "$TARGET_REF^{commit}")"
          BASE_TREE="$(git rev-parse "$BASE_REF^{tree}")"
          TARGET_TREE="$(git rev-parse "$TARGET_REF^{tree}")"
          printf 'BASE_COMMIT=%s\nTARGET_COMMIT=%s\nBASE_TREE=%s\nTARGET_TREE=%s\n' \
            "$BASE_COMMIT" "$TARGET_COMMIT" "$BASE_TREE" "$TARGET_TREE"
          git cat-file -e "$BASE_COMMIT^{commit}"
          git cat-file -e "$TARGET_COMMIT^{commit}"
          git cat-file -e "$BASE_TREE^{tree}"
          git cat-file -e "$TARGET_TREE^{tree}"

          echo
          echo "--- Generate official 4.19.325 -> cip135 delta ---"
          rm -f "$RUNNER_TEMP/cip135.patch"
          git diff --binary "$BASE_REF" "$TARGET_REF" > "$RUNNER_TEMP/cip135.patch"
          test -s "$RUNNER_TEMP/cip135.patch"
          echo "CIP135 patch bytes: $(wc -c < "$RUNNER_TEMP/cip135.patch")"
          echo "CIP135 patch: $RUNNER_TEMP/cip135.patch"

          echo
          echo "--- Apply CIP135 with vendor-tree-safe conflict handling ---"
          echo "The LG lineage-23.2 tree is a vendor/device tree, not a pristine upstream v4.19.325 tree."
          echo "A full upstream delta can legitimately touch files absent from the LG tree or overlap LG changes."
          echo "Cleanly applicable CIP hunks are retained; conflicting hunks are preserved as the existing LG implementation."
          echo "This prevents unrelated upstream-only files from blocking the device kernel build."

          # git apply is expected to return non-zero when the vendor tree has
          # conflicts or upstream-only paths.  Keep it inside an if-condition so
          # the ERR trap does not abort the step before PIPESTATUS is captured.
          if git apply --3way --whitespace=fix "$RUNNER_TEMP/cip135.patch" 2>&1 | tee "$RUNNER_TEMP/cip135-apply.raw.log"; then
            APPLY_RC=${PIPESTATUS[0]}
          else
            APPLY_RC=${PIPESTATUS[0]}
          fi
          echo "git apply return code: $APPLY_RC"

          echo
          echo "--- Resolve only genuine unmerged paths in favor of the existing LG tree ---"
          mapfile -t UNMERGED_PATHS < <(git diff --name-only --diff-filter=U)
          RESOLVE_RC=0
          if [ "${#UNMERGED_PATHS[@]}" -gt 0 ]; then
            echo "[WARN] ${#UNMERGED_PATHS[@]} paths have upstream/LG conflicts."
            printf '%s\n' "${UNMERGED_PATHS[@]}" | tee "$RUNNER_TEMP/cip135-conflicts.txt"
            : > "$RUNNER_TEMP/cip135-conflict-resolution.log"
            for CONFLICT_PATH in "${UNMERGED_PATHS[@]}"; do
              echo "--- $CONFLICT_PATH ---" | tee -a "$RUNNER_TEMP/cip135-conflict-resolution.log"
              # Preserve the exact LG-side version when an 'ours' index stage exists.
              # For delete/modify conflicts where LG deleted the path, resolve as an LG-side deletion.
              if git ls-files -u -s -- "$CONFLICT_PATH" | awk '$3 == 2 { found=1 } END { exit(found ? 0 : 1) }'; then
                if git checkout --ours -- "$CONFLICT_PATH" >> "$RUNNER_TEMP/cip135-conflict-resolution.log" 2>&1                    && git add -- "$CONFLICT_PATH" >> "$RUNNER_TEMP/cip135-conflict-resolution.log" 2>&1; then
                  echo "[RESOLVED] preserved LG version" | tee -a "$RUNNER_TEMP/cip135-conflict-resolution.log"
                else
                  echo "[FAIL] could not preserve LG version for $CONFLICT_PATH" | tee -a "$RUNNER_TEMP/cip135-conflict-resolution.log"
                  RESOLVE_RC=1
                fi
              else
                if git rm -f -- "$CONFLICT_PATH" >> "$RUNNER_TEMP/cip135-conflict-resolution.log" 2>&1; then
                  echo "[RESOLVED] preserved LG deletion" | tee -a "$RUNNER_TEMP/cip135-conflict-resolution.log"
                else
                  echo "[FAIL] could not resolve LG-side deletion for $CONFLICT_PATH" | tee -a "$RUNNER_TEMP/cip135-conflict-resolution.log"
                  RESOLVE_RC=1
                fi
              fi
            done
          else
            echo "[PASS] No unmerged conflict paths remain."
            : > "$RUNNER_TEMP/cip135-conflict-resolution.log"
          fi
          cp -f "$RUNNER_TEMP/cip135-conflict-resolution.log" "$GITHUB_WORKSPACE/ci-logs/02-cip135-conflict-resolution.log" || true
          if [ "$RESOLVE_RC" -ne 0 ]; then
            echo "[FAIL] One or more CIP/LG conflicts could not be resolved safely."
            cat "$RUNNER_TEMP/cip135-conflict-resolution.log" || true
            exit 1
          fi

          echo
          echo "--- Record upstream-only paths that are not present in the LG tree ---"
          grep -E '^error: .*: does not exist in index$' "$RUNNER_TEMP/cip135-apply.raw.log" \
            | sed -E 's/^error: (.*): does not exist in index$/\1/' \
            | sort -u > "$RUNNER_TEMP/cip135-missing-paths.txt" || true
          MISSING_COUNT="$(wc -l < "$RUNNER_TEMP/cip135-missing-paths.txt" | tr -d ' ')"
          echo "Upstream-only/missing paths skipped by the LG tree: $MISSING_COUNT"
          if [ "$MISSING_COUNT" -gt 0 ]; then
            cat "$RUNNER_TEMP/cip135-missing-paths.txt"
          fi

          echo
          echo "--- Final CIP apply integrity checks ---"
          echo "[INFO] Conflict-marker check is limited to real Git markers; ordinary ======= documentation separators are valid."
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "[FAIL] Unmerged Git index entries remain after conflict resolution."
            git status --short
            exit 1
          fi
          # Do NOT scan for a bare ======= line: Linux Documentation contains
          # many legitimate reStructuredText/table separators with that text.
          # Git merge conflict markers are the unambiguous <<<<<<< / >>>>>>> lines.
          if git grep -n -E '^(<<<<<<< |>>>>>>> )' -- . ':!ci-logs' 2>/dev/null; then
            echo "[FAIL] Unresolved Git conflict markers remain in tracked kernel files."
            exit 1
          fi
          # A valid merge conflict also has a ======= separator between the
          # unambiguous markers; the check above is therefore sufficient to
          # reject actual unresolved conflicts without rejecting documentation.
          find . -name '*.rej' -o -name '*.orig' | sort > "$RUNNER_TEMP/cip135-reject-files.txt"
          if [ -s "$RUNNER_TEMP/cip135-reject-files.txt" ]; then
            echo "[FAIL] Patch reject/original files remain:"
            cat "$RUNNER_TEMP/cip135-reject-files.txt"
            exit 1
          fi

          echo
          echo "--- Ensure the official CIP135 release marker is present ---"
          if [ -f localversion-cip ]; then
            if ! grep -q -- '-cip135' localversion-cip; then
              printf '%s\n' '-cip135' > localversion-cip
            fi
          else
            printf '%s\n' '-cip135' > localversion-cip
          fi
          grep -q -- '-cip135' localversion-cip

          echo
          echo "--- CIP135 integration summary ---"
          echo "Official CIP target commit: $TARGET_COMMIT"
          echo "git apply original return code: $APPLY_RC"
          echo "Conflicting LG-preserved paths: ${#UNMERGED_PATHS[@]}"
          echo "Conflict-resolution return code: $RESOLVE_RC"
          echo "Upstream-only paths skipped: $MISSING_COUNT"
          echo "CIP marker:"
          cat localversion-cip
          echo
          if [ "$APPLY_RC" -eq 0 ]; then
            echo "[PASS] Official CIP135 delta applied cleanly."
          else
            echo "[PASS] CIP135 compatible overlay completed: clean hunks applied and LG-conflicting paths preserved."
          fi
          git status --short

      - name: Artifact - Early CIP Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V17-LG-Velvet-G900-EARLY-CIP135-FAILURE-Diagnostics
          path: |
            ci-logs/00-early-init.log
            ci-logs/02-cip135-update.log
            diagnostic-artifact/00A-workflow-shell-syntax.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Setup 4 - Install Build Dependencies
        shell: bash
        run: |
          SETUP_NO="04"
          SETUP_NAME="Setup 4 - Install Build Dependencies"
          SETUP_LOG="$DIAG_DIR/04-setup-04-install-build-dependencies-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set +e
          LOG="$DIAG_DIR/03-install-dependencies.log"
          : > "$LOG"
          {
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git curl wget make gcc g++ bison flex bc cpio \
              python3 python-is-python3 gawk zip unzip rsync patch perl \
              libssl-dev libelf-dev device-tree-compiler file
            echo
            echo "gcc:"
            gcc --version | sed -n '1p'
            echo "make:"
            make --version | sed -n '1p'
            echo "python:"
            python3 --version
          } 2>&1 | tee -a "$LOG"
          STATUS=$?
          tail -100 "$LOG" || true
          exit "$STATUS"

      - name: Setup 5 - Install Android Clang
        shell: bash
        run: |
          SETUP_NO="05"
          SETUP_NAME="Setup 5 - Install Android Clang"
          SETUP_LOG="$DIAG_DIR/05-setup-05-install-android-clang-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set +e
          LOG="$DIAG_DIR/04-download-clang.log"
          : > "$LOG"
          {
            rm -rf clang-prebuilt toolchain
            git clone --progress --depth=1 --filter=blob:none --sparse \
              --branch android16-qpr2-release \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86.git \
              clang-prebuilt
            cd clang-prebuilt
            git sparse-checkout set clang-r547379
            cd ..
            test -x "$CLANG_DIR/bin/clang"
            test -x "$CLANG_DIR/bin/ld.lld"
            ln -s "$CLANG_DIR" toolchain
            "$CLANG_DIR/bin/clang" --version
            "$CLANG_DIR/bin/ld.lld" --version
          } 2>&1 | tee -a "$LOG"
          STATUS=$?
          tail -100 "$LOG" || true
          exit "$STATUS"

      - name: Setup 6 - Install AArch64 GCC
        shell: bash
        run: |
          SETUP_NO="06"
          SETUP_NAME="Setup 6 - Install AArch64 GCC"
          SETUP_LOG="$DIAG_DIR/06-setup-06-install-aarch64-gcc-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set +e
          LOG="$DIAG_DIR/05-download-gcc64.log"
          : > "$LOG"
          {
            rm -rf gcc64
            git clone --progress --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
              gcc64
            test -x gcc64/bin/aarch64-linux-android-gcc
            gcc64/bin/aarch64-linux-android-gcc --version
          } 2>&1 | tee -a "$LOG"
          STATUS=$?
          tail -80 "$LOG" || true
          exit "$STATUS"

      - name: Setup 7 - Install ARM32 GCC
        shell: bash
        run: |
          SETUP_NO="07"
          SETUP_NAME="Setup 7 - Install ARM32 GCC"
          SETUP_LOG="$DIAG_DIR/07-setup-07-install-arm32-gcc-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
          export PS4="+ [SETUP-${SETUP_NO}] "
          set -x
          trap 'rc=$?; set +x; if [ "$rc" -eq 0 ]; then echo "[SETUP-${SETUP_NO}][PASS] $SETUP_NAME completed with exit code 0."; else echo "[SETUP-${SETUP_NO}][FAIL] $SETUP_NAME exited with code $rc."; fi' EXIT
          set +e
          LOG="$DIAG_DIR/06-download-gcc32.log"
          : > "$LOG"
          {
            rm -rf gcc32
            git clone --progress --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
              gcc32
            test -x gcc32/bin/arm-linux-androideabi-gcc
            gcc32/bin/arm-linux-androideabi-gcc --version
          } 2>&1 | tee -a "$LOG"
          STATUS=$?
          tail -80 "$LOG" || true
          exit "$STATUS"

      - name: Setup 8 - Prepare Toolchain
        shell: bash
        run: |
          SETUP_NO="08"
          SETUP_NAME="Setup 8 - Prepare Toolchain"
          SETUP_LOG="$DIAG_DIR/08-setup-08-prepare-toolchain-LIVE.log"
          mkdir -p "$DIAG_DIR"
          : > "$SETUP_LOG"
          exec > >(tee -a "$SETUP_LOG") 2>&1
          echo "========== $SETUP_NAME =========="
          echo "[LIVE] Full step output is captured in $SETUP_LOG"
