name: LG Velvet 5G - Stock 4.19 + KernelSU v0.9.5 + SUSFS 1.4.2

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Kernel source branch"
        required: true
        type: choice
        options:
          - sixteen
        default: sixteen

      defconfig:
        description: "Stock vendor defconfig"
        required: true
        type: choice
        options:
          - vendor/caymanlm_defconfig
        default: vendor/caymanlm_defconfig

permissions:
  contents: read

concurrency:
  group: lg-velvet-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build stock 4.19 + KSU + SUSFS (Non-GKI)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_COMMIT: 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49
      DEFCONFIG: ${{ inputs.defconfig }}

      KSU_VERSION: v0.9.5
      SUSFS_VERSION: 1.4.2-kernel-4.19

      ARCH: arm64
      OUT_DIR: ${{ github.workspace }}/out
      DIAG_DIR: ${{ github.workspace }}/ci-diagnostics

    steps:
      - name: 01 - Checkout exact stock kernel source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/kernel"
          git clone --depth=1 --branch "$SOURCE_BRANCH" "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"

          cd "$GITHUB_WORKSPACE/kernel"
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"

          echo "SOURCE_BRANCH=$SOURCE_BRANCH"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "KERNEL_VERSION=$(make -s kernelversion || true)"

          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: 02 - Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget

          mkdir -p "$DIAG_DIR"

      - name: 03 - Download exact Android clang and GCC 4.9 toolchains
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf clang-prebuilt gcc64 gcc32

          git clone --depth=1 --branch clang-r563880c \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-prebuilt

          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            gcc64

          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            gcc32

          find clang-prebuilt -maxdepth 3 -type d -name 'clang-r*' -print | sort | tail -n 10

          CLANG_DIR="$(find "$GITHUB_WORKSPACE/clang-prebuilt" -type d -name 'clang-r*' | sort | tail -n 1)"
          test -n "$CLANG_DIR"
          test -x "$CLANG_DIR/bin/clang"

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "PATH=$CLANG_DIR/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH" >> "$GITHUB_ENV"

          clang --version
          aarch64-linux-android-gcc --version | head -n 1
          arm-linux-androideabi-gcc --version | head -n 1

      - name: 04 - Create pristine stock baseline
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          make O="$OUT_DIR" ARCH="$ARCH" "$DEFCONFIG"

          cp "$OUT_DIR/.config" "$DIAG_DIR/stock-baseline.config"

          echo "=== STOCK BASELINE ==="
          grep -E '^(CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL|CONFIG_MODULES|CONFIG_KPROBES)=' \
            "$OUT_DIR/.config" || true

          echo "=== DTB/DTBO CONFIG ==="
          grep -E 'CONFIG_(BUILD_ARM64_UNCOMPRESSED_KERNEL|BUILD_ARM64_APPENDED_DTB|OF|ARM64)' \
            "$OUT_DIR/.config" | head -n 80 || true

      - name: 05 - Integrate KernelSU v0.9.5 (Non-GKI only)
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          # v0.9.5 is intentionally pinned: it is the last official KernelSU
          # release intended for legacy/non-GKI kernels such as Linux 4.19.
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh

          chmod +x /tmp/ksu-setup.sh
          /tmp/ksu-setup.sh "$KSU_VERSION"

          test -d KernelSU/kernel
          test -e drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU)' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

          echo "KernelSU:"
          cd KernelSU
          git describe --tags --always
          test "$(git describe --tags --exact-match 2>/dev/null || true)" = "$KSU_VERSION"

      - name: 06 - Download SUSFS 1.4.2 for kernel 4.19
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf susfs4ksu

          git clone --depth=1 --branch "$SUSFS_VERSION" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          test -f "susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
          test -f "susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          test -f "susfs4ksu/kernel_patches/KernelSU/kernel/sucompat.h"
          test -f "susfs4ksu/kernel_patches/fs/susfs.c"
          test -f "susfs4ksu/kernel_patches/fs/sus_su.c"
          test -f "susfs4ksu/kernel_patches/include/linux/susfs.h"
          test -f "susfs4ksu/kernel_patches/include/linux/sus_su.h"

          echo "SUSFS commit:"
          git -C susfs4ksu rev-parse HEAD

      - name: 07 - Apply SUSFS kernel + KernelSU patches
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          # Copy the exact 4.19 SUSFS sources before applying the patch.
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" fs/
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c" fs/
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h" include/linux/
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/sus_su.h" include/linux/

          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/kernel/sucompat.h" \
            KernelSU/kernel/

          cd KernelSU
          patch --forward --batch -p1 \
            < "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          cd "$GITHUB_WORKSPACE/kernel"
          patch --forward --batch -p1 \
            < "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"

      - name: 08 - Enable KSU + SUSFS without changing stock hardware configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          # Work only on the generated .config. The source defconfig and all
          # device-tree sources remain untouched.
          scripts/config --file "$OUT_DIR/.config" \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SUS_MAP \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -d CONFIG_KSU_SUSFS_SUS_SU

          # Keep the stock kprobe path. Do not introduce manual hook changes.
          scripts/config --file "$OUT_DIR/.config" -e CONFIG_KPROBES

          make O="$OUT_DIR" ARCH="$ARCH" olddefconfig

          cp "$OUT_DIR/.config" "$DIAG_DIR/final.config"

          echo "=== KSU/SUSFS CONFIG ==="
          grep -E '^CONFIG_(KSU|KSU_SUSFS|KPROBES)' "$OUT_DIR/.config" | sort

          echo "=== STOCK-SAFETY CHECK ==="
          # These must not be changed by the workflow.
          for cfg in \
            CONFIG_MACH_LITO_CAYMANLM \
            CONFIG_MACH_LITO_CAYMANLM_LAO_COM \
            CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS; do
            grep -E "^${cfg}=" "$DIAG_DIR/stock-baseline.config" || true
            grep -E "^${cfg}=" "$OUT_DIR/.config" || true
          done

      - name: 09 - Verify device-tree sources were not modified
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          if git status --short -- arch/arm64/boot/dts arch/arm64/configs | grep -E '^[ MARC?]{1,2}' ; then
            echo "::error::DTB/DTBO source or defconfig files were modified."
            git status --short -- arch/arm64/boot/dts arch/arm64/configs
            exit 1
          fi

          echo "DTB/DTBO source tree is unchanged."

      - name: 10 - Build kernel
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          make -Oline \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            -j"$(nproc)" \
            Image.gz \
            dtbs \
            modules

          # Some 4.19 Android trees produce Image.gz-dtb directly when the
          # appended-DTB option is enabled. If not, leave the DTB separate;
          # do not synthesize or alter DTB/DTBO content.
          if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" \
              "$GITHUB_WORKSPACE/Image.gz-dtb"
          fi

          test -f "$OUT_DIR/arch/arm64/boot/Image.gz"
          cp "$OUT_DIR/arch/arm64/boot/Image.gz" "$GITHUB_WORKSPACE/Image.gz"

          find "$OUT_DIR/arch/arm64/boot/dts" -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -print > "$DIAG_DIR/dtb-files.txt" || true

      - name: 11 - Final safety/configuration verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          test -f "$OUT_DIR/.config"
          test -f "$OUT_DIR/arch/arm64/boot/Image.gz"

          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_KSU_SUSFS_SUS_SU is not set$' "$OUT_DIR/.config"

          # Verify the stock device identity is still enabled.
          grep -q '^CONFIG_MACH_LITO_CAYMANLM=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' "$OUT_DIR/.config"

          # Do not silently change the kernel's DTB/DTBO source files.
          git diff --exit-code -- arch/arm64/boot/dts arch/arm64/configs

          {
            echo "=== FINAL BUILD ==="
            git rev-parse HEAD
            make -s O="$OUT_DIR" kernelversion || true
            echo
            echo "=== KSU ==="
            grep -E '^CONFIG_KSU=' "$OUT_DIR/.config"
            echo
            echo "=== SUSFS ==="
            grep -E '^CONFIG_KSU_SUSFS' "$OUT_DIR/.config" | sort
            echo
            echo "=== OUTPUTS ==="
            ls -lh "$OUT_DIR/arch/arm64/boot/Image.gz"
            [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ] && \
              ls -lh "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" || true
          } | tee "$DIAG_DIR/final-report.txt"

      - name: 12 - Package diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$DIAG_DIR"

          cd "$GITHUB_WORKSPACE/kernel"
          git status --short > "$DIAG_DIR/git-status.txt" || true
          git diff --stat > "$DIAG_DIR/git-diff-stat.txt" || true

          {
            echo "source_branch=$SOURCE_BRANCH"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "defconfig=$DEFCONFIG"
            echo "ksu=$KSU_VERSION"
            echo "susfs=$SUSFS_VERSION"
          } > "$DIAG_DIR/build-metadata.txt"

      - name: 13 - Upload kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-Stock-KSU-SUSFS-NonGKI
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/Image.gz
            ${{ github.workspace }}/Image.gz-dtb
            ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz
            ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz-dtb
            ${{ github.workspace }}/kernel/out/arch/arm64/boot/dts/**/*.dtb
            ${{ github.workspace }}/kernel/out/arch/arm64/boot/dts/**/*.dtbo

      - name: 14 - Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-KSU-SUSFS-diagnostics
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/ci-diagnostics
            ${{ github.workspace }}/out/.config
            ${{ github.workspace }}/out/arch/arm64/boot/Makefile
