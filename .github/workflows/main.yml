name: LG G900 Global - Stable Kernel + DTB + DTBO + SukiSU-Ultra + SUSFS + CIP135 v14

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lg-g900-global-v14-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_BRANCH: sixteen
  COMMON_TREE: https://github.com/afzalhaider8755slk-cell/android_device_lge_sm7250-common.git
  DEVICE_TREE: https://github.com/afzalhaider8755slk-cell/android_device_lge_caymanlm.git
  VENDOR_TREE: https://github.com/afzalhaider8755slk-cell/proprietary_vendor_lge_caymanlm.git

  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/lineageos_cayman_defconfig

  SUKISU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
  SUKISU_REF: builtin
  SUSFS_MODULE_REPO: https://github.com/sidex15/susfs4ksu-module.git
  SUSFS_MODULE_REF: v1.5.2+
  ANYKERNEL3_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL3_REF: master

  CIP_REPO: https://gitlab.com/cip-project/cip-kernel/linux-cip.git
  CIP_BASE_TAG: v4.19.325-cip132
  CIP_TARGET_TAG: v4.19.325-cip135

  DTB_TARGET: vendor/qcom/lito-mtp.dtb
  DTBO_TARGET: arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo
  DTBO_BUILD_DIR: arch/arm64/boot/dts/vendor/lge
  DTBO_DTS: arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_lao_com-rev-1.0_overlay.dts

jobs:
  kernel:
    name: Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: 00 - Diagnostics trap
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-diagnostics artifacts
          exec > >(tee -a ci-diagnostics/00-runner.log) 2>&1
          trap 'rc=$?; echo "FAILED step=00 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          uname -a
          date -u +%FT%TZ
          echo "workflow=v14"

      - name: 01 - Checkout all LG trees
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p src/device/lge src/vendor/lge
          exec > >(tee -a ci-diagnostics/01-checkout.log) 2>&1
          trap 'rc=$?; echo "FAILED step=01 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" src/kernel
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$COMMON_TREE" src/device/lge/sm7250-common
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$DEVICE_TREE" src/device/lge/caymanlm
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$VENDOR_TREE" src/vendor/lge/caymanlm
          cd src/kernel
          echo "kernel_commit=$(git rev-parse HEAD)"
          echo "kernel_version=$(make -s kernelversion)"

      - name: 02 - Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/02-dependencies.log) 2>&1
          trap 'rc=$?; echo "FAILED step=02 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache clang curl flex git libelf-dev libssl-dev \
            lld llvm make python3 rsync unzip wget xz-utils device-tree-compiler

      - name: 03 - Install exact Android Clang r563880c
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/03-toolchain.log) 2>&1
          trap 'rc=$?; echo "FAILED step=03 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          git clone --depth=1 --filter=blob:none --sparse --branch ndk-r29 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchains/clang
          cd toolchains/clang
          git sparse-checkout set clang-r563880c
          test -x clang-r563880c/bin/clang
          test -x clang-r563880c/bin/ld.lld
          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c" >> "$GITHUB_ENV"
          echo "PATH=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c/bin:$PATH" >> "$GITHUB_ENV"

      - name: 04 - Verify assembler before any Kconfig operation
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/04-toolchain-test.log) 2>&1
          trap 'rc=$?; echo "FAILED step=04 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          export PATH="$CLANG_DIR/bin:$PATH"
          clang --version
          ld.lld --version
          printf 'int main(void){return 0;}\n' | clang --target=aarch64-linux-android21 -x c - -c -o /tmp/a.o
          printf 'nop\n' | clang --target=aarch64-linux-android21 -x assembler - -c -o /tmp/as.o
          echo "LLVM_IAS=PASS"

      - name: 05 - Validate Global Cayman + DSDS source baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/05-target.log) 2>&1
          trap 'rc=$?; echo "FAILED step=05 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          cd src/kernel
          test -f "arch/arm64/configs/$DEFCONFIG"
          test -f "$DTBO_DTS"
          grep -q 'CONFIG_MACH_LITO_CAYMANLM' "arch/arm64/configs/$DEFCONFIG" || true
          grep -q 'BOARD_KERNEL_SEPARATED_DTBO := true' ../device/lge/caymanlm/BoardConfig.mk 2>/dev/null || true
          grep -q 'persist.vendor.radio.multisim.config=dsds' ../device/lge/sm7250-common/vendor.prop
          grep -q 'ro.vendor.lge.sim_num=2' ../device/lge/sm7250-common/vendor.prop
          grep -q 'ro.vendor.lge.dsds=2' ../device/lge/sm7250-common/vendor.prop
          grep -q 'model = "LG Electronics, Caymanlm, HW Rev 1.0"' "$DTBO_DTS"
          grep -q 'qcom,board-id = <0x000C0008 0>;' "$DTBO_DTS"
          ! grep -q '0x010C0008' "$DTBO_DTS"
          echo "Global Cayman HW Rev 1.0 + DSDS baseline: PASS"

      - name: 06 - Integrate CIP135 with LG-first conflict policy
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/ci-diagnostics/06-cip135.log") 2>&1
          trap 'rc=$?; echo "FAILED step=06 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          cd "$GITHUB_WORKSPACE/src/kernel"

          if [ -f .git/shallow ]; then
            git fetch --unshallow
          fi

          cp arch/arm64/kernel/cpu_errata.c "$GITHUB_WORKSPACE/artifacts/cpu_errata.lg-base.c"
          cp sound/core/compress_offload.c "$GITHUB_WORKSPACE/artifacts/compress_offload.lg-base.c"

          git remote add cip "$CIP_REPO"
          git fetch cip \
            "refs/tags/$CIP_BASE_TAG:refs/tags/$CIP_BASE_TAG" \
            "refs/tags/$CIP_TARGET_TAG:refs/tags/$CIP_TARGET_TAG"

          base=$(git rev-parse "refs/tags/$CIP_BASE_TAG^{commit}")
          target=$(git rev-parse "refs/tags/$CIP_TARGET_TAG^{commit}")
          vendor_head=$(git rev-parse HEAD)

          {
            echo "CIP_BASE=$CIP_BASE_TAG $base"
            echo "CIP_TARGET=$CIP_TARGET_TAG $target"
            echo "VENDOR_HEAD=$vendor_head"
          } | tee "$GITHUB_WORKSPACE/artifacts/cip-before.txt"

          git merge-base --is-ancestor "$base" "$vendor_head"

          git config user.name "LG-G900-CI"
          git config user.email "ci@invalid.local"

          if git merge --no-commit --no-ff -X ours "$target"; then
            echo "CIP135 merge completed without conflicts."
            git commit -m "Merge CIP135 into LG G900 kernel"
          else
            echo "CIP135 merge reported conflicts; resolving in favor of the LG tree."

            git diff --name-only --diff-filter=U \
              | tee "$GITHUB_WORKSPACE/artifacts/cip-conflicts.txt"

            conflict_count=$(wc -l < "$GITHUB_WORKSPACE/artifacts/cip-conflicts.txt")
            echo "conflict_count=$conflict_count" \
              | tee "$GITHUB_WORKSPACE/artifacts/cip-merge-summary.txt"

            while IFS= read -r f; do
              [ -n "$f" ] || continue

              if git checkout --ours -- "$f"; then
                git add -- "$f"
              else
                git rm -f -- "$f" || true
              fi
            done < "$GITHUB_WORKSPACE/artifacts/cip-conflicts.txt"

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "ERROR: unresolved Git merge entries remain after LG-first resolution."
              git status --short
              exit 1
            fi

            git commit -m "Merge CIP135 into LG G900 kernel (LG-first conflict resolution)"
          fi

          cp "$GITHUB_WORKSPACE/artifacts/cpu_errata.lg-base.c" \
            arch/arm64/kernel/cpu_errata.c

          cp "$GITHUB_WORKSPACE/artifacts/compress_offload.lg-base.c" \
            sound/core/compress_offload.c

          git add arch/arm64/kernel/cpu_errata.c \
            sound/core/compress_offload.c

          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          grep -q -- '-cip135' localversion-cip

          git status --short \
            > "$GITHUB_WORKSPACE/artifacts/cip-final-status.txt"

          git rev-parse HEAD \
            > "$GITHUB_WORKSPACE/artifacts/cip-final-commit.txt"

          echo "CIP135 integration complete."

      - name: 07 - Remove legacy KernelSU and integrate SukiSU-Ultra with native SUSFS
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/07-sukisu.log) 2>&1
          trap 'rc=$?; echo "FAILED step=07 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel

          rm -rf KernelSU drivers/kernelsu

          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

          test -d KernelSU/kernel
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile

          echo "SukiSU ref=builtin" \
            | tee "$GITHUB_WORKSPACE/artifacts/sukisu-selected-ref.txt"

          echo "SukiSU commit=$(git -C KernelSU rev-parse HEAD)" \
            | tee "$GITHUB_WORKSPACE/artifacts/sukisu-commit.txt"

      - name: 07b - Integrate SUSFS 4.19 non-GKI backport without removing LG sources
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/07b-susfs.log) 2>&1
          trap 'rc=$?; echo "FAILED step=07b rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel

          # The previous build proved the stock susfs4ksu kernel-4.19 patch
          # is not a clean match for this vendor/CIP135 tree:
          # namespace.c, proc/cmdline.c, proc/task_mmu.c and mount.h rejected.
          # Do NOT force those old hunks into the LG tree.
          #
          # Use the maintained Non-GKI 4.19 backport patch instead. It is
          # specifically designed for fragmented/vendor 4.19 trees and keeps
          # the existing LG source intact.
          rm -rf "$GITHUB_WORKSPACE/NonGKI_Kernel_Build_2nd"
          git clone --depth=1 --branch mainline \
            https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git \
            "$GITHUB_WORKSPACE/NonGKI_Kernel_Build_2nd"

          rm -rf "$GITHUB_WORKSPACE/susfs4ksu"
          git clone --depth=1 --branch kernel-4.19 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            "$GITHUB_WORKSPACE/susfs4ksu"

          test -s "$GITHUB_WORKSPACE/NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch"
          test -d "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs"
          test -d "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux"

          # Add SUSFS implementation/header files only. Existing LG files are
          # never deleted; patching is then performed by the 4.19 backport.
          cp -a "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/." fs/
          cp -a "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/." include/linux/

          patch_file="$GITHUB_WORKSPACE/NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch"

          # Apply the maintained 4.19 backport. Do not accept rejects.
          patch -p1 --forward < "$patch_file"

          ! find . -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .

          # Required implementation/config integration checks.
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h
          test -s fs/susfs.c
          grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU/kernel

          cp "$patch_file" "$GITHUB_WORKSPACE/artifacts/susfs-4.19-nongki-backport.patch"
          git -C "$GITHUB_WORKSPACE/NonGKI_Kernel_Build_2nd" rev-parse HEAD \
            > "$GITHUB_WORKSPACE/artifacts/susfs-backport-source-commit.txt"
          git -C "$GITHUB_WORKSPACE/susfs4ksu" rev-parse HEAD \
            > "$GITHUB_WORKSPACE/artifacts/susfs-source-commit.txt"

          echo "SukiSU builtin + SUSFS 4.19 Non-GKI backport: PASS" \
            | tee "$GITHUB_WORKSPACE/artifacts/susfs-kernel-ref.txt"
          echo "No LG kernel source files were removed by this SUSFS step." \
            | tee -a "$GITHUB_WORKSPACE/artifacts/susfs-kernel-ref.txt"

      - name: 08 - Generate config with the REAL device defconfig (toolchain already verified)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/08-defconfig.log) 2>&1
          trap 'rc=$?; echo "FAILED step=08 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          rm -rf "$GITHUB_WORKSPACE/out"
          mkdir -p "$GITHUB_WORKSPACE/out"

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$CLANG_DIR/bin/llvm-objcopy" \
            OBJDUMP="$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$CLANG_DIR/bin/llvm-strip" \
            "$DEFCONFIG"

          test -s "$GITHUB_WORKSPACE/out/.config"

          cp "$GITHUB_WORKSPACE/out/.config" \
            "$GITHUB_WORKSPACE/artifacts/config-from-defconfig"

      - name: 09 - Enable requested features conservatively
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/09-config.log) 2>&1
          trap 'rc=$?; echo "FAILED step=09 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          scripts/config --file "$GITHUB_WORKSPACE/out/.config" \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_MAP

          # Keep KPM disabled for stability.
          scripts/config --file "$GITHUB_WORKSPACE/out/.config" \
            --disable CONFIG_KPM 2>/dev/null || true

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$CLANG_DIR/bin/llvm-objcopy" \
            OBJDUMP="$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$CLANG_DIR/bin/llvm-strip" \
            olddefconfig

          grep -q '^CONFIG_KPROBES=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_KSU=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_KSU_SUSFS=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          grep -q '^# CONFIG_KPM is not set$' \
            "$GITHUB_WORKSPACE/out/.config"

          for c in \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP; do

            grep -q "^${c}=y$" \
              "$GITHUB_WORKSPACE/out/.config" || {
                echo "MISSING $c after olddefconfig"
                exit 1
              }
          done

          grep -q '^# CONFIG_KSU_MANUAL_HOOK is not set$' \
            "$GITHUB_WORKSPACE/out/.config" || true

          cp "$GITHUB_WORKSPACE/out/.config" \
            "$GITHUB_WORKSPACE/artifacts/final.config"

      - name: 10 - Network / IMS / WLAN / traffic-monitor baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/10-network.log) 2>&1
          trap 'rc=$?; echo "FAILED step=10 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cfg="$GITHUB_WORKSPACE/out/.config"
          report="$GITHUB_WORKSPACE/artifacts/network-connectivity-report.txt"

          : > "$report"

          required=(
            CONFIG_NETFILTER
            CONFIG_NETFILTER_XTABLES
            CONFIG_CFG80211
            CONFIG_UID_SYS_STATS
            CONFIG_RMNET
            CONFIG_IPA3
            CONFIG_RMNET_IPA3
            CONFIG_QCOM_QMI_HELPERS
            CONFIG_QCOM_QMI_RMNET
            CONFIG_BPF
            CONFIG_BPF_SYSCALL
            CONFIG_ANDROID_BINDER_IPC
            CONFIG_ANDROID_BINDERFS
            CONFIG_DM_VERITY
            CONFIG_FS_ENCRYPTION
            CONFIG_OVERLAY_FS
          )

          for c in "${required[@]}"; do
            grep -q "^${c}=y$" "$cfg" || {
              echo "MISSING $c" | tee -a "$report"
              exit 1
            }

            echo "$c=y" >> "$report"
          done

          echo 'Dual-SIM: common vendor DSDS properties verified.' \
            | tee -a "$report"

          echo 'VoLTE/Wi-Fi Calling: kernel transport/IMS prerequisites preserved; carrier/modem/vendor IMS remains external.' \
            | tee -a "$report"

          echo 'Traffic monitor: UID stats + BPF + netfilter baseline verified.' \
            | tee -a "$report"

          echo 'Android 16 QPR2/GSI: kernel compatibility validation only; no experimental QPR2 backports.' \
            | tee -a "$report"

      - name: 11 - Build kernel Image + modules
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/11-build.log) 2>&1
          trap 'rc=$?; echo "FAILED step=11 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          make -Oline \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$CLANG_DIR/bin/llvm-objcopy" \
            OBJDUMP="$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$CLANG_DIR/bin/llvm-strip" \
            -j"$(nproc)" \
            Image modules

          test -s "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          sha256sum "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            > "$GITHUB_WORKSPACE/artifacts/Image.sha256"

      - name: 12 - Final kernel validation
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/12-final.log) 2>&1
          trap 'rc=$?; echo "FAILED step=12 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cfg="$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_KPROBES=y$' "$cfg"
          grep -q '^CONFIG_KSU=y$' "$cfg"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$cfg"
          grep -q '^# CONFIG_KPM is not set$' "$cfg"

          ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$cfg" || true

          for c in \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP; do

            grep -q "^${c}=y$" "$cfg"
          done

          {
            echo 'target=LG-G900-Global'
            echo "kernel_commit=$(git -C src/kernel rev-parse HEAD)"
            echo "defconfig=$DEFCONFIG"
            echo "sukisu_ref=$SUKISU_REF"
            echo "sukisu_commit=$(git -C src/kernel/KernelSU rev-parse HEAD)"
            echo "cip=$CIP_TARGET_TAG applied-only-after-clean-ancestry"
            echo "dtb=$DTB_TARGET"
            echo "dtbo=$DTBO_TARGET"
          } > "$GITHUB_WORKSPACE/artifacts/build-info.txt"

      - name: 13 - Upload kernel artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-Kernel
          path: |
            out/arch/arm64/boot/Image
            artifacts/final.config
            artifacts/build-info.txt
            artifacts/Image.sha256
            artifacts/network-connectivity-report.txt
            artifacts/cip*

      - name: 14 - Upload kernel diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-Kernel-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn

  dtb:
    name: DTB
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 00 - Init diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-diagnostics artifacts
          exec > >(tee -a ci-diagnostics/00-runner.log) 2>&1
          trap 'rc=$?; echo "FAILED step=00 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

      - name: 01 - Checkout kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/01-checkout.log) 2>&1
          trap 'rc=$?; echo "FAILED step=01 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" src/kernel

      - name: 02 - Dependencies + Clang
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/02-toolchain.log) 2>&1
          trap 'rc=$?; echo "FAILED step=02 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential clang flex libelf-dev libssl-dev \
            lld llvm make device-tree-compiler

          git clone --depth=1 --filter=blob:none --sparse --branch ndk-r29 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchains/clang

          cd toolchains/clang
          git sparse-checkout set clang-r563880c

          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c" \
            >> "$GITHUB_ENV"

      - name: 03 - Configure exact device defconfig
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/03-config.log) 2>&1
          trap 'rc=$?; echo "FAILED step=03 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          printf 'nop\n' \
            | clang --target=aarch64-linux-android21 \
              -x assembler - -c -o /tmp/as.o

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            "$DEFCONFIG"

          test -s "$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y$' \
            "$GITHUB_WORKSPACE/out/.config"

      - name: 04 - Build ONLY lito-mtp.dtb
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/04-dtb-build.log) 2>&1
          trap 'rc=$?; echo "FAILED step=04 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          make -Oline \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            "$DTB_TARGET"

          produced="$GITHUB_WORKSPACE/out/arch/arm64/boot/dts/$DTB_TARGET"

          test -s "$produced" || {
            echo "ERROR: expected DTB output not found: $produced"
            find "$GITHUB_WORKSPACE/out/arch/arm64/boot/dts" \
              -name 'lito-mtp.dtb' -print || true
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/artifacts/dtb"

          cp "$produced" \
            "$GITHUB_WORKSPACE/artifacts/dtb/lito-mtp.dtb"

          if [ -s "$GITHUB_WORKSPACE/reference/dtb/lito-mtp.dtb" ]; then
            cp "$GITHUB_WORKSPACE/reference/dtb/lito-mtp.dtb" \
              "$GITHUB_WORKSPACE/artifacts/dtb/lito-mtp.dtb.completed-reference"
          fi

          sha256sum "$produced" \
            > "$GITHUB_WORKSPACE/artifacts/dtb/lito-mtp.dtb.sha256"

      - name: 05 - Validate DTB structure
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/05-verify.log) 2>&1
          trap 'rc=$?; echo "FAILED step=05 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          "$GITHUB_WORKSPACE/out/scripts/dtc/dtc" \
            -I dtb \
            -O dts \
            -o artifacts/dtb/lito-mtp.dts \
            artifacts/dtb/lito-mtp.dtb

          grep -q 'qcom,lito-mtp' \
            artifacts/dtb/lito-mtp.dts

          grep -q 'qcom,lito' \
            artifacts/dtb/lito-mtp.dts

      - name: 06 - Upload DTB
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTB
          path: artifacts/dtb/**

      - name: 07 - Upload DTB diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTB-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn

  dtbo:
    name: DTBO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 00 - Init diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-diagnostics artifacts
          exec > >(tee -a ci-diagnostics/00-runner.log) 2>&1
          trap 'rc=$?; echo "FAILED step=00 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

      - name: 01 - Checkout kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/01-checkout.log) 2>&1
          trap 'rc=$?; echo "FAILED step=01 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" src/kernel

      - name: 02 - Dependencies + Clang
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/02-toolchain.log) 2>&1
          trap 'rc=$?; echo "FAILED step=02 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential clang flex libelf-dev libssl-dev \
            lld llvm make device-tree-compiler

          git clone --depth=1 --filter=blob:none --sparse --branch ndk-r29 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchains/clang

          cd toolchains/clang
          git sparse-checkout set clang-r563880c

          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c" \
            >> "$GITHUB_ENV"

      - name: 03 - Configure and validate exact Global overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/03-target.log) 2>&1
          trap 'rc=$?; echo "FAILED step=03 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            "$DEFCONFIG"

          grep -q '^CONFIG_MACH_LITO_CAYMANLM=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y$' \
            "$GITHUB_WORKSPACE/out/.config"

          test -f "$DTBO_DTS"

          grep -q \
            'model = "LG Electronics, Caymanlm, HW Rev 1.0"' \
            "$DTBO_DTS"

          grep -q \
            'qcom,board-id = <0x000C0008 0>;' \
            "$DTBO_DTS"

          ! grep -q '0x010C0008' "$DTBO_DTS"

      - name: 04 - Repair only the confirmed LGE Kbuild wildcard typo in a temporary CI copy
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/04-kbuild-fix.log) 2>&1
          trap 'rc=$?; echo "FAILED step=04 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel

          f=arch/arm64/boot/dts/vendor/lge/Makefile

          grep -q \
            '\$(wildcard echo \$(srctree)/\$(src)' \
            "$f"

          cp "$f" \
            "$GITHUB_WORKSPACE/artifacts/lge-Makefile.before"

          sed -i \
            's/\$(wildcard echo \$(srctree)\/\$(src)/\$(wildcard \$(srctree)\/\$(src)/' \
            "$f"

          ! grep -q '\$(wildcard echo' "$f"

          cp "$f" \
            "$GITHUB_WORKSPACE/artifacts/lge-Makefile.after"

          echo 'Applied one CI-local typo fix only: wildcard echo -> wildcard.'

      - name: 05 - Build ONLY selected Global Cayman DTBO
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/05-dtbo-build.log) 2>&1
          trap 'rc=$?; echo "FAILED step=05 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          cd src/kernel
          export PATH="$CLANG_DIR/bin:$PATH"

          # FIX ONLY:
          # The previous directory target invoked dtbs and therefore caused
          # every LGE overlay in arch/arm64/boot/dts/vendor/lge to compile.
          # An unrelated CN overlay then failed DTC before the requested Lao
          # Global overlay was produced. Build the exact requested .dtbo
          # target instead; no other DTB/DTBO source or feature is removed.
          target="$DTBO_TARGET"

          # The LGE Makefile defines:
          # $(obj)/%.dtbo: $(src)/$(DTS_PROJECT)/$(DTS_TARGET)/%.dts
          # therefore the output target is nested under the project/device
          # directories, not flattened directly under vendor/lge.
          test -f "$DTBO_DTS"
          test "${target##*/}" = "lito-caymanlm_lao_com-rev-1.0_overlay.dtbo"

          make -Oline \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            "$target"

          produced="$GITHUB_WORKSPACE/out/$target"

          test -s "$produced" || {
            echo "ERROR: DTBO output not found: $produced"
            find "$GITHUB_WORKSPACE/out/arch/arm64/boot/dts/vendor/lge" \
              -type f -name 'lito-caymanlm_lao_com-rev-1.0_overlay.dtbo' -print || true
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/artifacts/dtbo"

          cp "$produced" \
            "$GITHUB_WORKSPACE/artifacts/dtbo/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo"

          sha256sum "$produced" \
            > "$GITHUB_WORKSPACE/artifacts/dtbo/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo.sha256"

          "$GITHUB_WORKSPACE/out/scripts/dtc/dtc" \
            -I dtb \
            -O dts \
            -o "$GITHUB_WORKSPACE/artifacts/dtbo/overlay.dts" \
            "$produced"

      - name: 06 - Validate DTBO identity
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/06-verify.log) 2>&1
          trap 'rc=$?; echo "FAILED step=06 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          grep -q \
            'LG Electronics, Caymanlm, HW Rev 1.0' \
            artifacts/dtbo/overlay.dts

          grep -q \
            'qcom,board-id' \
            artifacts/dtbo/overlay.dts

          ! grep -q \
            '0x010C0008' \
            artifacts/dtbo/overlay.dts

      - name: 07 - Upload DTBO
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTBO
          path: |
            artifacts/dtbo/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo
            artifacts/dtbo/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo.sha256

      - name: 08 - Upload DTBO diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTBO-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn

  package:
    name: AnyKernel3 + SUSFS package
    needs: [kernel, dtb, dtbo]
    if: ${{ always() && needs.kernel.result == 'success' && needs.dtb.result == 'success' && needs.dtbo.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: 00 - Init package diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-diagnostics artifacts
          exec > >(tee -a ci-diagnostics/00-runner.log) 2>&1
          trap 'rc=$?; echo "FAILED step=00 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

      - name: 01 - Download successful build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LG-G900-Global-{Kernel,DTB,DTBO}
          path: downloaded
          merge-multiple: false

      - name: 02 - Install AnyKernel3
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/02-anykernel.log) 2>&1
          trap 'rc=$?; echo "FAILED step=02 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          git clone \
            --depth=1 \
            --branch "$ANYKERNEL3_REF" \
            "$ANYKERNEL3_REPO" \
            AnyKernel3

          cp downloaded/LG-G900-Global-Kernel/Image \
            AnyKernel3/Image

          cp downloaded/LG-G900-Global-DTB/dtb/lito-mtp.dtb \
            AnyKernel3/dtb

          cat > AnyKernel3/anykernel.sh <<'AK3'
          properties() { '
          kernel.string=LG G900 Global - SukiSU-Ultra + SUSFS + CIP135
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AK3

          rm -rf AnyKernel3/.git AnyKernel3/.github

          mkdir -p artifacts

          (
            cd AnyKernel3
            zip -r9 \
              "$GITHUB_WORKSPACE/artifacts/LG-G900-Global-SukiSU-SUSFS-CIP135-AnyKernel3.zip" \
              . \
              -x '*.git*' '*.github*'
          )

          unzip -t artifacts/*.zip

      - name: 03 - Package DTBO separately (no automatic force-flash)
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/03-dtbo-package.log) 2>&1
          trap 'rc=$?; echo "FAILED step=03 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          mkdir -p artifacts/dtbo

          cp \
            downloaded/LG-G900-Global-DTBO/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo \
            artifacts/dtbo/

          # Recalculate the checksum locally instead of assuming that
          # a secondary checksum file was downloaded.
          sha256sum \
            artifacts/dtbo/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo \
            > artifacts/dtbo/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo.sha256

          (
            cd artifacts/dtbo
            zip -9 \
              "$GITHUB_WORKSPACE/artifacts/LG-G900-Global-DTBO.zip" \
              ./*
          )

          unzip -t artifacts/LG-G900-Global-DTBO.zip

      - name: 04 - Package SUSFS userspace module source
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a ci-diagnostics/04-susfs-module.log) 2>&1
          trap 'rc=$?; echo "FAILED step=04 rc=$rc cmd=${BASH_COMMAND}" >> "$GITHUB_WORKSPACE/ci-diagnostics/error.log"' ERR

          git clone \
            --depth=1 \
            --branch "$SUSFS_MODULE_REF" \
            "$SUSFS_MODULE_REPO" \
            susfs-module

          (
            cd susfs-module
            zip -r9 \
              "$GITHUB_WORKSPACE/artifacts/SUSFS-v1.5.2-R28-source.zip" \
              . \
              -x '*.git*'
          )

          unzip -t artifacts/SUSFS-v1.5.2-R28-source.zip

      - name: 05 - Upload packages
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-Flashable-Packages
          path: artifacts/**

      - name: 06 - Upload package diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-Package-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn
