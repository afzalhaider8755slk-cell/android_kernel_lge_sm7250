name: V97-LM-G900-KARNAL-BUILT

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_REF: sixteen
  KERNEL_COMMIT: 720c8d37ab7727af24c275bead988d6345ad174b

  DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_caymanlm.git
  DEVICE_REF: sixteen
  COMMON_DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_sm7250-common.git
  COMMON_DEVICE_REF: sixteen
  VENDOR_REPO: https://github.com/Hirashi-so/proprietary_vendor_lge_caymanlm.git
  VENDOR_REF: sixteen

  BASELINE_KERNEL_SHA256: 85dd6083fd5a34135f301de661cae5f90b1aee82f4f5aa8d6dee30eacd34659d
  BASELINE_KERNEL_VERSION: 4.19.325
  BASELINE_CIP: v4.19.325-cip132
  CIP_PREFIX: v4.19.325-cip

  KSU_VERSION: v3.4.0
  KSU_MANAGER_BUILD: 33294-4
  # Exact package from the user-supplied official v3.4.0/33294 APK.
  # Kbuild passes this to apk_sign.c so the kernel-side Manager check is
  # package+certificate bound, not merely certificate-bound.
  KSU_MANAGER_PACKAGE: com.rifsxd.ksunext
  # V82 source-level compatibility fix: the current official legacy branch
  # reports a stale legacy-derived KSU_VERSION even when its Manager signature
  # is the v3.4.0/33294 manager. Force the kernel-side reported version/tag to
  # the exact installed Manager build; do not alter the legacy driver code.
  KSU_VERSION_CODE: 33294
  KSU_VERSION_TAG_OVERRIDE: v3.4.0
  # V84: use the official KernelSU-Next legacy branch for the real non-GKI
  # driver/manual-hook integration. the previous build only synthesized CONFIG_KSU_MANUAL_HOOK
  # inside a dev-susfs v3.4.0 legacy tree; that did not satisfy the Manager's legacy-driver
  # detection. The existing SUSFS 2.3 kernel-side chain is preserved.
  KSU_REPO_OWNER: KernelSU-Next
  KSU_REPO: KernelSU-Next
  KSU_REF: legacy
  # V82 adds only the KSU_SUSFS Kconfig namespace to the legacy driver so the
  # existing SUSFS 2.3 backport/inline-hook layer remains enabled. No SUSFS source,
  # CIP, DT, packaging, or unrelated kernel feature is removed.
  # V40: only arch/arm64/boot/Image is packaged (AnyKernel3 keeps the device DTB/DTBO), so only the
  # Image target is built. A plain `make` also builds every DTB and lito-caymanlm_cn-rev-1.0_overlay.dtbo
  # still aborts it ("Input tree has errors"), which stops the whole make before the Image is done.
  KERNEL_BUILD_TARGETS: Image
  # V84: SUSFS acquisition and the audited 4.19 backport remain exactly the same
  # as the previous successful build. Only the KernelSU-Next driver source/integration
  # path and the requested v3.4.0 version are changed in this release.
  # V97: SUSFS 2.3.0 target for the 4.19 non-GKI port. This is a
  # compatibility port, not a claim that upstream ships an untouched 2.3.0
  # kernel-4.19 patch. The workflow must verify the kernel-side SUSFS API and
  # the userspace-facing feature contract before declaring support.
  SUSFS_TARGET_MAJOR: 2
  SUSFS_TARGET_MINOR: 3
  SUSFS_TARGET_PATCH: 0
  # SUS_SU is intentionally NOT forced on for this 4.19 manual-hook kernel.
  # Upstream SUSFS documents SUS_SU as unsupported for non-GKI/manual-hook
  # integration; all other compatible SUSFS facilities remain enabled.
  SUSFS_NON_GKI_SUS_SU: false
  SUSFS_BACKPORT_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  SUSFS_BACKPORT_REF: mainline
  SUSFS_BACKPORT_COMMIT: f15603b246d7ce6008af8bdefa0a34b3df28326a
  SUSFS_PATCH_PATH: Patches/Patch/susfs_patch_to_4.19.patch
  SUSFS_PATCH_BLOB_SHA256: f9d8ed735f461ed982d2c49b338e35c17f4378e5
  # This repo documents susfs_patch_to_<kernel>.patch + susfs_inline_hook_patches.sh
  # as the two-layer non-GKI SUSFS integration path.

  CLANG_REV: clang-r563880c
  CLANG_COMMIT: f8439f0628d799092dd07df440a6334cab28939c
  WORKFLOW_VERSION: V97
  OUTPUT_PREFIX: V97-LM-G900-KARNAL
  # Historical integration notes are retained for auditability; active KSU source is
  # the official KernelSU-Next legacy branch configured above.
  # 2) pin the SUSFS backport source to the audited commit
  # 3) discover the actual 4.19 backport filename used by that source
  # 4) try a strict direct apply first, then a Git 3-way merge against the staged CIP+KSUN tree
  # 5) reject any unresolved conflicts, .rej/.orig files, or conflict markers
  # 6) verify CONFIG_KSU_SUSFS exists before enabling it
  # 7) fetch the SUSFS backport with retryable Git transport instead of one fragile clone
  # 8) enforce that the pinned 4.19 patch and inline-hook script both declare SUSFS 2.3.x
  #
  # V23 fixes the actual, reproducible Step-7 abort seen on every V22 run:
  # 9) the per-file `patch -p1` call for the four audited conflict files (fs/namespace.c,
  #    fs/proc/cmdline.c, fs/proc/task_mmu.c, fs/super.c) was wrapped in `set +e ... set -e`,
  #    which does NOT stop bash's ERR trap from firing on the expected/audited hunk failure.
  #    Because `set -E` is also active, the trap fired a second time inside the `(cd kernel && ...)`
  #    subshell too (wrong cwd -> "tee: ... No such file or directory" noise), then again in the
  #    outer shell, aborting Step 7 on the very first expected failure (fs/namespace.c) every time,
  #    before the semantic source port, the other 3 files, or the inline-hook stage ever ran.
  #    Fixed with the same `if <cmd>; then rc=0; else rc=$?; fi` guard already used correctly for
  #    the 3-way `git apply`, and `patch -d kernel` instead of a `(cd kernel && ...)` subshell so
  #    there is no subshell for the inherited ERR trap to misfire inside.
  #
  # V24 fixes what Step 7 hits once V23's fix lets it run to completion: the patch apply,
  # semantic four-file port, and inline-hook layer (fs/exec.c, fs/open.c, etc.) all succeed,
  # but the final "config KSU_SUSFS" Kconfig check always fails. Researched and confirmed this
  # is a genuine source-compatibility gap, not a script bug: SUSFS 2.x's inline hooks expect
  # ksu_su_compat_enabled, ksu_handle_execveat, ksu_handle_faccessat, ksu_handle_stat,
  # ksu_handle_setresuid, and a "config KSU_SUSFS" Kconfig entry to already exist inside
  # KernelSU's own source -- vanilla/official KernelSU-Next (KernelSU-Next/KernelSU-Next) does
  # not carry them. Step 6 now clones KernelSU-Next's own SUSFS fork (pershoot/KernelSU-Next,
  # branch dev-susfs) instead, which several current, independent SUSFS+KernelSU-Next projects
  # use for this exact reason. Everything else about Step 6 (driver symlink, Makefile/Kconfig
  # wiring, KSU_VERSION=v3.4.0 legacy baseline) is unchanged.
  #
  # V25: dev-susfs is an actively-moving experimental branch, so V24's exact-commit pin broke
  # ("fatal: unable to read tree") the moment that commit was rewritten off the branch. V25
  # tracks the branch's current tip instead of a fixed commit -- Step 6 records exactly which
  # commit was used in logs/06-kernelsu-resolved.txt every run, and still fails immediately,
  # inside Step 6 itself, if that commit ever stops declaring "config KSU_SUSFS".


  # V34: V33 build log exposed two concrete regressions in the V33 compatibility edits:
  # (1) the injected common-touch guard was left unterminated, and (2) pkg_observer was
  # given the 4.19 fsnotify callback type but its body still dereferenced file_name as a qstr.
  # V34 repairs only those two source-compatibility mistakes; no setup, future, overlay,
  # touch definition, KernelSU feature, or SUSFS feature is removed.

  # V40 (built from the complete V39 run-478 logs; every V39 feature/step is kept):
  # 1) REAL ERROR 1, drivers/kernelsu/selinux/sepolicy.c (20+ errors, "too many errors emitted"):
  #    struct flex_array vs avtab_node, struct filename_trans_key, policydb_filenametr_search,
  #    type_val_to_struct... V39's Step-6 note assumed the policydb editing primitives compile on
  #    older kernels; the log shows they do not. Linux 4.19 has the pre-5.7 policydb layout.
  #    Only apply_kernelsu_rules()/handle_sepolicy() use these primitives and V39 already stubs both
  #    for <5.7, so V40 wraps the rest of sepolicy.c: original code for >=5.7, safe no-op stubs below.
  #    Stubs are generated from the real file (no hard-coded line numbers).
  #    Consequence (already true in V39): KernelSU cannot inject its su SELinux rules on this kernel;
  #    this device boots with androidboot.selinux=permissive so that is not blocking.
  # 2) seccomp_cache.c: V32 made it compile by defining SECCOMP_ARCH_NATIVE_NR in the arm64 header. That
  #    file mirrors the Linux 5.11+ per-filter action cache, which 4.19 does not have, so at runtime it
  #    would write bits at offsets that are not part of a 4.19 struct seccomp_filter (kernel heap
  #    corruption when root is granted). V40 keeps the header definitions but turns the exported cache
  #    functions into no-ops (nothing to clear on a kernel without the cache).
  # 3) REAL ERROR 2, DTC lito-caymanlm_cn-rev-1.0_overlay.dtbo, is STILL present in V39 (log line 2963),
  #    so the duplicate-include theory did not clear it. It is independent of the Image, so V40 builds
  #    the Image target only, and the non-blocking Step 9b re-runs the DTB build with V=1 and re-runs dtc
  #    without -qq to capture the hidden dtc message in logs/09b-*.
  # 4) All of drivers/kernelsu is compiled with `make -k` first (1-2 min): make otherwise stops at the
  #    first failing file, so each 8-minute run revealed only one new error.
  # 5) The last lines of a failed build are harmless CC lines; Step 9 now prints an error summary at the
  #    end of the log.

  # V41 (built from the complete V40 run-479 logs; the V40 pre-compile did its job and listed everything):
  # 1) ~7 of the "errors" were `'flask.h' file not found` in sucompat.c, file_wrapper.c, selinux.c, rules.c,
  #    sepolicy.c and selinux_hide.c. They were NOT real: flask.h/av_permissions.h are generated while
  #    security/selinux/ is built, and the V40 pre-compile built drivers/kernelsu before that (the same
  #    files had compiled fine in the V39 full build). V41 builds security/selinux/ first. This also removes
  #    the same ordering race from the real build.
  # 2) supercall/dispatch.c (6 errors): tasklist_lock, init_task, task_pgrp(), task_session() are only
  #    visible through <linux/sched/task.h> and <linux/sched/signal.h> on 4.19. V41 adds those includes.
  # 3) supercall/supercall.c: TWA_RESUME does not exist before Linux 5.7 (4.19 task_work_add() takes a
  #    bool). V41 uses the same KSU_TASK_WORK_RESUME compat macro V35 already added for allowlist.c.
  # 4) DTC finally has a real message (logs/09b-dtc-verbose.txt): ERROR (duplicate_label) camera_therm_default
  #    and bmr_w_therm_default, defined in both /fragment@18 and /fragment@153 of the CN overlay. It is not the
  #    touch include. The Image build does not depend on it; Step 9b now also lists which .dtsi files
  #    define those labels (logs/09b-dup-label-sources.txt) so the exact duplicate include can be removed.

  # V42 (built from the complete V41 run logs): V41 fixed everything except one file. The pre-compile now
  # reports exactly 11 errors, all in drivers/kernelsu/feature/selinux_hide.c: struct selinux_state has no
  # status_lock/status_page/policy and struct selinux_policy is incomplete. Those members/types exist only
  # since the Linux 5.7 SELinux rewrite (4.19 keeps the status page in ss/status.c globals and the policy in
  # services.c), so this SELinux-hiding feature cannot work on this kernel. V42 wraps the file like
  # sepolicy.c: original code for >=5.7, safe no-op stubs below. Nothing else in KernelSU changes.
  # The final build also uses `make -k`, so if anything else in the WHOLE kernel (SUSFS files, etc.) fails,
  # every error is listed in one run instead of only the first.
  # DTC (non-blocking): logs/09b-dup-label-sources.txt shows camera_therm_default and bmr_w_therm_default are
  # defined both in qcom/lito-pmic-overlay.dtsi and in lito-caymanlm_lao_com-pm.dtsi.

  # V43 (previous run; actual V43 build log analyzed for V82):
  # V82 (built from the complete V43 run-logs.zip): the selinux_hide.c stub from V42 cleared that file, and the pre-compile
  # moved on to the final Image link, which failed with 3 ld.lld "undefined symbol" errors: seccomp_filter_release
  # (drivers/kernelsu/policy/app_profile.c), path_mount (drivers/kernelsu/infra/su_mount_ns.c), and path_umount
  # (drivers/kernelsu/feature/kernel_umount.c) -- all Linux 5.9+ kernel-internal entry points this 4.19.325 tree
  # does not have. Verified against the actual upstream commits that introduced path_mount/path_umount (Christoph
  # Hellwig, merged for 5.9) and kernel/seccomp.c's existing put_seccomp_filter(); added as compatibility wrappers
  # in fs/namespace.c and kernel/seccomp.c (see the "V43 FIX" comment in Step 9 for the full derivation). Nothing
  # else in KernelSU or the kernel tree changes.

jobs:
  build:
    name: Build V96
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "1. Checkout kernel source"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs diagnostics
          exec > >(tee -a logs/01-checkout.log) 2>&1
          echo "::group::[1/15] Checkout kernel source"
          git clone --branch "${KERNEL_REF}" "${KERNEL_REPO}" kernel
          cd kernel
          git fetch --tags --force --prune
          git checkout --detach "${KERNEL_COMMIT}"
          test "$(git rev-parse HEAD)" = "${KERNEL_COMMIT}"
          test "$(make -s kernelversion)" = "${BASELINE_KERNEL_VERSION}"
          git status --short > ../baseline-git-status.txt
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)" > ../source-info.txt
          printf 'SOURCE_BRANCH=%s\n' "${KERNEL_REF}" >> ../source-info.txt
          printf 'SOURCE_EXPECTED_COMMIT=%s\n' "${KERNEL_COMMIT}" >> ../source-info.txt
          printf 'KERNEL_VERSION=%s\n' "$(make -s kernelversion)" >> ../source-info.txt
          echo "[OK] Source: $(git rev-parse HEAD)"
          echo "[OK] Kernel version: $(make -s kernelversion)"
          echo "::endgroup::"

      - name: "2. Prepare build tools"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[2/15] Prepare build tools"
          {
            sudo apt-get update -qq
            sudo apt-get install -y -qq bc bison build-essential ccache clang flex gcc-aarch64-linux-gnu git lld libssl-dev libelf-dev libncurses-dev python3 rsync unzip zip wget curl device-tree-compiler patch
          } > logs/02-apt.log 2>&1
          curl -fL --retry 5 --retry-delay 2 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/${CLANG_REV}.tar.gz" -o "/tmp/${CLANG_REV}.tar.gz" > logs/02-clang-download.log 2>&1
          mkdir -p "clang-prebuilt/${CLANG_REV}"
          tar -xzf "/tmp/${CLANG_REV}.tar.gz" -C "clang-prebuilt/${CLANG_REV}" > logs/02-clang-extract.log 2>&1
          export CLANG_BIN="$GITHUB_WORKSPACE/clang-prebuilt/${CLANG_REV}/bin"
          test -x "${CLANG_BIN}/clang"
          test -x "${CLANG_BIN}/ld.lld"
          "${CLANG_BIN}/clang" --version | tee logs/02-clang-version.log
          head -n1 logs/02-clang-version.log > toolchain-version.txt
          echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"
          echo "[OK] Android Clang ${CLANG_REV}"
          echo "::endgroup::"

      - name: "3. Select and snapshot device defconfig"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs/device-tree diagnostics/device-tree
          exec > >(tee -a logs/03-defconfig-selection.log) 2>&1
          echo "::group::[3/15] Select and snapshot device defconfig"

          rm -rf device-caymanlm device-sm7250-common vendor-caymanlm
          git clone --depth=1 --branch "${DEVICE_REF}" "${DEVICE_REPO}" device-caymanlm
          git clone --depth=1 --branch "${COMMON_DEVICE_REF}" "${COMMON_DEVICE_REPO}" device-sm7250-common
          git clone --depth=1 --branch "${VENDOR_REF}" "${VENDOR_REPO}" vendor-caymanlm

          cp device-caymanlm/BoardConfig.mk logs/device-tree/BoardConfig.mk
          cp device-sm7250-common/BoardConfigCommon.mk logs/device-tree/BoardConfigCommon.mk
          cp vendor-caymanlm/BoardConfigVendor.mk logs/device-tree/BoardConfigVendor.mk

          TARGET_KERNEL_CONFIG="$({ grep -E '^[[:space:]]*TARGET_KERNEL_CONFIG[[:space:]]*:?=' device-caymanlm/BoardConfig.mk || true; } | tail -n1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//')"
          test -n "${TARGET_KERNEL_CONFIG}"
          test "${TARGET_KERNEL_CONFIG}" = "vendor/lineageos_cayman_defconfig"
          DEFCONFIG="arch/arm64/configs/${TARGET_KERNEL_CONFIG}"
          # V26: TARGET_KERNEL_CONFIG was only ever a local variable inside this step's own
          # shell process. Every GitHub Actions "run:" step is a fresh shell, so Step 8 (and
          # the defconfig= lines in Steps 12/15) reading "${TARGET_KERNEL_CONFIG}" always saw
          # an unset variable -- Step 8's `set -u` then aborted immediately with "unbound
          # variable" the moment execution finally reached it (previously Step 7 always failed
          # first, so this was never exercised). Export it through $GITHUB_ENV, the same way
          # CIP_TARGET already is elsewhere in this workflow, so it persists to every later step.
          echo "TARGET_KERNEL_CONFIG=${TARGET_KERNEL_CONFIG}" >> "$GITHUB_ENV"

          {
            echo "DEVICE_REPO=${DEVICE_REPO}"
            echo "DEVICE_REF=${DEVICE_REF}"
            echo "COMMON_DEVICE_REPO=${COMMON_DEVICE_REPO}"
            echo "COMMON_DEVICE_REF=${COMMON_DEVICE_REF}"
            echo "VENDOR_REPO=${VENDOR_REPO}"
            echo "VENDOR_REF=${VENDOR_REF}"
            echo "TARGET_KERNEL_CONFIG=${TARGET_KERNEL_CONFIG}"
            echo "DEFCONFIG=${DEFCONFIG}"
          } | tee logs/device-tree/selection.txt

          cd kernel
          test -f "${DEFCONFIG}"
          cp "${DEFCONFIG}" ../baseline-defconfig.txt
          sha256sum "${DEFCONFIG}" | tee ../logs/03-defconfig.sha256

          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="${CLANG_BIN}:$PATH"
          test -x "${CLANG_BIN}/clang"
          test -x "${CLANG_BIN}/ld.lld"
          make O=out "${TARGET_KERNEL_CONFIG}" > ../logs/03-defconfig-make.log 2>&1

          awk '/^CONFIG_[A-Za-z0-9_]+=(y|m|[0-9]+|"[^"]*")$/{print}' out/.config | sort > ../baseline-enabled-config.txt
          sha256sum ../baseline-enabled-config.txt | tee ../logs/03-baseline-enabled-config.sha256
          {
            echo "baseline_kernel_sha256=${BASELINE_KERNEL_SHA256}"
            echo "baseline_kernel_version=${BASELINE_KERNEL_VERSION}"
            echo "baseline_cip=${BASELINE_CIP}"
            echo "defconfig=${TARGET_KERNEL_CONFIG}"
            echo "baseline_enabled_config_count=$(wc -l < ../baseline-enabled-config.txt)"
          } > ../baseline-info.txt

          echo "[FIX] Toolchain prepared before defconfig; clang and ld.lld verified."
          echo "[OK] Device tree explicitly selects ${TARGET_KERNEL_CONFIG}"
          echo "[OK] Kernel defconfig exists: ${DEFCONFIG}"
          echo "::endgroup::"

      - name: "4. Resolve latest official CIP for 4.19.325"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[4/15] Resolve latest official CIP"
          cd kernel
          git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          git fetch --no-tags cip "+refs/tags/${BASELINE_CIP}:refs/tags/${BASELINE_CIP}" > ../logs/04-cip-baseline-fetch.log 2>&1
          git ls-remote --tags --refs cip "refs/tags/${CIP_PREFIX}*" > ../logs/04-cip-tags.txt 2>&1
          LATEST="$(awk -F/ '{print $NF}' ../logs/04-cip-tags.txt | grep -E "^${CIP_PREFIX}[0-9]+$" | sort -V | tail -n1)"
          test -n "${LATEST}"
          OLD_N="${BASELINE_CIP##*-cip}"; NEW_N="${LATEST##*-cip}"
          test "${NEW_N}" -ge "${OLD_N}"
          echo "CIP_TARGET=${LATEST}" >> "$GITHUB_ENV"
          git fetch --no-tags cip "refs/tags/${LATEST}:refs/tags/${LATEST}" > ../logs/04-cip-target-fetch.log 2>&1
          {
            echo "CIP_BASELINE=${BASELINE_CIP}"
            echo "CIP_TARGET=${LATEST}"
            echo "baseline_commit=$(git rev-parse ${BASELINE_CIP})"
            echo "target_commit=$(git rev-parse ${LATEST})"
            echo "target_subject=$(git show -s --format=%s ${LATEST})"
            git diff --stat "${BASELINE_CIP}..${LATEST}"
          } | tee ../logs/04-cip-version.log
          echo "[OK] Baseline: ${BASELINE_CIP}"
          echo "[OK] Latest official 4.19.325 CIP discovered: ${LATEST}"
          echo "::endgroup::"

      - name: "5. Integrate maximum clean CIP level (incremental chain)"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[5/15] Integrate maximum clean CIP level"
          cd kernel
          mkdir -p ../logs/cip-checks
          git remote get-url cip >/dev/null 2>&1 || git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git
          : > ../logs/05-cip-compatibility.log
          : > ../logs/05-cip-failure.log
          : > ../logs/05-cip-candidates.txt
          {
            echo "CIP compatibility probe"
            echo "Source commit=$(git rev-parse HEAD)"
            echo "Kernel version=$(make -s kernelversion)"
            echo "Baseline tag=${BASELINE_CIP}"
            echo "Remote=https://gitlab.com/cip-project/cip-kernel/linux-cip.git"
            echo "Method=incremental tag-to-tag deltas, strict apply first, clean 3-way second"
            echo
          } | tee -a ../logs/05-cip-compatibility.log

          git ls-remote --tags --refs cip "refs/tags/${CIP_PREFIX}*" > ../logs/05-cip-tags.txt 2>&1
          mapfile -t ALL_CIP_TAGS < <(
            awk -F/ '{print $NF}' ../logs/05-cip-tags.txt |
              grep -E "^${CIP_PREFIX}[0-9]+$" |
              sort -V
          )
          test "${#ALL_CIP_TAGS[@]}" -gt 0
          {
            echo "Baseline=${BASELINE_CIP}"
            echo "All_candidates=${#ALL_CIP_TAGS[@]}"
            printf '%s\n' "${ALL_CIP_TAGS[@]}"
          } | tee ../logs/05-cip-candidates.txt

          BASE_N="${BASELINE_CIP##*-cip}"
          mapfile -t CIP_TAGS < <(
            printf '%s\n' "${ALL_CIP_TAGS[@]}" |
              awk -v base="${BASE_N}" -F-cip '$2 >= base'
          )
          test "${#CIP_TAGS[@]}" -gt 0

          PREV_TAG="${BASELINE_CIP}"
          SELECTED="${BASELINE_CIP}"
          LAST_APPLY_MODE="baseline"
          : > ../logs/05-cip-chain.log

          # The V10 probe compared the entire 132->136 range directly against the
          # LG tree. That is overly strict for a cumulative stable/CIP series:
          # a file added by an intermediate tag (for example mm/kasan content)
          # cannot be represented correctly when the whole range is treated as
          # one patch against the old LG context. V11 walks 132->133->134->135->136
          # and tests each real tag-to-tag delta on the already-integrated tree.
          for TAG in "${CIP_TAGS[@]}"; do
            [ "${TAG}" = "${BASELINE_CIP}" ] && continue
            CHECK_LOG="../logs/cip-checks/${TAG}.log"
            PATCH_FILE="../logs/cip-${PREV_TAG}-to-${TAG}.patch"
            THREEWAY_LOG="../logs/cip-checks/${TAG}.3way"
            : > "${CHECK_LOG}"
            : > "${THREEWAY_LOG}"
            echo "============================================================" | tee -a ../logs/05-cip-chain.log
            echo "TEST=${PREV_TAG}..${TAG}" | tee -a ../logs/05-cip-chain.log

            if ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
              git fetch --no-tags cip "+refs/tags/${TAG}:refs/tags/${TAG}" >> "${CHECK_LOG}" 2>&1
            fi
            git diff --binary "${PREV_TAG}..${TAG}" > "${PATCH_FILE}"
            {
              echo "from=${PREV_TAG}"
              echo "to=${TAG}"
              echo "from_commit=$(git rev-parse ${PREV_TAG})"
              echo "to_commit=$(git rev-parse ${TAG})"
              echo "patch_sha256=$(sha256sum "${PATCH_FILE}" | awk '{print $1}')"
              echo "patch_bytes=$(wc -c < "${PATCH_FILE}")"
              echo "patch_files=$(git diff --name-only "${PREV_TAG}..${TAG}" | wc -l)"
            } >> "${CHECK_LOG}"

            if git apply --check --whitespace=nowarn "${PATCH_FILE}" > "${CHECK_LOG}.direct" 2>&1; then
              echo "COMPATIBLE=${TAG} mode=direct" | tee -a ../logs/05-cip-compatibility.log
              cat "${CHECK_LOG}.direct" >> "${CHECK_LOG}"
              git apply --index --whitespace=nowarn "${PATCH_FILE}" > ../logs/05-cip-apply.log 2>&1
              LAST_APPLY_MODE="direct"
              SELECTED="${TAG}"
              PREV_TAG="${TAG}"
              echo "APPLIED=${TAG} mode=direct" | tee -a ../logs/05-cip-chain.log
              git diff --check | tee ../logs/05-cip-diff-check.log
              continue
            fi

            echo "DIRECT_INCOMPATIBLE=${TAG}" | tee -a ../logs/05-cip-compatibility.log
            cat "${CHECK_LOG}.direct" >> "${CHECK_LOG}"

            # Git --3way --check can exit 0 while reporting a textual conflict;
            # V11 therefore rejects any conflict/error marker in the preflight log.
            if git apply --3way --check --whitespace=nowarn "${PATCH_FILE}" > "${THREEWAY_LOG}" 2>&1; then
              if ! grep -Eiq 'with conflicts|CONFLICT|error:|does not apply|patch failed' "${THREEWAY_LOG}"; then
                echo "COMPATIBLE=${TAG} mode=3way" | tee -a ../logs/05-cip-compatibility.log
                cat "${THREEWAY_LOG}" >> "${CHECK_LOG}"
                git apply --3way --index --whitespace=nowarn "${PATCH_FILE}" > ../logs/05-cip-apply.log 2>&1
                LAST_APPLY_MODE="3way"
                SELECTED="${TAG}"
                PREV_TAG="${TAG}"
                echo "APPLIED=${TAG} mode=3way" | tee -a ../logs/05-cip-chain.log
                git diff --check | tee ../logs/05-cip-diff-check.log
                continue
              fi
            fi

            {
              echo "INCOMPATIBLE=${TAG}"
              echo "=== direct ==="
              cat "${CHECK_LOG}.direct"
              echo "=== 3way ==="
              cat "${THREEWAY_LOG}"
            } | tee -a ../logs/05-cip-compatibility.log
            cp "${THREEWAY_LOG}" "../logs/cip-checks/${TAG}.result.log"
            echo "STOPPED_AT=${SELECTED} failed_candidate=${TAG}" | tee -a ../logs/05-cip-chain.log
            break
          done

          # A clean baseline is always required; failure before 133 is fatal.
          test "${SELECTED}" != "${BASELINE_CIP}" || {
            echo "[ERROR] No CIP delta could be applied to the LG baseline." | tee ../logs/05-cip-failure.log
            exit 1
          }

          CIP_TARGET="${SELECTED}"
          echo "CIP_TARGET=${CIP_TARGET}" >> "$GITHUB_ENV"
          git diff --binary "${BASELINE_CIP}..${CIP_TARGET}" > ../logs/cip-selected.patch
          sha256sum ../logs/cip-selected.patch | tee ../logs/cip-selected.sha256
          {
            echo "CIP_BASELINE=${BASELINE_CIP}"
            echo "CIP_TARGET=${CIP_TARGET}"
            echo "final_apply_mode=${LAST_APPLY_MODE}"
            echo "baseline_commit=$(git rev-parse ${BASELINE_CIP})"
            echo "target_commit=$(git rev-parse ${CIP_TARGET})"
            echo "target_subject=$(git show -s --format=%s ${CIP_TARGET})"
            echo "target_tree=$(git rev-parse ${CIP_TARGET}^{tree})"
            echo "kernel_version=$(make -s kernelversion)"
            git diff --stat "${BASELINE_CIP}..${CIP_TARGET}" || true
          } | tee ../logs/05-cip-version.log

          echo "[OK] Maximum clean incremental CIP level reached: ${CIP_TARGET}"
          echo "[INFO] If 136 stopped at an earlier tag, its exact conflict is preserved in logs/cip-checks/."
          echo "::endgroup::"

      - name: "6. Integrate KernelSU-Next official legacy driver + SUSFS compatibility"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[6/15] KernelSU-Next ${KSU_VERSION} legacy driver (${KSU_REPO_OWNER}/${KSU_REPO}@${KSU_REF})"
          cd kernel

          # V84: clone the official legacy branch. This is the actual non-GKI
          # KernelSU-Next driver integration path; CONFIG_KSU_MANUAL_HOOK is not
          # synthesized as a substitute.
          if test -d common/drivers; then DRIVER_DIR=common/drivers
          elif test -d drivers; then DRIVER_DIR=drivers
          else echo '[ERROR] "drivers/" directory not found.'; exit 127
          fi
          DRIVER_MAKEFILE="${DRIVER_DIR}/Makefile"
          DRIVER_KCONFIG="${DRIVER_DIR}/Kconfig"

          git clone --branch "${KSU_REF}" --single-branch \
            "https://github.com/${KSU_REPO_OWNER}/${KSU_REPO}" KernelSU-Next

          # V81 SOURCE-LEVEL FIX — The legacy UAPI already contains the modern
          # ksu_get_info_cmd.uapi_version field, but it defines KERNEL_SU_UAPI_VERSION
          # as 2. V82 incorrectly inserted a second *static const* value of 4 while
          # leaving the old #define 2 in place. The preprocessor therefore made the
          # actual dispatch.c value 2 even though the grep-based validation reported 4.
          #
          # V82 also incorrectly wrote cmd.uapi_version in do_get_info_legacy(), whose
          # struct intentionally has no uapi_version field. That changes/invalidates
          # the legacy ioctl path and can produce a compile error on the real source.
          #
          # Correct source-level contract:
          #   1) exactly one KERNEL_SU_UAPI_VERSION definition, value 4;
          #   2) ksu_get_info_cmd contains uapi_version;
          #   3) modern do_get_info() returns uapi_version=4;
          #   4) do_get_info_legacy() remains ABI-compatible and is NOT modified.
          # This backports only the UAPI detection contract; the official legacy
          # manual-hook driver, SUSFS, and all existing kernel features remain intact.
          UAPI_H="KernelSU-Next/uapi/supercall.h"
          DISPATCH_C="KernelSU-Next/kernel/supercall/dispatch.c"
          test -f "$UAPI_H"
          test -f "$DISPATCH_C"

          python3 - "$UAPI_H" "$DISPATCH_C" <<'PY_V81_UAPI'
          from pathlib import Path
          import re, sys

          uapi = Path(sys.argv[1])
          dispatch = Path(sys.argv[2])
          us = uapi.read_text()
          ds = dispatch.read_text()

          # Normalize ALL existing legacy/v3.4.0 forms to one exact definition.
          # This handles both:
          #   #define KERNEL_SU_UAPI_VERSION 2
          # and:
          #   static const __u32 KERNEL_SU_UAPI_VERSION = 2;
          patterns = [
              r'(?m)^[ \t]*#define[ \t]+KERNEL_SU_UAPI_VERSION[ \t]+[^\n]+\n?',
              r'(?m)^[ \t]*static[ \t]+const[ \t]+__u32[ \t]+KERNEL_SU_UAPI_VERSION[ \t]*=[ \t]*[0-9]+[ \t]*;[ \t]*\n?',
          ]
          for pat in patterns:
              us = re.sub(pat, '', us)

          anchor = '#include "uapi/app_profile.h"'
          if anchor not in us:
              raise SystemExit('[ERROR] V81: UAPI include anchor missing')
          us = us.replace(
              anchor,
              anchor + '\n\n// KernelSU-Next UAPI v4: Manager/kernel compatibility contract\n'
              'static const __u32 KERNEL_SU_UAPI_VERSION = 4;',
              1
          )

          # Add the bundled flag if this legacy header does not already have it.
          if 'KSU_GET_INFO_FLAG_BUNDLED' not in us:
              marker = 'static const __u32 KSU_GET_INFO_FLAG_PR_BUILD = (1U << 3);'
              define_marker = '#define KSU_GET_INFO_FLAG_PR_BUILD (1U << 3)'
              if marker in us:
                  us = us.replace(
                      marker,
                      marker + '\nstatic const __u32 KSU_GET_INFO_FLAG_BUNDLED = (1U << 4);',
                      1
                  )
              elif define_marker in us:
                  us = us.replace(
                      define_marker,
                      define_marker + '\n#define KSU_GET_INFO_FLAG_BUNDLED (1U << 4)',
                      1
                  )
              else:
                  raise SystemExit('[ERROR] V81: PR_BUILD flag anchor missing')

          # The modern GET_INFO struct must expose the fourth field.
          m = re.search(
              r'(struct\s+ksu_get_info_cmd\s*\{.*?__u32\s+features;[^\n]*\n)',
              us, flags=re.S
          )
          if not m:
              raise SystemExit('[ERROR] V81: ksu_get_info_cmd/features field not found')
          block = m.group(1)
          if 'uapi_version' not in block:
              replacement = block + '    __u32 uapi_version; /* Output: KERNEL_SU_UAPI_VERSION */\n'
              us = us[:m.start()] + replacement + us[m.end():]

          # V84: reconstruct the modern GET_INFO struct deterministically.
          # This prevents duplicate uapi_version fields from accumulating across
          # previous backport attempts. The legacy 3-field struct is untouched.
          m = re.search(r'(?ms)^(struct\s+ksu_get_info_cmd\s*\{).*?^\};', us)
          if not m:
              raise SystemExit('[ERROR] V84: ksu_get_info_cmd struct not found')
          modern_struct = """struct ksu_get_info_cmd {\n    __u32 version; /* Output: KERNEL_SU_VERSION */\n    __u32 flags; /* Output: KSU_GET_INFO_FLAG_* bits */\n    __u32 features; /* Output: max feature ID supported */\n    __u32 uapi_version; /* Output: KERNEL_SU_UAPI_VERSION */\n};"""
          us = us[:m.start()] + modern_struct + us[m.end():]

          # Modern handler: add the runtime UAPI value exactly once.
          start = ds.find('static int do_get_info(void __user *arg)')
          if start < 0:
              raise SystemExit('[ERROR] V81: do_get_info() not found in dispatch.c')
          end = ds.find('\n}', start)
          if end < 0:
              raise SystemExit('[ERROR] V81: end of do_get_info() not found')
          modern = ds[start:end]
          if 'cmd.uapi_version' not in modern:
              mm = re.search(r'(?m)^([ \t]*)cmd\.features\s*=.*?;\s*$', modern)
              if not mm:
                  raise SystemExit('[ERROR] V81: do_get_info() features assignment not found')
              line = mm.group(0)
              indent = mm.group(1)
              modern = modern.replace(
                  line,
                  line + '\n' + indent + 'cmd.uapi_version = KERNEL_SU_UAPI_VERSION;',
                  1
              )
              ds = ds[:start] + modern + ds[end:]

          # Never modify the legacy 3-field GET_INFO_LEGACY ABI.
          start_legacy = ds.find('static int do_get_info_legacy(void __user *arg)')
          if start_legacy < 0:
              raise SystemExit('[ERROR] V81: do_get_info_legacy() not found in dispatch.c')
          end_legacy = ds.find('\n}', start_legacy)
          if end_legacy < 0:
              raise SystemExit('[ERROR] V81: end of do_get_info_legacy() not found')
          legacy_block = ds[start_legacy:end_legacy]
          if 'cmd.uapi_version' in legacy_block:
              legacy_block = re.sub(
                  r'(?m)^[ \t]*cmd\.uapi_version\s*=\s*KERNEL_SU_UAPI_VERSION;\s*\n?',
                  '',
                  legacy_block
              )
              ds = ds[:start_legacy] + legacy_block + ds[end_legacy:]

          uapi.write_text(us)
          dispatch.write_text(ds)

          # Source-level invariants: fail if the source is ambiguous or the wrong
          # ioctl path was modified.
          version_defs = re.findall(
              r'(?m)^[ \t]*(?:#define[ \t]+KERNEL_SU_UAPI_VERSION[ \t]+[^\n]+|'
              r'static[ \t]+const[ \t]+__u32[ \t]+KERNEL_SU_UAPI_VERSION[ \t]*=[ \t]*[0-9]+[ \t]*;)',
              us
          )
          if len(version_defs) != 1:
              raise SystemExit(f'[ERROR] V81: expected exactly one UAPI version definition, found {len(version_defs)}')
          if not re.search(r'KERNEL_SU_UAPI_VERSION\s*=\s*4\s*;', us):
              raise SystemExit('[ERROR] V81: UAPI version definition is not exactly 4')
          info_struct = re.search(r'struct\s+ksu_get_info_cmd\s*\{.*?\n\}', us, flags=re.S).group(0)
          if len(re.findall(r'(?m)^\s*__u32\s+uapi_version\s*;', info_struct)) != 1:
              raise SystemExit('[ERROR] V84: modern GET_INFO struct must contain exactly one uapi_version field')
          if 'cmd.uapi_version = KERNEL_SU_UAPI_VERSION;' not in modern:
              raise SystemExit('[ERROR] V81: modern GET_INFO does not populate uapi_version')
          if 'cmd.uapi_version' in legacy_block:
              raise SystemExit('[ERROR] V81: legacy GET_INFO path still references uapi_version')
          print('[FIX] V81: corrected legacy UAPI v4 source contract; modern GET_INFO only')
          PY_V81_UAPI

          # Strong source checks. These validate the preprocessed contract rather than
          # merely grepping for a stray "4" while an older macro can still win.
          test "$(grep -Ec '^[[:space:]]*(#define[[:space:]]+KERNEL_SU_UAPI_VERSION|static[[:space:]]+const[[:space:]]+__u32[[:space:]]+KERNEL_SU_UAPI_VERSION)' "$UAPI_H")" -eq 1
          grep -Eq 'KERNEL_SU_UAPI_VERSION[[:space:]]*=[[:space:]]*4;' "$UAPI_H"
          grep -q 'uapi_version' "$UAPI_H"
          grep -q 'cmd.uapi_version = KERNEL_SU_UAPI_VERSION' "$DISPATCH_C"
          if awk '/static int do_get_info_legacy\(void __user \*arg\)/,/^}/' "$DISPATCH_C" | grep -q 'cmd\.uapi_version'; then
            echo "[ERROR] V81: legacy GET_INFO ABI was modified."
            exit 1
          fi
          echo "[OK] V81: actual source now returns UAPI v4 through modern GET_INFO; legacy ioctl ABI untouched."
          {
            echo "uapi_version=4"
            echo "uapi_source=KernelSU-Next v3.4.0 tag 1a879d6 UAPI contract backported to official legacy driver"
            echo "uapi_file=${UAPI_H}"
            echo "dispatch_file=${DISPATCH_C}"
            echo "legacy_get_info_abi=untouched"
          } | tee ../logs/06-kernelsu-uapi-v4.log

          # V84: DO NOT merge the normal v3.4.0 release into legacy.
          # Upstream keeps non-GKI/4.x support on the separate `legacy` branch; the
          # normal v3.4.0 release is a different history. Merging those histories
          # is not a supported way to create a v3.4.0 legacy driver and can mix
          # incompatible hook/Kbuild code.
          #
          # The requested Manager target remains v3.4.0 (33294-4), while the kernel
          # driver source uses the official `legacy` branch, which is the upstream
          # non-GKI/manual-hook path required by this 4.19 kernel.
          echo "[OK] KernelSU-Next official legacy branch selected; no unsupported v3.4.0/legacy merge"
          LEGACY_KSU_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          LEGACY_KSU_COUNT="$(git -C KernelSU-Next rev-list --count HEAD)"
          {
            echo "legacy_commit=${LEGACY_KSU_COMMIT}"
            echo "legacy_commit_count=${LEGACY_KSU_COUNT}"
            echo "manager_target=${KSU_VERSION}"
            echo "manager_build=${KSU_MANAGER_BUILD}"
          } | tee ../logs/06-kernelsu-legacy-source.txt

          # Upstream legacy Kconfig is the authoritative non-GKI/manual-hook contract.
          test -f KernelSU-Next/kernel/Kconfig
          grep -Eq '^[[:space:]]*config[[:space:]]+KSU_MANUAL_HOOK([[:space:]]|$)' KernelSU-Next/kernel/Kconfig

          # V96 ROOT-FIX: Do NOT stub KernelSU SELinux policy injection on 4.19.
          #
          # The previous V95 workflow incorrectly disabled apply_kernelsu_rules()
          # on all pre-5.7 kernels. That is the direct cause of the runtime failure
          # seen on the LG 4.19.325 device:
          #   security_secctx_to_secid u:r:ksu:s0 -> sid: 0, error: -22
          #   transive domain failed
          #
          # KernelSU-Next's official legacy rules.c has a dedicated pre-5.10 path:
          # it operates on the legacy global struct policydb and uses stop_machine()
          # when the policy rwlock is unavailable. The >=5.10 selinux_policy copy path
          # is separately guarded by SELINUX_POLICY_INSTEAD_SELINUX_SS. Therefore the
          # 4.19 tree must keep apply_kernelsu_rules() ACTIVE so the KSU domain/type
          # and permissions are inserted into the live policy before root transition.
          #
          # V95's blanket stub prevented that insertion, so u:r:ksu:s0 never became a
          # resolvable SID. SELinux being permissive does not make an unknown context
          # resolvable; security_secctx_to_secid() still returns -EINVAL (-22).
          #
          # Do not hand-write a replacement SELinux policy and do not change
          # KERNEL_SU_CONTEXT. Use the official legacy implementation and its
          # existing 4.19 compatibility path. This preserves SUSFS, manual hooks,
          # DT/DTBO handling and all other accumulated kernel features.
          RULES_C="KernelSU-Next/kernel/selinux/rules.c"
          SEPOLICY_C="KernelSU-Next/kernel/selinux/sepolicy.c"
          SELINUX_C="KernelSU-Next/kernel/selinux/selinux.c"
          test -f "$RULES_C"
          test -f "$SEPOLICY_C"
          test -f "$SELINUX_C"

          # Hard source guards: the legacy 4.19 build must not contain the V95
          # pre-5.7 stub that disabled KSU policy injection.
          if grep -q 'SELinux policy hot-patch API unavailable on this kernel' "$RULES_C"; then
            echo '[ERROR] V96: legacy rules.c still contains the V95 SELinux policy-injection stub.'
            exit 1
          fi
          if ! grep -q 'void apply_kernelsu_rules()' "$RULES_C"; then
            echo '[ERROR] V96: apply_kernelsu_rules() missing.'
            exit 1
          fi
          if ! grep -q 'db = get_policydb();' "$RULES_C"; then
            echo '[ERROR] V96: 4.19 policydb path missing from legacy rules.c.'
            exit 1
          fi
          if ! grep -q 'stop_machine(apply_kernelsu_rules_fn' "$RULES_C"; then
            echo '[ERROR] V96: legacy stop_machine() SELinux policy path missing.'
            exit 1
          fi
          if ! grep -q 'ksu_type(db, KERNEL_SU_DOMAIN, "domain")' "$RULES_C"; then
            echo '[ERROR] V96: KSU domain creation rule missing.'
            exit 1
          fi
          if ! grep -q 'ksu_type(db, KERNEL_SU_FILE, "file_type")' "$RULES_C"; then
            echo '[ERROR] V96: ksu_file type creation rule missing.'
            exit 1
          fi

          # 4.19 must use the legacy/global-policy path; the selinux_policy copy
          # helpers are guarded upstream for newer kernels and must not be forced
          # into the 4.19 build by this workflow.
          grep -q '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)' "$RULES_C" || true
          grep -q '#ifdef SELINUX_POLICY_INSTEAD_SELINUX_SS' "$RULES_C"

          {
            echo 'selinux_fix=V96'
            echo 'root_cause=V95 disabled apply_kernelsu_rules() on 4.19, preventing creation of u:r:ksu:s0 in the live policy'
            echo 'expected_runtime=security_secctx_to_secid(u:r:ksu:s0) must resolve to a non-zero SID'
            echo 'legacy_policy_path=global policydb + policy rwlock/stop_machine'
            echo 'ksu_domain=u:r:ksu:s0'
            echo 'ksu_file=u:object_r:ksu_file:s0'
            echo 'manual_hook=preserved'
            echo 'susfs=preserved'
          } | tee ../logs/06-selinux-v96-source-fix.log

          echo '[OK] V96: official legacy SELinux policy injection remains enabled for 4.19.'

          ln -sf "$(realpath --relative-to="${DRIVER_DIR}" "$(pwd)/KernelSU-Next/kernel")" "${DRIVER_DIR}/kernelsu"
          grep -q "kernelsu" "${DRIVER_MAKEFILE}" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "${DRIVER_MAKEFILE}"
          grep -q 'source "drivers/kernelsu/Kconfig"' "${DRIVER_KCONFIG}" || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" "${DRIVER_KCONFIG}"

          test -d KernelSU-Next
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          grep -Eq '^[[:space:]]*config[[:space:]]+KSU([[:space:]]|$)' "$KSU_KCONFIG"

          # The official legacy branch must supply the real manual-hook contract.
          grep -Eq '^[[:space:]]*config[[:space:]]+KSU_MANUAL_HOOK([[:space:]]|$)' "$KSU_KCONFIG"

          # Preserve the existing SUSFS namespace without replacing the legacy driver.
          python3 - "$KSU_KCONFIG" <<'PY_V87_SUSFS_KCONFIG'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); s=p.read_text()
          if not re.search(r'^\s*config\s+KSU_SUSFS(?:\s|$)', s, re.M):
              block="""
          menu \"KernelSU - SUSFS\"
          config KSU_SUSFS
          \tbool \"KernelSU addon - SUSFS\"
          \tdepends on KSU
          \tdepends on THREAD_INFO_IN_TASK
          \tdefault y
          config KSU_SUSFS_SUS_PATH
          \tbool \"Enable to hide suspicious path\"
          \tdepends on KSU_SUSFS
          \tdefault y
          config KSU_SUSFS_SUS_MOUNT
          \tbool \"Enable to hide suspicious mounts\"
          \tdepends on KSU_SUSFS
          \tdefault y
          config KSU_SUSFS_SUS_KSTAT
          \tbool \"Enable to spoof suspicious kstat\"
          \tdepends on KSU_SUSFS
          \tdefault y
          config KSU_SUSFS_SPOOF_UNAME
          \tbool \"Enable to spoof uname\"
          \tdepends on KSU_SUSFS
          \tdefault y
          config KSU_SUSFS_ENABLE_LOG
          \tbool \"Enable logging susfs log to kernel\"
          \tdepends on KSU_SUSFS
          \tdefault y
          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          \tbool \"Enable to hide ksu and susfs symbols\"
          \tdepends on KSU_SUSFS
          \tdefault y
          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          \tbool \"Enable to spoof cmdline or bootconfig\"
          \tdepends on KSU_SUSFS
          \tdefault y
          config KSU_SUSFS_OPEN_REDIRECT
          \tbool \"Enable open redirect\"
          \tdepends on KSU_SUSFS
          \tdefault y
          config KSU_SUSFS_SUS_MAP
          \tbool \"Enable SUS_MAP\"
          \tdepends on KSU_SUSFS
          \tdefault y
          endmenu
          """
              pos=s.rfind('endmenu')
              if pos<0: raise SystemExit('KSU Kconfig endmenu missing')
              s=s[:pos]+block+s[pos:]
              p.write_text(s)
          PY_V87_SUSFS_KCONFIG
          grep -Eq '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' "$KSU_KCONFIG"

          # Verify the actual legacy driver exports the manual-hook functions used by
          # the existing SUSFS inline-hook stage.
          for sym in ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_setresuid ksu_handle_sys_reboot; do
            grep -Rqs --include='*.c' --include='*.h' "$sym" drivers/kernelsu || {
              echo "[ERROR] legacy driver missing required manual-hook symbol: $sym"; exit 1;
            }
          done

          KSU_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          KSU_TAG="$(git -C KernelSU-Next describe --tags 2>/dev/null || true)"
          {
            echo "requested=${KSU_VERSION}"
            echo "repo=${KSU_REPO_OWNER}/${KSU_REPO}@${KSU_REF}"
            echo "resolved_describe=${KSU_TAG}"
            echo "resolved_commit=${KSU_COMMIT}"
            echo "kconfig_symbol=KSU"
            echo "kconfig_symbol=KSU_SUSFS"
            echo "kconfig_symbol=KSU_MANUAL_HOOK"
            echo "symlink=$(readlink drivers/kernelsu)"
          } | tee ../logs/06-kernelsu-resolved.txt
          echo "[OK] KernelSU-Next ${KSU_VERSION} legacy driver integrated with preserved SUSFS compatibility"
          echo "::endgroup::"

      - name: "6a. Bridge SUSFS 2.3.0 hook ABI into official legacy driver"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[6a/15] Bridge only the seven SUSFS/KSU symbols proven missing by the V84 linker"
          # Each GitHub Actions step starts in the workspace root. Step 6 intentionally
          # changes into kernel; Step 6a must do the same before addressing KernelSU-Next.
          # V86 failed only because this cwd was omitted, so Path("KernelSU-Next/...")
          # resolved at the workspace root where that directory does not exist.
          cd kernel
          test -d KernelSU-Next/kernel
          python3 - <<'PY_KSU_SUSFS_LEGACY_BRIDGE'
          from pathlib import Path
          import re

          root = Path("KernelSU-Next/kernel")
          runtime = root / "runtime/ksud_integration.c"
          sucompat = root / "feature/sucompat.c"
          sucompat_h = root / "feature/sucompat.h"
          selinux = root / "selinux/selinux.c"
          selinux_h = root / "selinux/selinux.h"
          rules = root / "selinux/rules.c"

          # V84 proved this exact seven-symbol ABI gap. Do not alter other subsystems.
          # The definitions are source-matched to the SUSFS-aware KernelSU-Next code path.

          s = runtime.read_text()
          if "DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled);" not in s:
              inc = "#include <linux/workqueue.h>\n"
              if inc not in s:
                  raise SystemExit("runtime workqueue include anchor missing")
              s = s.replace(inc, inc + "#ifdef CONFIG_KSU_SUSFS\n#include <linux/jump_label.h>\nDEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled);\nDEFINE_STATIC_KEY_TRUE(ksu_is_input_hook_enabled);\n#endif\n", 1)
          if "void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr)" not in s:
              marker = "static unsigned int volumedown_pressed_count = 0;\n"
              block = '''#ifdef CONFIG_KSU_SUSFS
          void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr)
          {
              loff_t new_size = *kstat_size_ptr + ksu_rc_len;
              struct file *file = fget(fd);
              if (!file)
                  return;
              if (is_init_rc(file)) {
                  pr_info("stat init.rc");
                  pr_info("adding ksu_rc_len: %lld -> %lld", *kstat_size_ptr, new_size);
                  *kstat_size_ptr = new_size;
              }
              fput(file);
          }
          #endif

          '''
              if marker not in s:
                  raise SystemExit("runtime volumedown anchor missing")
              s = s.replace(marker, block + marker, 1)
          runtime.write_text(s)

          # V93 root-cause fix:
          # The V91 compiler error was not 19 independent errors. The first error
          # came from feature/sucompat.h declaring the legacy feature switch as
          # `extern bool`, while V90/V91 correctly changed the definition in
          # sucompat.c to `DEFINE_STATIC_KEY_TRUE(...)` for the SUSFS 2.3 inline
          # hook ABI. Clang then reported the static-key definition as conflicting
          # with the bool declaration, and every static_branch_* use cascaded.
          #
          # Fix the declaration at the same source boundary. Do NOT revert the
          # static-key definition: fs/open.c, fs/stat.c and fs/exec.c from the
          # SUSFS inline-hook layer explicitly expect struct static_key_true.
          h = sucompat_h.read_text()
          if "extern struct static_key_true ksu_su_compat_enabled;" not in h:
              h = h.replace("#include <linux/types.h>\n",
                            "#include <linux/types.h>\n#include <linux/jump_label.h>\n", 1)
              h = re.sub(
                  r"(?m)^\s*extern\s+bool\s+ksu_su_compat_enabled\s*;\s*$",
                  "extern struct static_key_true ksu_su_compat_enabled;",
                  h,
                  count=1,
              )
          else:
              if "#include <linux/jump_label.h>" not in h:
                  h = h.replace("#include <linux/types.h>\n",
                                "#include <linux/types.h>\n#include <linux/jump_label.h>\n", 1)
          if "extern bool ksu_su_compat_enabled;" in h:
              raise SystemExit("V93: stale bool declaration remains in sucompat.h")
          if "extern struct static_key_true ksu_su_compat_enabled;" not in h:
              raise SystemExit("V93: static-key declaration missing from sucompat.h")
          sucompat_h.write_text(h)

          s = sucompat.read_text()

          # V88/V89's six final-link relocations were not caused by the init/input
          # hook keys. The SUSFS 2.3.0 inline-hook patch declares
          # ksu_su_compat_enabled as struct static_key_true, while the official
          # legacy driver still defines it as a plain bool. On arm64/4.19 that
          # makes the SUSFS call sites emit a 32-bit static-key access to the
          # legacy bool's byte address (the 0x...D2 target in V88/V89).
          # Convert that one legacy feature switch to the exact static-key ABI
          # used by the SUSFS-aware KernelSU-Next source.
          # V91: the legacy source is whitespace-sensitive enough that the previous
          # exact multiline replacement could fail even when the real function was present.
          # Replace the two feature-handler functions structurally (signature + balanced braces),
          # not by indentation/spacing. This is source-level, deterministic, and only touches
          # the single static-key ABI needed by SUSFS 2.3 on this 4.19 tree.
          def replace_c_function(text, signature, replacement):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f"missing C function: {signature}")
              brace = text.find("{", start)
              if brace < 0:
                  raise SystemExit(f"missing opening brace: {signature}")
              depth = 0
              end = None
              i = brace
              while i < len(text):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
                  i += 1
              if end is None:
                  raise SystemExit(f"unbalanced C function: {signature}")
              return text[:start] + replacement.rstrip() + text[end:]

          if "DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);" not in s:
              inc = '#include <linux/fs.h>\n'
              if inc not in s:
                  raise SystemExit("sucompat fs include anchor missing")
              if '#include <linux/jump_label.h>' not in s:
                  s = s.replace(inc, inc + '#include <linux/jump_label.h>\n', 1)
              old_def = 'bool ksu_su_compat_enabled __read_mostly = true;'
              if old_def not in s:
                  raise SystemExit("legacy ksu_su_compat_enabled boolean definition missing")
              s = s.replace(old_def, 'DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);', 1)

          new_get = """static int su_compat_feature_get(u64 *value)
          {
              *value = static_key_enabled(&ksu_su_compat_enabled) ? 1 : 0;
              return 0;
          }"""
          s = replace_c_function(s, "static int su_compat_feature_get(u64 *value)", new_get)

          new_set = """static int su_compat_feature_set(u64 value)
          {
              bool enable = value != 0;
              if (enable)
                  static_branch_enable(&ksu_su_compat_enabled);
              else
                  static_branch_disable(&ksu_su_compat_enabled);
              pr_info("su_compat: set to %d\\n", enable);
              return 0;
          }"""
          s = replace_c_function(s, "static int su_compat_feature_set(u64 value)", new_set)

          s = s.replace('if (!ksu_su_compat_enabled)',
                        'if (!static_branch_likely(&ksu_su_compat_enabled))')

          if "int ksu_handle_post_execveat_sucompat(" not in s:
              # The official legacy driver exposes ksu_install_fd(), not the newer
              # scoped su-session fd API. Reuse the legacy fd ABI rather than
              # importing the newer supercall permission model into this 4.19 tree.
              include = '#include "supercall/supercall.h"\n'
              if include not in s:
                  anchor = '#include "sulog/event.h"\n'
                  if anchor not in s:
                      raise SystemExit("sucompat sulog include anchor missing")
                  s = s.replace(anchor, anchor + include, 1)
              marker = "// sucompat: permitted process can execute 'su' to gain root access.\n"
              block = '''#ifdef CONFIG_KSU_SUSFS
          int ksu_handle_post_execveat_sucompat(int *fd, struct filename **filename_ptr,
                 void *argv_user, void *envp_user,
                 int *__never_use_flags, int *retval)
          {
              if (retval && *retval >= 0)
                  (void)ksu_install_fd();
              return 0;
          }
          #endif

          '''
              if marker not in s:
                  raise SystemExit("sucompat anchor missing")
              s = s.replace(marker, block + marker, 1)
          sucompat.write_text(s)


          s = selinux.read_text()
          if "u32 susfs_ksu_sid __read_mostly" not in s:
              marker = "u32 ksu_file_sid __read_mostly = 0;\n"
              block = '''u32 ksu_file_sid __read_mostly = 0;
          #ifdef CONFIG_KSU_SUSFS
          u32 susfs_ksu_sid __read_mostly = 0;
          u32 susfs_init_sid __read_mostly = 0;
          u32 susfs_zygote_sid __read_mostly = 0;
          u32 susfs_zygote_next_sid __read_mostly = 0;
          u32 susfs_priv_app_sid __read_mostly = 0;
          #endif
          '''
              if marker not in s:
                  raise SystemExit("selinux SID anchor missing")
              s = s.replace(marker, block, 1)
          if "bool susfs_is_current_ksu_domain(void)" not in s:
              marker = "void escape_to_root_for_adb_root(void)\n"
              block = '''#ifdef CONFIG_KSU_SUSFS
          #define KERNEL_INIT_DOMAIN "u:r:init:s0"
          #define KERNEL_ZYGOTE_DOMAIN "u:r:zygote:s0"
          #define KERNEL_ZYGOTE_NEXT_DOMAIN "u:r:zygote_next:s0"
          #define KERNEL_PRIV_APP_DOMAIN "u:r:priv_app:s0:c512,c768"
          static inline void susfs_set_sid(const char *secctx_name, u32 *out_sid)
          {
              int err;
              if (!secctx_name || !out_sid)
                  return;
              err = security_secctx_to_secid(secctx_name, strlen(secctx_name), out_sid);
              if (err)
                  pr_err("failed setting sid for '%s', err: %d\\n", secctx_name, err);
          }
          bool susfs_is_sid_equal(const struct cred *cred, u32 sid2)
          {
              struct task_security_struct *tsec = selinux_cred(cred);
              return tsec ? tsec->sid == sid2 : false;
          }
          u32 susfs_get_sid_from_name(const char *secctx_name)
          {
              u32 sid = 0;
              if (!secctx_name)
                  return 0;
              if (security_secctx_to_secid(secctx_name, strlen(secctx_name), &sid))
                  return 0;
              return sid;
          }
          u32 susfs_get_current_sid(void) { return current_sid(); }
          bool susfs_is_current_zygote_domain(void) { return unlikely(current_sid() == susfs_zygote_sid); }
          bool susfs_is_current_zygote_next_domain(void) { return unlikely(current_sid() == susfs_zygote_next_sid); }
          bool susfs_is_current_ksu_domain(void) { return unlikely(current_sid() == susfs_ksu_sid); }
          bool susfs_is_current_init_domain(void) { return unlikely(current_sid() == susfs_init_sid); }
          void susfs_set_batch_sid(void)
          {
              susfs_set_sid(KERNEL_ZYGOTE_DOMAIN, &susfs_zygote_sid);
              susfs_set_sid(KERNEL_ZYGOTE_NEXT_DOMAIN, &susfs_zygote_next_sid);
              susfs_set_sid(KERNEL_SU_CONTEXT, &susfs_ksu_sid);
              susfs_set_sid(KERNEL_INIT_DOMAIN, &susfs_init_sid);
              susfs_set_sid(KERNEL_PRIV_APP_DOMAIN, &susfs_priv_app_sid);
          }
          #endif

          '''
              if marker not in s:
                  raise SystemExit("selinux function anchor missing")
              s = s.replace(marker, block + marker, 1)
          selinux.write_text(s)

          s = selinux_h.read_text()
          if "void susfs_set_batch_sid(void);" not in s:
              marker = "void cache_sid(void);\n"
              if marker not in s:
                  raise SystemExit("selinux.h cache_sid anchor missing")
              s = s.replace(marker, marker + "#ifdef CONFIG_KSU_SUSFS\nvoid susfs_set_batch_sid(void);\n#endif\n", 1)
          selinux_h.write_text(s)

          s = rules.read_text()
          if "susfs_set_batch_sid();" not in s:
              # The legacy rules.c used here does NOT put KSU_SEPOLICY_MAX_BATCH_SIZE
              # immediately after the apply_kernelsu_rules() closing brace. On this
              # source it is separated by the #else pre-5.7 implementation, so the
              # old V86 anchor could never match. Use the exact, source-verified
              # tail of the real >=5.7 implementation, then also initialize the
              # SUSFS SID cache in the pre-5.7 stub used by this 4.19 kernel.
                        actual_anchor = """out_flush:
          \tsmp_mb();
          \treset_avc_cache();
          #endif
          }
          #else
          void apply_kernelsu_rules()
          """
                        actual_replacement = """out_flush:
          \tsmp_mb();
          \treset_avc_cache();
          #ifdef CONFIG_KSU_SUSFS
          \tsusfs_set_batch_sid();
          #endif
          #endif
          }
          #else
          void apply_kernelsu_rules()
          """
                        if actual_anchor not in s:
                            raise SystemExit("rules actual apply_kernelsu_rules tail anchor missing")
                        s = s.replace(actual_anchor, actual_replacement, 1)
          
                        stub_anchor = """void apply_kernelsu_rules()
          {
              pr_warn("KernelSU: SELinux policy hot-patch API unavailable on this kernel "
                      "(pre-5.7 SELinux); skipping in-kernel su domain policy injection.\\n");
          }
          #endif
          """
                        stub_replacement = """void apply_kernelsu_rules()
          {
              pr_warn("KernelSU: SELinux policy hot-patch API unavailable on this kernel "
                      "(pre-5.7 SELinux); skipping in-kernel su domain policy injection.\\n");
          #ifdef CONFIG_KSU_SUSFS
              susfs_set_batch_sid();
          #endif
          }
          #endif
          """
                        if stub_anchor not in s:
                            raise SystemExit("rules pre-5.7 stub anchor missing")
                        s = s.replace(stub_anchor, stub_replacement, 1)
          rules.write_text(s)

          checks = {
              "ksu_is_input_hook_enabled": runtime.read_text(),
              "ksu_is_init_rc_hook_enabled": runtime.read_text(),
              "ksu_handle_vfs_fstat": runtime.read_text(),
              "ksu_handle_post_execveat_sucompat": sucompat.read_text(),
              "susfs_ksu_sid": selinux.read_text(),
              "susfs_priv_app_sid": selinux.read_text(),
              "susfs_is_current_ksu_domain": selinux.read_text(),
          }
          for sym, body in checks.items():
              if sym not in body:
                  raise SystemExit(f"missing V90 bridge definition: {sym}")
          if "susfs_set_batch_sid();" not in rules.read_text():
              raise SystemExit("missing V87 SUSFS SID initialization call in selinux/rules.c")
          print("[OK] V90: all seven V84 linker-missing symbols are source-defined")
          print("[OK] V90: SUSFS SID initialization call is present in selinux/rules.c")
          PY_KSU_SUSFS_LEGACY_BRIDGE

          grep -q 'DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled);' KernelSU-Next/kernel/runtime/ksud_integration.c
          grep -q 'DEFINE_STATIC_KEY_TRUE(ksu_is_input_hook_enabled);' KernelSU-Next/kernel/runtime/ksud_integration.c
          grep -q 'DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);' KernelSU-Next/kernel/feature/sucompat.c
          ! grep -q 'bool ksu_su_compat_enabled __read_mostly' KernelSU-Next/kernel/feature/sucompat.c
          ! grep -q 'extern bool ksu_su_compat_enabled;' KernelSU-Next/kernel/feature/sucompat.h
          grep -q 'extern struct static_key_true ksu_su_compat_enabled;' KernelSU-Next/kernel/feature/sucompat.h
          grep -q '#include <linux/jump_label.h>' KernelSU-Next/kernel/feature/sucompat.h
          grep -q 'static_branch_likely(&ksu_su_compat_enabled)' KernelSU-Next/kernel/feature/sucompat.c
          grep -q 'void ksu_handle_vfs_fstat(int fd, loff_t \*kstat_size_ptr)' KernelSU-Next/kernel/runtime/ksud_integration.c
          grep -q 'int ksu_handle_post_execveat_sucompat(' KernelSU-Next/kernel/feature/sucompat.c
          grep -q '#include "supercall/supercall.h"' KernelSU-Next/kernel/feature/sucompat.c
          grep -q '(void)ksu_install_fd();' KernelSU-Next/kernel/feature/sucompat.c
          ! grep -q 'ksu_install_su_fd' KernelSU-Next/kernel/feature/sucompat.c
          grep -q 'u32 susfs_ksu_sid' KernelSU-Next/kernel/selinux/selinux.c
          grep -q 'u32 susfs_priv_app_sid' KernelSU-Next/kernel/selinux/selinux.c
          grep -q 'bool susfs_is_current_ksu_domain(void)' KernelSU-Next/kernel/selinux/selinux.c
          grep -q 'susfs_set_batch_sid();' KernelSU-Next/kernel/selinux/rules.c
          grep -q 'susfs_set_batch_sid();' KernelSU-Next/kernel/selinux/rules.c
          grep -q 'KSU_MANAGER_PACKAGE' KernelSU-Next/kernel/manager/apk_sign.c
          test "$(grep -RhsE '^[[:space:]]*extern[[:space:]]+bool[[:space:]]+ksu_su_compat_enabled[[:space:]]*;' KernelSU-Next/kernel/feature KernelSU-Next/kernel 2>/dev/null | wc -l)" -eq 0
          test "$(grep -RhsE '^[[:space:]]*DEFINE_STATIC_KEY_TRUE\(ksu_su_compat_enabled\);' KernelSU-Next/kernel 2>/dev/null | wc -l)" -eq 1
          test "$(grep -RhsE '^[[:space:]]*extern[[:space:]]+struct[[:space:]]+static_key_true[[:space:]]+ksu_su_compat_enabled[[:space:]]*;' KernelSU-Next/kernel 2>/dev/null | wc -l)" -ge 1
          echo "[OK] V93: ksu_su_compat_enabled ABI has one definition and no stale bool declaration"
          echo "[OK] V93: SUSFS/KSU bridge source audit passed"
          echo "::endgroup::"

      - name: '6b. Cross-setup KSU/SUSFS/Manager contract audit'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[6b/15] Verify all dependent setup contracts before SUSFS/build stages"
          cd kernel

          # Permanent workflow rule: a source-level fix in one setup must be
          # reconciled against every dependent setup before the next setup runs.
          python3 - <<'PY_CROSS_SETUP'
          from pathlib import Path
          import re

          root = Path("KernelSU-Next/kernel")
          sucompat = root / "feature/sucompat.c"
          sucompat_h = root / "feature/sucompat.h"
          uapi = Path("KernelSU-Next/uapi/supercall.h")
          dispatch = root / "supercall/dispatch.c"
          kbuild = root / "Kbuild"
          apk_sign = root / "manager/apk_sign.c"

          def need(path, needle, label):
              s = path.read_text(errors="replace")
              if needle not in s:
                  raise SystemExit(f"[ERROR] cross-setup contract missing: {label}: {path}")
              return s

          c = need(sucompat, "DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);",
                   "su_compat static-key definition")
          h = need(sucompat_h, "extern struct static_key_true ksu_su_compat_enabled;",
                   "su_compat static-key declaration")
          if re.search(r"extern\s+bool\s+ksu_su_compat_enabled\s*;", h):
              raise SystemExit("[ERROR] cross-setup stale bool declaration remains")
          if len(re.findall(r"DEFINE_STATIC_KEY_TRUE\(ksu_su_compat_enabled\)", c)) != 1:
              raise SystemExit("[ERROR] cross-setup requires exactly one su_compat static-key definition")
          if "ksu_install_su_fd(" in c:
              raise SystemExit("[ERROR] cross-setup found newer ksu_install_su_fd API in legacy driver")
          if "ksu_install_fd(" not in c:
              raise SystemExit("[ERROR] cross-setup legacy ksu_install_fd API missing")

          need(uapi, "KERNEL_SU_UAPI_VERSION = 4", "UAPI v4")
          need(uapi, "struct ksu_get_info_cmd", "GET_INFO structure")
          need(dispatch, "cmd.uapi_version = KERNEL_SU_UAPI_VERSION;", "GET_INFO UAPI assignment")

          need(kbuild, "KSU_NEXT_MANAGER_SIZE", "Manager certificate size contract")
          need(kbuild, "KSU_NEXT_MANAGER_HASH", "Manager certificate hash contract")
          need(apk_sign, "KSU_MANAGER_PACKAGE", "Manager package contract")

          required = [
              "ksu_handle_post_execveat_sucompat",
              "ksu_handle_vfs_fstat",
              "ksu_is_init_rc_hook_enabled",
              "ksu_is_input_hook_enabled",
              "susfs_is_current_ksu_domain",
              "susfs_ksu_sid",
              "susfs_priv_app_sid",
          ]
          source_text = "\n".join(
              p.read_text(errors="replace")
              for p in root.rglob("*")
              if p.is_file() and p.suffix in {".c", ".h"}
          )
          for sym in required:
              if sym not in source_text:
                  raise SystemExit(f"[ERROR] cross-setup required symbol missing: {sym}")

          # IMPORTANT: Step 3 generated the device baseline .config before KernelSU is
          # integrated/enabled. Step 8 is the first stage that intentionally enables
          # CONFIG_KSU/CONFIG_KSU_MANUAL_HOOK/CONFIG_KSU_SUSFS and runs olddefconfig.
          # Therefore Step 6b must NOT require those generated values yet. Doing so
          # creates a false failure even though the Kconfig declarations and source
          # integration are correct. Generated-config validation is performed again
          # after Step 8's configuration lifecycle below.
          kconfig = Path("drivers/kernelsu/Kconfig")
          drivers_make = Path("drivers/Makefile")
          drivers_kconfig = Path("drivers/Kconfig")
          kconfig_text = need(kconfig, "config KSU", "KSU Kconfig symbol")
          need(kconfig, "config KSU_MANUAL_HOOK", "KSU manual-hook Kconfig symbol")
          need(kconfig, "config KSU_SUSFS", "SUSFS Kconfig symbol")
          need(drivers_make, "obj-$(CONFIG_KSU) += kernelsu/", "drivers Makefile KSU wiring")
          need(drivers_kconfig, 'source "drivers/kernelsu/Kconfig"', "drivers Kconfig KSU wiring")

          # Verify the source-level dependency direction: SUSFS depends on KSU,
          # while the generated .config contract is deliberately deferred to Step 8.
          if not re.search(r"config\s+KSU_SUSFS[\s\S]{0,500}?depends on KSU", kconfig_text):
              raise SystemExit("[ERROR] cross-setup Kconfig contract: KSU_SUSFS no longer depends on KSU")

          print("[OK] V96: cross-setup source/Kconfig/Manager contract audit passed")
          print("[INFO] Generated CONFIG_KSU* values are validated after Step 8 configuration generation.")
          PY_CROSS_SETUP
          echo "::endgroup::"

      - name: '7. Integrate SUSFS 2.3.0 + 4.19 backport'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::[7/15] Integrate SUSFS ${SUSFS_VERSION} + 4.19 backport"
          mkdir -p logs
          # V22: never allow a silent post-port test/grep to end Step 7 with only
          # "Process completed with exit code 1". Record the exact command and line.
          trap 'rc=$?; echo "[ERROR] Step 7 command failed: rc=${rc} line=${LINENO} cmd=${BASH_COMMAND}" | tee -a logs/07-susfs-failure.log; exit ${rc}' ERR

          # V19 ROOT FIX: V16 attempted `git -C susfs-backport ...` without ever
          # creating the working repository. That produced the exact Step-7 failure:
          # "fatal: cannot change to 'susfs-backport': No such file or directory".
          # Bootstrap a real Git repository first, then fetch the audited branch and
          # exact pinned commit. No guessed source or moving branch is used for apply.
          rm -rf susfs-backport
          git init susfs-backport >> logs/07-susfs-repo-init.log 2>&1
          git -C susfs-backport remote add origin "${SUSFS_BACKPORT_REPO}"
          git -C susfs-backport config remote.origin.tagOpt --no-tags
          git -C susfs-backport config fetch.prune true
          git -C susfs-backport rev-parse --git-dir | tee logs/07-susfs-repo-init-check.log
          git -C susfs-backport remote -v | tee logs/07-susfs-remote.txt

          # Exact source pin; no blob filter. Previous runs proved acquisition and
          # version verification; the remaining issue is source-context adaptation.
          : > logs/07-susfs-clone.log
          FETCH_OK=0
          for attempt in 1 2 3 4 5; do
            echo "[SUSFS] branch fetch attempt ${attempt}/5" | tee -a logs/07-susfs-clone.log
            if git -C susfs-backport -c protocol.version=2 -c http.version=HTTP/1.1 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 \
                 fetch --depth=1 origin \
                 "refs/heads/${SUSFS_BACKPORT_REF}:refs/remotes/origin/${SUSFS_BACKPORT_REF}" \
                 >> logs/07-susfs-clone.log 2>&1; then
              FETCH_OK=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "${FETCH_OK}" -eq 1 || { tail -n 160 logs/07-susfs-clone.log; exit 1; }
          git -C susfs-backport checkout --detach "refs/remotes/origin/${SUSFS_BACKPORT_REF}" >> logs/07-susfs-clone.log 2>&1
          SUSFS_BACKPORT_HEAD="$(git -C susfs-backport rev-parse HEAD)"
          echo "branch_head=${SUSFS_BACKPORT_HEAD}" | tee logs/07-susfs-backport-commit.log

          : > logs/07-susfs-pin-fetch.log
          PIN_OK=0
          for attempt in 1 2 3 4 5; do
            echo "[SUSFS] pinned commit fetch attempt ${attempt}/5" | tee -a logs/07-susfs-pin-fetch.log
            if git -C susfs-backport -c protocol.version=2 -c http.version=HTTP/1.1 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 \
                 fetch --depth=1 origin "${SUSFS_BACKPORT_COMMIT}" \
                 >> logs/07-susfs-pin-fetch.log 2>&1; then
              PIN_OK=1
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "${PIN_OK}" -ne 1 ]; then
            echo "[SUSFS] Exact SHA was not accepted by the first fetch path; fetching branch history as a bounded fallback." | tee -a logs/07-susfs-pin-fetch.log
            git -C susfs-backport fetch --deepen=256 origin "${SUSFS_BACKPORT_REF}" >> logs/07-susfs-pin-fetch.log 2>&1 || true
            git -C susfs-backport fetch origin "${SUSFS_BACKPORT_COMMIT}" >> logs/07-susfs-pin-fetch.log 2>&1 || true
