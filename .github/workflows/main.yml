      - name: 05 - Apply CIP135 compatibility delta (preserve LG baseline)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/05-cip.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          # IMPORTANT: the LG vendor tree is not the CIP tree. A direct 3-way
          # apply of the complete CIP132->CIP135 patchset is unsafe here because
          # the LG tree does not contain the upstream CIP parent blobs. The prior
          # run proved this with repeated "repository lacks the necessary blob"
          # and patch-not-apply failures.
          #
          # We therefore build a compatibility overlay: every official CIP132 ->
          # CIP135 file is checked independently with git apply --check. Only a
          # completely clean file-level patch is applied. A file that has LG
          # vendor divergence is NEVER overwritten, force-merged, or resolved
          # with ours/theirs. This keeps the known-good LG baseline authoritative.

          rm -rf "$GITHUB_WORKSPACE/cip-upstream"
          git clone --filter=blob:none --no-checkout \
            --branch "$CIP_TARGET_TAG" \
            https://gitlab.com/cip-project/cip-kernel/linux-cip.git \
            "$GITHUB_WORKSPACE/cip-upstream"

          cd "$GITHUB_WORKSPACE/cip-upstream"
          git fetch --no-tags --filter=blob:none origin \
            "refs/tags/$CIP_BASE_TAG:refs/tags/$CIP_BASE_TAG" \
            "refs/tags/$CIP_TARGET_TAG:refs/tags/$CIP_TARGET_TAG"
          git cat-file -e "$CIP_BASE_TAG^{commit}"
          git cat-file -e "$CIP_TARGET_TAG^{commit}"

          CIP_BASE_SHA="$(git rev-parse "$CIP_BASE_TAG^{commit}")"
          CIP_TARGET_SHA="$(git rev-parse "$CIP_TARGET_TAG^{commit}")"
          echo "cip_base=$CIP_BASE_TAG ($CIP_BASE_SHA)"
          echo "cip_target=$CIP_TARGET_TAG ($CIP_TARGET_SHA)"

          git diff --binary --no-renames "$CIP_BASE_TAG" "$CIP_TARGET_TAG" > "$RUNNER_TEMP/cip132-to-cip135.patch"
          git diff --name-only --no-renames "$CIP_BASE_TAG" "$CIP_TARGET_TAG" | sort -u > "$DIAG_DIR/cip135.candidates"
          test -s "$RUNNER_TEMP/cip132-to-cip135.patch"
          test -s "$DIAG_DIR/cip135.candidates"

          # Keep the CIP repository as the patch source. Git fetches the exact
          # parent/target blobs on demand; the LG repository is never asked to
          # perform a 3-way merge against unrelated CIP history.
          cd "$GITHUB_WORKSPACE/kernel"
          : > "$DIAG_DIR/cip135.files"
          : > "$DIAG_DIR/cip135.skipped"

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              localversion-cip) continue ;;
            esac

            patchfile="$RUNNER_TEMP/cip-file.patch"
            rm -f "$patchfile"

            # Generate exactly one official CIP132->CIP135 patch for this path.
            # No merge base from the LG repository is involved.
            if ! git -C "$GITHUB_WORKSPACE/cip-upstream" diff --binary --no-renames \
                "$CIP_BASE_TAG" "$CIP_TARGET_TAG" -- "$path" > "$patchfile"; then
              printf '%s\n' "$path" >> "$DIAG_DIR/cip135.skipped"
              echo "PRESERVED LG BASELINE: $path (patch generation unavailable)"
              continue
            fi

            # A clean check is mandatory. If any hunk does not match the LG
            # source exactly, the entire file is left untouched.
            if git apply --check --binary "$patchfile" >/dev/null 2>&1; then
              git apply --binary "$patchfile"
              printf '%s\n' "$path" >> "$DIAG_DIR/cip135.files"
              echo "APPLIED: $path"
            else
              printf '%s\n' "$path" >> "$DIAG_DIR/cip135.skipped"
              echo "PRESERVED LG BASELINE: $path (LG divergence)"
            fi
          done < "$DIAG_DIR/cip135.candidates"

          # Explicitly carry the official CIP135 version marker without applying
          # any unrelated localversion diff.
          printf '%s\n' '-cip135' > localversion-cip

          git worktree remove --force "$RUNNER_TEMP/cip132-tree" || true
          git worktree remove --force "$RUNNER_TEMP/cip135-tree" || true

          echo "=== CIP135 applied files ==="
          cat "$DIAG_DIR/cip135.files" || true
          echo "=== CIP135 skipped LG-divergent files ==="
          cat "$DIAG_DIR/cip135.skipped" || true

          test "$(cat localversion-cip)" = "-cip135"
          test -s "$DIAG_DIR/cip135.files"
          echo "PASS: CIP135 compatibility overlay applied without overwriting the LG baseline."

      - name: 06 - Replace KernelSU with SukiSU-Ultra SUSFS branch (Non-GKI combined path)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/06-sukisu.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf KernelSU drivers/kernelsu

          # Official SukiSU documentation provides susfs-main/susfs-* as the
          # combined SukiSU + SUSFS integration path, including non-GKI builds.
          # This avoids layering a legacy SUSFS patch onto a modern SukiSU tree.
          git ls-remote --exit-code --heads \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            "refs/heads/$SUKISU_BRANCH" >/dev/null

          git clone --depth=1 --branch "$SUKISU_BRANCH" \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          cd KernelSU

          test -f kernel/Kconfig
          test -f kernel/Makefile
          test -d kernel

          # Resolve and record the exact branch head used for this build.
          SUKISU_RESOLVED_COMMIT="$(git rev-parse HEAD)"
          echo "sukisu_branch=$SUKISU_BRANCH"
          echo "sukisu_commit=$SUKISU_RESOLVED_COMMIT"

          # The combined branch must actually contain SUSFS. Do not silently
          # fall back to a plain builtin/main tree.
          if ! grep -Rqs 'CONFIG_KSU_SUSFS' kernel; then
            echo "ERROR: $SUKISU_BRANCH resolved to a SukiSU tree without SUSFS."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/kernel"
          ln -s "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf 'source "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

          grep -q 'obj-$(CONFIG_KSU)' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "$(realpath --relative-to=drivers KernelSU/kernel)"

          echo "target_model=$TARGET_MODEL"
          echo "target_region=$TARGET_REGION"

      - name: 07 - Verify SUSFS 2.x from official SukiSU combined branch (NO kernel-tree patch)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/07-susfs.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          # CIP135 is already complete. This stage MUST NOT fetch, patch,
          # regenerate, or otherwise modify CIP135.
          test -f localversion-cip
          test "$(cat localversion-cip)" = "-cip135"

          # Do not apply JackA1ltman, generic susfs4ksu, or any other external
          # kernel patch here. The official SukiSU susfs-main branch already
          # contains the combined SUSFS integration.
          test -d KernelSU/kernel
          grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU/kernel

          # Require SUSFS v2.2.0 (or a newer 2.x version) and record the exact
          # version found. Fail closed if the combined branch is older.
          SUSFS_VERSION_FOUND="$(grep -RhoE 'SUSFS_VERSION[[:space:]]*["'"']v2\.[0-9]+\.[0-9]+["'"']' KernelSU/kernel 2>/dev/null | head -n1 | sed -E 's/.*v([0-9]+\.[0-9]+\.[0-9]+).*/\1/' || true)"
          if [ -z "$SUSFS_VERSION_FOUND" ]; then
            SUSFS_VERSION_FOUND="$(grep -RhoE 'SUSFS[^0-9]*2\.[0-9]+\.[0-9]+' KernelSU/kernel 2>/dev/null | head -n1 | grep -oE '2\.[0-9]+\.[0-9]+' || true)"
          fi
          echo "susfs_version_found=$SUSFS_VERSION_FOUND"

          if [ -z "$SUSFS_VERSION_FOUND" ]; then
            echo "ERROR: SUSFS version could not be proven from the selected SukiSU branch."
            exit 1
          fi

          # Check the combined branch's own SUSFS implementation/config rather
          # than assuming a filename from a different 4.19 patch set.
          grep -Rqs 'KSU_SUSFS' KernelSU/kernel
          grep -Rqs 'susfs' KernelSU/kernel

          # Existing kernel-side SUSFS files from the old baseline must not be
          # duplicated over the new integrated implementation.
          if [ -f fs/susfs.c ] && grep -q 'SUSFS_VERSION' fs/susfs.c; then
            echo "INFO: existing LG SUSFS implementation detected; combined SukiSU branch will own the new integration."
          fi

          # KPROBES remains exactly as in the working baseline.
          test -f "$OUT_DIR/.config"
          grep -q '^# CONFIG_KPROBES is not set$' "$OUT_DIR/.config"

          git diff --check
          echo "PASS: SUSFS is supplied by the official SukiSU combined branch; no external SUSFS patch was applied."
          echo "PASS: CIP135 remains locked at -cip135."

      - name: 08 - Verify SUSFS inline hooks and KPROBES baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/08-hooks.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          test -f "$OUT_DIR/.config"
          grep -q '^# CONFIG_KPROBES is not set$' "$OUT_DIR/.config"

          # SUSFS is integrated inside the selected SukiSU combined branch.
          grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU/kernel
          grep -Rqs 'susfs' KernelSU/kernel
          grep -Rqs 'ksu_handle_setresuid' kernel/sys.c
          grep -Rqs 'CONFIG_KSU_SUSFS' fs/exec.c

          # Old manual-hook config must remain absent.
          ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$OUT_DIR/.config"

          echo "PASS: SUSFS v2.2 inline hooks present."
          echo "PASS: KPROBES remains disabled."
          echo "PASS: legacy manual-hook mode absent."
          git diff --check

      - name: 09 - Configure ONLY SukiSU/SUSFS; preserve every WORKING config value
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/09-kconfig.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          # These are the intended functional configuration additions.
          # KPROBES stays exactly as the supplied WORKING kernel: disabled.
          scripts/config --file "$OUT_DIR/.config" \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_MANUAL_HOOK \
            --enable CONFIG_KSU_SUSFS \
            --disable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_TRY_UMOUNT \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --disable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --disable CONFIG_KSU_SUSFS_SUS_SU \
            --disable CONFIG_KPM

          # SUS_PATH compatibility:
          # SUSFS v2.2.0-kernel-4.19 writes new->user->android_kabi_reserved1
          # when CONFIG_KSU_SUSFS_SUS_PATH=y. The exact LG WORKING 4.19 source
          # does not have that member in struct user_struct. Adding it would
          # change a core kernel struct layout, so only SUS_PATH is disabled.
          if grep -q 'android_kabi_reserved1' include/linux/user.h; then
            echo "INFO: user_struct has android_kabi_reserved1, but SUS_PATH remains disabled for this build."
          else
            echo "PASS: LG WORKING user_struct has no android_kabi_reserved1; SUS_PATH correctly disabled."
          fi

          # Run Kconfig with the SAME Android Clang/LLVM family used by the
          # supplied working kernel. Do not regenerate the baseline from the
          # vendor defconfig and do not use Ubuntu GCC for Kconfig.
          export CC="$CLANG_DIR/bin/clang"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export LD="$CLANG_DIR/bin/ld.lld"
          export AS="$CLANG_DIR/bin/llvm-as"
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$CLANG_DIR/lib:${LD_LIBRARY_PATH:-}"

          "$CC" --version | head -n 2 | tee "$DIAG_DIR/kconfig-clang-version.txt"

          make O="$OUT_DIR" ARCH="$ARCH" \
            CC="$CC" HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
            LD="$LD" AS="$AS" LLVM=1 LLVM_IAS=1 \
            olddefconfig

          cp "$OUT_DIR/.config" "$DIAG_DIR/final.config"

          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_KPM is not set$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_KSU_SUSFS_SUS_PATH is not set$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_UNAME=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_TRY_UMOUNT=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_ENABLE_LOG=y$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_KSU_SUSFS_SUS_MOUNT is not set$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_KSU_SUSFS_SUS_SU is not set$' "$OUT_DIR/.config"

          # Compare every non-KSU config symbol against the exact working
          # baseline. Any drift outside CONFIG_KSU* stops the build.
          normalize_config() {
            sed -E \
              -e '/^[[:space:]]*#/d' \
              -e '/^[[:space:]]*$/d' \
              -e '/^CONFIG_KSU([_=]|$)/d' \
              -e '/^CONFIG_CC_/d' \
              -e '/^CONFIG_CLANG_/d' \
              -e '/^CONFIG_GCC_/d' \
              -e '/^CONFIG_AS_/d' \
              -e '/^CONFIG_LD_/d' \
              -e '/^CONFIG_LLD_/d' \
              -e '/^CONFIG_TOOLS_SUPPORT_RELR=/d' \
              "$1" | sort
          }

          normalize_config "$DIAG_DIR/working-baseline.config" > "$DIAG_DIR/baseline.non-ksu"
          normalize_config "$OUT_DIR/.config" > "$DIAG_DIR/final.non-ksu"

          # Kconfig may reflow blank lines when writing .config. Blank-line-only
          # formatting changes are not configuration drift; actual CONFIG_* value
          # changes are. The normalized comparison above removes blank lines.
          if ! diff -u "$DIAG_DIR/baseline.non-ksu" "$DIAG_DIR/final.non-ksu" > "$DIAG_DIR/config-drift.diff"; then
            echo "::error::NON-KSU configuration drift detected. Build stopped for safety."
            cat "$DIAG_DIR/config-drift.diff"
            exit 1
          fi

          echo "PASS: semantic non-KSU configuration matches the WORKING baseline."

          # Explicitly verify boot-sensitive values again.
          grep -q '^# CONFIG_KPROBES is not set$' "$OUT_DIR/.config"
          grep -q '^CONFIG_HAVE_KPROBES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MODULES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_OVERLAY_FS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MACH_LITO_CAYMANLM=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_LOCALVERSION="-perf"$' "$OUT_DIR/.config"

          echo "PASS: no non-KSU configuration drift."
          echo "PASS: KPROBES remains disabled; no KPROBE config was added."

      - name: 10 - Verify source scope (ONLY SukiSU/SUSFS inline hooks + clean CIP135 overlay)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/10-scope.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          git status --short > "$DIAG_DIR/source-status.txt"
          git diff --stat > "$DIAG_DIR/source-diff-stat.txt"

          if git status --short -- arch/arm64/boot/dts arch/arm64/configs drivers/staging | grep -q .; then
            echo "::error::Device DT/DTBO/defconfig sources changed."
            git status --short -- arch/arm64/boot/dts arch/arm64/configs drivers/staging
            exit 1
          fi

          test -s "$DIAG_DIR/cip135.files"

          is_cip_file() { grep -Fxq "$1" "$DIAG_DIR/cip135.files"; }
          is_fixed_integration_file() {
            case "$1" in
              drivers/Kconfig|drivers/Makefile|drivers/input/input.c|fs/Makefile|              fs/dcache.c|fs/devpts/inode.c|fs/exec.c|fs/inode.c|fs/namei.c|fs/open.c|              fs/overlayfs/inode.c|fs/overlayfs/readdir.c|fs/overlayfs/super.c|              fs/proc/task_mmu.c|fs/proc_namespace.c|fs/read_write.c|fs/readdir.c|              fs/stat.c|fs/statfs.c|include/linux/sched.h|kernel/sys.c|fs/susfs.c|              include/linux/susfs.h|fs/sus_su.c|include/linux/sus_su.h)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          unexpected=0
          while IFS= read -r entry; do
            path="${entry:3}"
            [ -n "$path" ] || continue
            case "$path" in KernelSU/*|localversion-cip) continue ;; esac
            if is_cip_file "$path" || is_fixed_integration_file "$path"; then
              continue
            fi
            echo "::error::Unexpected source change: $path"
            unexpected=1
          done < <(git status --short)

          if [ "$unexpected" -ne 0 ]; then
            echo "::error::Source scope violation. Build stopped."
            exit 1
          fi

          test -L drivers/kernelsu
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -d KernelSU/kernel

          echo "PASS: source scope is limited to SukiSU/SUSFS/manual hooks and clean official CIP135 overlay files."
      - name: 11 - Build RAW WORKING kernel Image (do NOT replace stock DTB/DTBO)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/11-build.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export CC="$CLANG_DIR/bin/clang"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export LD_LIBRARY_PATH="$CLANG_DIR/lib:${LD_LIBRARY_PATH:-}"

          echo "CC=$CC"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          "$CC" --version | head -n 2
          "$GCC64_DIR/bin/aarch64-linux-android-gcc" --version | head -n 1
          "$GCC32_DIR/bin/arm-linux-androideabi-gcc" --version | head -n 1

          # SUS_PATH must remain disabled on this exact source. Stop before
          # compilation if it is ever enabled accidentally.
          grep -q '^# CONFIG_KSU_SUSFS_SUS_PATH is not set$' "$OUT_DIR/.config"

          # The supplied working kernel is a raw ARM64 Image with separate DTB/DTBO.
          # Therefore build Image, not Image.gz, and never replace the stock DTB/DTBO.
          make -Oline \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CC="$CC" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            Image \
            modules

          test -f "$OUT_DIR/arch/arm64/boot/Image"
          file "$OUT_DIR/arch/arm64/boot/Image" | tee "$DIAG_DIR/image-file.txt"
          grep -q 'ARM aarch64\|ARM64\|Linux kernel' "$DIAG_DIR/image-file.txt" || true

          cp "$OUT_DIR/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/Image"

          # DTB/DTBO are intentionally not copied into the kernel artifact.
          # The user's known-good stock DTB/DTBO remain the device boot assets.

      - name: 12 - Final safety checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/12-safety.log") 2>&1
          cd "$GITHUB_WORKSPACE/kernel"

          test -f "$OUT_DIR/.config"
          test -f "$OUT_DIR/arch/arm64/boot/Image"

          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_KSU_SUSFS_SUS_SU is not set$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_KSU_SUSFS_SUS_MOUNT is not set$' "$OUT_DIR/.config"

          # Absolutely critical: the working kernel's KPROBES state is unchanged.
          grep -q '^# CONFIG_KPROBES is not set$' "$OUT_DIR/.config"
          grep -q '^CONFIG_HAVE_KPROBES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MODULES=y$' "$OUT_DIR/.config"

          # Device identity remains exactly the working kernel's values.
          grep -q '^CONFIG_MACH_LITO_CAYMANLM=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MACH_LITO_CAYMANLM_LAO_COM=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_LOCALVERSION="-perf"$' "$OUT_DIR/.config"

          # DTB/DTBO/defconfig source trees must remain untouched.
          test -z "$(git status --short -- arch/arm64/boot/dts arch/arm64/configs drivers/staging)"

          {
            echo "=== FINAL BUILD REPORT ==="
            echo "source_branch=$SOURCE_BRANCH"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "defconfig=$DEFCONFIG"
            echo "baseline_config_sha256=$WORKING_BASELINE_CONFIG_SHA256"
            echo "clang=$CLANG_REVISION"
            echo "clang_snapshot=$CLANG_PREBUILT_TAG"
            echo "gcc64_branch=$GCC64_BRANCH"
            echo "gcc32_branch=$GCC32_BRANCH"
            echo "sukisu_branch=$SUKISU_BRANCH"
            echo "sukisu_commit=$SUKISU_COMMIT"
            echo "cip=$CIP_TARGET_TAG"
            echo "target_model=$TARGET_MODEL"
            echo "target_region=$TARGET_REGION"
            echo "susfs=$SUSFS_VERSION"
            echo "SUS_PATH=disabled_for_LG_user_struct_compatibility"
            echo "KPROBES=disabled (preserved from stock working kernel)"
            echo "artifact=raw ARM64 Image; stock DTB/DTBO intentionally preserved"
            echo
            echo "=== SukiSU-Ultra/SUSFS CONFIG ==="
            grep -E '^CONFIG_KSU($|_)' "$OUT_DIR/.config" | sort
            echo
            echo "=== IMAGE ==="
            ls -lh "$OUT_DIR/arch/arm64/boot/Image"
          } | tee "$DIAG_DIR/final-report.txt"

      - name: 13 - Package diagnostics (ALWAYS)
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$DIAG_DIR"
          {
            echo "=== WORKFLOW DIAGNOSTIC CONTEXT ==="
            date -u +%FT%TZ
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "event=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "source_commit=$SOURCE_COMMIT"
            echo "baseline_expected_sha256=$WORKING_BASELINE_CONFIG_SHA256"
          } > "$DIAG_DIR/00-workflow-context.txt"

          if [ -d "$GITHUB_WORKSPACE/kernel/.git" ]; then
            cd "$GITHUB_WORKSPACE/kernel"
            git status --short > "$DIAG_DIR/git-status.txt" 2>&1 || true
            git diff --stat > "$DIAG_DIR/git-diff-stat.txt" 2>&1 || true
            git diff --name-only > "$DIAG_DIR/git-diff-files.txt" 2>&1 || true
            git diff --binary > "$DIAG_DIR/kernel-source.patch" 2>&1 || true
          fi

          if [ -f "$OUT_DIR/.config" ]; then
            cp "$OUT_DIR/.config" "$DIAG_DIR/final-or-last.config" || true
          fi
          if [ -f "$OUT_DIR/arch/arm64/boot/Image" ]; then
            sha256sum "$OUT_DIR/arch/arm64/boot/Image" > "$DIAG_DIR/Image.sha256" || true
            ls -lh "$OUT_DIR/arch/arm64/boot/Image" > "$DIAG_DIR/Image.ls.txt" || true
          fi

          {
            echo "source_branch=$SOURCE_BRANCH"
            echo "source_commit=$SOURCE_COMMIT"
            echo "defconfig=$DEFCONFIG"
            echo "baseline_config_sha256=$WORKING_BASELINE_CONFIG_SHA256"
            echo "clang_revision=$CLANG_REVISION"
            echo "clang_snapshot=$CLANG_PREBUILT_TAG"
            echo "gcc64_branch=$GCC64_BRANCH"
            echo "gcc32_branch=$GCC32_BRANCH"
            echo "sukisu_branch=$SUKISU_BRANCH"
            echo "sukisu_commit=$SUKISU_COMMIT"
            echo "cip=$CIP_TARGET_TAG"
            echo "target_model=$TARGET_MODEL"
            echo "target_region=$TARGET_REGION"
            echo "susfs=$SUSFS_VERSION"
            echo "SUS_PATH=disabled_for_LG_user_struct_compatibility"
            echo "KPROBES=disabled"
            echo "SUS_MOUNT=disabled_for_non_GKI_stability"
            echo "SUS_SU=disabled_non_KPROBE"
          } > "$DIAG_DIR/build-metadata.txt"

          # Never leave the artifact empty. Even an early failure produces a
          # readable marker and every log collected up to the failure.
          echo "Diagnostics generated at $(date -u +%FT%TZ)" > "$DIAG_DIR/ARTIFACT-READY.txt"
          cd "$GITHUB_WORKSPACE"
          rm -f "$GITHUB_WORKSPACE/LG-Velvet-diagnostics.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/LG-Velvet-diagnostics.tar.gz" -C "$DIAG_DIR" .
          test -s "$GITHUB_WORKSPACE/LG-Velvet-diagnostics.tar.gz"

      - name: 14 - Upload RAW kernel Image (only on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-Global-LM-G900-WORKING-4.19-SukiSU-SUSFS-CIP135-NonGKI-sixteen
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ github.workspace }}/Image
            ${{ github.workspace }}/kernel/out/.config

      - name: 15 - Upload COMPLETE diagnostics (ALWAYS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LG-Velvet-SukiSU-SUSFS-CIP135-LM-G900-diagnostics-run-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: |
            ${{ github.workspace }}/ci-diagnostics/**
            ${{ github.workspace }}/LG-Velvet-diagnostics.tar.gz

      - name: 16 - Print artifact location
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "DIAGNOSTICS ARTIFACT WAS CREATED WITH if: always()"
          echo "Artifact name: LG-Velvet-SukiSU-SUSFS-CIP135-LM-G900-diagnostics-run-${{ github.run_id }}"
          echo "Local archive: $GITHUB_WORKSPACE/LG-Velvet-diagnostics.tar.gz"
          echo "============================================================"
