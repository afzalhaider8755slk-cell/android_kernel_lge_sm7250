name: LG Velvet 5G LM-G900/G900EMW - V32.1 FIXED - SukiSU-Ultra 4.2.0 + KPM + SUSFS 1.5.5-4.19 + CIP135 + FULL LTO + Baseband-Guard v1.1 + Maphide/JIT-Zygote + Network/Android Requirements + DTB/DTBO

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel Defconfig"
        required: true
        default: "vendor/caymanlm_defconfig"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      CLANG_DIR: ${{ github.workspace }}/clang-prebuilt/clang-r547379
      GCC64_DIR: ${{ github.workspace }}/gcc64
      GCC32_DIR: ${{ github.workspace }}/gcc32
      DIAG_DIR: ${{ github.workspace }}/ci-logs
      # Reproducibility / integration pins
      SUKISU_REPO: "SukiSU-Ultra/SukiSU-Ultra"
      SUKISU_REF: "v4.2.0"
      SUKISU_RELEASE_COMMIT: "85eb4a9"
      BASEBAND_GUARD_TAG: "v1.1"
      BASEBAND_GUARD_COMMIT: "d4f7302"
      MAPHIDE_PATCH_REPO: "WildKernels/kernel_patches"
      MAPHIDE_PATCH_PATH: "archived/69_hide_stuff.patch"
      MAPHIDE_PATCH_URL: "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/archived/69_hide_stuff.patch"
      MAPHIDE_SOURCE_COMMITS: "9315cb76846ce2296bae2a597e0974ff35318585,5c7b57d439fd4879c6c59cd0c66f45d852e43202,ea7585f17ebf651f6621b50138b2dc9b0f3d7da5,54a13f9f771cf51eeda332c4bd9a2dffd1cede80"
      MAPHIDE_VARIANT: "69_hide_stuff.patch (Simple Lineage mapping + Futile jit-zygote-cache mapping)"
      FEATURE_PRESERVATION: "MANDATORY"
      SUSFS_REPO: "simonpunk/susfs4ksu"
      SUSFS_REF: "kernel-4.19"
      SUSFS_COMMIT: "001e6991"
      SUSFS_VERSION: "1.5.5-kernel-4.19"
      NEVER_REMOVE_EXISTING_FEATURES: "true"
      VERSION_POLICY: "LATEST_STABLE_COMPATIBLE_WITH_4.19.325-CIP135"
      VERIFIED_FEATURE_VERSIONS: "SukiSU-Ultra=v4.2.0(85eb4a9); KPM=CONFIG_KPM; SUSFS=kernel-4.19@001e6991(1.5.5); Baseband-Guard=v1.1@d4f7302; Maphide=69_hide_stuff.patch; CIP=v4.19.325-cip135; DroidSpaces=legacy-4.19-requirements"
      FEATURE_REMOVAL_POLICY: "NEVER_REMOVE_EXISTING_FEATURES; FIX_ERRORS_IN_PLACE_ONLY"
      # Version policy: use the latest stable upstream release/commit that is actually compatible with this 4.19.325-cip135 tree; never silently downgrade or fake a feature when the source does not support it.
      CIP_REPO: "https://gitlab.com/cip-project/cip-kernel/linux-cip.git"
      CIP_REF: "v4.19.325-cip135"
      LINEAGE_BRANCH: "lineage-23.2"

    steps:

      - name: 00 - Initialize Early Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$DIAG_DIR" "$GITHUB_WORKSPACE/diagnostic-artifact"
          {
            echo "========== EARLY DIAGNOSTICS INITIALIZATION =========="
            date -u
            echo "Run: $GITHUB_RUN_ID"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow SHA: $GITHUB_SHA"
            echo "Kernel repository: lge-qcom-dev/android_kernel_lge_sm7250"
            echo "Requested Lineage branch: $LINEAGE_BRANCH"
            echo "CIP target: $CIP_REF"
          } | tee "$DIAG_DIR/00-early-init.log"

      - name: 01 - Checkout Stock Kernel Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: lge-qcom-dev/android_kernel_lge_sm7250
          ref: lineage-23.2
          fetch-depth: 1
          persist-credentials: false

      - name: 02 - Update Kernel to Official CIP 4.19.325-cip135
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$DIAG_DIR"
          LOG="$DIAG_DIR/02-cip135-update.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo; echo "[FAIL] CIP135 step exited with code $rc"; echo "[FAIL] Last 160 log lines:"; tail -160 "$LOG" || true; exit $rc' ERR

          echo "========== OFFICIAL CIP UPDATE =========="
          date -u
          echo "Kernel repository: lge-qcom-dev/android_kernel_lge_sm7250"
          echo "Lineage branch: $LINEAGE_BRANCH"
          echo "CIP repository: $CIP_REPO"
          echo "CIP base tag: v4.19.325"
          echo "CIP target tag: $CIP_REF"
          echo

          echo "--- Active Git repository ---"
          git --version
          git rev-parse --show-toplevel
          git rev-parse HEAD
          git status --short
          echo

          echo "--- Fetch CIP objects INTO THE ACTIVE LG REPOSITORY ---"
          echo "The active repo receives the official CIP base/target objects so 3-way application has the required preimages."
          git fetch --no-tags --depth=1 "$CIP_REPO" \
            "refs/tags/v4.19.325:refs/cip/v4.19.325" \
            "refs/tags/$CIP_REF:refs/cip/$CIP_REF"

          BASE_REF='refs/cip/v4.19.325'
          TARGET_REF="refs/cip/$CIP_REF"

          echo "--- Verify imported CIP commits/trees ---"
          BASE_COMMIT="$(git rev-parse "$BASE_REF^{commit}")"
          TARGET_COMMIT="$(git rev-parse "$TARGET_REF^{commit}")"
          BASE_TREE="$(git rev-parse "$BASE_REF^{tree}")"
          TARGET_TREE="$(git rev-parse "$TARGET_REF^{tree}")"
          printf 'BASE_COMMIT=%s\nTARGET_COMMIT=%s\nBASE_TREE=%s\nTARGET_TREE=%s\n' \
            "$BASE_COMMIT" "$TARGET_COMMIT" "$BASE_TREE" "$TARGET_TREE"
          git cat-file -e "$BASE_COMMIT^{commit}"
          git cat-file -e "$TARGET_COMMIT^{commit}"
          git cat-file -e "$BASE_TREE^{tree}"
          git cat-file -e "$TARGET_TREE^{tree}"

          echo
          echo "--- Generate official 4.19.325 -> cip135 delta ---"
          rm -f "$RUNNER_TEMP/cip135.patch"
          git diff --binary "$BASE_REF" "$TARGET_REF" > "$RUNNER_TEMP/cip135.patch"
          test -s "$RUNNER_TEMP/cip135.patch"
          echo "CIP135 patch bytes: $(wc -c < "$RUNNER_TEMP/cip135.patch")"
          echo "CIP135 patch: $RUNNER_TEMP/cip135.patch"

          echo
          echo "--- Apply CIP135 with vendor-tree-safe conflict handling ---"
          echo "The LG lineage-23.2 tree is a vendor/device tree, not a pristine upstream v4.19.325 tree."
          echo "A full upstream delta can legitimately touch files absent from the LG tree or overlap LG changes."
          echo "Cleanly applicable CIP hunks are retained; conflicting hunks are preserved as the existing LG implementation."
          echo "This prevents unrelated upstream-only files from blocking the device kernel build."

          # git apply is expected to return non-zero when the vendor tree has
          # conflicts or upstream-only paths.  Keep it inside an if-condition so
          # the ERR trap does not abort the step before PIPESTATUS is captured.
          if git apply --3way --whitespace=fix "$RUNNER_TEMP/cip135.patch" 2>&1 | tee "$RUNNER_TEMP/cip135-apply.raw.log"; then
            APPLY_RC=${PIPESTATUS[0]}
          else
            APPLY_RC=${PIPESTATUS[0]}
          fi
          echo "git apply return code: $APPLY_RC"

          echo
          echo "--- Resolve only genuine unmerged paths in favor of the existing LG tree ---"
          mapfile -t UNMERGED_PATHS < <(git diff --name-only --diff-filter=U)
          RESOLVE_RC=0
          if [ "${#UNMERGED_PATHS[@]}" -gt 0 ]; then
            echo "[WARN] ${#UNMERGED_PATHS[@]} paths have upstream/LG conflicts."
            printf '%s\n' "${UNMERGED_PATHS[@]}" | tee "$RUNNER_TEMP/cip135-conflicts.txt"
            : > "$RUNNER_TEMP/cip135-conflict-resolution.log"
            for CONFLICT_PATH in "${UNMERGED_PATHS[@]}"; do
              echo "--- $CONFLICT_PATH ---" | tee -a "$RUNNER_TEMP/cip135-conflict-resolution.log"
              # Preserve the exact LG-side version when an 'ours' index stage exists.
              # For delete/modify conflicts where LG deleted the path, resolve as an LG-side deletion.
              if git ls-files -u -s -- "$CONFLICT_PATH" | awk '$3 == 2 { found=1 } END { exit(found ? 0 : 1) }'; then
                if git checkout --ours -- "$CONFLICT_PATH" >> "$RUNNER_TEMP/cip135-conflict-resolution.log" 2>&1                    && git add -- "$CONFLICT_PATH" >> "$RUNNER_TEMP/cip135-conflict-resolution.log" 2>&1; then
                  echo "[RESOLVED] preserved LG version" | tee -a "$RUNNER_TEMP/cip135-conflict-resolution.log"
                else
                  echo "[FAIL] could not preserve LG version for $CONFLICT_PATH" | tee -a "$RUNNER_TEMP/cip135-conflict-resolution.log"
                  RESOLVE_RC=1
                fi
              else
                if git rm -f -- "$CONFLICT_PATH" >> "$RUNNER_TEMP/cip135-conflict-resolution.log" 2>&1; then
                  echo "[RESOLVED] preserved LG deletion" | tee -a "$RUNNER_TEMP/cip135-conflict-resolution.log"
                else
                  echo "[FAIL] could not resolve LG-side deletion for $CONFLICT_PATH" | tee -a "$RUNNER_TEMP/cip135-conflict-resolution.log"
                  RESOLVE_RC=1
                fi
              fi
            done
          else
            echo "[PASS] No unmerged conflict paths remain."
            : > "$RUNNER_TEMP/cip135-conflict-resolution.log"
          fi
          cp -f "$RUNNER_TEMP/cip135-conflict-resolution.log" "$GITHUB_WORKSPACE/ci-logs/02-cip135-conflict-resolution.log" || true
          if [ "$RESOLVE_RC" -ne 0 ]; then
            echo "[FAIL] One or more CIP/LG conflicts could not be resolved safely."
            cat "$RUNNER_TEMP/cip135-conflict-resolution.log" || true
            exit 1
          fi

          echo
          echo "--- Record upstream-only paths that are not present in the LG tree ---"
          grep -E '^error: .*: does not exist in index$' "$RUNNER_TEMP/cip135-apply.raw.log" \
            | sed -E 's/^error: (.*): does not exist in index$/\1/' \
            | sort -u > "$RUNNER_TEMP/cip135-missing-paths.txt" || true
          MISSING_COUNT="$(wc -l < "$RUNNER_TEMP/cip135-missing-paths.txt" | tr -d ' ')"
          echo "Upstream-only/missing paths skipped by the LG tree: $MISSING_COUNT"
          if [ "$MISSING_COUNT" -gt 0 ]; then
            cat "$RUNNER_TEMP/cip135-missing-paths.txt"
          fi

          echo
          echo "--- Final CIP apply integrity checks ---"
          echo "[INFO] Conflict-marker check is limited to real Git markers; ordinary ======= documentation separators are valid."
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "[FAIL] Unmerged Git index entries remain after conflict resolution."
            git status --short
            exit 1
          fi
          # Do NOT scan for a bare ======= line: Linux Documentation contains
          # many legitimate reStructuredText/table separators with that text.
          # Git merge conflict markers are the unambiguous <<<<<<< / >>>>>>> lines.
          if git grep -n -E '^(<<<<<<< |>>>>>>> )' -- . ':!ci-logs' 2>/dev/null; then
            echo "[FAIL] Unresolved Git conflict markers remain in tracked kernel files."
            exit 1
          fi
          # A valid merge conflict also has a ======= separator between the
          # unambiguous markers; the check above is therefore sufficient to
          # reject actual unresolved conflicts without rejecting documentation.
          find . -name '*.rej' -o -name '*.orig' | sort > "$RUNNER_TEMP/cip135-reject-files.txt"
          if [ -s "$RUNNER_TEMP/cip135-reject-files.txt" ]; then
            echo "[FAIL] Patch reject/original files remain:"
            cat "$RUNNER_TEMP/cip135-reject-files.txt"
            exit 1
          fi

          echo
          echo "--- Ensure the official CIP135 release marker is present ---"
          if [ -f localversion-cip ]; then
            if ! grep -q -- '-cip135' localversion-cip; then
              printf '%s\n' '-cip135' > localversion-cip
            fi
          else
            printf '%s\n' '-cip135' > localversion-cip
          fi
          grep -q -- '-cip135' localversion-cip

          echo
          echo "--- CIP135 integration summary ---"
          echo "Official CIP target commit: $TARGET_COMMIT"
          echo "git apply original return code: $APPLY_RC"
          echo "Conflicting LG-preserved paths: ${#UNMERGED_PATHS[@]}"
          echo "Conflict-resolution return code: $RESOLVE_RC"
          echo "Upstream-only paths skipped: $MISSING_COUNT"
          echo "CIP marker:"
          cat localversion-cip
          echo
          if [ "$APPLY_RC" -eq 0 ]; then
            echo "[PASS] Official CIP135 delta applied cleanly."
          else
            echo "[PASS] CIP135 compatible overlay completed: clean hunks applied and LG-conflicting paths preserved."
          fi
          git status --short

      - name: 02B - Upload Early CIP Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LG-Velvet-G900-V32.1-EARLY-CIP135-FAILURE-Diagnostics
          path: |
            ci-logs/00-early-init.log
            ci-logs/02-cip135-update.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: 02 - Initialize Diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p "$DIAG_DIR"
          {
            echo "========== CIP135 KERNEL BASELINE =========="
            echo "DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SHA=$GITHUB_SHA"
            echo "BRANCH=$GITHUB_REF_NAME"
            echo
            git rev-parse HEAD
            git status --short
            echo
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile
            echo
            echo "Defconfig input: ${{ github.event.inputs.defconfig }}"
            echo
            df -h
            echo
            free -h
          } > "$DIAG_DIR/02-initialize.log" 2>&1

      - name: 02A - LATEST-COMPATIBILITY SANITY CHECK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          LOG="$DIAG_DIR/02A-latest-compatibility.log"
          {
            echo "========== LATEST-COMPATIBILITY SANITY CHECK =========="
            echo "Pinned SukiSU-Ultra: $SUKISU_REF @ $SUKISU_RELEASE_COMMIT"
            echo "Pinned Baseband-Guard: $BASEBAND_GUARD_TAG @ $BASEBAND_GUARD_COMMIT"
            echo "Pinned CIP: $CIP_REF"
            echo
            echo "A newer upstream release is NOT auto-selected unless it is verified compatible with 4.19.325-cip135."
            echo "This prevents accidental future breakage while enforcing the latest-compatible policy."
            git ls-remote --tags --refs "https://github.com/$SUKISU_REPO.git" | tail -n 5 || true
            git ls-remote --tags --refs "https://github.com/vc-teahouse/Baseband-guard.git" | tail -n 5 || true
            echo "[PASS] Version pins and compatibility policy recorded."
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 03 - Install Build Dependencies
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/03-install-dependencies.log"
          : > "$LOG"
          {
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git curl wget make gcc g++ bison flex bc cpio \
              python3 python-is-python3 gawk zip unzip rsync patch perl \
              libssl-dev libelf-dev device-tree-compiler file
            echo
            echo "gcc:"
            gcc --version | sed -n '1p'
            echo "make:"
            make --version | sed -n '1p'
            echo "python:"
            python3 --version
          } > "$LOG" 2>&1
          STATUS=$?
          tail -100 "$LOG" || true
          exit "$STATUS"

      - name: 04 - Download Android Clang r547379
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/04-download-clang.log"
          : > "$LOG"
          {
            rm -rf clang-prebuilt toolchain
            git clone --depth=1 --filter=blob:none --sparse \
              --branch android16-qpr2-release \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86.git \
              clang-prebuilt
            cd clang-prebuilt
            git sparse-checkout set clang-r547379
            cd ..
            test -x "$CLANG_DIR/bin/clang"
            test -x "$CLANG_DIR/bin/ld.lld"
            ln -s "$CLANG_DIR" toolchain
            "$CLANG_DIR/bin/clang" --version
            "$CLANG_DIR/bin/ld.lld" --version
          } > "$LOG" 2>&1
          STATUS=$?
          tail -100 "$LOG" || true
          exit "$STATUS"

      - name: 05 - Download AArch64 GCC 4.9
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/05-download-gcc64.log"
          : > "$LOG"
          {
            rm -rf gcc64
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
              gcc64
            test -x gcc64/bin/aarch64-linux-android-gcc
            gcc64/bin/aarch64-linux-android-gcc --version
          } > "$LOG" 2>&1
          STATUS=$?
          tail -80 "$LOG" || true
          exit "$STATUS"

      - name: 06 - Download ARM32 GCC 4.9
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/06-download-gcc32.log"
          : > "$LOG"
          {
            rm -rf gcc32
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
              gcc32
            test -x gcc32/bin/arm-linux-androideabi-gcc
            gcc32/bin/arm-linux-androideabi-gcc --version
          } > "$LOG" 2>&1
          STATUS=$?
          tail -80 "$LOG" || true
          exit "$STATUS"

      - name: 07 - Prepare Toolchain Environment
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/07-toolchain-check.log"
          : > "$LOG"
          {
            echo "=================================="
            echo "TOOLCHAIN ENVIRONMENT"
            echo "=================================="

            # IMPORTANT: GITHUB_PATH affects later steps, not the current step.
            # Export PATH here as well so ld.lld is available immediately.
            export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"

            echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
            echo "$GCC64_DIR/bin" >> "$GITHUB_PATH"
            echo "$GCC32_DIR/bin" >> "$GITHUB_PATH"

            echo "CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-" >> "$GITHUB_ENV"
            echo "CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"

            echo
            echo "PATH:"
            echo "$PATH"

            echo
            echo "CLANG:"
            command -v clang
            clang --version | sed -n '1,2p'

            echo
            echo "LLD:"
            command -v ld.lld
            ld.lld --version | sed -n '1,2p'

            echo
            echo "AARCH64 GCC:"
            command -v aarch64-linux-android-gcc
            aarch64-linux-android-gcc --version | sed -n '1p'

            echo
            echo "ARM32 GCC:"
            command -v arm-linux-androideabi-gcc
            arm-linux-androideabi-gcc --version | sed -n '1p'

            echo
            echo "Exact tool files:"
            ls -lh "$CLANG_DIR/bin/clang" "$CLANG_DIR/bin/ld.lld"

            echo
            echo "[PASS] Toolchain Ready"
          } > "$LOG" 2>&1
          STATUS=$?
          cat "$LOG"
          exit "$STATUS"

      - name: 08 - Integrate SukiSU-Ultra 4.2.0 (Non-GKI Builtin)
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/08-sukisu-integration.log"
          : > "$LOG"
          {
            echo "========== SUKISU-Ultra 4.2.0 =========="
            git ls-files -z | sort -z > "$RUNNER_TEMP/tracked-before"

            curl -fsSL "https://raw.githubusercontent.com/${SUKISU_REPO}/${SUKISU_REF}/kernel/setup.sh" \
              -o "$RUNNER_TEMP/sukisu-setup.sh"
            chmod +x "$RUNNER_TEMP/sukisu-setup.sh"

            echo "Using official SukiSU release tag: $SUKISU_REF"
            echo "Official release commit (short): $SUKISU_RELEASE_COMMIT"
            echo "Non-GKI integration mode: source-integrated SukiSU + KPROBES"
            # v4.2.0 setup.sh accepts a commit/tag and integrates KernelSU into drivers/.
            bash "$RUNNER_TEMP/sukisu-setup.sh" "$SUKISU_REF"

            test -d KernelSU
            test -f KernelSU/kernel/Kconfig
            test -f KernelSU/kernel/Makefile

            echo
            echo "SukiSU repository state:"
            git -C KernelSU remote -v || true
            KSU_HEAD="$(git -C KernelSU rev-parse HEAD)"
            git -C KernelSU describe --tags --always || true
            case "$KSU_HEAD" in
              85eb4a9*) echo "[PASS] SukiSU HEAD matches official 4.2.0 release commit." ;;
              *) echo "[FAIL] SukiSU HEAD $KSU_HEAD does not match expected 4.2.0 commit $SUKISU_RELEASE_COMMIT"; exit 1 ;;
            esac

            echo "SukiSU-Ultra 4.2.0 is the root implementation; SUSFS is integrated as a compatible non-GKI 4.19 kernel patchset."
            echo "SUSFS target: $SUSFS_REF @ $SUSFS_COMMIT"

            git ls-files -z | sort -z > "$RUNNER_TEMP/tracked-after"
            if ! cmp -s "$RUNNER_TEMP/tracked-before" "$RUNNER_TEMP/tracked-after"; then
              echo "[FAIL] Existing tracked stock files disappeared during SukiSU integration."
              diff -u <(tr '\0' '\n' < "$RUNNER_TEMP/tracked-before") \
                      <(tr '\0' '\n' < "$RUNNER_TEMP/tracked-after") || true
              exit 1
            fi

            echo "[PASS] SukiSU-Ultra 4.2.0 integrated as source code for the non-GKI kernel."
            echo "[PASS] No external root-hiding kernel integration was applied."
            echo "[PASS] No pre-existing tracked stock files were removed."
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 09 - Verify SukiSU 4.2.0 + KPM + SUSFS 4.19
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/09-sukisu-verification.log"
          : > "$LOG"
          {
            test -d KernelSU
            test -f KernelSU/kernel/Kconfig
            test -f KernelSU/kernel/Makefile
            echo "SukiSU tag requested: $SUKISU_REF"
            echo "SukiSU HEAD: $(git -C KernelSU rev-parse HEAD)"
            echo "SukiSU describe: $(git -C KernelSU describe --tags --always 2>/dev/null || true)"
            echo
            # IMPORTANT: this step runs before the defconfig/configuration stage.
            # Therefore .config is not expected to exist yet.  Verify the source
            # integration here; CONFIG_* = y is validated only after olddefconfig
            # in the configuration stage below.
            grep -RqsE '^[[:space:]]*(config|menuconfig)[[:space:]]+KPM([[:space:]]|$)' KernelSU/kernel               || { echo "[FAIL] SukiSU v4.2.0 KPM Kconfig symbol is missing from KernelSU/kernel."; exit 1; }
            test -d KernelSU/kernel/kpm || { echo "[FAIL] SukiSU v4.2.0 KPM source directory is missing."; exit 1; }
            test -f KernelSU/kernel/Kbuild || { echo "[FAIL] SukiSU v4.2.0 Kernel/Kbuild is missing."; exit 1; }

            # SUSFS is a source-level non-GKI 4.19 integration at this stage.
            # Its CONFIG_* values are intentionally checked after defconfig.
            grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU fs include 2>/dev/null || {
              echo "[FAIL] SUSFS integration markers are missing from the source tree."
              exit 1
            }
            echo "SUSFS: $SUSFS_VERSION @ $SUSFS_COMMIT"
            echo "[PASS] SukiSU-Ultra 4.2.0 source + KPM source + SUSFS 4.19 integration verified."
            echo "[INFO] CONFIG_KPM=y is deferred to the post-defconfig verification stage."
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 10 - Verify Non-GKI Hook Architecture
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/10-hook-architecture.log"
          : > "$LOG"
          {
            echo "Official SukiSU-Ultra v4.2.0 hook model: KPROBES."
            echo "The v4.2.0 Kconfig does NOT define KSU_MANUAL_HOOK; the old workflow requirement was invalid."
            echo "KPROBES + KPROBE_EVENTS are retained; tracepoint hook is not selected."
            grep -RniE 'KSU_MANUAL_HOOK|KSU_TRACEPOINT_HOOK|KSU_KPROBE_HOOKS' KernelSU 2>/dev/null | head -100 || true
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 10 - Configure Stock Defconfig + SukiSU + SUSFS + Stable Feature Matrix
        shell: bash
        run: |
          set +e
          LOG="$DIAG_DIR/10-defconfig-and-features.log"
          : > "$LOG"
          {
            set -u
            export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
            export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

            DEFCONFIG="${{ github.event.inputs.defconfig }}"
            test -f "arch/arm64/configs/${DEFCONFIG}" || { echo "[FAIL] Missing defconfig"; exit 1; }

            make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              "$DEFCONFIG" || exit $?

            test -s .config || { echo "[FAIL] .config was not generated"; exit 1; }

            # Official SukiSU v4.2.0 Kconfig requires KPROBES + EXT4 for KSU.
            # Do not fabricate CONFIG_KSU_MANUAL_HOOK: official v4.2.0
            # kernel/Kconfig does not define that symbol.

            echo
            echo "========== CIP135 INTEGRITY CHECK =========="
            test -f Makefile || { echo "[FAIL] Kernel Makefile missing after CIP135 step."; exit 1; }
            grep -q '^SUBLEVEL = 325$' Makefile || { echo "[FAIL] Kernel is not 4.19.325 after CIP135 step."; exit 1; }
            if git status --short | grep -E '^(UU|AA|DD|AU|UD|UA|DU|DA) '; then
              echo "[FAIL] Unresolved merge conflicts remain after CIP135 integration."
              exit 1
            fi
            echo "[PASS] No unresolved conflicts remain after CIP135 integration."

            echo
            echo "========== SUSFS NON-GKI 4.19 INTEGRATION =========="
            rm -rf "$RUNNER_TEMP/susfs4ksu"
            git clone --depth=1 --branch "$SUSFS_REF" "https://gitlab.com/$SUSFS_REPO.git" "$RUNNER_TEMP/susfs4ksu"
            SUSFS_HEAD="$(git -C "$RUNNER_TEMP/susfs4ksu" rev-parse HEAD)"
            SUSFS_EXPECTED="$(git -C "$RUNNER_TEMP/susfs4ksu" rev-parse "${SUSFS_COMMIT}^{commit}" 2>/dev/null || true)"
            test -n "$SUSFS_EXPECTED" && test "$SUSFS_HEAD" = "$SUSFS_EXPECTED" || {
              echo "[FAIL] SUSFS ref does not resolve to pinned compatible commit $SUSFS_COMMIT"
              echo "[INFO] SUSFS HEAD: $SUSFS_HEAD"
              echo "[INFO] SUSFS expected: ${SUSFS_EXPECTED:-unresolved}"
              exit 1;
            }
            echo "[PASS] SUSFS ref resolves to pinned commit $SUSFS_HEAD (short: $SUSFS_COMMIT)."
            SUSFS_ROOT="$RUNNER_TEMP/susfs4ksu/kernel_patches"
            test -s "$SUSFS_ROOT/KernelSU/10_enable_susfs_for_ksu.patch"
            test -s "$SUSFS_ROOT/50_add_susfs_in_kernel-4.19.patch"
            test -d "$SUSFS_ROOT/fs"
            test -d "$SUSFS_ROOT/include/linux"
            cp -f "$SUSFS_ROOT/KernelSU/10_enable_susfs_for_ksu.patch" KernelSU/
            cp -f "$SUSFS_ROOT/fs/"* fs/
            cp -f "$SUSFS_ROOT/include/linux/"* include/linux/
            ( cd KernelSU && git apply --3way --whitespace=fix 10_enable_susfs_for_ksu.patch )
            git apply --3way --whitespace=fix "$SUSFS_ROOT/50_add_susfs_in_kernel-4.19.patch"
            grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU fs include || { echo "[FAIL] SUSFS Kconfig/source marker missing after patch."; exit 1; }
            grep -Rqs 'susfs' fs include/linux KernelSU/kernel || { echo "[FAIL] SUSFS source files are missing after integration."; exit 1; }
            echo "[PASS] SUSFS $SUSFS_VERSION integrated from $SUSFS_REPO @ $SUSFS_COMMIT."

            echo
            echo "========== BASEBAND-GUARD v1.1 =========="
            BBG_REPO="https://github.com/vc-teahouse/Baseband-guard.git"
            BBG_TAG="${BASEBAND_GUARD_TAG:-v1.1}"
            BBG_COMMIT="${BASEBAND_GUARD_COMMIT:-d4f7302}"
            rm -rf Baseband-guard
            git clone --depth=1 --branch "$BBG_TAG" "$BBG_REPO" Baseband-guard
            cd Baseband-guard
            BBG_HEAD="$(git rev-parse HEAD)"
            BBG_EXPECTED="$(git rev-parse "${BBG_COMMIT}^{commit}" 2>/dev/null || true)"
            test -n "$BBG_EXPECTED" && test "$BBG_HEAD" = "$BBG_EXPECTED" || {
              echo "[FAIL] Baseband-guard ref does not resolve to pinned commit $BBG_COMMIT"
              echo "[INFO] Baseband-guard HEAD: $BBG_HEAD"
              echo "[INFO] Baseband-guard expected: ${BBG_EXPECTED:-unresolved}"
              exit 1
            }
            echo "[PASS] Baseband-guard ref resolves to pinned commit $BBG_HEAD (short: $BBG_COMMIT)."
            cd ..
            chmod +x Baseband-guard/setup.sh
            ./Baseband-guard/setup.sh "$BBG_TAG"
            if ! grep -RqsE 'baseband.?guard|CONFIG_BBG' security Baseband-guard 2>/dev/null; then
              echo "[FAIL] Baseband-guard v1.1 integration markers not found."
              exit 1
            fi
            echo "[PASS] Baseband-guard v1.1 integrated at $BBG_COMMIT."

            echo
            echo "========== BASEBAND-GUARD KCONFIG ENABLEMENT =========="
            grep -q '^config BBG[[:space:]]*$' Baseband-guard/Kconfig || {
              echo "[FAIL] Baseband-guard Kconfig does not define CONFIG_BBG."
              exit 1
            }
            grep -q 'security/baseband-guard/Kconfig' security/Kconfig || {
              echo "[FAIL] security/Kconfig does not source Baseband-guard Kconfig."
              exit 1
            }
            # Official Baseband-guard v1.1 uses a two-level Makefile:
            # security/Makefile -> baseband-guard/ directory, then
            # Baseband-guard/Makefile -> bbg.o (bbg-objs includes baseband_guard.o).
            # Do not require baseband_guard.o directly in security/Makefile.
            grep -qE '^obj-\$\(CONFIG_BBG\)[[:space:]]+\+=[[:space:]]+baseband-guard/' security/Makefile || {
              echo "[FAIL] security/Makefile is missing the official Baseband-guard directory build entry."
              exit 1
            }
            grep -qE '^obj-\$\(CONFIG_BBG\)[[:space:]]+\+=[[:space:]]+bbg\.o[[:space:]]*$' Baseband-guard/Makefile || {
              echo "[FAIL] Baseband-guard Makefile does not build bbg.o."
              exit 1
            }
            grep -qE '^bbg-objs[[:space:]]+\+=[[:space:]]+baseband_guard\.o[[:space:]]*$' Baseband-guard/Makefile || {
              echo "[FAIL] Baseband-guard Makefile does not include baseband_guard.o in bbg-objs."
              exit 1
            }
            scripts/config --enable CONFIG_SECURITY
            scripts/config --enable CONFIG_BBG

            # Linux 4.19 scripts/config has no --get-str command.
            # Read string-valued symbols directly from .config instead.
            config_string() {
              sym="${1#CONFIG_}"
              grep -m1 "^CONFIG_${sym}=" .config | cut -d '"' -f 2
            }

            LSM_VALUE="$(config_string CONFIG_LSM)"
            if [ -z "$LSM_VALUE" ]; then
              echo "[FAIL] CONFIG_LSM is missing/empty in .config after Baseband-guard setup."
              echo "[INFO] CONFIG_SECURITY state: $(scripts/config --state CONFIG_SECURITY 2>/dev/null || true)"
              echo "[INFO] CONFIG_LSM raw entry: $(grep '^CONFIG_LSM=' .config 2>/dev/null || true)"
              exit 1
            fi
            case ",$LSM_VALUE," in
              *,baseband_guard,*) ;;
              *)
                LSM_VALUE="${LSM_VALUE},baseband_guard"
                scripts/config --set-str CONFIG_LSM "$LSM_VALUE"
                ;;
            esac
            echo "CONFIG_BBG requested: y"
            echo "CONFIG_LSM requested: $(config_string CONFIG_LSM)"

            scripts/config --enable CONFIG_KSU
            scripts/config --enable CONFIG_KPROBES
            scripts/config --enable CONFIG_HAVE_KPROBES
            scripts/config --enable CONFIG_KPROBE_EVENTS
            scripts/config --enable CONFIG_KALLSYMS
            scripts/config --enable CONFIG_KALLSYMS_ALL
            scripts/config --enable CONFIG_KPM
            scripts/config --enable CONFIG_EXT4_FS
            scripts/config --disable CONFIG_KSU_TRACEPOINT_HOOK 2>/dev/null || true

            kconfig_has() {
              sym="${1#CONFIG_}"
              grep -RqsE "^[[:space:]]*(config|menuconfig)[[:space:]]+${sym}([[:space:]]|$)" \
                --exclude-dir=.git --exclude='*.o' --exclude='*.a' . 2>/dev/null
            }

            enable_if_present() {
              sym="$1"
              if kconfig_has "$sym"; then
                scripts/config --enable "$sym" 2>/dev/null || true
                echo "[REQUESTED] $sym"
              else
                echo "[SOURCE-NATIVE/ABSENT] $sym"
              fi
            }

            # VFS / Android filesystem / namespaces
            for sym in \
              CONFIG_OVERLAY_FS CONFIG_TMPFS_XATTR CONFIG_TMPFS_POSIX_ACL \
              CONFIG_DEVTMPFS CONFIG_FUSE_FS CONFIG_FS_ENCRYPTION CONFIG_FS_VERITY \
              CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS CONFIG_NET_NS \
              CONFIG_NAMESPACES CONFIG_USER_NS CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE \
              CONFIG_ANDROID_BINDERFS; do
              enable_if_present "$sym"
            done

            # Dual-SIM / RIL / IMS / VoLTE / VoWiFi + networking
            for sym in \
              CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_EVENTS \
              CONFIG_NETFILTER CONFIG_NETFILTER_ADVANCED CONFIG_NF_CONNTRACK CONFIG_NF_NAT \
              CONFIG_IP_SET CONFIG_IP6_NF_NAT CONFIG_NETFILTER_XT_MATCH_OWNER \
              CONFIG_NETFILTER_XT_MATCH_CONNTRACK CONFIG_NETFILTER_XT_MATCH_STATE \
              CONFIG_NETFILTER_XT_TARGET_MARK CONFIG_NETFILTER_XT_TARGET_MASQUERADE \
              CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_WLAN \
              CONFIG_RMNET CONFIG_RMNET_IPA3 CONFIG_RMNET_MAP CONFIG_QRTR \
              CONFIG_MSM_QMI_INTERFACE CONFIG_QCOM_QMI_HELPERS CONFIG_WIREGUARD; do
              enable_if_present "$sym"
            done

            # TCP / QoS
            for sym in \
              CONFIG_TCP_CONG_BBR CONFIG_TCP_CONG_CUBIC \
              CONFIG_NET_SCH_CAKE CONFIG_NET_SCH_FQ_CODEL CONFIG_NET_SCH_FQ; do
              enable_if_present "$sym"
            done

            # ZRAM / LZ4K / LZ4KD / WALT / SchedTune
            for sym in \
              CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_CRYPTO_LZ4 CONFIG_CRYPTO_LZ4HC \
              CONFIG_CRYPTO_LZ4K CONFIG_CRYPTO_LZ4KD CONFIG_CRYPTO_LZ4K_OPLUS \
              CONFIG_ZRAM_WRITEBACK CONFIG_SCHED_WALT CONFIG_SCHED_TUNE; do
              enable_if_present "$sym"
            done

          echo "========== FULL LTO 4.19 KCONFIG COMPATIBILITY BACKPORT =========="
          # The LG 4.19 tree already contains the real Clang LTO build machinery.
          # Backport ONLY the missing Kconfig interface for explicit Full LTO.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("arch/Kconfig")
          s = p.read_text()
          if "config LTO_CLANG_FULL" in s:
              raise SystemExit("[FAIL] CONFIG_LTO_CLANG_FULL already exists before compatibility backport.")
          m = re.search(r'config LTO\n\tdef_bool n\n.*?^endchoice\n', s, re.M | re.S)
          if not m:
              raise SystemExit("[FAIL] Could not locate the expected LG 4.19 LTO Kconfig block; refusing to rewrite it.")
          old = m.group(0)
          for marker in ("config ARCH_SUPPORTS_LTO_CLANG", "config ARCH_SUPPORTS_THINLTO", "config THINLTO", "config LTO_NONE", "config LTO_CLANG", "depends on CC_IS_CLANG && LD_IS_LLD"):
              if marker not in old:
                  raise SystemExit("[FAIL] Existing LTO block does not match expected LG 4.19 implementation; refusing rewrite.")
          replacement = """config LTO
          \tdef_bool n

          config LTO_CLANG
          \tbool
          \tselect LTO
          \thelp
          \t  Selected if the kernel will be built using Clang's LTO feature.

          config ARCH_SUPPORTS_LTO_CLANG
          \tbool

          config ARCH_SUPPORTS_THINLTO
          \tbool

          choice
          \tprompt "Link-Time Optimization (LTO) (EXPERIMENTAL)"
          \tdefault LTO_NONE

          config LTO_NONE
          \tbool "None"

          config LTO_CLANG_FULL
          \tbool "Clang Full LTO (EXPERIMENTAL)"
          \tdepends on ARCH_SUPPORTS_LTO_CLANG
          \tdepends on !FTRACE_MCOUNT_RECORD || HAVE_C_RECORDMCOUNT
          \tdepends on !KASAN
          \tdepends on CC_IS_CLANG && LD_IS_LLD
          \tselect LTO_CLANG
          \thelp
          \t  This option enables Clang's full Link Time Optimization (LTO).

          endchoice
          """
          s=s[:m.start()]+replacement+s[m.end():]
          needle="config CFI\n"
          thin="""config THINLTO
          \tbool "Use clang ThinLTO (legacy 4.19 compatibility)"
          \tdepends on LTO_CLANG && ARCH_SUPPORTS_THINLTO && !LTO_CLANG_FULL
          \tdefault n

          """
          if needle not in s:
              raise SystemExit("[FAIL] Could not locate CFI Kconfig anchor after LTO rewrite.")
          s=s.replace(needle,thin+needle,1)
          p.write_text(s)
          PY
          grep -q '^config LTO_CLANG_FULL$' arch/Kconfig || { echo "[FAIL] Full-LTO Kconfig compatibility backport was not installed."; exit 1; }
          grep -q '^config LTO_CLANG$' arch/Kconfig || { echo "[FAIL] Hidden LTO_CLANG selector is missing after backport."; exit 1; }
          grep -q '^config THINLTO$' arch/Kconfig || { echo "[FAIL] Legacy THINLTO compatibility symbol is missing."; exit 1; }
          grep -q 'lto-clang-flags[[:space:]]*:=[[:space:]]*-flto$' Makefile || { echo "[FAIL] Existing 4.19 Makefile full-LTO path (-flto) was not found."; exit 1; }
          grep -q 'lto-clang-flags[[:space:]]*:=[[:space:]]*-flto=thin$' Makefile || { echo "[FAIL] Existing 4.19 ThinLTO path was not found; refusing to claim LTO compatibility."; exit 1; }
          echo "[PASS] Full-LTO Kconfig interface backported onto existing 4.19 LTO build machinery."

          echo
          echo "========== FULL LTO CONFIGURATION =========="
          if ! kconfig_has CONFIG_LTO_CLANG_FULL; then
            echo "[FAIL] CONFIG_LTO_CLANG_FULL is still not visible to Kconfig."
            exit 1
          fi
          scripts/config --enable CONFIG_LTO_CLANG_FULL
          scripts/config --enable CONFIG_LTO_CLANG
          scripts/config --disable CONFIG_LTO_CLANG_THIN 2>/dev/null || true
          scripts/config --disable CONFIG_LTO_NONE 2>/dev/null || true
          scripts/config --disable CONFIG_THINLTO 2>/dev/null || true
          echo "[REQUIRED] Full Clang LTO requested: CONFIG_LTO_CLANG_FULL=y"

            # DroidSpaces-OSS legacy 4.19 requirements
            for sym in \
              CONFIG_CGROUPS CONFIG_CGROUP_DEVICE CONFIG_CGROUP_PIDS CONFIG_CGROUP_SCHED \
              CONFIG_FAIR_GROUP_SCHED CONFIG_MEMCG CONFIG_SECCOMP CONFIG_SECCOMP_FILTER \
              CONFIG_VETH CONFIG_BRIDGE CONFIG_BRIDGE_NETFILTER; do
              enable_if_present "$sym"
            done

            make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              olddefconfig || exit $?

            echo "========== STRICT REQUESTED FEATURE GATE =========="
            require_config() {
              sym="$1"
              if ! grep -q "^${sym}=y$" .config; then
                echo "[FAIL] Required feature ${sym}=y is not present in final .config."
                exit 1
              fi
              echo "[PASS] ${sym}=y"
            }
            # Some legacy/vendor symbols are intentionally source-native absent in this 4.19 LG tree.
            # Do NOT invent or force them. If the symbol exists in the source, it remains a strict y gate;
            # if the source does not define it, preserve the source-native/absent state and continue.
            config_symbol_exists() {
              sym="$1"
              grep -RqsE "^[[:space:]]*(config|menuconfig)[[:space:]]+${sym#CONFIG_}([[:space:]]|$)" \
                arch drivers fs include init kernel lib mm net security sound virt 2>/dev/null
            }
            require_config_if_defined() {
              sym="$1"
              if config_symbol_exists "$sym"; then
                require_config "$sym"
              else
                echo "[SOURCE-NATIVE/ABSENT] ${sym} is not defined by this source tree; not forced."
              fi
            }
            for req in \
              CONFIG_KPROBES CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_KPM CONFIG_BBG \
              CONFIG_LTO CONFIG_LTO_CLANG CONFIG_LTO_CLANG_FULL \
              CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_CRYPTO_LZ4 \
              CONFIG_TCP_CONG_BBR CONFIG_WIREGUARD CONFIG_NET_SCH_CAKE CONFIG_NET_SCH_FQ_CODEL \
              CONFIG_RMNET CONFIG_RMNET_IPA3 CONFIG_RMNET_MAP CONFIG_QRTR \
              CONFIG_MSM_QMI_INTERFACE CONFIG_QCOM_QMI_HELPERS \
              CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_WLAN \
              CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_EVENTS \
              CONFIG_NETFILTER CONFIG_NETFILTER_ADVANCED CONFIG_NF_CONNTRACK CONFIG_NF_NAT \
              CONFIG_IP_SET CONFIG_IP6_NF_NAT \
              CONFIG_NFNETLINK CONFIG_NAMESPACES CONFIG_NET_NS CONFIG_USER_NS \
              CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS CONFIG_CGROUPS CONFIG_CGROUP_DEVICE \
              CONFIG_CGROUP_PIDS CONFIG_CGROUP_SCHED CONFIG_MEMCG CONFIG_SECCOMP CONFIG_SECCOMP_FILTER \
              CONFIG_VETH CONFIG_BRIDGE CONFIG_BRIDGE_NETFILTER; do
              require_config_if_defined "$req"
            done
            # WALT/SchedTune are mandatory project features; the source must expose them.
            require_config CONFIG_SCHED_WALT
            require_config CONFIG_SCHED_TUNE
            echo "[PASS] All explicitly requested config-backed features are enabled."

            echo
            echo "========== CORE CONFIG =========="
            grep -E '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|KALLSYMS|KALLSYMS_ALL|KPM|EXT4_FS)=' .config || true

            for req in \
              CONFIG_KSU=y CONFIG_KPROBES=y CONFIG_KPROBE_EVENTS=y \
              CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y CONFIG_KPM=y \
              CONFIG_EXT4_FS=y CONFIG_BBG=y CONFIG_OVERLAY_FS=y; do
              grep -qx "$req" .config || { echo "[FAIL] Missing required core config: $req"; exit 1; }
            done

            if grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' .config; then
              echo "[INFO] Source provides CONFIG_KSU_MANUAL_HOOK; it is not required by official v4.2.0."
            else
              echo "[PASS] No fake/unsupported CONFIG_KSU_MANUAL_HOOK requirement."

            echo
            echo "========== BASEBAND-GUARD FINAL CONFIG =========="
            grep -qx 'CONFIG_BBG=y' .config || { echo "[FAIL] CONFIG_BBG=y missing after olddefconfig."; exit 1; }
            LSM_FINAL="$(config_string CONFIG_LSM)"
            case ",$LSM_FINAL," in
              *,baseband_guard,*) echo "[PASS] CONFIG_LSM contains baseband_guard." ;;
              *) echo "[FAIL] CONFIG_LSM does not contain baseband_guard."; exit 1 ;;
            esac
            fi

            if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' .config; then
              echo "[FAIL] Tracepoint hook unexpectedly enabled."
              exit 1
            fi

            echo
            echo "========== FEATURE CAPABILITY SNAPSHOT =========="
            grep -E '^CONFIG_(BPF|BPF_SYSCALL|NETFILTER|IP_SET|RMNET|RMNET_IPA3|RMNET_MAP|QRTR|MSM_QMI_INTERFACE|QCOM_QMI_HELPERS|CFG80211|MAC80211|WLAN|WIREGUARD|TCP_CONG_BBR|NET_SCH_CAKE|NET_SCH_FQ_CODEL|NET_SCH_FQ|ZRAM|ZSMALLOC|CRYPTO_LZ4|CRYPTO_LZ4HC|CRYPTO_LZ4K|CRYPTO_LZ4KD|LTO_CLANG|LTO_CLANG_THIN|SCHED_WALT|SCHED_TUNE|NAMESPACES|CGROUPS|SECCOMP|SECCOMP_FILTER)=' .config || true

            echo
            echo "========== REQUESTED FEATURE STATUS =========="
            echo "VFS + KPM: KPM=y + VFS/OverlayFS source capability"
            echo "SukiSU-Ultra: official v4.2.0"
            echo "SUSFS: $SUSFS_VERSION @ $SUSFS_COMMIT"
            echo "Baseband-Guard: ENABLED from official v1.1 @ $BASEBAND_GUARD_COMMIT; CONFIG_BBG=y with baseband_guard in CONFIG_LSM"
            echo "BBRv1: real CONFIG_TCP_CONG_BBR where source supports it"
            echo "BBRv3: real source/backport only; no fake symbol"
            echo "LZ4K/LZ4KD: enabled only when actual source Kconfig exists"
            echo "DroidSpaces: legacy 4.19 requirements audited"
            echo "Android 16/17 QPR2/GSI: static capability validation"
            echo "[PASS] Core configuration completed."
          } > "$LOG" 2>&1
          STATUS=$?
          tail -300 "$LOG" || true
          exit "$STATUS"

      - name: 03A - Integrate Maphide / JIT-Zygote Latest Verified Patch
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/ci-logs/03A-maphide.log"
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          {
            echo "========== MAPHIDE / JIT-ZYGOTE =========="
            echo "Patch reference: $MAPHIDE_PATCH_PATH"
            echo "Repository: $MAPHIDE_PATCH_REPO"
            echo "Variant: $MAPHIDE_VARIANT"
            echo "Source commits: $MAPHIDE_SOURCE_COMMITS"
            rm -f "$RUNNER_TEMP/69_hide_stuff.patch"
            curl -fL --retry 5 --retry-all-errors \
              "$MAPHIDE_PATCH_URL" -o "$RUNNER_TEMP/69_hide_stuff.patch"
            test -s "$RUNNER_TEMP/69_hide_stuff.patch"

            # Locked feature: archived 69_hide_stuff.patch.
            # Its historical fs/proc context no longer matches the LG
            # lineage-23.2 + CIP135 + SUSFS tree, so port the exact same
            # functional changes by source structure instead of forcing a
            # stale unified diff. No new feature is introduced or removed.
            grep -q 'show_vma_header_prefix_fake' "$RUNNER_TEMP/69_hide_stuff.patch"
            grep -q 'jit-zygote-cache' "$RUNNER_TEMP/69_hide_stuff.patch"
            grep -q 'framework-res.apk' "$RUNNER_TEMP/69_hide_stuff.patch"
            grep -q 'fs/proc/task_mmu.c' "$RUNNER_TEMP/69_hide_stuff.patch"
            grep -q 'fs/proc/base.c' "$RUNNER_TEMP/69_hide_stuff.patch"

            python3 - <<'PY'
          from pathlib import Path
          import re

          task = Path("fs/proc/task_mmu.c")
          base = Path("fs/proc/base.c")
          t = task.read_text()
          b = base.read_text()

          TASK_MARKER = "/* LG Maphide 69_hide_stuff: exact feature port */"
          BASE_MARKER = "/* LG Maphide 69_hide_stuff: map_files lineage alias */"

          if TASK_MARKER not in t:
              helper = """/* LG Maphide 69_hide_stuff: exact feature port */
          static void show_vma_header_prefix_fake(struct seq_file *m,
          					unsigned long start, unsigned long end,
          					vm_flags_t flags, unsigned long long pgoff,
          					dev_t dev, unsigned long ino)
          {
          	seq_setwidth(m, 25 + sizeof(void *) * 6 - 1);
          	seq_printf(m, "%08lx-%08lx %c%c%c%c %08llx %02x:%02x %lu ",
          			start,
          			end,
          			flags & VM_READ ? 'r' : '-',
          			flags & VM_WRITE ? 'w' : '-',
          			flags & VM_EXEC ? '-' : '-',
          			flags & VM_MAYSHARE ? 's' : 'p',
          			pgoff,
          			MAJOR(dev), MINOR(dev), ino);
          }

          """
              m = re.search(r'(?m)^static void\nshow_map_vma\s*\(', t)
              if not m:
                  m = re.search(r'(?m)^static void\s+show_map_vma\s*\(', t)
              if not m:
                  raise SystemExit("[FAIL] Could not locate show_map_vma()")
              t = t[:m.start()] + helper + t[m.start():]

              fn = re.search(r'(?ms)^static void\s+show_map_vma\s*\(.*?\n\}\n(?=\s*static int\s+show_map\s*\()', t)
              if not fn:
                  raise SystemExit("[FAIL] Could not locate complete show_map_vma() body")
              body = fn.group(0)

              if "struct dentry *dentry;" not in body:
                  anchor = "\tconst char *name = NULL;\n"
                  if anchor not in body:
                      raise SystemExit("[FAIL] show_map_vma declaration anchor changed")
                  body = body.replace(anchor, anchor + "\tstruct dentry *dentry;\n", 1)

              if "LG Maphide 69_hide_stuff: dentry routing" not in body:
                  routing = """		/* LG Maphide 69_hide_stuff: dentry routing */
          		dentry = file->f_path.dentry;
          		if (dentry) {
          			const char *path = (const char *)dentry->d_name.name;
          			if (strstr(path, "lineage")) {
          				start = vma->vm_start;
          				end = vma->vm_end;
          				show_vma_header_prefix(m, start, end, flags, pgoff, dev, ino);
          				name = "/system/framework/framework-res.apk";
          				goto done;
          			}
          			if (strstr(path, "jit-zygote-cache")) {
          				start = vma->vm_start;
          				end = vma->vm_end;
          				show_vma_header_prefix_fake(m, start, end, flags, pgoff, dev, ino);
          				goto bypass;
          			}
          		}
          """
                  anchor = "\t\tpgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;\n"
                  if anchor in body:
                      body = body.replace(anchor, anchor + routing, 1)
                  else:
                      mm = re.search(r'(?m)^\s*pgoff\s*=\s*\(\(loff_t\)vma->vm_pgoff\)\s*<<\s*PAGE_SHIFT;\s*$', body)
                      if not mm:
                          raise SystemExit("[FAIL] Could not locate pgoff assignment")
                      body = body[:mm.end()] + "\n" + routing + body[mm.end():]

              if "LG Maphide 69_hide_stuff: bypass label" not in body:
                  label = "\t/* LG Maphide 69_hide_stuff: bypass label */\n\tbypass:\n"
                  cm = re.search(r'(?m)^\t/\*\n\t \* Print the dentry name for named mappings, and a\n', body)
                  if not cm:
                      raise SystemExit("[FAIL] Could not locate named-mapping comment")
                  body = body[:cm.start()] + label + body[cm.start():]

              t = t[:fn.start()] + body + t[fn.end():]

          if BASE_MARKER not in b:
              fn = re.search(r'(?ms)^static int map_files_get_link\s*\(struct dentry \*dentry, struct path \*path\)\n\{.*?\n\}\n', b)
              if not fn:
                  raise SystemExit("[FAIL] Could not locate map_files_get_link()")
              body = fn.group(0)
              if 'strstr(vma->vm_file->f_path.dentry->d_name.name, "lineage")' not in body:
                  old = """\tif (vma && vma->vm_file) {
          \t\t*path = vma->vm_file->f_path;
          \t\tpath_get(path);
          \t\trc = 0;
          \t}
          """
                  new = """\t/* LG Maphide 69_hide_stuff: map_files lineage alias */
          \tif (vma) {
          \t\tif (vma->vm_file) {
          \t\t\tif (strstr(vma->vm_file->f_path.dentry->d_name.name, "lineage")) {
          \t\t\t\trc = kern_path("/system/framework/framework-res.apk", LOOKUP_FOLLOW, path);
          \t\t\t} else {
          \t\t\t\t*path = vma->vm_file->f_path;
          \t\t\t\tpath_get(path);
          \t\t\t\trc = 0;
          \t\t\t}
          \t\t}
          \t}
          """
                  if old in body:
                      body = body.replace(old, new, 1)
                  else:
                      mm = re.search(r'(?ms)\tif \(vma && vma->vm_file\) \{\s*\*path = vma->vm_file->f_path;\s*path_get\(path\);\s*rc = 0;\s*\}', body)
                      if not mm:
                          raise SystemExit("[FAIL] map_files_get_link() body changed")
                      body = body[:mm.start()] + new.rstrip() + "\n" + body[mm.end():]
              b = b[:fn.start()] + body + b[fn.end():]

          task.write_text(t)
          base.write_text(b)
          print("[PASS] Exact Maphide/JIT-Zygote feature port completed.")
          PY

            grep -q 'LG Maphide 69_hide_stuff: exact feature port' fs/proc/task_mmu.c
            grep -q 'show_vma_header_prefix_fake' fs/proc/task_mmu.c
            grep -q 'LG Maphide 69_hide_stuff: dentry routing' fs/proc/task_mmu.c
            grep -q 'strstr(path, "lineage")' fs/proc/task_mmu.c
            grep -q 'strstr(path, "jit-zygote-cache")' fs/proc/task_mmu.c
            grep -q 'framework-res.apk' fs/proc/task_mmu.c
            grep -q 'LG Maphide 69_hide_stuff: map_files lineage alias' fs/proc/base.c
            grep -q 'kern_path("/system/framework/framework-res.apk"' fs/proc/base.c

            echo "[PASS] Maphide/JIT-Zygote exact feature port applied to LG 4.19 source structure."
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: 11 - Core Integration Verification
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/11-core-integration-verification.log"
          : > "$LOG"
          {
            echo "========== KERNELSU / SUKISU SOURCE CHECK =========="
            test -d KernelSU
            test -f KernelSU/kernel/Kconfig
            test -f KernelSU/kernel/Makefile
            echo "SukiSU HEAD: $(git -C KernelSU rev-parse HEAD)"
            echo "SukiSU describe: $(git -C KernelSU describe --tags --always 2>/dev/null || true)"
            echo
            echo "========== NO UNAUTHORIZED EXTERNAL ROOT-HIDING KERNEL PATCHSET =========="
            # SUSFS is an explicitly required, official kernel component in this
            # workflow. Its own susfs.h references are therefore NOT evidence of
            # an external/duplicate root-hiding patchset.
            #
            # This audit only rejects legacy external KernelSU/root-hiding files
            # that are not part of the pinned SukiSU-Ultra + SUSFS integration.
            # include/linux/sus_su.h is intentionally allowed: it is an official
            # SUSFS kernel header required by the pinned non-GKI 4.19 integration.
            external_hits=()
            for f in \
              kernel/sucompat.c kernel/sucompat.h \
              kernel/throne_tracker.c kernel/throne_tracker.h; do
              if [ -e "$f" ]; then
                external_hits+=("$f")
              fi
            done
            if [ "${#external_hits[@]}" -gt 0 ]; then
              printf '%s\n' "${external_hits[@]}"
              echo "[FAIL] Unauthorized legacy external root-hiding files detected."
              exit 1
            fi
            echo "[PASS] No unauthorized legacy external root-hiding kernel patchset detected."
            echo
            echo "Git diff summary:"
            git diff --stat || true
          } > "$LOG" 2>&1
          STATUS=$?
          tail -180 "$LOG" || true
          exit "$STATUS"

      - name: 10A - KPM Compatibility Preflight (v4.2.0 Kbuild)
        shell: bash
        run: |
          set -euo pipefail
          LOG="$DIAG_DIR/10A-kpm-preflight.log"
          : > "$LOG"
          {
            echo "========== SUKISU v4.2.0 KPM PREFLIGHT =========="
            test -d KernelSU/kernel/kpm
            test -f KernelSU/kernel/Kbuild
            echo "[PASS] KPM source tree present."
            echo "[INFO] v4.2.0 KPM has no standalone kpm/Makefile; its objects are declared by kernel/Kbuild."
            grep -nE '^obj-\$\(CONFIG_KPM\).*kpm/(compact|kpm|super_access)\.o' KernelSU/kernel/Kbuild

            export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
            export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

            # Prepare the 4.19 ARM64 generated headers before compiling the
            # integrated SukiSU/KPM subtree. The failing build was missing the
            # generated UAPI wrapper arch/arm64/include/generated/uapi/asm/types.h.
            # This is a build-tree preparation step only; it does not change
            # kernel features or source integration.
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              olddefconfig
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              -B modules_prepare
            test -f arch/arm64/include/generated/uapi/asm/types.h
            echo "[PASS] ARM64 generated UAPI headers prepared (asm/types.h present)."
            grep -qx 'CONFIG_KPM=y' include/config/auto.conf
            echo "[PASS] Generated auto.conf retains CONFIG_KPM=y."

            # SukiSU v4.2.0 seccomp_cache.c consumes the generic seccomp
            # architecture-count macros SECCOMP_ARCH_NATIVE_NR and, when
            # CONFIG_COMPAT is enabled, SECCOMP_ARCH_COMPAT_NR. The upstream
            # Linux 4.19 arm64 header has the seccomp include and compat syscall
            # aliases, but does not yet define these architecture-count macros.
            # Later arm64 kernels define them as NR_syscalls and
            # __NR_compat_syscalls respectively. Backport only these guarded
            # definitions into the target arm64 header so the API exposed to
            # SukiSU matches the native 4.19 syscall tables without changing
            # syscall numbers or seccomp behavior.
            ARM64_SECCOMP_H="arch/arm64/include/asm/seccomp.h"
            test -f "$ARM64_SECCOMP_H"
            if ! grep -q 'LG ARM64 4.19 seccomp NR compatibility' "$ARM64_SECCOMP_H"; then
              python3 - "$ARM64_SECCOMP_H" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()
          marker = "/* LG ARM64 4.19 seccomp NR compatibility */"
          if marker in s:
              raise SystemExit(0)
          needle = "#include <asm-generic/seccomp.h>\n"
          if s.count(needle) != 1:
              raise SystemExit("[FAIL] Expected exactly one asm-generic/seccomp.h include in arm64 seccomp.h.")
          block = """#include <asm-generic/seccomp.h>

          /* LG ARM64 4.19 seccomp NR compatibility */
          #ifndef SECCOMP_ARCH_NATIVE_NR
          #define SECCOMP_ARCH_NATIVE_NR NR_syscalls
          #endif
          #ifdef CONFIG_COMPAT
          #ifndef SECCOMP_ARCH_COMPAT
          #define SECCOMP_ARCH_COMPAT AUDIT_ARCH_ARM
          #endif
          #ifndef SECCOMP_ARCH_COMPAT_NR
          #define SECCOMP_ARCH_COMPAT_NR __NR_compat_syscalls
          #endif
          #ifndef SECCOMP_ARCH_COMPAT_NAME
          #define SECCOMP_ARCH_COMPAT_NAME "arm"
          #endif
          #endif
          """
          p.write_text(s.replace(needle, block, 1))
          PY
              echo "[PASS] Added only the guarded 4.19 ARM64 seccomp NR compatibility definitions."
            else
              echo "[PASS] ARM64 4.19 seccomp NR compatibility definitions already present."
            fi
            grep -nE 'LG ARM64 4\.19 seccomp NR compatibility|SECCOMP_ARCH_(NATIVE_NR|COMPAT_NR)' "$ARM64_SECCOMP_H"

            # SukiSU-Ultra v4.2.0 KPM uses the post-5.0 access_ok(addr, size)
            # API, while LG's 4.19 arm64 kernel intentionally exposes the
            # legacy access_ok(type, addr, size) API. This is the exact compiler
            # failure from the previous run.
            #
            # Apply a narrow compatibility shim to official v4.2.0 kpm.c only.
            # No KPM logic or feature is changed. 4.19 receives the required
            # VERIFY_READ/VERIFY_WRITE argument; >=5.0 keeps the native form.
            KPM_C="drivers/kernelsu/kpm/kpm.c"
            test -f "$KPM_C"
            if ! grep -q 'LG KPM 4.19 access_ok compatibility' "$KPM_C"; then
              sed -i '/^#include "compact.h"$/a\
          /* LG KPM 4.19 access_ok compatibility */\
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)\
          #define KPM_ACCESS_OK_READ(addr, size) access_ok(VERIFY_READ, (void __user *)(addr), (size))\
          #define KPM_ACCESS_OK_WRITE(addr, size) access_ok(VERIFY_WRITE, (void __user *)(addr), (size))\
          #else\
          #define KPM_ACCESS_OK_READ(addr, size) access_ok((addr), (size))\
          #define KPM_ACCESS_OK_WRITE(addr, size) access_ok((addr), (size))\
          #endif' "$KPM_C"
              sed -i \
                -e 's/access_ok(arg1, 255)/KPM_ACCESS_OK_READ(arg1, 255)/g' \
                -e 's/access_ok(arg2, 255)/KPM_ACCESS_OK_READ(arg2, 255)/g' \
                -e 's/access_ok(arg1, sizeof(kernel_name_buffer))/KPM_ACCESS_OK_READ(arg1, sizeof(kernel_name_buffer))/g' \
                -e 's/access_ok(arg2, size)/KPM_ACCESS_OK_WRITE(arg2, size)/g' \
                -e 's/access_ok(arg2, len)/KPM_ACCESS_OK_READ(arg2, len)/g' \
                -e 's/access_ok(arg1, sizeof(kpm_name))/KPM_ACCESS_OK_READ(arg1, sizeof(kpm_name))/g' \
                -e 's/access_ok(arg2, sizeof(kpm_args))/KPM_ACCESS_OK_READ(arg2, sizeof(kpm_args))/g' \
                -e 's/access_ok(cmd.control_code, sizeof(int))/KPM_ACCESS_OK_READ(cmd.control_code, sizeof(int))/g' \
                -e 's/access_ok(cmd.result_code, sizeof(int))/KPM_ACCESS_OK_WRITE(cmd.result_code, sizeof(int))/g' \
                "$KPM_C"
              echo "[PASS] Applied only the 4.19 access_ok API compatibility shim to official SukiSU v4.2.0 KPM."
            else
              echo "[PASS] SukiSU v4.2.0 KPM 4.19 access_ok compatibility shim already present."
            fi

            grep -nE 'LG KPM 4\.19 access_ok compatibility|KPM_ACCESS_OK_(READ|WRITE)' "$KPM_C"

            # SukiSU-Ultra v4.2.0 also carries MODULE_IMPORT_NS() metadata for
            # newer kernels. Linux 4.19 predates the MODULE_IMPORT_NS macro, so
            # the call itself must be conditionally compiled out on this target.
            # Use macro-presence detection instead of a guessed kernel-version
            # threshold: newer kernels retain the original namespace import,
            # while this 4.19 tree simply skips metadata that does not exist.
            KSU_INIT_C="drivers/kernelsu/core/init.c"
            test -f "$KSU_INIT_C"
            if ! grep -q 'LG KSU 4.19 MODULE_IMPORT_NS compatibility' "$KSU_INIT_C"; then
              python3 - "$KSU_INIT_C" <<'PY'
          from pathlib import Path
          import sys
          
          p = Path(sys.argv[1])
          s = p.read_text()
          needle = "MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);"
          marker = "/* LG KSU 4.19 MODULE_IMPORT_NS compatibility */"
          if marker in s:
              raise SystemExit(0)
          if s.count(needle) != 1:
              raise SystemExit("[FAIL] Expected exactly one SukiSU MODULE_IMPORT_NS call in core/init.c.")
          replacement = """/* LG KSU 4.19 MODULE_IMPORT_NS compatibility */
          #if defined(MODULE_IMPORT_NS)
          MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);
          #endif"""
          p.write_text(s.replace(needle, replacement, 1))
          PY
              echo "[PASS] Applied only the 4.19 MODULE_IMPORT_NS compatibility guard to SukiSU core/init.c."
            else
              echo "[PASS] SukiSU 4.19 MODULE_IMPORT_NS compatibility guard already present."
            fi
            grep -nE 'LG KSU 4\.19 MODULE_IMPORT_NS compatibility|MODULE_IMPORT_NS\(' "$KSU_INIT_C"

            # SukiSU-Ultra v4.2.0 file_wrapper.c tracks newer VFS file_operations.
            # This LG 4.19 tree does not expose iopoll and uses the pre-4.20
            # clone_file_range/dedupe_file_range callbacks instead of remap_file_range.
            # Linux 4.19 upstream confirms those are the native callbacks for that ABI.
            # Apply a narrow, version-scoped compatibility port to file_wrapper.c only.
            # No KernelSU policy/root logic is changed.
            KSU_FILE_WRAPPER_C="drivers/kernelsu/infra/file_wrapper.c"
            test -f "$KSU_FILE_WRAPPER_C"
            if ! grep -q 'LG KSU 4.19 file_wrapper VFS compatibility' "$KSU_FILE_WRAPPER_C"; then
              python3 - "$KSU_FILE_WRAPPER_C" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()
          marker = "/* LG KSU 4.19 file_wrapper VFS compatibility */"
          if marker in s:
              raise SystemExit(0)

          import re

          # Do not depend on comments/URLs or whitespace from the upstream file.
          # Match the actual function/operation structure only, so harmless upstream
          # comment changes cannot make the compatibility transform abort.
          iopoll_pattern = re.compile(
              r"#if\s+LINUX_VERSION_CODE\s+>=\s+KERNEL_VERSION\(6,\s*1,\s*0\).*?"
              r"#endif\s+\n#if\s+LINUX_VERSION_CODE\s+<\s+KERNEL_VERSION\(6,\s*6,\s*0\)",
              re.S,
          )
          iopoll_match = iopoll_pattern.search(s)
          if not iopoll_match:
              raise SystemExit("[FAIL] SukiSU iopoll wrapper structure was not found.")
          old_iopoll_block = iopoll_match.group(0)
          new_iopoll_block = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)
          static int ksu_wrapper_iopoll(struct kiocb *kiocb, struct io_comp_batch *icb, unsigned int v)
          {
              struct ksu_file_wrapper *data = kiocb->ki_filp->private_data;
              struct file *orig = data->orig;
              kiocb->ki_filp = orig;
              return orig->f_op->iopoll(kiocb, icb, v);
          }
          #else
          static int ksu_wrapper_iopoll(struct kiocb *kiocb, bool spin)
          {
              struct ksu_file_wrapper *data = kiocb->ki_filp->private_data;
              struct file *orig = data->orig;
              kiocb->ki_filp = orig;
              return orig->f_op->iopoll(kiocb, spin);
          }
          #endif
          #endif
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)"""
          s = s[:iopoll_match.start()] + new_iopoll_block + s[iopoll_match.end():]

          # The remap wrapper is located by its function signature rather than its
          # upstream comments. Linux 4.19 has clone_file_range/dedupe_file_range,
          # while remap_file_range is available from 4.20 onward.
          remap_pattern = re.compile(
              r"static\s+loff_t\s+ksu_wrapper_remap_file_range\s*\(.*?"
              r"^}\s*\n(?=static\s+int\s+ksu_wrapper_fadvise)",
              re.S | re.M,
          )
          remap_match = remap_pattern.search(s)
          if not remap_match:
              raise SystemExit("[FAIL] SukiSU remap_file_range wrapper structure was not found.")
          new_remap_block = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 20, 0)
          static loff_t ksu_wrapper_remap_file_range(struct file *file_in, loff_t pos_in, struct file *file_out, loff_t pos_out,
                                                     loff_t len, unsigned int remap_flags)
          {
              if (remap_flags & REMAP_FILE_DEDUP) {
                  struct ksu_file_wrapper *data = file_out->private_data;
                  struct file *orig = data->orig;
                  return orig->f_op->remap_file_range(file_in, pos_in, orig, pos_out, len, remap_flags);
              } else {
                  struct ksu_file_wrapper *data = file_in->private_data;
                  struct file *orig = data->orig;
                  return orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out, len, remap_flags);
              }
          }
          #else
          static int ksu_wrapper_clone_file_range(struct file *file_in, loff_t pos_in, struct file *file_out, loff_t pos_out, u64 len)
          {
              struct ksu_file_wrapper *data = file_in->private_data;
              struct file *orig = data->orig;
              return orig->f_op->clone_file_range(orig, pos_in, file_out, pos_out, len);
          }
          static int ksu_wrapper_dedupe_file_range(struct file *file_in, loff_t pos_in, struct file *file_out, loff_t pos_out, u64 len)
          {
              struct ksu_file_wrapper *data = file_out->private_data;
              struct file *orig = data->orig;
              return orig->f_op->dedupe_file_range(file_in, pos_in, orig, pos_out, len);
          }
          #endif
          """
          s = s[:remap_match.start()] + new_remap_block + s[remap_match.end():]

          old_assign = "    p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;\n"
          new_assign = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)
              p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;
          #endif
          """
          if old_assign not in s:
              raise SystemExit("[FAIL] Expected iopoll assignment was not found.")
          s = s.replace(old_assign, new_assign, 1)

          assign_pattern = re.compile(
              r"    p->ops\.copy_file_range\s*=.*?\n"
              r"    p->ops\.remap_file_range\s*=.*?\n"
              r"    p->ops\.fadvise\s*=.*?;\n",
              re.S,
          )
          assign_match = assign_pattern.search(s)
          if not assign_match:
              raise SystemExit("[FAIL] Expected VFS operation assignments were not found.")
          new_assign2 = """    p->ops.copy_file_range = fp->f_op->copy_file_range ? ksu_wrapper_copy_file_range : NULL;
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 20, 0)
              p->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;
          #else
              p->ops.clone_file_range = fp->f_op->clone_file_range ? ksu_wrapper_clone_file_range : NULL;
              p->ops.dedupe_file_range = fp->f_op->dedupe_file_range ? ksu_wrapper_dedupe_file_range : NULL;
          #endif
              p->ops.fadvise = fp->f_op->fadvise ? ksu_wrapper_fadvise : NULL;
          """
          s = s[:assign_match.start()] + new_assign2 + s[assign_match.end():]

          include = "#include <linux/mount.h>\n\n"
          if include not in s:
              raise SystemExit("[FAIL] Expected linux/mount.h include was not found.")
          s = s.replace(include, include + marker + "\n\n", 1)
          p.write_text(s)
          PY
              echo "[PASS] Applied only the Linux 4.19 file_wrapper VFS compatibility port to SukiSU v4.2.0."
            else
              echo "[PASS] SukiSU 4.19 file_wrapper VFS compatibility port already present."
            fi
            grep -nE 'LG KSU 4\.19 file_wrapper VFS compatibility|KSU_FILE_WRAPPER_LEGACY_VFS|clone_file_range|dedupe_file_range|remap_file_range|iopoll' "$KSU_FILE_WRAPPER_C"

            # SukiSU-Ultra v4.2.0 su_mount_ns.c uses the UAPI include spelling
            # <uapi/linux/mount.h>. The LG 4.19 tree used for this vendor kernel
            # does not expose that header at the include path used by an integrated
            # M=drivers/kernelsu build, although the required legacy mount flags
            # are part of the 4.19 UAPI. Keep the SukiSU source logic unchanged and
            # make only this include/flag boundary compatible with the target 4.19
            # tree. No mount namespace behavior is changed.
            KSU_MOUNT_NS_C="drivers/kernelsu/infra/su_mount_ns.c"
            test -f "$KSU_MOUNT_NS_C"
            if ! grep -q 'LG KSU 4.19 mount UAPI compatibility' "$KSU_MOUNT_NS_C"; then
              python3 - "$KSU_MOUNT_NS_C" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()
          marker = "/* LG KSU 4.19 mount UAPI compatibility */"
          if marker in s:
              raise SystemExit(0)
          needle = "#include <uapi/linux/mount.h>\n"
          if s.count(needle) != 1:
              raise SystemExit("[FAIL] Expected exactly one SukiSU uapi/linux/mount.h include in su_mount_ns.c.")
          block = """#include <linux/mount.h>

          /* LG KSU 4.19 mount UAPI compatibility */
          #ifndef MS_REC
          #define MS_REC 16384
          #endif
          #ifndef MS_PRIVATE
          #define MS_PRIVATE (1 << 18)
          #endif
          """
          p.write_text(s.replace(needle, block, 1))
          PY
              echo "[PASS] Applied only the Linux 4.19 mount UAPI compatibility to SukiSU su_mount_ns.c."
            else
              echo "[PASS] SukiSU 4.19 mount UAPI compatibility already present."
            fi
            grep -nE 'LG KSU 4\.19 mount UAPI compatibility|MS_(REC|PRIVATE)|linux/mount.h' "$KSU_MOUNT_NS_C"

            # SukiSU-Ultra v4.2.0 pkg_observer.c uses fsnotify_ops.handle_inode_event,
            # which was introduced in Linux 5.9. LG 4.19 exposes only handle_event
            # with the legacy callback signature. Port only this callback boundary for
            # kernels older than 5.9; keep the SukiSU package-observer behavior and
            # all newer-kernel code unchanged.
            KSU_PKG_OBSERVER_C="drivers/kernelsu/manager/pkg_observer.c"
            test -f "$KSU_PKG_OBSERVER_C"
            if ! grep -q 'LG KSU 4.19 pkg_observer fsnotify compatibility' "$KSU_PKG_OBSERVER_C"; then
              python3 - "$KSU_PKG_OBSERVER_C" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()
          marker = "/* LG KSU 4.19 pkg_observer fsnotify compatibility */"
          if marker in s:
              raise SystemExit(0)

          old = """static const struct fsnotify_ops ksu_ops = {
              .handle_inode_event = ksu_handle_inode_event,
          };
          """
          new = """#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)
          /* LG KSU 4.19 pkg_observer fsnotify compatibility */
          static int ksu_handle_event(struct fsnotify_group *group, struct inode *inode,
                                      u32 mask, const void *data, int data_type,
                                      const unsigned char *file_name, u32 cookie,
                                      struct fsnotify_iter_info *iter_info)
          {
              if (!file_name)
                  return 0;
              if (mask & FS_ISDIR)
                  return 0;
              if (memcmp(file_name, "packages.list", 13) || file_name[13] != '\\0')
                  return 0;
              pr_info("packages.list detected: %d\\n", mask);
              track_throne(false);
              return 0;
          }
          static const struct fsnotify_ops ksu_ops = {
              .handle_event = ksu_handle_event,
          };
          #else
          static const struct fsnotify_ops ksu_ops = {
              .handle_inode_event = ksu_handle_inode_event,
          };
          #endif
          """
          if s.count(old) != 1:
              raise SystemExit("[FAIL] Expected exactly one SukiSU v4.2.0 pkg_observer fsnotify ops block.")
          p.write_text(s.replace(old, new, 1))
          PY
              echo "[PASS] Applied only the Linux 4.19 fsnotify callback compatibility to SukiSU pkg_observer.c."
            else
              echo "[PASS] SukiSU 4.19 pkg_observer fsnotify compatibility already present."
            fi
            grep -nE 'LG KSU 4\.19 pkg_observer fsnotify compatibility|handle_event|handle_inode_event' "$KSU_PKG_OBSERVER_C"

            # The integrated KernelSU sources include security/selinux/include/objsec.h,
            # which includes the generated SELinux flask.h header. In this LG 4.19 tree
            # there is no top-level make rule exposing security/selinux/flask.h, so the
            # previous preparation command failed with "No rule to make target".
            #
            # The official 4.19 SELinux build rule generates both headers by invoking
            # scripts/selinux/genheaders/genheaders. Prepare/build that exact host
            # generator if needed, then invoke it directly with the same two output
            # paths. This is build-tree preparation only; no source or kernel feature
            # is modified.
            echo "========== SELINUX GENERATED HEADER PREPARATION =========="
            if [ ! -x scripts/selinux/genheaders/genheaders ]; then
              make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                CROSS_COMPILE="$CROSS_COMPILE" \
                CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
                scripts/selinux/genheaders/genheaders
            fi
            test -x scripts/selinux/genheaders/genheaders
            rm -f security/selinux/flask.h security/selinux/av_permissions.h
            scripts/selinux/genheaders/genheaders \
              security/selinux/flask.h \
              security/selinux/av_permissions.h
            test -s security/selinux/flask.h
            test -s security/selinux/av_permissions.h
            echo "[PASS] Official SELinux genheaders generated flask.h and av_permissions.h."

            # Compile the actual integrated drivers/kernelsu subtree. This is the
            # correct v4.2.0 Kbuild path and includes the KPM objects.
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              M=drivers/kernelsu V=1

            echo "[PASS] SukiSU v4.2.0 + KPM subtree preflight compiled."
          } > "$LOG" 2>&1
          cat "$LOG"

