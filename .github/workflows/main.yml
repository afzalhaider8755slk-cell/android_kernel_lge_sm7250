      - name: Setup 16 - Hard No-Autofix Audit
        shell: bash
        run: |
          SETUP_NO="16"
          SETUP_NAME="Setup 16 - Hard No-Autofix Audit"
          SETUP_LOG="$DIAG_DIR/16-setup-16-hard-no-autofix-audit-LIVE.log"
