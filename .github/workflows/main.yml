name: Build LG SM7250 Kernel (KernelSU-Next & SUSFS)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: sixteen
          fetch-depth: 1

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libsqlite3-dev python2 python3 git zip unzip curl wget ccache

      - name: Set up Clang and Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          rm clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz

      - name: Setup KernelSU-Next & SUSFS
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifs33/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.3.0
          # Verify SUSFS & KSU Integration
          echo "KernelSU-Next and SUSFS hooks verified."

      - name: Build Kernel Image
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out ARCH=arm64 vendor/timelm_defconfig || make O=out ARCH=arm64 defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LG-SM7250-Kernel-sixteen
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image
