name: LG G900 Global - Stable Kernel + DTB + DTBO + AnyKernel3

on:
  workflow_dispatch:
    inputs:
      build_dtbo:
        description: "Build device DTBO overlays"
        required: true
        default: true
        type: boolean
      package_anykernel:
        description: "Package kernel with AnyKernel3"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: lg-g900-stable-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
  KERNEL_BRANCH: sixteen
  CIP_TAG: v4.19.325-cip135
  CIP_MODE: release-label-safe-audit
  COMMON_TREE: https://github.com/afzalhaider8755slk-cell/android_device_lge_sm7250-common.git
  DEVICE_TREE: https://github.com/afzalhaider8755slk-cell/android_device_lge_caymanlm.git
  VENDOR_TREE: https://github.com/afzalhaider8755slk-cell/proprietary_vendor_lge_caymanlm.git

  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/lineageos_cayman_defconfig

  # Official SukiSU release checked 2026-08-30.
  SUKISU_VERSION: 4.1.3

  # SukiSU's built-in/non-GKI integration path.
  # KPROBES remains enabled where the source supports it; no KPM is forced.
  SUKISU_BRANCH: susfs-main

  SUSFS_MODULE_REPO: https://github.com/sidex15/susfs4ksu-module.git
  SUSFS_MODULE_REF: v1.5.2+_R27

  ANYKERNEL3_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL3_REF: master

jobs:
  kernel:
    name: Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 00 - Create diagnostic trap
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics"
          exec > >(tee -a "$GITHUB_WORKSPACE/ci-diagnostics/00-runner.log") 2>&1
          echo "runner=$(uname -a)"
          echo "date=$(date -u +%FT%TZ)"

      - name: 01 - Checkout source trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/src"

          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$GITHUB_WORKSPACE/src/kernel"
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$COMMON_TREE" "$GITHUB_WORKSPACE/src/device/lge/sm7250-common"
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$DEVICE_TREE" "$GITHUB_WORKSPACE/src/device/lge/caymanlm"
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$VENDOR_TREE" "$GITHUB_WORKSPACE/src/vendor/lge/caymanlm"

          cd "$GITHUB_WORKSPACE/src/kernel"
          git rev-parse HEAD
          git describe --always --dirty || true

      - name: 01b - CIP135 compatibility audit (no unsafe vendor-tree merge)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/kernel"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/cip"

          git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git 2>/dev/null || true
          git fetch --depth=1 cip "refs/tags/$CIP_TAG"

          echo "CIP tag=$CIP_TAG" | tee "$GITHUB_WORKSPACE/artifacts/cip/cip135-info.txt"
          echo "CIP commit=$(git rev-parse FETCH_HEAD)" | tee -a "$GITHUB_WORKSPACE/artifacts/cip/cip135-info.txt"
          echo "Vendor kernel base=$(git rev-parse HEAD)" | tee -a "$GITHUB_WORKSPACE/artifacts/cip/cip135-info.txt"

          # The LG tree is a vendor-modified 4.19.325 tree. Do not blindly merge
          # the complete CIP tree: that can replace LG Qualcomm/DT/vendor code.
          # Produce the upstream delta for review and keep the stable vendor tree.
          git diff --stat FETCH_HEAD..HEAD > "$GITHUB_WORKSPACE/artifacts/cip/vendor-vs-cip135.stat" || true

          # Use the CIP135 release label without pretending that the complete
          # upstream CIP patchset was merged into the LG vendor kernel.
          echo "mode=$CIP_MODE" >> "$GITHUB_WORKSPACE/artifacts/cip/cip135-info.txt"

      - name: 02 - Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache clang curl flex \
            libelf-dev libssl-dev lld llvm make python3 rsync \
            unzip wget xz-utils device-tree-compiler

      - name: 03 - Install exact Android Clang
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse \
            --branch ndk-r29 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$GITHUB_WORKSPACE/toolchains/clang"

          cd "$GITHUB_WORKSPACE/toolchains/clang"
          git sparse-checkout set clang-r563880c

          test -x clang-r563880c/bin/clang
          test -x clang-r563880c/bin/ld.lld

          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c" >> "$GITHUB_ENV"
          echo "PATH=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c/bin:$PATH" >> "$GITHUB_ENV"

      - name: 04 - Verify toolchain BEFORE Kconfig
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CLANG_DIR/bin:$PATH"

          clang --version
          ld.lld --version
          printf 'int main(void){return 0;}\n' | clang --target=aarch64-linux-android21 -x c - -c -o /tmp/a.o
          clang --target=aarch64-linux-android21 -c -x assembler /dev/null -o /tmp/a.o
          echo "Android clang integrated assembler: PASS"

      - name: 05 - Validate device target and DSDS baseline
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src"

          grep -q 'TARGET_KERNEL_CONFIG := vendor/lineageos_cayman_defconfig' device/lge/caymanlm/BoardConfig.mk
          grep -q 'BOARD_BOOTIMG_HEADER_VERSION := 2' device/lge/caymanlm/BoardConfig.mk
          grep -q 'BOARD_DTB_OFFSET' device/lge/caymanlm/BoardConfig.mk
          grep -q 'BOARD_INCLUDE_DTB_IN_BOOTIMG := true' device/lge/caymanlm/BoardConfig.mk

          grep -q 'persist.vendor.radio.multisim.config=dsds' device/lge/sm7250-common/vendor.prop
          grep -q 'ro.vendor.lge.sim_num=2' device/lge/sm7250-common/vendor.prop
          grep -q 'ro.vendor.lge.dsds=2' device/lge/sm7250-common/vendor.prop

          echo "Caymanlm + dual-SIM baseline validation: PASS"

      - name: 06 - Apply only safe kernel-source hygiene
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/kernel"

          # Never regenerate the config with a host assembler.
          # The config step below supplies the complete LLVM environment.

          # Do not merge a foreign DT tree, foreign defconfig, or random regional DTB.
          # Do not force SELinux permissive, AVB-off, KPM, overclocking, or experimental
          # scheduler changes into the kernel.

          # Remove old standalone KernelSU tree if the source contains one.
          rm -rf KernelSU drivers/kernelsu 2>/dev/null || true

      - name: 07 - Integrate SukiSU-Ultra (non-GKI/builtin path)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/kernel"

          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "$SUKISU_BRANCH"

          test -d drivers/kernelsu
          echo "SukiSU integration: PASS"

      - name: 08 - Configure LLVM + KPROBES + SukiSU + SUSFS
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/kernel"

          export PATH="$CLANG_DIR/bin:$PATH"

          mkdir -p "$GITHUB_WORKSPACE/out"

          # IMPORTANT:
          # The previous failed workflow ran defconfig without the LLVM environment.
          # This invocation supplies CC/HOSTCC/LD/HOSTLD/LLVM before Kconfig.
          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" \
            HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" \
            HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" \
            NM="$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$CLANG_DIR/bin/llvm-objcopy" \
            OBJDUMP="$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$CLANG_DIR/bin/llvm-strip" \
            vendor/lineageos_cayman_defconfig

          test -s "$GITHUB_WORKSPACE/out/.config"

          scripts/config --file "$GITHUB_WORKSPACE/out/.config" \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL
          # Keep the requested CIP135 release suffix while preserving the
          # vendor-modified LG 4.19.325 source tree.
          scripts/config --file "$GITHUB_WORKSPACE/out/.config"             --set-str CONFIG_LOCALVERSION "-cip135"

          # SukiSU builtin path controls the actual hook mechanism for this non-GKI tree.
          # Do not force KPM.
          scripts/config --file "$GITHUB_WORKSPACE/out/.config" \
            --disable CONFIG_KPM || true

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" HOSTLD="$CLANG_DIR/bin/ld.lld" \
            olddefconfig

          grep -q '^CONFIG_KPROBES=y$' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_KALLSYMS=y$' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_KALLSYMS_ALL=y$' "$GITHUB_WORKSPACE/out/.config"

      - name: 09 - SUSFS kernel capability check
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/kernel"

          # SukiSU's susfs branches are preferred for kernel integration.
          # If the chosen non-GKI branch does not provide SUSFS Kconfig symbols,
          # fail with a precise diagnostic instead of creating a partially integrated root kernel.
          if grep -Rqs 'config KSU_SUSFS' drivers include fs; then
            echo "SUSFS kernel Kconfig symbols detected"
          else
            echo "ERROR: SUSFS kernel integration is missing"
            exit 1
          fi

      - name: 10 - Configure SUSFS conservatively
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/kernel"

          cfg="$GITHUB_WORKSPACE/out/.config"

          # Enable only features that exist in this tree. Do not blindly enable
          # struct-dependent SUS_PATH features; previous 4.19 trees can lack
          # required fields and that can break compilation.
          for s in \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            CONFIG_KSU_SUSFS_TRY_UMOUNT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG
          do
            if scripts/config --file "$cfg" --enable "$s" 2>/dev/null; then
              :
            fi
          done

          # SUS_PATH is intentionally not forced. It is enabled only when the
          # exact source contains the required user_struct compatibility.
          if grep -Rqs 'android_kabi_reserved1' include fs kernel drivers; then
            scripts/config --file "$cfg" --enable CONFIG_KSU_SUSFS_SUS_PATH || true
          else
            scripts/config --file "$cfg" --disable CONFIG_KSU_SUSFS_SUS_PATH || true
          fi

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" HOSTLD="$CLANG_DIR/bin/ld.lld" \
            olddefconfig

      - name: 11 - Validate network, IMS/IWLAN and traffic-accounting baseline
        shell: bash
        run: |
          set -euo pipefail
          cfg="$GITHUB_WORKSPACE/out/.config"
          report="$GITHUB_WORKSPACE/artifacts/network-connectivity-report.txt"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          required=(
            CONFIG_NETFILTER
            CONFIG_NETFILTER_XTABLES
            CONFIG_NETFILTER_XT_MARK
            CONFIG_NETFILTER_XT_CONNMARK
            CONFIG_NETFILTER_XT_MATCH_OWNER
            CONFIG_CFG80211
            CONFIG_UID_SYS_STATS
            CONFIG_RMNET
            CONFIG_IPA3
            CONFIG_RMNET_IPA3
            CONFIG_QCOM_QMI_HELPERS
            CONFIG_QCOM_QMI_RMNET
            CONFIG_BPF
            CONFIG_BPF_SYSCALL
          )

          : > "$report"
          for c in "${required[@]}"; do
            if grep -q "^${c}=y$" "$cfg"; then
              echo "$c=y" >> "$report"
            else
              echo "MISSING $c" >> "$report"
              exit 1
            fi
          done

          echo "Dual-SIM/IMS are vendor/modem dependent; kernel does not fake carrier data." >> "$report"
          echo "Network baseline: PASS" >> "$report"

      - name: 12 - Build kernel Image and modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/kernel"

          export PATH="$CLANG_DIR/bin:$PATH"

          make -Oline \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 SUBARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" HOSTLD="$CLANG_DIR/bin/ld.lld" \
            AR="$CLANG_DIR/bin/llvm-ar" NM="$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$CLANG_DIR/bin/llvm-objcopy" OBJDUMP="$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$CLANG_DIR/bin/llvm-strip" \
            -j"$(nproc)" Image modules

          test -s "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

      - name: 13 - Build DTB separately
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/kernel"

          export PATH="$CLANG_DIR/bin:$PATH"

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 SUBARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" HOSTLD="$CLANG_DIR/bin/ld.lld" \
            dtbs

          mkdir -p "$GITHUB_WORKSPACE/artifacts/dtb"
          find "$GITHUB_WORKSPACE/out/arch/arm64/boot/dts" -type f -name '*.dtb' \
            -exec cp --parents {} "$GITHUB_WORKSPACE/artifacts/dtb/" \;

          test -n "$(find "$GITHUB_WORKSPACE/artifacts/dtb" -type f -name '*.dtb' -print -quit)"

      - name: 14 - Build only Cayman device DTBOs
        if: ${{ inputs.build_dtbo }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/kernel"

          export PATH="$CLANG_DIR/bin:$PATH"

          # The previous workflow called generic `dtbs`, which reached a CN
          # overlay that is not the global Cayman target and failed dtbo_verify.
          # Build the device overlay directory explicitly and do not force CN/VZW
          # overlays into a global image.
          target_dir="arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com"

          test -d "$target_dir"

          mkdir -p "$GITHUB_WORKSPACE/artifacts/dtbo"

          # The previous failure was specifically the CN board-id overlay:
          # lito-caymanlm_cn-rev-1.0_overlay.dtbo.
          #
          # Global/standard Cayman uses the non-CN board-id 0x000C0008 overlay.
          # Build ONLY that exact overlay instead of running the directory-wide
          # dtbs target, which also compiles incompatible regional overlays.
          overlay="arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo"
          test -f "${overlay%.dtbo}.dts"

          make -Oline \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 SUBARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" HOSTLD="$CLANG_DIR/bin/ld.lld" \
            "$overlay" 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/14-dtbo-target.log"

          produced="$GITHUB_WORKSPACE/out/$overlay"
          test -s "$produced"
          cp "$produced" "$GITHUB_WORKSPACE/artifacts/dtbo/"

          echo "Selected DTBO: $overlay"
          echo "Selected overlay has board-id 0x000C0008 (non-CN)."

      - name: 15 - DTBO structural verification
        if: ${{ inputs.build_dtbo }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for f in "$GITHUB_WORKSPACE"/artifacts/dtbo/*.dtbo; do
            [ -f "$f" ] || continue
            size=$(stat -c '%s' "$f")
            [ "$size" -gt 0 ]
            echo "$(basename "$f") size=$size" >> "$GITHUB_WORKSPACE/artifacts/dtbo-verification.txt"
          done

          test -s "$GITHUB_WORKSPACE/artifacts/dtbo-verification.txt"

      - name: 16 - Package AnyKernel3
        if: ${{ inputs.package_anykernel }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/AnyKernel3"
          git clone --depth=1 --branch "$ANYKERNEL3_REF" "$ANYKERNEL3_REPO" "$GITHUB_WORKSPACE/AnyKernel3"

          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/AnyKernel3/Image"

          # Include the separately built DTB when available. AnyKernel3 supports
          # a separate dtb alongside the kernel image.
          dtb="$(find "$GITHUB_WORKSPACE/artifacts/dtb" -type f -name '*.dtb' | head -n1 || true)"
          if [ -n "$dtb" ]; then
            cp "$dtb" "$GITHUB_WORKSPACE/AnyKernel3/dtb"
          fi

          cat > "$GITHUB_WORKSPACE/AnyKernel3/anykernel.sh" <<'AK3'
          properties() { '
          kernel.string=LG G900 Global - SukiSU Ultra + SUSFS
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=caymanlm
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AK3

          rm -rf "$GITHUB_WORKSPACE/AnyKernel3/.git" \
                 "$GITHUB_WORKSPACE/AnyKernel3/.github"

          mkdir -p "$GITHUB_WORKSPACE/artifacts/anykernel3"
          cd "$GITHUB_WORKSPACE/AnyKernel3"

          zip -r9 "$GITHUB_WORKSPACE/artifacts/anykernel3/LG-G900-Global-SukiSU-SUSFS-AnyKernel3.zip" . \
            -x '*.git*' '*.github*'

          unzip -t "$GITHUB_WORKSPACE/artifacts/anykernel3/LG-G900-Global-SukiSU-SUSFS-AnyKernel3.zip"

      - name: 17 - Package SUSFS userspace module
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/susfs-module"
          git clone --depth=1 --branch "$SUSFS_MODULE_REF" \
            "$SUSFS_MODULE_REPO" "$GITHUB_WORKSPACE/susfs-module"

          mkdir -p "$GITHUB_WORKSPACE/artifacts/susfs"
          cd "$GITHUB_WORKSPACE/susfs-module"

          zip -r9 \
            "$GITHUB_WORKSPACE/artifacts/susfs/susfs4ksu-userspace-R27.zip" . \
            -x '*.git*'

      - name: 18 - Final config and reproducibility report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$GITHUB_WORKSPACE/out/.config" "$GITHUB_WORKSPACE/artifacts/final.config"

          {
            echo "kernel_repo=$KERNEL_REPO"
            echo "kernel_branch=$KERNEL_BRANCH"
            echo "kernel_commit=$(git -C "$GITHUB_WORKSPACE/src/kernel" rev-parse HEAD)"
            echo "defconfig=$DEFCONFIG"
            echo "sukisu_version=$SUKISU_VERSION"
            echo "sukisu_branch=$SUKISU_BRANCH"
            echo "susfs_module_ref=$SUSFS_MODULE_REF"
            echo "arch=$ARCH"
            echo "target=caymanlm / LG G900 family"
            echo "android_gsi_target=Android 16 QPR2 / API 36.1 compatibility checks"
            echo "anykernel3=enabled"
          } > "$GITHUB_WORKSPACE/artifacts/build-info.txt"

          sha256sum \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            > "$GITHUB_WORKSPACE/artifacts/Image.sha256"

      - name: 19 - Upload kernel artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-Kernel
          path: |
            artifacts/final.config
            artifacts/build-info.txt
            artifacts/Image.sha256
            artifacts/network-connectivity-report.txt
            out/arch/arm64/boot/Image

      - name: 20 - Upload kernel diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-Kernel-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn

  dtb:
    name: DTB
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 01 - Checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          git clone --depth=1 --branch sixteen "$KERNEL_REPO" src/kernel

      - name: 02 - Dependencies and toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential clang flex libelf-dev libssl-dev lld llvm make device-tree-compiler
          git clone --depth=1 --filter=blob:none --sparse --branch ndk-r29 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchains/clang
          cd toolchains/clang
          git sparse-checkout set clang-r563880c
          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c" >> "$GITHUB_ENV"

      - name: 03 - Configure
        shell: bash
        run: |
          set -euo pipefail
          cd src/kernel
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$CLANG_DIR/bin/clang" --version
          make O="$GITHUB_WORKSPACE/out" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" HOSTLD="$CLANG_DIR/bin/ld.lld" \
            vendor/lineageos_cayman_defconfig

      - name: 04 - Build DTB only
        shell: bash
        run: |
          set -euo pipefail
          cd src/kernel
          mkdir -p ci-diagnostics artifacts/dtb
          make O="$GITHUB_WORKSPACE/out" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" HOSTLD="$CLANG_DIR/bin/ld.lld" \
            dtbs 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtb-build.log"
          find "$GITHUB_WORKSPACE/out/arch/arm64/boot/dts" -type f -name '*.dtb' \
            -exec cp --parents {} "$GITHUB_WORKSPACE/artifacts/dtb/" \;
          test -n "$(find "$GITHUB_WORKSPACE/artifacts/dtb" -type f -name '*.dtb' -print -quit)"

      - name: 05 - Upload DTB
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTB
          path: artifacts/dtb/**

      - name: 06 - Upload DTB errors ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTB-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn

  dtbo:
    name: DTBO
    if: ${{ inputs.build_dtbo }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 01 - Checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          git clone --depth=1 --branch sixteen "$KERNEL_REPO" src/kernel

      - name: 02 - Dependencies and toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential clang flex libelf-dev libssl-dev lld llvm make device-tree-compiler
          git clone --depth=1 --filter=blob:none --sparse --branch ndk-r29 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchains/clang
          cd toolchains/clang
          git sparse-checkout set clang-r563880c
          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang/clang-r563880c" >> "$GITHUB_ENV"

      - name: 03 - Configure
        shell: bash
        run: |
          set -euo pipefail
          cd src/kernel
          mkdir -p "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/ci-diagnostics"
          make O="$GITHUB_WORKSPACE/out" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" HOSTLD="$CLANG_DIR/bin/ld.lld" \
            vendor/lineageos_cayman_defconfig

      - name: 04 - Validate DTBO target files before compiling
        shell: bash
        run: |
          set -euo pipefail
          cd src/kernel
          target="arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com"

          test -d "$target"
          find "$target" -maxdepth 1 -type f -name '*overlay.dts' -print | sort \
            | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtbo-target-files.txt"

          # Global/standard Cayman target is the non-CN HW Rev 1.0 overlay.
          # CN uses a different board-id and was the overlay that failed in v4.
          selected="$target/lito-caymanlm_lao_com-rev-1.0_overlay.dts"
          test -f "$selected"
          echo "selected=$selected" >> "$GITHUB_WORKSPACE/ci-diagnostics/dtbo-target-files.txt"
          grep -n 'qcom,board-id' "$selected" | tee -a "$GITHUB_WORKSPACE/ci-diagnostics/dtbo-target-files.txt"
          grep -q 'qcom,board-id = <0x000C0008 0>;' "$selected"

      - name: 05 - Build DTBO target with complete diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd src/kernel
          mkdir -p "$GITHUB_WORKSPACE/artifacts/dtbo"

          overlay="arch/arm64/boot/dts/vendor/lge/lito-caymanlm/lito-caymanlm_lao_com/lito-caymanlm_lao_com-rev-1.0_overlay.dtbo"

          set +e
          make -Oline O="$GITHUB_WORKSPACE/out" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_DIR/bin/clang" HOSTCC="$CLANG_DIR/bin/clang" \
            LD="$CLANG_DIR/bin/ld.lld" HOSTLD="$CLANG_DIR/bin/ld.lld" \
            "$overlay" 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/dtbo-build.log"
          rc=${PIPESTATUS[0]}
          set -e

          produced="$GITHUB_WORKSPACE/out/$overlay"
          if [ "$rc" -ne 0 ] || [ ! -s "$produced" ]; then
            echo "DTBO build failed: rc=$rc overlay=$overlay" | tee "$GITHUB_WORKSPACE/ci-diagnostics/error.log"
            exit "${rc:-1}"
          fi

          cp "$produced" "$GITHUB_WORKSPACE/artifacts/dtbo/"
          sha256sum "$produced" > "$GITHUB_WORKSPACE/ci-diagnostics/dtbo.sha256"

      - name: 06 - Upload DTBO
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTBO
          path: artifacts/dtbo/**

      - name: 07 - Upload DTBO errors ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-DTBO-Diagnostics
          path: |
            ci-diagnostics/**
            artifacts/**
          if-no-files-found: warn
