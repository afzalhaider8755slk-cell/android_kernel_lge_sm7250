name: LG G900 Global - CIP135 + SukiSU-Ultra + SUSFS + KPROBES + A16 QPR2

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Exact working LG kernel branch
        required: true
        default: sixteen
        type: string
      source_commit:
        description: Known-good source commit from the supplied bundle
        required: true
        default: 6f4cab15a4e8f5e3400e95d17517fd8b24b37b49
        type: string

permissions:
  contents: read

concurrency:
  group: lg-g900-cip135-sukisu-a16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 210

    env:
      KERNEL_REPO: https://github.com/afzalhaider8755slk-cell/android_kernel_lge_sm7250.git
      CIP_REPO: https://gitlab.com/cip-project/cip-kernel/linux-cip.git
      CIP_TAG: v4.19.325-cip135
      CIP_COMMIT_PREFIX: ba164392
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      DEFCONFIG: vendor/caymanlm_defconfig
      ARCH: arm64
      OUT_DIR: ${{ github.workspace }}/out
      DIAG_DIR: ${{ github.workspace }}/ci-diagnostics
      CLANG_REVISION: clang-r563880c
      CLANG_PREBUILT_TAG: ndk-r29
      GCC64_BRANCH: lineage-19.1
      GCC32_BRANCH: lineage-19.1
      G900_GLOBAL_TARGET: LG-G900-GLOBAL
      ANDROID_GSI_TARGET: Android-16-QPR2
      ANDROID_GSI_API: 36.1
      BASELINE_SHA256: 8b931841bcfcfad0b8ed596fbc156e67a6da8f32f226753ffabc89c907accffa

    steps:
      - name: 01 - Checkout exact working LG source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/01-checkout.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "01 - Checkout exact working LG source FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          git clone --depth=1 --branch "$SOURCE_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf 'source_branch=%s\nsource_commit=%s\ndefconfig=%s\n' "$SOURCE_BRANCH" "$SOURCE_COMMIT" "$DEFCONFIG" > "$DIAG_DIR/source.txt"

      - name: 02 - Install dependencies and legacy GCC wrapper support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          exec > >(tee "$DIAG_DIR/02-dependencies.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "02 - Install dependencies FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex git libelf-dev libssl-dev \
            lld llvm python3 python-is-python3 rsync unzip wget xz-utils
          test -x /usr/bin/python
          /usr/bin/python --version

      - name: 03 - Download exact Android Clang r563880c and GCC 4.9 wrappers
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/03-toolchain.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "03 - Toolchain FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          rm -rf clang-prebuilt gcc64 gcc32
          git clone --depth=1 --filter=blob:none --sparse --branch "$CLANG_PREBUILT_TAG" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilt
          cd clang-prebuilt
          git sparse-checkout set "$CLANG_REVISION"
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 --branch "$GCC64_BRANCH" \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 --branch "$GCC32_BRANCH" \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          test -x "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang"
          test -x "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc"
          test -x "$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc"
          "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc" --version | head -n 1
          "$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc" --version | head -n 1
          "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang" --version | head -n 2
          "$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin/clang" --version | grep -q '21\.0\.0'
          echo "CLANG_DIR=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION" >> "$GITHUB_ENV"
          echo "GCC64_DIR=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"
          echo "PATH=$GITHUB_WORKSPACE/clang-prebuilt/$CLANG_REVISION/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH" >> "$GITHUB_ENV"

      - name: 04 - Load exact supplied baseline config (fixes the previous failure)
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/04-baseline-config.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "04 - Baseline config FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          mkdir -p "$OUT_DIR"
          BASELINE="$GITHUB_WORKSPACE/.github/kernel-baseline/working.config"
          test -s "$BASELINE"
          sha256sum "$BASELINE" | tee "$DIAG_DIR/reference-config.sha256"
          test "$(sha256sum "$BASELINE" | awk '{print $1}')" = "$BASELINE_SHA256"
          cp "$BASELINE" "$OUT_DIR/.config"
          # Do not run vendor/caymanlm_defconfig here. The supplied baseline is
          # the known-good config and avoids the exact assembler/Kconfig failure
          # shown in the user's failed run.
          make O="$OUT_DIR" ARCH=arm64 olddefconfig
          cp "$OUT_DIR/.config" "$DIAG_DIR/baseline.config"
          sha256sum "$OUT_DIR/.config" | tee "$DIAG_DIR/baseline-after-olddefconfig.sha256"
          test -s "$OUT_DIR/.config"

      - name: 05 - Verify CIP135 tag and vendor-tree relationship
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/05-cip-check.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "05 - CIP135 check FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          git remote add cip "$CIP_REPO" || true
          git fetch --no-tags --depth=1 cip "refs/tags/$CIP_TAG:refs/tags/$CIP_TAG"
          case "$(git rev-parse "refs/tags/$CIP_TAG")" in "${CIP_COMMIT_PREFIX}"*) ;; *) echo "Unexpected CIP tag commit"; exit 1;; esac
          git show -s --format='%H %s' "refs/tags/$CIP_TAG" | tee "$DIAG_DIR/cip-tag.txt"
          BASE="$(git merge-base HEAD "refs/tags/$CIP_TAG" || true)"
          if [ -z "$BASE" ]; then
            echo 'STOP: vendor tree and CIP135 have no common history.'
            exit 1
          fi
          printf 'merge_base=%s\n' "$BASE" | tee "$DIAG_DIR/cip-relationship.txt"

      - name: 06 - Apply CIP135 only when ancestry is safe
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/06-cip-apply.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "06 - CIP135 apply FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          if git merge-base --is-ancestor HEAD "refs/tags/$CIP_TAG"; then
            git merge --no-edit --no-ff "refs/tags/$CIP_TAG" || { git merge --abort || true; exit 1; }
          elif git merge-base --is-ancestor "refs/tags/$CIP_TAG" HEAD; then
            echo 'Vendor tree is already ahead of CIP135; no CIP merge performed.'
          else
            echo 'Vendor tree is related to CIP135 but diverged; refusing a blind vendor-tree merge.'
            echo 'A compatible CIP135 backport set must be applied explicitly for this vendor tree.'
            exit 1
          fi
          make -s O="$OUT_DIR" kernelversion || true
          git status --short > "$DIAG_DIR/post-cip-status.txt"

      - name: 07 - Remove legacy KernelSU
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/07-kernelsu-remove.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "07 - KernelSU removal FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          sed -i '/^[[:space:]]*source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig 2>/dev/null || true
          sed -i '/^[[:space:]]*obj-[^#]*+= kernelsu\//d' drivers/Makefile 2>/dev/null || true
          test ! -e KernelSU
          test ! -e drivers/kernelsu

      - name: 08 - Integrate SukiSU-Ultra SUSFS non-GKI path
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/08-sukisu-susfs.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "08 - SukiSU integration FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          curl -LSs 'https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh' | bash -s susfs-main
          test -d drivers/kernelsu
          grep -Rsn -E 'SukiSU|susfs' drivers/kernelsu 2>/dev/null | head -80 || true

      - name: 09 - Configure KPROBES + SukiSU + SUSFS + GSI/network support
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/09-kconfig.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "09 - Kconfig FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export HOSTCC="$CLANG_DIR/bin/clang"
          export HOSTCXX="$CLANG_DIR/bin/clang++"
          export CC="$CLANG_DIR/bin/clang"
          export LD="$CLANG_DIR/bin/ld.lld"
          scripts/config --file "$OUT_DIR/.config" \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_KSU \
            --disable CONFIG_KSU_MANUAL_HOOK \
            --disable CONFIG_KSU_TRACEPOINT_HOOK \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            --enable CONFIG_KSU_SUSFS_TRY_UMOUNT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --disable CONFIG_KSU_SUSFS_SUS_PATH \
            --disable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --disable CONFIG_KSU_SUSFS_SUS_SU
          # Android 16 QPR2 / GSI transport and accounting support. These are
          # mostly already present in the known-good LG config; only enable
          # symbols that exist in this tree.
          for sym in \
            CONFIG_ANDROID_BINDER_IPC \
            CONFIG_ANDROID_BINDERFS \
            CONFIG_ASHMEM \
            CONFIG_OVERLAY_FS \
            CONFIG_DM_VERITY \
            CONFIG_DM_VERITY_FEC \
            CONFIG_FS_ENCRYPTION \
            CONFIG_CGROUPS \
            CONFIG_NAMESPACES \
            CONFIG_BPF \
            CONFIG_BPF_SYSCALL \
            CONFIG_CGROUP_BPF \
            CONFIG_BPF_EVENTS \
            CONFIG_BPF_JIT \
            CONFIG_UID_SYS_STATS \
            CONFIG_NETFILTER_XT_MATCH_OWNER \
            CONFIG_NETFILTER_XT_MATCH_BPF \
            CONFIG_NETFILTER_XT_TARGET_MARK \
            CONFIG_RMNET \
            CONFIG_RMNET_IPA3 \
            CONFIG_IPA3 \
            CONFIG_QCOM_QMI_HELPERS \
            CONFIG_QCOM_QMI_RMNET \
            CONFIG_WLAN \
            CONFIG_CFG80211; do
            if grep -q "^config ${sym#CONFIG_}\\|^menuconfig ${sym#CONFIG_}" Kconfig 2>/dev/null || grep -Rqs "^config ${sym#CONFIG_}\\|^menuconfig ${sym#CONFIG_}" --include='Kconfig*' .; then
              scripts/config --file "$OUT_DIR/.config" --enable "$sym" || true
            fi
          done
          make O="$OUT_DIR" ARCH=arm64 olddefconfig
          grep -q '^CONFIG_KPROBES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KALLSYMS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KALLSYMS_ALL=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"

      - name: 10 - Verify hooks, Android 16 QPR2 baseline and network features
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/10-feature-validation.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "10 - Feature validation FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          CONFIG="$OUT_DIR/.config"
          grep -q '^CONFIG_KPROBES=y$' "$CONFIG"
          ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$CONFIG"
          if grep -Rsn -E 'ksu_handle_execveat|ksu_handle_faccessat|ksu_handle_vfs_read|ksu_handle_stat' fs/exec.c fs/open.c fs/read_write.c fs/stat.c 2>/dev/null; then
            echo 'Legacy manual KernelSU hooks detected.'
            exit 1
          fi
          required=(
            CONFIG_ANDROID_BINDER_IPC CONFIG_ANDROID_BINDERFS CONFIG_ASHMEM
            CONFIG_OVERLAY_FS CONFIG_DM_VERITY CONFIG_FS_ENCRYPTION
            CONFIG_CGROUPS CONFIG_NAMESPACES CONFIG_BPF CONFIG_BPF_SYSCALL
            CONFIG_CGROUP_BPF CONFIG_UID_SYS_STATS CONFIG_NETFILTER_XT_MATCH_OWNER
            CONFIG_NETFILTER_XT_MATCH_BPF CONFIG_RMNET CONFIG_RMNET_IPA3
            CONFIG_IPA3 CONFIG_QCOM_QMI_HELPERS CONFIG_QCOM_QMI_RMNET CONFIG_WLAN
          )
          for sym in "${required[@]}"; do grep -q "^${sym}=y$" "$CONFIG" || { echo "Missing $sym"; exit 1; }; done
          {
            echo "GSI_TARGET=$ANDROID_GSI_TARGET"
            echo "GSI_API=$ANDROID_GSI_API"
            echo 'GSI note: kernel validation covers Treble/binder/filesystem/network primitives; actual GSI compatibility also depends on vendor HAL/VINTF/modem userspace.'
            echo 'IMS note: VoLTE/Wi-Fi Calling are not kernel-only features; the workflow preserves RMNET/IPA/QMI/WLAN paths and records the required kernel support.'
            echo 'Traffic monitor: BPF + cgroup + UID stats + netfilter owner/BPF accounting paths are enabled/validated.'
          } | tee "$DIAG_DIR/android16-network-ims.txt"

      - name: 11 - Global G900 target validation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/11-global-target.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "11 - Global target validation FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          {
            echo "target=$G900_GLOBAL_TARGET"
            echo 'Hardware family=caymanlm/SM7250 from supplied working tree.'
            echo 'LM-G900N is not a requested target.'
            echo 'No fabricated global DTB is substituted.'
            grep -Rsn -E 'LM-G900N|G900N|LM-G900EMW|G900EMW' arch/arm64/configs arch/arm64/boot/dts 2>/dev/null | head -100 || true
          } | tee "$DIAG_DIR/global-target.txt"

      - name: 12 - Preserve required modem/IMS/Wi-Fi paths
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/12-ims-wifi.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "12 - IMS/Wi-Fi validation FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          CONFIG="$OUT_DIR/.config"
          for sym in CONFIG_RMNET CONFIG_RMNET_IPA3 CONFIG_IPA3 CONFIG_QCOM_QMI_HELPERS CONFIG_QCOM_QMI_RMNET CONFIG_WLAN CONFIG_CFG80211; do
            grep -q "^${sym}=y$" "$CONFIG" || { echo "Required transport symbol missing: $sym"; exit 1; }
          done
          echo 'VoLTE/Wi-Fi Calling kernel transport prerequisites preserved.'
          echo 'Actual IMS registration, carrier provisioning, APN/IMS config and modem firmware remain vendor/userspace responsibilities.'

      - name: 13 - Final config drift and version report
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/13-config-report.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "13 - Config report FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          cp "$OUT_DIR/.config" "$DIAG_DIR/final.config"
          diff -u "$GITHUB_WORKSPACE/.github/kernel-baseline/working.config" "$OUT_DIR/.config" > "$DIAG_DIR/config-diff.txt" || true
          {
            echo "kernelversion=$(make -s O=\"$OUT_DIR\" kernelversion || true)"
            echo "baseline_sha256=$BASELINE_SHA256"
            echo "final_sha256=$(sha256sum \"$OUT_DIR/.config\" | awk '{print $1}')"
            echo "cip_tag=$CIP_TAG"
            echo "cip_commit=$(git rev-parse refs/tags/$CIP_TAG)"
          } | tee "$DIAG_DIR/build-metadata.txt"

      - name: 14 - Build ARM64 Image and modules
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/14-build.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "14 - ARM64 build FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          cd kernel
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export CC="$CLANG_DIR/bin/clang"
          export LD="$CLANG_DIR/bin/ld.lld"
          export HOSTCC="$CLANG_DIR/bin/clang"
          export HOSTCXX="$CLANG_DIR/bin/clang++"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -Oline O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CC" LD="$LD" HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
            CLANG_TRIPLE="$CLANG_TRIPLE" -j"$(nproc)" Image modules 2>&1
          test -s "$OUT_DIR/arch/arm64/boot/Image"
          file "$OUT_DIR/arch/arm64/boot/Image" | tee "$DIAG_DIR/Image-file.txt"
          sha256sum "$OUT_DIR/arch/arm64/boot/Image" | tee "$DIAG_DIR/Image.sha256"

      - name: 15 - Package Image + supplied DTB/DTBO/header
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$DIAG_DIR/15-package.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "15 - Packaging FAILED rc=$rc" >> "$DIAG_DIR/error.log"; fi' EXIT
          mkdir -p release
          cp kernel/out/arch/arm64/boot/Image release/Image
          cp input-assets/dtb release/dtb
          cp input-assets/dtbo.img release/dtbo.img
          cp input-assets/header release/header
          sha256sum release/* > release/SHA256SUMS
          cat > release/BUILD-INFO.txt <<EOF
          target=LG-G900-GLOBAL
          kernel_target=4.19.325-cip135
          cip_commit=$(git rev-parse refs/tags/$CIP_TAG)
          root=SukiSU-Ultra
          susfs=enabled
          hook=KPROBES
          legacy_kernelsu=removed
          android_gsi=16-QPR2
          android_gsi_api=36.1
          network_traffic_monitor=enabled
          rmnet_ipa_qmi=preserved
          volte_wifi_calling=transport_prerequisites_preserved
          LM-G900N=not_target
          EOF

      - name: 16 - Finalize diagnostics even when the build fails
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "$DIAG_DIR"
          {
            echo "job_status=${{ job.status }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "sha=${{ github.sha }}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -s "$DIAG_DIR/error.log" ]; then
              echo '--- step failures ---'
              cat "$DIAG_DIR/error.log"
            else
              echo 'No shell-step failure was recorded by the workflow trap.'
              if [ "${{ job.status }}" != "success" ]; then
                echo 'Job failed outside the shell traps; inspect the per-step *.log files and GitHub Actions annotation.'
              fi
            fi
          } > "$DIAG_DIR/error-summary.log"
          if [ "${{ job.status }}" != "success" ] && [ ! -s "$DIAG_DIR/error.log" ]; then
            printf 'job_status=%s\nSee per-step logs for the failing command.\n' '${{ job.status }}' > "$DIAG_DIR/error.log"
          fi

      - name: 17 - Upload diagnostics and artifacts (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-G900-Global-CIP135-SukiSU-SUSFS-KPROBES-A16QPR2-run-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            release/
            ci-diagnostics/
            out/.config
